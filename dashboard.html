:root {

html[data-theme="dark"] {
  --bg: #121110; --surface: #1C1A18; --surface-2: #262320; --card: #191715;

* { box-sizing: border-box; }
html, body { margin:0; padding:0; background:var(--bg); color:var(--ink); font-family:var(--font); font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased; transition:background .2s,color .2s; }
button, input, select, textarea { font-family:inherit; color:inherit; }
button { cursor:pointer; border:none; background:transparent; }
.topbar { position:sticky; top:0; z-index:40; background:var(--bg); border-bottom:1px solid var(--border); padding:10px 18px; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; max-width:100%; }
.brand { display:flex; align-items:center; gap:10px; }

.card-soft { background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:12px 14px; }

.badge.good { background:var(--good-soft); color:var(--good); }
.badge.warn { background:var(--warn-soft); color:var(--warn); }
.badge.bad { background:var(--bad-soft); color:var(--bad); }
.badge.accent { background:var(--accent-soft); color:var(--accent); }
.stack { display:flex; flex-direction:column; gap:10px; }
.row-item { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 14px; border-radius:18px; background:var(--surface); border:1px solid var(--border); flex-wrap:wrap; }
.row-main { min-width:0; flex:1; }
.row-title { font-weight:700; font-size:14px; }
.row-sub { font-size:12px; color:var(--muted); margin-top:2px; }
.pbar { height:7px; background:var(--surface-2); border-radius:99px; overflow:hidden; margin-top:6px; }
.pbar > div { height:100%; background:var(--accent); border-radius:99px; transition:width .25s; }
.pbar.good > div { background:var(--good); }
.field { display:flex; flex-direction:column; gap:5px; margin-bottom:10px; }
.field label { font-size:12px; font-weight:700; color:var(--muted); }
.field input, .field select, .field textarea { width:100%; padding:9px 12px; border-radius:14px; background:var(--surface); border:1px solid var(--border); font-size:14px; }
.grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.grid-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
@media (max-width:640px) { .grid-2, .grid-3 { grid-template-columns:1fr; } }
.btn-lg { width:100%; padding:12px 16px; border-radius:999px; font-size:14px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; gap:8px; }

.btn-lg.soft { background:var(--surface-2); color:var(--ink); }
.tbl-wrap { overflow-x:auto; }
table { width:100%; border-collapse:collapse; font-size:13.5px; }
th, td { text-align:left; padding:9px 10px; border-bottom:1px solid var(--border); vertical-align:middle; }
th { font-size:11.5px; text-transform:uppercase; letter-spacing:0.03em; color:var(--muted); font-weight:700; }
tr:last-child td { border-bottom:none; }
.modal-bg { position:fixed; inset:0; background:rgba(0,0,0,0.48); z-index:80; display:none; align-items:center; justify-content:center; padding:16px; }
.modal-bg.open { display:flex; }
.modal-card { background:var(--card); border:1px solid var(--border); border-radius:28px; max-width:480px; width:100%; padding:20px; box-shadow:0 20px 50px rgba(0,0,0,0.3); max-height:86vh; overflow-y:auto; }
.toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:999px; font-size:13.5px; font-weight:600; opacity:0; pointer-events:none; z-index:90; transition:opacity .2s,transform .2s; box-shadow:0 8px 24px rgba(0,0,0,0.22); }
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

.wrap { max-width: 1200px; margin: 0 auto; padding: 18px; }
.admin-nav { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px; }
.admin-nav button { padding:9px 16px; border-radius:999px; background:var(--surface); border:1px solid var(--border); font-size:13.5px; font-weight:600; color:var(--muted); display:inline-flex; align-items:center; gap:6px; }
.admin-nav button.active { background:var(--accent); color:var(--accent-ink); border-color:transparent; }
.kpi-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; margin-bottom:16px; }
@media (max-width:780px) { .kpi-grid { grid-template-columns:repeat(2,minmax(0,1fr)); } }
.kpi { background:var(--card); border:1px solid var(--border); border-radius:22px; padding:16px; box-shadow:var(--shadow); }
.kpi-lbl { font-size:12px; color:var(--muted); font-weight:600; }
.kpi-val { font-size:24px; font-weight:800; margin:4px 0 2px; }
.kpi-meta { font-size:12px; color:var(--muted); }
.chart-scroll { width:100%; overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:6px; }
.chart-scroll::-webkit-scrollbar { height:6px; }
.chart-scroll::-webkit-scrollbar-thumb { background:var(--border); border-radius:999px; }
.chart-wrap { position:relative; display:flex; flex-wrap:nowrap; align-items:stretch; gap:10px; height:228px; padding:12px 6px 4px; min-width:100%; width:max-content; }
.chart-plan-line { position:absolute; left:0; right:0; border-top:1.5px dashed var(--accent); opacity:0.65; pointer-events:none; z-index:2; }
.chart-plan-lbl { position:absolute; right:6px; top:-22px; font-size:11px; font-weight:700; color:var(--accent); background:var(--card); border:1px solid var(--border); padding:2px 8px; border-radius:999px; white-space:nowrap; box-shadow:0 2px 8px rgba(0,0,0,0.18); }
.bar-col { flex:1 0 64px; max-width:108px; display:flex; flex-direction:column; align-items:center; gap:6px; height:100%; position:relative; z-index:1; }
.bar-val { font-size:11px; font-weight:700; color:var(--ink); white-space:nowrap; line-height:1.15; height:15px; display:flex; align-items:center; }
.bar-track { flex:1; width:100%; display:flex; align-items:flex-end; justify-content:center; min-height:110px; }
.bar-fill { width:72%; max-width:42px; min-width:22px; border-radius:10px 10px 4px 4px; background:var(--accent); transition:height .25s ease, opacity .15s ease; }
.bar-fill.hit { background:var(--good); }
.bar-col[data-bar-idx] { cursor:pointer; } .bar-col[data-bar-idx]:hover .bar-fill { opacity:.92; transform:scaleY(1.04); transform-origin:bottom; box-shadow:0 4px 14px rgba(0,0,0,0.22); } .bar-col[data-bar-idx]:hover .bar-val { color:var(--accent); } .bar-col[data-bar-idx]:focus-visible { outline:2px solid var(--accent); outline-offset:4px; border-radius:10px; }
.drag-handle { display:inline-flex; align-items:center; justify-content:center; width:26px; height:32px; border-radius:8px; color:var(--muted); font-size:16px; line-height:1; cursor:grab; user-select:none; -webkit-user-select:none; touch-action:none; flex-shrink:0; transition:background .15s, color .15s; }
.drag-handle:hover { background:var(--surface-2); color:var(--ink); }
.drag-handle:active { cursor:grabbing; color:var(--accent); }
.is-dragging { opacity:0.45 !important; transform:scale(0.99); }
.drag-over { outline:2px dashed var(--accent) !important; outline-offset:2px; background:var(--accent-soft) !important; }
.bar-dt { font-size:11px; color:var(--muted); font-weight:600; white-space:nowrap; line-height:1.15; height:16px; display:flex; align-items:center; }
.chart-ctrl { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.chart-gran { display:inline-flex; background:var(--surface); padding:3px; border-radius:999px; border:1px solid var(--border); gap:2px; }
.chart-gran button { padding:4px 10px; border-radius:999px; font-size:11.5px; font-weight:600; color:var(--muted); }
.chart-gran button.active { background:var(--accent); color:var(--accent-ink); }

  .date-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:0 0 14px;padding:10px 12px;border-radius:16px;background:var(--surface);border:1px solid var(--border);}

  .date-pill:hover{color:var(--ink);border-color:var(--accent);}

  .date-range-lbl{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap;}

/* === Coffee Illy v93.1 Responsive System (Phones · Tablets · Desktop) === */
html { -webkit-text-size-adjust: 100%; }
body { overflow-x: clip; padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right); }
.kpi-val, .bar-val, td, .badge { font-variant-numeric: tabular-nums; }
.chip-btn, .admin-nav button, .date-pill, .btn-lg, .pin-key, .bnav button {
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  transition: background .16s ease, transform .1s ease, border-color .16s ease, box-shadow .16s ease;
}
.chip-btn:active, .btn-lg:active, .pin-key:active { transform: scale(0.98); }
.tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 14px; }
.tbl-wrap table { min-width: 520px; }

/* Owner Dashboard: Responsive Bento (Phone -> Tablet -> PC) */
.topbar {
  padding: max(10px, env(safe-area-inset-top)) 20px 10px;
}
.admin-nav::-webkit-scrollbar, .date-pills::-webkit-scrollbar { display: none; }

  .brand-title { font-size: 14.5px; line-height: 1.2; }

  .wrap { padding: 12px 12px calc(24px + env(safe-area-inset-bottom)); }

    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    gap: 6px;
    margin-bottom: 12px;

  .date-bar { padding: 10px; gap: 8px; }

  .date-custom { width: 100%; justify-content: space-between; }

  .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-bottom: 12px; }

  .card { padding: 14px; border-radius: 20px; }
  .card-title { font-size: 15px; }
  .chart-wrap { height: 205px; }
  .bar-col { flex: 1 0 54px; }
  .field input, .field select, .field textarea { font-size: 16px; min-height: 44px; }

  th, td { padding: 8px 8px; font-size: 12.5px; }

    max-width: 100%;

    padding: 18px 16px calc(22px + env(safe-area-inset-bottom));

  }
  .toast { max-width: calc(100vw - 24px); text-align: center; }
}

/* Tablets (601px - 1024px) */
@media (min-width: 601px) and (max-width: 1024px) {

/* Desktop / PC (>= 1025px) */

  th.sortable { cursor:pointer; user-select:none; white-space:nowrap; transition:color .15s ease; }

  const DAYS_RU = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
  function getWeekdayRu(isoStr) {
    const m = String(isoStr || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (!m) return DAYS_RU[new Date().getDay()];
    const dt = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]), 12, 0, 0);
    return DAYS_RU[dt.getDay()];
  }
  function getDayPlan(isoOrDay) {
    const dayKey = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].includes(isoOrDay) ? isoOrDay : getWeekdayRu(isoOrDay);
    const found = (state.plans || []).find(p => p && p.day === dayKey);
    const roster = String((found && found.roster) || '').trim();
    const isDayOff = /^выходной$/i.test(roster);
    const rawRev = found && (found.rev !== undefined ? found.rev : found.revenue);
    const rawChk = found && found.checks;
    const rawAvg = found && (found.avg !== undefined ? found.avg : found.avgCheck);
    const rev = isDayOff ? 0 : (rawRev !== undefined && rawRev !== '' ? Math.max(0, Number(rawRev) || 0) : Number(state.plan || 2200));
    const checks = isDayOff ? 0 : (rawChk !== undefined && rawChk !== '' ? Math.max(0, Number(rawChk) || 0) : Number(state.planChecks || 75));
    const avg = isDayOff ? 0 : (rawAvg !== undefined && rawAvg !== '' ? Math.max(0, Number(rawAvg) || 0) : Number(state.minAvgCheck || 35));
    return { day: dayKey, rev, checks, avg, roster, isDayOff };
  }
  function computePeriodPlan(rng, cashList) {
    const dates = [];
    if (rng && rng.from && rng.to && rng.from <= rng.to) {
      const d0 = new Date(rng.from + 'T12:00:00');
      const d1 = new Date(rng.to + 'T12:00:00');
      const maxDays = 400;
      for (let dt = new Date(d0.getTime()), n = 0; dt <= d1 && n < maxDays; dt.setDate(dt.getDate() + 1), n++) {
        const y = dt.getFullYear();
        const m = String(dt.getMonth() + 1).padStart(2, '0');
        const dd = String(dt.getDate()).padStart(2, '0');
        dates.push(y + '-' + m + '-' + dd);
      }
    } else if (Array.isArray(cashList) && cashList.length) {
      const uniq = new Set(cashList.map(c => String(c.date || '').slice(0, 10)).filter(Boolean));
      uniq.forEach(d => dates.push(d));
    } else {
      dates.push(getTodayISO());
    }
    let periodRev = 0, periodChecks = 0, avgSum = 0, workDays = 0;
    dates.forEach(d => {
      const dp = getDayPlan(d);
      if (!dp.isDayOff && dp.rev > 0) {
        periodRev += dp.rev;
        periodChecks += dp.checks;
        avgSum += dp.avg;
        workDays++;
      }
    });
    const shiftDates = new Set((cashList || []).map(c => String(c.date || '').slice(0, 10)).filter(Boolean));
    let elapsedRev = 0, elapsedChecks = 0;
    shiftDates.forEach(d => {
      const dp = getDayPlan(d);
      elapsedRev += dp.rev;
      elapsedChecks += dp.checks;
    });
    const periodAvg = workDays > 0 ? Math.round(avgSum / workDays) : getDayPlan(getTodayISO()).avg;
    return { periodRev, periodChecks, periodAvg, workDays, totalDays: dates.length, elapsedRev, elapsedChecks };
  }
  function blockTasks(nm) { return state.tasks.filter(t => t.block === nm); }
  function normBlkName(s) { return String(s || '').trim().toLowerCase().replace(/\s+/g, ' '); }
  function findDoneToday(blkName) {
    const target = normBlkName(blkName);
    if (!target) return null;
    const todayLocal = getTodayISO();
    const todaySrv = String(state.serverDate || '').slice(0, 10);
    return (state.checklists || []).find((c) => {
      if (!c) return false;
      const cd = String(c.date || '').slice(0, 10);
      if (cd !== todayLocal && (!todaySrv || cd !== todaySrv)) return false;
      return normBlkName(c.block) === target;
    }) || null;
  }
  function getBlkSt(b) {
    if (b.active === false) return { code:'off', label:'Отключён', cls:'', open:false };
    const done = !b.isCash ? findDoneToday(b.name) : null;
    if (done) {
      const meta = [done.time, done.who].filter(Boolean).join(' · ');
      return { code:'done', label: (done.isLate ? '✓ Пройден с опозд.' : '✓ Пройден') + (meta ? ' (' + meta + ')' : ''), cls: done.isLate ? 'warn' : 'good', open:false };
    }
    if (state.extensions[b.name] && state.extensions[b.name].forceOpen) return { code:'open', label:'Открыт админом до 23:59', cls:'good', open:true };
    const now = toMin(window.CoffeeCloudV93 ? window.CoffeeCloudV93.localHHMM() : '12:00');
    if (now < toMin(b.openTime)) return { code:'soon', label:'Откроется в ' + b.openTime, cls:'', open:false };
    if (now > toMin(b.deadline)) return { code:'closed', label:'Просрочен (' + b.deadline + ')', cls:'bad', open:false };
    return { code:'open', label:'Открыт до ' + b.deadline, cls:'accent', open:true };
  }

        ? (effectiveSpan > 120 && sortedCash.length > 35 ? 'month' : (effectiveSpan > 31 && sortedCash.length > 18 ? 'week' : 'day'))
        : chartGranularity;
      const monthNamesRu = ['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];
      const monthNamesRuFull = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
      function buildChartSeries(list, gran) {
        if (gran === 'day') {
          return list.map(c => {
            const revVal = cashRev(c);
            const dp = getDayPlan(c.date);
            const avgC = c.checks ? Math.round(revVal / c.checks) : 0;
            const pct = dp.rev > 0 ? Math.round((revVal / dp.rev) * 100) : 0;
            const iso = String(c.date || '').slice(0, 10);
            return {
              gran: 'day',
              from: iso,
              to: iso,
              fullTitle: dp.day + ', ' + fmtDateRu(iso),
              label: dp.day + ' ' + iso.slice(8) + '.' + iso.slice(5, 7),
              rev: revVal,
              plan: dp.rev,
              hit: revVal >= dp.rev,
              shifts: 1,
              tip: `${dp.day} ${fmtDateRu(iso)} · Выручка: ${fmtRub(revVal)} / ${fmtRub(dp.rev)} (${pct}%) · Чеки: ${c.checks}/${dp.checks} · Ср. чек: ${avgC} ₽ (нажмите для деталей)`
            };
          });
        }
        const map = new Map();
        list.forEach(c => {
          const revVal = cashRev(c);
          const dp = getDayPlan(c.date);
          const dt = new Date(c.date + 'T12:00:00');
          let key = c.date.slice(0, 7);
          let lbl = (monthNamesRu[dt.getMonth()] || '') + ' ' + String(dt.getFullYear()).slice(2);
          let fromIso = key + '-01';
          const lastD = new Date(dt.getFullYear(), dt.getMonth() + 1, 0);
          let toIso = key + '-' + String(lastD.getDate()).padStart(2, '0');
          let fullTitle = (monthNamesRuFull[dt.getMonth()] || lbl) + ' ' + dt.getFullYear();
          if (gran === 'week') {
            const dayIdx = (dt.getDay() + 6) % 7;
            const mon = new Date(dt.getTime() - dayIdx * 86400000);
            const sun = new Date(mon.getTime() + 6 * 86400000);
            key = mon.toISOString().slice(0, 10);
            fromIso = key;
            toIso = sun.toISOString().slice(0, 10);
            lbl = String(mon.getDate()).padStart(2, '0') + '.' + String(mon.getMonth() + 1).padStart(2, '0') + '–' + String(sun.getDate()).padStart(2, '0') + '.' + String(sun.getMonth() + 1).padStart(2, '0');
            fullTitle = 'Неделя ' + lbl + '.' + sun.getFullYear();
          }
          const cur = map.get(key) || { key, gran, from: fromIso, to: toIso, fullTitle, label: lbl, rev: 0, plan: 0, checks: 0, shifts: 0 };
          cur.rev += revVal;
          cur.plan += dp.rev;
          cur.checks += (Number(c.checks) || 0);
          cur.shifts += 1;
          map.set(key, cur);
        });
        return Array.from(map.values()).map(g => {
          const pct = g.plan > 0 ? Math.round((g.rev / g.plan) * 100) : 0;
          const avgC = g.checks > 0 ? Math.round(g.rev / g.checks) : 0;
          return {
            gran: g.gran,
            from: g.from,
            to: g.to,
            fullTitle: g.fullTitle,
            label: g.label,
            rev: g.rev,
            plan: g.plan,
            hit: g.rev >= g.plan,
            shifts: g.shifts,
            tip: `${g.label} (${g.shifts} смен) · Выручка: ${fmtRub(g.rev)} / План: ${fmtRub(g.plan)} (${pct}%) · Чеки: ${g.checks} · Ср. чек: ${avgC} ₽ (нажмите для деталей)`
          };
        });
      }
      const chartPts = buildChartSeries(sortedCash, effGran);
      const refPlanVal = effGran === 'day'
        ? todayPlan.rev
        : (chartPts.length ? Math.round(chartPts.reduce((a, p) => a + p.plan, 0) / chartPts.length) : todayPlan.rev);
      const maxRev = Math.max(refPlanVal, ...chartPts.map(p => p.rev), 1);
      const avgBucketRev = chartPts.length ? Math.round(chartPts.reduce((a, p) => a + p.rev, 0) / chartPts.length) : 0;
      const planTrackPct = Math.min(92, Math.max(8, Math.round((refPlanVal / maxRev) * 100)));
      const chartTitle = effGran === 'month' ? 'Динамика выручки по месяцам' : (effGran === 'week' ? 'Динамика выручки по неделям' : 'Динамика выручки по дням');
      const planRefLabel = effGran === 'day' ? `План (${todayPlan.day}): ${fmtRub(refPlanVal)}` : `Ср. план: ${fmtRub(refPlanVal)}`;
      root.innerHTML = syncBanner + `
        <div class="kpi-grid">

          <div class="kpi"><div class="kpi-lbl">Чеки и средний чек</div><div class="kpi-val" style="color:${actualAvgCheck>=targetAvgCheck?'var(--good)':'var(--accent)'}">${actualAvgCheck} ₽</div><div class="kpi-meta">Чеков: <b>${totalChecks}</b> / ${totalPlanChecks} (${checksPlanPct}%) · Мин. ср. чек (${todayPlan.day}): ${todayPlan.avg} ₽</div></div>

          <div class="kpi"><div class="kpi-lbl">Открытые поломки</div><div class="kpi-val" style="color:${openIncs?'var(--bad)':'var(--good)'}">${openIncs}</div><div class="kpi-meta">За период: ${fIncidents.length} · Задач: ${state.tasks.length}</div></div>
        </div>
        <div class="card" style="margin-bottom:16px;">
          <div class="card-head">
            <div>
              <h2 class="card-title">${chartTitle}</h2>
              <div class="card-sub">${planRefLabel} · Средняя: ${fmtRub(avgBucketRev)} · Макс.: ${fmtRub(maxRev)} · Период: ${esc(rng.label)} · Нажмите на столбик для подробной аналитики</div>
            </div>
            <div class="chart-ctrl">

                <button class="${chartGranularity==='auto'?'active':''}" data-cg="auto">Авто</button>

              </div>
            </div>
          </div>

            <div class="chart-wrap">

                const hPct = p.rev > 0 ? Math.max(8, Math.round((p.rev / maxRev) * 100)) : 4;
                return `<div class="bar-col" data-bar-idx="${idx}" role="button" tabindex="0" title="${esc(p.tip)}"><div class="bar-val">${p.rev.toLocaleString('ru-RU')} ₽</div><div class="bar-track"><div class="bar-fill ${p.hit?'hit':''}" style="height:${hPct}%;"></div></div><div class="bar-dt">${esc(p.label)}</div></div>`;

            </div>
          </div>
        </div>

          const manualRev = manualCash.reduce((a, c) => a + (Number(c.revenue) || 0), 0);
          const diff = totalRev - posRev;

          const diffStr = (diff > 0 ? '+' : '') + fmtRub(diff);

        <div class="card">

              const openBlocksCnt = Math.max(1, state.blocks.filter(b => !b.isCash && b.active !== false).length);
              const pct = Math.min(100, Math.round((doneToday / openBlocksCnt) * 100));

                <div class="row-sub">Сдано чек-листов сегодня: <b>${doneToday}/${openBlocksCnt}</b>${(state.liveProgress && state.liveProgress[s.name]) ? (' · Сейчас: «' + esc(state.liveProgress[s.name].block) + '» ' + state.liveProgress[s.name].done + '/' + state.liveProgress[s.name].total) : ''}${isOn && pr.source ? ' · Вход: ' + esc(pr.source) : ''}</div>
                <div class="pbar ${pct===100?'good':''}"><div style="width:${pct}%"></div></div>
              </div></div>`;
            }).join('')}
          </div>
        </div>`;
      const openChartBucketModal = (pt) => {
        if (!pt || !pt.from || !pt.to) return;
        const inB = (dt) => { const d = String(dt || '').slice(0, 10); return d >= pt.from && d <= pt.to; };
        const bCash = (state.cash || []).filter(c => inB(c.date)).sort((a, b) => String(b.date).localeCompare(String(a.date)));
        const bExp = (state.expenses || []).filter(e => inB(e.date));
        const bChks = (state.checklists || []).filter(c => inB(c.date));
        const bIncs = (state.incidents || []).filter(i => inB(i.date));
        const bSales = (state.salesLog || []).filter(s => inB(s.date));

        const rev = bCash.reduce((a, c) => a + cashRev(c), 0);
        const cashSum = bCash.reduce((a, c) => a + (Number(c.cash) || 0), 0);
        const cardSum = bCash.reduce((a, c) => a + (Number(c.card) || 0), 0);
        const checksSum = bCash.reduce((a, c) => a + (Number(c.checks) || 0), 0);
        const woSum = bCash.reduce((a, c) => a + (Number(c.writeoff) || 0), 0);
        const expSum = bExp.reduce((a, e) => a + (Number(e.amount) || 0), 0);
        const net = rev - expSum;
        const avgC = checksSum > 0 ? Math.round(rev / checksSum) : 0;
        const bPlanObj = computePeriodPlan({ from: pt.from, to: pt.to }, bCash);
        const planRev = bPlanObj.periodRev || pt.plan || 0;
        const planPct = planRev > 0 ? Math.round((rev / planRev) * 100) : 0;
        const cashPct = rev > 0 ? Math.round((cashSum / rev) * 100) : 0;
        const cardPct = rev > 0 ? (100 - cashPct) : 0;

        // Top items from POS salesLog for this bucket
        const prodMap = {};
        bSales.forEach(s => {
          const nm = String(s.item || s.name || 'Позиция').trim();
          const cur = prodMap[nm] || (prodMap[nm] = { name: nm, qty: 0, sum: 0 });
          cur.qty += (Number(s.qty) || 0);
          cur.sum += (Number(s.sum) || 0);
        });
        const topProds = Object.values(prodMap).sort((a, b) => b.sum - a.sum).slice(0, 8);
        const maxProdSum = topProds.length ? Math.max(topProds[0].sum, 1) : 1;

        const shiftsHtml = bCash.length ? bCash.map(c => {
          const r = cashRev(c);
          const dp = getDayPlan(c.date);
          const aC = c.checks ? Math.round(r / c.checks) : 0;
          return `<div class="card-soft" style="padding:8px 10px;font-size:12.5px;">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap;">
              <div><b>${fmtDateRu(c.date)}</b> (${dp.day}) · ${esc(c.barista || 'Бариста')}${c.secondBarista ? ` <span class="badge accent">+ ${esc(c.secondBarista)}</span>` : ''}</div>
              <div><b>${fmtRub(r)}</b> <span class="badge ${r >= dp.rev ? 'good' : 'warn'}">${dp.rev > 0 ? Math.round((r / dp.rev) * 100) + '%' : '—'}</span></div>
            </div>
            <div style="color:var(--muted);font-size:11.5px;margin-top:4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;">

              ${c.zPhotoUrl ? `<button type="button" class="badge accent" data-bmv="${esc(c.zPhotoUrl)}" data-bmvt="Z-отчёт · ${esc(c.date)}" style="border:0;cursor:pointer;">🧾 Z-отчёт</button>` : ''}
              ${(c.cashFact != null && c.cashFact !== '' && c.cashDiff != null) ? `<span class="badge ${Math.abs(Number(c.cashDiff))>=50?(Number(c.cashDiff)<0?'bad':'warn'):'good'}">Сверка: ${Number(c.cashDiff)===0?'0 ₽':((Number(c.cashDiff)>0?'+':'')+fmtRub(c.cashDiff))}</span>` : ''}
            </div>

        const topProdsHtml = topProds.length ? `

            <div class="stack" style="gap:5px;">
              ${topProds.map(p => `<div style="font-size:12px;">

                <div class="pbar" style="margin-top:3px;height:5px;"><div style="width:${Math.max(6, Math.round((p.sum / maxProdSum) * 100))}%;"></div></div>

            </div>
          </div>` : '';

        const chksHtml = bChks.length ? `
          <div style="margin-top:12px;">
            <div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px;">✅ Чек-листы (${bChks.length})</div>
            <div class="stack" style="gap:5px;max-height:150px;overflow-y:auto;">
              ${bChks.slice(0, 15).map(c => `<div class="card-soft" style="padding:6px 9px;font-size:12px;display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap;">

        const granTag = pt.gran === 'month' ? 'Месяц' : (pt.gran === 'week' ? 'Неделя' : 'День');
        openModal(`📊 Аналитика (${granTag}): ${pt.fullTitle}`, `

                ['share', '📊 Доля', 'desc'],
                ['avgPrice', '🏷 Ср. цена', 'desc'],
                ['name', '🔤 А–Я', 'asc']

                const act = stTop.key === k;

                return `<button class="date-pill ${act ? 'active' : ''}" data-sort-tbl="salesTop" data-sort-key="${k}" data-sort-def="${defD}">${lbl}${arrow}</button>`;
              }).join('')}
            </div>
          </div>
          <div class="tbl-wrap"><table><thead><tr>${sortTh('salesTop','name','Позиция','asc')}${sortTh('salesTop','kind','Категория','asc')}${sortTh('salesTop','qty','Кол-во','desc')}${sortTh('salesTop','sum','Выручка','desc')}${sortTh('salesTop','share','Доля','desc')}${sortTh('salesTop','avgPrice','Ср. цена','desc')}</tr></thead><tbody>
            ${topProducts.length ? topProducts.map(p => `<tr>
              <td><b>${esc(p.name)}</b></td>
              <td><span class="badge">${esc(p.kind)}</span></td>
              <td><b>${p.qty} шт.</b></td>
              <td><b>${fmtRub(p.sum)}</b></td>
              <td><span class="badge accent">${Math.round((p.sum / denomSum) * 100)}%</span></td>
              <td style="color:var(--muted)">${p.qty ? Math.round(p.sum / p.qty) : 0} ₽</td>
            </tr>`).join('') : `<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:18px;">Нет детальных продаж за период (${esc(rng.label)}). Загрузите CSV отчёт во вкладке «Финансы» или выберите другой период.</td></tr>`}
          </tbody></table></div>
        </div>
        <div class="card">
          <div class="card-head"><div><h2 class="card-title">Журнал продаж по дням (${filteredSales.length})</h2></div></div>
          <div class="tbl-wrap"><table><thead><tr>${sortTh('salesLog','date','Дата','desc')}${sortTh('salesLog','barista','Бариста','asc')}${sortTh('salesLog','name','Позиция','asc')}${sortTh('salesLog','kind','Категория','asc')}${sortTh('salesLog','qty','Кол-во','desc')}${sortTh('salesLog','sum','Сумма','desc')}</tr></thead><tbody>
            ${sortedSalesLog.length ? sortedSalesLog.slice(0, 120).map(s => `<tr>
              <td><b>${esc(s.date)}</b></td>
              <td>${esc(s.barista)}</td>
              <td><b>${esc(s.name)}</b></td>
              <td><span class="badge">${esc(s.kind)}</span></td>
              <td>${s.qty} шт.</td>
              <td><b>${fmtRub(s.sum)}</b></td>

      bindSortHeaders(root);
      root.querySelectorAll('[data-sc]').forEach(b => b.onclick = () => { salesCatFilter = b.dataset.sc; render(); });

      const scsv = document.getElementById('sales-csv-in');
      if (scsv) scsv.onchange = async (ev) => {
        const files = Array.from(ev.target.files || []);
        if (!files.length || !window.CoffeePosCsvV93) return;

        if (!batch.days.length) { showToast('Не удалось распознать CSV'); return; }
        openModal('Импорт выписки POS (' + batch.summary.filesCount + ' ф.)', `
          <div class="card-soft" style="margin-bottom:12px;">
            <div>Дней: <b>${batch.summary.daysCount}</b> · Выручка: <b>${fmtRub(batch.summary.totalRevenue)}</b> · Чеков: <b>${batch.summary.totalChecks}</b> · Позиций: <b>${batch.summary.totalProducts}</b></div>
          </div>
          <button class="btn-lg primary" id="sales-csv-confirm">✓ Загрузить в Google Таблицу</button>
        `);
        document.getElementById('sales-csv-confirm').onclick = () => guard('Импорт CSV продаж', async () => {
          const btn = document.getElementById('sales-csv-confirm');
          if (btn) { btn.disabled = true; btn.textContent = '⏳ Загрузка...'; }
          try {
            const api = window.CoffeeCloudV94 || window.CoffeeCloudV93;
            const res = api && api.importPosBatch ? await api.importPosBatch(batch.days, 'sum') : { ok: false };
            if (res && res.ok) {
              closeModal();
              showToast('✓ Загружено дней: ' + (res.count || batch.days.length));

            }
          } catch (err) {
            showToast('Сетевая ошибка импорта: ' + ((err && err.message) || 'повторите'));
          } finally {
            if (btn) { btn.disabled = false; btn.textContent = '✓ Загрузить в Google Таблицу'; }
          }
        });
      };
      return;

    if (tab === 'warehouse') {
      const whCats = ['all', ...Array.from(new Set(invAll.map(i => i.category || 'Сырьё')))];
      const invShown = whCatFilter === 'all' ? invAll : invAll.filter(i => (i.category || 'Сырьё') === whCatFilter);
      const restockMoves = fInvMoves.filter(m => m.type === 'restock' || m.delta > 0);
      const writeoffMoves = fInvMoves.filter(m => m.type === 'writeoff' || m.delta < 0);
      const nowMs = Date.now();
      const expiringSoon = fExpiry.filter(x => x.status !== 'disposed' && x.expiresAtMs && x.expiresAtMs <= nowMs + 86400000).length;
      root.innerHTML = `
        <div class="kpi-grid">
          <div class="kpi"><div class="kpi-lbl">Позиций на складе</div><div class="kpi-val">${invAll.length}</div><div class="kpi-meta">Актуальные остатки Google Таблицы</div></div>
          <div class="kpi"><div class="kpi-lbl">Ниже минимума</div><div class="kpi-val" style="color:${lowStockCount?'var(--bad)':'var(--good)'}">${lowStockCount}</div><div class="kpi-meta">${lowStockCount?'Требуется закупка':'Все позиции в норме'}</div></div>
          <div class="kpi"><div class="kpi-lbl">Движения за период</div><div class="kpi-val">${fInvMoves.length}</div><div class="kpi-meta">Приход: <b>${restockMoves.length}</b> · Списание: <b>${writeoffMoves.length}</b></div></div>
          <div class="kpi"><div class="kpi-lbl">Сроки годности</div><div class="kpi-val" style="color:${expiringSoon?'var(--warn)':'var(--good)'}">${fExpiry.length}</div><div class="kpi-meta">Истекают ≤24ч: <b>${expiringSoon}</b> · ${esc(rng.label)}</div></div>
        </div>
        <div class="card" style="margin-bottom:16px;">
          <div class="card-head">
            <div><h2 class="card-title">Товары и остатки на складе (${invShown.length})</h2></div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
              <button type="button" class="chip-btn ${lowStockCount?'warn':'good'}" id="wh-order-btn" title="Сформировать заявку поставщикам по позициям ниже минимума">🛒 Заявка поставщикам${lowStockCount?' ('+lowStockCount+')':''}</button>
              <button class="chip-btn accent" id="wh-add">+ Товар на склад</button>
            </div>
          </div>
          <div class="date-pills" style="margin-bottom:12px;">
            ${whCats.map(c => `<button class="date-pill ${whCatFilter===c?'active':''}" data-wc="${esc(c)}">${c==='all'?'Все категории':esc(c)}</button>`).join('')}
          </div>
          <div class="tbl-wrap"><table><thead><tr><th>Товар</th><th>Категория</th><th>Остаток</th><th>Мин. порог</th><th>Статус</th><th>Обновлено</th><th>Действия</th></tr></thead><tbody>
            ${invShown.length ? invShown.map(it => {
              const isLow = Number(it.stock || 0) <= Number(it.minStock || 0);
              return `<tr>
                <td><b>${esc(it.name)}</b></td>
                <td><span class="badge">${esc(it.category || 'Сырьё')}</span></td>
                <td><b>${it.stock} ${esc(it.unit)}</b></td>
                <td style="color:var(--muted)">${it.minStock} ${esc(it.unit)}</td>
                <td><span class="badge ${isLow?'bad':'good'}">${isLow?'⚠️ Мало':'✓ Норма'}</span></td>
                <td style="color:var(--muted)">${esc(it.updatedAt || '—')}</td>
                <td style="display:flex;gap:5px;flex-wrap:wrap;">
                  <button class="chip-btn good" data-wh-in="${esc(it.id)}" style="padding:4px 8px;">+ Приход</button>
                  <button class="chip-btn warn" data-wh-out="${esc(it.id)}" style="padding:4px 8px;">− Списать</button>
                  <button class="chip-btn" data-wh-ed="${esc(it.id)}" style="padding:4px 8px;">✏️</button>
                </td>
              </tr>`;
            }).join('') : `<tr><td colspan="7" style="text-align:center;color:var(--muted);padding:16px;">Склад пока пуст — нажмите «+ Товар на склад», чтобы добавить молоко, зерно, стаканчики и сиропы.</td></tr>`}
          </tbody></table></div>
        </div>
        <div class="grid-2" style="align-items:start;">
          <div class="card">
            <div class="card-head"><div><h2 class="card-title">Движения склада за период (${fInvMoves.length})</h2><div class="card-sub">${esc(rng.label)}</div></div></div>
            <div class="stack" style="max-height:300px;overflow-y:auto;">
              ${fInvMoves.length ? fInvMoves.map(m => `<div class="row-item"><div class="row-main">
                <div class="row-title">${esc(m.name)} <span class="badge ${m.delta>=0?'good':'bad'}">${m.delta>=0?('+'+m.delta):m.delta} ${esc(m.unit)}</span></div>
                <div class="row-sub">${esc(m.date)} ${esc(m.time)} · Остаток: <b>${m.stockAfter} ${esc(m.unit)}</b> · ${esc(m.actor)}${m.note?' · '+esc(m.note):''}</div>
              </div></div>`).join('') : `<div style="color:var(--muted);font-size:13px;padding:8px 0;">Нет движений склада за выбранный период (${esc(rng.label)})</div>`}
            </div>
          </div>
          <div class="card">
            <div class="card-head"><div><h2 class="card-title">Сроки годности за период (${fExpiry.length})</h2><div class="card-sub">${esc(rng.label)}</div></div></div>
            <div class="stack" style="max-height:300px;overflow-y:auto;">
              ${fExpiry.length ? fExpiry.map(x => {
                const expired = x.expiresAtMs && x.expiresAtMs < nowMs;
                return `<div class="row-item"><div class="row-main">
                  <div class="row-title">${esc(x.title)} <span class="badge ${x.status==='disposed'?'':(expired?'bad':'good')}">${x.status==='disposed'?'Списано':(expired?'Просрочено':'Годен')}</span></div>
                  <div class="row-sub">${esc(x.category)} · Вскрыто: ${esc(x.date||'—')} · До: ${esc(x.expiresDate||'—')}</div>
                </div></div>`;
              }).join('') : `<div style="color:var(--muted);font-size:13px;padding:8px 0;">Нет записей сроков годности за выбранный период</div>`}
            </div>

          const list = includeAll ? invAll : (lowItems.length ? lowItems : invAll);
          const rows = list.map(it => {
            const st = Number(it.stock || 0);
            const mn = Number(it.minStock || 0);
            const target = Math.max(mn * 2, mn + 1);
            const rec = Math.max(st <= mn ? 1 : 0, Math.ceil(target - st));
            return { id: it.id, name: it.name, cat: it.category || 'Сырьё', stock: st, minStock: mn, unit: it.unit || 'шт', qty: rec };
          });
          openModal('🛒 Автозаявка поставщикам (' + (state.location || 'ILLY') + ')', `
            <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;">
              <div style="font-size:12.5px;color:var(--muted);">${lowItems.length ? ('Позиций ниже минимума: <b>' + lowItems.length + '</b>') : 'Все позиции выше минимума — показан полный склад'}</div>

                  <div style="font-size:11.5px;color:var(--muted);">Остаток: ${r.stock} ${esc(r.unit)} · Мин: ${r.minStock} ${esc(r.unit)}</div>

                <div style="display:flex;align-items:center;gap:6px;flex-shrink:0;">
                  <input type="number" min="0" step="1" class="ord-qty-in" data-idx="${i}" value="${r.qty}" style="width:72px;padding:6px 8px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--ink);font-weight:700;text-align:center;">
                  <span style="font-size:12px;color:var(--muted);min-width:26px;">${esc(r.unit)}</span>
                </div>
              </div>`).join('')}
            </div>
            <div class="field" style="margin-bottom:10px;"><label>Готовый текст заявки (для WhatsApp / Telegram)</label><textarea id="ord-preview" rows="5" readonly style="font-size:12.5px;"></textarea></div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
              <button type="button" class="btn-lg primary" id="ord-copy" style="flex:1;">📋 Скопировать заявку</button>
              <button type="button" class="chip-btn good" id="ord-tg" style="padding:10px 14px;">📨 В Telegram</button>
            </div>
          `);
          const buildOrderText = () => {
            const grouped = {};
            let totalPos = 0;
            document.querySelectorAll('.ord-qty-in').forEach(inp => {
              const r = rows[Number(inp.dataset.idx)];
              const q = Math.max(0, Number(inp.value) || 0);
              if (!r || q <= 0) return;
              totalPos++;
              if (!grouped[r.cat]) grouped[r.cat] = [];
              grouped[r.cat].push('• ' + r.name + ' — ' + q + ' ' + r.unit + ' (остаток ' + r.stock + ')');
            });
            if (!totalPos) return 'Список заказа пуст (укажите количество > 0).';
            const lines = ['🛒 Заявка на закупку · ' + (state.location || 'ILLY') + ' (' + todayISO() + ')', ''];
            Object.keys(grouped).forEach(cat => {
              lines.push('📦 ' + cat + ':');
              grouped[cat].forEach(l => lines.push(l));
              lines.push('');
            });
            return lines.join('\n').trim();
          };
          const syncPreview = () => {
            const ta = document.getElementById('ord-preview');
            if (ta) ta.value = buildOrderText();
          };
          document.querySelectorAll('.ord-qty-in').forEach(inp => inp.oninput = syncPreview);
          syncPreview();
          const togBtn = document.getElementById('ord-toggle-all');
          if (togBtn) togBtn.onclick = () => renderOrderModal(!includeAll);
          document.getElementById('ord-copy').onclick = async () => {
            const txt = buildOrderText();
            try { await navigator.clipboard.writeText(txt); showToast('✓ Заявка скопирована в буфер обмена'); }
            catch (_) {
              const ta = document.getElementById('ord-preview');
              if (ta) { ta.select(); document.execCommand('copy'); }
              showToast('✓ Заявка скопирована');
            }
          };
          document.getElementById('ord-tg').onclick = () => guard('Отправить заявку в Telegram', async () => {
            const txt = buildOrderText();
            if (!window.CoffeeCloudV93 || !window.CoffeeCloudV93.sendTelegramAlert) return;
            const btn = document.getElementById('ord-tg');
            btn.disabled = true;
            try {
              const res = await window.CoffeeCloudV93.sendTelegramAlert(txt, 'admin');
              showToast(res && res.ok ? '📨 Заявка отправлена в Telegram' : ('Ошибка TG: ' + ((res && res.error) || 'проверьте бота')));
            } finally { btn.disabled = false; }
          });
        };
        renderOrderModal(false);

      document.getElementById('wh-add').onclick = () => guard('Добавить товар на склад', () => openWarehouseModal(null));
      root.querySelectorAll('[data-wh-ed]').forEach(b => b.onclick = () => guard('Редактировать товар', () => openWarehouseModal(b.dataset.whEd)));
      root.querySelectorAll('[data-wh-in]').forEach(b => b.onclick = () => guard('Приход на склад', () => openWarehouseMoveModal(b.dataset.whIn, 'restock')));
      root.querySelectorAll('[data-wh-out]').forEach(b => b.onclick = () => guard('Списание со склада', () => openWarehouseMoveModal(b.dataset.whOut, 'writeoff')));
      return;
    }

    if (tab === 'finances') {

                else state.cash.unshift({ date: d.date, cash: d.cash, card: d.card, revenue: d.revenue, checks: d.checks, writeoff: 0, topItems: d.topItems, barista: d.barista, coffeeQty: d.coffeeQty });

            showToast('Сетевая ошибка сохранения планов');

            if (btn) { btn.disabled = false; btn.textContent = '💾 Сохранить всю неделю (Пн–Вс)'; }
          }
        };
      });

      root.querySelectorAll('[data-ep]').forEach(b => b.onclick = () => guard('План дня', () => {
        const p = state.plans[Number(b.dataset.ep)];
        if (!p) return;
        const dp = getDayPlan(p.day);
        const names = state.staff.filter(s => s && s.active !== false && s.name).map(s => s.name);
        if (!names.length) names.push('Бариста');
        const rawRoster = String(p.roster || '').trim();
        const isDayOff = /^выходной$/i.test(rawRoster);
        const hrMatch = rawRoster.match(/\(([^)]+)\)/);
        const rawHr = isDayOff ? 'Выходной' : ((hrMatch && hrMatch[1].trim()) || SHIFT_HOURS[0]);
        const isCustomHr = !isDayOff && !SHIFT_HOURS.includes(rawHr);
        const curHrSel = isCustomHr ? '__custom__' : rawHr;
        const cleanNames = rawRoster.replace(/\([^)]*\)/g, '').split(/[+,;/]+/).map(x => x.trim()).filter(Boolean);
        const sel1 = names.find(n => cleanNames[0] && (n.toLowerCase() === cleanNames[0].toLowerCase() || cleanNames[0].toLowerCase().includes(n.toLowerCase()) || n.toLowerCase().includes(cleanNames[0].toLowerCase()))) || names[0];
        const sel2 = cleanNames[1]
          ? (names.find(n => n !== sel1 && (n.toLowerCase() === cleanNames[1].toLowerCase() || cleanNames[1].toLowerCase().includes(n.toLowerCase()) || n.toLowerCase().includes(cleanNames[1].toLowerCase()))) || '')
          : '';
        openModal('Индивидуальный план на ' + p.day, `
          <div class="grid-3">
            <div class="field"><label>План выручки (₽)</label><input id="pr" type="number" min="0" step="50" value="${dp.rev}"></div>
            <div class="field"><label>План чеков (шт.)</label><input id="pc" type="number" min="0" step="1" value="${dp.checks}"></div>
            <div class="field"><label>Мин. ср. чек (₽)</label><input id="pa" type="number" min="0" step="1" value="${dp.avg}"></div>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;font-size:12px;color:var(--muted);">
            <span id="p-calc-hint">Расчётный ср. чек: <b>${dp.checks>0?Math.round(dp.rev/dp.checks):0} ₽</b></span>
            <button type="button" class="chip-btn" id="p-auto-chk" style="padding:3px 9px;font-size:11.5px;">🧮 Посчитать чеки</button>
          </div>
          <div class="grid-2">
            <div class="field"><label>Сотрудник 1</label><select id="ps" ${isDayOff?'disabled':''}>${optList(names, sel1)}</select></div>
            <div class="field"><label>Сотрудник 2 (если 2 смены)</label><select id="ps2" ${isDayOff?'disabled':''}><option value="">— Один бариста —</option>${names.map(n => `<option value="${esc(n)}" ${n === sel2 ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select></div>
          </div>
          <div class="field"><label>Смена / график</label>
            <select id="ph">${SHIFT_HOURS.map(h => `<option value="${esc(h)}" ${h===curHrSel?'selected':''}>${esc(h)}</option>`).join('')}<option value="__custom__" ${curHrSel==='__custom__'?'selected':''}>✏️ Свой график...</option></select>
          </div>
          <div class="field" id="ph-custom-wrap" style="display:${curHrSel==='__custom__'?'block':'none'};"><label>Свой график смены (например: 07:00–21:00)</label><input id="ph-custom" value="${esc(isCustomHr?rawHr:'07:30–22:30')}" placeholder="07:00–21:00"></div>
          <button class="btn-lg primary" id="psv">Сохранить план на ${esc(p.day)}</button>
        `);
        const updateHint = () => {
          const rv = Number((document.getElementById('pr') || {}).value) || 0;
          const ch = Number((document.getElementById('pc') || {}).value) || 0;
          const hEl = document.getElementById('p-calc-hint');
          if (hEl) hEl.innerHTML = 'Расчётный ср. чек: <b>' + (ch > 0 ? Math.round(rv / ch) : 0) + ' ₽</b>';
        };
        document.getElementById('pr').oninput = updateHint;
        document.getElementById('pc').oninput = updateHint;
        document.getElementById('p-auto-chk').onclick = () => {
          const rv = Number(document.getElementById('pr').value) || 0;
          const av = Number(document.getElementById('pa').value) || 35;
          if (av > 0) document.getElementById('pc').value = Math.round(rv / av);
          updateHint();
        };
        document.getElementById('ph').onchange = (e) => {
          const v = e.target.value;
          const isOff = v === 'Выходной';
          document.getElementById('ph-custom-wrap').style.display = v === '__custom__' ? 'block' : 'none';
          document.getElementById('ps').disabled = isOff;
          document.getElementById('ps2').disabled = isOff;
          if (isOff) {
            document.getElementById('pr').value = '0';
            document.getElementById('pc').value = '0';
            document.getElementById('pa').value = '0';
            updateHint();
          }
        };
        document.getElementById('psv').onclick = async () => {
          const btn = document.getElementById('psv');
          if (btn) { btn.disabled = true; btn.textContent = 'Сохранение...'; }
          const prevP = Object.assign({}, p);
          const hrRaw = document.getElementById('ph').value;
          const hr = hrRaw === '__custom__' ? (document.getElementById('ph-custom').value.trim() || '07:30–22:30') : hrRaw;
          const isOff = hr === 'Выходной';
          const rVal = isOff ? 0 : Math.max(0, Number(document.getElementById('pr').value) || 0);
          const cVal = isOff ? 0 : Math.max(0, Number(document.getElementById('pc').value) || 0);
          const aVal = isOff ? 0 : Math.max(0, Number(document.getElementById('pa').value) || 0);
          p.rev = rVal; p.revenue = rVal;
          p.checks = cVal;
          p.avg = aVal; p.avgCheck = aVal;
          const emp1 = document.getElementById('ps').value;
          const emp2 = document.getElementById('ps2').value;
          if (isOff) {
            p.roster = 'Выходной';
          } else {
            const whoStr = (emp2 && emp2 !== emp1) ? (emp1 + ' + ' + emp2) : emp1;
            p.roster = whoStr + ' (' + hr + ')';
          }
          try {
            const ok = await persistAllPlansToServer('✓ План на ' + p.day + ' сохранён');
            if (!ok) Object.assign(p, prevP);
          } catch (err) {
            Object.assign(p, prevP);
            showToast('Сетевая ошибка сохранения плана: ' + ((err && err.message) || 'повторите'));
          } finally {
            if (btn) { btn.disabled = false; btn.textContent = 'Сохранить план на ' + p.day; }
          }
        };
      }));
      return;
    }

    if (tab === 'incidents') {
      const list = incFilter==='all'?fIncidents:(incFilter==='open'?fIncidents.filter(i=>i.status!=='Решена'):fIncidents.filter(i=>i.status==='Решена'));
      root.innerHTML = `<div class="card"><div class="card-head"><div><h2 class="card-title">Поломки (${list.length})</h2></div><div class="seg"><button class="${incFilter==='open'?'active':''}" data-f="open">Открытые (${openIncs})</button><button class="${incFilter==='resolved'?'active':''}" data-f="resolved">Решённые</button><button class="${incFilter==='all'?'active':''}" data-f="all">Все</button></div></div>
      <div class="stack">${list.map(i=>`<div class="row-item"><div class="row-main"><div class="row-title">${esc(i.step)} <span class="badge ${i.priority==='Критично'?'bad':'warn'}">${esc(i.priority)}</span></div><div class="row-sub">${i.date} ${i.time} · ${esc(i.who)} — ${esc(i.text||'—')}${i.photoUrl?` · <button type="button" class="badge accent" data-mv="${esc(i.photoUrl)}" data-mvt="${esc(i.step)}" style="border:0;cursor:pointer;">${isVideoMediaUrl(i.photoUrl)?'🎬 Видео':'📷 Фото'}</button>`:''}</div></div>${i.status!=='Решена'?`<button class="chip-btn good" data-rs="${esc(i.id)}">✓ Решить</button>`:'<span class="badge good">Решена</span>'}</div>`).join('')}</div></div>`;
      root.querySelectorAll('[data-mv]').forEach(b => b.onclick = () => openMediaViewer(b.dataset.mv, b.dataset.mvt));
      root.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{ incFilter=b.dataset.f; render(); });
      root.querySelectorAll('[data-rs]').forEach(b=>b.onclick=()=>guard('Закрыть поломку',()=>{ const x=state.incidents.find(i=>i.id===b.dataset.rs); if(x){ x.status='Решена'; saveSharedState(state,'Администратор','Решён инцидент '+x.id); render(); } }));
      return;
    }

    if (tab === 'team') {
      const payrollRates = state.payrollRates || {};
      const payrollRows = (state.staff || []).filter(s => s.active !== false).map(s => {
        const sKey = String(s.name || '').trim();
        const sLower = sKey.toLowerCase();
        const sCash = fCash.filter(c => {
          const b1 = String(c.barista || c.who || '').trim().toLowerCase();
          const b2 = String(c.secondBarista || '').trim().toLowerCase();
          return b1 === sLower || (b2 && b2 === sLower);
        });
        const shifts = sCash.length;
        const doubleShifts = sCash.filter(c => {
          const b1 = String(c.barista || c.who || '').trim().toLowerCase();
          const b2 = String(c.secondBarista || '').trim().toLowerCase();
          return b2 && b2 !== b1;
        }).length;
        const rev = Math.round(sCash.reduce((a, c) => {
          const b1 = String(c.barista || c.who || '').trim().toLowerCase();
          const b2 = String(c.secondBarista || '').trim().toLowerCase();
          const share = (b2 && b2 !== b1) ? 0.5 : 1;
          return a + (Number(c.revenue) || 0) * share;
        }, 0));
        const planHits = sCash.filter(c => {
          const dp = getDayPlan(c.date);
          return dp && dp.rev > 0 && (Number(c.revenue) || 0) >= dp.rev;
        }).length;
        const lateChks = fChecklists.filter(c => {
          if (String(c.who || '').trim().toLowerCase() !== sLower) return false;
          const st = String(c.status || '').toLowerCase();
          return st.includes('опозд') || st.includes('просроч') || st.includes('пропущ');
        }).length;
        const r = payrollRates[sKey] || { shiftRate: 0, revenuePct: 0, planBonus: 0, latePenalty: 0 };
        const shiftRate = Number(r.shiftRate) || 0;
        const revenuePct = Number(r.revenuePct) || 0;
        const planBonus = Number(r.planBonus) || 0;
        const latePenalty = Number(r.latePenalty) || 0;
        const rawTotal = shifts * shiftRate + rev * (revenuePct / 100) + planHits * planBonus - lateChks * latePenalty;
        const total = Math.max(0, Math.round(rawTotal));
        return { staff: s, name: sKey, shifts, doubleShifts, rev, planHits, lateChks, shiftRate, revenuePct, planBonus, latePenalty, total };
      });
      const totalFot = payrollRows.reduce((a, r) => a + r.total, 0);
      const totalPayrollShifts = payrollRows.reduce((a, r) => a + r.shifts, 0);
      const totalPayrollRev = payrollRows.reduce((a, r) => a + r.rev, 0);

      root.innerHTML = `
        <div class="card" style="margin-bottom:16px;">
          <div class="card-head">
            <div>
              <h2 class="card-title">💸 Табель и расчёт зарплаты (${esc(rng.label)})</h2>
              <div class="card-sub">Итого ФОТ за период: <b>${fmtRub(totalFot)}</b> · смен: <b>${totalPayrollShifts}</b> · выручка: <b>${fmtRub(totalPayrollRev)}</b></div>
            </div>
          </div>
          <div class="tbl-wrap"><table><thead><tr><th>Сотрудник</th><th>Смен</th><th>Выручка</th><th>План ✓</th><th>Опозд.</th><th>Ставка</th><th>К выплате</th><th></th></tr></thead><tbody>
            ${payrollRows.length ? payrollRows.map(r => `<tr>
              <td><b>${esc(r.name)}</b> <span class="badge">${esc(r.staff.role)}</span></td>
              <td><b>${r.shifts}</b>${r.doubleShifts ? ` <span class="badge" title="Из них сдвоенных смен (выручка 50/50)">сдв. ${r.doubleShifts}</span>` : ''}</td>
              <td>${fmtRub(r.rev)}</td>
              <td><span class="badge ${r.planHits>0?'good':''}">${r.planHits}</span></td>
              <td><span class="badge ${r.lateChks>0?'bad':''}">${r.lateChks}</span></td>
              <td style="font-size:12px;color:var(--muted);white-space:nowrap;">${r.shiftRate?fmtRub(r.shiftRate)+'/см':''}${r.revenuePct?(r.shiftRate?' + ':'')+r.revenuePct+'%':''}${r.planBonus?' + '+fmtRub(r.planBonus)+' пл.':''}${r.latePenalty?' − '+fmtRub(r.latePenalty)+' штр.':''}${(!r.shiftRate&&!r.revenuePct&&!r.planBonus&&!r.latePenalty)?'Не задана':''}</td>
              <td><b>${fmtRub(r.total)}</b></td>
              <td style="white-space:nowrap;">
                <button type="button" class="chip-btn" data-pr-edit="${esc(r.name)}" style="padding:4px 8px;" title="Настроить ставку, % и премии">⚙️ Ставка</button>
                <button type="button" class="chip-btn good" data-pr-pay="${esc(r.name)}" data-pr-amt="${r.total}" style="padding:4px 8px;margin-left:4px;" ${r.total<=0?'disabled':''} title="Записать выплату в расходы (Зарплата)">💸 Выплатить</button>
              </td>
            </tr>`).join('') : '<tr><td colspan="8" style="text-align:center;color:var(--muted);padding:14px;">Нет активных сотрудников</td></tr>'}
            <tr style="background:var(--surface-2);font-weight:700;"><td>Итого ФОТ</td><td>${totalPayrollShifts}</td><td>${fmtRub(totalPayrollRev)}</td><td></td><td></td><td></td><td>${fmtRub(totalFot)}</td><td></td></tr>
          </tbody></table></div>
        </div>
        <div class="card" style="margin-bottom:16px;">
          <div class="card-head"><div><h2 class="card-title">Сотрудники, личные PIN и Telegram ID</h2></div><button class="chip-btn accent" id="s-add">+ Сотрудник</button></div>
          <div class="stack">${state.staff.map(s => {
            const sCash = fCash.filter(c => String(c.barista || c.who || '').toLowerCase() === String(s.name || '').toLowerCase());
            const sRev = sCash.reduce((a, c) => a + (Number(c.revenue) || 0), 0);
            const sChk = fChecklists.filter(c => String(c.who || '').toLowerCase() === String(s.name || '').toLowerCase()).length;
            const sInc = fIncidents.filter(i => String(i.who || '').toLowerCase() === String(s.name || '').toLowerCase()).length;
            const pr = (state.staffPresence || {})[s.name];
            const isOn = !!(pr && pr.status === 'on_shift');
            return `<div class="row-item" style="${s.active===false?'opacity:.55;':''}"><div class="row-main"><div class="row-title">${esc(s.name)} <span class="badge">${esc(s.role)}</span> ${isOn?`<span class="badge good">🟢 На работе с ${esc(pr.checkedInAt||'')}</span>`:''} ${s.tgId?`<span class="badge accent">${esc(s.tgId)}</span>`:'<span class="badge warn">TG не привязан</span>'}</div><div class="row-sub">За период (${esc(rng.label)}): смен <b>${sCash.length}</b> · выручка <b>${fmtRub(sRev)}</b> · чек-листов <b>${sChk}</b> · поломок <b>${sInc}</b></div></div><div style="display:flex;gap:6px;flex-wrap:wrap;">${s.tgId ? `<button class="chip-btn good" data-tg-staff="${esc(s.name)}" title="Отправить личное сообщение в Telegram">📨 TG</button>` : ''}<button class="chip-btn" data-es="${esc(s.id)}">✏️ PIN / TG</button></div></div>`;
          }).join('')}</div>
        </div>
        <div class="card">
          <div class="card-head"><div><h2 class="card-title">Техкарты ILLY (${state.ttk.length})</h2></div><button class="chip-btn accent" id="k-add">+ Техкарта</button></div>
          <div class="tbl-wrap"><table><thead><tr><th>Напиток</th><th>Объём</th><th>Цена</th><th>Ср. цена</th><th>Себест.</th><th>Маржа</th><th></th></tr></thead><tbody>
            ${state.ttk.map(k=>`<tr><td><b>${esc(k.name)}</b></td><td style="color:var(--muted)">${esc(k.vol)}</td><td>${k.price} ₽</td><td style="color:var(--muted)">${k.avgPrice!=null?k.avgPrice:k.price} ₽</td><td>${k.cost} ₽</td><td><span class="badge good">${k.price?Math.round(((k.price-k.cost)/k.price)*100):0}%</span></td><td><button class="chip-btn" data-ek="${esc(k.id)}" style="padding:4px 8px;">✏️</button></td></tr>`).join('')}
          </tbody></table></div>
        </div>`;
      root.querySelectorAll('[data-pr-edit]').forEach(b => b.onclick = () => guard('Ставка сотрудника', () => {
        const empName = b.dataset.prEdit;
        const cur = (state.payrollRates || {})[empName] || { shiftRate: 0, revenuePct: 0, planBonus: 0, latePenalty: 0 };
        openModal('⚙️ Ставка зарплаты: ' + empName, `
          <div class="grid2">
            <div class="field"><label>Ставка за смену (₽)</label><input id="pr-shift" type="number" min="0" value="${Number(cur.shiftRate)||0}"></div>
            <div class="field"><label>% от выручки смены</label><input id="pr-pct" type="number" min="0" max="50" step="0.5" value="${Number(cur.revenuePct)||0}"></div>
          </div>
          <div class="grid2">
            <div class="field"><label>Премия за выполненный план (₽)</label><input id="pr-bonus" type="number" min="0" value="${Number(cur.planBonus)||0}"></div>
            <div class="field"><label>Штраф за опоздание чек-листа (₽)</label><input id="pr-pen" type="number" min="0" value="${Number(cur.latePenalty)||0}"></div>
          </div>
          <button type="button" class="btn-lg primary" id="pr-save">✓ Сохранить ставку</button>
        `);
        document.getElementById('pr-save').onclick = async () => {
          const btn = document.getElementById('pr-save');
          btn.disabled = true;
          const payload = {
            staffName: empName,
            shiftRate: Math.max(0, Number(document.getElementById('pr-shift').value) || 0),
            revenuePct: Math.max(0, Number(document.getElementById('pr-pct').value) || 0),
            planBonus: Math.max(0, Number(document.getElementById('pr-bonus').value) || 0),
            latePenalty: Math.max(0, Number(document.getElementById('pr-pen').value) || 0)
          };
          try {
            if (window.CoffeeCloudV93 && window.CoffeeCloudV93.savePayrollRate) {
              await window.CoffeeCloudV93.savePayrollRate(payload);
            }
            state.payrollRates = state.payrollRates || {};
            state.payrollRates[empName] = { shiftRate: payload.shiftRate, revenuePct: payload.revenuePct, planBonus: payload.planBonus, latePenalty: payload.latePenalty };
            saveSharedState(state, 'Администратор', 'Обновлена ставка: ' + empName);
            closeModal();
            render();
            showToast('✓ Ставка зарплаты для ' + empName + ' сохранена');
          } catch (err) {
            showToast('Ошибка сохранения ставки: ' + ((err && err.message) || 'повторите'));
            btn.disabled = false;
          }
        };
      }));
      root.querySelectorAll('[data-pr-pay]').forEach(b => b.onclick = () => guard('Выплата зарплаты', () => {
        const empName = b.dataset.prPay;
        const amt = Math.round(Number(b.dataset.prAmt) || 0);
        if (amt <= 0) return;
        const exp = {
          id: 'EXP' + Date.now(),
          date: todayISO(),
          category: 'Зарплата',
          amount: amt,
          comment: 'Зарплата: ' + empName + ' (' + rng.label + ')'
        };
        state.expenses.unshift(exp);
        saveSharedState(state, 'Администратор', 'Выплата зарплаты ' + empName + ': ' + fmtRub(amt));
        render();
        showToast('💸 Выплата ' + fmtRub(amt) + ' (' + empName + ') записана в Расходы');
      }));
      document.getElementById('s-add').onclick = () => guard('Новый сотрудник', () => openStaffModal(null));
      root.querySelectorAll('[data-es]').forEach(b => b.onclick = () => guard('Изменить сотрудника', () => openStaffModal(b.dataset.es)));
      root.querySelectorAll('[data-tg-staff]').forEach(b => b.onclick = () => guard('Сообщение в Telegram', () => {
        const empName = b.dataset.tgStaff;
        openModal('Личное уведомление в Telegram: ' + empName, `
          <div class="field"><label>Текст сообщения для ${esc(empName)}</label><textarea id="tg-dm-text" rows="3" placeholder="Например: Не забудь сдать Лайн Чек 1 до 09:30!"></textarea></div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button class="btn-lg primary" id="tg-dm-send" style="flex:1;">📨 Отправить лично</button>
            <button class="chip-btn" id="tg-dm-test">🧪 Тест связи</button>
          </div>
        `);
        document.getElementById('tg-dm-send').onclick = async () => {
          const txt = document.getElementById('tg-dm-text').value.trim();
          if (!txt) { showToast('Введите текст сообщения'); return; }
          const res = window.CoffeeCloudV93 ? await window.CoffeeCloudV93.sendTelegramAlert({ targetStaffName: empName, text: '💬 <b>Сообщение от владельца</b>\n' + txt, targetPage: 'index.html', buttonText: '▶️ Открыть терминал', buttonType: 'web_app', force: true, skipDedup: true }) : null;
          closeModal();
          if (res && res.ok) showToast('📨 Отправлено лично: ' + empName);
          else showToast('Ошибка отправки: ' + ((res && (res.reason || res.error)) || 'проверьте Telegram ID'));
        };
        document.getElementById('tg-dm-test').onclick = async () => {
          const res = window.CoffeeCloudV93 ? await window.CoffeeCloudV93.testTelegramAlert({ targetStaffName: empName }) : null;
          closeModal();
          if (res && res.ok) showToast('✅ Тест доставлен лично: ' + empName);
          else showToast('Ошибка теста: ' + ((res && res.telegram && (res.telegram.reason || res.telegram.error)) || (res && res.error) || 'проверьте Telegram ID'));
        };
      }));
      document.getElementById('k-add').onclick = () => guard('Новая ТТК', () => openTtkModal(null));
      root.querySelectorAll('[data-ek]').forEach(b => b.onclick = () => guard('Изменить ТТК', () => openTtkModal(b.dataset.ek)));
      return;
    }

    if (tab === 'settings') {
      const lateChks = fChecklists.filter(c => c.isLate).length;

  function openWarehouseModal(id) {
    const it = id ? (state.inventory || []).find(x => x.id === id) : null;
    openModal(it ? ('Товар: ' + it.name) : 'Новый товар на складе', `
      <div class="field"><label>Название товара</label><input id="wh-nm" value="${it ? esc(it.name) : ''}" placeholder="Например: Зерно Illy 250г / Молоко 3.2%"></div>
      <div class="grid-2">
        <div class="field"><label>Категория</label><input id="wh-cat" value="${it ? esc(it.category || 'Сырьё') : 'Сырьё'}" placeholder="Кофе / Молоко / Расходники"></div>
        <div class="field"><label>Ед. измерения</label><input id="wh-un" value="${it ? esc(it.unit || 'шт') : 'шт'}" placeholder="г / мл / шт / л"></div>
      </div>
      <div class="grid-2">
        <div class="field"><label>Текущий остаток</label><input id="wh-st" type="number" min="0" value="${it ? Number(it.stock || 0) : 0}"></div>
        <div class="field"><label>Мин. порог (алерт)</label><input id="wh-min" type="number" min="0" value="${it ? Number(it.minStock || 5) : 5}"></div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;"><button class="btn-lg primary" id="wh-sv" style="flex:1;">Сохранить на склад</button>${it ? `<button class="chip-btn bad" id="wh-del" style="padding:10px 14px;">🗑️ Удалить</button>` : ''}</div>
    `);
    document.getElementById('wh-sv').onclick = async () => {
      const btn = document.getElementById('wh-sv');
      const payload = {
        id: it ? it.id : ('inv_' + Date.now().toString(36)),
        name: document.getElementById('wh-nm').value.trim(),
        category: document.getElementById('wh-cat').value.trim() || 'Сырьё',
        unit: document.getElementById('wh-un').value.trim() || 'шт',
        stock: Math.max(0, Math.round(Number(document.getElementById('wh-st').value) || 0)),
        minStock: Math.max(0, Math.round(Number(document.getElementById('wh-min').value) || 0))
      };
      if (!payload.name) { showToast('Укажите название товара'); return; }
      if (btn) { btn.disabled = true; btn.textContent = 'Сохранение...'; }
      try {
        let res = { ok: true };
        if (window.CoffeeCloudV93) {
          res = await window.CoffeeCloudV93.saveInventoryItem(payload);
          if (!res || (res.ok === false && !res.queued)) {
            showToast('Ошибка сервера: ' + ((res && res.error) || 'не удалось сохранить остаток'));
            return;
          }
          if (Array.isArray(res.inventory)) state.inventory = res.inventory;
          if (Array.isArray(res.inventoryMoves)) state.inventoryMoves = res.inventoryMoves;
        }
        if (!state.inventory) state.inventory = [];
        const ex = state.inventory.find(x => x.id === payload.id);
        if (ex) Object.assign(ex, payload, { updatedAt: getTodayISO() });
        else state.inventory.push(Object.assign({}, payload, { updatedAt: getTodayISO() }));
        saveSharedState(state, 'Администратор', 'Обновлён склад: ' + payload.name + ' (' + payload.stock + ' ' + payload.unit + ')');
        closeModal(); showToast(res && res.queued ? '⏳ В очереди синхронизации (офлайн)' : '✓ Остаток сохранён в Google Таблице'); render();
      } catch (err) {
        showToast('Ошибка сохранения склада: ' + ((err && err.message) || 'повторите'));
      } finally {
        if (btn) { btn.disabled = false; btn.textContent = 'Сохранить на склад'; }
      }
    };
    const delBtn = document.getElementById('wh-del');
    if (delBtn && it) {
      delBtn.onclick = async () => {
        const api = window.CoffeeCloudV94 || window.CoffeeCloudV93;
        let r = { ok: true };
        if (api && api.deleteInventory) {
          r = await api.deleteInventory(it.id);
          if (!r || (r.ok === false && !r.queued)) {
            showToast('Ошибка удаления: ' + ((r && r.error) || 'отклонено сервером'));
            return;
          }
          if (Array.isArray(r.inventory)) state.inventory = r.inventory;
        }
        state.inventory = (state.inventory || []).filter(x => x.id !== it.id);
        saveSharedState(state, 'Администратор', 'Удалена позиция склада: ' + it.name);
        closeModal(); showToast(r && r.queued ? '⏳ Удаление в очереди (офлайн)' : '✓ Позиция удалена со склада'); render();
      };
    }
  }
  function openWarehouseMoveModal(id, kind) {
    const it = (state.inventory || []).find(x => x.id === id);

  function bindDragSort(container, itemSelector, dataKey, onDropIds) {
    if (!container) return;
    let dragId = null;
    const clearMarks = () => container.querySelectorAll('.drag-over,.is-dragging').forEach(el => el.classList.remove('drag-over', 'is-dragging'));
    const items = Array.from(container.querySelectorAll(itemSelector));
    items.forEach(item => {
      item.addEventListener('dragstart', (e) => {
        if (e.target && e.target.closest('button,input,select,textarea,a')) { e.preventDefault(); return; }
        dragId = item.dataset[dataKey];
        item.classList.add('is-dragging');
        try { e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', String(dragId || '')); } catch (_) {}
      });
      item.addEventListener('dragover', (e) => {
        e.preventDefault();
        if (!dragId || item.dataset[dataKey] === dragId) return;
        container.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
        item.classList.add('drag-over');
      });
      item.addEventListener('dragleave', () => item.classList.remove('drag-over'));
      item.addEventListener('drop', (e) => {
        e.preventDefault();
        const toId = item.dataset[dataKey];
        const fromId = dragId;
        clearMarks();
        dragId = null;
        if (fromId && toId && fromId !== toId) onDropIds(fromId, toId);
      });
      item.addEventListener('dragend', () => { clearMarks(); dragId = null; });

      // Touch drag support via .drag-handle (keeps normal page scrolling outside handle)
      const handle = item.querySelector('.drag-handle');
      if (handle) {
        let touchOverId = null;
        handle.addEventListener('touchstart', (e) => {
          if (!e.touches || e.touches.length !== 1) return;
          dragId = item.dataset[dataKey];
          touchOverId = null;
          item.classList.add('is-dragging');
        }, { passive: true });
        handle.addEventListener('touchmove', (e) => {
          if (!dragId || !e.touches || !e.touches.length) return;
          e.preventDefault();
          const t = e.touches[0];
          const elUnder = document.elementFromPoint(t.clientX, t.clientY);
          const targetRow = elUnder && elUnder.closest ? elUnder.closest(itemSelector) : null;
          container.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
          if (targetRow && container.contains(targetRow) && targetRow.dataset[dataKey] !== dragId) {
            targetRow.classList.add('drag-over');
            touchOverId = targetRow.dataset[dataKey];
          } else {
            touchOverId = null;
          }
        }, { passive: false });
        handle.addEventListener('touchend', () => {
          const fromId = dragId;
          const toId = touchOverId;
          clearMarks();
          dragId = null;
          touchOverId = null;
          if (fromId && toId && fromId !== toId) onDropIds(fromId, toId);
        });
        handle.addEventListener('touchcancel', () => { clearMarks(); dragId = null; touchOverId = null; });
      }
    });
  }

  function reorderBlocksById(fromId, toId) {
    const fromIdx = state.blocks.findIndex(b => String(b.id) === String(fromId));
    const toIdx = state.blocks.findIndex(b => String(b.id) === String(toId));
    if (fromIdx < 0 || toIdx < 0 || fromIdx === toIdx) return false;
    const [moved] = state.blocks.splice(fromIdx, 1);
    state.blocks.splice(toIdx, 0, moved);
    saveSharedState(state, 'Администратор', '');
    if (window.CoffeeCloudV93 && typeof window.CoffeeCloudV93.saveChecklistBlocks === 'function') {
      window.CoffeeCloudV93.markLocalMutation && window.CoffeeCloudV93.markLocalMutation();
      window.CoffeeCloudV93.saveChecklistBlocks(state.blocks).then(res => {
        if (res && res.ok) showToast('✓ Порядок чек-листов сохранён и отправлен в терминал');
        else showToast('Ошибка сохранения порядка чек-листов: ' + ((res && res.error) || 'проверьте вход'));
      });
    } else {
      showToast('✓ Порядок чек-листов обновлён');
    }
    return true;
  }

  function reorderTaskById(blk, fromId, toId) {
    const idxs = [];
    for (let i = 0; i < state.tasks.length; i++) {
      if (state.tasks[i] && state.tasks[i].block === blk) idxs.push(i);
    }
    const blkTasks = idxs.map(i => state.tasks[i]);
    const fromPos = blkTasks.findIndex(t => String(t.id) === String(fromId));
    const toPos = blkTasks.findIndex(t => String(t.id) === String(toId));
    if (fromPos < 0 || toPos < 0 || fromPos === toPos) return false;
    const [moved] = blkTasks.splice(fromPos, 1);
    blkTasks.splice(toPos, 0, moved);
    for (let k = 0; k < idxs.length; k++) {
      state.tasks[idxs[k]] = blkTasks[k];
    }
    const orderedIds = blkTasks.map(t => String(t.id));
    saveSharedState(state, 'Администратор', '');
    if (window.CoffeeCloudV93 && typeof window.CoffeeCloudV93.reorderTasks === 'function') {
      window.CoffeeCloudV93.markLocalMutation && window.CoffeeCloudV93.markLocalMutation();
      window.CoffeeCloudV93.reorderTasks(blk, orderedIds).then(res => {
        if (res && res.ok) showToast('✓ Порядок задач сохранён и отправлен в терминал');
        else showToast('Ошибка сохранения порядка: ' + ((res && res.error) || 'проверьте вход'));
      });
    }
    return true;
  }

  function moveTaskInBlock(blk, taskId, delta) {
    const idxs = [];
    for (let i = 0; i < state.tasks.length; i++) {
      if (state.tasks[i] && state.tasks[i].block === blk) idxs.push(i);
    }
    const pos = idxs.findIndex(idx => String(state.tasks[idx].id) === String(taskId));
    const targetPos = pos + delta;
    if (pos < 0 || targetPos < 0 || targetPos >= idxs.length) return false;
    const iA = idxs[pos], iB = idxs[targetPos];
    const tmp = state.tasks[iA];
    state.tasks[iA] = state.tasks[iB];
    state.tasks[iB] = tmp;
    const orderedIds = idxs.map(idx => String(state.tasks[idx].id));
    saveSharedState(state, 'Администратор', '');
    if (window.CoffeeCloudV93 && typeof window.CoffeeCloudV93.reorderTasks === 'function') {
      window.CoffeeCloudV93.markLocalMutation && window.CoffeeCloudV93.markLocalMutation();
      window.CoffeeCloudV93.reorderTasks(blk, orderedIds).then(res => {
        if (res && res.ok) showToast('✓ Порядок задач сохранён и отправлен в терминал');
        else showToast('Ошибка сохранения порядка: ' + ((res && res.error) || 'проверьте вход'));
      });
    }
    return true;
  }

  function pluralFiles(n) {
    const a = Math.abs(Number(n) || 0) % 100;
    const b = a % 10;
    if (a >= 11 && a <= 19) return n + ' файлов';
    if (b === 1) return n + ' файл';
    if (b >= 2 && b <= 4) return n + ' файла';
    return n + ' файлов';
  }
  function updateSyncPill() {
    const pill = document.getElementById('hdr-sync-pill');
    const revEl = document.getElementById('hdr-rev');
    if (!revEl) return;
    const stInfo = (window.CoffeeCloudV94 && window.CoffeeCloudV94.getSyncStatus)
      ? window.CoffeeCloudV94.getSyncStatus(state)
      : { online: (navigator.onLine !== false && state.liveConnected !== false), pendingCount: 0, failedCount: 0, totalUnsynced: 0 };
    const unsynced = stInfo.totalUnsynced || 0;
    const isOnline = !!stInfo.online;
    if (pill) {
      pill.classList.remove('is-online', 'is-offline', 'is-syncing');
      if (!isOnline) pill.classList.add('is-offline');
      else if (unsynced > 0) pill.classList.add('is-syncing');
      else pill.classList.add('is-online');
    }
    if (!isOnline) {
      revEl.textContent = unsynced > 0 ? ('Офлайн · не синхр.: ' + pluralFiles(unsynced)) : 'Офлайн';
    } else if (unsynced > 0) {
      revEl.textContent = 'Синхр. · осталось ' + pluralFiles(unsynced);
    } else {
      revEl.textContent = 'Онлайн' + (state.lastSyncAt ? ' · ' + state.lastSyncAt : '');
    }
  }

  function openSyncStatusModal() {
    const api = window.CoffeeCloudV94;
    const stInfo = (api && api.getSyncStatus) ? api.getSyncStatus(state) : { online: navigator.onLine !== false, pendingCount: 0, failedCount: 0, foreignPendingCount: 0, totalUnsynced: 0, lastRttMs: 0 };
    const pend = (api && api.getPendingOps) ? api.getPendingOps() : [];
    const failed = (api && api.getFailedOps) ? api.getFailedOps() : [];
    const labels = {

      submit_checklist: '✅ Сдача чек-листа',
      save_checklist_draft: '📝 Прогресс чек-листа',

      staff_checkin: '👋 Вход на смену',
      save_staff_notif_prefs: '🔔 Настройки уведомлений'
    };
    const renderRow = (op, isFail) => {
      const title = labels[op.action] || op.action;
      const blk = (op.payload && op.payload.block) ? (' · «' + esc(op.payload.block) + '»') : '';
      const who = op.ownerName ? (' · ' + esc(op.ownerName)) : '';
      const err = op.lastError ? ('<div style="font-size:11px;color:var(--bad);margin-top:2px;">' + esc(String(op.lastError).slice(0, 90)) + '</div>') : '';
      return `<div class="card-soft" style="padding:8px 10px;font-size:12.5px;"><div style="display:flex;justify-content:space-between;gap:8px;"><b>${title}${blk}</b><span class="badge ${isFail?'bad':'warn'}">${isFail?'Ошибка':'В очереди'}</span></div><div style="font-size:11px;color:var(--muted);">${who.replace(/^ · /,'') || 'Система'} · попыток: ${op.attempts||0}</div>${err}</div>`;
    };
    const listHtml = (pend.length || failed.length)
      ? `<div class="stack" style="max-height:220px;overflow-y:auto;margin-bottom:10px;">${pend.map(x=>renderRow(x,false)).join('')}${failed.map(x=>renderRow(x,true)).join('')}</div>`
      : `<div class="card-soft" style="text-align:center;padding:14px;margin-bottom:10px;color:var(--good);font-weight:600;">✓ Все данные и файлы сохранены на сервере</div>`;
    openModal('Статус синхронизации', `
      <div class="card-soft" style="margin-bottom:10px;font-size:12.5px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">
        <span>Связь: <b style="color:${stInfo.online?'var(--good)':'var(--warn)'};">${stInfo.online?'Онлайн':'Офлайн'}</b>${stInfo.lastRttMs?' · отклик ~'+(stInfo.lastRttMs/1000).toFixed(1)+' с':''}</span>
        <span>В очереди: <b>${pend.length}</b> · Ошибок: <b>${failed.length}</b></span>
      </div>
      ${listHtml}
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn-lg primary" id="sync-now-btn" style="flex:1;">⚡ Синхронизировать сейчас</button>
        ${(pend.length || failed.length) ? '<button class="btn-lg soft" id="sync-clear-btn">🗑 Очистить застрявшие</button>' : ''}
      </div>
    `);
    const snb = document.getElementById('sync-now-btn');
    if (snb) snb.onclick = async () => {
      if (navigator.onLine === false) { showToast('Нет интернета — данные отправятся автоматически при подключении'); return; }
      snb.disabled = true; snb.textContent = 'Синхронизация...';
      try {
        if (api && api.retryFailedOps && failed.length) await api.retryFailedOps();
        if (api && api.flushOutbox) await api.flushOutbox(true);
        updateSyncPill();
        const after = (api && api.getSyncStatus) ? api.getSyncStatus(state) : { totalUnsynced: 0 };
        if (after.totalUnsynced === 0) { closeModal(); showToast('✓ Все данные синхронизированы!'); }
        else { openSyncStatusModal(); showToast('⏳ Осталось: ' + pluralFiles(after.totalUnsynced)); }
      } catch (_) {
        snb.disabled = false; snb.textContent = '⚡ Синхронизировать сейчас';
        showToast('Ошибка связи с сервером');
      }
    };
    const scb = document.getElementById('sync-clear-btn');
    if (scb) scb.onclick = () => {
      if (api && api.clearStaleOps) api.clearStaleOps();
      updateSyncPill();
      closeModal();
      showToast('✓ Зависшие элементы очищены');
    };
  }

  function updateNavAmbientGlow() {

  function renderFailedOpsBanner() {
    const host = document.getElementById('content');

    const rbtn = document.getElementById('btn-retry-failed');
    if (rbtn) rbtn.onclick = () => {
      window.CoffeeCloudV94.retryFailedOps();
      showToast('Повторная отправка запущена');
      setTimeout(renderFailedOpsBanner, 600);

  }

  (function syncDashStickyOffset(){

  })();
})();
