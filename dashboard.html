<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Кофейня — дашборд</title>
<script>try{var t=localStorage.getItem('coffee_illy_theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<style>
:root{--bg:#f1ece6;--sf:#fff;--ink:#222;--mu:#7a6f66;--ln:#e4dcd3;--br:#5a3a29;--cr:#c98b4f;--ok:#1b8a57;--no:#c23b22;color-scheme:light}
:root[data-theme=dark]{--bg:#161211;--sf:#201a18;--ink:#eee6df;--mu:#a2958b;--ln:#33292a;--br:#c98b4f;--cr:#e0a76a;--ok:#4cc38a;--no:#ff7a5f;color-scheme:dark}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#161211;--sf:#201a18;--ink:#eee6df;--mu:#a2958b;--ln:#33292a;--br:#c98b4f;--cr:#e0a76a;--ok:#4cc38a;--no:#ff7a5f;color-scheme:dark}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:env(safe-area-inset-bottom,0)}
.nav{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;max-width:760px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top,0)) 16px 8px}
.nav b{display:flex;align-items:center;gap:8px;font-size:18px}.nav svg{width:26px;height:26px}
.pills a{color:var(--mu);text-decoration:none;font-size:14px;padding:6px 10px;border-radius:9px}.pills a.on{background:var(--br);color:var(--sf)}
button,input{font:inherit;color:var(--ink)}
.dp{display:flex;gap:6px;max-width:760px;margin:0 auto;padding:0 16px}
.dp button,.dp input{height:38px;border:1px solid var(--ln);background:var(--sf);border-radius:10px;padding:0 12px;cursor:pointer}
.dp input{flex:1}
main{max-width:760px;margin:0 auto;padding:14px 16px 40px;transition:opacity .2s}main.ld{opacity:.5}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:18px;margin-top:12px}
.mu{color:var(--mu);font-size:14px}
.big{font-size:clamp(38px,11vw,56px);font-weight:700;line-height:1.05;display:block;margin:4px 0 10px;font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:99px;background:var(--ln);overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--cr);transition:width .8s}.bar i.done{background:var(--ok)}
.row{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin-top:6px;color:var(--mu)}
.k{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:12px}.k .card{margin:0}
.k b{display:block;font-size:26px;font-variant-numeric:tabular-nums}
.t{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px}.t.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,transparent)}.t.no{color:var(--no);background:color-mix(in srgb,var(--no) 16%,transparent)}
#chart svg{width:100%;height:auto;display:block}#chart text{fill:var(--mu);font-size:10px}
h2{font-size:16px;margin:0 0 10px}.inc{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--ln);font-size:14px}.inc:first-of-type{border-top:0}
.inc button{border:1px solid var(--ln);background:var(--bg);border-radius:9px;padding:5px 10px;cursor:pointer}
.al{border:1px solid var(--no);border-radius:14px;padding:12px 14px;margin-top:12px}
</style></head><body>
<header class="nav"><b><svg viewBox="0 0 32 32" fill="none" stroke="var(--br)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 10h16v8a7 7 0 0 1-7 7h-2a7 7 0 0 1-7-7z"/><path d="M22 12h2a3 3 0 0 1 0 6h-2"/><path d="M11 4v2M15 3v3M19 4v2"/></svg> Кофейня</b>
<nav class="pills"><a class="on" href="dashboard.html">Дашборд</a><a href="report.html">Отчёты</a><a href="index.html">Терминал</a></nav></header>
<div class="dp"><button id="prev" aria-label="Предыдущий день">‹</button><input type="date" id="pick" aria-label="Дата"><button id="next" aria-label="Следующий день">›</button><button id="reload" aria-label="Обновить">↻</button><button id="theme" aria-label="Сменить тему">🌙</button></div>
<main id="main">
<div id="err" class="al" hidden></div>
<section class="card"><span class="mu" id="date">…</span><span class="big" id="rev">—</span>
<div class="bar"><i id="bar"></i></div><div class="row"><span id="planL">План</span><span id="planR"></span></div></section>
<div class="k">
<div class="card"><span class="mu">Чеков</span><b id="checks">—</b><span class="mu" id="chk2">&nbsp;</span></div>
<div class="card"><span class="mu">Средний чек</span><b id="avg">—</b><span class="mu">&nbsp;</span></div>
<div class="card"><span class="mu">Списания</span><b id="wo">—</b><span id="woS">&nbsp;</span></div>
<div class="card"><span class="mu">Открытие смены</span><b id="open">—</b><span id="openS">&nbsp;</span></div></div>
<section class="card"><h2>Выручка за 14 дней</h2><div id="chart"></div></section>
<section class="card"><h2 id="incT">Открытые проблемы</h2><div id="inc"></div></section>
<p class="mu" style="text-align:center;margin-top:18px">Подробности — прибыль, позиции, задачи персонала — в разделе <a href="report.html" style="color:var(--br)">Отчёты</a></p>
</main>
<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbzCECsUCN3d2WOYvjkKZ56lgnYaqW1s1UhMs8ne6u_hzOpcHilgKgB7VaKeUNHwssdLzw/exec';
const PIN_KEY='coffee_illy_pin',$=(i)=>document.getElementById(i);
const getPin=()=>{try{return localStorage.getItem(PIN_KEY)||''}catch(e){return ''}};
const rub=(n)=>Math.round(Number(n||0)).toLocaleString('ru-RU')+' ₽';
const esc=(s)=>String(s==null?'':s).replace(/[&<>"']/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=(d)=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const shift=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)};
let D=null;
async function load(silent){
  if(!silent)$('main').classList.add('ld');$('err').hidden=true;
  try{
    const r=await(await fetch(API_URL+'?action=dashboard&date='+$('pick').value+'&pin='+encodeURIComponent(getPin()))).json();
    if(r&&r.ok===false&&/PIN_REQUIRED/.test(r.error||'')){const e=new Error('Введите код доступа администратора');e.pin=true;throw e}
    if(!r||r.ok===false||!r.days)throw new Error((r&&r.error)||'сервер вернул неожиданный ответ');
    D=r;render(r);
  }catch(e){
    $('err').hidden=false;
    $('err').innerHTML=e.pin?'<b>'+esc(e.message)+'</b><div style="display:flex;gap:8px;margin-top:10px"><input id="pinIn" type="password" placeholder="Код" style="height:38px;border:1px solid var(--ln);border-radius:10px;padding:0 10px;background:var(--bg)"><button id="pinOk" style="height:38px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);padding:0 14px;cursor:pointer">Войти</button></div>':'<b>Не удалось загрузить данные.</b> '+esc(e.message);
  }finally{$('main').classList.remove('ld')}
}
$('err').addEventListener('click',(e)=>{if(e.target.id!=='pinOk')return;try{localStorage.setItem(PIN_KEY,$('pinIn').value.trim())}catch(x){}load()});
function render(d){
  const has=!!d.hasData,pct=has?Math.round(d.revenue/d.plan*100):0,today=iso(new Date());
  $('pick').value=d.date;$('pick').max=today;$('next').disabled=d.date>=today;
  $('date').textContent=new Date(d.date+'T12:00:00').toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'})+(d.isToday?' · сегодня':'');
  $('rev').textContent=has?rub(d.revenue):'—';
  $('bar').style.width=Math.min(pct,100)+'%';$('bar').className=pct>=100?'done':'';
  $('planL').textContent='Цель на день '+rub(d.plan);$('planR').textContent=has?pct+'%':'данных нет';
  $('checks').textContent=has?d.checks:'—';$('avg').textContent=has?rub(d.avg):'—';$('wo').textContent=has?rub(d.writeoff):'—';
  const wn=d.woNorm||500;
  $('woS').innerHTML=has?'<span class="t '+(d.writeoff<=wn?'ok':'no')+'">'+(d.writeoff<=wn?'в норме':'выше нормы')+'</span>':'&nbsp;';
  const dl=d.deadline||'08:30';
  $('open').textContent=d.openedAt||'—';
  $('openS').innerHTML=d.openedAt?'<span class="t '+(d.openedAt<=dl?'ok':'no')+'">'+(d.openedAt<=dl?'вовремя':'с опозданием')+'</span>':'<span class="mu">нет отметки</span>';
  chart(d);incs(d);
}
function chart(d){
  const days=d.days,W=640,H=190,p=16,base=H-22,max=Math.max(d.plan*1.15,...days.map((x)=>x.revenue)),bw=(W-p*2)/days.length,y=(v)=>base-v/max*(base-10);
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Выручка по дням">';
  days.forEach((x,i)=>{const h=Math.max(base-y(x.revenue),x.revenue?2:0);
    s+='<rect x="'+(p+i*bw+bw*.15)+'" y="'+(base-h)+'" width="'+bw*.7+'" height="'+h+'" rx="3" fill="'+(x.date===d.date?'var(--br)':x.revenue>=d.plan?'var(--ok)':'var(--ln)')+'"><title>'+x.date.slice(8)+'.'+x.date.slice(5,7)+': '+rub(x.revenue)+'</title></rect>';
    if(i%2===0||days.length<8)s+='<text x="'+(p+i*bw+bw/2)+'" y="'+(H-6)+'" text-anchor="middle">'+x.date.slice(8)+'</text>'});
  s+='<line x1="'+p+'" x2="'+(W-p)+'" y1="'+y(d.plan)+'" y2="'+y(d.plan)+'" stroke="var(--cr)" stroke-dasharray="5 4"/></svg>';
  $('chart').innerHTML=s;
}
function incs(d){
  const open=(d.incidents||[]).filter((i)=>i.status==='Open');
  $('incT').textContent='Открытые проблемы'+(open.length?' · '+open.length:'');
  $('inc').innerHTML=open.length?open.slice(0,6).map((i)=>'<div class="inc"><div><b>'+esc(i.step||'Проблема')+'</b>'+(i.priority==='Критично'?' <span class="t no">критично</span>':'')+'<div class="mu">'+esc(i.text)+' · '+esc(i.date.slice(8)+'.'+i.date.slice(5,7))+'</div></div><button data-r="'+esc(i.id)+'">Решено</button></div>').join('')+(open.length>6?'<p class="mu">и ещё '+(open.length-6)+' — в отчётах</p>':''):'<p class="mu" style="margin:0">Всё в порядке — открытых проблем нет</p>';
}
$('inc').addEventListener('click',async(e)=>{const b=e.target.closest('[data-r]');if(!b)return;b.disabled=true;
  try{const r=await(await fetch(API_URL,{method:'POST',body:JSON.stringify({action:'resolve_incident',id:b.dataset.r,pin:getPin()})})).json();if(!r.ok)throw new Error(r.error);load(true)}catch(x){b.disabled=false;alert('Не удалось закрыть: '+x.message)}});
$('prev').onclick=()=>{$('pick').value=shift($('pick').value,-1);load()};
$('next').onclick=()=>{$('pick').value=shift($('pick').value,1);load()};
$('pick').onchange=()=>load();$('reload').onclick=()=>load();
const cur=()=>document.documentElement.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
const paint=()=>{$('theme').textContent=cur()==='dark'?'☀️':'🌙'};
$('theme').onclick=()=>{const n=cur()==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);try{localStorage.setItem('coffee_illy_theme',n)}catch(e){}paint()};
paint();$('pick').value=new URLSearchParams(location.search).get('date')||iso(new Date());load();
setInterval(()=>{if(!document.hidden&&D&&D.isToday)load(true)},120000);
</script></body></html>
