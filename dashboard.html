<meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)">

<style>

:root {
  --bg: #F6F3EF; --surface: #EFEAE4; --surface-2: #E5DDD4; --card: #FFFFFF;
  --ink: #1C1613; --muted: #5C5048; --accent: #9A4A24; --accent-soft: rgba(154,74,36,0.12);
  --accent-ink: #FFFFFF; --good: #1F6F4A; --good-soft: rgba(31,111,74,0.12);
  --warn: #9A5B00; --warn-soft: rgba(154,91,0,0.13); --bad: #B83232; --bad-soft: rgba(184,50,50,0.12);
  color-scheme: light;
  --topbar-bg: rgba(246,243,239,0.86); --bnav-bg: rgba(255,255,255,0.90);
  --border: rgba(28,22,19,0.10); --shadow: 0 2px 12px rgba(28,22,19,0.05), 0 1px 2px rgba(28,22,19,0.04);
  --card-highlight: inset 0 1px 0 rgba(255,255,255,0.85);
  --radius-card: 22px; --radius-pill: 999px;
  --font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-display: 'Manrope', 'Inter', system-ui, -apple-system, sans-serif;
}
html[data-theme="dark"] {
  --bg: #121110; --surface: #1C1A18; --surface-2: #262320; --card: #191715;
  --ink: #F5EFEA; --muted: #B5A89E; --accent: #E29D6C; --accent-soft: rgba(226,157,108,0.16);
  --accent-ink: #1C120B; --good: #7BD4A4; --good-soft: rgba(123,212,164,0.15);
  --warn: #F2BE68; --warn-soft: rgba(242,190,104,0.15); --bad: #F29B9B; --bad-soft: rgba(242,155,155,0.15);
  color-scheme: dark;
  --topbar-bg: rgba(18,17,16,0.86); --bnav-bg: rgba(25,23,21,0.90);
  --border: rgba(245,239,234,0.11); --shadow: 0 4px 18px rgba(0,0,0,0.34);
  --card-highlight: inset 0 1px 0 rgba(255,245,238,0.05);
}
* { box-sizing: border-box; }
html, body { margin:0; padding:0; background:var(--bg); color:var(--ink); font-family:var(--font); font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased; transition:background .2s,color .2s; }
button, input, select, textarea { font-family:inherit; color:inherit; }
button { cursor:pointer; border:none; background:transparent; }
.topbar { position:sticky; top:0; z-index:40; background:var(--bg); border-bottom:1px solid var(--border); padding:10px 18px; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; max-width:100%; }
.brand { display:flex; align-items:center; gap:10px; }
.brand-dot { width:36px; height:36px; border-radius:14px; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; font-weight:800; font-size:15px; }
.brand-title { font-weight:700; font-size:16px; }
.brand-sub { font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.live-pill { display:inline-flex; align-items:center; gap:5px; padding:2px 9px; border-radius:999px; background:var(--good-soft); color:var(--good); font-weight:600; font-size:11px; }
.live-dot { width:7px; height:7px; border-radius:50%; background:currentColor; }
.top-actions { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.chip-btn { padding:7px 13px; border-radius:999px; background:var(--surface); border:1px solid var(--border); font-size:12.5px; font-weight:600; display:inline-flex; align-items:center; gap:6px; }
.chip-btn:hover { background:var(--surface-2); }
.chip-btn.accent { background:var(--accent); color:var(--accent-ink); border-color:transparent; }
.chip-btn.good { background:var(--good-soft); color:var(--good); border-color:transparent; }
.chip-btn.bad { background:var(--bad-soft); color:var(--bad); border-color:transparent; }
.chip-btn.warn { background:var(--warn-soft); color:var(--warn); border-color:transparent; }
.seg { display:inline-flex; background:var(--surface); padding:4px; border-radius:999px; border:1px solid var(--border); gap:2px; }
.seg button { padding:6px 12px; border-radius:999px; font-size:12.5px; font-weight:600; color:var(--muted); }
.seg button.active { background:var(--accent); color:var(--accent-ink); }
.card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius-card); padding:18px; box-shadow:var(--shadow); }
.card-soft { background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:12px 14px; }
.card-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
.card-title { font-size:16px; font-weight:700; margin:0; }
.card-sub { font-size:12px; color:var(--muted); }
.badge { display:inline-flex; align-items:center; justify-content:center; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:700; background:var(--surface-2); color:var(--ink); }
.badge.good { background:var(--good-soft); color:var(--good); }
.badge.warn { background:var(--warn-soft); color:var(--warn); }
.badge.bad { background:var(--bad-soft); color:var(--bad); }
.badge.accent { background:var(--accent-soft); color:var(--accent); }
.stack { display:flex; flex-direction:column; gap:10px; }
.row-item { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 14px; border-radius:18px; background:var(--surface); border:1px solid var(--border); flex-wrap:wrap; }
.row-main { min-width:0; flex:1; }
.row-title { font-weight:700; font-size:14px; }
.row-sub { font-size:12px; color:var(--muted); margin-top:2px; }
.pbar { height:7px; background:var(--surface-2); border-radius:99px; overflow:hidden; margin-top:6px; }
.pbar > div { height:100%; background:var(--accent); border-radius:99px; transition:width .25s; }
.pbar.good > div { background:var(--good); }
.field { display:flex; flex-direction:column; gap:5px; margin-bottom:10px; }
.field label { font-size:12px; font-weight:700; color:var(--muted); }
.field input, .field select, .field textarea { width:100%; padding:9px 12px; border-radius:14px; background:var(--surface); border:1px solid var(--border); font-size:14px; }
.grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.grid-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
@media (max-width:640px) { .grid-2, .grid-3 { grid-template-columns:1fr; } }
.btn-lg { width:100%; padding:12px 16px; border-radius:999px; font-size:14px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; gap:8px; }
.btn-lg.primary { background:var(--accent); color:var(--accent-ink); }
.btn-lg.primary:disabled { opacity:0.45; cursor:not-allowed; }
.btn-lg.danger { background:var(--bad-soft); color:var(--bad); }
.btn-lg.soft { background:var(--surface-2); color:var(--ink); }
.tbl-wrap { overflow-x:auto; }
table { width:100%; border-collapse:collapse; font-size:13.5px; }
th, td { text-align:left; padding:9px 10px; border-bottom:1px solid var(--border); vertical-align:middle; }
th { font-size:11.5px; text-transform:uppercase; letter-spacing:0.03em; color:var(--muted); font-weight:700; }
tr:last-child td { border-bottom:none; }
.modal-bg { position:fixed; inset:0; background:rgba(0,0,0,0.48); z-index:80; display:none; align-items:center; justify-content:center; padding:16px; }
.modal-bg.open { display:flex; }
.modal-card { background:var(--card); border:1px solid var(--border); border-radius:28px; max-width:480px; width:100%; padding:20px; box-shadow:0 20px 50px rgba(0,0,0,0.3); max-height:86vh; overflow-y:auto; }
.toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:999px; font-size:13.5px; font-weight:600; opacity:0; pointer-events:none; z-index:90; transition:opacity .2s,transform .2s; box-shadow:0 8px 24px rgba(0,0,0,0.22); }
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

.wrap { max-width: 1200px; margin: 0 auto; padding: 18px; }
.admin-nav { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px; }
.admin-nav button { padding:9px 16px; border-radius:999px; background:var(--surface); border:1px solid var(--border); font-size:13.5px; font-weight:600; color:var(--muted); display:inline-flex; align-items:center; gap:6px; }
.admin-nav button.active { background:var(--accent); color:var(--accent-ink); border-color:transparent; }
.kpi-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; margin-bottom:16px; }
@media (max-width:780px) { .kpi-grid { grid-template-columns:repeat(2,minmax(0,1fr)); } }
.kpi { background:var(--card); border:1px solid var(--border); border-radius:22px; padding:16px; box-shadow:var(--shadow); }
.kpi-lbl { font-size:12px; color:var(--muted); font-weight:600; }
.kpi-val { font-size:24px; font-weight:800; margin:4px 0 2px; }
.kpi-meta { font-size:12px; color:var(--muted); }
.chart-scroll { width:100%; overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:6px; }
.chart-scroll::-webkit-scrollbar { height:6px; }
.chart-scroll::-webkit-scrollbar-thumb { background:var(--border); border-radius:999px; }
.chart-wrap { position:relative; display:flex; flex-wrap:nowrap; align-items:stretch; gap:10px; height:228px; padding:12px 6px 4px; min-width:100%; width:max-content; }
.chart-plan-line { position:absolute; left:0; right:0; border-top:1.5px dashed var(--accent); opacity:0.65; pointer-events:none; z-index:2; }
.chart-plan-lbl { position:absolute; right:6px; top:-22px; font-size:11px; font-weight:700; color:var(--accent); background:var(--card); border:1px solid var(--border); padding:2px 8px; border-radius:999px; white-space:nowrap; box-shadow:0 2px 8px rgba(0,0,0,0.18); }
.bar-col { flex:1 0 64px; max-width:108px; display:flex; flex-direction:column; align-items:center; gap:6px; height:100%; position:relative; z-index:1; }
.bar-val { font-size:11px; font-weight:700; color:var(--ink); white-space:nowrap; line-height:1.15; height:15px; display:flex; align-items:center; }
.bar-track { flex:1; width:100%; display:flex; align-items:flex-end; justify-content:center; min-height:110px; }
.bar-fill { width:72%; max-width:42px; min-width:22px; border-radius:10px 10px 4px 4px; background:var(--accent); transition:height .25s ease, opacity .15s ease; }
.bar-fill.hit { background:var(--good); }
.bar-col:hover .bar-fill { opacity:.86; }
.bar-dt { font-size:11px; color:var(--muted); font-weight:600; white-space:nowrap; line-height:1.15; height:16px; display:flex; align-items:center; }
.chart-ctrl { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.chart-gran { display:inline-flex; background:var(--surface); padding:3px; border-radius:999px; border:1px solid var(--border); gap:2px; }
.chart-gran button { padding:4px 10px; border-radius:999px; font-size:11.5px; font-weight:600; color:var(--muted); }
.chart-gran button.active { background:var(--accent); color:var(--accent-ink); }

  .date-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:0 0 14px;padding:10px 12px;border-radius:16px;background:var(--surface);border:1px solid var(--border);}
  .date-pills{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .date-pill{border:1px solid var(--border);background:transparent;color:var(--muted);padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:600;cursor:pointer;transition:.15s;}
  .date-pill:hover{color:var(--ink);border-color:var(--accent);}
  .date-pill.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
  .date-custom{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .date-custom input[type="date"]{background:var(--bg);color:var(--ink);border:1px solid var(--border);border-radius:10px;padding:5px 9px;font-size:12.5px;font-family:inherit;}
  .date-range-lbl{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap;}

/* === Coffee Illy v93.1 Responsive System (Phones · Tablets · Desktop) === */
html { -webkit-text-size-adjust: 100%; }
body { overflow-x: hidden; padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right); }
.kpi-val, .bar-val, td, .badge { font-variant-numeric: tabular-nums; }
.chip-btn, .admin-nav button, .date-pill, .btn-lg, .pin-key, .bnav button {
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  transition: background .16s ease, transform .1s ease, border-color .16s ease, box-shadow .16s ease;
}
.chip-btn:active, .btn-lg:active, .pin-key:active { transform: scale(0.98); }
.tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 14px; }
.tbl-wrap table { min-width: 520px; }

/* Owner Dashboard: Responsive Bento (Phone -> Tablet -> PC) */
.topbar {
  padding: max(10px, env(safe-area-inset-top)) 20px 10px;
}
.admin-nav::-webkit-scrollbar, .date-pills::-webkit-scrollbar { display: none; }

/* Phones (<= 600px) */
@media (max-width: 600px) {
  .topbar { padding: max(8px, env(safe-area-inset-top)) 12px 8px; gap: 8px; }
  .brand-dot { width: 34px; height: 34px; border-radius: 12px; font-size: 14px; }
  .brand-title { font-size: 14.5px; line-height: 1.2; }
  .top-actions { width: 100%; gap: 6px; overflow-x: auto; flex-wrap: nowrap; scrollbar-width: none; padding-bottom: 2px; }
  .top-actions::-webkit-scrollbar { display: none; }
  .top-actions .chip-btn { flex: 0 0 auto; min-height: 36px; padding: 6px 11px; font-size: 12px; white-space: nowrap; }
  .wrap { padding: 12px 12px calc(24px + env(safe-area-inset-bottom)); }
  .admin-nav {
    flex-wrap: nowrap;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    gap: 6px;
    margin-bottom: 12px;
    padding-bottom: 4px;
  }
  .admin-nav button { flex: 0 0 auto; white-space: nowrap; min-height: 40px; padding: 8px 13px; font-size: 13px; }
  .date-bar { padding: 10px; gap: 8px; }
  .date-pills { flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; width: 100%; }
  .date-pill { flex: 0 0 auto; white-space: nowrap; min-height: 34px; }
  .date-custom { width: 100%; justify-content: space-between; }
  .date-custom input[type="date"] { flex: 1; min-width: 0; font-size: 14px; min-height: 38px; }
  .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-bottom: 12px; }
  .kpi { padding: 13px 12px; border-radius: 18px; }
  .kpi-val { font-size: clamp(18px, 5vw, 22px); }
  .kpi-lbl, .kpi-meta { font-size: 11.5px; }
  .card { padding: 14px; border-radius: 20px; }
  .card-title { font-size: 15px; }
  .chart-wrap { height: 205px; }
  .bar-col { flex: 1 0 54px; }
  .field input, .field select, .field textarea { font-size: 16px; min-height: 44px; }
  .btn-lg { min-height: 46px; }
  th, td { padding: 8px 8px; font-size: 12.5px; }
  .row-item { padding: 11px 12px; }
  .modal-bg { align-items: flex-end; padding: 0; }
  .modal-card {
    max-width: 100%;
    border-radius: 26px 26px 0 0;
    padding: 18px 16px calc(22px + env(safe-area-inset-bottom));
    max-height: 88vh;
  }
  .toast { max-width: calc(100vw - 24px); text-align: center; }
}

/* Tablets (601px - 1024px) */
@media (min-width: 601px) and (max-width: 1024px) {
  .topbar { padding: 12px 20px; }
  .wrap { max-width: 980px; padding: 16px 20px 28px; }
  .admin-nav { gap: 6px; }
  .admin-nav button { min-height: 40px; padding: 8px 14px; font-size: 13px; }
  .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .card { padding: 18px; }
}
@media (min-width: 860px) and (max-width: 1024px) {
  .kpi-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}

/* Desktop / PC (>= 1025px) */
@media (min-width: 1025px) {
  .topbar { padding: 12px 28px; }
  .wrap { max-width: 1320px; padding: 20px 28px 36px; }
  .kpi-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
  .kpi { padding: 18px 20px; }
  .kpi-val { font-size: 26px; }
  .card { padding: 22px; }
  .chart-wrap { height: 236px; }
  .tbl-wrap table { min-width: 0; }
}

  th.sortable { cursor:pointer; user-select:none; white-space:nowrap; transition:color .15s ease; }
  th.sortable:hover { color:var(--accent); }
  th.sortable.active { color:var(--accent); }
  .sort-ind { font-size:10px; opacity:.65; margin-left:3px; }
  th.sortable.active .sort-ind { opacity:1; }

/* === Modern Typography & Cross-Platform Surface Polish (v97.14.4) === */
body { line-height: 1.5; letter-spacing: -0.005em; min-height: 100dvh; }
.brand-title, .card-title, .kpi-val, .btn-lg, h1, h2, h3 { font-family: var(--font-display); letter-spacing: -0.018em; }
.topbar { background: var(--topbar-bg); backdrop-filter: blur(14px) saturate(160%); -webkit-backdrop-filter: blur(14px) saturate(160%); }
.card, .kpi { box-shadow: var(--shadow), var(--card-highlight); }
.modal-bg { backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
tbody tr { transition: background .14s ease; }
@media (hover: hover) and (pointer: fine) {
  tbody tr:hover { background: var(--surface); }
}
.field input:focus, .field select:focus, .field textarea:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
</style>

<body>
<header class="topbar">
  <div class="brand">
    <div class="brand-dot">CI</div>
    <div>
      <div class="brand-title">Дашборд владельца · <span id="hdr-loc">Кофейня №1</span></div>
      <div class="brand-sub">
        <span class="live-pill"><span class="live-dot"></span><span id="hdr-rev">DATA_REV #1</span></span>
        <span>Кофейня · Управление</span>
      </div>
    </div>
  </div>
  <div class="top-actions">
    <span class="chip-btn" id="hdr-clock" style="cursor:default;">🕒 --:--</span>
    <button class="chip-btn good" id="btn-lock" aria-label="Статус сессии владельца">🔓 Админ-сессия</button>
    <button class="chip-btn" id="btn-theme" aria-label="Переключить тему оформления">🌓 Авто</button>
    <button class="chip-btn" id="btn-reset" aria-label="Обновить данные из облака">↻ Обновить</button>
  </div>
</header>

<main class="wrap">
  <nav class="admin-nav" id="admin-nav">
    <button class="active" data-tab="overview">Обзор</button>
    <button data-tab="sales">Продажи <span class="badge" id="cnt-sales">0</span></button>
    <button data-tab="finances">Финансы <span class="badge" id="cnt-fin">0</span></button>
    <button data-tab="warehouse">Склад <span class="badge" id="cnt-wh">0</span></button>
    <button data-tab="checklists">Чек-листы <span class="badge" id="cnt-chk">0</span></button>
    <button data-tab="incidents">Поломки <span class="badge bad" id="cnt-inc">0</span></button>
    <button data-tab="team">Команда и ТТК</button>
    <button data-tab="settings">Управление</button>
  </nav>
  <div id="date-filter-bar" class="date-bar"></div>
  <div id="content"></div>
</main>

<div class="modal-bg" id="modal-bg">
  <div class="modal-card">
    <div class="card-head" style="margin-bottom:10px;"><h3 class="card-title" id="modal-title"></h3><button class="chip-btn" id="modal-close">✕</button></div>
    <div id="modal-body"></div>
  </div>
</div>

<script>

function fmtRub(n) { return (Number(n) || 0).toLocaleString('ru-RU') + ' ₽'; }
function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function toMin(hhmm) { const m = String(hhmm || '00:00').match(/(\d{1,2}):(\d{2})/); return m ? Number(m[1])*60 + Number(m[2]) : 0; }
function optList(arr, sel, fn) {

  return v.map(x => `<option value="${esc(x)}" ${String(x)===String(sel)?'selected':''}>${esc(fn ? fn(x) : x)}</option>`).join('');

function initTheme(btnId) {
  const mql = window.matchMedia('(prefers-color-scheme: dark)');
  let mode = 'auto';
  try { mode = localStorage.getItem(THEME_KEY) || 'auto'; } catch(_) {}
  function apply() {
    const eff = mode === 'auto' ? (mql.matches ? 'dark' : 'light') : mode;
    document.documentElement.setAttribute('data-theme', eff);
    const b = document.getElementById(btnId);
    if (b) b.textContent = mode === 'auto' ? '🌓 Авто' : (mode === 'light' ? '☀️ Светлая' : '🌙 Тёмная');
  }
  mql.addEventListener('change', () => { if (mode === 'auto') apply(); });
  window.addEventListener('storage', (e) => { if (e.key === THEME_KEY) { mode = e.newValue || 'auto'; apply(); } });
  const b = document.getElementById(btnId);
  if (b) b.onclick = () => {
    mode = mode === 'auto' ? 'light' : (mode === 'light' ? 'dark' : 'auto');
    try { localStorage.setItem(THEME_KEY, mode); } catch(_) {}
    apply();
  };
  apply();
}

(function() {

  let adminUnlocked = !!(window.CoffeeCloudV93 && window.CoffeeCloudV93.getSession && window.CoffeeCloudV93.getSession().adminToken);

  function toggleSort(tbl, key, defaultDir) {
    const cur = sortState[tbl];
    if (!cur) return;
    if (cur.key === key) cur.dir = cur.dir === 'desc' ? 'asc' : 'desc';
    else { cur.key = key; cur.dir = defaultDir || 'desc'; }

  function sortTh(tbl, key, label, defaultDir) {

  function sortList(arr, dir, getter) {

    return arr.slice().sort((a, b) => {
      const va = getter(a), vb = getter(b);
      if (typeof va === 'number' && typeof vb === 'number') return (va - vb) * mult;
      return String(va == null ? '' : va).localeCompare(String(vb == null ? '' : vb), 'ru', { numeric: true, sensitivity: 'base' }) * mult;
    });
  }
  let salesQuery = '';
  let whCatFilter = 'all';
  const DATE_STORE_KEY = 'coffee_illy_v93_date_range';
  function shiftIsoDate(baseIso, deltaDays) {
    const m = String(baseIso || getTodayISO()).match(/^(\d{4})-(\d{2})-(\d{2})/);
    const dt = m ? new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]) + deltaDays, 12, 0, 0) : new Date(Date.now() + deltaDays * 86400000);
    return dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');
  }
  function fmtDateRu(iso) {
    const m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
    return m ? (m[3] + '.' + m[2] + '.' + m[1]) : String(iso || '');
  }

  let chartGranularity = 'auto';

      if (savedRange.to) customTo = savedRange.to;

  function saveDateRangePref() {
    try { localStorage.setItem(DATE_STORE_KEY, JSON.stringify({ preset: datePreset, from: customFrom, to: customTo })); } catch (_) {}
  }
  function getActiveDateRange() {
    if (datePreset === 'today') return { from: getTodayISO(), to: getTodayISO(), label: 'Сегодня (' + fmtDateRu(getTodayISO()) + ')' };

      const y = shiftIsoDate(getTodayISO(), -1);
      return { from: y, to: y, label: 'Вчера (' + fmtDateRu(y) + ')' };

    if (datePreset === '7d') {
      const f = shiftIsoDate(getTodayISO(), -6);
      return { from: f, to: getTodayISO(), label: '7 дней (' + fmtDateRu(f) + ' – ' + fmtDateRu(getTodayISO()) + ')' };
    }
    if (datePreset === '30d') {
      const f = shiftIsoDate(getTodayISO(), -29);
      return { from: f, to: getTodayISO(), spanDays: 30, label: '30 дней (' + fmtDateRu(f) + ' – ' + fmtDateRu(getTodayISO()) + ')' };
    }
    if (datePreset === '90d') {
      const f = shiftIsoDate(getTodayISO(), -89);
      return { from: f, to: getTodayISO(), spanDays: 90, label: '90 дней (' + fmtDateRu(f) + ' – ' + fmtDateRu(getTodayISO()) + ')' };
    }
    if (datePreset === 'all') {
      return { from: '2000-01-01', to: '2099-12-31', isAll: true, spanDays: 365, label: 'Всё время' };
    }
    let f = customFrom || shiftIsoDate(getTodayISO(), -6);
    let t = customTo || getTodayISO();
    if (f > t) { const tmp = f; f = t; t = tmp; }
    const d1 = new Date(f + 'T12:00:00');
    const d2 = new Date(t + 'T12:00:00');
    const span = Math.max(1, Math.round((d2 - d1) / 86400000) + 1);
    return { from: f, to: t, spanDays: span, label: fmtDateRu(f) + ' – ' + fmtDateRu(t) + ' (' + span + ' дн.)' };
  }
  function inDateRange(dateStr, rng) {
    if (rng && rng.isAll) return true;
    const d = String(dateStr || '').slice(0, 10);
    if (!d) return false;
    return d >= rng.from && d <= rng.to;
  }
  function renderDateBar(rng) {
    const bar = document.getElementById('date-filter-bar');
    if (!bar) return;

  initTheme('btn-theme');

  function extractDriveFileId(url) {
    const s = String(url || '').trim();
    let m = s.match(/\/file\/d\/([A-Za-z0-9_-]{10,})/);
    if (m) return m[1];

  function openReportModal(fCash, fExpenses, fChecklists, fIncidents, rngLabel) {

    const avg = checksSum ? Math.round(rev / checksSum) : 0;

      if (!entered) return;
      if (!window.CoffeeCloudV93 || !window.CoffeeCloudV93.authLogin) {
        showToast('Сервер авторизации недоступен — вход владельца невозможен');
        return;
      }
      if (typeof navigator !== 'undefined' && navigator.onLine === false) {
        showToast('Нет подключения к интернету — вход владельца требует связи с сервером');
        return;
      }
      if (btn) { btn.disabled = true; btn.textContent = 'Проверка PIN...'; }
      try {
        const res = await window.CoffeeCloudV93.authLogin('admin', { pin: entered });
        if (res && res.ok === true && res.sessionToken) {
          adminUnlocked = true; adminAuthNeeded = false;
          closeModal(); showToast('🔓 Живая сессия владельца активна');
          if (cloudLoop && cloudLoop.pullNow) await cloudLoop.pullNow(true);
          fn(); render();
          return;
        }
        showToast((res && res.offline) ? 'Сервер недоступен' : ((res && res.error) ? String(res.error).replace(/^[A-Z_]+:\s*/, '') : 'Неверный PIN владельца'));
      } catch (err) {
        showToast('Сетевая ошибка входа: ' + ((err && err.message) || 'повторите'));
      } finally {
        if (btn) { btn.disabled = false; btn.textContent = 'Подтвердить и загрузить данные'; }
      }
    };
  }

  const DAYS_RU = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
  function getWeekdayRu(isoStr) {
    const m = String(isoStr || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (!m) return DAYS_RU[new Date().getDay()];
    const dt = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]), 12, 0, 0);
    return DAYS_RU[dt.getDay()];
  }
  function getDayPlan(isoOrDay) {
    const dayKey = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].includes(isoOrDay) ? isoOrDay : getWeekdayRu(isoOrDay);
    const found = (state.plans || []).find(p => p && p.day === dayKey);
    const rev = Number((found && (found.rev || found.revenue)) || state.plan || 2200);
    const checks = Number((found && found.checks) || state.planChecks || 75);
    const avg = Number((found && (found.avg || found.avgCheck)) || state.minAvgCheck || 35);
    return { day: dayKey, rev, checks, avg, roster: (found && found.roster) || '' };
  }
  function blockTasks(nm) { return state.tasks.filter(t => t.block === nm); }
  function getBlkSt(b) {
    if (b.active === false) return { label:'Отключён', cls:'', open:false };
    if (state.extensions[b.name] && state.extensions[b.name].forceOpen) return { label:'Открыт админом до 23:59', cls:'good', open:true };
    const now = toMin(window.CoffeeCloudV93 ? window.CoffeeCloudV93.localHHMM() : '12:00');
    if (now < toMin(b.openTime)) return { label:'Откроется в ' + b.openTime, cls:'', open:false };
    if (now > toMin(b.deadline)) return { label:'Закрыт (' + b.deadline + ')', cls:'bad', open:false };
    return { label:'Открыт до ' + b.deadline, cls:'accent', open:true };
  }

  function render() {
    document.getElementById('hdr-loc').textContent = state.location;
    document.getElementById('hdr-rev').textContent = (state.liveConnected ? 'Онлайн' : 'Ожидание') + (state.lastSyncAt ? ' · ' + state.lastSyncAt : '');
    const _clkEl = document.getElementById('hdr-clock'); if (_clkEl) _clkEl.textContent = '🕒 ' + (window.CoffeeCloudV93 ? window.CoffeeCloudV93.localHHMM() : '');
    const lb = document.getElementById('btn-lock');
    lb.textContent = adminUnlocked ? '🔓 Админ-сессия' : '🔒 Защищено PIN';
    lb.className = 'chip-btn ' + (adminUnlocked ? 'good' : 'warn');

    const rng = getActiveDateRange();
    renderDateBar(rng);
    const fCash = (state.cash || []).filter(c => inDateRange(c.date, rng));
    const fExpenses = (state.expenses || []).filter(e => inDateRange(e.date, rng));
    const fChecklists = (state.checklists || []).filter(c => inDateRange(c.date, rng));
    const fIncidents = (state.incidents || []).filter(i => inDateRange(i.date, rng));
    const fSales = (state.salesLog || []).filter(s => inDateRange(s.date, rng));
    const fInvMoves = (state.inventoryMoves || []).filter(m => inDateRange(m.date, rng));
    const fExpiry = (state.expiryItems || []).filter(x => !x.date || inDateRange(x.date, rng) || inDateRange(x.expiresDate, rng));
    const fAudit = (state.auditLog || []).filter(a => !a.date || inDateRange(a.date, rng));
    const invAll = state.inventory || [];
    const lowStockCount = invAll.filter(it => Number(it.stock || 0) <= Number(it.minStock || 0)).length;

    const cashRev = (c) => {
      const r = Number(c && (c.revenue != null ? c.revenue : (c.total != null ? c.total : ((Number(c.cash)||0) + (Number(c.card)||0)))));
      return Number.isFinite(r) ? r : 0;
    };
    fCash.forEach(c => { if (c && (c.revenue == null || isNaN(Number(c.revenue)))) c.revenue = cashRev(c); });
    const totalRev = fCash.reduce((a,c)=>a+cashRev(c),0);
    const totalExp = fExpenses.reduce((a,e)=>a+e.amount,0);
    const openIncs = fIncidents.filter(i=>i.status!=='Решена').length;
    const salesQtyTotal = fSales.reduce((a, s) => a + (Number(s.qty) || 0), 0);
    document.getElementById('cnt-chk').textContent = fChecklists.length;
    document.getElementById('cnt-fin').textContent = fCash.length;
    document.getElementById('cnt-inc').textContent = openIncs;
    const csEl = document.getElementById('cnt-sales'); if (csEl) csEl.textContent = salesQtyTotal || fSales.length;
    const cwEl = document.getElementById('cnt-wh'); if (cwEl) { cwEl.textContent = lowStockCount ? ('!' + lowStockCount) : invAll.length; cwEl.className = 'badge ' + (lowStockCount ? 'bad' : ''); }
    document.querySelectorAll('#admin-nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));

    const root = document.getElementById('content');
    if (tab === 'overview') {
      const syncBanner = !state.liveConnected
        ? `<div class="card-soft" style="margin-bottom:14px;border:1px solid var(--accent);display:flex;justify-content:space-between;align-items:center;gap:10px;"><span>🔄 Загружаем актуальные данные из Google Таблицы Coffee_illy...</span></div>`
        : (adminAuthNeeded
          ? `<div class="card-soft" style="margin-bottom:14px;border:1px solid var(--warn);display:flex;justify-content:space-between;align-items:center;gap:10px;"><span>🔒 Войдите по PIN владельца, чтобы подтянуть живую кассу, расходы и поломки из Google Таблицы.</span><button class="chip-btn accent" id="ov-unlock">Войти по PIN</button></div>`
          : '');
      const todayPlan = getDayPlan(getTodayISO());
      const totalPlanRev = fCash.reduce((a, c) => a + getDayPlan(c.date).rev, 0);
      const totalChecks = fCash.reduce((a, c) => a + (Number(c.checks) || 0), 0);
      const totalPlanChecks = fCash.reduce((a, c) => a + getDayPlan(c.date).checks, 0);
      const actualAvgCheck = totalChecks > 0 ? Math.round(totalRev / totalChecks) : 0;
      const targetAvgCheck = fCash.length ? Math.round(fCash.reduce((a, c) => a + getDayPlan(c.date).avg, 0) / fCash.length) : todayPlan.avg;
      const revPlanPct = totalPlanRev > 0 ? Math.round((totalRev / totalPlanRev) * 100) : 0;
      const checksPlanPct = totalPlanChecks > 0 ? Math.round((totalChecks / totalPlanChecks) * 100) : 0;
      const sortedCash = fCash.slice().sort((a, b) => String(a.date).localeCompare(String(b.date)));
      const effectiveSpan = rng.spanDays || (sortedCash.length > 1
        ? Math.max(1, Math.round((new Date(sortedCash[sortedCash.length - 1].date + 'T12:00:00') - new Date(sortedCash[0].date + 'T12:00:00')) / 86400000) + 1)
        : 1);
      const effGran = chartGranularity === 'auto'
        ? (effectiveSpan > 120 && sortedCash.length > 35 ? 'month' : (effectiveSpan > 31 && sortedCash.length > 18 ? 'week' : 'day'))
        : chartGranularity;
      const monthNamesRu = ['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];
      function buildChartSeries(list, gran) {
        if (gran === 'day') {
          return list.map(c => {
            const revVal = cashRev(c);
            const dp = getDayPlan(c.date);
            const avgC = c.checks ? Math.round(revVal / c.checks) : 0;
            const pct = dp.rev > 0 ? Math.round((revVal / dp.rev) * 100) : 0;
            return {
              label: dp.day + ' ' + c.date.slice(8) + '.' + c.date.slice(5, 7),
              rev: revVal,
              plan: dp.rev,
              hit: revVal >= dp.rev,
              shifts: 1,
              tip: `${dp.day} ${fmtDateRu(c.date)} · Выручка: ${fmtRub(revVal)} / ${fmtRub(dp.rev)} (${pct}%) · Чеки: ${c.checks}/${dp.checks} · Ср. чек: ${avgC} ₽`
            };
          });
        }
        const map = new Map();
        list.forEach(c => {
          const revVal = cashRev(c);
          const dp = getDayPlan(c.date);
          const dt = new Date(c.date + 'T12:00:00');
          let key = c.date.slice(0, 7);
          let lbl = (monthNamesRu[dt.getMonth()] || '') + ' ' + String(dt.getFullYear()).slice(2);
          if (gran === 'week') {
            const dayIdx = (dt.getDay() + 6) % 7;
            const mon = new Date(dt.getTime() - dayIdx * 86400000);
            const sun = new Date(mon.getTime() + 6 * 86400000);
            key = mon.toISOString().slice(0, 10);
            lbl = String(mon.getDate()).padStart(2, '0') + '.' + String(mon.getMonth() + 1).padStart(2, '0') + '–' + String(sun.getDate()).padStart(2, '0') + '.' + String(sun.getMonth() + 1).padStart(2, '0');
          }
          const cur = map.get(key) || { key, label: lbl, rev: 0, plan: 0, checks: 0, shifts: 0 };
          cur.rev += revVal;
          cur.plan += dp.rev;
          cur.checks += (Number(c.checks) || 0);
          cur.shifts += 1;
          map.set(key, cur);
        });
        return Array.from(map.values()).map(g => {
          const pct = g.plan > 0 ? Math.round((g.rev / g.plan) * 100) : 0;
          const avgC = g.checks > 0 ? Math.round(g.rev / g.checks) : 0;
          return {
            label: g.label,
            rev: g.rev,
            plan: g.plan,
            hit: g.rev >= g.plan,
            shifts: g.shifts,
            tip: `${g.label} (${g.shifts} смен) · Выручка: ${fmtRub(g.rev)} / План: ${fmtRub(g.plan)} (${pct}%) · Чеки: ${g.checks} · Ср. чек: ${avgC} ₽`
          };
        });
      }
      const chartPts = buildChartSeries(sortedCash, effGran);
      const refPlanVal = effGran === 'day'
        ? todayPlan.rev
        : (chartPts.length ? Math.round(chartPts.reduce((a, p) => a + p.plan, 0) / chartPts.length) : todayPlan.rev);
      const maxRev = Math.max(refPlanVal, ...chartPts.map(p => p.rev), 1);
      const avgBucketRev = chartPts.length ? Math.round(chartPts.reduce((a, p) => a + p.rev, 0) / chartPts.length) : 0;
      const planTrackPct = Math.min(92, Math.max(8, Math.round((refPlanVal / maxRev) * 100)));
      const chartTitle = effGran === 'month' ? 'Динамика выручки по месяцам' : (effGran === 'week' ? 'Динамика выручки по неделям' : 'Динамика выручки по дням');
      const planRefLabel = effGran === 'day' ? `План (${todayPlan.day}): ${fmtRub(refPlanVal)}` : `Ср. план: ${fmtRub(refPlanVal)}`;
      root.innerHTML = syncBanner + `
        <div class="kpi-grid">
          <div class="kpi"><div class="kpi-lbl">Выручка (${fCash.length} смен)</div><div class="kpi-val">${fmtRub(totalRev)}</div><div class="kpi-meta">План по дням: ${fmtRub(totalPlanRev)} (<b style="color:${revPlanPct>=100?'var(--good)':'var(--accent)'}">${revPlanPct}%</b>) · Сегодня (${todayPlan.day}): ${fmtRub(todayPlan.rev)}</div></div>
          <div class="kpi"><div class="kpi-lbl">Чеки и средний чек</div><div class="kpi-val" style="color:${actualAvgCheck>=targetAvgCheck?'var(--good)':'var(--accent)'}">${actualAvgCheck} ₽</div><div class="kpi-meta">Чеков: <b>${totalChecks}</b> / ${totalPlanChecks} (${checksPlanPct}%) · Мин. ср. чек (${todayPlan.day}): ${todayPlan.avg} ₽</div></div>
          <div class="kpi"><div class="kpi-lbl">Чистый итог</div><div class="kpi-val" style="color:var(--good)">${fmtRub(totalRev-totalExp)}</div><div class="kpi-meta">Расходы: ${fmtRub(totalExp)} · Чек-листов: ${fChecklists.length}</div></div>
          <div class="kpi"><div class="kpi-lbl">Открытые поломки</div><div class="kpi-val" style="color:${openIncs?'var(--bad)':'var(--good)'}">${openIncs}</div><div class="kpi-meta">За период: ${fIncidents.length} · Задач: ${state.tasks.length}</div></div>
        </div>
        <div class="card" style="margin-bottom:16px;">
          <div class="card-head">
            <div>
              <h2 class="card-title">${chartTitle}</h2>
              <div class="card-sub">${planRefLabel} · Средняя: ${fmtRub(avgBucketRev)} · Макс.: ${fmtRub(maxRev)} · Период: ${esc(rng.label)}</div>
            </div>
            <div class="chart-ctrl">
              <div class="chart-gran" id="chart-gran-ctrl">
                <button class="${chartGranularity==='auto'?'active':''}" data-cg="auto">Авто</button>
                <button class="${chartGranularity==='day'?'active':''}" data-cg="day">Дни</button>
                <button class="${chartGranularity==='week'?'active':''}" data-cg="week">Недели</button>
                <button class="${chartGranularity==='month'?'active':''}" data-cg="month">Месяцы</button>
              </div>
              <div style="display:flex;gap:10px;align-items:center;font-size:11.5px;color:var(--muted);flex-wrap:wrap;">
                <span><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--good);margin-right:4px;"></span>План выполнен</span>
                <span><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--accent);margin-right:4px;"></span>Ниже плана</span>
              </div>
            </div>
          </div>
          <div class="chart-scroll">
            <div class="chart-wrap">
              ${chartPts.length ? `<div class="chart-plan-line" style="bottom:calc(28px + ${planTrackPct}% * 0.72)"><span class="chart-plan-lbl">${esc(planRefLabel)}</span></div>` : ''}
              ${chartPts.length ? chartPts.map(p => {
                const hPct = p.rev > 0 ? Math.max(8, Math.round((p.rev / maxRev) * 100)) : 4;
                return `<div class="bar-col" title="${esc(p.tip)}"><div class="bar-val">${p.rev.toLocaleString('ru-RU')} ₽</div><div class="bar-track"><div class="bar-fill ${p.hit?'hit':''}" style="height:${hPct}%;"></div></div><div class="bar-dt">${esc(p.label)}</div></div>`;
              }).join('') : `<div style="width:100%;text-align:center;color:var(--muted);font-size:13px;padding:48px 0;">Нет закрытых смен за выбранный период (${esc(rng.label)})</div>`}
            </div>
          </div>
        </div>
        ${(() => {
          const posRev = fSales.reduce((a, s) => a + (Number(s.sum) || 0), 0);
          const posQty = fSales.reduce((a, s) => a + (Number(s.qty) || 0), 0);
          const csvShiftCount = fCash.filter(c => (Array.isArray(c.csvHashes) && c.csvHashes.length > 0) || (Array.isArray(c.products) && c.products.length > 0)).length;
          const manualCash = fCash.filter(c => !(Array.isArray(c.csvHashes) && c.csvHashes.length > 0) && !(Array.isArray(c.products) && c.products.length > 0));
          const manualRev = manualCash.reduce((a, c) => a + (Number(c.revenue) || 0), 0);
          const diff = totalRev - posRev;
          const covPct = totalRev > 0 ? Math.min(100, Math.round((posRev / totalRev) * 100)) : 0;

          return `<div class="card" style="margin-bottom:16px;">
            <div class="card-head"><div><h2 class="card-title">Сверка: POS-отчёты (CSV) vs Ручной ввод</h2><div class="card-sub">Автоматическое сравнение загруженных выписок и кассовых смен за период (${esc(rng.label)})</div></div></div>

                <div style="font-size:20px;font-weight:800;margin:4px 0;color:${diffCol};">${diffStr}</div>
                <div class="kpi-meta">Покрытие CSV: <b>${covPct}%</b></div>

        <div class="card">
          <div class="card-head"><div><h2 class="card-title">Команда на смене</h2></div></div>
          <div class="stack">
            ${state.staff.filter(s=>s.active!==false).map(s => {
              const pr = (state.staffPresence || {})[s.name];
              const isOn = !!(pr && pr.status === 'on_shift');
              const doneToday = state.checklists.filter(c => c.date === getTodayISO() && c.who === s.name).length;
              const openBlocksCnt = Math.max(1, state.blocks.filter(b => !b.isCash && b.active !== false).length);
              const pct = Math.min(100, Math.round((doneToday / openBlocksCnt) * 100));
              return `<div class="row-item"><div class="row-main">
                <div class="row-title">${esc(s.name)} <span class="badge">${esc(s.role)}</span> ${isOn ? `<span class="badge good">🟢 На работе с ${esc(pr.checkedInAt || '')}</span>` : '<span class="badge">⚪ Не на смене</span>'} ${s.tgId ? `<span class="badge accent">${esc(s.tgId)}</span>`:'<span class="badge warn">Без TG ID</span>'}</div>
                <div class="row-sub">Сдано чек-листов сегодня: <b>${doneToday}/${openBlocksCnt}</b>${(state.liveProgress && state.liveProgress[s.name]) ? (' · Сейчас: «' + esc(state.liveProgress[s.name].block) + '» ' + state.liveProgress[s.name].done + '/' + state.liveProgress[s.name].total) : ''}${isOn && pr.source ? ' · Вход: ' + esc(pr.source) : ''}</div>
                <div class="pbar ${pct===100?'good':''}"><div style="width:${pct}%"></div></div>
              </div></div>`;
            }).join('')}
          </div>
        </div>`;
      root.querySelectorAll('[data-cg]').forEach(b => b.onclick = () => { chartGranularity = b.dataset.cg; render(); });
      const _ovU = document.getElementById('ov-unlock'); if (_ovU) _ovU.onclick = () => guard('Живые данные дашборда', () => {});
      return;
    }

    if (tab === 'checklists') {
      const logs = (chkFilter === 'all' ? fChecklists : fChecklists.filter(c=>c.who===chkFilter)).slice().sort((a,b) => {
        const da = String(a.date||''), db = String(b.date||'');
        if (da !== db) return da < db ? 1 : -1;
        return String(b.time||'').padStart(5,'0').localeCompare(String(a.time||'').padStart(5,'0'));
      });
      root.innerHTML = `
        <div class="card" style="margin-bottom:16px;">

            ${state.blocks.map(b => {
              const st = getBlkSt(b);

              return `<div class="row-item" style="${b.active===false?'opacity:.55;':''}"><div class="row-main">

                ${isExt

              </div></div>`;
            }).join('')}
          </div>
        </div>
        <div class="card">
          <div class="card-head"><div><h2 class="card-title">История прохождения (${logs.length})</h2></div>
            <select id="cf" class="chip-btn"><option value="all">Все сотрудники</option>${[...new Set(state.checklists.map(c=>c.who))].map(w=>`<option value="${esc(w)}" ${chkFilter===w?'selected':''}>${esc(w)}</option>`).join('')}</select>

      root.querySelectorAll('[data-ep]').forEach(b => b.onclick = () => guard('План дня', () => {

        const sel1 = names.find(n => cleanNames[0] && (n.toLowerCase() === cleanNames[0].toLowerCase() || cleanNames[0].toLowerCase().includes(n.toLowerCase()) || n.toLowerCase().includes(cleanNames[0].toLowerCase()))) || names[0];
        const sel2 = cleanNames[1]
          ? (names.find(n => n !== sel1 && (n.toLowerCase() === cleanNames[1].toLowerCase() || cleanNames[1].toLowerCase().includes(n.toLowerCase()) || n.toLowerCase().includes(cleanNames[1].toLowerCase()))) || '')

            <div class="field"><label>Сотрудник 1</label><select id="ps">${optList(names, sel1)}</select></div>

          </div>
          <div class="field"><label>Смена / график</label><select id="ph">${optList(SHIFT_HOURS, curHr)}</select></div>

          const prevP = Object.assign({}, p);
          const rVal = Math.max(100, Number(document.getElementById('pr').value) || 2200);
          const cVal = Math.max(1, Number(document.getElementById('pc').value) || 75);
          const aVal = Math.max(1, Number(document.getElementById('pa').value) || 35);
          p.rev = rVal; p.revenue = rVal;
          p.checks = cVal;
          p.avg = aVal; p.avgCheck = aVal;
          const hr = document.getElementById('ph').value;
          const emp1 = document.getElementById('ps').value;
          const emp2 = document.getElementById('ps2').value;
          if (hr === 'Выходной') {
            p.roster = 'Выходной';
          } else {
            const whoStr = (emp2 && emp2 !== emp1) ? (emp1 + ' + ' + emp2) : emp1;
            p.roster = whoStr + ' (' + hr + ')';
          }
          const plansObj = {};
          const rosterObj = {};
          (state.plans || []).forEach(x => {

              revenue: Number(x.rev || x.revenue || state.plan || 2200),
              avgCheck: Number(x.avg || x.avgCheck || state.minAvgCheck || 35),
              checks: Number(x.checks || state.planChecks || 75)

            let res = { ok: true, queued: true };

              window.CoffeeCloudV93.markLocalMutation && window.CoffeeCloudV93.markLocalMutation();

            } else {
              saveSharedState(state, 'Администратор', 'Обновлён план ' + p.day + ' (' + rVal + ' ₽ / ' + cVal + ' чек. / ≥' + aVal + ' ₽)');
            }

              saveSharedState(state, 'Администратор', '');
              closeModal();
              showToast(res.queued
                ? ('✓ План на ' + p.day + ' сохранён локально (уйдёт в облако при связи)')

              render();
            } else {
              Object.assign(p, prevP);
              showToast('Ошибка сохранения плана: ' + ((res && res.error) || 'проверьте вход по PIN'));
            }
          } catch (err) {
            Object.assign(p, prevP);
            showToast('Сетевая ошибка сохранения плана: ' + ((err && err.message) || 'повторите'));
          } finally {
            if (btn) { btn.disabled = false; btn.textContent = 'Сохранить план на ' + p.day; }
          }
        };

      return;

    if (tab === 'incidents') {

            const sCash = fCash.filter(c => String(c.barista || c.who || '').toLowerCase() === String(s.name || '').toLowerCase());

            const sChk = fChecklists.filter(c => String(c.who || '').toLowerCase() === String(s.name || '').toLowerCase()).length;

          }).join('')}</div>
        </div>
        <div class="card">

          <div class="tbl-wrap"><table><thead><tr><th>Напиток</th><th>Объём</th><th>Цена</th><th>Ср. цена</th><th>Себест.</th><th>Маржа</th><th></th></tr></thead><tbody>
            ${state.ttk.map(k=>`<tr><td><b>${esc(k.name)}</b></td><td style="color:var(--muted)">${esc(k.vol)}</td><td>${k.price} ₽</td><td style="color:var(--muted)">${k.avgPrice!=null?k.avgPrice:k.price} ₽</td><td>${k.cost} ₽</td><td><span class="badge good">${k.price?Math.round(((k.price-k.cost)/k.price)*100):0}%</span></td><td><button class="chip-btn" data-ek="${esc(k.id)}" style="padding:4px 8px;">✏️</button></td></tr>`).join('')}
          </tbody></table></div>
        </div>`;
      document.getElementById('s-add').onclick = () => guard('Новый сотрудник', () => openStaffModal(null));
      root.querySelectorAll('[data-es]').forEach(b => b.onclick = () => guard('Изменить сотрудника', () => openStaffModal(b.dataset.es)));
      root.querySelectorAll('[data-tg-staff]').forEach(b => b.onclick = () => guard('Сообщение в Telegram', () => {
        const empName = b.dataset.tgStaff;
        openModal('Личное уведомление в Telegram: ' + empName, `
          <div class="field"><label>Текст сообщения для ${esc(empName)}</label><textarea id="tg-dm-text" rows="3" placeholder="Например: Не забудь сдать Лайн Чек 1 до 09:30!"></textarea></div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button class="btn-lg primary" id="tg-dm-send" style="flex:1;">📨 Отправить лично</button>
            <button class="chip-btn" id="tg-dm-test">🧪 Тест связи</button>
          </div>

        document.getElementById('tg-dm-send').onclick = async () => {
          const txt = document.getElementById('tg-dm-text').value.trim();
          if (!txt) { showToast('Введите текст сообщения'); return; }
          const res = window.CoffeeCloudV93 ? await window.CoffeeCloudV93.sendTelegramAlert({ targetStaffName: empName, text: '💬 <b>Сообщение от владельца</b>\n' + txt, targetPage: 'index.html', buttonText: '▶️ Открыть терминал', buttonType: 'web_app', force: true, skipDedup: true }) : null;
          closeModal();
          if (res && res.ok) showToast('📨 Отправлено лично: ' + empName);
          else showToast('Ошибка отправки: ' + ((res && (res.reason || res.error)) || 'проверьте Telegram ID'));
        };
        document.getElementById('tg-dm-test').onclick = async () => {
          const res = window.CoffeeCloudV93 ? await window.CoffeeCloudV93.testTelegramAlert({ targetStaffName: empName }) : null;

          else showToast('Ошибка теста: ' + ((res && res.telegram && (res.telegram.reason || res.telegram.error)) || (res && res.error) || 'проверьте Telegram ID'));

          <div class="kpi"><div class="kpi-lbl">Сотрудников на смене</div><div class="kpi-val" style="color:var(--accent)">${onShiftNow}</div><div class="kpi-meta">Всего активных: ${state.staff.filter(s=>s.active!==false).length}</div></div>
          <div class="kpi"><div class="kpi-lbl">События управления</div><div class="kpi-val">${fAudit.length}</div><div class="kpi-meta">Записей аудита за период</div></div>
        </div>
        <div class="card" style="margin-bottom:16px;">
          <div class="card-head"><div><h2 class="card-title">Параметры кофейни</h2><div style="font-size:12px;color:var(--muted);margin-top:2px;">Планы выручки, чеков и среднего чека настраиваются индивидуально по дням недели (Пн–Вс)</div></div><button class="chip-btn accent" id="s-open-plans">📅 Планы по дням (Пн–Вс)</button></div>
          <div class="grid-2">
            <div class="field"><label>Название точки</label><input id="sl" value="${esc(state.location)}"></div>
            <div class="field"><label>Норма списаний</label><select id="sw">${optList(WO_OPTS, state.woNorm, v=>v+'%')}</select></div>
          </div>
          <div class="grid-2">
            <div class="field"><label>Стартовый счётчик (вручную)</label><input id="sn" type="number" min="0" value="${state.initCounter}"></div>

          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button class="btn-lg primary" id="s-save" style="flex:1;">Сохранить</button>
            <button class="chip-btn good" id="s-grant-photos">🔓 Открыть доступ читателя к фото Drive</button>
            <button class="chip-btn" id="s-change-pin">🔑 Сменить PIN владельца</button>
          </div>

        <div class="card" style="margin-bottom:16px;">

          <div class="grid-2">

            <div class="field"><label>Chat ID администратора (для поломок и просрочек)</label><input id="tg-chat" value="${esc(state.tgChat || '')}" placeholder="Например: 518294012"></div>
          </div>
          <div class="field"><label>URL веб-приложения (GitHub Pages — для кнопки перехода в чек-лист)</label><input id="tg-url" value="${esc(state.webappUrl || (location.origin + location.pathname.replace(/(dashboard|owner|index)\.html$/i, '')))}" placeholder="https://username.github.io/coffee-illy/"></div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;">

              <div class="field"><label>Получатель</label><select id="tg-rcpt"><option value="__admin__">👑 Администратор</option>${(state.staff || []).filter(s => s && s.active !== false).map(s => `<option value="${esc(s.name)}">👤 ${esc(s.name)} ${s.tgId ? '(TG привязан)' : '(⚠️ TG не привязан)'}</option>`).join('')}</select></div>
              <div class="field"><label>Текст (пусто = тестовое уведомление)</label><input id="tg-direct-msg" placeholder="Например: Проверь витрину перед открытием"></div>

        </div>`;
      const sop = document.getElementById('s-open-plans'); if (sop) sop.onclick = () => { tab = 'finances'; render(); };
      document.getElementById('s-save').onclick = () => guard('Сохранить настройки', () => {
        state.location = document.getElementById('sl').value.trim() || state.location;
        state.woNorm = Number(document.getElementById('sw').value);
        state.initCounter = Math.max(0, Number(document.getElementById('sn').value)||0);
        state.photoAll = document.getElementById('sph').value === '1';
        saveSharedState(state, 'Администратор', 'Обновлены настройки точки («' + state.location + '»)');
        showToast('✓ Настройки точки сохранены'); render();
      });
      const grpBtn = document.getElementById('s-grant-photos');

        if (!window.CoffeeCloudV93 || !window.CoffeeCloudV93.grantPhotoReaderAccess) return;

          grpBtn.disabled = false;

      });
      const chPinBtn = document.getElementById('s-change-pin');
      if (chPinBtn) chPinBtn.onclick = () => guard('Сменить PIN владельца', () => {
        openModal('Сменить PIN владельца', `
          <div class="field"><label>Новый PIN (4–12 цифр)</label><input id="adm-pin-1" type="password" inputmode="numeric" autocomplete="new-password" placeholder="Например: 5839"></div>
          <div class="field"><label>Повторите новый PIN</label><input id="adm-pin-2" type="password" inputmode="numeric" autocomplete="new-password" placeholder="Повторите цифры"></div>
          <button class="btn-lg primary" id="adm-pin-save">Сохранить новый PIN</button>
        `);
        document.getElementById('adm-pin-save').onclick = async () => {
          const bSave = document.getElementById('adm-pin-save');
          const p1 = (document.getElementById('adm-pin-1').value || '').trim();
          const p2 = (document.getElementById('adm-pin-2').value || '').trim();
          if (!/^\d{4,12}$/.test(p1) || /^(\d)\1{3,}$/.test(p1)) { showToast('PIN: 4–12 цифр, не из одинаковых цифр'); return; }

          try {

  function moveTaskInBlock(blk, taskId, delta) {
    const idxs = [];
    for (let i = 0; i < state.tasks.length; i++) {
      if (state.tasks[i] && state.tasks[i].block === blk) idxs.push(i);
    }
    const pos = idxs.findIndex(idx => String(state.tasks[idx].id) === String(taskId));
    const targetPos = pos + delta;
    if (pos < 0 || targetPos < 0 || targetPos >= idxs.length) return false;
    const iA = idxs[pos], iB = idxs[targetPos];
    const tmp = state.tasks[iA];
    state.tasks[iA] = state.tasks[iB];
    state.tasks[iB] = tmp;
    const orderedIds = idxs.map(idx => String(state.tasks[idx].id));
    saveSharedState(state, 'Администратор', '');
    if (window.CoffeeCloudV93 && typeof window.CoffeeCloudV93.reorderTasks === 'function') {
      window.CoffeeCloudV93.markLocalMutation && window.CoffeeCloudV93.markLocalMutation();
      window.CoffeeCloudV93.reorderTasks(blk, orderedIds).then(res => {
        if (res && res.ok) showToast('✓ Порядок задач сохранён и отправлен в терминал');
        else showToast('Ошибка сохранения порядка: ' + ((res && res.error) || 'проверьте вход'));
      });
    }
    return true;
  }

      <div class="field"><label>Название</label><input id="kn" value="${k?esc(k.name):''}"></div>
      <div class="grid-2"><div class="field"><label>Объём</label><select id="kv">${optList(VOL_OPTS, k?k.vol:VOL_OPTS[3])}</select></div><div class="field"><label>Категория</label><select id="kc">${optList(CAT_OPTS, k?k.cat:CAT_OPTS[0])}</select></div></div>
      <div class="grid-2"><div class="field"><label>Цена продажи (₽)</label><input id="kp" type="number" min="1" value="${k?k.price:20}"></div><div class="field"><label>Средняя цена (₽)</label><input id="ka" type="number" min="0" step="0.5" value="${k?(k.avgPrice!=null?k.avgPrice:k.price):20}"></div></div>
      <div class="field"><label>Себестоимость (₽, по умолчанию 0)</label><input id="ks" type="number" min="0" step="0.1" value="${k?(Number(k.cost)||0):0}"></div>
      <div class="field"><label>Подробная рецептура (шаги, граммовки, °C)</label><textarea id="kr" rows="3">${k?esc(k.recipe):''}</textarea></div>
      <div class="field"><label>Подача и рекомендации</label><input id="kserve" value="${k?esc(k.serve||k.serving||''):''}" placeholder="Стакан, крышка, допродажа"></div>
      <button class="btn-lg primary" id="ksv">Сохранить ТТК</button>
    `);
    document.getElementById('ksv').onclick = () => {
      const nm = document.getElementById('kn').value.trim(), pr = Number(document.getElementById('kp').value)||0, avgP = Number(document.getElementById('ka').value)||pr, cs = Number(document.getElementById('ks').value)||0, sv = document.getElementById('kserve').value.trim();
      if (!nm || pr<=0) { showToast('Укажите название и цену продажи'); return; }
      if (k) { k.name=nm; k.vol=document.getElementById('kv').value; k.cat=document.getElementById('kc').value; k.price=pr; k.avgPrice=avgP; k.cost=cs; k.recipe=document.getElementById('kr').value.trim(); k.serve=sv; k.serving=sv; }
      else state.ttk.push({ id:'ttk_'+Date.now(), name:nm, vol:document.getElementById('kv').value, cat:document.getElementById('kc').value, price:pr, avgPrice:avgP, cost:cs, recipe:document.getElementById('kr').value.trim(), serve:sv, serving:sv });
      saveSharedState(state, 'Администратор', 'Обновлена ТТК ' + nm); closeModal(); showToast('✓ ТТК сохранена и отправлена в терминал'); render();
    };
  }

  // Live Cross-Tab Sync Listener (receives instant updates from Terminal!)
  function onRemoteSync() {
    const next = loadSharedState();
    if (next.rev !== state.rev) {
      state = next;
      showToast('✓ Обновлено');
      render();
    }
  }
  if (syncCh) syncCh.onmessage = onRemoteSync;
  window.addEventListener('storage', (e) => { if (e.key === STORE_KEY) onRemoteSync(); });

  document.querySelectorAll('#admin-nav button').forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); var bd = document.getElementById('body'); if (bd) { bd.classList.remove('tab-enter'); void bd.offsetWidth; bd.classList.add('tab-enter'); } });
  document.getElementById('btn-lock').onclick = async () => { if (adminUnlocked) { if (window.CoffeeCloudV93 && window.CoffeeCloudV93.authLogout) await window.CoffeeCloudV93.authLogout('admin'); adminUnlocked = false; adminAuthNeeded = true; render(); } else guard('Вход', () => {}); };
  let cloudLoop = null;
  document.getElementById('btn-reset').onclick = async () => {
    showToast('🔄 Загрузка свежих данных из Google Таблицы...');
    if (cloudLoop && cloudLoop.pullNow) {
      await cloudLoop.pullNow(true);
      showToast('✓ Данные обновлены из Google Таблицы');
      render();
    }
  };
  render();

  setInterval(() => {
    const _clk = document.getElementById('hdr-clock');
    if (_clk && window.CoffeeCloudV93) _clk.textContent = '🕒 ' + window.CoffeeCloudV93.localHHMM();
  }, 15000);
  if (window.CoffeeCloudV93) {
    cloudLoop = window.CoffeeCloudV93.startCloudLoop({
      mode: 'owner',
      getState: () => state,
      onAuthRequired: () => {
        adminUnlocked = false;
        adminAuthNeeded = true;
        render();
      },
      onSynced: (st, srvRev) => {
        if (window.CoffeeCloudV93.getSession && window.CoffeeCloudV93.getSession().adminToken) {
          adminUnlocked = true; adminAuthNeeded = false;
        }
        try {
    localStorage.setItem(STORE_KEY, JSON.stringify(st));
  } catch (qErr) {
    try {
      const slim = Object.assign({}, st, {
        salesLog: Array.isArray(st.salesLog) ? st.salesLog.slice(0, 600) : [],
        auditLog: Array.isArray(st.auditLog) ? st.auditLog.slice(0, 30) : [],
        inventoryMoves: Array.isArray(st.inventoryMoves) ? st.inventoryMoves.slice(0, 150) : []
      });
      localStorage.setItem(STORE_KEY, JSON.stringify(slim));
    } catch (_) {}
  }
        const ae = document.activeElement;
        const cEl = document.getElementById('content');
        const dfEl = document.getElementById('date-filter-bar');
        const isEditing = !!(ae && ((cEl && cEl.contains(ae)) || (dfEl && dfEl.contains(ae))) && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName));
        const modalOpen = !!(document.getElementById('modal-bg') && document.getElementById('modal-bg').classList.contains('open'));
        if (isEditing || modalOpen) {
          const revEl = document.getElementById('hdr-rev');
          if (revEl) revEl.textContent = st.liveConnected ? ('Онлайн · ' + (st.lastSyncAt || '')) : 'Офлайн';
          if (isEditing && !ae.dataset.syncBlurBound) {
            ae.dataset.syncBlurBound = '1';
            ae.addEventListener('blur', () => { render(); }, { once: true });
          }
          return;
        }
        render();
      }
    });
  }
})();
</script>
