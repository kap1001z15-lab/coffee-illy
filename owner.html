* { box-sizing: border-box; }

button { cursor:pointer; border:none; background:transparent; }
.topbar { position:sticky; top:0; z-index:40; background:var(--bg); border-bottom:1px solid var(--border); padding:10px 18px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }

.card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius-card); padding:18px; box-shadow:var(--shadow); }
.card-soft { background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:12px 14px; }
.card-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
.card-title { font-size:16px; font-weight:750; margin:0; }
.card-sub { font-size:12px; color:var(--muted); }
.badge { display:inline-flex; align-items:center; justify-content:center; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:700; background:var(--surface-2); color:var(--ink); }
.badge.good { background:var(--good-soft); color:var(--good); }
.badge.warn { background:var(--warn-soft); color:var(--warn); }
.badge.bad { background:var(--bad-soft); color:var(--bad); }
.badge.accent { background:var(--accent-soft); color:var(--accent); }
.stack { display:flex; flex-direction:column; gap:10px; }
.row-item { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 14px; border-radius:18px; background:var(--surface); border:1px solid var(--border); flex-wrap:wrap; }
.row-main { min-width:0; flex:1; }
.row-title { font-weight:700; font-size:14px; }

.pbar { height:7px; background:var(--surface-2); border-radius:99px; overflow:hidden; margin-top:6px; }

.field { display:flex; flex-direction:column; gap:5px; margin-bottom:10px; }

.wrap { max-width: 1200px; margin: 0 auto; padding: 18px; }

.kpi { background:var(--card); border:1px solid var(--border); border-radius:22px; padding:16px; box-shadow:var(--shadow); }

.chart-plan-lbl { position:absolute; right:0; top:-18px; font-size:11px; font-weight:650; color:var(--accent); }
.bar-col { display:flex; flex-direction:column; align-items:center; gap:5px; height:100%; justify-content:flex-end; }
.bar-val { font-size:10.5px; font-weight:700; color:var(--muted); }
.bar-fill { width:100%; max-width:34px; border-radius:10px 10px 4px 4px; background:var(--accent); }
.bar-fill.hit { background:var(--good); }
.bar-dt { font-size:10.5px; color:var(--muted); font-weight:600; }

<script>

const LIVE_SNAPSHOT = {"location":"Кофейня №1","plan":2200,"minAvgCheck":35,"planChecks":75,"staff":[],"blocks":[],"tasks":[],"cash":[],"expenses":[],"checklists":[],"incidents":[],"plans":[{"day":"Пн","rev":2200,"avg":35,"checks":70,"roster":""},{"day":"Вт","rev":2200,"avg":35,"checks":70,"roster":""},{"day":"Ср","rev":2200,"avg":35,"checks":70,"roster":""},{"day":"Чт","rev":2200,"avg":35,"checks":70,"roster":""},{"day":"Пт","rev":2500,"avg":35,"checks":80,"roster":""},{"day":"Сб","rev":2800,"avg":35,"checks":85,"roster":""},{"day":"Вс","rev":2400,"avg":35,"checks":75,"roster":""}],"goodDeeds":[],"ttk":[],"audits":[]};
const STORE_KEY = 'coffee_illy_v90_live_state';
const THEME_KEY = 'coffee_illy_v90_theme';
const TODAY = (window.CoffeeCloudV93 ? window.CoffeeCloudV93.localISO() : new Date().toISOString().slice(0,10));
const TIME_OPTIONS = ['06:00','06:30','07:00','07:30','08:00','08:30','09:00','09:30','10:00','10:23','10:30','10:34','11:00','11:30','12:00','12:30','13:00','14:00','15:00','16:00','17:00','18:00','18:30','19:00','20:00','21:00','21:30','22:00','22:30','23:00','23:30','23:59'];
const PLAN_OPTS = [1500,1800,2000,2200,2500,3000,3500,4000,5000];
const CHECKS_OPTS = [30,40,50,60,70,75,80,90,100,120];
const AVG_OPTS = [25,28,30,32,35,38,40,45,50];
const WO_OPTS = [5,10,15,20,25,30];
const SHIFT_HOURS = ['07:30–22:30','08:00–20:00','08:00–16:00','14:00–22:30','Выходной'];
const VOL_OPTS = ['60 мл (S)','150 мл (S)','200 мл (M)','250 мл (M)','350 мл (L)','400 мл (XL)'];
const CAT_OPTS = ['Классика','Авторские','Холодные','Чай и не-кофе','Выпечка'];
const EXP_CATS = ['Закупка продуктов','Зарплата','Аренда','Коммунальные','Реклама','Ремонт и оборудование','Прочее'];
const OWNERS = ['Администратор','Бариста','Техник','Управляющий'];
const EQUIP_ZONES = ['Кофемашина','Кофемолка','Холодильник','Термопот','Витрина','Зона гостя','Санузел','Касса / Терминал','Другое'];

function freshState() {
  const s = JSON.parse(JSON.stringify(LIVE_SNAPSHOT));
  s.rev = 1; s.woNorm = 15; s.initCounter = 600; s.photoAll = false; s.simTime = (window.CoffeeCloudV93 ? window.CoffeeCloudV93.localHHMM() : '13:25');
  s.adminPin = '1234'; s.extensions = {};
  s.staff = s.staff.map(st => Object.assign({}, st, {
    pin: '1234', pinIsDefault: true,
    tgId: st.name === 'Соня' ? 'TG-518294012' : (st.name === 'Алина' ? 'TG-604912338' : '')
  }));
  s.liveProgress = {}; s.staffPresence = {}; s.tgChat = ''; s.webappUrl = ''; s.tgConfiguredOnServer = false; s.autopilotEnabled = false; s.lastSyncAt = ''; s.lastRttMs = 0;
  s.auditLog = [{ time: '13:20', actor: 'Система', rev: 1, text: 'Инициализирован релиз v93.1 на реальных данных Coffee_illy.' }];
  return s;
}
function loadSharedState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) { const parsed = JSON.parse(raw); if (parsed && parsed.blocks) return parsed; }
  } catch(_) {}
  const s = freshState();
  try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch(_) {}
  return s;
}
const syncCh = (typeof BroadcastChannel !== 'undefined') ? new BroadcastChannel('coffee_illy_v90_sync') : null;
function saveSharedState(st, actor, desc) {
  st.rev = (Number(st.rev) || 0) + 1;
  if (desc) {
    st.auditLog = st.auditLog || [];
    st.auditLog.unshift({ time: st.simTime || '13:25', actor: actor || 'Система', rev: st.rev, text: desc });
    if (st.auditLog.length > 50) st.auditLog.pop();
  }
  try { localStorage.setItem(STORE_KEY, JSON.stringify(st)); } catch(_) {}
  if (syncCh) try { syncCh.postMessage({ type: 'state', rev: st.rev, ts: Date.now() }); } catch(_) {}
  if (window.CoffeeCloudV93 && desc) window.CoffeeCloudV93.dispatchStateChange(st, actor, desc);
}
function fmtRub(n) { return (Number(n) || 0).toLocaleString('ru-RU') + ' ₽'; }
function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function toMin(hhmm) { const m = String(hhmm || '00:00').match(/(\d{1,2}):(\d{2})/); return m ? Number(m[1])*60 + Number(m[2]) : 0; }
function optList(arr, sel, fn) {
  const v = arr.slice();
  if (sel != null && sel !== '' && !v.some(x => String(x) === String(sel))) v.unshift(sel);
  return v.map(x => `<option value="${esc(x)}" ${String(x)===String(sel)?'selected':''}>${esc(fn ? fn(x) : x)}</option>`).join('');
}
let _tTimer = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(_tTimer); _tTimer = setTimeout(() => el.classList.remove('show'), 2600);
}
function initTheme(btnId) {
  const mql = window.matchMedia('(prefers-color-scheme: dark)');
  let mode = 'auto';
  try { mode = localStorage.getItem(THEME_KEY) || 'auto'; } catch(_) {}
  function apply() {
    const eff = mode === 'auto' ? (mql.matches ? 'dark' : 'light') : mode;
    document.documentElement.setAttribute('data-theme', eff);
    const b = document.getElementById(btnId);
    if (b) b.textContent = mode === 'auto' ? '🌓 Авто' : (mode === 'light' ? '☀️ Светлая' : '🌙 Тёмная');
  }
  mql.addEventListener('change', () => { if (mode === 'auto') apply(); });
  window.addEventListener('storage', (e) => { if (e.key === THEME_KEY) { mode = e.newValue || 'auto'; apply(); } });
  const b = document.getElementById(btnId);
  if (b) b.onclick = () => {
    mode = mode === 'auto' ? 'light' : (mode === 'light' ? 'dark' : 'auto');
    try { localStorage.setItem(THEME_KEY, mode); } catch(_) {}
    apply();
  };
  apply();
}

(function() {
  let state = loadSharedState();
  let tab = 'overview';
  let adminUnlocked = !!(window.CoffeeCloudV93 && window.CoffeeCloudV93.getSession && window.CoffeeCloudV93.getSession().adminToken);
  let adminAuthNeeded = !adminUnlocked;
  let incFilter = 'open';
  let chkFilter = 'all';
  let ovRange = 'all';
  let ovFrom = '';
  let ovTo = '';
  let editTasksBlock = null;
  let taskSearchQ = '';

  initTheme('btn-theme');
  function openModal(t, h) { document.getElementById('modal-title').textContent = t; document.getElementById('modal-body').innerHTML = h; document.getElementById('modal-bg').classList.add('open'); }
  function closeModal() { document.getElementById('modal-bg').classList.remove('open'); }
  document.getElementById('modal-close').onclick = closeModal;
  document.getElementById('modal-bg').onclick = (e) => { if (e.target.id === 'modal-bg') closeModal(); };

  function guard(label, fn) {
    if (adminUnlocked) { fn(); return; }
    openModal('Вход владельца (Google Таблица)', `
      <div style="font-size:13px;color:var(--muted);margin-bottom:10px;">Введите PIN владельца для доступа к живым данным и действию «${esc(label)}».</div>
      <div class="field"><label>PIN владельца</label><input id="p-in" type="password" inputmode="numeric" autofocus></div>
      <button class="btn-lg primary" id="p-ok">Подтвердить и загрузить данные</button>
    `);
    document.getElementById('p-ok').onclick = async () => {
      const entered = document.getElementById('p-in').value.trim();
      if (!entered) return;
      if (window.CoffeeCloudV93) {
        const res = await window.CoffeeCloudV93.authLogin('admin', { pin: entered });
        if (res && res.ok && res.sessionToken) {
          adminUnlocked = true; adminAuthNeeded = false; state.adminPin = entered;
          closeModal(); showToast('🔓 Живая сессия владельца активна');
          if (cloudLoop && cloudLoop.pullNow) await cloudLoop.pullNow(true);
          fn(); render();
          return;
        }
        showToast((res && res.error) ? String(res.error).replace(/^[A-Z_]+:\s*/, '') : 'Неверный PIN владельца');
        return;
      }
      if (entered === state.adminPin) { adminUnlocked = true; adminAuthNeeded = false; closeModal(); fn(); render(); }
      else showToast('Неверный PIN');
    };
  }

  const DAYS_RU = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
  function getWeekdayRu(isoStr) {
    const m = String(isoStr || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (!m) return DAYS_RU[new Date().getDay()];
    const dt = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]), 12, 0, 0);
    return DAYS_RU[dt.getDay()];
  }
  function getDayPlan(isoOrDay) {
    const dayKey = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].includes(isoOrDay) ? isoOrDay : getWeekdayRu(isoOrDay);
    const found = (state.plans || []).find(p => p && p.day === dayKey);
    const rev = Number((found && (found.rev || found.revenue)) || state.plan || 2200);
    const checks = Number((found && found.checks) || state.planChecks || 75);
    const avg = Number((found && (found.avg || found.avgCheck)) || state.minAvgCheck || 35);
    return { day: dayKey, rev, checks, avg, roster: (found && found.roster) || '' };
  }
  function blockTasks(nm) { return state.tasks.filter(t => t.block === nm); }
  function getBlkSt(b) {
    if (b.active === false) return { label:'Отключён', cls:'', open:false };
    if (state.extensions[b.name] && state.extensions[b.name].forceOpen) return { label:'Открыт админом до 23:59', cls:'good', open:true };
    const now = toMin(window.CoffeeCloudV93 ? window.CoffeeCloudV93.localHHMM() : '12:00');
    if (now < toMin(b.openTime)) return { label:'Откроется в ' + b.openTime, cls:'', open:false };
    if (now > toMin(b.deadline)) return { label:'Закрыт (' + b.deadline + ')', cls:'bad', open:false };
    return { label:'Открыт до ' + b.deadline, cls:'accent', open:true };
  }

  function render() {
    document.getElementById('hdr-loc').textContent = state.location;
    document.getElementById('hdr-rev').textContent = (state.liveConnected ? 'LIVE · ' : '') + 'rev #' + (state.cloudRev || state.rev) + (state.lastSyncAt ? ' · ' + state.lastSyncAt : '') + (state.lastRttMs ? ' (' + state.lastRttMs + ' мс)' : '');
    const _clkEl = document.getElementById('hdr-clock'); if (_clkEl) _clkEl.textContent = '🕒 ' + (window.CoffeeCloudV93 ? window.CoffeeCloudV93.localHHMM() : '');
    const lb = document.getElementById('btn-lock');
    lb.textContent = adminUnlocked ? '🔓 Админ-сессия' : '🔒 Защищено PIN';
    lb.className = 'chip-btn ' + (adminUnlocked ? 'good' : 'warn');

    const totalRev = state.cash.reduce((a,c)=>a+c.revenue,0);
    const totalExp = state.expenses.reduce((a,e)=>a+e.amount,0);
    const openIncs = state.incidents.filter(i=>i.status!=='Решена').length;
    document.getElementById('cnt-chk').textContent = state.checklists.length;
    document.getElementById('cnt-fin').textContent = state.cash.length;
    document.getElementById('cnt-inc').textContent = openIncs;
    document.querySelectorAll('#admin-nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));

    const root = document.getElementById('content');
    if (tab === 'overview') {
      const syncBanner = !state.liveConnected
        ? `<div class="card-soft" style="margin-bottom:14px;border:1px solid var(--accent);display:flex;justify-content:space-between;align-items:center;gap:10px;"><span>🔄 Загружаем актуальные данные из Google Таблицы Coffee_illy...</span></div>`
        : (adminAuthNeeded
          ? `<div class="card-soft" style="margin-bottom:14px;border:1px solid var(--warn);display:flex;justify-content:space-between;align-items:center;gap:10px;"><span>🔒 Войдите по PIN владельца, чтобы подтянуть живую кассу, расходы и поломки из Google Таблицы.</span><button class="chip-btn accent" id="ov-unlock">Войти по PIN</button></div>`
          : '');
      function shiftIso(daysDelta) {
        const d = new Date();
        d.setDate(d.getDate() + daysDelta);
        return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      }
      function getRangeBounds() {
        if (ovRange === 'today') return { from: TODAY, to: TODAY, label: 'Сегодня (' + TODAY + ')' };
        if (ovRange === 'yesterday') { const y = shiftIso(-1); return { from: y, to: y, label: 'Вчера (' + y + ')' }; }
        if (ovRange === '7d') return { from: shiftIso(-6), to: TODAY, label: 'Последние 7 дней' };
        if (ovRange === '30d') return { from: shiftIso(-29), to: TODAY, label: 'Последние 30 дней' };
        if (ovRange === '90d') return { from: shiftIso(-89), to: TODAY, label: 'Последние 90 дней' };
        if (ovRange === 'custom') return { from: ovFrom || '2000-01-01', to: ovTo || '2099-12-31', label: (ovFrom || '…') + ' — ' + (ovTo || '…') };
        return { from: '', to: '', label: 'Всё время' };
      }
      const rb = getRangeBounds();
      const inRange = (dtStr) => {
        const s = String(dtStr || '').slice(0, 10);
        if (!rb.from && !rb.to) return true;
        if (rb.from && s < rb.from) return false;
        if (rb.to && s > rb.to) return false;
        return true;
      };
      const fCash = state.cash.filter(c => inRange(c.date));
      const fExp = state.expenses.filter(e => inRange(e.date));
      const fChk = state.checklists.filter(c => inRange(c.date));
      const fInc = state.incidents.filter(i => inRange(i.date));
      const fOpenIncs = fInc.filter(i => i.status !== 'Решена').length;
      const fRev = fCash.reduce((a, c) => a + (Number(c.revenue) || 0), 0);
      const fExpSum = fExp.reduce((a, e) => a + (Number(e.amount) || 0), 0);
      const todayPlan = getDayPlan(TODAY);
      const totalPlanRev = fCash.reduce((a, c) => a + getDayPlan(c.date).rev, 0);
      const totalChecks = fCash.reduce((a, c) => a + (Number(c.checks) || 0), 0);
      const totalPlanChecks = fCash.reduce((a, c) => a + getDayPlan(c.date).checks, 0);
      const actualAvgCheck = totalChecks > 0 ? Math.round(fRev / totalChecks) : 0;
      const targetAvgCheck = fCash.length ? Math.round(fCash.reduce((a, c) => a + getDayPlan(c.date).avg, 0) / fCash.length) : todayPlan.avg;
      const revPlanPct = totalPlanRev > 0 ? Math.round((fRev / totalPlanRev) * 100) : 0;
      const checksPlanPct = totalPlanChecks > 0 ? Math.round((totalChecks / totalPlanChecks) * 100) : 0;
      const days = fCash.slice(0, 14).reverse();
      const maxRev = Math.max(todayPlan.rev, ...days.map(c => Math.max(c.revenue, getDayPlan(c.date).rev)), 1);
      const todayPlanPct = Math.round((todayPlan.rev / maxRev) * 100);
      const presets = [
        ['today','Сегодня'],['yesterday','Вчера'],['7d','7 дней'],['30d','30 дней'],['90d','90 дней'],['all','Всё время'],['custom','Период']
      ];
      const filterBar = `
        <div class="card" style="margin-bottom:14px;padding:12px 14px;">
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
            <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;">
              ${presets.map(([k, lbl]) => `<button class="chip-btn ${ovRange===k?'accent':''}" data-ovp="${k}" style="padding:6px 11px;font-size:12.5px;">${lbl}</button>`).join('')}
            </div>
            <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">
              <span style="font-size:12px;color:var(--muted);">С</span>
              <input id="ov-from" type="date" value="${esc(ovFrom || (rb.from || ''))}" style="padding:5px 8px;border-radius:10px;background:var(--surface);border:1px solid var(--border);color:var(--text);font-size:12.5px;">
              <span style="font-size:12px;color:var(--muted);">По</span>
              <input id="ov-to" type="date" value="${esc(ovTo || (rb.to || ''))}" style="padding:5px 8px;border-radius:10px;background:var(--surface);border:1px solid var(--border);color:var(--text);font-size:12.5px;">
            </div>
          </div>
        </div>`;
      root.innerHTML = syncBanner + filterBar + `
        <div class="kpi-grid">
          <div class="kpi"><div class="kpi-lbl">Выручка (${fCash.length} смен · ${esc(rb.label)})</div><div class="kpi-val">${fmtRub(fRev)}</div><div class="kpi-meta">План по дням: ${fmtRub(totalPlanRev)} (<b style="color:${revPlanPct>=100?'var(--good)':'var(--accent)'}">${revPlanPct}%</b>)</div></div>
          <div class="kpi"><div class="kpi-lbl">Чеки и средний чек</div><div class="kpi-val" style="color:${actualAvgCheck>=targetAvgCheck?'var(--good)':'var(--accent)'}">${actualAvgCheck} ₽</div><div class="kpi-meta">Чеков: <b>${totalChecks}</b> / ${totalPlanChecks} (${checksPlanPct}%) · Мин. ср. чек: ${targetAvgCheck} ₽</div></div>
          <div class="kpi"><div class="kpi-lbl">Чистый итог</div><div class="kpi-val" style="color:var(--good)">${fmtRub(fRev-fExpSum)}</div><div class="kpi-meta">Расходы: ${fmtRub(fExpSum)} · Чек-листов: ${fChk.length}</div></div>
          <div class="kpi"><div class="kpi-lbl">Открытые поломки</div><div class="kpi-val" style="color:${fOpenIncs?'var(--bad)':'var(--good)'}">${fOpenIncs}</div><div class="kpi-meta">За период: ${fInc.length} · Всего открыто: ${openIncs}</div></div>
        </div>
        <div class="card" style="margin-bottom:16px;">
          <div class="card-head"><div><h2 class="card-title">Динамика выручки · ${esc(rb.label)}</h2><div class="card-sub">Каждый столбец сравнивается с планом своего дня недели (Пн–Вс) · Сегодня (${todayPlan.day}): ${fmtRub(todayPlan.rev)} / ${todayPlan.checks} чек. / ≥${todayPlan.avg} ₽</div></div></div>
          <div class="chart-wrap">
            ${days.length ? `<div class="chart-plan-line" style="bottom:${Math.min(92,Math.max(16,todayPlanPct*0.78))}%"><span class="chart-plan-lbl">План ${todayPlan.day}: ${fmtRub(todayPlan.rev)}</span></div>
            ${days.map(c => {
              const dp = getDayPlan(c.date);
              const avgC = c.checks ? Math.round(c.revenue / c.checks) : 0;
              const hit = c.revenue >= dp.rev;
              const pct = dp.rev > 0 ? Math.round((c.revenue / dp.rev) * 100) : 0;
              const tip = `${dp.day} ${c.date} · Выручка: ${c.revenue} / ${dp.rev} ₽ (${pct}%) · Чеки: ${c.checks}/${dp.checks} · Ср. чек: ${avgC} / ≥${dp.avg} ₽`;
              return `<div class="bar-col" title="${esc(tip)}"><div class="bar-val">${c.revenue}</div><div class="bar-fill ${hit?'hit':''}" style="height:${Math.max(12,Math.round((c.revenue/maxRev)*100))}%"></div><div class="bar-dt">${dp.day} ${c.date.slice(5)}</div></div>`;
            }).join('')}` : `<div style="padding:28px;text-align:center;color:var(--muted);width:100%;">За выбранный период (${esc(rb.label)}) кассовых смен нет</div>`}
          </div>
        </div>
        <div class="card">
          <div class="card-head"><div><h2 class="card-title">Команда на смене сейчас</h2><div class="card-sub">Автоматическая отметка «На работе» при входе сотрудника · Актуальные данные Google Таблицы</div></div></div>
          <div class="stack">
            ${state.staff.filter(s=>s.active!==false).map(s => {
              const pr = (state.staffPresence || {})[s.name];
              const isOn = !!(pr && pr.status === 'on_shift');
              const doneToday = state.checklists.filter(c => c.date === TODAY && c.who === s.name).length;
              const openBlocksCnt = Math.max(1, state.blocks.filter(b => !b.isCash && b.active !== false).length);
              const pct = Math.min(100, Math.round((doneToday / openBlocksCnt) * 100));
              return `<div class="row-item"><div class="row-main">
                <div class="row-title">${esc(s.name)} <span class="badge">${esc(s.role)}</span> ${isOn ? `<span class="badge good">🟢 На работе с ${esc(pr.checkedInAt || '')}</span>` : '<span class="badge">⚪ Не на смене</span>'} ${s.tgId ? `<span class="badge accent">${esc(s.tgId)}</span>`:'<span class="badge warn">Без TG ID</span>'}</div>
                <div class="row-sub">Сдано чек-листов сегодня: <b>${doneToday}/${openBlocksCnt}</b>${(state.liveProgress && state.liveProgress[s.name]) ? (' · Сейчас: «' + esc(state.liveProgress[s.name].block) + '» ' + state.liveProgress[s.name].done + '/' + state.liveProgress[s.name].total) : ''}${isOn && pr.source ? ' · Вход: ' + esc(pr.source) : ''}</div>
                <div class="pbar ${pct===100?'good':''}"><div style="width:${pct}%"></div></div>
              </div></div>`;
            }).join('')}
          </div>
        </div>`;
      const _ovU = document.getElementById('ov-unlock'); if (_ovU) _ovU.onclick = () => guard('Живые данные дашборда', () => {});
      root.querySelectorAll('[data-ovp]').forEach(b => b.onclick = () => { ovRange = b.dataset.ovp; if (ovRange !== 'custom') { ovFrom = ''; ovTo = ''; } render(); });
      const _of = document.getElementById('ov-from'); if (_of) _of.onchange = e => { ovFrom = e.target.value; ovRange = 'custom'; render(); };
      const _ot = document.getElementById('ov-to'); if (_ot) _ot.onchange = e => { ovTo = e.target.value; ovRange = 'custom'; render(); };
      return;
    }

    if (tab === 'checklists') {
      const logs = chkFilter === 'all' ? state.checklists : state.checklists.filter(c=>c.who===chkFilter);
      root.innerHTML = `
        <div class="card" style="margin-bottom:16px;">
          <div class="card-head"><div><h2 class="card-title">Блоки и окна (${state.blocks.length})</h2><div class="card-sub">Любое изменение сразу прилетает в открытый терминал</div></div><button class="chip-btn accent" id="b-add">+ Новый блок</button></div>
          <div class="stack">
            ${state.blocks.map(b => {
              const st = getBlkSt(b);
              const isExt = !!(state.extensions[b.name] && state.extensions[b.name].forceOpen);
              return `<div class="row-item" style="${b.active===false?'opacity:.55;':''}"><div class="row-main">
                <div class="row-title">${esc(b.name)} <span class="badge">${b.isCash?'Касса':blockTasks(b.name).length+' задач'}</span></div>
                <div class="row-sub">Окно: <b>${b.openTime}–${b.deadline}</b> · <span class="badge ${st.cls}">${st.label}</span></div>
              </div><div style="display:flex;gap:6px;flex-wrap:wrap;">
                <button class="chip-btn" data-eb="${esc(b.id)}">✏️ Окно</button>
                ${!b.isCash ? `<button class="chip-btn ${editTasksBlock===b.name?'accent':''}" data-vt="${esc(b.name)}">📋 Задачи (${blockTasks(b.name).length})</button>`:''}
                ${b.active!==false && !st.open ? `<button class="chip-btn good" data-un="${esc(b.name)}">🔓 Открыть</button>` : ''}
                ${isExt ? `<button class="chip-btn warn" data-lk="${esc(b.name)}">↩️ Вернуть окно</button>` : ''}
              </div></div>`;
            }).join('')}
          </div>
        </div>
        ${editTasksBlock ? (() => {
          const allT = blockTasks(editTasksBlock);
          const visT = allT.filter(t => !taskSearchQ || t.title.toLowerCase().includes(taskSearchQ.toLowerCase()) || (t.instruction||'').toLowerCase().includes(taskSearchQ.toLowerCase()));
          return `<div class="card" style="margin-bottom:16px;border:1px solid var(--accent);">
            <div class="card-head">
              <div><h2 class="card-title">📋 Задачи блока «${esc(editTasksBlock)}» (${allT.length})</h2><div class="card-sub">Нажмите на бейдж камеры для переключения в 1 клик или ✏️ для редактирования текста и описания фото</div></div>
              <div style="display:flex;gap:6px;flex-wrap:wrap;">
                <button class="chip-btn accent" id="t-add-inline">+ Добавить задачу</button>
                <button class="chip-btn" id="t-close-inline">✕ Свернуть</button>
              </div>
            </div>
            <div style="margin-bottom:10px;"><input id="t-search" value="${esc(taskSearchQ)}" placeholder="Быстрый поиск по задачам блока..." style="width:100%;padding:8px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--border);color:var(--text);"></div>
            <div class="grid-2" style="gap:10px;">
              ${visT.map((t, i) => `
                <div class="card-soft" style="padding:12px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;">
                  <div>
                    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
                      <div style="font-weight:700;font-size:13.5px;">${i+1}. ${esc(t.title)}</div>
                      <button class="chip-btn ${t.photo?'accent':''}" data-tcam="${esc(t.id)}" style="padding:3px 8px;font-size:11.5px;white-space:nowrap;" title="Переключить обязательность фото">${t.photo?'📷 Фото: Да':'Без фото'}</button>
                    </div>
                    <div style="font-size:12px;color:var(--muted);margin-top:5px;line-height:1.4;">${t.photo?'<b>Что сфотографировать:</b> ':'<b>Описание:</b> '}${esc(t.instruction || 'Не указано — нажмите ✏️ чтобы добавить описание')}</div>
                  </div>
                  <div style="display:flex;justify-content:space-between;align-items:center;gap:6px;padding-top:6px;border-top:1px solid var(--border);">
                    <span class="badge" style="font-size:11px;">👤 ${esc(t.owner || 'Бариста')}</span>
                    <div style="display:flex;gap:5px;">
                      <button class="chip-btn" data-tedit="${esc(t.id)}" style="padding:4px 9px;font-size:12px;">✏️ Изменить</button>
                      <button class="chip-btn bad" data-tdel="${esc(t.id)}" style="padding:4px 8px;font-size:12px;">✕</button>
                    </div>
                  </div>
                </div>`).join('') || '<div style="color:var(--muted);padding:12px;">Задачи не найдены</div>'}
            </div>
          </div>`;
        })() : ''}
        <div class="card">
          <div class="card-head"><div><h2 class="card-title">История прохождения (${logs.length})</h2></div>
            <select id="cf" class="chip-btn"><option value="all">Все сотрудники</option>${[...new Set(state.checklists.map(c=>c.who))].map(w=>`<option value="${esc(w)}" ${chkFilter===w?'selected':''}>${esc(w)}</option>`).join('')}</select>
          </div>
          <div class="tbl-wrap"><table><thead><tr><th>Дата</th><th>Блок</th><th>Сотрудник</th><th>Проблем</th><th>Статус</th></tr></thead><tbody>
            ${logs.map(c=>`<tr><td><b>${c.date}</b> <span style="color:var(--muted)">${c.time}</span></td><td>${esc(c.block)}${Array.isArray(c.photos)&&c.photos.length?' '+c.photos.map((u,idx)=>`<a href="${esc(u)}" target="_blank" rel="noopener" class="badge accent" style="text-decoration:none;margin-left:4px;">📷 ${idx+1}</a>`).join(''):''}</td><td>${esc(c.who)}</td><td>${c.problems||0}</td><td><span class="badge good">${esc(c.status)}</span></td></tr>`).join('')}
          </tbody></table></div>
        </div>`;
      document.getElementById('cf').onchange = e => { chkFilter = e.target.value; render(); };
      root.querySelectorAll('[data-un]').forEach(b => b.onclick = () => guard('Открыть блок', () => {
        state.extensions[b.dataset.un] = { forceOpen: true, until: '23:59' };
        saveSharedState(state, 'Администратор', 'Открыт блок «' + b.dataset.un + '» до 23:59');
        showToast('Блок «' + b.dataset.un + '» открыт в терминале!'); render();
      }));
      root.querySelectorAll('[data-lk]').forEach(b => b.onclick = () => guard('Вернуть окно', () => {
        delete state.extensions[b.dataset.lk];
        saveSharedState(state, 'Администратор', 'Возвращено штатное окно «' + b.dataset.lk + '»'); render();
      }));
      root.querySelectorAll('[data-eb]').forEach(b => b.onclick = () => guard('Настроить окно', () => {
        const blk = state.blocks.find(x=>x.id===b.dataset.eb);
        openModal('Блок «' + blk.name + '»', `
          <div class="field"><label>Название</label><input id="en" value="${esc(blk.name)}"></div>
          <div class="grid-2"><div class="field"><label>Открытие</label><select id="eo">${optList(TIME_OPTIONS, blk.openTime)}</select></div><div class="field"><label>Дедлайн</label><select id="ed">${optList(TIME_OPTIONS, blk.deadline)}</select></div></div>
          <div class="field"><label>Статус</label><select id="ea"><option value="1" ${blk.active!==false?'selected':''}>Активен</option><option value="0" ${blk.active===false?'selected':''}>Отключён</option></select></div>
          <button class="btn-lg primary" id="es">Сохранить</button>
        `);
        document.getElementById('es').onclick = () => {
          const op = document.getElementById('eo').value, dl = document.getElementById('ed').value, nm = document.getElementById('en').value.trim();
          if (!nm || toMin(op) >= toMin(dl)) { showToast('Открытие должно быть раньше дедлайна'); return; }
          const old = blk.name; blk.name = nm; blk.openTime = op; blk.deadline = dl; blk.active = document.getElementById('ea').value === '1';
          if (old !== nm) state.tasks.forEach(t => { if (t.block === old) t.block = nm; });
          saveSharedState(state, 'Администратор', 'Окно «' + nm + '»: ' + op + '–' + dl); closeModal(); showToast('Синхронизировано!'); render();
        };
      }));
      root.querySelectorAll('[data-vt]').forEach(b => b.onclick = () => {
        editTasksBlock = (editTasksBlock === b.dataset.vt) ? null : b.dataset.vt;
        taskSearchQ = '';

      });
      const _tcl = document.getElementById('t-close-inline'); if (_tcl) _tcl.onclick = () => { editTasksBlock = null; render(); };
      const _tsr = document.getElementById('t-search'); if (_tsr) _tsr.oninput = e => { taskSearchQ = e.target.value; render(); };
      const _tad = document.getElementById('t-add-inline'); if (_tad) _tad.onclick = () => guard('Новая задача', () => openSingleTaskModal(editTasksBlock, null));
      root.querySelectorAll('[data-tedit]').forEach(b => b.onclick = () => guard('Изменить задачу', () => openSingleTaskModal(editTasksBlock, b.dataset.tedit)));
      root.querySelectorAll('[data-tcam]').forEach(b => b.onclick = () => guard('Переключить фото', () => {
        const t = state.tasks.find(x => x.id === b.dataset.tcam);
        if (!t) return;
        t.photo = !t.photo;
        saveSharedState(state, 'Администратор', 'Обновлена задача: ' + t.id);
        showToast(t.photo ? '📷 Фото включено для «' + t.title + '»' : 'Фото отключено для «' + t.title + '»');
        render();
      }));
      root.querySelectorAll('[data-tdel]').forEach(b => b.onclick = () => guard('Удалить задачу', () => {
        const tid = b.dataset.tdel;
        state.tasks = state.tasks.filter(x => x.id !== tid);
        saveSharedState(state, 'Администратор', 'Удалена задача: ' + tid);
        showToast('Задача удалена и синхронизирована');
        render();
      }));
      document.getElementById('b-add').onclick = () => guard('Новый блок', () => {
        openModal('Новый блок чек-листа', `
          <div class="field"><label>Название</label><input id="nn" placeholder="Например: Вечерняя ревизия"></div>
          <div class="grid-2"><div class="field"><label>Открытие</label><select id="no">${optList(TIME_OPTIONS,'07:00')}</select></div><div class="field"><label>Дедлайн</label><select id="nd">${optList(TIME_OPTIONS,'23:59')}</select></div></div>
          <div class="field"><label>Первая задача</label><input id="nt" placeholder="Проверить остатки молока"></div>
          <button class="btn-lg primary" id="ns">Создать и отправить в терминал</button>
        `);

        if (!window.CoffeeCloudV93) return;
        const tok = document.getElementById('tg-tok').value.trim();
        const chat = document.getElementById('tg-chat').value.trim();
        const url = document.getElementById('tg-url').value.trim();
        const res = await window.CoffeeCloudV93.saveTelegramSettings({ tgToken: tok, tgChat: chat, webappUrl: url });
        if (res && res.ok) {
          state.tgConfiguredOnServer = !!res.tgConfiguredOnServer;
          state.tgChat = res.tgChat || chat;
          state.webappUrl = res.webappUrl || url;
          showToast('✓ Настройки Telegram сохранены на сервере!'); render();
        } else showToast('Ошибка сохранения Telegram: ' + ((res && res.error) || 'проверьте вход'));
      });
      document.getElementById('tg-auto').onclick = () => guard('Включить авто-уведомления', async () => {
        if (!window.CoffeeCloudV93) return;
        const res = await window.CoffeeCloudV93.setupTriggers();
        if (res && res.ok) { state.autopilotEnabled = true; showToast('🔔 Авто-уведомления (каждые 5 мин) включены!'); render(); }
        else showToast('Ошибка активации триггера');
      });
      document.getElementById('tg-test').onclick = () => guard('Тест Telegram', async () => {
        if (!window.CoffeeCloudV93) return;
        const res = await window.CoffeeCloudV93.testTelegramAlert();
        if (res && res.ok) showToast('📨 Тестовое сообщение отправлено в Telegram!');
        else showToast('Не удалось отправить: ' + ((res && res.telegram && (res.telegram.reason || res.telegram.error)) || (res && res.error) || 'проверьте токен и Chat ID'));
      });
      document.getElementById('tg-run').onclick = () => guard('Проверка чек-листов', async () => {
        if (!window.CoffeeCloudV93) return;
        const res = await window.CoffeeCloudV93.runChecklistNotificationsNow({});
        const cnt = (res && Array.isArray(res.sent)) ? res.sent.length : 0;
        showToast(cnt ? ('📨 Отправлено уведомлений сотрудникам: ' + cnt) : 'Новых открытых чек-листов для отправки нет');
      });
    }
  }

  function openPhotoLightbox(url, caption) {
    const lb = document.createElement('div');
    lb.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:12px;';
    lb.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;width:100%;max-width:900px;color:#fff;">
        <b style="font-size:14px;">${esc(caption || 'Фотография')}</b>
        <div style="display:flex;gap:8px;">
          <a href="${esc(url)}" target="_blank" rel="noopener" class="chip-btn accent" style="text-decoration:none;">🔗 Открыть на Google Диске</a>
          <button class="chip-btn" id="lb-x">✕ Закрыть</button>
        </div>
      </div>
      <img src="${esc(url)}" alt="Фото" style="max-width:95vw;max-height:80vh;border-radius:14px;object-fit:contain;box-shadow:0 12px 40px rgba(0,0,0,.6);">`;
    lb.onclick = (e) => { if (e.target === lb) lb.remove(); };
    document.body.appendChild(lb);
    lb.querySelector('#lb-x').onclick = () => lb.remove();
  }

  function openIncidentDetailModal(incId) {
    const x = state.incidents.find(i => i.id === incId);
    if (!x) return;
    openModal('Поломка: ' + x.step + ' (' + x.id + ')', `
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;">
        <span class="badge ${String(x.priority||'').includes('Критич')||String(x.priority||'').includes('Сроч')?'bad':'warn'}">${esc(x.priority || 'Терпит')}</span>
        <span class="badge ${x.status==='Решена'?'good':'accent'}">${esc(x.status || 'Новая проблема')}</span>
        <span class="badge">🕒 ${esc(x.date)} ${esc(x.time)}</span>
        ${x.block ? `<span class="badge">📋 ${esc(x.block)}</span>` : ''}
      </div>
      <div class="card-soft" style="margin-bottom:12px;">
        <div style="font-size:12px;color:var(--muted);margin-bottom:4px;">Описание проблемы</div>
        <div style="font-size:14px;line-height:1.5;">${esc(x.text || 'Без подробного описания')}</div>
        <div style="font-size:12px;color:var(--muted);margin-top:8px;">👤 Сообщил: <b>${esc(x.who || 'Бариста')}</b> · 🛠 Ответственный: <b>${esc(x.owner || 'Администратор')}</b></div>
      </div>
      <div class="card-soft" style="margin-bottom:12px;">
        <div style="font-size:12px;color:var(--muted);margin-bottom:6px;">Фотография поломки</div>
        ${x.photoUrl ? `
          <img id="inc-big-ph" src="${esc(x.photoUrl)}" alt="Фото поломки" style="width:100%;max-height:280px;object-fit:cover;border-radius:12px;cursor:zoom-in;border:1px solid var(--border);" title="Нажмите для увеличения">
          <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;">
            <button class="chip-btn accent" id="inc-zoom">🔍 Увеличить на весь экран</button>
            <a href="${esc(x.photoUrl)}" target="_blank" rel="noopener" class="chip-btn" style="text-decoration:none;">🔗 Открыть на Google Диске</a>
          </div>
        ` : `<div style="font-size:12.5px;color:var(--muted);">Фотография не прикреплена к этой поломке.</div>`}
      </div>
      <div class="field"><label>Статус поломки</label>
        <select id="inc-st-sel">
          ${['Новая проблема','В работе','Решена'].map(s => `<option value="${s}" ${x.status===s?'selected':''}>${s}</option>`).join('')}
        </select>
      </div>
      <button class="btn-lg primary" id="inc-st-save">Сохранить статус и синхронизировать</button>
    `);
    const ph = document.getElementById('inc-big-ph');
    if (ph) ph.onclick = () => openPhotoLightbox(x.photoUrl, x.step + ' · ' + x.date);
    const zm = document.getElementById('inc-zoom');
    if (zm) zm.onclick = () => openPhotoLightbox(x.photoUrl, x.step + ' · ' + x.date);
    document.getElementById('inc-st-save').onclick = () => guard('Изменить статус поломки', () => {
      const nextSt = document.getElementById('inc-st-sel').value;
      x.status = nextSt;
      saveSharedState(state, 'Администратор', nextSt === 'Решена' ? ('Решён инцидент ' + x.id) : ('Обновлён статус инцидента ' + x.id + ' → ' + nextSt));
      closeModal(); showToast('✓ Статус поломки обновлён'); render();
    });
  }

  function openSingleTaskModal(blk, taskId) {
    const t = taskId ? state.tasks.find(x => x.id === taskId) : null;
    openModal(t ? ('Редактировать задачу · ' + blk) : ('Новая задача · ' + blk), `
      <div class="field"><label>Название задачи</label><input id="ts-title" value="${t?esc(t.title):''}" placeholder="Например: Проверить чистоту холдеров и группы"></div>
      <div class="grid-2">
        <div class="field"><label>Нужна ли камера (фото)</label>
          <select id="ts-photo">
            <option value="1" ${!t||t.photo?'selected':''}>📷 Да — обязательное фото</option>
            <option value="0" ${t&&!t.photo?'selected':''}>Нет — без фото</option>
          </select>
        </div>
        <div class="field"><label>Ответственный</label><select id="ts-owner">${optList(OWNERS, t?t.owner:'Бариста')}</select></div>
      </div>
      <div class="field"><label>Подробное описание / что именно нужно сфотографировать</label>
        <textarea id="ts-inst" rows="4" placeholder="Например: Сфотографировать крупным планом чистую рабочую зону, манометр кофемашины и температуру холодильника.">${t?esc(t.instruction||''):''}</textarea>
      </div>
      <button class="btn-lg primary" id="ts-save">${t ? 'Сохранить изменения и синхронизировать' : '+ Добавить задачу и синхронизировать'}</button>
    `);
    document.getElementById('ts-save').onclick = () => {
      const title = document.getElementById('ts-title').value.trim();
      if (!title) { showToast('Введите название задачи'); return; }
      const photo = document.getElementById('ts-photo').value === '1';
      const owner = document.getElementById('ts-owner').value;
      const instruction = document.getElementById('ts-inst').value.trim() || 'Выполнить по стандарту Coffee Illy.';
      if (t) {
        t.title = title; t.photo = photo; t.owner = owner; t.instruction = instruction;
        saveSharedState(state, 'Администратор', 'Обновлена задача: ' + t.id);
        showToast('✓ Задача обновлена и отправлена в терминал');
      } else {
        const nt = { id:'t_'+Date.now(), block:blk, group:blk, title, instruction, photo, owner, active:true };
        state.tasks.push(nt);
        saveSharedState(state, 'Администратор', 'Добавлена задача «' + title + '»');
        showToast('✓ Задача добавлена и отправлена в терминал');
      }
      closeModal(); render();
    };
  }
  function openStaffModal(id) {
    const s = id ? state.staff.find(x=>x.id===id) : null;
    openModal(s ? 'Сотрудник: ' + s.name : 'Новый сотрудник', `
      <div class="field"><label>Имя</label><input id="sn" value="${s?esc(s.name):''}"></div>
      <div class="grid-2"><div class="field"><label>Роль</label><select id="sr"><option ${s&&s.role==='Бариста'?'selected':''}>Бариста</option><option ${s&&s.role==='Администратор'?'selected':''}>Администратор</option></select></div><div class="field"><label>Статус</label><select id="sa"><option value="1" ${!s||s.active!==false?'selected':''}>Активен</option><option value="0" ${s&&s.active===false?'selected':''}>Отключён</option></select></div></div>
      <div class="grid-2"><div class="field"><label>Личный PIN (4–6 цифр)</label><input id="sp" value="${s?esc(s.pin):'1234'}"></div><div class="field"><label>Telegram ID</label><input id="sg" value="${s?esc(s.tgId||''):''}" placeholder="TG-..."></div></div>
      <button class="btn-lg primary" id="ss">Сохранить</button>
    `);
    document.getElementById('ss').onclick = () => {
      const nm = document.getElementById('sn').value.trim(), pin = document.getElementById('sp').value.trim(), tg = document.getElementById('sg').value.trim();
      if (!nm || !/^\d{4,6}$/.test(pin)) { showToast('Проверьте имя и PIN (4–6 цифр)'); return; }
      if (s) { s.name=nm; s.role=document.getElementById('sr').value; s.active=document.getElementById('sa').value==='1'; s.pin=pin; s.pinIsDefault=(pin==='1234'); s.tgId=tg; }
      else state.staff.push({ id:'st_'+Date.now(), name:nm, role:document.getElementById('sr').value, shop:state.location, active:true, pin, pinIsDefault:pin==='1234', tgId:tg });
      saveSharedState(state, 'Администратор', 'Обновлён сотрудник ' + nm); closeModal(); showToast('Синхронизировано!'); render();
    };
  }
  function openTtkModal(id) {
    const k = id ? state.ttk.find(x=>x.id===id) : null;
    openModal(k ? 'ТТК: ' + k.name : 'Новая ТТК', `
      <div class="field"><label>Название</label><input id="kn" value="${k?esc(k.name):''}"></div>
      <div class="grid-2"><div class="field"><label>Объём</label><select id="kv">${optList(VOL_OPTS, k?k.vol:VOL_OPTS[3])}</select></div><div class="field"><label>Категория</label><select id="kc">${optList(CAT_OPTS, k?k.cat:CAT_OPTS[0])}</select></div></div>
      <div class="grid-2"><div class="field"><label>Цена вручную (₽)</label><input id="kp" type="number" min="1" value="${k?k.price:22}"></div><div class="field"><label>Себест. (₽)</label><input id="ks" type="number" min="0" step="0.1" value="${k?k.cost:7.5}"></div></div>
      <div class="field"><label>Ингредиенты и граммовки</label><textarea id="ki" rows="2" placeholder="Например: Эспрессо 36 г, молоко 180 мл, сироп ваниль 15 мл">${k?esc(k.ingredients||''):''}</textarea></div>
      <div class="field"><label>Рецептура и пошаговое приготовление</label><textarea id="kr" rows="3">${k?esc(k.recipe||''):''}</textarea></div>
      <div class="field"><label>Подача и посуда</label><input id="ksrv" value="${k?esc(k.serve||''):''}" placeholder="Например: Стакан 250 мл, температура молока 60–65°C"></div>
      <button class="btn-lg primary" id="ksv">Сохранить и отправить в терминал</button>
    `);
    document.getElementById('ksv').onclick = () => {
      const nm = document.getElementById('kn').value.trim(), pr = Number(document.getElementById('kp').value)||0, cs = Number(document.getElementById('ks').value)||0;
      if (!nm || pr<=0) return;
      const ing = document.getElementById('ki').value.trim(), rec = document.getElementById('kr').value.trim(), srv = document.getElementById('ksrv').value.trim();
      if (k) { k.name=nm; k.vol=document.getElementById('kv').value; k.cat=document.getElementById('kc').value; k.price=pr; k.cost=cs; k.ingredients=ing; k.recipe=rec; k.serve=srv; }
      else state.ttk.push({ id:'ttk_'+Date.now(), name:nm, vol:document.getElementById('kv').value, cat:document.getElementById('kc').value, price:pr, cost:cs, ingredients:ing, recipe:rec, serve:srv });
      saveSharedState(state, 'Администратор', 'Обновлена ТТК ' + nm); closeModal(); showToast('ТТК отправлена в терминал!'); render();
    };
  }

  // Live Cross-Tab Sync Listener (receives instant updates from Terminal!)
  function onRemoteSync() {
    const next = loadSharedState();
    if (next.rev !== state.rev) {
      state = next;
      showToast('⚡ Получено обновление из терминала (rev #' + state.rev + ')');
      render();
    }
  }
  if (syncCh) syncCh.onmessage = onRemoteSync;
  window.addEventListener('storage', (e) => { if (e.key === STORE_KEY) onRemoteSync(); });

  document.querySelectorAll('#admin-nav button').forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); });
  document.getElementById('btn-lock').onclick = () => { if (adminUnlocked) { adminUnlocked = false; render(); } else guard('Вход', () => {}); };
  let cloudLoop = null;
  document.getElementById('btn-reset').onclick = async () => {
    showToast('🔄 Загрузка свежих данных из Google Таблицы...');
    if (cloudLoop && cloudLoop.pullNow) {
      await cloudLoop.pullNow(true);
      showToast('✓ Данные обновлены из Google Таблицы');
      render();
    }
  };
  render();

  setInterval(() => {
    const _clk = document.getElementById('hdr-clock');
    if (_clk && window.CoffeeCloudV93) _clk.textContent = '🕒 ' + window.CoffeeCloudV93.localHHMM();
  }, 15000);
  if (window.CoffeeCloudV93) {
    cloudLoop = window.CoffeeCloudV93.startCloudLoop({
      mode: 'owner',
      getState: () => state,
      onAuthRequired: () => {
        adminUnlocked = false;
        adminAuthNeeded = true;
        render();
      },
      onSynced: (st, srvRev) => {
        if (window.CoffeeCloudV93.getSession && window.CoffeeCloudV93.getSession().adminToken) {
          adminUnlocked = true; adminAuthNeeded = false;
        }
        try { localStorage.setItem(STORE_KEY, JSON.stringify(st)); } catch(_) {}
        render();
      }
    });
  }
})();
</script>
</body>
</html>
