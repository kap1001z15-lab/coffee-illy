<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbf6ef">
<title>Кофейня — Панель владельца (Дашборд · Отчёты · Управление)</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script>try{var t=localStorage.getItem('coffee_illy_theme');document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'light');}catch(e){}</script>
<script>window.OWNER_START_SECTION='dashboard';</script>
<link rel="stylesheet" href="css/owner.css?v=47">
<link rel="stylesheet" href="css/light.css?v=47">
<script id="tgWebViewCachePurgeV47">
(function(){
  try {
    var VER = 'v47_tg_sync';
    if (localStorage.getItem('coffee_sw_ver') !== VER) {
      localStorage.setItem('coffee_sw_ver', VER);
      if (typeof caches !== 'undefined' && caches.keys) {
        caches.keys().then(function(ks){
          ks.forEach(function(k){ if (k !== 'kofeinya-enterprise-v47-tg-sync') caches.delete(k); });
        });
      }
      if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
        navigator.serviceWorker.getRegistrations().then(function(regs){
          regs.forEach(function(r){ try { r.update(); } catch(_){} });
        });
      }
    }
  } catch (_) {}
})();
</script>
</head>
<body>
<header class="app-header"><div class="wrap">
  <div class="brand"><div><h1><svg viewBox="0 0 32 32" fill="none" stroke="#e0a76a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4c0 2.5 2.5 2.5 2.5 5M16 3c0 3 2.5 3 2.5 6M22 4c0 2.5 2.5 2.5 2.5 5"/><path d="M5 13h18v7a9 9 0 0 1-18 0v-7Z" fill="rgba(224,167,106,.18)"/><path d="M23 15h2.5a3.5 3.5 0 0 1 0 7H23"/><path d="M3 29h22"/></svg>Кофейня</h1><span class="sub" id="sub">Панель владельца</span> <span id="netStatusBadge" class="net-pill online" style="margin-left:6px">🟢 Онлайн</span></div></div>
  <nav id="ownerMainNav" aria-label="Разделы владельца">
    <button type="button" data-osec="dashboard" class="on">🏎️ Дашборд</button>
    <button type="button" data-osec="report" class="">📊 Отчёты</button>
    <button type="button" data-osec="admin" class="">⚙️ Управление</button>
  </nav>
  <div style="display:flex;align-items:center;gap:8px"><button type="button" id="ownerNotifBtn" style="border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.1);color:#f6ece2;border-radius:12px;height:40px;padding:0 12px;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px">🔔 <span id="ownerNotifCount">0</span></button><button class="theme-btn" id="theme" type="button" aria-label="Тема">🌙</button></div>
</div></header>
<main>
  <div id="err" class="al" hidden></div>
  <div id="ownerNotifDrawer" class="card" hidden style="margin-bottom:14px;border:2px solid var(--accent,#9c5a25)"></div>

  <!-- 1. ДАШБОРД ВЛАДЕЛЬЦА -->
  <div id="ownerSecDashboard"></div>

  <!-- 2. ФИНАНСОВЫЕ ОТЧЁТЫ И P&L -->
  <div id="ownerSecReport" hidden></div>

  <!-- 3. УПРАВЛЕНИЕ И НАСТРОЙКИ (9 ВКЛАДОК В 1 СТРОЧКУ) -->
  <div id="content" hidden>
    <div class="seg" id="tabs" role="tablist" aria-label="Что редактировать">
      <button data-t="checklists">📋 Таймлайн</button>
      <button data-t="tasks">📝 Задачи</button>
      <button data-t="inc">🔧 Поломки</button>
      <button data-t="ttk">☕ Техкарты</button>
      <button data-t="cash">⚖️ Выручка</button>
      <button data-t="exp">💸 Расходы</button>
      <button data-t="staff">👥 Штат</button>
      <button data-t="audit">⭐ Аудит</button>
      <button data-t="set">⚙️ Настройки</button>
    </div>
    <section class="card" id="panel"></section>
  </div>
</main>
<dialog id="dlg"><form id="dform" method="dialog"><h2 id="dtitle" style="font-size:20px"></h2><div id="dfields"></div><div id="derr" style="color:var(--bad);font-size:14px;margin-top:8px"></div>
  <div class="acts" style="margin-top:12px"><button class="b" type="button" id="dcancel">Отмена</button><button class="p" id="dsave" value="ok">Сохранить</button></div></form></dialog>
<div class="toast" id="toast" hidden></div>
<script src="config.js?v=47"></script>
<script src="js/defaults.js?v=47"></script>
<script src="js/security.js?v=47"></script>
<script src="js/storage.js?v=47"></script>
<script src="js/analytics.js?v=47"></script>
<script src="js/sync.js?v=47"></script>
<script src="js/telegram.js?v=47"></script>
<script src="tests/unit-tests.js"></script>
<script src="js/page-admin.js?v=47"></script>
<script src="js/page-owner.js?v=47"></script>
<script src="app.js?v=47" defer></script>
</body>
</html>
