<style>

:root {

  --warn: #A46200; --warn-soft: rgba(164,98,0,0.13); --bad: #B33A3A; --bad-soft: rgba(179,58,58,0.12);

}
html[data-theme="dark"] {

  --ink: #F2E7DF; --muted: #B8A79A; --accent: #E8B88A; --accent-soft: rgba(232,184,138,0.16);
  --accent-ink: #2B1A0D; --good: #8AD6A7; --good-soft: rgba(138,214,167,0.15);
  --warn: #F0BE6F; --warn-soft: rgba(240,190,111,0.15); --bad: #F2A2A2; --bad-soft: rgba(242,162,162,0.15);
  --border: rgba(242,231,223,0.10); --shadow: 0 2px 14px rgba(0,0,0,0.28);
}
* { box-sizing: border-box; }
html, body { margin:0; padding:0; background:var(--bg); color:var(--ink); font-family:var(--font); font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased; transition:background .2s,color .2s; }
button, input, select, textarea { font-family:inherit; color:inherit; }
button { cursor:pointer; border:none; background:transparent; }
.topbar { position:sticky; top:0; z-index:40; background:var(--bg); border-bottom:1px solid var(--border); padding:10px 18px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
.brand { display:flex; align-items:center; gap:10px; }
.brand-dot { width:36px; height:36px; border-radius:14px; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; font-weight:800; font-size:15px; }
.brand-title { font-weight:750; font-size:16px; }
.brand-sub { font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.live-pill { display:inline-flex; align-items:center; gap:5px; padding:2px 9px; border-radius:999px; background:var(--good-soft); color:var(--good); font-weight:650; font-size:11px; }
.live-dot { width:7px; height:7px; border-radius:50%; background:currentColor; }
.top-actions { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.chip-btn { padding:7px 13px; border-radius:999px; background:var(--surface); border:1px solid var(--border); font-size:12.5px; font-weight:650; display:inline-flex; align-items:center; gap:6px; }
.chip-btn:hover { background:var(--surface-2); }
.chip-btn.accent { background:var(--accent); color:var(--accent-ink); border-color:transparent; }
.chip-btn.good { background:var(--good-soft); color:var(--good); border-color:transparent; }
.chip-btn.bad { background:var(--bad-soft); color:var(--bad); border-color:transparent; }
.chip-btn.warn { background:var(--warn-soft); color:var(--warn); border-color:transparent; }
.seg { display:inline-flex; background:var(--surface); padding:4px; border-radius:999px; border:1px solid var(--border); gap:2px; }
.seg button { padding:6px 12px; border-radius:999px; font-size:12.5px; font-weight:650; color:var(--muted); }
.seg button.active { background:var(--accent); color:var(--accent-ink); }
.card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius-card); padding:18px; box-shadow:var(--shadow); }
.card-soft { background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:12px 14px; }
.card-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
.card-title { font-size:16px; font-weight:750; margin:0; }
.card-sub { font-size:12px; color:var(--muted); }
.badge { display:inline-flex; align-items:center; justify-content:center; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:700; background:var(--surface-2); color:var(--ink); }
.badge.good { background:var(--good-soft); color:var(--good); }
.badge.warn { background:var(--warn-soft); color:var(--warn); }
.badge.bad { background:var(--bad-soft); color:var(--bad); }
.badge.accent { background:var(--accent-soft); color:var(--accent); }
.stack { display:flex; flex-direction:column; gap:10px; }
.row-item { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 14px; border-radius:18px; background:var(--surface); border:1px solid var(--border); flex-wrap:wrap; }
.row-main { min-width:0; flex:1; }
.row-title { font-weight:700; font-size:14px; }
.row-sub { font-size:12px; color:var(--muted); margin-top:2px; }
.pbar { height:7px; background:var(--surface-2); border-radius:99px; overflow:hidden; margin-top:6px; }
.pbar > div { height:100%; background:var(--accent); border-radius:99px; transition:width .25s; }
.pbar.good > div { background:var(--good); }
.field { display:flex; flex-direction:column; gap:5px; margin-bottom:10px; }
.field label { font-size:12px; font-weight:700; color:var(--muted); }
.field input, .field select, .field textarea { width:100%; padding:9px 12px; border-radius:14px; background:var(--surface); border:1px solid var(--border); font-size:14px; }
.grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.grid-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
@media (max-width:640px) { .grid-2, .grid-3 { grid-template-columns:1fr; } }
.btn-lg { width:100%; padding:12px 16px; border-radius:999px; font-size:14px; font-weight:750; display:inline-flex; align-items:center; justify-content:center; gap:8px; }
.btn-lg.primary { background:var(--accent); color:var(--accent-ink); }
.btn-lg.primary:disabled { opacity:0.45; cursor:not-allowed; }
.btn-lg.danger { background:var(--bad-soft); color:var(--bad); }
.btn-lg.soft { background:var(--surface-2); color:var(--ink); }
.tbl-wrap { overflow-x:auto; }
table { width:100%; border-collapse:collapse; font-size:13.5px; }
th, td { text-align:left; padding:9px 10px; border-bottom:1px solid var(--border); vertical-align:middle; }
th { font-size:11.5px; text-transform:uppercase; letter-spacing:0.03em; color:var(--muted); font-weight:700; }
tr:last-child td { border-bottom:none; }
.modal-bg { position:fixed; inset:0; background:rgba(0,0,0,0.48); z-index:80; display:none; align-items:center; justify-content:center; padding:16px; }
.modal-bg.open { display:flex; }
.modal-card { background:var(--card); border:1px solid var(--border); border-radius:28px; max-width:480px; width:100%; padding:20px; box-shadow:0 20px 50px rgba(0,0,0,0.3); max-height:86vh; overflow-y:auto; }
.toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:999px; font-size:13.5px; font-weight:650; opacity:0; pointer-events:none; z-index:90; transition:opacity .2s,transform .2s; box-shadow:0 8px 24px rgba(0,0,0,0.22); }
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

.wrap { max-width: 1200px; margin: 0 auto; padding: 18px; }
.admin-nav { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px; }
.admin-nav button { padding:9px 16px; border-radius:999px; background:var(--surface); border:1px solid var(--border); font-size:13.5px; font-weight:650; color:var(--muted); display:inline-flex; align-items:center; gap:6px; }
.admin-nav button.active { background:var(--accent); color:var(--accent-ink); border-color:transparent; }
.kpi-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; margin-bottom:16px; }
@media (max-width:780px) { .kpi-grid { grid-template-columns:repeat(2,minmax(0,1fr)); } }
.kpi { background:var(--card); border:1px solid var(--border); border-radius:22px; padding:16px; box-shadow:var(--shadow); }
.kpi-lbl { font-size:12px; color:var(--muted); font-weight:600; }
.kpi-val { font-size:24px; font-weight:800; margin:4px 0 2px; }
.kpi-meta { font-size:12px; color:var(--muted); }
.chart-wrap { display:grid; grid-template-columns:repeat(10,minmax(0,1fr)); gap:8px; align-items:end; height:150px; padding-top:20px; position:relative; }
.chart-plan-line { position:absolute; left:0; right:0; border-top:1.5px dashed var(--accent); opacity:.55; pointer-events:none; }
.chart-plan-lbl { position:absolute; right:0; top:-18px; font-size:11px; font-weight:650; color:var(--accent); }
.bar-col { display:flex; flex-direction:column; align-items:center; gap:5px; height:100%; justify-content:flex-end; }
.bar-val { font-size:10.5px; font-weight:700; color:var(--muted); }
.bar-fill { width:100%; max-width:34px; border-radius:10px 10px 4px 4px; background:var(--accent); }
.bar-fill.hit { background:var(--good); }
.bar-dt { font-size:10.5px; color:var(--muted); font-weight:600; }
</style>

const LIVE_SNAPSHOT = {"location": "Кофейня №1", "plan": 2200, "minAvgCheck": 35, "planChecks": 75, "staff": [{"id": "st1", "name": "Соня", "role": "Бариста", "shop": "Кофейня №1", "active": true}, {"id": "st2", "name": "Алина", "role": "Бариста", "shop": "Кофейня №1", "active": true}, {"id": "st3", "name": "Настя", "role": "Бариста", "shop": "Кофейня №1", "active": true}, {"id": "st_mwe6cp12", "name": "Макс", "role": "Администратор", "shop": "Кофейня №1", "active": true}, {"id": "st_mwnboii9", "name": "Лаура", "role": "Бариста", "shop": "Кофейня №1", "active": true}], "blocks": [{"id": "blk_open", "name": "Открытие", "openTime": "06:00", "deadline": "10:34", "isCash": false, "active": true}, {"id": "blk_lc1", "name": "Лайн Чек 1", "openTime": "06:00", "deadline": "10:34", "isCash": false, "active": true}, {"id": "blk_lc2", "name": "Лайн Чек 2", "openTime": "06:00", "deadline": "10:23", "isCash": false, "active": true}, {"id": "blk_close", "name": "Закрытие", "openTime": "21:30", "deadline": "22:30", "isCash": false, "active": true}, {"id": "blk_mwnb34lr", "name": "Лайн Чек Демо", "openTime": "07:00", "deadline": "23:59", "isCash": false, "active": true}, {"id": "blk_cash", "name": "Касса", "openTime": "22:00", "deadline": "23:59", "isCash": true, "active": true}, {"id": "blk_good_deeds", "name": "Карта добрых дел", "openTime": "11:00", "deadline": "22:00", "isCash": false, "active": true}], "tasks": [{"id": "o01", "block": "Открытие", "group": "Открытие · Стандарт (o01–o08)", "title": "📸 Фото-селфи", "instruction": "Фото перед началом смены.\n• Волосы аккуратно убраны в хвост или пучок.\n• Опрятный внешний вид, чистая рабочая форма и фартук.\n• Минимальный аккуратный макияж, отсутствие лишних украшений на руках.\n• Сделать селфи при хорошем освещении за баром.", "photo": true, "owner": "Администратор"}, {"id": "o02", "block": "Открытие", "group": "Открытие · Стандарт (o01–o08)", "title": "🪑 Зал и посадочные места", "instruction": "Подготовка гостевого зала к открытию:\n• Столы насухо протёрты от пыли и крошек дезинфицирующим средством.\n• Диваны и кресла устойчивы, обивка без пятен и мусора.\n• Декор на столах и полках выровнен по центру, свечи установлены.\n• Сделать обзорное фото чистого зала.", "photo": true, "owner": "Администратор"}, {"id": "o03", "block": "Открытие", "group": "Открытие · Стандарт (o01–o08)", "title": "☕ Кофемашина", "instruction": "Подготовка кофемашины к смене:\n• Кофемашина включена, бойлер вышел на рабочее давление и температуру.\n• Холдеры (портафильтры) чистые и прогретые, старый жмых полностью отсутствует.\n• Группы пролиты горячей водой и прогреты.\n• Хромированные детали и корпус натёрты микрофиброй до блеска, подтёки и накипь отсутствуют.", "photo": true, "owner": "Техник"}, {"id": "o04", "block": "Открытие", "group": "Открытие · Стандарт (o01–o08)", "title": "⚙️ Гриндеры и Проверка помола", "instruction": "Настройка кофемолок (гриндеров) и эспрессо:\n• Гриндеры включены, бункеры заполнены свежим зерном.\n• Проверен и настроен помол: контрольный пролив эспрессо по весам и таймеру (проверка граммовки, времени экстракции и вкуса).\n• Зона вокруг дозатора и стол под гриндером очищены, остатки молотого кофе отсутствуют.\n• Зафиксировать утренние показания счётчика кофемашины.", "photo": true, "owner": "Шеф-бариста"}, {"id": "o05", "block": "Открытие", "group": "Открытие · Стандарт (o01–o08)", "title": "🔥 Термопот", "instruction": "Проверка водонагревателя (термопота):\n• Включён в сеть, заполнен очищенной питьевой водой до отметки максимума.\n• Температура воды вышла на рабочий режим (92–95 °C).\n• Корпус и каплесборник чистые, без подтёков и накипи.", "photo": false, "owner": "Техник"}, {"id": "o06", "block": "Открытие", "group": "Открытие · Стандарт (o01–o08)", "title": "💡 Оборудование и подсветка", "instruction": "Включение света, звука и медиа:\n• Проектор, аудиоколонки (фоновая музыка на комфортной громкости) и декоративная подсветка включены.\n• Световая инсталляция и освещение у зеркала работают без мерцаний.", "photo": false, "owner": "Техник"}, {"id": "o07", "block": "Открытие", "group": "Открытие · Стандарт (o01–o08)", "title": "🌿 Летняя терраса Фото", "instruction": "Подготовка уличной зоны / летней террасы:\n• Уличные столы и стулья аккуратно расставлены по местам и насухо протёрты.\n• Пледы чистые, без пятен, аккуратно сложены.\n• Прилегающая территория и входная группа чистые, без мусора и листьев.\n• Сделать контрольное фото летней террасы.", "photo": true, "owner": "Администратор"}, {"id": "o08", "block": "Открытие", "group": "Открытие · Стандарт (o01–o08)", "title": "🧼 Санузел для гостей 📸 2", "instruction": "Важно !!! Полная утренняя проверка гостевого санузла (сделать 2 фото):\n• 🪞 Зеркало: протёрто средством для стёкол без разводов и следов пальцев, поверхность блестящая.\n• 🧻 Расходники: жидкое мыло в дозаторе в наличии, туалетная бумага и бумажные полотенца пополнены.\n• 🚽 Унитаз и бачок: чистые, обработаны, кнопка слива работает исправно, протечек нет, посторонний запах отсутствует.\n• 🗑 Мусорное ведро 📸: пустое, чистое, заправлен новый мусорный пакет.", "photo": true, "owner": "Администратор"}, {"id": "d01", "block": "Лайн Чек 1", "group": "День · Обход смены (d01–d06)", "title": "🌬️ Помещение проветрено и свежесть воздуха", "instruction": "Контроль микроклимата в зале:\n• Помещение проветрено, работает вентиляция или кондиционер по сезону.\n• Нет затхлого запаха, запаха гари или кухни, воздух в зале свежий и комфортный для гостей.", "photo": false, "owner": "Администратор"}, {"id": "d02", "block": "Лайн Чек 1", "group": "День · Обход смены (d01–d06)", "title": "☕ Оборудование проверено", "instruction": "Контроль работы барного оборудования в течение смены:\n• Кофемашина, кофемолка, чайник/термопот, холодильник и десертная витрина включены.\n• Все приборы держат рабочую температуру и работают штатно без аварийных сигналов и посторонних шумов.", "photo": false, "owner": "Техник"}, {"id": "d03", "block": "Лайн Чек 1", "group": "", "title": "🥛 Заготовки для напитков и молочные продукты", "instruction": "Молоко ≥5л, альтернативное молоко ≥2л, сливки ≥2 упаковок, сиропы и топпинги на своих местах, лёд готовы\n \n 📸 Фото холодильника в \"подсобке\"\n 📸 фото холодильника за стойкой", "photo": true, "owner": "Администратор"}, {"id": "d04", "block": "Лайн Чек 1", "group": "День · Обход смены (d01–d06)", "title": "🍰 Десерты и закуски", "instruction": "Контроль витрины с десертами:\n• Закуски и десерты пополнены и представлены в ДОСТАТОЧНОМ количестве.\n• Срок годности и маркировки актуальны, заветренных позиций нет.\n• Витрина чистая внутри и снаружи, фронтальное стекло без разводов и отпечатков.\n• Десерты и ценники выложены ровно и аккуратно 📸 (сделать фото витрины).", "photo": true, "owner": "Закупщик"}, {"id": "d05", "block": "Лайн Чек 1", "group": "День · Обход смены (d01–d06)", "title": "🧼 Зона гостя и стойка на виду", "instruction": "Поддержание чистоты зоны выдачи и гостевой стойки:\n• Стойка и прилавок со стороны гостя идеально чистые: нет крошек, капель кофе, пятен и липких следов.\n• Грязная посуда со столов и стойки своевременно убрана в мойку.\n• Диспенсер с салфетками, крышками, трубочками и сахаром пополнен.", "photo": true, "owner": "Администратор"}, {"id": "d06", "block": "Лайн Чек 1", "group": "День · Обход смены (d01–d06)", "title": "🚽 Санузел проверен (2-3 сек видео) 📹", "instruction": "Дневная проверка санузла для гостей:\n• Санузел чистый, пол сухой, раковина и зеркало без брызг воды.\n• Туалетная бумага, мыло и бумажные полотенца в наличии.\n• Мусорное ведро не переполнено, запах свежий.\n• 📹 Сделать короткий обзорный видео-отчёт (2–3 секунды).", "photo": true, "owner": "Администратор"}, {"id": "c01", "block": "Закрытие", "group": "Закрытие · Стандарт (c01–c14)", "title": "🧴 Диспенсер с расходниками заполнен", "instruction": "Подготовка органайзера и расходников на утро:\n• Диспенсер полностью заполнен салфетками, порционным сахаром, трубочками и размешивателями (палочками).\n• Все открытые складские упаковки с расходниками плотно закрыты от пыли и влаги.", "photo": true, "owner": "Закупщик"}, {"id": "c02", "block": "Закрытие", "group": "Закрытие · Стандарт (c01–c14)", "title": "🪑 Зал и посадочные места", "instruction": "Уборка гостевого зала перед закрытием:\n• Все столы тщательно протёрты от крошек и пятен.\n• Диваны и стулья устойчивы, очищены щёткой/пылесосом от крошек.\n• Декор выровнен, пыль на полках и подоконниках отсутствует.\n• Все свечи в зале обязательно погашены.", "photo": true, "owner": "Администратор"}, {"id": "c03", "block": "Закрытие", "group": "Закрытие · Стандарт (c01–c14)", "title": "☕ Кофемашина", "instruction": "Замывка и выключение кофемашины:\n• Проведена промывка групп со слепым фильтром и профессиональным средством (Cafiza), затем промывка чистой водой.\n• Холдеры и сита вымыты, кофейный жмых и масла полностью удалены, съёмные детали и решётка поддона промыты и установлены на место.\n• Стимеры (паровые трубки) очищены от молока и продуты.\n• Подтёков воды и накипи нет, хромированные детали натёрты насухо. Кофемашина выключена.", "photo": true, "owner": "Техник"}, {"id": "c04", "block": "Закрытие", "group": "Закрытие · Стандарт (c01–c14)", "title": "⚙️ Гриндеры", "instruction": "Очистка кофемолок и фиксация счётчиков:\n• Гриндеры протёрты снаружи и в зоне выдачи, остатки молотого кофе сметены кистью, устройства выключены.\n• Показания счётчиков порций кофемашины/гриндеров сняты и внесены в кассовый отчёт смены.", "photo": true, "owner": "Шеф-бариста"}, {"id": "c05", "block": "Закрытие", "group": "Закрытие · Стандарт (c01–c14)", "title": "🧽 Рабочая зона", "instruction": "Замывка барной станции:\n• Рабочая столешница и фартук вымыты с моющим средством и протёрты насухо.\n• Липких пятен от сиропов, молока и кофе нет.\n• Весь мелкий инвентарь (питчеры, темпер, коврик, весы) чистый и расставлен по местам.", "photo": true, "owner": "Администратор"}, {"id": "c06", "block": "Закрытие", "group": "Закрытие · Стандарт (c01–c14)", "title": "🔥 Термопот", "instruction": "Отключение термопота:\n• Заполнен очищенной водой для утренней смены.\n• Питание выключено, корпус и каплесборник протёрты насухо, без подтёков.", "photo": false, "owner": "Техник"}, {"id": "c07", "block": "Закрытие", "group": "Закрытие · Стандарт (c01–c14)", "title": "💰 Касса и терминалы Фото", "instruction": "Закрытие кассовой смены:\n• Наличные в кассе пересчитаны и сверены с отчётом.\n• Разменная сумма на утро оставлена в кассе в полном объёме (250 руб мелкими купюрами).\n• Фотоотчёт кассы сделан после подсчёта.\n• Банковский терминал и чековый принтер выключены, рабочий телефон поставлен на зарядку.", "photo": true, "owner": "Администратор"}, {"id": "c08", "block": "Закрытие", "group": "Закрытие · Стандарт (c01–c14)", "title": "🍰 Холодильник и витрина", "instruction": "Уход за витриной и хранением десертов:\n• Подсветка витрины выключена (холодильный контур работает по регламенту), стёкла и полки протёрты.\n• Отпечатков пальцев и разводов на стекле нет.\n• Все десерты проверены по срокам, закрыты крышками/плёнкой от заветривания.", "photo": true, "owner": "Закупщик"}, {"id": "c09", "block": "Закрытие", "group": "Закрытие · Стандарт (c01–c14)", "title": "🪞 Зеркала и остекление", "instruction": "Натирка зеркал и входного остекления:\n• Зеркала в зале и стеклянные поверхности входной группы протёрты со средством для стёкол.\n• Разводов, брызг и следов пальцев нет, поверхности сухие.", "photo": false, "owner": "Администратор"}, {"id": "c10", "block": "Закрытие", "group": "Закрытие · Стандарт (c01–c14)", "title": "💡 Оборудование и подсветка", "instruction": "Отключение иллюминации и медиа:\n• Проектор, неоновая/декоративная подсветка, аудиоколонки и дополнительное освещение выключены.\n• Световая инсталляция у зеркал и подсветка стола — выключены.", "photo": false, "owner": "Техник"}, {"id": "c11", "block": "Закрытие", "group": "Закрытие · Стандарт (c01–c14)", "title": "🌿 Летняя терраса", "instruction": "Уборка летней террасы на ночь:\n• Уличные столы и стулья протёрты и занесены внутрь помещения (или зафиксированы по регламенту).\n• Пледы проверены (чистые, без пятен и прожогов) и аккуратно сложены на хранение.", "photo": true, "owner": "Администратор"}, {"id": "c12", "block": "Закрытие", "group": "Закрытие · Стандарт (c01–c14)", "title": "🧼 Санузел для гостей", "instruction": "Полная вечерняя уборка санузла по чек-листу:\n• 🚻 Входная дверь — проверена исправность замка и доводчика; полотно двери и ручка протёрты, без следов рук.\n• 🧴 Раковина и смеситель — вымыты и вытерты насухо; смеситель натёрт без налёта и подтёков, вода не капает.\n• 🪞 Зеркало — протёрто без разводов и следов пальцев, поверхность блестящая.\n• 🧻 Расходники — проверен и пополнен запас жидкого мыла, туалетной бумаги и бумажных полотенец на утро.\n• 🚽 Унитаз и бачок — обработаны дезсредством, крышка опущена, бачок не протекает, запах отсутствует.\n• 🧹 Пол и стены — пол вымыт с дезсредством и высушен, плитка без пятен и налёта.\n• 🗑 Мусорное ведро — освобождено, вымыто, установлен новый пакет.\n• 💡 Освещение и вентиляция — свет и вытяжка выключены, проверена исправность выключателя.", "photo": true, "owner": "Администратор"}, {"id": "c13", "block": "Закрытие", "group": "Закрытие · Стандарт (c01–c14)", "title": "🚪 Закрытие помещения", "instruction": "Финальная проверка перед выходом:\n• Все декоративные подсветки, сплит-система и барное оборудование (кроме холодильников) выключены.\n• Жалюзи / роллеты опущены, окна закрыты.", "photo": false, "owner": "Администратор"}, {"id": "c14", "block": "Закрытие", "group": "Закрытие · Стандарт (c01–c14)", "title": "🗑 Мусор выброшен, баки на улице пустые 📸💬", "instruction": "Вынос всего мусора из кофейни и уличных урн:\n• Все мусорные пакеты из-под бара, подсобки и санузла завязаны и вынесены в контейнер.\n• Уличные баки у входа очищены, внутрь вставлены чистые пакеты.\n• 📸 Сделать фото пустых баков и закрытой входной двери.", "photo": true, "owner": "Администратор"}, {"id": "pa01", "block": "Открытие", "group": "Открытие · Приёмка смены (pa01–pa21)", "title": "📸 Фото-селфи 📸", "instruction": "Фото перед началом смены.\nВолосы убраны в хвост, аккуратный внешний вид, чистая форма, минимальный макияж.", "photo": true, "owner": "Администратор"}, {"id": "pa02", "block": "Открытие", "group": "Открытие · Приёмка смены (pa01–pa21)", "title": "🌿 Летняя терраса Фото📸", "instruction": "Столы и стулья расставлены, протёрты. Пледы чистые, сложены аккуратно, территория без мусора. Сделать фото.", "photo": true, "owner": "Администратор"}, {"id": "pa03", "block": "Открытие", "group": "Открытие · Приёмка смены (pa01–pa21)", "title": "🪑 Зал и посадочные места", "instruction": "Столы чистые, без крошек и пятен, диваны устойчивые, декор выровнен, пыль отсутствует, посадка полностью готова к приёму гостей.", "photo": false, "owner": "Администратор"}, {"id": "pa04", "block": "Открытие", "group": "Открытие · Приёмка смены (pa01–pa21)", "title": "☕ Кофемашина + ☝️холдеры", "instruction": "Кофемашина включена и прогрета.\nСъёмные детали и чистые холдеры на месте.\nПодтёков воды и накипи нет, хромированные детали натёрты до блеска.", "photo": true, "owner": "Техник"}, {"id": "pa05", "block": "Открытие", "group": "Открытие · Приёмка смены (pa01–pa21)", "title": "⚙️ Гриндеры", "instruction": "Гриндеры протёрты, старые остатки кофе отсутствуют, помол проверен.\nУтренние показания счётчиков сверены и внесены в отчёт.", "photo": false, "owner": "Шеф-бариста"}, {"id": "pa06", "block": "Открытие", "group": "Открытие · Приёмка смены (pa01–pa21)", "title": "🧽 Рабочая зона и Мойка за стойкой", "instruction": "Рабочая поверхность вымыта и протёрта насухо, пятен от сиропов и кофе нет, порядок соблюдён.\nМойка за стойкой чистая, грязная посуда отсутствует.", "photo": false, "owner": "Администратор"}, {"id": "pa07", "block": "Открытие", "group": "Открытие · Приёмка смены (pa01–pa21)", "title": "🔥 Термопот", "instruction": "Заполнен очищенной водой, включён на прогрев, корпус сухой ": "Администратор"}, {"id": "u03", "block": "Закрытие", "group": "Закрытие · Уборка помещения (u01–u07)", "title": "🚪 Входная дверь натёрта, без следов и пятен", "instruction": "Чистка входной двери:\n• Стекло входной двери с обеих сторон натёрто средством для стёкол без разводов и отпечатков рук.\n• Дверная ручка, профиль и порог протёрты влажной, затем сухой салфеткой.", "photo": false, "owner": "Администратор"}, {"id": "u04", "block": "Закрытие", "group": "Закрытие · Уборка помещения (u01–u07)", "title": "🪟 Зеркала и Стёкла натёрты, без разводов и загрязнений 📸", "instruction": "Мойка зеркал и витринных стёкол:\n• Все зеркала в зале, у фотозоны и в санузле натёрты микрофиброй со средством для стёкол.\n• Подтёков, разводов и следов пальцев нет.\n• 📸 Сделать контрольное фото.", "photo": true, "owner": "Администратор"}, {"id": "u05", "block": "Закрытие", "group": "Закрытие · Уборка помещения (u01–u07)", "title": "🛋️ Диваны отодвинуты, выполнена влажная уборка полов под диванами 📸", "instruction": "Важно!!! ☝️ ☝️ ☝️\n• Аккуратно отодвинуть диваны от стен, подмести крошки и пыль, тщательно вымыть пол и плинтусы под диванами, затем ровно вернуть диваны на место.\n• Регулярно менять грязную воду в ведре на чистую.\n• Выливать грязную воду ТОЛЬКО на улице в отведённое место (категорически запрещено выливать в мойку в подсобке — слив забивается песком!).\n• 📸 Сделать фото чистого пола под диванами.", "photo": true, "owner": "Администратор"}, {"id": "u06", "block": "Закрытие", "group": "Закрытие · Уборка помещения (u01–u07)", "title": "🧹 Влажная уборка полов в зале", "instruction": "Финальная мойка полов:\n• Пол во всём гостевом зале, за барной стойкой и в проходах подметён и тщательно вымыт с моющим средством.\n• Углы и плинтусы чистые, без разводов и липких следов.\n• Грязная вода после уборки вылита на улице, моп/тряпка промыты и поставлены на просушку.", "photo": true, "owner": "Администратор"}, {"id": "u07", "block": "Закрытие", "group": "Закрытие · Уборка помещения (u01–u07)", "title": "🚽 Туалет вымыт и продезинфицирован 📸 (видео 5-7 сек)", "instruction": "Финальная дезинфекция санузла:\n• Унитаз, раковина, смеситель, дверные ручки и пол вымыты и обработаны дезинфицирующим средством.\n• Мусор выброшен, вставлен чистый пакет, расходники пополнены на утро.\n• 📹 Снять обзорное видео чистого санузла (5–7 секунд).", "photo": true, "owner": "Администратор"}, {"id": "q01", "block": "Лайн Чек 2", "group": "День · Чистка До/После (q01–q09)", "title": "☕ Кофемашина (фото до и после)", "instruction": "• Корпус протёрт, без пятен, подтёков и кофейных следов.\n• Группы промыты, остатки кофе отсутствуют.\n• Портафильтры вымыты, без кофейных масел и налёта.\n• Паровые трубки очищены и продуты.\n• Поддон и решётка вымыты, без остатков воды и кофе.\n• Поверхности вокруг чистые, без кофейной гущи.\n• 📸 Сделать фото ДО и ПОСЛЕ чистки.", "photo": true, "owner": "Техник"}, {"id": "q02", "block": "Лайн Чек 2", "group": "День · Чистка До/После (q01–q09)", "title": "🌪 Блендер (фото до и после)", "instruction": "• Чаша блендера вымыта, без остатков продуктов, налёта и запахов.\n• Ножи чистые, промыты со всех сторон.\n• Крышка и уплотнитель вымыты, без загрязнений в пазах.\n• Корпус и панель кнопок протёрты насухо, без капель и липкости.\n• 📸 Сделать фото ДО и ПОСЛЕ чистки.", "photo": true, "owner": "Техник"}, {"id": "q03", "block": "Лайн Чек 2", "group": "День · Чистка До/После (q01–q09)", "title": "❄️ Холодильник под стойкой (фото до и после)", "instruction": "• Полки и стенки чистые, без крошек, пятен молока и подтёков.\n• Продукты и молоко размещены аккуратно по срокам годности.\n• Посторонние запахи отсутствуют.\n• Резиновые уплотнители дверцы вымыты в складках.\n• Дверца закрывается плотно.\n• 📸 Сделать фото ДО и ПОСЛЕ чистки.", "photo": true, "owner": "Закупщик"}, {"id": "q04", "block": "Лайн Чек 2", "group": "День · Чистка До/После (q01–q09)", "title": "📦 Холодильник склад (фото до и после)", "instruction": "• Полки чистые, без загрязнений и подтёков.\n• Продукты разложены строго по категориям и промаркированы.\n• Посторонние запахи отсутствуют.\n• Уплотнители чистые, дверца закрывается плотно.\n• 📸 Сделать фото ДО и ПОСЛЕ чистки.", "photo": true, "owner": "Закупщик"}, {"id": "q05", "block": "Лайн Чек 2", "group": "День · Чистка До/После (q01–q09)", "title": "🧊 Морозилка верхняя (фото до и после)", "instruction": "• Внутренняя камера очищена, без снежной наледи, крошек и загрязнений.\n• Замороженные заготовки и продукты упакованы, подписаны и размещены аккуратно.\n• Уплотнитель чистый, дверца закрывается плотно.\n• 📸 Сделать фото ДО и ПОСЛЕ чистки.", "photo": true, "owner": "Закупщик"}, {"id": "q06", "block": "Лайн Чек 2", "group": "День · Чистка До/После (q01–q09)", "title": "🧊 Морозилка нижняя (фото до и после)", "instruction": "• Внутри чисто, ящики/полки вымыты без крошек и остатков продуктов.\n• Продукты расфасованы и размещены аккуратно.\n• Посторонние запахи отсутствуют.\n• 📸 Сделать фото ДО и ПОСЛЕ чистки.", "photo": true, "owner": "Закупщик"}, {"id": "q07", "block": "Лайн Чек 2", "group": "День · Чистка До/После (q01–q09)", "title": "🧊 Льдогенератор (фото до и после)", "instruction": "• Внутренняя камера чистая, без слизи, плесени и известкового налёта.\n• Лёд прозрачный, без постороннего запаха, совок для льда чистый.\n• Лоток и дренаж чистые, без застоя воды.\n• Корпус снаружи и вентиляционная решётка протёрты.\n• 📸 Сделать фото ДО и ПОСЛЕ чистки.", "photo": true, "owner": "Техник"}, {"id": "q08", "block": "Лайн Чек 2", "group": "День · Чистка До/После (q01–q09)", "title": "🚰 Мойка склад (фото до и после)", "instruction": "• Раковина на складе вымыта с дезсредством, без жира, налёта и остатков пищи.\n• Сливная сеточка и сифон чистые, без засоров и запаха (песок с полов в мойку не сливать!).\n• Смеситель натёрт без водного камня.\n• Поверхности и фартук вокруг мойки чистые и сухие.\n• 📸 Сделать фото ДО и ПОСЛЕ чистки.", "photo": true, "owner": "Администратор"}, {"id": "q09", "block": "Лайн Чек 2", "group": "День · Чистка До/После (q01–q09)", "title": "🚰 Мойка стойка (фото до и после)", "instruction": "• Барная раковина и ринзер чистые, без остатков молока и кофейной гущи.\n• Слив чистый, вода уходит быстро, запах отсутствует.\n• Смеситель натёрт до блеска без налёта.\n• Рабочая зона вокруг мойки сухая и чистая.\n• 📸 Сделать фото ДО и ПОСЛЕ чистки.", "photo": true, "owner": "Администратор"}, {"id": "gd1", "block": "Карта добрых дел", "group": "Карта добрых дел (периодические задачи)", "title": "🧊 Разморозка и генеральная мойка холодильника", "instruction": "📅 Периодичность: Раз в 2 недели (Вторник 14:00–18:00 — тихий день)\n⏰ Окно выполнения: 14:00 – 18:00\nВыполняется в самый тихий день (вторник с 14:00 до 18:00): отключить холодильник, полностью разморозить, промыть полки и уплотнители, навести идеальный порядок и сделать фото с камеры.", "photo": true, "owner": "Бариста"}, {"id": "gd2", "block": "Карта добрых дел", "group": "", "title": "🧂 Регенерация водоумягчителя (фильтра воды) — 2 пачки соли", "instruction": "📅 Периодичность: Раз в 4 недели (При закрытии — регенерация водоумягчителя)\n⏰ Окно выполнения: 21:30 – 22:30 (при закрытии)\nСтрого при закрытии смены (когда кофе больше не варим): скрутить крышку водоумягчителя, засыпать 2 пачки мелкой таблетированной соли, запустить цикл промывки пока моются полы.", "photo": true, "owner": "Бариста"}, {"id": "gd3", "block": "Карта добрых дел", "group": "Карта добрых дел (периодические задачи)", "title": "🪑 Подготовка второго зала к открытию (Пт–Сб)", "instruction": "📅 Периодичность: Только Пт и Сб (2-й зал / пик)\n⏰ Окно выполнения: 07:30 – 08:30\nВ пятницу и субботу открывается 2-й зал: включить освещение, проверить посадку, протереть столы и подготовить станцию.", "photo": true, "owner": "Бариста"}, {"id": "gd4", "block": "Карта добрых дел", "group": "Карта добрых дел (периодические задачи)", "title": "🧽 Глубокая замочка холдеров, сеток и питчеров в химии", "instruction": "📅 Периодичность: 2 раза в неделю (Ч function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function initTheme(btnId) {
  const mql = window.matchMedia('(prefers-color-scheme: dark)');
  let mode = 'auto';
  try { mode = localStorage.getItem(THEME_KEY) || 'auto'; } catch(_) {}
  function apply() {
    const eff = mode === 'auto' ? (mql.matches ? 'dark' : 'light') : mode;
    document.documentElement.setAttribute('data-theme', eff);
    const b = document.getElementById(btnId);
    if (b) b.textContent = mode === 'auto' ? '🌓 Авто' : (mode === 'light' ? '☀️ Светлая' : '🌙 Тёмная');
  }
  mql.addEventListener('change', () => { if (mode === 'auto') apply(); });
  window.addEventListener('storage', (e) => { if (e.key === THEME_KEY) { mode = e.newValue || 'auto'; apply(); } });
  const b = document.getElementById(btnId);
  if (b) b.onclick = () => {

}

                <td><b>${c.checks}</b> <span class="badge ${c.checks>=dp.checks?'good':'warn'}">/ ${dp.checks}</span></td>
                <td><b>${avgC} ₽</b> <span class="badge ${avgC>=dp.avg?'good':'bad'}">≥ ${dp.avg} ₽</span></td>
                <td style="color:var(--muted)">${fmtRub(c.cash)} / ${fmtRub(c.card)}</td>
                <td>${esc(c.barista)}</td>
              </tr>`;
            }).join('')}
          </tbody></table></div>
        </div>
        <div class="grid-2" style="align-items:start;">
          <div class="card">
            <div class="card-head"><div><h2 class="card-title">Расходы (${fmtRub(totalExp)})</h2></div><button class="chip-btn accent" id="e-add">+ Расход</button></div>
            <div class="stack">${state.expenses.map(e=>`<div class="row-item"><div class="row-main"><div class="row-title">${esc(e.category)} · ${fmtRub(e.amount)}</div><div class="row-sub">${e.date} ${e.comment?'· '+esc(e.comment):''}</div></div><button class="chip-btn bad" data-de="${esc(e.id)}">✕</button></div>`).join('')}</div>
          </div>
          <div class="card">
            <div class="card-head"><div><h2 class="card-title">Индивидуальные планы по дням (Пн–Вс)</h2><div class="card-sub">Учитываются в дашборде, графике и сводках</div></div></div>
            <div class="tbl-wrap"><table><thead><tr><th>День</th><th>План выручки</th><th>Чеков</th><th>Мин. ср. чек</th><th>Смена</th><th></th></tr></thead><tbody>
              ${state.plans.map((p,i)=>`<tr><td><b>${esc(p.day)}</b></td><td><b>${fmtRub(p.rev)}</b></td><td>${p.checks}</td><td><span class="badge accent">${p.avg || p.avgCheck || state.minAvgCheck || 35} ₽</span></td><td style="font-size:12px;color:var(--muted)">${esc(p.roster)}</td><td><button class="chip-btn" data-ep="${i}" style="padding:4px 8px;">✏️</button></td></tr>`).join('')}
            </tbody></table></div>
          </div>
        </div>`;
      const csvIn = document.getElementById('csv-imp-in');
      if (csvIn) csvIn.onchange = async (ev) => {
        const files = Array.from(ev.target.files || []);
        if (!files.length || !window.CoffeePosCsvV93) return;
        const loaded = await Promise.all(files.map(f => f.text().then(text => ({ name: f.name, text }))));
        const staffNames = (state.staff || []).map(s => s.name).filter(Boolean);
        const batch = window.CoffeePosCsvV93.parsePosBatch(loaded, staffNames);
        const box = document.getElementById('csv-imp-preview');
        if (!box) return;
        box.style.display = 'block';
        if (!batch.days.length) {
          box.innerHTML = `<div class="card-soft" style="border:1px solid var(--bad);">Не удалось распознать CSV: ${esc((batch.errors[0] && batch.errors[0].error) || 'проверьте формат')}</div>`;
          return;
        }
        box.innerHTML = `
          <div class="card-soft" style="border:1px solid var(--accent);padding:12px;">
            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:8px;">
              <div><b>Готово к записи в Google Таблицу:</b> ${batch.summary.daysCount} дн. · Выручка <b>${fmtRub(batch.summary.totalRevenue)}</b> (Нал ${fmtRub(batch.summary.totalCash)} / Безнал ${fmtRub(batch.summary.totalCard)}) · Чеков: <b>${batch.summary.totalChecks}</b> · Позиций продаж: <b>${batch.summary.totalProducts}</b></div>
              <button class="chip-btn good" id="csv-imp-save">✓ Загрузить в Google Таблицу</button>
            </div>
            <div class="stack" style="gap:6px;">
              ${batch.days.map(d => `<div style="font-size:12.5px;padding:6px 8px;border-radius:8px;background:var(--surface);">
                <b>${d.date}</b> · ${esc(d.barista)} · <b>${fmtRub(d.revenue)}</b> (Нал ${fmtRub(d.cash)} / Безнал ${fmtRub(d.card)}) · Чеков: ${d.checks} · Позиций: ${d.products.length} · Кофе: ${d.coffeeQty} шт.
                ${d.warnings.length ? `<div style="color:var(--warn);font-size:11.5px;margin-top:3px;">⚠️ ${d.warnings.map(esc).join(' · ')}</div>` : ''}
              </div>`).join('')}
            </div>
          </div>`;
        document.getElementById('csv-imp-save').onclick = () => guard('Импорт CSV в Google Таблицу', async () => {
          const btn = document.getElementById('csv-imp-save');
          if (btn) { btn.disabled = true; btn.textContent = '⏳ Загрузка...'; }
          const res = window.CoffeeCloudV93 ? await window.CoffeeCloudV93.importPosBatch(batch.days, 'sum') : { ok: false };
          if (res && res.ok) {
            batch.days.forEach(d => {
              const ex = state.cash.find(c => c.date === d.date);
              if (ex) { ex.cash = d.cash; ex.card = d.card; ex.revenue = d.revenue; ex.checks = d.checks; ex.barista = d.barista; ex.topItems = d.topItems; ex.coffeeQty = d.coffeeQty; }
              else state.cash.unshift({ date: d.date, cash: d.cash, card: d.card, revenue: d.revenue, checks: d.checks, writeoff: 0, topItems: d.topItems, barista: d.barista, coffeeQty: d.coffeeQty });
            });
            state.cash.sort((a, b) => String(b.date).localeCompare(String(a.date)));
            showToast('✓ Импортировано: ' + res.count + ' дн., чеков: ' + (res.txAdded || 0) + (res.txSkipped ? (' (дублей пропущено: ' + res.txSkipped + ')') : ''));
            box.style.display = 'none';
            render();
          } else {
            if (btn) { btn.disabled = false; btn.textContent = '✓ Загрузить в Google Таблицу'; }
            showToast('Ошибка импорта: ' + ((res && res.error) || 'нет связи с сервером'));
          }
        });
      };
      document.getElementById('e-add').onclick = () => guard('Добавить расход', () => {
        openModal('Новый расход', `
          <div class="field"><label>Категория</label><select id="ec">${optList(EXP_CATS, EXP_CATS[0])}</select></div>
          <div class="field"><label>Сумма вручную (₽)</label><input id="ea" type="number" min="1" placeholder="350"></div>
          <div class="field"><label>Комментарий</label><input id="em" placeholder="Молоко / стаканчики"></div>
          <button class="btn-lg primary" id="esv">Сохранить</button>
        `);
        document.getElementById('esv').onclick = () => {
          const a = Number(document.getElementById('ea').value)||0; if (a<=0) return;
          state.expenses.unshift({ id:'#'+(state.expenses.length+1), date:TODAY, category:document.getElementById('ec').value, amount:a, comment:document.getElementById('em').value.trim() });
          saveSharedState(state, 'Администратор', 'Добавлен расход ' + fmtRub(a)); closeModal(); render();
        };
      });
      root.querySelectorAll('[data-de]').forEach(b => b.onclick = () => guard('Удалить расход', () => {
        state.expenses = state.expenses.filter(x=>x.id!==b.dataset.de);
        saveSharedState(state, 'Администратор', 'Удалён расход ' + b.dataset.de); render();
      }));
      root.querySelectorAll('[data-ep]').forEach(b => b.onclick = () => guard('План дня', () => {
        const p = state.plans[Number(b.dataset.ep)];
        const names = state.staff.filter(s=>s.active!==false).map(s=>s.name);
        const curAvg = Number(p.avg || p.avgCheck || state.minAvgCheck || 35);
        openModal('Индивидуальный план на ' + p.day, `
          <div class="grid-3">
            <div class="field"><label>План выручки (₽)</label><input id="pr" type="number" min="100" step="50" value="${Number(p.rev || state.plan || 2200)}"></div>
            <div class="field"><label>План чеков (шт.)</label><input id="pc" type="number" min="1" step="1" value="${Number(p.checks || state.planChecks || 75)}"></div>
            <div class="field"><label>Мин. средний чек (₽)</label><input id="pa" type="number" min="1" step="1" value="${curAvg}"></div>
          </div>
          <div class="grid-2"><div class="field"><label>Сотрудник</label><select id="ps">${optList(names, names.find(n=>(p.roster||'').includes(n))||names[0])}</select></div><div class="field"><label>Смена</label><select id="ph">${optList(SHIFT_HOURS, SHIFT_HOURS[0])}</select></div></div>
          <button class="btn-lg primary" id="psv">Сохранить план на ${esc(p.day)}</button>
        `);
        document.getElementById('psv').onclick = () => {
          const rVal = Math.max(100, Number(document.getElementById('pr').value) || 2200);
          const cVal = Math.max(1, Number(document.getElementById('pc').value) || 75);
          const aVal = Math.max(1, Number(document.getElementById('pa').value) || 35);
          p.rev = rVal; p.revenue = rVal;
          p.checks = cVal;
          p.avg = aVal; p.avgCheck = aVal;
          const hr = document.getElementById('ph').value;
          p.roster = hr==='Выходной'?'Выходной':document.getElementById('ps').value+' ('+hr+')';
          saveSharedState(state, 'Администратор', 'Обновлён план ' + p.day + ' (' + rVal + ' ₽ / ' + cVal + ' чек. / ≥' + aVal + ' ₽)');
          closeModal(); showToast('✓ План на ' + p.day + ' обновлён и учтён в дашборде!'); render();
        };
      }));
      return;
    }

    if (tab === 'incidents') {
      const list = incFilter==='all'?state.incidents:(incFilter==='open'?state.incidents.filter(i=>i.status!=='Решена'):state.incidents.filter(i=>i.status==='Решена'));
      root.innerHTML = `<div class="card"><div class="card-head"><div><h2 class="card-title">Поломки (${list.length})</h2></div><div class="seg"><button class="${incFilter==='open'?'active':''}" data-f="open">Открытые (${openIncs})</button><button class="${incFilter==='resolved'?'active':''}" data-f="resolved">Решённые</button><button class="${incFilter==='all'?'active':''}" data-f="all">Все</button></div></div>
      <div class="stack">${list.map(i=>`<div class="row-item"><div class="row-main"><div class="row-title">${esc(i.step)} <span class="badge ${i.priority==='Критично'?'bad':'warn'}">${esc(i.priority)}</span></div><div class="row-sub">${i.date} ${i.time} · ${esc(i.who)} — ${esc(i.text||'—')}${i.photoUrl?` · <a href="${esc(i.photoUrl)}" target="_blank" rel="noopener" style="color:var(--accent);font-weight:700;">📷 Фото (Диск)</a>`:''}</div></div>${i.status!=='Решена'?`<button class="chip-btn good" data-rs="${esc(i.id)}">✓ Решить</button>`:'<span class="badge good">Решена</span>'}</div>`).join('')}</div></div>`;
      root.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{ incFilter=b.dataset.f; render(); });
      root.querySelectorAll('[data-rs]').forEach(b=>b.onclick=()=>guard('Закрыть поломку',()=>{ const x=state.incidents.find(i=>i.id===b.dataset.rs); if(x){ x.status='Решена'; saveSharedState(state,'Администратор','Решён инцидент '+x.id); render(); } }));
      return;
    }

    if (tab === 'team') {
      root.innerHTML = `
        <div class="card" style="margin-bottom:16px;">
          <div class="card-head"><div><h2 class="card-title">Сотрудники, личные PIN и Telegram ID</h2></div><button class="chip-btn accent" id="s-add">+ Сотрудник</button></div>
          <div class="stack">${state.staff.map(s=>`<div class="row-item" style="${s.active===false?'opacity:.55;':''}"><div class="row-main"><div class="row-title">${esc(s.name)} <span class="badge">${esc(s.role)}</span> ${s.tgId?`<span class="badge accent">${esc(s.tgId)}</span>`:'<span class="badge warn">TG не привязан</span>'}</div><div class="row-sub">PIN: <b>${s.pinIsDefault?'1234 (базовый)':'•••• (личный)'}</b></div></div><button class="chip-btn" data-es="${esc(s.id)}">✏️ PIN / TG</button></div>`).join('')}</div>
        </div>
        <div class="card">
          <div class="card-head"><div><h2 class="card-title">Техкарты ILLY (${state.ttk.length})</h2></div><button class="chip-btn accent" id="k-add">+ Техкарта</button></div>
          <div class="tbl-wrap"><table><thead><tr><th>Напиток</th><th>Объём</th><th>Цена</th><th>Себест.</th><th>Маржа</th><th></th></tr></thead><tbody>
            ${state.ttk.map(k=>`<tr><td><b>${esc(k.name)}</b></td><td style="color:var(--muted)">${esc(k.vol)}</td><td>${k.price} ₽</td><td>${k.cost} ₽</td><td><span class="badge good">${k.price?Math.round(((k.price-k.cost)/k.price)*100):0}%</span></td><td><button class="chip-btn" data-ek="${esc(k.id)}" style="padding:4px 8px;">✏️</button></td></tr>`).join('')}
          </tbody></table></div>
        </div>`;
      document.getElementById('s-add').onclick = () => guard('Новый сотрудник', () => openStaffModal(null));
      root.querySelectorAll('[data-es]').forEach(b => b.onclick = () => guard('Изменить сотрудника', () => openStaffModal(b.dataset.es)));
      document.getElementById('k-add').onclick = () => guard('Новая ТТК', () => openTtkModal(null));
      root.querySelectorAll('[data-ek]').forEach(b => b.onclick = () => guard('Изменить ТТК', () => openTtkModal(b.dataset.ek)));
      return;
    }

    if (tab === 'settings') {
      root.innerHTML = `
        <div class="card" style="margin-bottom:16px;">
          <div class="card-head"><div><h2 class="card-title">Базовые параметры кофейни</h2><div class="card-sub">Используются как запасные; основной расчёт на дашборде идёт по индивидуальным планам Пн–Вс</div></div><button class="chip-btn accent" id="s-open-plans">📅 Планы по дням (Пн–Вс)</button></div>
          <div class="grid-2">
            <div class="field"><label>Название точки</label><input id="sl" value="${esc(state.location)}"></div>
            <div class="field"><label>Дневной план выручки</label><select id="sp">${optList(PLAN_OPTS, state.plan, v=>fmtRub(v))}</select></div>
          </div>
          <div class="grid-3">
            <div class="field"><label>План чеков</label><select id="sc">${optList(CHECKS_OPTS, state.planChecks)}</select></div>
            <div class="field"><label>Мин. средний чек</label><select id="sa">${optList(AVG_OPTS, state.minAvgCheck, v=>v+' ₽')}</select></div>
            <div class="field"><label>Норма списаний</label><select id="sw">${optList(WO_OPTS, state.woNorm, v=>v+'%')}</select></div>
          </div>
          <div class="grid-2">
            <div class="field"><label>Стартовый счётчик (вручную)</label><input id="sn" type="number" min="0" value="${state.initCounter}"></div>
            <div class="field"><label>Фото обязательно везде</label><select id="sph"><option value="0" ${!state.photoAll?'selected':''}>Нет</option><option value="1" ${state.photoAll?'selected':''}>Да</option></select></div>
          </div>
          <button class="btn-lg primary" id="s-save">Сохранить и синхронизировать с терминалом</button>
        </div>
        <div class="card" style="margin-bottom:16px;">
          <div class="card-head"><div><h2 class="card-title">Telegram-бот: инциденты и авто-уведомления чек-листов</h2><div class="card-sub">Мгновенные алерты администратору при поломках + личное уведомление сотруднику при открытии чек-листа с кнопкой перехода</div></div><span class="badge ${state.tgConfiguredOnServer?'good':'warn'}">${state.tgConfiguredOnServer?'🤖 Бот подключён':'⚠️ Нужен токен'}</span></div>
          <div class="grid-2">
            <div class="field"><label>Токен Telegram-бота (BotFather)</label><input id="tg-tok" type="password" placeholder="${state.tgConfiguredOnServer?'•••••••• (сохранён на сервере)':'123456:ABC-DEF...'}"></div>
            <div class="field"><label>Chat ID администратора (для поломок)</label><input id="tg-chat" value="${esc(state.tgChat || '')}" placeholder="Например: 518294012"></div>
          </div>
          <div class="field"><label>URL веб-приложения (GitHub Pages — для кнопки перехода в чек-лист)</label><input id="tg-url" value="${esc(state.webappUrl || (location.origin + location.pathname.replace(/owner\.html$/i, '')))}" placeholder="https://username.github.io/coffee-illy/"></div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;">
            <button class="chip-btn accent" id="tg-save">💾 Сохранить Telegram</button>
            <button class="chip-btn good" id="tg-auto">🔔 Включить авто-уведомления (каждые 5 мин)</button>
            <button class="chip-btn" id="tg-test">📨 Тест админу</button>
            <button class="chip-btn" id="tg-run">▶️ Проверить чек-листы сейчас</button>
          </div>
        </div>
        <div class="card">
          <div class="card-head"><div><h2 class="card-title">Журнал аудита и синхронизации</h2></div></div>
          <div class="stack" style="max-height:260px;overflow-y:auto;">${(state.auditLog||[]).map(a=>`<div class="card-soft" style="padding:8px 12px;"><div style="display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);"><b>${esc(a.actor)} · ${a.time}</b><span class="badge accent">rev #${a.rev}</span></div><div style="font-size:12.5px;margin-top:2px;">${esc(a.text)}</div></div>`).join('')}</div>
        </div>`;
      const sop = document.getElementById('s-open-plans'); if (sop) sop.onclick = () => { tab = 'finances'; render(); };
      document.getElementById('s-save').onclick = () => guard('Сохранить настройки', () => {
        state.location = document.getElementById('sl').value.trim() || state.location;
        state.plan = Number(document.getElementById('sp').value);
        state.planChecks = Number(document.getElementById('sc').value);
        state.minAvgCheck = Number(document.getElementById('sa').value);
        state.woNorm = Number(document.getElementById('sw').value);
        state.initCounter = Math.max(0, Number(document.getElementById('sn').value)||0);
        state.photoAll = document.getElementById('sph').value === '1';
        saveSharedState(state, 'Администратор', 'Обновлены настройки точки («' + state.location + '»)');
        showToast('Настройки синхронизированы!'); render();
      });
      document.getElementById('tg-save').onclick = () => guard('Настройки Telegram', async () => {
        if (!window.CoffeeCloudV93) return;
        const tok = document.getElementById('tg-tok').value.trim();
        const chat = document.getElementById('tg-chat').value.trim();
        const url = document.getElementById('tg-url').value.trim();
        const res = await window.CoffeeCloudV93.saveTelegramSettings({ tgToken: tok, tgChat: chat, webappUrl: url });
        if (res && res.ok) {
          state.tgConfiguredOnServer = !!res.tgConfiguredOnServer;
          state.tgChat = res.tgChat || chat;
          state.webappUrl = res.webappUrl || url;
          showToast('✓ Настройки Telegram сохранены на сервере!'); render();
        } else showToast('Ошибка сохранения Telegram: ' + ((res && res.error) || 'проверьте вход'));
      });
      document.getElementById('tg-auto').onclick = () => guard('Включить авто-уведомления', async () => {
        if (!window.CoffeeCloudV93) return;
        const res = await window.CoffeeCloudV93.setupTriggers();
        if (res && res.ok) { state.autopilotEnabled = true; showToast('🔔 Авто-уведомления (каждые 5 мин) включены!'); render(); }
        else showToast('Ошибка активации триггера');
      });
      document.getElementById('tg-test').onclick = () => guard('Тест Telegram', async () => {
        if (!window.CoffeeCloudV93) return;
        const res = await window.CoffeeCloudV93.testTelegramAlert();
        if (res && res.ok) showToast('📨 Тестовое сообщение отправлено в Telegram!');
        else showToast('Не удалось отправить: ' + ((res && res.telegram && (res.telegram.reason || res.telegram.error)) || (res && res.error) || 'проверьте токен и Chat ID'));
      });
      document.getElementById('tg-run').onclick = () => guard('Проверка чек-листов', async () => {
        if (!window.CoffeeCloudV93) return;
        const res = await window.CoffeeCloudV93.runChecklistNotificationsNow({});
        const cnt = (res && Array.isArray(res.sent)) ? res.sent.length : 0;
        showToast(cnt ? ('📨 Отправлено уведомлений сотрудникам: ' + cnt) : 'Новых открытых чек-листов для отправки нет');
      });
    }
  }

  function openTasksModal(blk) {
    const list = blockTasks(blk);
    openModal('Задачи «' + blk + '» (' + list.length + ')', `
      <div class="stack" style="margin-bottom:12px;max-height:270px;overflow-y:auto;">${list.map((t,i)=>`<div class="card-soft" style="display:flex;justify-content:space-between;gap:8px;"><div><b>${i+1}. ${esc(t.title)}</b> ${t.photo?'<span class="badge accent">📷</span>':''}</div><button class="chip-btn bad" data-dt="${esc(t.id)}" style="padding:4px 8px;">✕</button></div>`).join('')}</div>
      <div class="field"><label>Новая задача</label><input id="nt-t" placeholder="Название шага"></div>
      <div class="grid-2"><div class="field"><label>Ответственный</label><select id="nt-o">${optList(OWNERS,'Администратор')}</select></div><div class="field"><label>Фото</label><select id="nt-p"><option value="1">Да</option><option value="0">Нет</option></select></div></div>
      <button class="btn-lg primary" id="nt-s">+ Добавить</button>
    `);
    document.querySelectorAll('[data-dt]').forEach(b=>b.onclick=()=>guard('Удалить задачу',()=>{ state.tasks=state.tasks.filter(x=>x.id!==b.dataset.dt); saveSharedState(state,'Администратор','Удалена задача'); openTasksModal(blk); render(); }));
    document.getElementById('nt-s').onclick = () => guard('Добавить задачу', () => {
      const t = document.getElementById('nt-t').value.trim(); if (!t) return;
      state.tasks.push({ id:'t_'+Date.now(), block:blk, group:blk, title:t, instruction:'По стандарту Coffee Illy.', photo:document.getElementById('nt-p').value==='1', owner:document.getElementById('nt-o').value });
      saveSharedState(state, 'Администратор', 'Добавлена задача «' + t + '»'); openTasksModal(blk); render();
    });
  }
  function openStaffModal(id) {
    const s = id ? state.staff.find(x=>x.id===id) : null;
    openModal(s ? 'Сотрудник: ' + s.name : 'Новый сотрудник', `
      <div class="field"><label>Имя</label><input id="sn" value="${s?esc(s.name):''}"></div>
      <div class="grid-2"><div class="field"><label>Роль</label><select id="sr"><option ${s&&s.role==='Бариста'?'selected':''}>Бариста</option><option ${s&&s.role==='Администратор'?'selected':''}>Администратор</option></select></div><div class="field"><label>Статус</label><select id="sa"><option value="1" ${!s||s.active!==false?'selected':''}>Активен</option><option value="0" ${s&&s.active===false?'selected':''}>Отключён</option></select></div></div>
      <div class="grid-2"><div class="field"><label>Личный PIN (4–6 цифр)</label><input id="sp" value="${s?esc(s.pin):'1234'}"></div><div class="field"><label>Telegram ID</label><input id="sg" value="${s?esc(s.tgId||''):''}" placeholder="TG-..."></div></div>
      <button class="btn-lg primary" id="ss">Сохранить</button>
    `);
    document.getElementById('ss').onclick = () => {
      const nm = document.getElementById('sn').value.trim(), pin = document.getElementById('sp').value.trim(), tg = document.getElementById('sg').value.trim();
      if (!nm || !/^\d{4,6}$/.test(pin)) { showToast('Проверьте имя и PIN (4–6 цифр)'); return; }
      if (s) { s.name=nm; s.role=document.getElementById('sr').value; s.active=document.getElementById('sa').value==='1'; s.pin=pin; s.pinIsDefault=(pin==='1234'); s.tgId=tg; }
      else state.staff.push({ id:'st_'+Date.now(), name:nm, role:document.getElementById('sr').value, shop:state.location, active:true, pin, pinIsDefault:pin==='1234', tgId:tg });
      saveSharedState(state, 'Администратор', 'Обновлён сотрудник ' + nm); closeModal(); showToast('Синхронизировано!'); render();
    };
  }
  function openTtkModal(id) {
    const k = id ? state.ttk.find(x=>x.id===id) : null;
    openModal(k ? 'ТТК: ' + k.name : 'Новая ТТК', `
      <div class="field"><label>Название</label><input id="kn" value="${k?esc(k.name):''}"></div>
      <div class="grid-2"><div class="field"><label>Объём</label><select id="kv">${optList(VOL_OPTS, k?k.vol:VOL_OPTS[3])}</select></div><div class="field"><label>Категория</label><select id="kc">${optList(CAT_OPTS, k?k.cat:CAT_OPTS[0])}</select></div></div>
      <div class="grid-2"><div class="field"><label>Цена вручную (₽)</label><input id="kp" type="number" min="1" value="${k?k.price:22}"></div><div class="field"><label>Себест. (₽)</label><input id="ks" type="number" min="0" step="0.1" value="${k?k.cost:7.5}"></div></div>
      <div class="field"><label>Рецептура</label><textarea id="kr" rows="2">${k?esc(k.recipe):''}</textarea></div>
      <button class="btn-lg primary" id="ksv">Сохранить</button>
    `);
    document.getElementById('ksv').onclick = () => {
      const nm = document.getElementById('kn').value.trim(), pr = Number(document.getElementById('kp').value)||0, cs = Number(document.getElementById('ks').value)||0;
      if (!nm || pr<=0) return;
      if (k) { k.name=nm; k.vol=document.getElementById('kv').value; k.cat=document.getElementById('kc').value; k.price=pr; k.cost=cs; k.recipe=document.getElementById('kr').value.trim(); }
      else state.ttk.push({ id:'ttk_'+Date.now(), name:nm, vol:document.getElementById('kv').value, cat:document.getElementById('kc').value, price:pr, cost:cs, recipe:document.getElementById('kr').value.trim(), serve:'' });
      saveSharedState(state, 'Администратор', 'Обновлена ТТК ' + nm); closeModal(); showToast('ТТК отправлена в терминал!'); render();
    };
  }

  // Live Cross-Tab Sync Listener (receives instant updates from Terminal!)
  function onRemoteSync() {
    const next = loadSharedState();
    if (next.rev !== state.rev) {
      state = next;
      showToast('⚡ Получено обновление из терминала (rev #' + state.rev + ')');
      render();
    }
  }
  if (syncCh) syncCh.onmessage = onRemoteSync;
  window.addEventListener('storage', (e) => { if (e.key === STORE_KEY) onRemoteSync(); });

  document.querySelectorAll('#admin-nav button').forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); });
  document.getElementById('btn-lock').onclick = () => { if (adminUnlocked) { adminUnlocked = false; render(); } else guard('Вход', () => {}); };
  document.getElementById('sim-time').onchange = (e) => { state.simTime = e.target.value; saveSharedState(state, 'Симулятор', 'Время смены: ' + state.simTime); render(); };
  let cloudLoop = null;
  document.getElementById('btn-reset').onclick = async () => {
    showToast('🔄 Загрузка свежих данных из Google Таблицы...');
    if (cloudLoop && cloudLoop.pullNow) {
      await cloudLoop.pullNow(true);
      showToast('✓ Данные обновлены из Google Таблицы');
      render();
    }
  };
  render();

  if (window.CoffeeCloudV93) {
    cloudLoop = window.CoffeeCloudV93.startCloudLoop({
      mode: 'owner',
      getState: () => state,
      onSynced: (st, srvRev) => {
        try { localStorage.setItem(STORE_KEY, JSON.stringify(st)); } catch(_) {}
        render();
      }
    });
  }
})();
</script>
</body>
</html>
