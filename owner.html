.badge.good { background:var(--good-soft); color:var(--good); }

.stack { display:flex; flex-direction:column; gap:10px; }
.row-item { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 14px; border-radius:18px; background:var(--surface); border:1px solid var(--border); flex-wrap:wrap; }

<script>

const LIVE_SNAPSHOT = {"location":"Кофейня №1","plan":2200,"minAvgCheck":35,"planChecks":75,"staff":[],"blocks":[],"tasks":[],"cash":[],"expenses":[],"checklists":[],"incidents":[],"plans":[{"day":"Пн","rev":2200,"avg":35,"checks":70,"roster":""},{"day":"Вт","rev":2200,"avg":35,"checks":70,"roster":""},{"day":"Ср","rev":2200,"avg":35,"checks":70,"roster":""},{"day":"Чт","rev":2200,"avg":35,"checks":70,"roster":""},{"day":"Пт","rev":2500,"avg":35,"checks":80,"roster":""},{"day":"Сб","rev":2800,"avg":35,"checks":85,"roster":""},{"day":"Вс","rev":2400,"avg":35,"checks":75,"roster":""}],"goodDeeds":[],"ttk":[],"audits":[]};
const STORE_KEY = 'coffee_illy_v90_live_state';
const THEME_KEY = 'coffee_illy_v90_theme';
const TODAY = (window.CoffeeCloudV94 ? window.CoffeeCloudV94.localISO() : new Date().toISOString().slice(0,10));
const TIME_OPTIONS = ['06:00','06:30','07:00','07:30','08:00','08:30','09:00','09:30','10:00','10:23','10:30','10:34','11:00','11:30','12:00','12:30','13:00','14:00','15:00','16:00','17:00','18:00','18:30','19:00','20:00','21:00','21:30','22:00','22:30','23:00','23:30','23:59'];
const PLAN_OPTS = [1500,1800,2000,2200,2500,3000,3500,4000,5000];
const CHECKS_OPTS = [30,40,50,60,70,75,80,90,100,120];
const AVG_OPTS = [25,28,30,32,35,38,40,45,50];
const WO_OPTS = [5,10,15,20,25,30];
const SHIFT_HOURS = ['07:30–22:30','08:00–20:00','08:00–16:00','14:00–22:30','Выходной'];
const VOL_OPTS = ['60 мл (S)','150 мл (S)','200 мл (M)','250 мл (M)','350 мл (L)','400 мл (XL)'];
const CAT_OPTS = ['Классика','Авторские','Холодные','Чай и не-кофе','Выпечка'];
const EXP_CATS = ['Закупка продуктов','Зарплата','Аренда','Коммунальные','Реклама','Ремонт и оборудование','Прочее'];
const OWNERS = ['Администратор','Бариста','Техник','Управляющий'];
const EQUIP_ZONES = ['Кофемашина','Кофемолка','Холодильник','Термопот','Витрина','Зона гостя','Санузел','Касса / Терминал','Другое'];

function freshState() {
  const s = JSON.parse(JSON.stringify(LIVE_SNAPSHOT));
  s.rev = 1; s.woNorm = 15; s.initCounter = 600; s.photoAll = false; s.simTime = (window.CoffeeCloudV94 ? window.CoffeeCloudV94.localHHMM() : '13:25');
  s.adminPin = '1234'; s.extensions = {};
  s.staff = s.staff.map(st => Object.assign({}, st, {
    pin: '1234', pinIsDefault: true,
    tgId: st.name === 'Соня' ? 'TG-518294012' : (st.name === 'Алина' ? 'TG-604912338' : '')
  }));
  s.liveProgress = {}; s.staffPresence = {}; s.tgChat = ''; s.webappUrl = ''; s.tgConfiguredOnServer = false; s.autopilotEnabled = false; s.lastSyncAt = ''; s.lastRttMs = 0;
  s.auditLog = [{ time: '13:20', actor: 'Система', rev: 1, text: 'Инициализирован релиз v93.1 на реальных данных Coffee_illy.' }];
  return s;
}
function loadSharedState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) { const parsed = JSON.parse(raw); if (parsed && parsed.blocks) return parsed; }
  } catch(_) {}
  const s = freshState();
  try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch(_) {}
  return s;
}
const syncCh = (typeof BroadcastChannel !== 'undefined') ? new BroadcastChannel('coffee_illy_v90_sync') : null;
function saveSharedState(st, actor, desc) {
  st.rev = (Number(st.rev) || 0) + 1;
  if (desc) {
    st.auditLog = st.auditLog || [];
    st.auditLog.unshift({ time: st.simTime || '13:25', actor: actor || 'Система', rev: st.rev, text: desc });
    if (st.auditLog.length > 50) st.auditLog.pop();
  }
  try { localStorage.setItem(STORE_KEY, JSON.stringify(st)); } catch(_) {}
  if (syncCh) try { syncCh.postMessage({ type: 'state', rev: st.rev, ts: Date.now() }); } catch(_) {}
  if (window.CoffeeCloudV94 && desc) window.CoffeeCloudV94.dispatchStateChange(st, actor, desc);
}
function fmtRub(n) { return (Number(n) || 0).toLocaleString('ru-RU') + ' ₽'; }
function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function toMin(hhmm) { const m = String(hhmm || '00:00').match(/(\d{1,2}):(\d{2})/); return m ? Number(m[1])*60 + Number(m[2]) : 0; }
function optList(arr, sel, fn) {
  const v = arr.slice();
  if (sel != null && sel !== '' && !v.some(x => String(x) === String(sel))) v.unshift(sel);
  return v.map(x => `<option value="${esc(x)}" ${String(x)===String(sel)?'selected':''}>${esc(fn ? fn(x) : x)}</option>`).join('');
}
let _tTimer = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(_tTimer); _tTimer = setTimeout(() => el.classList.remove('show'), 2600);
}
function initTheme(btnId) {
  const mql = window.matchMedia('(prefers-color-scheme: dark)');
  let mode = 'auto';
  try { mode = localStorage.getItem(THEME_KEY) || 'auto'; } catch(_) {}
  function apply() {
    const eff = mode === 'auto' ? (mql.matches ? 'dark' : 'light') : mode;
    document.documentElement.setAttribute('data-theme', eff);
    const b = document.getElementById(btnId);
    if (b) b.textContent = mode === 'auto' ? '🌓 Авто' : (mode === 'light' ? '☀️ Светлая' : '🌙 Тёмная');
  }
  mql.addEventListener('change', () => { if (mode === 'auto') apply(); });
  window.addEventListener('storage', (e) => { if (e.key === THEME_KEY) { mode = e.newValue || 'auto'; apply(); } });
  const b = document.getElementById(btnId);
  if (b) b.onclick = () => {
    mode = mode === 'auto' ? 'light' : (mode === 'light' ? 'dark' : 'auto');
    try { localStorage.setItem(THEME_KEY, mode); } catch(_) {}
    apply();
  };
  apply();
}

(function() {
  let state = loadSharedState();
  let tab = 'overview';
  let adminUnlocked = !!(window.CoffeeCloudV94 && window.CoffeeCloudV94.getSession && window.CoffeeCloudV94.getSession().adminToken);
  let adminAuthNeeded = !adminUnlocked;
  let incFilter = 'open';
  let chkFilter = 'all';

  initTheme('btn-theme');
  function openModal(t, h) { document.getElementById('modal-title').textContent = t; document.getElementById('modal-body').innerHTML = h; document.getElementById('modal-bg').classList.add('open'); }
  function closeModal() { document.getElementById('modal-bg').classList.remove('open'); }
  document.getElementById('modal-close').onclick = closeModal;
  document.getElementById('modal-bg').onclick = (e) => { if (e.target.id === 'modal-bg') closeModal(); };

  function guard(label, fn) {
    if (adminUnlocked) { fn(); return; }
    openModal('Вход владельца (Google Таблица)', `
      <div style="font-size:13px;color:var(--muted);margin-bottom:10px;">Введите PIN владельца для доступа к живым данным и действию «${esc(label)}».</div>
      <div class="field"><label>PIN владельца</label><input id="p-in" type="password" inputmode="numeric" autofocus></div>
      <button class="btn-lg primary" id="p-ok">Подтвердить и загрузить данные</button>
    `);
    document.getElementById('p-ok').onclick = async () => {
      const entered = document.getElementById('p-in').value.trim();
      if (!entered) return;
      if (window.CoffeeCloudV94) {
        const res = await window.CoffeeCloudV94.authLogin('admin', { pin: entered });
        if (res && res.ok && res.sessionToken) {
          adminUnlocked = true; adminAuthNeeded = false; state.adminPin = entered;
          closeModal(); showToast('🔓 Живая сессия владельца активна');
          if (cloudLoop && cloudLoop.pullNow) await cloudLoop.pullNow(true);
          fn(); render();
          return;
        }
        showToast((res && res.error) ? String(res.error).replace(/^[A-Z_]+:\s*/, '') : 'Неверный PIN владельца');
        return;
      }
      if (entered === state.adminPin) { adminUnlocked = true; adminAuthNeeded = false; closeModal(); fn(); render(); }
      else showToast('Неверный PIN');
    };
  }

  const DAYS_RU = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
  function getWeekdayRu(isoStr) {
    const m = String(isoStr || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (!m) return DAYS_RU[new Date().getDay()];
    const dt = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]), 12, 0, 0);
    return DAYS_RU[dt.getDay()];
  }
  function getDayPlan(isoOrDay) {
    const dayKey = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].includes(isoOrDay) ? isoOrDay : getWeekdayRu(isoOrDay);
    const found = (state.plans || []).find(p => p && p.day === dayKey);
    const rev = Number((found && (found.rev || found.revenue)) || state.plan || 2200);
    const checks = Number((found && found.checks) || state.planChecks || 75);
    const avg = Number((found && (found.avg || found.avgCheck)) || state.minAvgCheck || 35);
    return { day: dayKey, rev, checks, avg, roster: (found && found.roster) || '' };
  }
  function blockTasks(nm) { return state.tasks.filter(t => t.block === nm); }
  function getBlkSt(b) {
    if (b.active === false) return { label:'Отключён', cls:'', open:false };
    if (state.extensions[b.name] && state.extensions[b.name].forceOpen) return { label:'Открыт админом до 23:59', cls:'good', open:true };
    const now = toMin(window.CoffeeCloudV94 ? window.CoffeeCloudV94.localHHMM() : '12:00');
    if (now < toMin(b.openTime)) return { label:'Откроется в ' + b.openTime, cls:'', open:false };
    if (now > toMin(b.deadline)) return { label:'Закрыт (' + b.deadline + ')', cls:'bad', open:false };
    return { label:'Открыт до ' + b.deadline, cls:'accent', open:true };
  }

  function render() {
    document.getElementById('hdr-loc').textContent = state.location;
    document.getElementById('hdr-rev').textContent = (state.liveConnected ? 'LIVE · ' : '') + 'rev #' + (state.cloudRev || state.rev) + (state.lastSyncAt ? ' · ' + state.lastSyncAt : '') + (state.lastRttMs ? ' (' + state.lastRttMs + ' мс)' : '');

    document.querySelectorAll('#admin-nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));

    const root = document.getElementById('content');
    if (tab === 'overview') {
      const syncBanner = !state.liveConnected
        ? `<div class="card-soft" style="margin-bottom:14px;border:1px solid var(--accent);display:flex;justify-content:space-between;align-items:center;gap:10px;"><span>🔄 Загружаем актуальные данные из Google Таблицы Coffee_illy...</span></div>`

          ? `<div class="card-soft" style="margin-bottom:14px;border:1px solid var(--warn);display:flex;justify-content:space-between;align-items:center;gap:10px;"><span>🔒 Войдите по PIN владельца, чтобы подтянуть живую кассу, расходы и поломки из Google Таблицы.</span><button class="chip-btn accent" id="ov-unlock">Войти по PIN</button></div>`
          : '');
      const todayPlan = getDayPlan(TODAY);
      const totalPlanRev = state.cash.reduce((a, c) => a + getDayPlan(c.date).rev, 0);
      const totalChecks = state.cash.reduce((a, c) => a + (Number(c.checks) || 0), 0);
      const totalPlanChecks = state.cash.reduce((a, c) => a + getDayPlan(c.date).checks, 0);
      const actualAvgCheck = totalChecks > 0 ? Math.round(totalRev / totalChecks) : 0;
      const targetAvgCheck = state.cash.length ? Math.round(state.cash.reduce((a, c) => a + getDayPlan(c.date).avg, 0) / state.cash.length) : todayPlan.avg;
      const revPlanPct = totalPlanRev > 0 ? Math.round((totalRev / totalPlanRev) * 100) : 0;
      const checksPlanPct = totalPlanChecks > 0 ? Math.round((totalChecks / totalPlanChecks) * 100) : 0;
      const days = state.cash.slice(0,10).reverse();
      const maxRev = Math.max(todayPlan.rev, ...days.map(c => Math.max(c.revenue, getDayPlan(c.date).rev)), 1);
      const todayPlanPct = Math.round((todayPlan.rev / maxRev) * 100);
      root.innerHTML = syncBanner + `
        <div class="kpi-grid">
          <div class="kpi"><div class="kpi-lbl">Выручка (${state.cash.length} смен)</div><div class="kpi-val">${fmtRub(totalRev)}</div><div class="kpi-meta">План по дням: ${fmtRub(totalPlanRev)} (<b style="color:${revPlanPct>=100?'var(--good)':'var(--accent)'}">${revPlanPct}%</b>) · Сегодня (${todayPlan.day}): ${fmtRub(todayPlan.rev)}</div></div>
          <div class="kpi"><div class="kpi-lbl">Чеки и средний чек</div><div class="kpi-val" style="color:${actualAvgCheck>=targetAvgCheck?'var(--good)':'var(--accent)'}">${actualAvgCheck} ₽</div><div class="kpi-meta">Чеков: <b>${totalChecks}</b> / ${totalPlanChecks} (${checksPlanPct}%) · Мин. ср. чек (${todayPlan.day}): ${todayPlan.avg} ₽</div></div>
          <div class="kpi"><div class="kpi-lbl">Чистый итог</div><div class="kpi-val" style="color:var(--good)">${fmtRub(totalRev-totalExp)}</div><div class="kpi-meta">Расходы: ${fmtRub(totalExp)} · Чек-листов: ${state.checklists.length}</div></div>
          <div class="kpi"><div class="kpi-lbl">Открытые поломки</div><div class="kpi-val" style="color:${openIncs?'var(--bad)':'var(--good)'}">${openIncs}</div><div class="kpi-meta">Всего: ${state.incidents.length} · Задач: ${state.tasks.length}</div></div>
        </div>
        <div class="card" style="margin-bottom:16px;">
          <div class="card-head"><div><h2 class="card-title">Динамика выручки по индивидуальному плану дня</h2><div class="card-sub">Каждый столбец сравнивается с планом своего дня недели (Пн–Вс) · Сегодня (${todayPlan.day}): ${fmtRub(todayPlan.rev)} / ${todayPlan.checks} чек. / ≥${todayPlan.avg} ₽</div></div></div>
          <div class="chart-wrap">
            <div class="chart-plan-line" style="bottom:${Math.min(92,Math.max(16,todayPlanPct*0.78))}%"><span class="chart-plan-lbl">План ${todayPlan.day}: ${fmtRub(todayPlan.rev)}</span></div>
            ${days.map(c => {
              const dp = getDayPlan(c.date);
              const avgC = c.checks ? Math.round(c.revenue / c.checks) : 0;
              const hit = c.revenue >= dp.rev;
              const pct = dp.rev > 0 ? Math.round((c.revenue / dp.rev) * 100) : 0;
              const tip = `${dp.day} ${c.date} · Выручка: ${c.revenue} / ${dp.rev} ₽ (${pct}%) · Чеки: ${c.checks}/${dp.checks} · Ср. чек: ${avgC} / ≥${dp.avg} ₽`;
              return `<div class="bar-col" title="${esc(tip)}"><div class="bar-val">${c.revenue}</div><div class="bar-fill ${hit?'hit':''}" style="height:${Math.max(12,Math.round((c.revenue/maxRev)*100))}%"></div><div class="bar-dt">${dp.day} ${c.date.slice(8)}</div></div>`;
            }).join('')}
          </div>
        </div>
        <div class="card">

                <div class="row-title">${esc(s.name)} <span class="badge">${esc(s.role)}</span> ${isOn ? `<span class="badge good">🟢 На работе с ${esc(pr.checkedInAt || '')}</span>` : '<span class="badge">⚪ Не на смене</span>'} ${s.tgId ? `<span class="badge accent">${esc(s.tgId)}</span>`:'<span class="badge warn">Без TG ID</span>'}</div>
                <div class="row-sub">Сдано чек-листов сегодня: <b>${doneToday}/${openBlocksCnt}</b>${(state.liveProgress && state.liveProgress[s.name]) ? (' · Сейчас: «' + esc(state.liveProgress[s.name].block) + '» ' + state.liveProgress[s.name].done + '/' + state.liveProgress[s.name].total) : ''}${isOn && pr.source ? ' · Вход: ' + esc(pr.source) : ''}</div>
                <div class="pbar ${pct===100?'good':''}"><div style="width:${pct}%"></div></div>

    window._jumpTab = (t, sub) => { tab = t; if (sub) manageSub = sub; render(); };

    if (tab === 'sales') {
      const avgCheckAll = state.cash.reduce((a,c)=>a+(c.checks||0),0) > 0 ? Math.round(totalRev / state.cash.reduce((a,c)=>a+(c.checks||0),0)) : 0;
      const days = state.cash.slice(0,14).reverse();
      const maxRev = Math.max(state.plan, ...days.map(c=>c.revenue||0), 1);
      const planPct = Math.round((state.plan / maxRev) * 100);
      root.innerHTML = `
        <div class="kpi-grid">
          <div class="kpi"><div class="kpi-lbl">Выручка (${state.cash.length} смен)</div><div class="kpi-val">${fmtRub(totalRev)}</div><div class="kpi-meta">Средняя за смену: ${fmtRub(state.cash.length?Math.round(totalRev/state.cash.length):0)}</div></div>
          <div class="kpi"><div class="kpi-lbl">Средний чек</div><div class="kpi-val">${fmtRub(avgCheckAll)}</div><div class="kpi-meta">Минимум по плану: ${fmtRub(state.minAvgCheck||35)}</div></div>
          <div class="kpi"><div class="kpi-lbl">Всего чеков</div><div class="kpi-val">${state.cash.reduce((a,c)=>a+(c.checks||0),0)}</div><div class="kpi-meta">План/день: ${state.planChecks||75}</div></div>
        </div>
        <div class="card" style="margin-bottom:16px;">
          <div class="card-head"><div><h2 class="card-title">Динамика продаж (14 смен)</h2><div class="card-sub">Зелёным выделены смены, выполнившие план ${fmtRub(state.plan)}</div></div></div>
          <div class="chart-wrap">
            <div class="chart-plan-line" style="bottom:${Math.min(92,Math.max(16,planPct*0.78))}%"><span class="chart-plan-lbl">План ${fmtRub(state.plan)}</span></div>
            ${days.map(c => `<div class="bar-col"><div class="bar-val">${c.revenue}</div><div class="bar-fill ${c.revenue>=state.plan?'hit':''}" style="height:${Math.max(12,Math.round((c.revenue/maxRev)*100))}%"></div><div class="bar-dt">${String(c.date).slice(5)}</div></div>`).join('')}
          </div>
        </div>
        <div class="card">
          <div class="card-head"><div><h2 class="card-title">Недельный план и график смен</h2><div class="card-sub">По этому графику бот отправляет уведомления о чек-листах нужному сотруднику</div></div></div>
          <div class="tbl-wrap"><table><thead><tr><th>День</th><th>План выручки</th><th>Чеков</th><th>Сотрудник на смене</th></tr></thead><tbody>
            ${(state.plans||[]).map(p=>`<tr><td><b>${esc(p.day)}</b></td><td>${fmtRub(p.rev||p.revenue)}</td><td>${p.checks||70}</td><td>${esc(p.roster||'По отметке «На работе»')}</td></tr>`).join('')}
          </tbody></table></div>
        </div>`;
      return;
    }

    if (tab === 'inventory') {
      const inv = state.inventory || [];
      root.innerHTML = `
        <div class="card" style="margin-bottom:16px;">
          <div class="card-head"><div><h2 class="card-title">Склад и остатки (${inv.length})</h2><div class="card-sub">При падении ниже минимума автоматически уходит алерт администратору в Telegram</div></div><button class="chip-btn accent" id="inv-add">+ Позиция</button></div>
          ${inv.length ? `<div class="tbl-wrap"><table><thead><tr><th>Позиция</th><th>Остаток</th><th>Мин. запас</th><th>Статус</th><th></th></tr></thead><tbody>
            ${inv.map((it, idx) => {
              const low = Number(it.minQty||0) > 0 && Number(it.qty||0) <= Number(it.minQty||0);
              return `<tr><td><b>${esc(it.name)}</b></td><td>${it.qty} ${esc(it.unit||'шт')}</td><td>${it.minQty||0} ${esc(it.unit||'шт')}</td><td><span class="badge ${low?'bad':'good'}">${low?'🔴 Ниже минимума':'🟢 Норма'}</span></td><td style="display:flex;gap:4px;"><button class="chip-btn good" data-inv-p="${idx}" style="padding:3px 8px;">+1</button><button class="chip-btn bad" data-inv-m="${idx}" style="padding:3px 8px;">−1</button></td></tr>`;
            }).join('')}
          </tbody></table></div>` : '<div style="font-size:13px;color:var(--muted);">Склад пока пуст. Нажмите «+ Позиция», чтобы добавить зерно, молоко, стаканы и минимальные остатки.</div>'}
        </div>
        <div class="card">
          <div class="card-head"><div><h2 class="card-title">Техкарты ILLY (${state.ttk.length})</h2></div><button class="chip-btn accent" id="k-add">+ Техкарта</button></div>
          <div class="tbl-wrap"><table><thead><tr><th>Напиток</th><th>Объём</th><th>Цена</th><th>Себест.</th><th>Маржа</th><th></th></tr></thead><tbody>
            ${state.ttk.map(k=>`<tr><td><b>${esc(k.name)}</b></td><td style="color:var(--muted)">${esc(k.vol)}</td><td>${k.price} ₽</td><td>${k.cost} ₽</td><td><span class="badge good">${k.price?Math.round(((k.price-k.cost)/k.price)*100):0}%</span></td><td><button class="chip-btn" data-ek="${esc(k.id)}" style="padding:4px 8px;">✏️</button></td></tr>`).join('')}
          </tbody></table></div>
        </div>`;
      document.getElementById('inv-add').onclick = () => guard('Новая позиция склада', () => {
        openModal('Новая позиция склада', `
          <div class="field"><label>Название</label><input id="iv-n" placeholder="Зерно ILLY / Молоко 3.2%"></div>
          <div class="grid-3"><div class="field"><label>Остаток</label><input id="iv-q" type="number" value="10"></div><div class="field"><label>Минимум</label><input id="iv-m" type="number" value="3"></div><div class="field"><label>Ед. изм.</label><input id="iv-u" value="шт"></div></div>
          <button class="btn-lg primary" id="iv-s">Сохранить</button>
        `);
        document.getElementById('iv-s').onclick = async () => {
          const _q = Number(document.getElementById('iv-q').value)||0, _m = Number(document.getElementById('iv-m').value)||0;
          const item = { id:'inv_'+Date.now(), name:document.getElementById('iv-n').value.trim(), qty:_q, stock:_q, minQty:_m, minStock:_m, unit:document.getElementById('iv-u').value.trim()||'шт' };
          if (!item.name) return;
          state.inventory = state.inventory || [];
          state.inventory.push(item);
          if (window.CoffeeCloudV94) await window.CoffeeCloudV94.saveInventoryItem(item);
          saveSharedState(state, 'Администратор', 'Обновлён склад: ' + item.name);
          closeModal(); showToast('✓ Позиция добавлена на склад'); render();
        };
      });
      root.querySelectorAll('[data-inv-p]').forEach(b => b.onclick = () => guard('Приход на склад', async () => {
        const it = state.inventory[Number(b.dataset.invP)]; if (!it) return;
        it.qty = (Number(it.qty!=null?it.qty:it.stock)||0) + 1; it.stock = it.qty;
        if (window.CoffeeCloudV94) await window.CoffeeCloudV94.saveInventoryItem(it);
        saveSharedState(state, 'Администратор', 'Приход на склад: ' + it.name); render();
      }));
      root.querySelectorAll('[data-inv-m]').forEach(b => b.onclick = () => guard('Списание со склада', async () => {
        const it = state.inventory[Number(b.dataset.invM)]; if (!it) return;
        it.qty = Math.max(0, (Number(it.qty!=null?it.qty:it.stock)||0) - 1); it.stock = it.qty;
        if (window.CoffeeCloudV94) await window.CoffeeCloudV94.saveInventoryItem(it);
        saveSharedState(state, 'Администратор', 'Списание со склада: ' + it.name); render();
      }));
      document.getElementById('k-add').onclick = () => guard('Новая ТТК', () => openTtkModal(null));
      root.querySelectorAll('[data-ek]').forEach(b => b.onclick = () => guard('Изменить ТТК', () => openTtkModal(b.dataset.ek)));
      return;
    }

    if (tab === 'manage') {
      const subNavHtml = `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;">
        <button class="chip-btn ${manageSub==='checklists'?'accent':''}" data-msub="checklists">📋 Чек-листы</button>
        <button class="chip-btn ${manageSub==='incidents'?'accent':''}" data-msub="incidents">⚠ Поломки${openIncs?' ('+openIncs+')':''}</button>
        <button class="chip-btn ${manageSub==='team'?'accent':''}" data-msub="team">👥 Команда</button>
        <button class="chip-btn ${manageSub==='settings'?'accent':''}" data-msub="settings">⚙ Настройки и Telegram</button>
      </div>`;
      tab = manageSub;
      setTimeout(() => {
        root.insertAdjacentHTML('afterbegin', subNavHtml);
        root.querySelectorAll('[data-msub]').forEach(b => b.onclick = () => { manageSub = b.dataset.msub; tab = 'manage'; render(); });
      }, 0);
    }

    if (tab === 'checklists') {
      const logs = chkFilter === 'all' ? state.checklists : state.checklists.filter(c=>c.who===chkFilter);
      root.innerHTML = `
        <div class="card" style="margin-bottom:16px;">
          <div class="card-head"><div><h2 class="card-title">Блоки и окна (${state.blocks.length})</h2><div class="card-sub">Любое изменение сразу прилетает в открытый терминал</div></div><button class="chip-btn accent" id="b-add">+ Новый блок</button></div>
          <div class="stack">
            ${state.blocks.map(b => {
              const st = getBlkSt(b);
              const isExt = !!(state.extensions[b.name] && state.extensions[b.name].forceOpen);
              return `<div class="row-item" style="${b.active===false?'opacity:.55;':''}"><div class="row-main">
                <div class="row-title">${esc(b.name)} <span class="badge">${b.isCash?'Касса':blockTasks(b.name).length+' задач'}</span></div>
                <div class="row-sub">Окно: <b>${b.openTime}–${b.deadline}</b> · <span class="badge ${st.cls}">${st.label}</span></div>
              </div><div style="display:flex;gap:6px;flex-wrap:wrap;">
                <button class="chip-btn" data-eb="${esc(b.id)}">✏️ Окно</button>
                ${!b.isCash ? `<button class="chip-btn" data-vt="${esc(b.name)}">Задачи</button>`:''}
                ${b.active!==false && !st.open ? `<button class="chip-btn good" data-un="${esc(b.name)}">🔓 Открыть</button>` : (isExt ? `<button class="chip-btn" data-lk="${esc(b.name)}">Вернуть окно</button>`:'')}
              </div></div>`;
            }).join('')}
          </div>
        </div>
        <div class="card">
          <div class="card-head"><div><h2 class="card-title">История прохождения (${logs.length})</h2></div>
            <select id="cf" class="chip-btn"><option value="all">Все сотрудники</option>${[...new Set(state.checklists.map(c=>c.who))].map(w=>`<option value="${esc(w)}" ${chkFilter===w?'selected':''}>${esc(w)}</option>`).join('')}</select>
          </div>
          <div class="tbl-wrap"><table><thead><tr><th>Дата</th><th>Блок</th><th>Сотрудник</th><th>Проблем</th><th>Статус</th></tr></thead><tbody>
            ${logs.map(c=>`<tr><td><b>${c.date}</b> <span style="color:var(--muted)">${c.time}</span></td><td>${esc(c.block)}${Array.isArray(c.photos)&&c.photos.length?' '+c.photos.map((u,idx)=>`<a href="${esc(u)}" target="_blank" rel="noopener" class="badge accent" style="text-decoration:none;margin-left:4px;">📷 ${idx+1}</a>`).join(''):''}</td><td>${esc(c.who)}</td><td>${c.problems||0}</td><td><span class="badge good">${esc(c.status)}</span></td></tr>`).join('')}
          </tbody></table></div>
        </div>`;
      document.getElementById('cf').onchange = e => { chkFilter = e.target.value; render(); };
      root.querySelectorAll('[data-un]').forEach(b => b.onclick = () => guard('Открыть блок', () => {

        showToast('Блок «' + b.dataset.un + '» открыт в терминале!'); render();

        const blk = state.blocks.find(x=>x.id===b.dataset.eb);
        openModal('Блок «' + blk.name + '»', `
          <div class="field"><label>Название</label><input id="en" value="${esc(blk.name)}"></div>

          <button class="btn-lg primary" id="es">Сохранить</button>
        `);
        document.getElementById('es').onclick = () => {
          const op = document.getElementById('eo').value, dl = document.getElementById('ed').value, nm = document.getElementById('en').value.trim();
          if (!nm || toMin(op) >= toMin(dl)) { showToast('Открытие должно быть раньше дедлайна'); return; }

          <div class="grid-3">
            <div class="field"><label>План чеков</label><select id="sc">${optList(CHECKS_OPTS, state.planChecks)}</select></div>
            <div class="field"><label>Мин. средний чек</label><select id="sa">${optList(AVG_OPTS, state.minAvgCheck, v=>v+' ₽')}</select></div>
            <div class="field"><label>Норма списаний</label><select id="sw">${optList(WO_OPTS, state.woNorm, v=>v+'%')}</select></div>
          </div>
          <div class="grid-2">
            <div class="field"><label>Стартовый счётчик (вручную)</label><input id="sn" type="number" min="0" value="${state.initCounter}"></div>
            <div class="field"><label>Фото обязательно везде</label><select id="sph"><option value="0" ${!state.photoAll?'selected':''}>Нет</option><option value="1" ${state.photoAll?'selected':''}>Да</option></select></div>
          </div>
          <button class="btn-lg primary" id="s-save">Сохранить и синхронизировать с терминалом</button>
        </div>
        <div class="card" style="margin-bottom:16px;">
          <div class="card-head"><div><h2 class="card-title">Telegram-бот: инциденты и авто-уведомления чек-листов</h2><div class="card-sub">Мгновенные алерты администратору при поломках + личное уведомление сотруднику при открытии чек-листа с кнопкой перехода</div></div><span class="badge ${state.tgConfiguredOnServer?'good':'warn'}">${state.tgConfiguredOnServer?'🤖 Бот подключён':'⚠️ Нужен токен'}</span></div>
          <div class="grid-2">
            <div class="field"><label>Токен Telegram-бота (BotFather)</label><input id="tg-tok" type="password" placeholder="${state.tgConfiguredOnServer?'•••••••• (сохранён на сервере)':'123456:ABC-DEF...'}"></div>
            <div class="field"><label>Chat ID администратора (для поломок)</label><input id="tg-chat" value="${esc(state.tgChat || '')}" placeholder="Например: 518294012"></div>
          </div>
          <div class="field"><label>URL веб-приложения (GitHub Pages — для кнопки перехода в чек-лист)</label><input id="tg-url" value="${esc(state.webappUrl || (location.origin + location.pathname.replace(/owner\.html$/i, '')))}" placeholder="https://username.github.io/coffee-illy/"></div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;">
            <button class="chip-btn accent" id="tg-save">💾 Сохранить Telegram</button>
            <button class="chip-btn good" id="tg-auto">🔔 Включить авто-уведомления (каждые 5 мин)</button>
            <button class="chip-btn" id="tg-test">📨 Тест админу</button>
            <button class="chip-btn" id="tg-run">▶️ Проверить чек-листы сейчас</button>
          </div>
        </div>
        <div class="card" style="margin-bottom:16px;">
          <div class="card-head"><div><h2 class="card-title">Безопасность сессий и совместимость версий</h2><div class="card-sub">COFFEE ILLY · Release 1.0.0 · Barista 94.0 · Dashboard 94.0 · API 1.0 · Schema 1.0</div></div></div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button class="chip-btn bad" id="btn-revoke-all">🚪 Завершить все активные сессии</button>
          </div>
        </div>
        <div class="card">
          <div class="card-head"><div><h2 class="card-title">Журнал аудита и синхронизации</h2></div></div>
          <div class="stack" style="max-height:260px;overflow-y:auto;">${(state.auditLog||[]).map(a=>`<div class="card-soft" style="padding:8px 12px;"><div style="display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);"><b>${esc(a.actor)} · ${a.time}</b><span class="badge accent">rev #${a.rev}</span></div><div style="font-size:12.5px;margin-top:2px;">${esc(a.text)}</div></div>`).join('')}</div>
        </div>`;
      const sop = document.getElementById('s-open-plans'); if (sop) sop.onclick = () => { tab = 'finances'; render(); };
      document.getElementById('s-save').onclick = () => guard('Сохранить настройки', () => {
        state.location = document.getElementById('sl').value.trim() || state.location;
        state.plan = Number(document.getElementById('sp').value);
        state.planChecks = Number(document.getElementById('sc').value);
        state.minAvgCheck = Number(document.getElementById('sa').value);
        state.woNorm = Number(document.getElementById('sw').value);
        state.initCounter = Math.max(0, Number(document.getElementById('sn').value)||0);
        state.photoAll = document.getElementById('sph').value === '1';
        saveSharedState(state, 'Администратор', 'Обновлены настройки точки («' + state.location + '»)');
        showToast('Настройки синхронизированы!'); render();
      });
      document.getElementById('tg-save').onclick = () => guard('Настройки Telegram', async () => {
        if (!window.CoffeeCloudV94) return;
        const tok = document.getElementById('tg-tok').value.trim();
        const chat = document.getElementById('tg-chat').value.trim();
        const url = document.getElementById('tg-url').value.trim();
        const res = await window.CoffeeCloudV94.saveTelegramSettings({ tgToken: tok, tgChat: chat, webappUrl: url });
        if (res && res.ok) {
          state.tgConfiguredOnServer = !!res.tgConfiguredOnServer;
          state.tgChat = res.tgChat || chat;
          state.webappUrl = res.webappUrl || url;
          showToast('✓ Настройки Telegram сохранены на сервере!'); render();
        } else showToast('Ошибка сохранения Telegram: ' + ((res && res.error) || 'проверьте вход'));
      });
      document.getElementById('tg-auto').onclick = () => guard('Включить авто-уведомления', async () => {
        if (!window.CoffeeCloudV94) return;
        const res = await window.CoffeeCloudV94.setupTriggers();
        if (res && res.ok) { state.autopilotEnabled = true; showToast('🔔 Авто-уведомления (каждые 5 мин) включены!'); render(); }
        else showToast('Ошибка активации триггера');
      });
      document.getElementById('tg-test').onclick = () => guard('Тест Telegram', async () => {
        if (!window.CoffeeCloudV94) return;
        const res = await window.CoffeeCloudV94.testTelegramAlert();
        if (res && res.ok) showToast('📨 Тестовое сообщение отправлено в Telegram!');
        else showToast('Не удалось отправить: ' + ((res && res.telegram && (res.telegram.reason || res.telegram.error)) || (res && res.error) || 'проверьте токен и Chat ID'));
      });
      document.getElementById('tg-run').onclick = () => guard('Проверка чек-листов', async () => {
        if (!window.CoffeeCloudV94) return;
        const res = await window.CoffeeCloudV94.runChecklistNotificationsNow({});
        const cnt = (res && Array.isArray(res.sent)) ? res.sent.length : 0;
        showToast(cnt ? ('📨 Отправлено уведомлений сотрудникам: ' + cnt) : 'Новых открытых чек-листов для отправки нет');
      });
      const revBtn = document.getElementById('btn-revoke-all');
      if (revBtn) revBtn.onclick = () => guard('Завершить все сессии', async () => {
        if (!window.CoffeeCloudV94) return;
        const res = await window.CoffeeCloudV94.revokeAllSessions();
        if (res && res.ok) { showToast('🚪 Все активные сессии завершены (эпоха #' + res.globalSessionEpoch + ')'); render(); }
      });
    }
  }

  function openTasksModal(blk) {
    const list = blockTasks(blk);
    openModal('Задачи «' + blk + '» (' + list.length + ')', `
      <div class="stack" style="margin-bottom:12px;max-height:270px;overflow-y:auto;">${list.map((t,i)=>`<div class="card-soft" style="display:flex;justify-content:space-between;gap:8px;"><div><b>${i+1}. ${esc(t.title)}</b> ${t.photo?'<span class="badge accent">📷</span>':''}</div><button class="chip-btn bad" data-dt="${esc(t.id)}" style="padding:4px 8px;">✕</button></div>`).join('')}</div>
      <div class="field"><label>Новая задача</label><input id="nt-t" placeholder="Название шага"></div>
      <div class="grid-2"><div class="field"><label>Ответственный</label><select id="nt-o">${optList(OWNERS,'Администратор')}</select></div><div class="field"><label>Фото</label><select id="nt-p"><option value="1">Да</option><option value="0">Нет</option></select></div></div>
      <button class="btn-lg primary" id="nt-s">+ Добавить</button>
    `);
    document.querySelectorAll('[data-dt]').forEach(b=>b.onclick=()=>guard('Удалить задачу',()=>{ state.tasks=state.tasks.filter(x=>x.id!==b.dataset.dt); saveSharedState(state,'Администратор','Удалена задача'); openTasksModal(blk); render(); }));
    document.getElementById('nt-s').onclick = () => guard('Добавить задачу', () => {
      const t = document.getElementById('nt-t').value.trim(); if (!t) return;
      state.tasks.push({ id:'t_'+Date.now(), block:blk, group:blk, title:t, instruction:'По стандарту Coffee Illy.', photo:document.getElementById('nt-p').value==='1', owner:document.getElementById('nt-o').value });
      saveSharedState(state, 'Администратор', 'Добавлена задача «' + t + '»'); openTasksModal(blk); render();
    });
  }
  function openStaffModal(id) {
    const s = id ? state.staff.find(x=>x.id===id) : null;
    openModal(s ? 'Сотрудник: ' + s.name : 'Новый сотрудник', `
      <div class="field"><label>Имя</label><input id="sn" value="${s?esc(s.name):''}"></div>
      <div class="grid-2"><div class="field"><label>Роль</label><select id="sr"><option ${s&&s.role==='Бариста'?'selected':''}>Бариста</option><option ${s&&s.role==='Старший сотрудник'?'selected':''}>Старший сотрудник</option><option ${s&&s.role==='Администратор'?'selected':''}>Администратор</option><option ${s&&s.role==='Владелец'?'selected':''}>Владелец</option></select></div><div class="field"><label>Статус</label><select id="sa"><option value="1" ${!s||s.active!==false?'selected':''}>Активен</option><option value="0" ${s&&s.active===false?'selected':''}>Отключён</option></select></div></div>
      <div class="grid-2"><div class="field"><label>Личный PIN (4–6 цифр)</label><input id="sp" value="${s?esc(s.pin):'1234'}"></div><div class="field"><label>Telegram ID</label><input id="sg" value="${s?esc(s.tgId||''):''}" placeholder="TG-..."></div></div>
      <button class="btn-lg primary" id="ss">Сохранить</button>
    `);
    document.getElementById('ss').onclick = () => {
      const nm = document.getElementById('sn').value.trim(), pin = document.getElementById('sp').value.trim(), tg = document.getElementById('sg').value.trim();
      if (!nm || !/^\d{4,6}$/.test(pin)) { showToast('Проверьте имя и PIN (4–6 цифр)'); return; }
      if (s) { s.name=nm; s.role=document.getElementById('sr').value; s.active=document.getElementById('sa').value==='1'; s.pin=pin; s.pinIsDefault=(pin==='1234'); s.tgId=tg; }
      else state.staff.push({ id:'st_'+Date.now(), name:nm, role:document.getElementById('sr').value, shop:state.location, active:true, pin, pinIsDefault:pin==='1234', tgId:tg });
      saveSharedState(state, 'Администратор', 'Обновлён сотрудник ' + nm); closeModal(); showToast('Синхронизировано!'); render();
    };
  }
  function openTtkModal(id) {
    const k = id ? state.ttk.find(x=>x.id===id) : null;
    openModal(k ? 'ТТК: ' + k.name : 'Новая ТТК', `
      <div class="field"><label>Название</label><input id="kn" value="${k?esc(k.name):''}"></div>
      <div class="grid-2"><div class="field"><label>Объём</label><select id="kv">${optList(VOL_OPTS, k?k.vol:VOL_OPTS[3])}</select></div><div class="field"><label>Категория</label><select id="kc">${optList(CAT_OPTS, k?k.cat:CAT_OPTS[0])}</select></div></div>
      <div class="grid-2"><div class="field"><label>Цена вручную (₽)</label><input id="kp" type="number" min="1" value="${k?k.price:22}"></div><div class="field"><label>Себест. (₽)</label><input id="ks" type="number" min="0" step="0.1" value="${k?k.cost:7.5}"></div></div>
      <div class="field"><label>Рецептура</label><textarea id="kr" rows="2">${k?esc(k.recipe):''}</textarea></div>
      <button class="btn-lg primary" id="ksv">Сохранить</button>
    `);
    document.getElementById('ksv').onclick = () => {
      const nm = document.getElementById('kn').value.trim(), pr = Number(document.getElementById('kp').value)||0, cs = Number(document.getElementById('ks').value)||0;
      if (!nm || pr<=0) return;
      if (k) { k.name=nm; k.vol=document.getElementById('kv').value; k.cat=document.getElementById('kc').value; k.price=pr; k.cost=cs; k.recipe=document.getElementById('kr').value.trim(); }
      else state.ttk.push({ id:'ttk_'+Date.now(), name:nm, vol:document.getElementById('kv').value, cat:document.getElementById('kc').value, price:pr, cost:cs, recipe:document.getElementById('kr').value.trim(), serve:'' });
      saveSharedState(state, 'Администратор', 'Обновлена ТТК ' + nm); closeModal(); showToast('ТТК отправлена в терминал!'); render();
    };
  }

  // Live Cross-Tab Sync Listener (receives instant updates from Terminal!)
  function onRemoteSync() {
    const next = loadSharedState();
    if (next.rev !== state.rev) {
      state = next;
      showToast('⚡ Получено обновление из терминала (rev #' + state.rev + ')');
      render();
    }
  }
  if (syncCh) syncCh.onmessage = onRemoteSync;
  window.addEventListener('storage', (e) => { if (e.key === STORE_KEY) onRemoteSync(); });

  document.querySelectorAll('#admin-nav button').forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); });
  document.getElementById('btn-lock').onclick = () => { if (adminUnlocked) { adminUnlocked = false; render(); } else guard('Вход', () => {}); };
  let cloudLoop = null;
  document.getElementById('btn-reset').onclick = async () => {
    showToast('🔄 Загрузка свежих данных из Google Таблицы...');
    if (cloudLoop && cloudLoop.pullNow) {
      await cloudLoop.pullNow(true);
      showToast('✓ Данные обновлены из Google Таблицы');
      render();
    }
  };
  render();

  setInterval(() => {
    const _clk = document.getElementById('hdr-clock');
    if (_clk && window.CoffeeCloudV94) _clk.textContent = '🕒 ' + window.CoffeeCloudV94.localHHMM();
  }, 15000);
  if (window.CoffeeCloudV94) {
    cloudLoop = window.CoffeeCloudV94.startCloudLoop({
      mode: 'owner',
      getState: () => state,
      onAuthRequired: () => {
        adminUnlocked = false;
        adminAuthNeeded = true;
        render();
      },
      onSynced: (st, srvRev) => {
        if (window.CoffeeCloudV94.getSession && window.CoffeeCloudV94.getSession().adminToken) {
          adminUnlocked = true; adminAuthNeeded = false;
        }
        try { localStorage.setItem(STORE_KEY, JSON.stringify(st)); } catch(_) {}
        render();
      }
    });
  }
})();
</script>
</body>
</html>
