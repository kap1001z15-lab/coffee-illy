<header class="app-header"><div class="wrap">
  <div class="brand"><div><h1><svg viewBox="0 0 32 32" fill="none" stroke="#e0a76a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4c0 2.5 2.5 2.5 2.5 5M16 3c0 3 2.5 3 2.5 6M22 4c0 2.5 2.5 2.5 2.5 5"/><path d="M5 13h18v7a9 9 0 0 1-18 0v-7Z" fill="rgba(224,167,106,.18)"/><path d="M23 15h2.5a3.5 3.5 0 0 1 0 7H23"/><path d="M3 29h22"/></svg>Кофейня</h1><span class="sub" id="sub">Панель владельца</span> <span id="netStatusBadge" class="net-pill online ci-u-243" title="Статус соединения">🟢 Онлайн</span> <span id="ownerDataSyncBadge" class="sync-pill synced ci-u-244" title="Статус сохранения данных">✓ Данные сохранены</span></div></div>
  <nav id="ownerMainNav" aria-label="Разделы владельца">
    <button type="button" data-osec="dashboard" class="on">📊 Обзор</button>
    <button type="button" data-osec="report" class="">📊 Отчёты</button>
    <button type="button" data-osec="admin" class="">⚙️ Управление</button>
  </nav>
  <div class="ci-u-245"><button type="button" id="ownerNotifBtn" class="notif-btn">🔔 <span id="ownerNotifCount">0</span></button><button class="theme-btn" id="theme" type="button" aria-label="Тема">🌙</button></div>
    <div id="ownerCombinedNav" class="owner-combined-nav md3-navigation-drawer" role="navigation" aria-label="7 разделов панели владельца (Owner Combined)">
    <button type="button" data-cnav="overview" class="on">Обзор</button>
    <button type="button" data-cnav="operations">Операции</button>
    <button type="button" data-cnav="finance">Финансы</button>
    <button type="button" data-cnav="staff">Персонал</button>
    <button type="button" data-cnav="standards">Стандарты</button>
    <button type="button" data-cnav="control">Контроль</button>
    <button type="button" data-cnav="settings">Настройки</button>
  </div>
</div></header>
<main>
  <div class="ci-u-246" id="workspaceTopRoleBar">

      <span>Coffee Illy</span><span>›</span><span id="wsBreadcrumbShop">Кофейня №1</span><span>›</span><b id="wsBreadcrumbSection">Обзор бизнеса</b>
    </div>
    <div class="ci-u-247">
      <div class="ws-role-switch" id="workspaceRoleSwitcher" role="tablist" aria-label="Режим рабочего пространства (Разделы 4 и 5)">
        <button type="button" data-wsrole="owner" class="on">💼 Панель владельца</button>
        <button type="button" data-wsrole="admin">🛠 Панель администратора</button>
      </div>
    </div>
  </div>
  <div id="ownerWorkspace9Nav" class="owner-combined-nav md3-navigation-drawer ci-u-248" aria-label="9 разделов панели владельца (Раздел 5.1)">
    <button type="button" data-own9="overview" class="on">Обзор</button>
    <button type="button" data-own9="finance">Финансы</button>
    <button type="button" data-own9="sales">Продажи</button>
    <button type="button" data-own9="cost">Себестоимость</button>
    <button type="button" data-own9="warehouse">Склад</button>
    <button type="button" data-own9="staff">Персонал</button>
    <button type="button" data-own9="operations">Операции</button>
    <button type="button" data-own9="analytics">Аналитика</button>
    <button type="button" data-own9="settings">Настройки</button>
  </div>
  <div id="adminWorkspace11Nav" class="owner-combined-nav md3-navigation-drawer ci-u-248" hidden aria-label="11 разделов панели администратора (Раздел 4.1)">
    <button type="button" data-adm11="overview" class="on">Обзор</button>
    <button type="button" data-adm11="operations">Операции</button>
    <button type="button" data-adm11="tasks">Задачи (Канбан)</button>
    <button type="button" data-adm11="cash">Касса</button>
    <button type="button" data-adm11="staff">Персонал</button>
    <button type="button" data-adm11="incidents">Инциденты</button>
    <button type="button" data-adm11="standards">Стандарты</button>
    <button type="button" data-adm11="warehouse">Склад</button>
    <button type="button" data-adm11="expenses">Расходы</button>
    <button type="button" data-adm11="audit">Аудит</button>
    <button type="button" data-adm11="settings">Настройки</button>
  </div>
  <div id="ownerSectionSubbar" class="owner-subbar" aria-label="Подразделы текущего раздела"></div>
  <div id="err" class="al" hidden></div>
  <div id="ownerNotifDrawer" class="card md3-card md3-surface-container ci-u-249" hidden></div>

  <!-- 1. ДАШБОРД ВЛАДЕЛЬЦА -->
  <div id="ownerSecDashboard"></div>

  <!-- 2. ФИНАНСОВЫЕ ОТЧЁТЫ И P&L -->
  <div id="ownerSecReport" hidden></div>

  <!-- 3. УПРАВЛЕНИЕ И НАСТРОЙКИ (9 ВКЛАДОК В 1 СТРОЧКУ) -->
  <div id="content" hidden>
    <div class="seg" id="tabs" role="tablist" aria-label="Разделы управления (Операции · Финансы · Персонал и стандарты · Система)">
      <button data-t="checklists" title="Операции: Таймлайн и окна смен">📋 Таймлайн</button>
      <button data-t="tasks" title="Операции: Задачи, Карта добрых дел и Информирование">📝 Задачи</button>
      <button data-t="inc" title="Операции: Реестр поломок и инцидентов">🔧 Поломки</button>
      <button data-t="cash" title="Финансы: Выручка, Z-отчёты и сверка кассы">⚖️ Выручка</button>
      <button data-t="exp" title="Финансы: Операционные расходы OpEx">💸 Расходы</button>
      <button data-t="staff" title="Персонал: Штат, графики и PIN-коды">👥 Штат</button>
      <button data-t="ttk" title="Стандарты: Технологические карты напитков">☕ Техкарты</button>
      <button data-t="audit" title="Стандарты: Чек-листы аудита сервиса">⭐ Аудит</button>
      <button data-t="set" title="Система: Настройки, Безопасность, Склад и Резервные копии">⚙️ Настройки</button>
    </div>
    <section class="card md3-card md3-surface-container" id="panel"></section>
  </div>
</main>
<dialog class="md3-dialog md3-bottom-sheet" id="dlg"><form id="dform" method="dialog"><h2 class="ci-u-250" id="dtitle"></h2><div id="dfields"></div><div class="ci-u-251" id="derr"></div>
  <div class="acts ci-u-37"><button class="b" type="button" id="dcancel">Отмена</button><button class="p" id="dsave" value="ok">Сохранить</button></div></form></dialog>

    <button type="button" id="wsDrawerCloseBtn" class="b ci-u-254">✕ Закрыть</button>
  </div>
  <div class="ci-u-255" id="wsDrawerBody"></div>
</aside>
