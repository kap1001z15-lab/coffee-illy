<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">

<title>Coffee Illy — Дашборд</title>
<style>

:root {
  --bg: #FCF8F4; --surface: #F4ECE4; --surface-2: #EAE0D5; --card: #FFFFFF;
  --ink: #271C15; --muted: #6E5D51; --accent: #7D4E24; --accent-soft: rgba(125,78,36,0.12);
  --accent-ink: #FFFFFF; --good: #266D45; --good-soft: rgba(38,109,69,0.12);
  --warn: #A46200; --warn-soft: rgba(164,98,0,0.13); --bad: #B33A3A; --bad-soft: rgba(179,58,58,0.12);
  --border: rgba(39,28,21,0.10); --shadow: 0 2px 10px rgba(39,28,21,0.05);
  --radius-card: 24px; --radius-pill: 999px;
  --font: system-ui, -apple-system, 'Segoe UI', Roboto, Inter, sans-serif;
}
html[data-theme="dark"] {
  --bg: #171311; --surface: #221D1A; --surface-2: #2E2723; --card: #26201D;
  --ink: #F2E7DF; --muted: #B8A79A; --accent: #E8B88A; --accent-soft: rgba(232,184,138,0.16);
  --accent-ink: #2B1A0D; --good: #8AD6A7; --good-soft: rgba(138,214,167,0.15);
  --warn: #F0BE6F; --warn-soft: rgba(240,190,111,0.15); --bad: #F2A2A2; --bad-soft: rgba(242,162,162,0.15);
  --border: rgba(242,231,223,0.10); --shadow: 0 2px 14px rgba(0,0,0,0.28);
}
* { box-sizing: border-box; }
html, body { margin:0; padding:0; background:var(--bg); color:var(--ink); font-family:var(--font); font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased; transition:background .2s,color .2s; }
button, input, select, textarea { font-family:inherit; color:inherit; }
button { cursor:pointer; border:none; background:transparent; }
.topbar { position:sticky; top:0; z-index:40; background:var(--bg); border-bottom:1px solid var(--border); padding:10px 18px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
.brand { display:flex; align-items:center; gap:10px; }
.brand-dot { width:36px; height:36px; border-radius:14px; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; font-weight:800; font-size:15px; }
.brand-title { font-weight:750; font-size:16px; }
.brand-sub { font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.live-pill { display:inline-flex; align-items:center; gap:5px; padding:2px 9px; border-radius:999px; background:var(--good-soft); color:var(--good); font-weight:650; font-size:11px; }
.live-dot { width:7px; height:7px; border-radius:50%; background:currentColor; }
.top-actions { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.chip-btn { padding:7px 13px; border-radius:999px; background:var(--surface); border:1px solid var(--border); font-size:12.5px; font-weight:650; display:inline-flex; align-items:center; gap:6px; }
.chip-btn:hover { background:var(--surface-2); }
.chip-btn.accent { background:var(--accent); color:var(--accent-ink); border-color:transparent; }
.chip-btn.good { background:var(--good-soft); color:var(--good); border-color:transparent; }
.chip-btn.bad { background:var(--bad-soft); color:var(--bad); border-color:transparent; }
.chip-btn.warn { background:var(--warn-soft); color:var(--warn); border-color:transparent; }
.seg { display:inline-flex; background:var(--surface); padding:4px; border-radius:999px; border:1px solid var(--border); gap:2px; }
.seg button { padding:6px 12px; border-radius:999px; font-size:12.5px; font-weight:650; color:var(--muted); }
.seg button.active { background:var(--accent); color:var(--accent-ink); }
.card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius-card); padding:18px; box-shadow:var(--shadow); }
.card-soft { background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:12px 14px; }
.card-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
.card-title { font-size:16px; font-weight:750; margin:0; }
.card-sub { font-size:12px; color:var(--muted); }
.badge { display:inline-flex; align-items:center; justify-content:center; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:700; background:var(--surface-2); color:var(--ink); }
.badge.good { background:var(--good-soft); color:var(--good); }
.badge.warn { background:var(--warn-soft); color:var(--warn); }
.badge.bad { background:var(--bad-soft); color:var(--bad); }
.badge.accent { background:var(--accent-soft); color:var(--accent); }
.stack { display:flex; flex-direction:column; gap:10px; }
.row-item { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 14px; border-radius:18px; background:var(--surface); border:1px solid var(--border); flex-wrap:wrap; }
.row-main { min-width:0; flex:1; }
.row-title { font-weight:700; font-size:14px; }
.row-sub { font-size:12px; color:var(--muted); margin-top:2px; }
.pbar { height:7px; background:var(--surface-2); border-radius:99px; overflow:hidden; margin-top:6px; }
.pbar > div { height:100%; background:var(--accent); border-radius:99px; transition:width .25s; }
.pbar.good > div { background:var(--good); }
.field { display:flex; flex-direction:column; gap:5px; margin-bottom:10px; }
.field label { font-size:12px; font-weight:700; color:var(--muted); }
.field input, .field select, .field textarea { width:100%; padding:9px 12px; border-radius:14px; background:var(--surface); border:1px solid var(--border); font-size:14px; }
.grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.grid-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
@media (max-width:640px) { .grid-2, .grid-3 { grid-template-columns:1fr; } }
.btn-lg { width:100%; padding:12px 16px; border-radius:999px; font-size:14px; font-weight:750; display:inline-flex; align-items:center; justify-content:center; gap:8px; }
.btn-lg.primary { background:var(--accent); color:var(--accent-ink); }
.btn-lg.primary:disabled { opacity:0.45; cursor:not-allowed; }
.btn-lg.danger { background:var(--bad-soft); color:var(--bad); }
.btn-lg.soft { background:var(--surface-2); color:var(--ink); }
.tbl-wrap { overflow-x:auto; }
table { width:100%; border-collapse:collapse; font-size:13.5px; }
th, td { text-align:left; padding:9px 10px; border-bottom:1px solid var(--border); vertical-align:middle; }
th { font-size:11.5px; text-transform:uppercase; letter-spacing:0.03em; color:var(--muted); font-weight:700; }
tr:last-child td { border-bottom:none; }
.modal-bg { position:fixed; inset:0; background:rgba(0,0,0,0.48); z-index:80; display:none; align-items:center; justify-content:center; padding:16px; }
.modal-bg.open { display:flex; }
.modal-card { background:var(--card); border:1px solid var(--border); border-radius:28px; max-width:480px; width:100%; padding:20px; box-shadow:0 20px 50px rgba(0,0,0,0.3); max-height:86vh; overflow-y:auto; }
.toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:999px; font-size:13.5px; font-weight:650; opacity:0; pointer-events:none; z-index:90; transition:opacity .2s,transform .2s; box-shadow:0 8px 24px rgba(0,0,0,0.22); }
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

.wrap { max-width: 1200px; margin: 0 auto; padding: 18px; }
.admin-nav { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px; }
.admin-nav button { padding:9px 16px; border-radius:999px; background:var(--surface); border:1px solid var(--border); font-size:13.5px; font-weight:650; color:var(--muted); display:inline-flex; align-items:center; gap:6px; }
.admin-nav button.active { background:var(--accent); color:var(--accent-ink); border-color:transparent; }
.kpi-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; margin-bottom:16px; }
@media (max-width:780px) { .kpi-grid { grid-template-columns:repeat(2,minmax(0,1fr)); } }
.kpi { background:var(--card); border:1px solid var(--border); border-radius:22px; padding:16px; box-shadow:var(--shadow); }
.kpi-lbl { font-size:12px; color:var(--muted); font-weight:600; }
.kpi-val { font-size:24px; font-weight:800; margin:4px 0 2px; }
.kpi-meta { font-size:12px; color:var(--muted); }
.chart-wrap { display:grid; grid-template-columns:repeat(10,minmax(0,1fr)); gap:8px; align-items:end; height:150px; padding-top:20px; position:relative; }
.chart-plan-line { position:absolute; left:0; right:0; border-top:1.5px dashed var(--accent); opacity:.55; pointer-events:none; }
.chart-plan-lbl { position:absolute; right:0; top:-18px; font-size:11px; font-weight:650; color:var(--accent); }
.bar-col { display:flex; flex-direction:column; align-items:center; gap:5px; height:100%; justify-content:flex-end; }
.bar-val { font-size:10.5px; font-weight:700; color:var(--muted); }
.bar-fill { width:100%; max-width:34px; border-radius:10px 10px 4px 4px; background:var(--accent); }
.bar-fill.hit { background:var(--good); }
.bar-dt { font-size:10.5px; color:var(--muted); font-weight:600; }

  .date-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:0 0 14px;padding:10px 12px;border-radius:16px;background:var(--surface);border:1px solid var(--border);}
  .date-pills{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .date-pill{border:1px solid var(--border);background:transparent;color:var(--muted);padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:600;cursor:pointer;transition:.15s;}
  .date-pill:hover{color:var(--text);border-color:var(--accent);}
  .date-pill.active{background:var(--accent);color:#1d1510;border-color:var(--accent);}
  .date-custom{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .date-custom input[type="date"]{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:5px 9px;font-size:12.5px;font-family:inherit;}
  .date-range-lbl{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap;}
  .chart-wrap{overflow-x:auto;}

/* === Coffee Illy v93.1 Responsive System (Phones · Tablets · Desktop) === */
html { -webkit-text-size-adjust: 100%; }
body { overflow-x: hidden; padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right); }
.kpi-val, .bar-val, td, .badge { font-variant-numeric: tabular-nums; }
.chip-btn, .admin-nav button, .date-pill, .btn-lg, .pin-key, .bnav button {
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  transition: background .16s ease, transform .1s ease, border-color .16s ease, box-shadow .16s ease;
}
.chip-btn:active, .btn-lg:active, .pin-key:active { transform: scale(0.98); }
.tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 14px; }
.tbl-wrap table { min-width: 520px; }

/* Owner Dashboard: Responsive Bento (Phone -> Tablet -> PC) */
.topbar {
  padding: max(10px, env(safe-area-inset-top)) 20px 10px;
}
.admin-nav::-webkit-scrollbar, .date-pills::-webkit-scrollbar { display: none; }

/* Phones (<= 600px) */
@media (max-width: 600px) {
  .topbar { padding: max(8px, env(safe-area-inset-top)) 12px 8px; gap: 8px; }
  .brand-dot { width: 34px; height: 34px; border-radius: 12px; font-size: 14px; }
  .brand-title { font-size: 14.5px; line-height: 1.2; }
  .top-actions { width: 100%; gap: 6px; overflow-x: auto; flex-wrap: nowrap; scrollbar-width: none; padding-bottom: 2px; }
  .top-actions::-webkit-scrollbar { display: none; }
  .top-actions .chip-btn { flex: 0 0 auto; min-height: 36px; padding: 6px 11px; font-size: 12px; white-space: nowrap; }
  .wrap { padding: 12px 12px calc(24px + env(safe-area-inset-bottom)); }
  .admin-nav {
    flex-wrap: nowrap;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    gap: 6px;
    margin-bottom: 12px;
    padding-bottom: 4px;
  }
  .admin-nav button { flex: 0 0 auto; white-space: nowrap; min-height: 40px; padding: 8px 13px; font-size: 13px; }
  .date-bar { padding: 10px; gap: 8px; }
  .date-pills { flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; width: 100%; }
  .date-pill { flex: 0 0 auto; white-space: nowrap; min-height: 34px; }
  .date-custom { width: 100%; justify-content: space-between; }
  .date-custom input[type="date"] { flex: 1; min-width: 0; font-size: 14px; min-height: 38px; }
  .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-bottom: 12px; }
  .kpi { padding: 13px 12px; border-radius: 18px; }
  .kpi-val { font-size: clamp(18px, 5vw, 22px); }
  .kpi-lbl, .kpi-meta { font-size: 11.5px; }
  .card { padding: 14px; border-radius: 20px; }
  .card-title { font-size: 15px; }
  .chart-wrap { min-width: 440px; height: 145px; }
  .field input, .field select, .field textarea { font-size: 16px; min-height: 44px; }
  .btn-lg { min-height: 46px; }
  th, td { padding: 8px 8px; font-size: 12.5px; }
  .row-item { padding: 11px 12px; }
  .modal-bg { align-items: flex-end; padding: 0; }
  .modal-card {
    max-width: 100%;
    border-radius: 26px 26px 0 0;
    padding: 18px 16px calc(22px + env(safe-area-inset-bottom));
    max-height: 88vh;
  }
  .toast { max-width: calc(100vw - 24px); text-align: center; }
}

/* Tablets (601px - 1024px) */
@media (min-width: 601px) and (max-width: 1024px) {
  .topbar { padding: 12px 20px; }
  .wrap { max-width: 980px; padding: 16px 20px 28px; }
  .admin-nav { gap: 6px; }
  .admin-nav button { min-height: 40px; padding: 8px 14px; font-size: 13px; }
  .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .card { padding: 18px; }
}
@media (min-width: 860px) and (max-width: 1024px) {
  .kpi-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}

/* Desktop / PC (>= 1025px) */
@media (min-width: 1025px) {
  .topbar { padding: 12px 28px; }
  .wrap { max-width: 1320px; padding: 20px 28px 36px; }
  .kpi-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
  .kpi { padding: 18px 20px; }
  .kpi-val { font-size: 26px; }
  .card { padding: 22px; }
  .chart-wrap { height: 170px; }
  .tbl-wrap table { min-width: 0; }
}

<body>
<header class="topbar">
  <div class="brand">
    <div class="brand-dot">CI</div>
    <div>
      <div class="brand-title">Дашборд владельца · <span id="hdr-loc">Кофейня №1</span></div>
      <div class="brand-sub">
        <span class="live-pill"><span class="live-dot"></span><span id="hdr-rev">DATA_REV #1</span></span>
        <span>Кофейня · Управление</span>
      </div>
    </div>
  </div>
  <div class="top-actions">
    <span class="chip-btn" id="hdr-clock" style="cursor:default;">🕒 --:--</span>
    <button class="chip-btn good" id="btn-lock">🔓 Админ-сессия</button>
    <button class="chip-btn" id="btn-theme">🌓 Авто</button>

</header>

<main class="wrap">

    <div id="modal-body"></div>

<script>

const LIVE_SNAPSHOT = {"location":"Кофейня №1","plan":2200,"minAvgCheck":35,"planChecks":75,"staff":[],"blocks":[],"tasks":[],"cash":[],"expenses":[],"checklists":[],"incidents":[],"plans":[{"day":"Пн","rev":2200,"avg":35,"checks":70,"roster":""},{"day":"Вт","rev":2200,"avg":35,"checks":70,"roster":""},{"day":"Ср","rev":2200,"avg":35,"checks":70,"roster":""},{"day":"Чт","rev":2200,"avg":35,"checks":70,"roster":""},{"day":"Пт","rev":2500,"avg":35,"checks":80,"roster":""},{"day":"Сб","rev":2800,"avg":35,"checks":85,"roster":""},{"day":"Вс","rev":2400,"avg":35,"checks":75,"roster":""}],"goodDeeds":[],"ttk":[],"audits":[],"salesLog":[],"inventory":[],"inventoryMoves":[],"expiryItems":[]};
const STORE_KEY = 'coffee_illy_v90_live_state';
const THEME_KEY = 'coffee_illy_v90_theme';
const TODAY = (window.CoffeeCloudV93 ? window.CoffeeCloudV93.localISO() : new Date().toISOString().slice(0,10));
const TIME_OPTIONS = ['06:00','06:30','07:00','07:30','08:00','08:30','09:00','09:30','10:00','10:23','10:30','10:34','11:00','11:30','12:00','12:30','13:00','14:00','15:00','16:00','17:00','18:00','18:30','19:00','20:00','21:00','21:30','22:00','22:30','23:00','23:30','23:59'];
const PLAN_OPTS = [1500,1800,2000,2200,2500,3000,3500,4000,5000];
const CHECKS_OPTS = [30,40,50,60,70,75,80,90,100,120];
const AVG_OPTS = [25,28,30,32,35,38,40,45,50];
const WO_OPTS = [5,10,15,20,25,30];
const SHIFT_HOURS = ['07:30–22:30','08:00–20:00','08:00–16:00','14:00–22:30','Выходной'];
const VOL_OPTS = ['60 мл (S)','150 мл (S)','200 мл (M)','250 мл (M)','350 мл (L)','400 мл (XL)'];
const CAT_OPTS = ['Классика','Авторские','Холодные','Чай и не-кофе','Выпечка'];
const EXP_CATS = ['Закупка продуктов','Зарплата','Аренда','Коммунальные','Реклама','Ремонт и оборудование','Прочее'];
const OWNERS = ['Администратор','Бариста','Техник','Управляющий'];
const EQUIP_ZONES = ['Кофемашина','Кофемолка','Холодильник','Термопот','Витрина','Зона гостя','Санузел','Касса / Терминал','Другое'];

function freshState() {
  const s = JSON.parse(JSON.stringify(LIVE_SNAPSHOT));
  s.rev = 1; s.woNorm = 15; s.initCounter = 600; s.photoAll = false; s.simTime = (window.CoffeeCloudV93 ? window.CoffeeCloudV93.localHHMM() : '13:25');
  s.adminPin = '1234'; s.extensions = {};
  s.staff = s.staff.map(st => Object.assign({}, st, {
    pin: '1234', pinIsDefault: true,
    tgId: st.name === 'Соня' ? 'TG-518294012' : (st.name === 'Алина' ? 'TG-604912338' : '')
  }));
  s.liveProgress = {}; s.staffPresence = {}; s.tgChat = ''; s.webappUrl = ''; s.tgConfiguredOnServer = false; s.autopilotEnabled = false; s.lastSyncAt = ''; s.lastRttMs = 0;
  s.auditLog = [{ time: '13:20', actor: 'Система', rev: 1, text: 'Инициализирован релиз v93.1 на реальных данных Coffee_illy.' }];
  return s;
}
function loadSharedState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) { const parsed = JSON.parse(raw); if (parsed && parsed.blocks) return parsed; }
  } catch(_) {}
  const s = freshState();
  try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch(_) {}
  return s;
}
const syncCh = (typeof BroadcastChannel !== 'undefined') ? new BroadcastChannel('coffee_illy_v90_sync') : null;
function saveSharedState(st, actor, desc) {
  st.rev = (Number(st.rev) || 0) + 1;
  if (desc) {
    st.auditLog = st.auditLog || [];
    st.auditLog.unshift({ date: TODAY, time: (window.CoffeeCloudV93 ? window.CoffeeCloudV93.localHHMM() : (st.simTime || '13:25')), actor: actor || 'Система', rev: st.rev, text: desc });
    if (st.auditLog.length > 50) st.auditLog.pop();
  }
  try { localStorage.setItem(STORE_KEY, JSON.stringify(st)); } catch(_) {}
  if (syncCh) try { syncCh.postMessage({ type: 'state', rev: st.rev, ts: Date.now() }); } catch(_) {}
  if (window.CoffeeCloudV93 && desc) window.CoffeeCloudV93.dispatchStateChange(st, actor, desc);
}

    document.documentElement.setAttribute('data-theme', eff);

    if (b) b.textContent = mode === 'auto' ? '🌓 Авто' : (mode === 'light' ? '☀️ Светлая' : '🌙 Тёмная');

          const res = window.CoffeeCloudV93 ? await window.CoffeeCloudV93.importPosBatch(batch.days, 'sum') : { ok: false };
          if (res && res.ok) {
            batch.days.forEach(d => {
              const ex = state.cash.find(c => c.date === d.date);
              if (ex) { ex.cash = d.cash; ex.card = d.card; ex.revenue = d.revenue; ex.checks = d.checks; ex.barista = d.barista; ex.topItems = d.topItems; ex.coffeeQty = d.coffeeQty; }

            ${state.ttk.map(k=>`<tr><td><b>${esc(k.name)}</b></td><td style="color:var(--muted)">${esc(k.vol)}</td><td>${k.price} ₽</td><td>${k.cost} ₽</td><td><span class="badge good">${k.price?Math.round(((k.price-k.cost)/k.price)*100):0}%</span></td><td><button class="chip-btn" data-ek="${esc(k.id)}" style="padding:4px 8px;">✏️</button></td></tr>`).join('')}

        <div class="kpi-grid">

            <div class="field"><label>Фото обязательно везде</label><select id="sph"><option value="0" ${!state.photoAll?'selected':''}>Нет</option><option value="1" ${state.photoAll?'selected':''}>Да</option></select></div>

          <div class="grid-2">
            <div class="field"><label>Токен Telegram-бота (BotFather)</label><input id="tg-tok" type="password" placeholder="${state.tgConfiguredOnServer?'•••••••• (сохранён на сервере)':'123456:ABC-DEF...'}"></div>
            <div class="field"><label>Chat ID администратора (для поломок)</label><input id="tg-chat" value="${esc(state.tgChat || '')}" placeholder="Например: 518294012"></div>
          </div>
          <div class="field"><label>URL веб-приложения (GitHub Pages — для кнопки перехода в чек-лист)</label><input id="tg-url" value="${esc(state.webappUrl || (location.origin + location.pathname.replace(/owner\.html$/i, '')))}" placeholder="https://username.github.io/coffee-illy/"></div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;">
            <button class="chip-btn accent" id="tg-save">💾 Сохранить Telegram</button>

            <button class="chip-btn" id="tg-test">📨 Тест админу</button>
            <button class="chip-btn" id="tg-run">▶️ Проверить чек-листы сейчас</button>
          </div>

        <div class="card">
          <div class="card-head"><div><h2 class="card-title">Журнал аудита и управления (${fAudit.length})</h2></div></div>
          <div class="stack" style="max-height:300px;overflow-y:auto;">${fAudit.length ? fAudit.map(a=>`<div class="card-soft" style="padding:8px 12px;"><div style="display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);"><b>${esc(a.actor)} · ${a.date ? esc(a.date) + ' ' : ''}${esc(a.time || '')}</b><span class="badge accent">rev #${a.rev || state.rev}</span></div><div style="font-size:12.5px;margin-top:2px;">${esc(a.text)}</div></div>`).join('') : `<div style="color:var(--muted);font-size:13px;padding:8px 0;">Нет записей управления за выбранный период (${esc(rng.label)})</div>`}</div>
        </div>`;

      document.getElementById('s-save').onclick = () => guard('Сохранить настройки', () => {
        state.location = document.getElementById('sl').value.trim() || state.location;
        state.plan = Number(document.getElementById('sp').value);
        state.planChecks = Number(document.getElementById('sc').value);
        state.minAvgCheck = Number(document.getElementById('sa').value);
        state.woNorm = Number(document.getElementById('sw').value);
        state.initCounter = Math.max(0, Number(document.getElementById('sn').value)||0);
        state.photoAll = document.getElementById('sph').value === '1';
        saveSharedState(state, 'Администратор', 'Обновлены настройки точки («' + state.location + '»)');
        showToast('✓ Сохранено'); render();
      });
      document.getElementById('tg-save').onclick = () => guard('Настройки Telegram', async () => {
        if (!window.CoffeeCloudV93) return;
        const tok = document.getElementById('tg-tok').value.trim();
        const chat = document.getElementById('tg-chat').value.trim();
        const url = document.getElementById('tg-url').value.trim();
        const res = await window.CoffeeCloudV93.saveTelegramSettings({ tgToken: tok, tgChat: chat, webappUrl: url });
        if (res && res.ok) {
          state.tgConfiguredOnServer = !!res.tgConfiguredOnServer;
          state.tgChat = res.tgChat || chat;
          state.webappUrl = res.webappUrl || url;
          showToast('✓ Настройки Telegram сохранены на сервере!'); render();
        } else showToast('Ошибка сохранения Telegram: ' + ((res && res.error) || 'проверьте вход'));

        const res = await window.CoffeeCloudV93.setupTriggers();

        else showToast('Ошибка активации триггера');

        if (!window.CoffeeCloudV93) return;

        if (res && res.ok) showToast('📨 Тестовое сообщение отправлено в Telegram!');
        else showToast('Не удалось отправить: ' + ((res && res.telegram && (res.telegram.reason || res.telegram.error)) || (res && res.error) || 'проверьте токен и Chat ID'));
      });
      document.getElementById('tg-run').onclick = () => guard('Проверка чек-листов', async () => {
        if (!window.CoffeeCloudV93) return;
        const res = await window.CoffeeCloudV93.runChecklistNotificationsNow({});
        const cnt = (res && Array.isArray(res.sent)) ? res.sent.length : 0;
        showToast(cnt ? ('📨 Отправлено уведомлений сотрудникам: ' + cnt) : 'Новых открытых чек-листов для отправки нет');
      });
    }

  function openWarehouseModal(id) {
    const it = id ? (state.inventory || []).find(x => x.id === id) : null;
    openModal(it ? ('Товар: ' + it.name) : 'Новый товар на складе', `
      <div class="field"><label>Название товара</label><input id="wh-nm" value="${it ? esc(it.name) : ''}" placeholder="Например: Зерно Illy 250г / Молоко 3.2%"></div>
      <div class="grid-2">
        <div class="field"><label>Категория</label><input id="wh-cat" value="${it ? esc(it.category || 'Сырьё') : 'Сырьё'}" placeholder="Кофе / Молоко / Расходники"></div>
        <div class="field"><label>Ед. измерения</label><input id="wh-un" value="${it ? esc(it.unit || 'шт') : 'шт'}" placeholder="г / мл / шт / л"></div>
      </div>
      <div class="grid-2">
        <div class="field"><label>Текущий остаток</label><input id="wh-st" type="number" min="0" value="${it ? Number(it.stock || 0) : 0}"></div>
        <div class="field"><label>Мин. порог (алерт)</label><input id="wh-min" type="number" min="0" value="${it ? Number(it.minStock || 5) : 5}"></div>
      </div>
      <button class="btn-lg primary" id="wh-sv">Сохранить на склад</button>
    `);
    document.getElementById('wh-sv').onclick = async () => {
      const payload = {
        id: it ? it.id : ('inv_' + Date.now().toString(36)),
        name: document.getElementById('wh-nm').value.trim(),
        category: document.getElementById('wh-cat').value.trim() || 'Сырьё',
        unit: document.getElementById('wh-un').value.trim() || 'шт',
        stock: Math.max(0, Math.round(Number(document.getElementById('wh-st').value) || 0)),
        minStock: Math.max(0, Math.round(Number(document.getElementById('wh-min').value) || 0))
      };
      if (!payload.name) { showToast('Укажите название товара'); return; }
      if (window.CoffeeCloudV93) {
        const res = await window.CoffeeCloudV93.saveInventoryItem(payload);
        if (res && res.ok) {
          if (Array.isArray(res.inventory)) state.inventory = res.inventory;
          if (Array.isArray(res.inventoryMoves)) state.inventoryMoves = res.inventoryMoves;
        }
      }
      if (!state.inventory) state.inventory = [];
      const ex = state.inventory.find(x => x.id === payload.id);
      if (ex) Object.assign(ex, payload, { updatedAt: TODAY });
      else state.inventory.push(Object.assign({}, payload, { updatedAt: TODAY }));
      saveSharedState(state, 'Администратор', 'Обновлён склад: ' + payload.name + ' (' + payload.stock + ' ' + payload.unit + ')');
      closeModal(); showToast('✓ Остаток сохранён в Google Таблице'); render();
    };
  }
  function openWarehouseMoveModal(id, kind) {
    const it = (state.inventory || []).find(x => x.id === id);
    if (!it) return;
    const isRestock = kind === 'restock';
    openModal((isRestock ? 'Приход: ' : 'Списание: ') + it.name, `
      <div class="card-soft" style="margin-bottom:10px;font-size:12.5px;">Текущий остаток: <b>${it.stock} ${esc(it.unit)}</b></div>
      <div class="field"><label>Количество (${esc(it.unit)})</label><input id="wm-qty" type="number" min="1" value="1"></div>
      <div class="field"><label>Комментарий</label><input id="wm-note" placeholder="${isRestock?'Поставка от поставщика':'Использовано / списано'}"></div>
      <button class="btn-lg primary" id="wm-ok">${isRestock?'+ Зачислить на склад':'− Списать со склада'}</button>
    `);
    document.getElementById('wm-ok').onclick = async () => {
      const qty = Math.max(1, Math.round(Number(document.getElementById('wm-qty').value) || 0));
      const note = document.getElementById('wm-note').value.trim();
      if (window.CoffeeCloudV93) {
        const res = isRestock
          ? await window.CoffeeCloudV93.restockInventory(it.id, qty, note)
          : await window.CoffeeCloudV93.writeoffInventory(it.id, qty, note);
        if (res && res.ok) {
          if (Array.isArray(res.inventory)) state.inventory = res.inventory;
          if (Array.isArray(res.inventoryMoves)) state.inventoryMoves = res.inventoryMoves;
        }
      }
      it.stock = Math.max(0, Number(it.stock || 0) + (isRestock ? qty : -qty));
      it.updatedAt = TODAY;
      saveSharedState(state, 'Администратор', (isRestock ? 'Приход склада: ' : 'Списание склада: ') + it.name + ' (' + (isRestock ? '+' : '-') + qty + ' ' + it.unit + ')');
      closeModal(); showToast(isRestock ? '✓ Приход записан' : '✓ Списание записано'); render();
    };
  }
  function openTasksModal(blk) {
    const list = blockTasks(blk);
    openModal('Задачи «' + blk + '» (' + list.length + ')', `
      <div class="stack" style="margin-bottom:12px;max-height:270px;overflow-y:auto;">${list.map((t,i)=>`<div class="card-soft" style="display:flex;justify-content:space-between;gap:8px;"><div><b>${i+1}. ${esc(t.title)}</b> ${t.photo?'<span class="badge accent">📷</span>':''}</div><button class="chip-btn bad" data-dt="${esc(t.id)}" style="padding:4px 8px;">✕</button></div>`).join('')}</div>
      <div class="field"><label>Новая задача</label><input id="nt-t" placeholder="Название шага"></div>
      <div class="grid-2"><div class="field"><label>Ответственный</label><select id="nt-o">${optList(OWNERS,'Администратор')}</select></div><div class="field"><label>Фото</label><select id="nt-p"><option value="1">Да</option><option value="0">Нет</option></select></div></div>
      <button class="btn-lg primary" id="nt-s">+ Добавить</button>
    `);
    document.querySelectorAll('[data-dt]').forEach(b=>b.onclick=()=>guard('Удалить задачу',()=>{ state.tasks=state.tasks.filter(x=>x.id!==b.dataset.dt); saveSharedState(state,'Администратор','Удалена задача'); openTasksModal(blk); render(); }));
    document.getElementById('nt-s').onclick = () => guard('Добавить задачу', () => {
      const t = document.getElementById('nt-t').value.trim(); if (!t) return;
      state.tasks.push({ id:'t_'+Date.now(), block:blk, group:blk, title:t, instruction:'По стандарту Coffee Illy.', photo:document.getElementById('nt-p').value==='1', owner:document.getElementById('nt-o').value });
      saveSharedState(state, 'Администратор', 'Добавлена задача «' + t + '»'); openTasksModal(blk); render();
    });
  }
  function openStaffModal(id) {
    const s = id ? state.staff.find(x=>x.id===id) : null;
    openModal(s ? 'Сотрудник: ' + s.name : 'Новый сотрудник', `
      <div class="field"><label>Имя</label><input id="sn" value="${s?esc(s.name):''}"></div>
      <div class="grid-2"><div class="field"><label>Роль</label><select id="sr"><option ${s&&s.role==='Бариста'?'selected':''}>Бариста</option><option ${s&&s.role==='Администратор'?'selected':''}>Администратор</option></select></div><div class="field"><label>Статус</label><select id="sa"><option value="1" ${!s||s.active!==false?'selected':''}>Активен</option><option value="0" ${s&&s.active===false?'selected':''}>Отключён</option></select></div></div>
      <div class="grid-2"><div class="field"><label>Личный PIN (4–6 цифр)</label><input id="sp" value="${s?esc(s.pin):'1234'}"></div><div class="field"><label>Telegram ID</label><input id="sg" value="${s?esc(s.tgId||''):''}" placeholder="TG-..."></div></div>
      <button class="btn-lg primary" id="ss">Сохранить</button>
    `);
    document.getElementById('ss').onclick = () => {
      const nm = document.getElementById('sn').value.trim(), pin = document.getElementById('sp').value.trim(), tg = document.getElementById('sg').value.trim();
      if (!nm || !/^\d{4,6}$/.test(pin)) { showToast('Проверьте имя и PIN (4–6 цифр)'); return; }
      if (s) { s.name=nm; s.role=document.getElementById('sr').value; s.active=document.getElementById('sa').value==='1'; s.pin=pin; s.pinIsDefault=(pin==='1234'); s.tgId=tg; }
      else state.staff.push({ id:'st_'+Date.now(), name:nm, role:document.getElementById('sr').value, shop:state.location, active:true, pin, pinIsDefault:pin==='1234', tgId:tg });
      saveSharedState(state, 'Администратор', 'Обновлён сотрудник ' + nm); closeModal(); showToast('Синхронизировано!'); render();
    };
  }
  function openTtkModal(id) {
    const k = id ? state.ttk.find(x=>x.id===id) : null;
    openModal(k ? 'ТТК: ' + k.name : 'Новая ТТК', `
      <div class="field"><label>Название</label><input id="kn" value="${k?esc(k.name):''}"></div>
      <div class="grid-2"><div class="field"><label>Объём</label><select id="kv">${optList(VOL_OPTS, k?k.vol:VOL_OPTS[3])}</select></div><div class="field"><label>Категория</label><select id="kc">${optList(CAT_OPTS, k?k.cat:CAT_OPTS[0])}</select></div></div>
      <div class="grid-2"><div class="field"><label>Цена вручную (₽)</label><input id="kp" type="number" min="1" value="${k?k.price:22}"></div><div class="field"><label>Себест. (₽)</label><input id="ks" type="number" min="0" step="0.1" value="${k?k.cost:7.5}"></div></div>
      <div class="field"><label>Рецептура</label><textarea id="kr" rows="2">${k?esc(k.recipe):''}</textarea></div>
      <button class="btn-lg primary" id="ksv">Сохранить</button>
    `);
    document.getElementById('ksv').onclick = () => {
      const nm = document.getElementById('kn').value.trim(), pr = Number(document.getElementById('kp').value)||0, cs = Number(document.getElementById('ks').value)||0;
      if (!nm || pr<=0) return;
      if (k) { k.name=nm; k.vol=document.getElementById('kv').value; k.cat=document.getElementById('kc').value; k.price=pr; k.cost=cs; k.recipe=document.getElementById('kr').value.trim(); }
      else state.ttk.push({ id:'ttk_'+Date.now(), name:nm, vol:document.getElementById('kv').value, cat:document.getElementById('kc').value, price:pr, cost:cs, recipe:document.getElementById('kr').value.trim(), serve:'' });
      saveSharedState(state, 'Администратор', 'Обновлена ТТК ' + nm); closeModal(); showToast('ТТК отправлена в терминал!'); render();
    };
  }

  // Live Cross-Tab Sync Listener (receives instant updates from Terminal!)
  function onRemoteSync() {
    const next = loadSharedState();
    if (next.rev !== state.rev) {
      state = next;
      showToast('✓ Обновлено');
      render();
    }
  }
  if (syncCh) syncCh.onmessage = onRemoteSync;
  window.addEventListener('storage', (e) => { if (e.key === STORE_KEY) onRemoteSync(); });

  document.querySelectorAll('#admin-nav button').forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); });
  document.getElementById('btn-lock').onclick = () => { if (adminUnlocked) { adminUnlocked = false; render(); } else guard('Вход', () => {}); };
  let cloudLoop = null;
  document.getElementById('btn-reset').onclick = async () => {
    showToast('🔄 Загрузка свежих данных из Google Таблицы...');
    if (cloudLoop && cloudLoop.pullNow) {
      await cloudLoop.pullNow(true);
      showToast('✓ Данные обновлены из Google Таблицы');
      render();
    }
  };
  render();

  setInterval(() => {
    const _clk = document.getElementById('hdr-clock');
    if (_clk && window.CoffeeCloudV93) _clk.textContent = '🕒 ' + window.CoffeeCloudV93.localHHMM();
  }, 15000);
  if (window.CoffeeCloudV93) {
    cloudLoop = window.CoffeeCloudV93.startCloudLoop({
      mode: 'owner',
      getState: () => state,
      onAuthRequired: () => {
        adminUnlocked = false;
        adminAuthNeeded = true;
        render();
      },
      onSynced: (st, srvRev) => {
        if (window.CoffeeCloudV93.getSession && window.CoffeeCloudV93.getSession().adminToken) {
          adminUnlocked = true; adminAuthNeeded = false;
        }
        try { localStorage.setItem(STORE_KEY, JSON.stringify(st)); } catch(_) {}
        render();
      }
    });
  }
})();
</script>
</body>
</html>
