<style>

:root {
  --bg: #FCF8F4; --surface: #F4ECE4; --surface-2: #EAE0D5; --card: #FFFFFF;
  --ink: #271C15; --muted: #6E5D51; --accent: #7D4E24; --accent-soft: rgba(125,78,36,0.12);
  --accent-ink: #FFFFFF; --good: #266D45; --good-soft: rgba(38,109,69,0.12);
  --warn: #A46200; --warn-soft: rgba(164,98,0,0.13); --bad: #B33A3A; --bad-soft: rgba(179,58,58,0.12);
  --border: rgba(39,28,21,0.10); --shadow: 0 2px 10px rgba(39,28,21,0.05);
  --radius-card: 24px; --radius-pill: 999px;
  --font: system-ui, -apple-system, 'Segoe UI', Roboto, Inter, sans-serif;
}
html[data-theme="dark"] {
  --bg: #171311; --surface: #221D1A; --surface-2: #2E2723; --card: #26201D;
  --ink: #F2E7DF; --muted: #B8A79A; --accent: #E8B88A; --accent-soft: rgba(232,184,138,0.16);
  --accent-ink: #2B1A0D; --good: #8AD6A7; --good-soft: rgba(138,214,167,0.15);
  --warn: #F0BE6F; --warn-soft: rgba(240,190,111,0.15); --bad: #F2A2A2; --bad-soft: rgba(242,162,162,0.15);
  --border: rgba(242,231,223,0.10); --shadow: 0 2px 14px rgba(0,0,0,0.28);
}
* { box-sizing: border-box; }
html, body { margin:0; padding:0; background:var(--bg); color:var(--ink); font-family:var(--font); font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased; transition:background .2s,color .2s; }
button, input, select, textarea { font-family:inherit; color:inherit; }
button { cursor:pointer; border:none; background:transparent; }
.topbar { position:sticky; top:0; z-index:40; background:var(--bg); border-bottom:1px solid var(--border); padding:10px 18px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
.brand { display:flex; align-items:center; gap:10px; }
.brand-dot { width:36px; height:36px; border-radius:14px; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; font-weight:800; font-size:15px; }
.brand-title { font-weight:750; font-size:16px; }
.brand-sub { font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.live-pill { display:inline-flex; align-items:center; gap:5px; padding:2px 9px; border-radius:999px; background:var(--good-soft); color:var(--good); font-weight:650; font-size:11px; }
.live-dot { width:7px; height:7px; border-radius:50%; background:currentColor; }
.top-actions { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.chip-btn { padding:7px 13px; border-radius:999px; background:var(--surface); border:1px solid var(--border); font-size:12.5px; font-weight:650; display:inline-flex; align-items:center; gap:6px; }
.chip-btn:hover { background:var(--surface-2); }
.chip-btn.accent { background:var(--accent); color:var(--accent-ink); border-color:transparent; }
.chip-btn.good { background:var(--good-soft); color:var(--good); border-color:transparent; }
.chip-btn.bad { background:var(--bad-soft); color:var(--bad); border-color:transparent; }
.chip-btn.warn { background:var(--warn-soft); color:var(--warn); border-color:transparent; }
.seg { display:inline-flex; background:var(--surface); padding:4px; border-radius:999px; border:1px solid var(--border); gap:2px; }
.seg button { padding:6px 12px; border-radius:999px; font-size:12.5px; font-weight:650; color:var(--muted); }
.seg button.active { background:var(--accent); color:var(--accent-ink); }
.card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius-card); padding:18px; box-shadow:var(--shadow); }
.card-soft { background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:12px 14px; }
.card-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
.card-title { font-size:16px; font-weight:750; margin:0; }
.card-sub { font-size:12px; color:var(--muted); }
.badge { display:inline-flex; align-items:center; justify-content:center; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:700; background:var(--surface-2); color:var(--ink); }
.badge.good { background:var(--good-soft); color:var(--good); }
.badge.warn { background:var(--warn-soft); color:var(--warn); }
.badge.bad { background:var(--bad-soft); color:var(--bad); }
.badge.accent { background:var(--accent-soft); color:var(--accent); }
.stack { display:flex; flex-direction:column; gap:10px; }
.row-item { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 14px; border-radius:18px; background:var(--surface); border:1px solid var(--border); flex-wrap:wrap; }
.row-main { min-width:0; flex:1; }
.row-title { font-weight:700; font-size:14px; }
.row-sub { font-size:12px; color:var(--muted); margin-top:2px; }
.pbar { height:7px; background:var(--surface-2); border-radius:99px; overflow:hidden; margin-top:6px; }
.pbar > div { height:100%; background:var(--accent); border-radius:99px; transition:width .25s; }
.pbar.good > div { background:var(--good); }
.field { display:flex; flex-direction:column; gap:5px; margin-bottom:10px; }
.field label { font-size:12px; font-weight:700; color:var(--muted); }
.field input, .field select, .field textarea { width:100%; padding:9px 12px; border-radius:14px; background:var(--surface); border:1px solid var(--border); font-size:14px; }
.grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.grid-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
@media (max-width:640px) { .grid-2, .grid-3 { grid-template-columns:1fr; } }
.btn-lg { width:100%; padding:12px 16px; border-radius:999px; font-size:14px; font-weight:750; display:inline-flex; align-items:center; justify-content:center; gap:8px; }
.btn-lg.primary { background:var(--accent); color:var(--accent-ink); }
.btn-lg.primary:disabled { opacity:0.45; cursor:not-allowed; }
.btn-lg.danger { background:var(--bad-soft); color:var(--bad); }
.btn-lg.soft { background:var(--surface-2); color:var(--ink); }
.tbl-wrap { overflow-x:auto; }
table { width:100%; border-collapse:collapse; font-size:13.5px; }
th, td { text-align:left; padding:9px 10px; border-bottom:1px solid var(--border); vertical-align:middle; }
th { font-size:11.5px; text-transform:uppercase; letter-spacing:0.03em; color:var(--muted); font-weight:700; }
tr:last-child td { border-bottom:none; }
.modal-bg { position:fixed; inset:0; background:rgba(0,0,0,0.48); z-index:80; display:none; align-items:center; justify-content:center; padding:16px; }
.modal-bg.open { display:flex; }
.modal-card { background:var(--card); border:1px solid var(--border); border-radius:28px; max-width:480px; width:100%; padding:20px; box-shadow:0 20px 50px rgba(0,0,0,0.3); max-height:86vh; overflow-y:auto; }
.toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:999px; font-size:13.5px; font-weight:650; opacity:0; pointer-events:none; z-index:90; transition:opacity .2s,transform .2s; box-shadow:0 8px 24px rgba(0,0,0,0.22); }
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

body { display:flex; flex-direction:column; min-height:100vh; }
.shell { max-width:460px; width:100%; margin:0 auto; flex:1; display:flex; flex-direction:column; padding:14px 14px 86px; gap:12px; }
.step-card { background:var(--card); border:1px solid var(--border); border-radius:26px; padding:18px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:12px; }
.step-counter { font-size:12px; font-weight:700; color:var(--accent); display:flex; justify-content:space-between; }
.step-title { font-size:19px; font-weight:800; margin:0; line-height:1.25; }
.step-inst { background:var(--surface); border-radius:16px; padding:12px; font-size:13px; color:var(--muted); white-space:pre-line; }
.photo-box { border:1.5px dashed var(--border); border-radius:18px; padding:14px; text-align:center; background:var(--surface); }
.photo-box.done { border-style:solid; border-color:var(--good); background:var(--good-soft); color:var(--good); }
.pin-dots { display:flex; justify-content:center; gap:12px; margin:8px 0 4px; }
.pin-dot { width:14px; height:14px; border-radius:50%; border:2px solid var(--accent); }
.pin-dot.filled { background:var(--accent); }
.pin-pad { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:6px; }
.pin-key { height:52px; border-radius:16px; background:var(--surface); border:1px solid var(--border); font-size:18px; font-weight:750; display:grid; place-items:center; }
.pin-key:hover { background:var(--surface-2); }
.bnav { position:fixed; bottom:0; left:0; right:0; background:var(--surface); border-top:1px solid var(--border); display:grid; grid-template-columns:repeat(4,1fr); max-width:460px; margin:0 auto; padding:8px 10px 10px; gap:4px; z-index:40; }
.bnav button { display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 4px; border-radius:16px; font-size:11px; font-weight:650; color:var(--muted); }
.bnav button .ico { padding:4px 14px; border-radius:999px; font-size:15px; }
.bnav button.active { color:var(--ink); }
.bnav button.active .ico { background:var(--accent-soft); color:var(--accent); }

/* === Coffee Illy v93.1 Responsive System (Phones · Tablets · Desktop) === */
html { -webkit-text-size-adjust: 100%; }
body { overflow-x: hidden; padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right); }
.kpi-val, .bar-val, td, .badge { font-variant-numeric: tabular-nums; }
.chip-btn, .admin-nav button, .date-pill, .btn-lg, .pin-key, .bnav button {
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  transition: background .16s ease, transform .1s ease, border-color .16s ease, box-shadow .16s ease;
}
.chip-btn:active, .btn-lg:active, .pin-key:active { transform: scale(0.98); }
.tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 14px; }
.tbl-wrap table { min-width: 520px; }

/* Terminal: Responsive Shell (Phone -> Tablet -> PC) */
.topbar {
  max-width: 100% !important;
  width: 100%;
  margin: 0 auto;
  padding: max(10px, env(safe-area-inset-top)) 16px 10px;
}
.shell {
  width: 100%;
  max-width: 520px;
  margin: 0 auto;
  padding: 14px 14px calc(88px + env(safe-area-inset-bottom));
}
.bnav {
  max-width: 520px;
  padding: 8px 10px max(10px, env(safe-area-inset-bottom));
}
#user-ctl { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

/* Phones (<= 600px) */
@media (max-width: 600px) {
  .topbar { padding: max(8px, env(safe-area-inset-top)) 12px 8px; gap: 8px; }
  .brand-dot { width: 34px; height: 34px; border-radius: 12px; font-size: 14px; }
  .brand-title { font-size: 15px; }
  .top-actions { width: 100%; justify-content: space-between; gap: 6px; }
  .chip-btn { min-height: 36px; padding: 6px 11px; font-size: 12px; }
  .shell { max-width: 100%; padding: 12px 12px calc(86px + env(safe-area-inset-bottom)); }
  .step-card, .card { border-radius: 22px; padding: 15px; }
  .step-title { font-size: 18px; }
  .field input, .field select, .field textarea { font-size: 16px; min-height: 44px; padding: 10px 12px; }
  .btn-lg { min-height: 48px; font-size: 14.5px; }
  .pin-key { height: 54px; font-size: 19px; }
  .bnav { max-width: 100%; left: 0; right: 0; border-radius: 0; }
  .bnav button { min-height: 48px; }
  .modal-bg { align-items: flex-end; padding: 0; }
  .modal-card {
    max-width: 100%;
    border-radius: 26px 26px 0 0;
    padding: 18px 16px calc(22px + env(safe-area-inset-bottom));
    max-height: 88vh;
  }
  .toast { bottom: calc(78px + env(safe-area-inset-bottom)); max-width: calc(100vw - 24px); text-align: center; }
}

/* Tablets (601px - 1024px) */
@media (min-width: 601px) and (max-width: 1024px) {
  .topbar { padding: 12px 24px; }
  .shell { max-width: 720px; padding: 20px 20px 104px; gap: 14px; }
  .step-card, .card { padding: 22px; }
  .step-title { font-size: 21px; }
  .pin-pad { max-width: 340px; margin: 10px auto 0; gap: 10px; }
  .pin-key { height: 56px; }
  .bnav {
    max-width: 540px;
    bottom: 14px;
    border: 1px solid var(--border);
    border-radius: 999px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
    padding: 6px 10px;
  }
}

/* Desktop / PC (>= 1025px) */
@media (min-width: 1025px) {
  .topbar { padding: 12px 32px; }
  .shell { max-width: 820px; padding: 24px 24px 112px; gap: 16px; }
  .step-card, .card { padding: 24px 26px; }
  .step-title { font-size: 22px; }
  .pin-pad { max-width: 340px; margin: 12px auto 0; gap: 10px; }
  .pin-key { height: 56px; }
  .bnav {
    max-width: 560px;
    bottom: 18px;
    border: 1px solid var(--border);
    border-radius: 999px;
    box-shadow: 0 12px 34px rgba(0, 0, 0, 0.22);
    padding: 6px 12px;
  }
  .bnav button { flex-direction: row; justify-content: center; gap: 6px; padding: 8px 12px; font-size: 13px; }
  .bnav button .ico { padding: 3px 8px; }
}

<script>

const LIVE_SNAPSHOT = {"location":"Кофейня №1","plan":2200,"minAvgCheck":35,"planChecks":75,"staff":[],"blocks":[],"tasks":[],"cash":[],"expenses":[],"checklists":[],"incidents":[],"plans":[],"goodDeeds":[],"ttk":[],"audits":[]};
const STORE_KEY = 'coffee_illy_v90_live_state';
const THEME_KEY = 'coffee_illy_v90_theme';
const TODAY = (window.CoffeeCloudV93 ? window.CoffeeCloudV93.localISO() : new Date().toISOString().slice(0,10));
const TIME_OPTIONS = ['06:00','06:30','07:00','07:30','08:00','08:30','09:00','09:30','10:00','10:23','10:30','10:34','11:00','11:30','12:00','12:30','13:00','14:00','15:00','16:00','17:00','18:00','18:30','19:00','20:00','21:00','21:30','22:00','22:30','23:00','23:30','23:59'];
const PLAN_OPTS = [1500,1800,2000,2200,2500,3000,3500,4000,5000];
const CHECKS_OPTS = [30,40,50,60,70,75,80,90,100,120];
const AVG_OPTS = [25,28,30,32,35,38,40,45,50];
const WO_OPTS = [5,10,15,20,25,30];
const SHIFT_HOURS = ['07:30–22:30','08:00–20:00','08:00–16:00','14:00–22:30','Выходной'];
const VOL_OPTS = ['60 мл (S)','150 мл (S)','200 мл (M)','250 мл (M)','350 мл (L)','400 мл (XL)'];
const CAT_OPTS = ['Классика','Авторские','Холодные','Чай и не-кофе','Выпечка'];
const EXP_CATS = ['Закупка продуктов','Зарплата','Аренда','Коммунальные','Реклама','Ремонт и оборудование','Прочее'];
const OWNERS = ['Администратор','Бариста','Техник','Управляющий'];
const EQUIP_ZONES = ['Кофемашина','Кофемолка','Холодильник','Термопот','Витрина','Зона гостя','Санузел','Касса / Терминал','Другое'];

function freshState() {
  const s = JSON.parse(JSON.stringify(LIVE_SNAPSHOT));
  s.rev = 1; s.woNorm = 15; s.initCounter = 600; s.photoAll = false; s.simTime = (window.CoffeeCloudV93 ? window.CoffeeCloudV93.localHHMM() : '13:25');
  s.adminPin = '1234'; s.extensions = {};
  s.staff = s.staff.map(st => Object.assign({}, st, {
    pin: '1234', pinIsDefault: true,
    tgId: st.name === 'Соня' ? 'TG-518294012' : (st.name === 'Алина' ? 'TG-604912338' : '')
  }));
  s.liveProgress = {}; s.staffPresence = {};
  s.auditLog = [{ time: '13:20', actor: 'Система', rev: 1, text: 'Инициализирован релиз v94.0 на реальных данных Coffee_illy.' }];
  return s;
}
function loadSharedState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) { const parsed = JSON.parse(raw); if (parsed && parsed.blocks) return parsed; }
  } catch(_) {}
  const s = freshState();
  try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch(_) {}
  return s;
}
const syncCh = (typeof BroadcastChannel !== 'undefined') ? new BroadcastChannel('coffee_illy_v90_sync') : null;
function saveSharedState(st, actor, desc) {
  st.rev = (Number(st.rev) || 0) + 1;
  if (desc) {
    st.auditLog = st.auditLog || [];
    st.auditLog.unshift({ time: st.simTime || '13:25', actor: actor || 'Система', rev: st.rev, text: desc });
    if (st.auditLog.length > 50) st.auditLog.pop();
  }
  try { localStorage.setItem(STORE_KEY, JSON.stringify(st)); } catch(_) {}
  if (syncCh) try { syncCh.postMessage({ type: 'state', rev: st.rev, ts: Date.now() }); } catch(_) {}
  if (window.CoffeeCloudV93 && desc) window.CoffeeCloudV93.dispatchStateChange(st, actor, desc);
}
function fmtRub(n) { return (Number(n) || 0).toLocaleString('ru-RU') + ' ₽'; }
function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function toMin(hhmm) { const m = String(hhmm || '00:00').match(/(\d{1,2}):(\d{2})/); return m ? Number(m[1])*60 + Number(m[2]) : 0; }
function optList(arr, sel, fn) {
  const v = arr.slice();
  if (sel != null && sel !== '' && !v.some(x => String(x) === String(sel))) v.unshift(sel);
  return v.map(x => `<option value="${esc(x)}" ${String(x)===String(sel)?'selected':''}>${esc(fn ? fn(x) : x)}</option>`).join('');
}
let _tTimer = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(_tTimer); _tTimer = setTimeout(() => el.classList.remove('show'), 2600);
}
function initTheme(btnId) {
  const mql = window.matchMedia('(prefers-color-scheme: dark)');
  let mode = 'auto';
  try { mode = localStorage.getItem(THEME_KEY) || 'auto'; } catch(_) {}
  function apply() {
    const eff = mode === 'auto' ? (mql.matches ? 'dark' : 'light') : mode;
    document.documentElement.setAttribute('data-theme', eff);
    const b = document.getElementById(btnId);
    if (b) b.textContent = mode === 'auto' ? '🌓 Авто' : (mode === 'light' ? '☀️ Светлая' : '🌙 Тёмная');
  }
  mql.addEventListener('change', () => { if (mode === 'auto') apply(); });
  window.addEventListener('storage', (e) => { if (e.key === THEME_KEY) { mode = e.newValue || 'auto'; apply(); } });
  const b = document.getElementById(btnId);
  if (b) b.onclick = () => {
    mode = mode === 'auto' ? 'light' : (mode === 'light' ? 'dark' : 'auto');
    try { localStorage.setItem(THEME_KEY, mode); } catch(_) {}
    apply();
  };
  apply();
}

(function() {

  const DRAFT_KEY = 'coffee_illy_v94_step_draft';
  function saveStepDraft() {
    try {
      const compact = {};
      Object.keys(stepPhotos || {}).forEach(k => {
        const v = stepPhotos[k];
        if (v && typeof v === 'object') compact[k] = { url: v.url || '', fileId: v.fileId || '', queued: !!v.queued, preview: v.url ? '' : (v.preview || '').slice(0, 120000) };

    if (tab === 'ttk') {
      const items = state.ttk.filter(k => !ttkQ || k.name.toLowerCase().includes(ttkQ.toLowerCase()));
      body.innerHTML = `<input id="tq" value="${esc(ttkQ)}" placeholder="Поиск по ТТК..." style="width:100%;padding:10px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--border);"><div class="stack">${items.map(k=>`<div class="card-soft"><div style="display:flex;justify-content:space-between;"><b>${esc(k.name)}</b><span class="badge accent">${k.price} ₽</span></div><div style="font-size:11.5px;color:var(--muted);margin:2px 0 5px;">${esc(k.vol)} · ${esc(k.cat)}</div><div style="font-size:12.5px;">${esc(k.recipe)}</div></div>`).join('')}</div>`;
      document.getElementById('tq').oninput = e => { ttkQ = e.target.value; render(); };
      return;
    }

    if (tab === 'issues') {
      body.innerHTML = `<button class="btn-lg primary" id="ni">+ Сообщить о поломке</button><div class="stack">${state.incidents.filter(i=>i.status!=='Решена').slice(0,6).map(i=>`<div class="card-soft"><b>${esc(i.step)}</b> <span class="badge ${i.priority==='Критично'?'bad':'warn'}">${esc(i.priority)}</span><div style="font-size:12px;color:var(--muted);margin-top:2px;">${i.date} · ${esc(i.text||'—')}</div></div>`).join('')}</div>`;
      document.getElementById('ni').onclick = () => {
        openModal('Новая поломка', `
          <div class="field"><label>Оборудование / зона</label><select id="nz">${optList(EQUIP_ZONES, EQUIP_ZONES[0])}</select></div>
          <div class="field"><label>Срочность</label><select id="np"><option>Критично</option><option>Терпит</option></select></div>
          <div class="field"><label>Описание</label><textarea id="nt" rows="3"></textarea></div>
          <div style="margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
            <button type="button" class="chip-btn accent" id="n-cam">📷 Снять фото</button>
            <span id="n-cam-st" style="font-size:12px;color:var(--muted);"></span>
          </div>
          <button class="btn-lg primary" id="ns">Отправить</button>
        `);
        let incPhotoUrl = '';
        document.getElementById('n-cam').onclick = () => {
          if (!window.CoffeeCameraV92) return;
          window.CoffeeCameraV92.open({
            title: 'Фото поломки',
            onCaptured: async (dataUri) => {
              const stEl = document.getElementById('n-cam-st');
              if (stEl) stEl.textContent = '☁ Загрузка…';
              if (window.CoffeeCloudV93) {
                const up = await window.CoffeeCloudV93.uploadPhotoToDrive({ dataUri, userName: authed || 'Бариста', block: 'Поломка', kind: 'incident' });
                incPhotoUrl = (up && up.url) || '';
                if (stEl) stEl.textContent = incPhotoUrl ? '✓ Фото прикреплено' : '✓ Снято';
              }
            }
          });
        };
        document.getElementById('ns').onclick = () => {
          const z = document.getElementById('nz').value;
          state.incidents.unshift({ id:'INC-'+Math.floor(100+Math.random()*899), date:TODAY, time:(window.CoffeeCloudV93?window.CoffeeCloudV93.localHHMM():'13:25'), step:z, text:document.getElementById('nt').value.trim()||'Неисправность', priority:document.getElementById('np').value, status:'Новая проблема', who:authed, owner:'Администратор', photoUrl: incPhotoUrl });
          saveSharedState(state, authed, 'Внеплановая поломка: ' + z); closeModal(); showToast('✓ Отправлено'); render();
        };
      };
    }
  }

  function onRemoteSync() {
    const next = loadSharedState();
    if (next.rev !== state.rev) {
      state = next;
      showToast('✓ Обновлено');
      render();
    }
  }
  if (syncCh) syncCh.onmessage = onRemoteSync;
  window.addEventListener('storage', (e) => { if (e.key === STORE_KEY) onRemoteSync(); });
  document.querySelectorAll('#bnav button').forEach(b => b.onclick = () => { tab = b.dataset.t; render(); });
  render();

  setInterval(() => { const _c = document.getElementById('hdr-clock'); if (_c && window.CoffeeCloudV93) _c.textContent = window.CoffeeCloudV93.localHHMM(); }, 15000);
  setInterval(() => { render(); }, 30000);
  window.addEventListener('online', () => { showToast('🌐 Связь восстановлена — синхронизация...'); render(); });
  window.addEventListener('offline', () => { showToast('⚡ Нет сети — данные сохраняются локально'); render(); });
  runAutoLogin();
  if (window.CoffeeCloudV94) {
    window.CoffeeCloudV93.startCloudLoop({
      mode: 'terminal',
      getState: () => state,
      onSynced: (st, srvRev) => {
        try { localStorage.setItem(STORE_KEY, JSON.stringify(st)); } catch(_) {}
        if (!authed) runAutoLogin();
        else applyDeepLinkIfNeeded();
        render();
      }
    });
  }
})();
</script>
</body>
</html>
