<style>

:root {
  --bg: #FCF8F4; --surface: #F4ECE4; --surface-2: #EAE0D5; --card: #FFFFFF;
  --ink: #271C15; --muted: #6E5D51; --accent: #7D4E24; --accent-soft: rgba(125,78,36,0.12);
  --accent-ink: #FFFFFF; --good: #266D45; --good-soft: rgba(38,109,69,0.12);
  --warn: #A46200; --warn-soft: rgba(164,98,0,0.13); --bad: #B33A3A; --bad-soft: rgba(179,58,58,0.12);
  --border: rgba(39,28,21,0.10); --shadow: 0 2px 10px rgba(39,28,21,0.05);
  --radius-card: 24px; --radius-pill: 999px;
  --font: system-ui, -apple-system, 'Segoe UI', Roboto, Inter, sans-serif;
}
html[data-theme="dark"] {
  --bg: #171311; --surface: #221D1A; --surface-2: #2E2723; --card: #26201D;
  --ink: #F2E7DF; --muted: #B8A79A; --accent: #E8B88A; --accent-soft: rgba(232,184,138,0.16);
  --accent-ink: #2B1A0D; --good: #8AD6A7; --good-soft: rgba(138,214,167,0.15);
  --warn: #F0BE6F; --warn-soft: rgba(240,190,111,0.15); --bad: #F2A2A2; --bad-soft: rgba(242,162,162,0.15);
  --border: rgba(242,231,223,0.10); --shadow: 0 2px 14px rgba(0,0,0,0.28);
}
* { box-sizing: border-box; }
html, body { margin:0; padding:0; background:var(--bg); color:var(--ink); font-family:var(--font); font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased; transition:background .2s,color .2s; }
button, input, select, textarea { font-family:inherit; color:inherit; }
button { cursor:pointer; border:none; background:transparent; }
.topbar { position:sticky; top:0; z-index:40; background:var(--bg); border-bottom:1px solid var(--border); padding:10px 18px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
.brand { display:flex; align-items:center; gap:10px; }
.brand-dot { width:36px; height:36px; border-radius:14px; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; font-weight:800; font-size:15px; }
.brand-title { font-weight:750; font-size:16px; }
.brand-sub { font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.live-pill { display:inline-flex; align-items:center; gap:5px; padding:2px 9px; border-radius:999px; background:var(--good-soft); color:var(--good); font-weight:650; font-size:11px; }
.live-dot { width:7px; height:7px; border-radius:50%; background:currentColor; }
.top-actions { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.chip-btn { padding:7px 13px; border-radius:999px; background:var(--surface); border:1px solid var(--border); font-size:12.5px; font-weight:650; display:inline-flex; align-items:center; gap:6px; }
.chip-btn:hover { background:var(--surface-2); }
.chip-btn.accent { background:var(--accent); color:var(--accent-ink); border-color:transparent; }
.chip-btn.good { background:var(--good-soft); color:var(--good); border-color:transparent; }
.chip-btn.bad { background:var(--bad-soft); color:var(--bad); border-color:transparent; }
.chip-btn.warn { background:var(--warn-soft); color:var(--warn); border-color:transparent; }
.seg { display:inline-flex; background:var(--surface); padding:4px; border-radius:999px; border:1px solid var(--border); gap:2px; }
.seg button { padding:6px 12px; border-radius:999px; font-size:12.5px; font-weight:650; color:var(--muted); }
.seg button.active { background:var(--accent); color:var(--accent-ink); }
.card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius-card); padding:18px; box-shadow:var(--shadow); }
.card-soft { background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:12px 14px; }
.card-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
.card-title { font-size:16px; font-weight:750; margin:0; }
.card-sub { font-size:12px; color:var(--muted); }
.badge { display:inline-flex; align-items:center; justify-content:center; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:700; background:var(--surface-2); color:var(--ink); }
.badge.good { background:var(--good-soft); color:var(--good); }
.badge.warn { background:var(--warn-soft); color:var(--warn); }
.badge.bad { background:var(--bad-soft); color:var(--bad); }
.badge.accent { background:var(--accent-soft); color:var(--accent); }
.stack { display:flex; flex-direction:column; gap:10px; }
.row-item { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 14px; border-radius:18px; background:var(--surface); border:1px solid var(--border); flex-wrap:wrap; }
.row-main { min-width:0; flex:1; }
.row-title { font-weight:700; font-size:14px; }
.row-sub { font-size:12px; color:var(--muted); margin-top:2px; }
.pbar { height:7px; background:var(--surface-2); border-radius:99px; overflow:hidden; margin-top:6px; }
.pbar > div { height:100%; background:var(--accent); border-radius:99px; transition:width .25s; }
.pbar.good > div { background:var(--good); }
.field { display:flex; flex-direction:column; gap:5px; margin-bottom:10px; }
.field label { font-size:12px; font-weight:700; color:var(--muted); }
.field input, .field select, .field textarea { width:100%; padding:9px 12px; border-radius:14px; background:var(--surface); border:1px solid var(--border); font-size:14px; }
.grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.grid-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
@media (max-width:640px) { .grid-2, .grid-3 { grid-template-columns:1fr; } }
.btn-lg { width:100%; padding:12px 16px; border-radius:999px; font-size:14px; font-weight:750; display:inline-flex; align-items:center; justify-content:center; gap:8px; }
.btn-lg.primary { background:var(--accent); color:var(--accent-ink); }
.btn-lg.primary:disabled { opacity:0.45; cursor:not-allowed; }
.btn-lg.danger { background:var(--bad-soft); color:var(--bad); }
.btn-lg.soft { background:var(--surface-2); color:var(--ink); }
.tbl-wrap { overflow-x:auto; }
table { width:100%; border-collapse:collapse; font-size:13.5px; }
th, td { text-align:left; padding:9px 10px; border-bottom:1px solid var(--border); vertical-align:middle; }
th { font-size:11.5px; text-transform:uppercase; letter-spacing:0.03em; color:var(--muted); font-weight:700; }
tr:last-child td { border-bottom:none; }
.modal-bg { position:fixed; inset:0; background:rgba(0,0,0,0.48); z-index:80; display:none; align-items:center; justify-content:center; padding:16px; }
.modal-bg.open { display:flex; }
.modal-card { background:var(--card); border:1px solid var(--border); border-radius:28px; max-width:480px; width:100%; padding:20px; box-shadow:0 20px 50px rgba(0,0,0,0.3); max-height:86vh; overflow-y:auto; }
.toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:999px; font-size:13.5px; font-weight:650; opacity:0; pointer-events:none; z-index:90; transition:opacity .2s,transform .2s; box-shadow:0 8px 24px rgba(0,0,0,0.22); }
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

body { display:flex; flex-direction:column; min-height:100vh; }
.shell { max-width:460px; width:100%; margin:0 auto; flex:1; display:flex; flex-direction:column; padding:14px 14px 86px; gap:12px; }
.step-card { background:var(--card); border:1px solid var(--border); border-radius:26px; padding:18px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:12px; }
.step-counter { font-size:12px; font-weight:700; color:var(--accent); display:flex; justify-content:space-between; }
.step-title { font-size:19px; font-weight:800; margin:0; line-height:1.25; }
.step-inst { background:var(--surface); border-radius:16px; padding:12px; font-size:13px; color:var(--muted); white-space:pre-line; }
.photo-box { border:1.5px dashed var(--border); border-radius:18px; padding:14px; text-align:center; background:var(--surface); }
.photo-box.done { border-style:solid; border-color:var(--good); background:var(--good-soft); color:var(--good); }
.pin-dots { display:flex; justify-content:center; gap:12px; margin:8px 0 4px; }
.pin-dot { width:14px; height:14px; border-radius:50%; border:2px solid var(--accent); }
.pin-dot.filled { background:var(--accent); }
.pin-pad { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:6px; }
.pin-key { height:52px; border-radius:16px; background:var(--surface); border:1px solid var(--border); font-size:18px; font-weight:750; display:grid; place-items:center; }
.pin-key:hover { background:var(--surface-2); }
.bnav { position:fixed; bottom:0; left:0; right:0; background:var(--surface); border-top:1px solid var(--border); display:grid; grid-template-columns:repeat(4,1fr); max-width:460px; margin:0 auto; padding:8px 10px 10px; gap:4px; z-index:40; }
.bnav button { display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 4px; border-radius:16px; font-size:11px; font-weight:650; color:var(--muted); }
.bnav button .ico { padding:4px 14px; border-radius:999px; font-size:15px; }
.bnav button.active { color:var(--ink); }
.bnav button.active .ico { background:var(--accent-soft); color:var(--accent); }
</style>

const LIVE_SNAPSHOT = {"location": "Кофейня №1", "plan": 2200, "minAvgCheck": 35, "planChecks": 75, "staff": [{"id": "st1", "name": "Соня", "role": "Бариста", "shop": "Кофейня №1", "active": true}, {"id": "st2", "name": "Алина", "role": "Бариста", "shop": "Кофейня №1", "active": true}, {"id": "st3", "name": "Настя", "role": "Бариста", "shop": "Кофейня №1", "active": true}, {"id": "st_mwe6cp12", "name": "Макс", "role": "Администратор", "shop": "Кофейня №1", "active": true}, {"id": "st_mwnboii9", "name": "Лаура", "role": "Бариста", "shop": "Кофейня №1", "active": true}], "blocks": [{"id": "blk_open", "name": "Открытие", "openTime": "06:00", "deadline": "10:34", "isCash": false, "active": true}, {"id": "blk_lc1", "name": "Лайн Чек 1", "openTime": "06:00", "deadline": "10:34", "isCash": false, "active": true}, {"id": "blk_lc2", "name": "Лайн Чек 2", "openTime": "06:00", "deadline": "10:23", "isCash": false, "active": true}, {"id": "blk_close", "name": "Закрытие", "openTime": "21:30", "deadline": "22:30", "isCash": false, "active": true}, {"id": "blk_mwnb34lr", "name": "Лайн Чек Демо", "openTime": "07:00", "deadline": "23:59", "isCash": false, "active": true}, {"id": "blk_cash", "name": "Касса", "openTime": "22:00", "deadline": "23:59", "isCash": true, "active": true}, {"id": "blk_good_deeds", "name": "Карта добрых дел", "openTime": "11:00", "deadline": "22:00", "isCash": false, "active": true}], "tasks": [{"id": "o01", "block": "Открытие", "group": "Открытие · Стандарт (o01–o08)", "title": "📸 Фото-селфи", "instruction": "Фото перед началом смены.\n• Волосы аккуратно убраны в хвост или пучок.\n• Опрятный внешний вид, чистая рабочая форма и фартук.\n• Минимальный аккуратный макияж, отсутствие лишних украшений на руках.\n• Сделать селфи при хорошем освещении за баром.", "photo": true, "owner": "Администратор"}, {"id": "o02", "block": "Открытие", "group": "Открытие · Стандарт (o01–o08)", "title": "🪑 Зал и посадочные места", "instruction": "Подготовка гостевого зала к открытию:\n• Столы насухо протёрты от пыли и крошек дезинфицирующим средством.\n• Диваны и кресла устойчивы, обивка без пятен и мусора.\n• Декор на столах и полках выровнен по центру, свечи установлены.\n• Сделать обзорное фото чистого зала.", "photo": true, "owner": "Администратор"}, {"id": "o03", "block": "Открытие", "group": "Открытие · Стандарт (o01–o08)", "title": "☕ Кофемашина", "instruction": "Подготовка кофемашины к смене:\n• Кофемашина включена, бойлер вышел на рабочее давление и температуру.\n• Холдеры (портафильтры) чистые и прогретые, старый жмых полностью отсутствует.\n• Группы пролиты горячей водой и прогреты.\n• Хромированные детали и корпус натёрты микрофиброй до блеска, подтёки и накипь отсутствуют.", "photo": true, "owner": "Техник"}, {"id": "o04", "block": "Открытие", "group": "Открытие · Стандарт (o01–o08)", "title": "⚙️ Гриндеры и Проверка помола", "instruction": "Настройка кофемолок (гриндеров) и эспрессо:\n• Гриндеры включены, бункеры заполнены свежим зерном.\n• Проверен и настроен помол: контрольный пролив эспрессо по весам и таймеру (проверка граммовки, времени экстракции и вкуса).\n• Зона вокруг дозатора и стол под гриндером очищены, остатки молотого кофе отсутствуют.\n• Зафиксировать утренние показания счётчика кофемашины.", "photo": true, "owner": "Шеф-бариста"}, {"id": "o05", "block": "Открытие", "group": "Открытие · Стандарт (o01–o08)", "title": "🔥 Термопот", "instruction": "Проверка водонагревателя (термопота):\n• Включён в сеть, заполнен очищенной питьевой водой до отметки максимума.\n• Температура воды вышла на рабочий режим (92–95 °C).\n• Корпус и каплесборник чистые, без подтёков и накипи.", "photo": false, "owner": "Техник"}, {"id": "o06", "block": "Открытие", "group": "Открытие · Стандарт (o01–o08)", "title": "💡 Оборудование и подсветка", "instruction": "Включение света, звука и медиа:\n• Проектор, аудиоколонки (фоновая музыка на комфортной громкости) и декоративная подсветка включены.\n• Световая инсталляция и освещение у зеркала работают без мерцаний.", "photo": false, "owner": "Техник"}, {"id": "o07", "block": "Открытие", "group": "Открытие · Стандарт (o01–o08)", "title": "🌿 Летняя терраса Фото", "instruction": "Подготовка уличной зоны / летней террасы:\n• Уличные столы и стулья аккуратно расставлены по местам и насухо протёрты.\n• Пледы чистые, без пятен, аккуратно сложены.\n• Прилегающая территория и входная группа чистые, без мусора и листьев.\n• Сделать контрольное фото летней террасы.", "photo": true, "owner": "Администратор"}, {"id": "o08", "block": "Открытие", "group": "Открытие · Стандарт (o01–o08)", "title": "🧼 Санузел для гостей 📸 2", "instruction": "Важно !!! Полная утренняя проверка гостевого санузла (сделать 2 фото):\n• 🪞 Зеркало: протёрто средством для стёкол без разводов и следов пальцев, поверхность блестящая.\n• 🧻 Расходники: жидкое мыло в дозаторе в наличии, туалетная бумага и бумажные полотенца пополнены.\n• 🚽 Унитаз и бачок: чистые, обработаны, кнопка слива работает исправно, протечек нет, посторонний запах отсутствует.\n• 🗑 Мусорное ведро 📸: пустое, чистое, заправлен новый мусорный пакет.", "photo": true, "owner": "Администратор"}, {"id": "d01", "block": "Лайн Чек 1", "group": "День · Обход смены (d01–d06)", "title": "🌬️ Помещение проветрено и свежесть воздуха", "instruction": "Контроль микроклимата в зале:\n• Помещение проветрено, работает вентиляция или кондиционер по сезону.\n• Нет затхлого запаха, запаха гари или кухни, воздух в зале свежий и комфортный для гостей.", "photo": false, "owner": "Администратор"}, {"id": "d02", "block": "Лайн Чек 1", "group": "День · Обход смены (d01–d06)", "title": "☕ Оборудование проверено", "instruction": "Контроль работы барного оборудования в течение смены:\n• Кофемашина, кофемолка, чайник/термопот, холодильник и десертная витрина включены.\n• Все приборы держат рабочую температуру и работают штатно без аварийных сигналов и посторонних шумов.", "photo": false, "owner": "Техник"}, {"id": "d03", "block": "Лайн Чек 1", "group": "", "title": "🥛 Заготовки для напитков и молочные продукты", "instruction": "Молоко ≥5л, альтернативное молоко ≥2л, сливки ≥2 упаковок, сиропы и топпинги на своих местах, лёд готовы\n \n 📸 Фото холодильника в \"подсобке\"\n 📸 фото холодильника за стойкой", "photo": true, "owner": "Администратор"}, {"id": "d04", "block": "Лайн Чек 1", "group": "День · Обход смены (d01–d06)", "title": "🍰 Десерты и закуски", "instruction": "Контроль витрины с десертами:\n• Закуски и десерты пополнены и представлены в ДОСТАТОЧНОМ количестве.\n• Срок годности и маркировки актуальны, заветренных позиций нет.\n• Витрина чистая внутри и снаружи, фронтальное стекло без разводов и отпечатков.\n• Десерты и ценники выложены ровно и аккуратно 📸 (сделать фото витрины).", "photo": true, "owner": "Закупщик"}, {"id": "d05", "block": "Лайн Чек 1", "group": "День · Обход смены (d01–d06)", "title": "🧼 Зона гостя и стойка на виду", "instruction": "Поддержание чистоты зоны выдачи и гостевой стойки:\n• Стойка и прилавок со стороны гостя идеально чистые: нет крошек, капель кофе, пятен и липких следов.\n• Грязная посуда со столов и стойки своевременно убрана в мойку.\n• Диспенсер с салфетками, крышками, трубочками и сахаром пополнен.", "photo": true, "owner": "Администратор"}, {"id": "d06", "block": "Лайн Чек 1", "group": "День · Обход смены (d01–d06)", "title": "🚽 Санузел проверен (2-3 сек видео) 📹", "instruction": "Дневная проверка санузла для гостей:\n• Санузел чистый, пол сухой, раковина и зеркало без брызг воды.\n• Туалетная бумага, мыло и бумажные полотенца в наличии.\n• Мусорное ведро не переполнено, запах свежий.\n• 📹 Сделать короткий обзорный видео-отчёт (2–3 секунды).", "photo": true, "owner": "Администратор"}, {"id": "c01", "block": "Закрытие", "group": "Закрытие · Стандарт (c01–c14)", "title": "🧴 Диспенсер с расходниками заполнен", "instruction": "Подготовка органайзера и расходников на утро:\n• Диспенсер полностью заполнен салфетками, порционным сахаром, трубочками и размешивателями (палочками).\n• Все открытые складские упаковки с расходниками плотно закрыты от пыли и влаги.", "photo": true, "owner": "Закупщик"}, {"id": "c02", "block": "Закрытие", "group": "Закрытие · Стандарт (c01–c14)", "title": "🪑 Зал и посадочные места", "instruction": "Уборка гостевого зала перед закрытием:\n• Все столы тщательно протёрты от крошек и пятен.\n• Диваны и стулья устойчивы, очищены щёткой/пылесосом от крошек.\n• Декор выровнен, пыль на полках и подоконниках отсутствует.\n• Все свечи в зале обязательно погашены.", "photo": true, "owner": "Администратор"}, {"id": "c03", "block": "Закрытие", "group": "Закрытие · Стандарт (c01–c14)", "title": "☕ Кофемашина", "instruction": "Замывка и выключение кофемашины:\n• Проведена промывка групп со слепым фильтром и профессиональным средством (Cafiza), затем промывка чистой водой.\n• Холдеры и сита вымыты, кофейный жмых и масла полностью удалены, съёмные детали и решётка поддона промыты и установлены на место.\n• Стимеры (паровые трубки) очищены от молока и продуты.\n• Подтёков воды и накипи нет, хромированные детали натёрты насухо. Кофемашина выключена.", "photo": true, "owner": "Техник"}, {"id": "c04", "block": "Закрытие", "group": "Закрытие · Стандарт (c01–c14)", "title": "⚙️ Гриндеры", "instruction": "Очистка кофемолок и фиксация счётчиков:\n• Гриндеры протёрты снаружи и в зоне выдачи, остатки молотого кофе сметены кистью, устройства выключены.\n• Показания счётчиков порций кофемашины/гриндеров сняты и внесены в кассовый отчёт смены.", "photo": true, "owner": "Шеф-бариста"}, {"id": "c05", "block": "Закрытие", "group": "Закрытие · Стандарт (c01–c14)", "title": "🧽 Рабочая зона", "instruction": "Замывка барной станции:\n• Рабочая столешница и фартук вымыты с моющим средством и протёрты насухо.\n• Липких пятен от сиропов, молока и кофе нет.\n• Весь мелкий инвентарь (питчеры, темпер, коврик, весы) чистый и расставлен по местам.", "photo": true, "owner": "Администратор"}, {"id": "c06", "block": "Закрытие", "group": "Закрытие · Стандарт (c01–c14)", "title": "🔥 Термопот", "instruction": "Отключение термопота:\n• Заполнен очищенной водой для утренней смены.\n• Питание выключено, корпус и каплесборник протёрты насухо, без подтёков.", "photo": false, "owner": "Техник"}, {"id": "c07", "block": "Закрытие", "group": "Закрытие · Стандарт (c01–c14)", "title": "💰 Касса и терминалы Фото", "instruction": "Закрытие кассовой смены:\n• Наличные в кассе пересчитаны и сверены с отчётом.\n• Разменная сумма на утро оставлена в кассе в полном объёме (250 руб мелкими купюрами).\n• Фотоотчёт кассы сделан после подсчёта.\n• Банковский терминал и чековый принтер выключены, рабочий телефон поставлен на зарядку.", "photo": true, "owner": "Администратор"}, {"id": "c08", "block": "Закрытие", "group": "Закрытие · Стандарт (c01–c14)", "title": "🍰 Холодильник и витрина", "instruction": "Уход за витриной и хранением десертов:\n• Подсветка витрины выключена (холодильный контур работает по регламенту), стёкла и полки протёрты.\n• Отпечатков пальцев и разводов на стекле нет.\n• Все десерты проверены по срокам, закрыты крышками/плёнкой от заветривания.", "photo": true, "owner": "Закупщик"}, {"id": "c09", "block": "Закрытие", "group": "Закрытие · Стандарт (c01–c14)", "title": "🪞 Зеркала и остекление", "instruction": "Натирка зеркал и входного остекления:\n• Зеркала в зале и стеклянные поверхности входной группы протёрты со средством для стёкол.\n• Разводов, брызг и следов пальцев нет, поверхности сухие.", "photo": false, "owner": "Администратор"}, {"id": "c10", "block": "Закрытие", "group": "Закрытие · Стандарт (c01–c14)", "title": "💡 Оборудование и подсветка", "instruction": "Отключение иллюминации и медиа:\n• Проектор, неоновая/декоративная подсветка, аудиоколонки и дополнительное освещение выключены.\n• Световая инсталляция у зеркал и подсветка стола — выключены.", "photo": false, "owner": "Техник"}, {"id": "c11", "block": "Закрытие", "group": "Закрытие · Стандарт (c01–c14)", "title": "🌿 Летняя терраса", "instruction": "Уборка летней террасы на ночь:\n• Уличные столы и стулья протёрты и занесены внутрь помещения (или зафиксированы по регламенту).\n• Пледы проверены (чистые, без пятен и прожогов) и аккуратно сложены на хранение.", "photo": true, "owner": "Администратор"}, {"id": "c12", "block": "Закрытие", "group": "Закрытие · Стандарт (c01–c14)", "title": "🧼 Санузел для гостей", "instruction": "Полная вечерняя уборка санузла по чек-листу:\n• 🚻 Входная дверь — проверена исправность замка и доводчика; полотно двери и ручка протёрты, без следов рук.\n• 🧴 Раковина и смеситель — вымыты и вытерты насухо; смеситель натёрт без налёта и подтёков, вода не капает.\n• 🪞 Зеркало — протёрто без разводов и следов пальцев, поверхность блестящая.\n• 🧻 Расходники — проверен и пополнен запас жидкого мыла, туалетной бумаги и бумажных полотенец на утро.\n• 🚽 Унитаз и бачок — обработаны дезсредством, крышка опущена, бачок не протекает, запах отсутствует.\n• 🧹 Пол и стены — пол вымыт с дезсредством и высушен, плитка без пятен и налёта.\n• 🗑 Мусорное ведро — освобождено, вымыто, установлен новый пакет.\n• 💡 Освещение и вентиляция — свет и вытяжка выключены, проверена исправность выключателя.", "photo": true, "owner": "Администратор"}, {"id": "c13", "block": "Закрытие", "group": "Закрытие · Стандарт (c01–c14)", "title": "🚪 Закрытие помещения", "instruction": "Финальная проверка перед выходом:\n• Все декоративные подсветки, сплит-система и барное оборудование (кроме холодильников) выключены.\n• Жалюзи / роллеты опущены, окна закрыты.", "photo": false, "owner": "Администратор"}, {"id": "c14", "block": "Закрытие", "group": "Закрытие · Стандарт (c01–c14)", "title": "🗑 Мусор выброшен, баки на улице пустые 📸💬", "instruction": "Вынос всего мусора из кофейни и уличных урн:\n• Все мусорные пакеты из-под бара, подсобки и санузла завязаны и вынесены в контейнер.\n• Уличные баки у входа очищены, внутрь вставлены чистые пакеты.\n• 📸 Сделать фото пустых баков и закрытой входной двери.", "photo": true, "owner": "Администратор"}, {"id": "pa01", "block": "Открытие", "group": "Открытие · Приёмка смены (pa01–pa21)", "title": "📸 Фото-селфи 📸", "instruction": "Фото перед началом смены.\nВолосы убраны в хвост, аккуратный внешний вид, чистая форма, минимальный макияж.", "photo": true, "owner": "Администратор"}, {"id": "pa02", "block": "Открытие", "group": "Открытие · Приёмка смены (pa01–pa21)", "title": "🌿 Летняя терраса Фото📸", "instruction": "Столы и стулья расставлены, протёрты. Пледы чистые, сложены аккуратно, территория без мусора. Сделать фото.", "photo": true, "owner": "Администратор"}, {"id": "pa03", "block": "Открытие", "group": "Открытие · Приёмка смены (pa01–pa21)", "title": "🪑 Зал и посадочные места", "instruction": "Столы чистые, без крошек и пятен, диваны устойчивые, декор выровнен, пыль отсутствует, посадка полностью готова к приёму гостей.", "photo": false, "owner": "Администратор"}, {"id": "pa04", "block": "Открытие", "group": "Открытие · Приёмка смены (pa01–pa21)", "title": "☕ Кофемашина + ☝️холдеры", "instruction": "Кофемашина включена и прогрета.\nСъёмные детали и чистые холдеры на месте.\nПодтёков воды и накипи нет, хромированные детали натёрты до блеска.", "photo": true, "owner": "Техник"}, {"id": "pa05", "block": "Открытие", "group": "Открытие · Приёмка смены (pa01–pa21)", "title": "⚙️ Гриндеры", "instruction": "Гриндеры протёрты, старые остатки кофе отсутствуют, помол проверен.\nУтренние показания счётчиков сверены и внесены в отчёт.", "photo": false, "owner": "Шеф-бариста"}, {"id": "pa06", "block": "Открытие", "group": "Открытие · Приёмка смены (pa01–pa21)", "title": "🧽 Рабочая зона и Мойка за стойкой", "instruction": "Рабочая поверхность вымыта и протёрта насухо, пятен от сиропов и кофе нет, порядок соблюдён.\nМойка за стойкой чистая, грязная посуда отсутствует.", "photo": false, "owner": "Администратор"}, {"id": "pa07", "block": "Открытие", "group": "Открытие · Приёмка смены (pa01–pa21)", "title": "🔥 Термопот", "instruction": "Заполнен очищенной водой, включён на прогрев, корпус сухой ": "Администратор"}, {"id": "u03", "block": "Закрытие", "group": "Закрытие · Уборка помещения (u01–u07)", "title": "🚪 Входная дверь натёрта, без следов и пятен", "instruction": "Чистка входной двери:\n• Стекло входной двери с обеих сторон натёрто средством для стёкол без разводов и отпечатков рук.\n• Дверная ручка, профиль и порог протёрты влажной, затем сухой салфеткой.", "photo": false, "owner": "Администратор"}, {"id": "u04", "block": "Закрытие", "group": "Закрытие · Уборка помещения (u01–u07)", "title": "🪟 Зеркала и Стёкла натёрты, без разводов и загрязнений 📸", "instruction": "Мойка зеркал и витринных стёкол:\n• Все зеркала в зале, у фотозоны и в санузле натёрты микрофиброй со средством для стёкол.\n• Подтёков, разводов и следов пальцев нет.\n• 📸 Сделать контрольное фото.", "photo": true, "owner": "Администратор"}, {"id": "u05", "block": "Закрытие", "group": "Закрытие · Уборка помещения (u01–u07)", "title": "🛋️ Диваны отодвинуты, выполнена влажная уборка полов под диванами 📸", "instruction": "Важно!!! ☝️ ☝️ ☝️\n• Аккуратно отодвинуть диваны от стен, подмести крошки и пыль, тщательно вымыть пол и плинтусы под диванами, затем ровно вернуть диваны на место.\n• Регулярно менять грязную воду в ведре на чистую.\n• Выливать грязную воду ТОЛЬКО на улице в отведённое место (категорически запрещено выливать в мойку в подсобке — слив забивается песком!).\n• 📸 Сделать фото чистого пола под диванами.", "photo": true, "owner": "Администратор"}, {"id": "u06", "block": "Закрытие", "group": "Закрытие · Уборка помещения (u01–u07)", "title": "🧹 Влажная уборка полов в зале", "instruction": "Финальная мойка полов:\n• Пол во всём гостевом зале, за барной стойкой и в проходах подметён и тщательно вымыт с моющим средством.\n• Углы и плинтусы чистые, без разводов и липких следов.\n• Грязная вода после уборки вылита на улице, моп/тряпка промыты и поставлены на просушку.", "photo": true, "owner": "Администратор"}, {"id": "u07", "block": "Закрытие", "group": "Закрытие · Уборка помещения (u01–u07)", "title": "🚽 Туалет вымыт и продезинфицирован 📸 (видео 5-7 сек)", "instruction": "Финальная дезинфекция санузла:\n• Унитаз, раковина, смеситель, дверные ручки и пол вымыты и обработаны дезинфицирующим средством.\n• Мусор выброшен, вставлен чистый пакет, расходники пополнены на утро.\n• 📹 Снять обзорное видео чистого санузла (5–7 секунд).", "photo": true, "owner": "Администратор"}, {"id": "q01", "block": "Лайн Чек 2", "group": "День · Чистка До/После (q01–q09)", "title": "☕ Кофемашина (фото до и после)", "instruction": "• Корпус протёрт, без пятен, подтёков и кофейных следов.\n• Группы промыты, остатки кофе отсутствуют.\n• Портафильтры вымыты, без кофейных масел и налёта.\n• Паровые трубки очищены и продуты.\n• Поддон и решётка вымыты, без остатков воды и кофе.\n• Поверхности вокруг чистые, без кофейной гущи.\n• 📸 Сделать фото ДО и ПОСЛЕ чистки.", "photo": true, "owner": "Техник"}, {"id": "q02", "block": "Лайн Чек 2", "group": "День · Чистка До/После (q01–q09)", "title": "🌪 Блендер (фото до и после)", "instruction": "• Чаша блендера вымыта, без остатков продуктов, налёта и запахов.\n• Ножи чистые, промыты со всех сторон.\n• Крышка и уплотнитель вымыты, без загрязнений в пазах.\n• Корпус и панель кнопок протёрты насухо, без капель и липкости.\n• 📸 Сделать фото ДО и ПОСЛЕ чистки.", "photo": true, "owner": "Техник"}, {"id": "q03", "block": "Лайн Чек 2", "group": "День · Чистка До/После (q01–q09)", "title": "❄️ Холодильник под стойкой (фото до и после)", "instruction": "• Полки и стенки чистые, без крошек, пятен молока и подтёков.\n• Продукты и молоко размещены аккуратно по срокам годности.\n• Посторонние запахи отсутствуют.\n• Резиновые уплотнители дверцы вымыты в складках.\n• Дверца закрывается плотно.\n• 📸 Сделать фото ДО и ПОСЛЕ чистки.", "photo": true, "owner": "Закупщик"}, {"id": "q04", "block": "Лайн Чек 2", "group": "День · Чистка До/После (q01–q09)", "title": "📦 Холодильник склад (фото до и после)", "instruction": "• Полки чистые, без загрязнений и подтёков.\n• Продукты разложены строго по категориям и промаркированы.\n• Посторонние запахи отсутствуют.\n• Уплотнители чистые, дверца закрывается плотно.\n• 📸 Сделать фото ДО и ПОСЛЕ чистки.", "photo": true, "owner": "Закупщик"}, {"id": "q05", "block": "Лайн Чек 2", "group": "День · Чистка До/После (q01–q09)", "title": "🧊 Морозилка верхняя (фото до и после)", "instruction": "• Внутренняя камера очищена, без снежной наледи, крошек и загрязнений.\n• Замороженные заготовки и продукты упакованы, подписаны и размещены аккуратно.\n• Уплотнитель чистый, дверца закрывается плотно.\n• 📸 Сделать фото ДО и ПОСЛЕ чистки.", "photo": true, "owner": "Закупщик"}, {"id": "q06", "block": "Лайн Чек 2", "group": "День · Чистка До/После (q01–q09)", "title": "🧊 Морозилка нижняя (фото до и после)", "instruction": "• Внутри чисто, ящики/полки вымыты без крошек и остатков продуктов.\n• Продукты расфасованы и размещены аккуратно.\n• Посторонние запахи отсутствуют.\n• 📸 Сделать фото ДО и ПОСЛЕ чистки.", "photo": true, "owner": "Закупщик"}, {"id": "q07", "block": "Лайн Чек 2", "group": "День · Чистка До/После (q01–q09)", "title": "🧊 Льдогенератор (фото до и после)", "instruction": "• Внутренняя камера чистая, без слизи, плесени и известкового налёта.\n• Лёд прозрачный, без постороннего запаха, совок для льда чистый.\n• Лоток и дренаж чистые, без застоя воды.\n• Корпус снаружи и вентиляционная решётка протёрты.\n• 📸 Сделать фото ДО и ПОСЛЕ чистки.", "photo": true, "owner": "Техник"}, {"id": "q08", "block": "Лайн Чек 2", "group": "День · Чистка До/После (q01–q09)", "title": "🚰 Мойка склад (фото до и после)", "instruction": "• Раковина на складе вымыта с дезсредством, без жира, налёта и остатков пищи.\n• Сливная сеточка и сифон чистые, без засоров и запаха (песок с полов в мойку не сливать!).\n• Смеситель натёрт без водного камня.\n• Поверхности и фартук вокруг мойки чистые и сухие.\n• 📸 Сделать фото ДО и ПОСЛЕ чистки.", "photo": true, "owner": "Администратор"}, {"id": "q09", "block": "Лайн Чек 2", "group": "День · Чистка До/После (q01–q09)", "title": "🚰 Мойка стойка (фото до и после)", "instruction": "• Барная раковина и ринзер чистые, без остатков молока и кофейной гущи.\n• Слив чистый, вода уходит быстро, запах отсутствует.\n• Смеситель натёрт до блеска без налёта.\n• Рабочая зона вокруг мойки сухая и чистая.\n• 📸 Сделать фото ДО и ПОСЛЕ чистки.", "photo": true, "owner": "Администратор"}, {"id": "gd1", "block": "Карта добрых дел", "group": "Карта добрых дел (периодические задачи)", "title": "🧊 Разморозка и генеральная мойка холодильника", "instruction": "📅 Периодичность: Раз в 2 недели (Вторник 14:00–18:00 — тихий день)\n⏰ Окно выполнения: 14:00 – 18:00\nВыполняется в самый тихий день (вторник с 14:00 до 18:00): отключить холодильник, полностью разморозить, промыть полки и уплотнители, навести идеальный порядок и сделать фото с камеры.", "photo": true, "owner": "Бариста"}, {"id": "gd2", "block": "Карта добрых дел", "group": "", "title": "🧂 Регенерация водоумягчителя (фильтра воды) — 2 пачки соли", "instruction": "📅 Периодичность: Раз в 4 недели (При закрытии — регенерация водоумягчителя)\n⏰ Окно выполнения: 21:30 – 22:30 (при закрытии)\nСтрого при закрытии смены (когда кофе больше не варим): скрутить крышку водоумягчителя, засыпать 2 пачки мелкой таблетированной соли, запустить цикл промывки пока моются полы.", "photo": true, "owner": "Бариста"}, {"id": "gd3", "block": "Карта добрых дел", "group": "Карта добрых дел (периодические задачи)", "title": "🪑 Подготовка второго зала к открытию (Пт–Сб)", "instruction": "📅 Периодичность: Только Пт и Сб (2-й зал / пик)\n⏰ Окно выполнения: 07:30 – 08:30\nВ пятницу и субботу открывается 2-й зал: включить освещение, проверить посадку, протереть столы и подготовить станцию.", "photo": true, "owner": "Бариста"}, {"id": "gd4", "block": "Карта добрых дел", "group": "Карта добрых дел (периодические задачи)", "title": "🧽 Глубокая замочка холдеров, сеток и питчеров в химии", "instruction": "📅 Периодичность: 2 раза в неделю (Ч function initTheme(btnId) {
  const mql = window.matchMedia('(prefers-color-scheme: dark)');
  let mode = 'auto';
  try { mode = localStorage.getItem(THEME_KEY) || 'auto'; } catch(_) {}
  function apply() {
    const eff = mode === 'auto' ? (mql.matches ? 'dark' : 'light') : mode;
    document.documentElement.setAttribute('data-theme', eff);
    const b = document.getElementById(btnId);
    if (b) b.textContent = mode === 'auto' ? '🌓 Авто' : (mode === 'light' ? '☀️ Светлая' : '🌙 Тёмная');
  }
  mql.addEventListener('change', () => { if (mode === 'auto') apply(); });
  window.addEventListener('storage', (e) => { if (e.key === THEME_KEY) { mode = e.newValue || 'auto'; apply(); } });
  const b = document.getElementById(btnId);
  if (b) b.onclick = () => {
    mode = mode === 'auto' ? 'light' : (mode === 'light' ? 'dark' : 'auto');

            ${instOpen?`<div class="step-inst">${esc(task.instruction||'Выполнить по стандарту Coffee Illy.')}</div>`:''}
            ${needPh?`<div class="photo-box ${hasPh?'done':''}" style="flex-direction:column;gap:8px">${hasPh?(
              (typeof stepPhotos[curBlk.name+':'+task.id]==='object'&&stepPhotos[curBlk.name+':'+task.id].preview
                ? '<img src="'+stepPhotos[curBlk.name+':'+task.id].preview+'" alt="Фото шага" style="width:100%;max-height:180px;object-fit:cover;border-radius:14px">' : '') +
              '<div style="display:flex;align-items:center;justify-content:space-between;width:100%;gap:8px;flex-wrap:wrap">' +
                '<b>'+(typeof stepPhotos[curBlk.name+':'+task.id]==='object'&&stepPhotos[curBlk.name+':'+task.id].uploading?'☁ Загрузка на Google Диск…':(typeof stepPhotos[curBlk.name+':'+task.id]==='object'&&stepPhotos[curBlk.name+':'+task.id].url?'✓ Сохранено на Google Диск':'✓ Фото снято (в очереди)'))+'</b>' +
                '<button class="chip-btn" id="b-ph" style="font-size:12px">📸 Переснять</button>' +
              '</div>'
            ):'<button class="chip-btn accent" id="b-ph">📷 Сделать фото</button>'}</div>`:''}
            <button class="btn-lg primary" id="b-nx" ${needPh && !hasPh?'disabled':''}>${idx===tasks.length-1?'✓ Завершить чек-лист':'✓ Всё в норме → Далее'}</button>
            <button class="btn-lg danger" id="b-is">⚠ Зафиксировать проблему</button>
          </div>`;
        }
      }
      body.innerHTML = h;
      document.getElementById('tg-st').onclick = () => { stagesOpen = !stagesOpen; render(); };
      body.querySelectorAll('[data-pk]').forEach(b=>b.onclick=()=>{ activeBlock=b.dataset.pk; stepIdx=0; stagesOpen=false; render(); });
      const bi = document.getElementById('b-inst'); if (bi) bi.onclick = () => { instOpen = !instOpen; render(); };
      const bp = document.getElementById('b-ph'); if (bp && curBlk) { const t = blockTasks(curBlk.name)[Math.min(stepIdx,blockTasks(curBlk.name).length-1)]; bp.onclick = () => {
        const key = curBlk.name + ':' + t.id;
        const isSelfie = /селфи|selfie/i.test(String(t.title || ''));
        if (window.CoffeeCameraV92) {
          window.CoffeeCameraV92.open({
            title: t.title || 'Фото шага',
            preferFront: isSelfie,
            onCaptured: async (dataUri) => {
              stepPhotos[key] = { preview: dataUri, uploading: true, url: '' };
              showToast('☁ Сохраняем фото на Google Диск…');
              render();
              if (window.CoffeeCloudV94) {
                const up = await window.CoffeeCloudV94.uploadPhotoToDrive({
                  dataUri: dataUri,
                  userName: authed || 'Бариста',
                  block: curBlk.name,
                  taskId: t.id,
                  kind: 'checklist'
                });
                stepPhotos[key] = { preview: dataUri, uploading: false, url: (up && up.url) || '', fileId: (up && up.fileId) || '', queued: !!(up && up.queued) };
                showToast(up && up.url ? '✓ Фото сохранено на Google Диск!' : '✓ Фото сохранено (отправится при синхронизации)');
              } else {
                stepPhotos[key] = { preview: dataUri, uploading: false, url: '' };
              }
              render();
            }
          });
        } else {
          stepPhotos[key] = { preview: '', uploading: false, url: '' };
          render();
        }
      }; }
      const bn = document.getElementById('b-nx'); if (bn && curBlk) bn.onclick = () => {
        const tasks = blockTasks(curBlk.name);
        if (stepIdx < tasks.length-1) {
          stepIdx++; instOpen=false; state.liveProgress[authed] = { block:curBlk.name, done:stepIdx, total:tasks.length }; if (window.CoffeeCloudV94) window.CoffeeCloudV94.sendStepProgress(authed, curBlk.name, stepIdx, tasks.length);
          saveSharedState(state, authed, ''); render();
        } else {
          const _blkItems = tasks.map(tk => { const p = stepPhotos[curBlk.name+':'+tk.id]; return { id: tk.id, title: tk.title, photo_url: (p && p.url) || '', isIncident: false }; }); const _blkPhotos = _blkItems.map(x=>x.photo_url).filter(Boolean); state.checklists.unshift({ items:_blkItems, photos:_blkPhotos, date:TODAY, time:state.simTime||'13:25', block:curBlk.name, who:authed, problems:0, deadline:curBlk.deadline, status:'Выполнено', isLate:false });
          state.liveProgress[authed] = { block:curBlk.name, done:tasks.length, total:tasks.length };
          stepIdx = 0; saveSharedState(state, authed, 'Сдан чек-лист «' + curBlk.name + '»'); showToast('Чек-лист отправлен в дашборд!'); render();
        }
      };
      const bis = document.getElementById('b-is'); if (bis && curBlk) bis.onclick = () => {
        const t = blockTasks(curBlk.name)[Math.min(stepIdx,blockTasks(curBlk.name).length-1)];
        openModal('Проблема: ' + t.title, `
          <div class="field"><label>Срочность</label><select id="ip"><option>Критично</option><option>Терпит</option></select></div>
          <div class="field"><label>Описание</label><textarea id="it" rows="3"></textarea></div>
          <button class="btn-lg primary" id="is">Отправить в дашборд</button>
        `);
        document.getElementById('is').onclick = () => {
          const _stepPh = stepPhotos[curBlk.name+':'+t.id]; state.incidents.unshift({ id:'INC-'+Math.floor(100+Math.random()*899), date:TODAY, time:state.simTime||'13:25', block:curBlk.name, step:t.title, text:document.getElementById('it').value.trim()||'Проблема', priority:document.getElementById('ip').value, status:'Новая проблема', who:authed, owner:'Администратор', photoUrl:(_stepPh&&_stepPh.url)||'' });
          saveSharedState(state, authed, 'Проблема: ' + t.title); closeModal(); showToast('Отправлено в дашборд!'); render();
        };
      };
      return;
    }

    if (tab === 'cash') {
      const cashRev = (state.cashReviews || {})[TODAY] || null;
      const isLocked = !!(cashRev && cashRev.status === 'Подтверждён');
      const existing = state.cash.find(x => x.date === TODAY) || {};
      const statusBadge = cashRev ? (cashRev.status === 'Подтверждён' ? '<span class="badge good">🟢 Подтверждён</span>' : (cashRev.status === 'Возвращён' ? '<span class="badge bad">🔴 Возвращён: ' + esc(cashRev.note || 'исправьте') + '</span>' : '<span class="badge warn">🟡 На проверке</span>')) : '<span class="badge">Черновик</span>';

      body.innerHTML = `<div class="step-card">
        <div class="step-counter"><span>Кассовый отчёт · ${TODAY}</span>${statusBadge}</div>
        <h3 class="step-title">Закрытие смены (${esc(authed)})</h3>
        ${isLocked ? '<div class="card-soft" style="margin-bottom:10px;border:1px solid var(--good);font-size:12.5px;">✓ Отчёт подтверждён владельцем и защищён от изменений.</div>' : ''}
        <div class="grid-2"><div class="field"><label>Наличные (₽)</label><input id="cc" type="number" min="0" value="${existing.cash||0}" ${isLocked?'disabled':''}></div><div class="field"><label>Безнал (₽)</label><input id="cd" type="number" min="0" value="${existing.card||0}" ${isLocked?'disabled':''}></div></div>
        <div class="grid-2"><div class="field"><label>Чеков</label><input id="ck" type="number" min="0" value="${existing.checks||0}" ${isLocked?'disabled':''}></div><div class="field"><label>Списания (₽)</label><input id="cw" type="number" min="0" value="${existing.writeoff||0}" ${isLocked?'disabled':''}></div></div>
        <div class="grid-2"><div class="field"><label>Счётчик кофемашины</label><input id="cnt-end" type="number" min="0" value="${existing.counterEnd||''}" placeholder="Показание" ${isLocked?'disabled':''}></div><div class="field"><label>Расхождение кассы (₽)</label><input id="c-disc" type="number" value="${existing.discrepancy||0}" ${isLocked?'disabled':''}></div></div>
        <div class="card-soft" id="c-calc" style="margin:8px 0;font-size:13px;">Итого выручка: <b>${fmtRub((existing.cash||0)+(existing.card||0))}</b></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 10px;">
          <button class="chip-btn accent" id="c-ph" ${isLocked?'disabled':''}>📷 ${cashPhoto.url?'Фото Z-отчёта ✓':'Фото Z-отчёта'}</button>
          <label class="chip-btn" style="cursor:pointer;display:inline-flex;align-items:center;gap:6px;">📥 CSV продажи<input id="t-csv-in" type="file" accept=".csv,text/csv" multiple style="display:none;" ${isLocked?'disabled':''}></label>
        </div>
        <div id="t-csv-info" style="font-size:12px;color:var(--muted);margin-bottom:8px;">${cashPhoto.uploading?'☁ Загрузка фото Z-отчёта на Google Диск…':(cashPhoto.url?'✓ Фото Z-отчёта сохранено на Google Диск':'')}</div>
        <button class="btn-lg primary" id="cs" ${isLocked?'disabled':''}>Отправить кассу на проверку владельцу</button>
        <button class="btn-lg" id="c-back" style="margin-top:8px;">← Вернуться в «Мой день»</button>
      </div>`;

      const updCalc = () => {
        const c = Number(document.getElementById('cc').value)||0, d = Number(document.getElementById('cd').value)||0, k = Number(document.getElementById('ck').value)||0;
        const avg = k > 0 ? Math.round((c + d) / k) : 0;
        const el = document.getElementById('c-calc');
        if (el) el.innerHTML = 'Итого выручка: <b>' + fmtRub(c + d) + '</b> · Средний чек: <b>' + fmtRub(avg) + '</b>';
      };
      ['cc','cd','ck'].forEach(id => { const el = document.getElementById(id); if (el) el.oninput = updCalc; });
      updCalc();

      const cPh = document.getElementById('c-ph');
      if (cPh) cPh.onclick = () => {
        if (!window.CoffeeCameraV92) return;
        window.CoffeeCameraV92.open({
          title: 'Фото Z-отчёта / кассы',
          onCaptured: async (dataUri) => {
            cashPhoto = { preview: dataUri, url: '', uploading: true };
            render();
            if (window.CoffeeCloudV94) {
              const up = await window.CoffeeCloudV94.uploadPhotoToDrive({ dataUri, userName: authed || 'Бариста', block: 'Касса', kind: 'cash' });
              cashPhoto = { preview: dataUri, url: (up && up.url) || '', uploading: false };
              showToast(cashPhoto.url ? '✓ Фото Z-отчёта на Google Диске!' : '✓ Фото Z-отчёта в очереди');
              render();
            }
          }
        });
      };

      let parsedCashBatch = null;
      const tCsvIn = document.getElementById('t-csv-in');
      if (tCsvIn) tCsvIn.onchange = async (ev) => {
        const files = Array.from(ev.target.files || []);
        if (!files.length || !window.CoffeePosCsvV93) return;
        const loaded = await Promise.all(files.map(f => f.text().then(text => ({ name: f.name, text }))));
        const staffNames = (state.staff || []).map(s => s.name).filter(Boolean);
        parsedCashBatch = window.CoffeePosCsvV93.parsePosBatch(loaded, staffNames);
        const info = document.getElementById('t-csv-info');
        if (parsedCashBatch.days.length) {
          const d0 = parsedCashBatch.days[parsedCashBatch.days.length - 1];
          document.getElementById('cc').value = d0.cash;
          document.getElementById('cd').value = d0.card;
          document.getElementById('ck').value = d0.checks;
          updCalc();
          if (info) info.textContent = '✓ Распознано: ' + parsedCashBatch.summary.daysCount + ' дн. · ' + fmtRub(parsedCashBatch.summary.totalRevenue);
        } else if (info) info.textContent = '⚠️ Не удалось распознать CSV';
      };

      document.getElementById('c-back').onclick = () => { tab = 'today'; render(); };
      document.getElementById('cs').onclick = async () => {
        if (parsedCashBatch && parsedCashBatch.days.length && window.CoffeeCloudV94) {
          const res = await window.CoffeeCloudV94.importPosBatch(parsedCashBatch.days, 'sum');
          if (res && res.ok) {
            parsedCashBatch.days.forEach(d => {
              const ex = state.cash.find(x => x.date === d.date);
              if (ex) { ex.cash = d.cash; ex.card = d.card; ex.revenue = d.revenue; ex.checks = d.checks; ex.barista = d.barista; }
              else state.cash.unshift({ date: d.date, cash: d.cash, card: d.card, revenue: d.revenue, checks: d.checks, writeoff: 0, topItems: d.topItems, barista: d.barista });
            });
            showToast('✓ CSV касса и продажи записаны в Google Таблицу!');
            parsedCashBatch = null; tab = 'today'; render(); return;
          }
        }
        const c=Number(document.getElementById('cc').value)||0, d=Number(document.getElementById('cd').value)||0, k=Number(document.getElementById('ck').value)||0, w=Number(document.getElementById('cw').value)||0;
        const disc = Number(document.getElementById('c-disc').value)||0;
        const cEnd = document.getElementById('cnt-end').value ? Number(document.getElementById('cnt-end').value) : null;
        const recObj = { date:TODAY, cash:c, card:d, revenue:c+d, total:c+d, checks:k, writeoff:w, discrepancy:disc, counterEnd:cEnd, photoUrl:cashPhoto.url||'', topItems:'', barista:authed, who:authed };
        const ex = state.cash.find(x=>x.date===TODAY);
        if (ex) Object.assign(ex, recObj); else state.cash.unshift(recObj);
        state.cashReviews = state.cashReviews || {};
        state.cashReviews[TODAY] = { date: TODAY, status: 'На проверке', revenue: c+d, discrepancy: disc, photoUrl: cashPhoto.url||'', barista: authed };
        saveSharedState(state, authed, 'Закрыта касса: ' + fmtRub(c+d));
        showToast('✓ Касса отправлена на проверку владельцу!');
        tab = 'today'; render();
      };
      return;
    }

    if (tab === 'info') {
      const items = state.ttk.filter(k => !ttkQ || k.name.toLowerCase().includes(ttkQ.toLowerCase()));
      const anns = (state.announcements || []).slice(0, 5);
      const openIncs = state.incidents.filter(i => i.status !== 'Решена').slice(0, 5);
      body.innerHTML = `
        <input id="tq" value="${esc(ttkQ)}" placeholder="Поиск по техкартам ILLY..." style="width:100%;padding:10px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--border);margin-bottom:10px;">
        ${anns.length ? `<div class="card-soft" style="margin-bottom:10px;"><div style="font-size:12px;color:var(--muted);margin-bottom:6px;">📢 Актуальные объявления</div>${anns.map(a=>`<div style="font-size:13px;padding:4px 0;border-bottom:1px solid var(--border);"><b>${esc(a.title||'Объявление')}</b>: ${esc(a.text||a.message||'')}</div>`).join('')}</div>` : ''}
        <div class="stack" style="margin-bottom:12px;">${items.map(k=>`<div class="card-soft"><div style="display:flex;justify-content:space-between;"><b>${esc(k.name)}</b><span class="badge accent">${k.price} ₽</span></div><div style="font-size:11.5px;color:var(--muted);margin:2px 0 5px;">${esc(k.vol)} · ${esc(k.cat)}</div><div style="font-size:12.5px;">${esc(k.recipe)}</div></div>`).join('')}</div>
        <div class="card-soft"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;"><b>⚠ Открытые поломки (${openIncs.length})</b><button class="chip-btn bad" id="ni">+ Сообщить</button></div>
        ${openIncs.length ? openIncs.map(i=>`<div style="font-size:12.5px;padding:5px 0;border-top:1px solid var(--border);"><b>${esc(i.step)}</b> <span class="badge ${String(i.priority).includes('Срочно')||i.priority==='Критично'?'bad':'warn'}">${esc(i.priority)}</span><div style="color:var(--muted);font-size:11.5px;">${i.date} · ${esc(i.text||'—')}</div></div>`).join('') : '<div style="font-size:12.5px;color:var(--muted);">Активных поломок нет</div>'}</div>`;
      document.getElementById('tq').oninput = e => { ttkQ = e.target.value; render(); };
      document.getElementById('ni').onclick = () => openNewIncidentModal();
      return;
    }

    if (tab === 'profile') {
      const me = getSt(authed) || { name: authed, role: 'Бариста', tgId: '' };
      const sb = window.CoffeeCloudV94 ? window.CoffeeCloudV94.getSyncBadge() : { text: '● Синхронизировано', cls: 'good', pending: 0 };
      const rel = window.APP_RELEASE || { release: '1.0.0', barista: '94.0', api: '1.0', schema: '1.0' };
      body.innerHTML = `<div class="step-card">
        <div class="step-counter"><span>Профиль сотрудника</span><span class="badge good">🟢 На работе · ${esc(checkedInAt||'08:00')}</span></div>
        <h2 class="step-title">${esc(me.name)}</h2>
        <div class="stack" style="margin:10px 0 14px;">
          <div class="card-soft" style="font-size:13px;">Роль: <b>${esc(me.role||'Бариста')}</b> · Точка: <b>${esc(state.location)}</b></div>
          <div class="card-soft" style="font-size:13px;">Telegram ID: <b>${esc(me.tgId||'Не привязан')}</b></div>
          <div class="card-soft" style="font-size:13px;display:flex;justify-content:space-between;align-items:center;"><span>Синхронизация: <b>${esc(sb.text)}</b></span><button class="chip-btn" id="pr-sync">↻ Синхр.</button></div>
          <div class="card-soft" style="font-size:12px;color:var(--muted);">COFFEE ILLY · Release ${rel.release} · Barista ${rel.barista} · API ${rel.api} · Schema ${rel.schema}</div>
        </div>
        <button class="btn-lg" id="pr-pin" style="margin-bottom:8px;">🔑 Сменить личный PIN</button>
        <button class="btn-lg danger" id="pr-out">🚪 Завершить смену и выйти</button>
      </div>`;
      document.getElementById('pr-sync').onclick = async () => { if (window.CoffeeCloudV94) { await window.CoffeeCloudV94.flushOutbox(); showToast('✓ Очередь синхронизирована'); render(); } };
      document.getElementById('pr-pin').onclick = () => { const b = document.getElementById('b-pin'); if (b) b.click(); };
      document.getElementById('pr-out').onclick = () => { const b = document.getElementById('b-out'); if (b) b.click(); };
      return;
    }
  }

  function onRemoteSync() {
    const next = loadSharedState();
    if (next.rev !== state.rev) {
      state = next;
      showToast('⚡ Синхронизировано с дашбордом (rev #' + state.rev + ')');
      render();
    }
  }
  if (syncCh) syncCh.onmessage = onRemoteSync;
  window.addEventListener('storage', (e) => { if (e.key === STORE_KEY) onRemoteSync(); });
  document.querySelectorAll('#bnav button').forEach(b => b.onclick = () => { tab = b.dataset.t; render(); });
  render();

  setInterval(() => { const _c = document.getElementById('hdr-clock'); if (_c && window.CoffeeCloudV94) _c.textContent = window.CoffeeCloudV94.localHHMM(); }, 15000);
  runAutoLogin();
  if (window.CoffeeCloudV94) {
    window.CoffeeCloudV94.startCloudLoop({
      mode: 'terminal',
      getState: () => state,
      onSynced: (st, srvRev) => {
        try { localStorage.setItem(STORE_KEY, JSON.stringify(st)); } catch(_) {}
        if (!authed) runAutoLogin();
        else applyDeepLinkIfNeeded();
        render();
      }
    });
  }
})();
</script>
</body>
</html>
