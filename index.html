<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Coffee Illy — Терминал бариста</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#F7F4EF">
<link rel="stylesheet" href="./css/coffee-illy-v94.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="./version.js"></script>
<script src="./config.js"></script>
<script src="./js/cloud-sync-v94.js"></script>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="brand-mark">CI</div>
    <div style="min-width:0;">
      <div class="brand-title">Coffee Illy · <span id="hdr-loc">Кофейня №1</span></div>
      <div class="brand-sub">
        <span id="sync-pill" class="sync-pill syncing"><span class="dot"></span><span id="sync-txt">Синхронизация...</span></span>
      </div>
    </div>
  </div>
  <div id="hdr-right" class="row" style="gap:6px;"></div>
</header>

<main class="barista-main" id="app-body"></main>

<nav class="bottom-nav" id="bnav" style="display:none;" aria-label="Основная навигация">
  <button data-t="home" class="active"><span class="nav-ico">🏠</span><span>Главная</span></button>
  <button data-t="tasks"><span class="nav-ico">☑️</span><span>Задачи</span></button>
  <button data-t="cash"><span class="nav-ico">💳</span><span>Касса</span></button>
  <button data-t="incidents"><span class="nav-ico">🛠</span><span>Поломки</span></button>
  <button data-t="ttk"><span class="nav-ico">☕</span><span>ТТК</span></button>
</nav>

<div class="modal-bg" id="modal-bg">
  <div class="modal-box">
    <div class="modal-head">
      <h3 class="modal-title" id="modal-title"></h3>
      <button class="icon-btn" id="modal-close" aria-label="Закрыть">✕</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  const C = window.CoffeeCloudV94;
  const STORE_KEY = 'coffee_illy_v94_barista_state';
  const DRAFT_CHK_KEY = 'coffee_illy_v94_chk_drafts';
  const DRAFT_CASH_KEY = 'coffee_illy_v94_cash_draft';
  const THEME_KEY = 'coffee_illy_v94_theme';
  const TODAY = C ? C.localISO() : new Date().toISOString().slice(0, 10);

  const EQUIP_LIST = ['Кофемашина', 'Кофемолка', 'Холодильник', 'Термопот', 'Витрина', 'Зона гостя', 'Санузел', 'Касса / Терминал', 'Другое'];
  const INC_TYPES = ['Срочно (стоп-работа)', 'Важно (в течение дня)', 'Терпит (планово)'];

  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function fmtRub(n) {
    if (n === null || n === undefined || Number.isNaN(Number(n))) return '—';
    return Number(n).toLocaleString('ru-RU') + ' ₽';
  }
  function toMin(hhmm) {
    const m = String(hhmm || '00:00').match(/(\d{1,2}):(\d{2})/);
    return m ? Number(m[1]) * 60 + Number(m[2]) : 0;
  }
  function nowHHMM() { return C ? C.localHHMM() : '12:00'; }

  let _toastTimer = null;
  function showToast(msg) {
    const el = document.getElementById('toast');
    if (!el) return;
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(_toastTimer);
    _toastTimer = setTimeout(() => el.classList.remove('show'), 3200);
  }

  function openModal(title, html) {
    document.getElementById('modal-title').textContent = title;
    document.getElementById('modal-body').innerHTML = html;
    document.getElementById('modal-bg').classList.add('open');
  }
  function closeModal() { document.getElementById('modal-bg').classList.remove('open'); }
  document.getElementById('modal-close').onclick = closeModal;
  document.getElementById('modal-bg').onclick = (e) => { if (e.target.id === 'modal-bg') closeModal(); };

  // Theme (Light Warm Milk default / Dark / Auto)
  let themeMode = 'auto';
  try { themeMode = localStorage.getItem(THEME_KEY) || 'light'; } catch (_) { themeMode = 'light'; }
  function applyTheme() {
    const dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    const eff = themeMode === 'auto' ? (dark ? 'dark' : 'light') : themeMode;
    document.documentElement.setAttribute('data-theme', eff);
  }
  applyTheme();

  function defaultState() {
    return {
      location: 'Кофейня №1', plan: 2200, photoAll: false,
      blocks: [
        { id: 'b_open', name: 'Открытие', openTime: '07:30', deadline: '09:30', isCash: false, active: true },
        { id: 'b_day', name: 'Лайн Чек 1', openTime: '11:00', deadline: '16:00', isCash: false, active: true },
        { id: 'b_close', name: 'Закрытие', openTime: '20:30', deadline: '22:30', isCash: false, active: true }
      ],
      tasks: [], checklists: [], cash: [], incidents: [], staff: [], ttk: [], announcements: [],
      staffPresence: {}, cashReviews: {}, dataLoaded: false, loadError: '', lastSyncAt: ''
    };
  }
  function loadState() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (raw) return Object.assign(defaultState(), JSON.parse(raw));
    } catch (_) {}
    return defaultState();
  }
  function saveStateLocal() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (_) {}
  }

  function loadChkDrafts() {
    try { return JSON.parse(localStorage.getItem(DRAFT_CHK_KEY) || '{}') || {}; } catch (_) { return {}; }
  }
  function saveChkDrafts(d) {
    try { localStorage.setItem(DRAFT_CHK_KEY, JSON.stringify(d)); } catch (_) {}
  }
  function loadCashDraft() {
    const def = { step: 1, date: TODAY, staff1: '', counter1: '', staff2: '', counter2: '', cash: '', card: '', checks: '', writeoff: '0', expenses: '0', photoUrl: '', comment: '' };
    try { return Object.assign(def, JSON.parse(localStorage.getItem(DRAFT_CASH_KEY) || '{}')); } catch (_) { return def; }
  }
  function saveCashDraft(d) {
    try { localStorage.setItem(DRAFT_CASH_KEY, JSON.stringify(d)); } catch (_) {}
  }

  // Real Camera Capture -> JPEG compression -> Google Drive upload
  function compressAndUploadPhoto(file, meta, onDone) {
    if (!file) return;
    showToast('Загрузка фотографии...');
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = async () => {
        const maxSide = 1280;
        let w = img.width, h = img.height;
        if (w > maxSide || h > maxSide) {
          if (w > h) { h = Math.round((h * maxSide) / w); w = maxSide; }
          else { w = Math.round((w * maxSide) / h); h = maxSide; }
        }
        const cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        const dataUri = cv.toDataURL('image/jpeg', 0.78);
        if (C) {
          const res = await C.uploadPhotoToDrive(Object.assign({ dataUri: dataUri, userName: authed || 'Бариста' }, meta || {}));
          if (res && res.ok) {
            showToast(res.queued ? 'Фото сохранено на устройстве — отправится при появлении сети' : 'Фотография загружена');
            onDone(res.url || dataUri, !!res.queued);
            return;
          }
        }
        showToast('Фотография сохранена');
        onDone(dataUri, true);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }

  let state = loadState();
  let tab = 'home';
  let authed = null;
  let checkedInAt = '';
  let welcomeBanner = '';
  let pickStaff = '';
  let pinBuf = '';
  let activeBlock = null;
  let chkDrafts = loadChkDrafts();
  let cashDraft = loadCashDraft();
  let incForm = { equip: EQUIP_LIST[0], priority: INC_TYPES[1], text: '', photoUrl: '' };
  let ttkQuery = '';
  let ttkCat = 'Все';
  let deepLinkApplied = false;
  let cloudLoop = null;

  function activeStaff() { return (state.staff || []).filter((s) => s && s.active !== false); }
  function getSt(nm) { return (state.staff || []).find((s) => s.name === nm); }
  function blockTasks(blk) { return (state.tasks || []).filter((t) => t.block === blk && t.active !== false); }
  function getDoneRecord(blk) {
    return (state.checklists || []).find((c) => c.date === TODAY && c.block === blk);
  }
  function classifyStage(b) {
    const nm = String(b.name || '').toLowerCase();
    if (nm.includes('открыт')) return 'Открытие';
    if (nm.includes('закрыт')) return 'Закрытие';
    const m = toMin(b.openTime || '12:00');
    if (m < 600) return 'Открытие';
    if (m >= 1140) return 'Закрытие';
    return 'В течение дня';
  }
  function getBlockStatus(b) {
    const done = getDoneRecord(b.name);
    if (done) return { code: 'done', label: 'Готово (' + (done.time || 'сегодня') + ')', cls: 'good', canOpen: true, locked: true, record: done };
    const nowM = toMin(nowHHMM());
    if (nowM < toMin(b.openTime || '00:00')) return { code: 'later', label: 'Позже · с ' + b.openTime, cls: '', canOpen: true, locked: false };
    if (nowM > toMin(b.deadline || '23:59')) return { code: 'overdue', label: 'Просрочен · до ' + b.deadline, cls: 'bad', canOpen: true, locked: false };
    return { code: 'open', label: 'Ожидает · до ' + b.deadline, cls: 'warn', canOpen: true, locked: false };
  }

  function updateSyncPill(st) {
    const pill = document.getElementById('sync-pill');
    const txt = document.getElementById('sync-txt');
    if (!pill || !txt) return;
    pill.className = 'sync-pill ' + (st.state || 'syncing');
    if (st.state === 'synced') {
      txt.textContent = 'Синхронизировано' + (st.lastSyncAt ? ' · ' + st.lastSyncAt : '');
      pill.onclick = null;
    } else if (st.state === 'offline') {
      txt.textContent = 'Нет соединения — данные сохраняются на устройстве';
      pill.onclick = null;
    } else if (st.state === 'error') {
      txt.textContent = 'Ошибка загрузки · Повторить';
      pill.onclick = () => { if (cloudLoop) cloudLoop.pullNow(true); };
    } else {
      txt.textContent = st.pending ? ('Отправка изменений (' + st.pending + ')...') : 'Синхронизация...';
      pill.onclick = null;
    }
  }

  function applyDeepLinkIfNeeded() {
    if (deepLinkApplied || !C) return;
    const dl = C.getDeepLinkBlock();
    if (!dl) { deepLinkApplied = true; return; }
    const found = (state.blocks || []).find((b) => !b.isCash && b.name.toLowerCase().includes(dl.toLowerCase()));
    if (found) {
      tab = 'tasks';
      activeBlock = found.name;
      deepLinkApplied = true;
      showToast('Открыт чек-лист «' + found.name + '»');
    }
  }

  function completeSignIn(staffName, checkTime, greetingText) {
    authed = staffName;
    checkedInAt = checkTime || nowHHMM();
    welcomeBanner = greetingText || ('Добро пожаловать на смену, ' + staffName + '! Вы отмечены на работе с ' + checkedInAt + '.');
    if (!cashDraft.staff1) { cashDraft.staff1 = staffName; saveCashDraft(cashDraft); }
    state.staffPresence = state.staffPresence || {};
    state.staffPresence[staffName] = { staffName, status: 'on_shift', checkedInAt, date: TODAY };
    applyDeepLinkIfNeeded();
    saveStateLocal();
    showToast(welcomeBanner);
    render();
  }

  async function runAutoLogin() {
    if (authed || !C) return;
    const res = await C.autoLoginEmployee(state);
    if (res && res.ok && res.staffName) {
      completeSignIn(res.staffName, res.checkedInAt, res.welcomeMessage);
    }
  }

  async function tryPinLogin() {
    const st = getSt(pickStaff);
    if (!st || st.active === false) { showToast('Сотрудник не найден или отключён'); pinBuf = ''; render(); return; }
    if (!pinBuf) return;
    const entered = pinBuf;
    pinBuf = '';
    if (C) {
      const tgu = C.getTelegramUser();
      const res = await C.authLogin('staff', { name: st.name, pin: entered, tgId: (tgu && tgu.id) || st.tgId || '', initData: (tgu && tgu.initData) || '' });
      if (res && res.ok) {
        completeSignIn(res.staffName || st.name, res.checkedInAt, res.welcomeMessage);
        return;
      }
      if (res && !res.offline) {
        showToast(res.error || 'Неверный PIN-код');
        render();
        return;
      }
    }
    if (entered === (st.pin || '1234')) completeSignIn(st.name, nowHHMM(), '');
    else { showToast('Неверный PIN-код'); render(); }
  }

  function openProfileModal() {
    const st = getSt(authed) || { name: authed, role: 'Бариста', tgId: '' };
    openModal('Профиль сотрудника', `
      <div class="stack">
        <div class="card-soft">
          <div class="row-between">
            <div><div style="font-weight:700;font-size:16px;">${esc(st.name)}</div><div class="card-sub">${esc(st.role || 'Бариста')}</div></div>
            <span class="badge good">На работе с ${esc(checkedInAt || nowHHMM())}</span>
          </div>
        </div>
        <div class="field">
          <label>Тема оформления</label>
          <select id="prof-theme">
            <option value="light" ${themeMode === 'light' ? 'selected' : ''}>Светлая (тёплый молочный)</option>
            <option value="dark" ${themeMode === 'dark' ? 'selected' : ''}>Тёмная</option>
            <option value="auto" ${themeMode === 'auto' ? 'selected' : ''}>Авто (как в системе)</option>
          </select>
        </div>
        <div class="card-soft">
          <div style="font-weight:600;margin-bottom:8px;">Смена личного PIN-кода</div>
          <div class="field"><label>Текущий PIN</label><input id="pin-old" type="password" inputmode="numeric" placeholder="••••"></div>
          <div class="field"><label>Новый PIN (4–6 цифр)</label><input id="pin-new" type="password" inputmode="numeric" placeholder="Новый PIN"></div>
          <button class="btn btn-primary btn-full" id="btn-save-pin">Сохранить новый PIN</button>
        </div>
        <button class="btn btn-bad btn-full" id="btn-logout">Завершить смену и выйти</button>
      </div>
    `);
    document.getElementById('prof-theme').onchange = (e) => {
      themeMode = e.target.value;
      try { localStorage.setItem(THEME_KEY, themeMode); } catch (_) {}
      applyTheme();
      showToast('Тема обновлена');
    };
    document.getElementById('btn-save-pin').onclick = async () => {
      const oldP = document.getElementById('pin-old').value.trim();
      const newP = document.getElementById('pin-new').value.trim();
      if (!/^\d{4,6}$/.test(newP)) { showToast('Новый PIN должен содержать от 4 до 6 цифр'); return; }
      if (C) {
        const res = await C.gasPost('change_staff_pin', { name: authed, oldPin: oldP, newPin: newP });
        if (res && res.ok) { showToast('PIN-код обновлён'); closeModal(); return; }
        showToast((res && res.error) || 'Не удалось обновить PIN');
      }
    };
    document.getElementById('btn-logout').onclick = async () => {
      const nm = authed;
      closeModal();
      if (C) await C.checkOutStaff(nm);
      authed = null; checkedInAt = ''; welcomeBanner = ''; pinBuf = '';
      showToast('Вы вышли со смены');
      render();
    };
  }

  function render() {
    document.getElementById('hdr-loc').textContent = state.location || 'Кофейня №1';
    const body = document.getElementById('app-body');
    const nav = document.getElementById('bnav');
    const hdrR = document.getElementById('hdr-right');

    if (!authed) {
      nav.style.display = 'none';
      hdrR.innerHTML = '';
      const staff = activeStaff();
      const names = staff.length ? staff.map((s) => s.name) : ['Соня', 'Алина'];
      if (!names.includes(pickStaff)) pickStaff = names[0];
      body.innerHTML = `
        <div class="card" style="max-width:420px;margin:16px auto;">
          <div class="card-head">
            <div>
              <h2 class="card-title">Вход сотрудника</h2>
              <div class="card-sub">После входа система отметит вас на работе и запомнит устройство</div>
            </div>
          </div>
          <div class="field">
            <label>Сотрудник</label>
            <select id="login-staff">${names.map((n) => `<option value="${esc(n)}" ${n === pickStaff ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>
          </div>
          <div class="pin-dots">${[0, 1, 2, 3].map((i) => `<span class="pin-dot ${pinBuf.length > i ? 'filled' : ''}"></span>`).join('')}</div>
          <div class="pin-pad">${['1', '2', '3', '4', '5', '6', '7', '8', '9', '⌫', '0', '✓'].map((k) => `<button class="pin-key" data-k="${k}">${k}</button>`).join('')}</div>
        </div>`;
      document.getElementById('login-staff').onchange = (e) => { pickStaff = e.target.value; pinBuf = ''; render(); };
      body.querySelectorAll('[data-k]').forEach((b) => {
        b.onclick = () => {
          const k = b.dataset.k;
          if (k === '⌫') { pinBuf = pinBuf.slice(0, -1); render(); return; }
          if (k === '✓') { tryPinLogin(); return; }
          if (pinBuf.length < 6) {
            pinBuf += k;
            if (pinBuf.length === 4) tryPinLogin();
            else render();
          }
        };
      });
      return;
    }

    nav.style.display = 'grid';
    nav.querySelectorAll('button').forEach((b) => b.classList.toggle('active', b.dataset.t === tab));
    const initials = String(authed).slice(0, 2).toUpperCase();
    hdrR.innerHTML = `<button class="icon-btn" id="btn-profile" title="Профиль">${esc(initials)} <span style="font-size:12px;">${esc(authed)}</span></button>`;
    document.getElementById('btn-profile').onclick = openProfileModal;

    const workBlocks = (state.blocks || []).filter((b) => !b.isCash && b.active !== false);
    const doneBlocksCount = workBlocks.filter((b) => !!getDoneRecord(b.name)).length;
    const totalBlocksCount = workBlocks.length;
    const progressPct = totalBlocksCount ? Math.round((doneBlocksCount / totalBlocksCount) * 100) : 0;

    // 1. ГЛАВНАЯ
    if (tab === 'home') {
      const myCashToday = (state.cash || []).find((c) => c.date === TODAY && (c.who === authed || c.barista === authed));
      const cashKey = TODAY + '|' + authed;
      const cashRev = (state.cashReviews || {})[cashKey];
      const nextOpen = workBlocks.find((b) => !getDoneRecord(b.name));
      body.innerHTML = `
        <div class="stack">
          ${welcomeBanner ? `<div class="card-soft" style="border-color:var(--good);"><div class="row-between"><div style="font-size:14px;font-weight:600;">👋 ${esc(welcomeBanner)}</div><button class="btn btn-sm" id="dismiss-welcome">Понятно</button></div></div>` : ''}

          <div class="card">
            <div class="row-between">
              <div>
                <div class="card-sub">Моя смена</div>
                <div style="font-size:18px;font-weight:800;margin-top:2px;">Сегодня · ${esc(TODAY)}</div>
                <div class="card-sub">Вы отмечены на работе с ${esc(checkedInAt || nowHHMM())}</div>
              </div>
              <span class="badge good">Активна</span>
            </div>
          </div>

          <div class="card">
            <div class="card-head">
              <div>
                <h2 class="card-title">Что нужно сделать сегодня</h2>
                <div class="card-sub">Выполнено ${doneBlocksCount} из ${totalBlocksCount} чек-листов</div>
              </div>
              <span class="badge ${progressPct === 100 ? 'good' : 'accent'}">${progressPct}%</span>
            </div>
            <div class="pbar ${progressPct === 100 ? 'good' : ''}" style="margin-bottom:12px;"><div style="width:${progressPct}%"></div></div>
            <div class="stack-sm">
              ${workBlocks.length ? workBlocks.map((b) => {
                const st = getBlockStatus(b);
                return `<div class="card-soft row-between" style="cursor:pointer;" data-open-blk="${esc(b.name)}">
                  <div>
                    <div style="font-weight:700;">${esc(b.name)}</div>
                    <div class="card-sub">${esc(classifyStage(b))} · ${esc(b.openTime)}–${esc(b.deadline)}</div>
                  </div>
                  <span class="badge ${st.cls}">${esc(st.label)}</span>
                </div>`;
              }).join('') : `<div class="empty-state"><div class="empty-title">Нет назначенных чек-листов</div><div class="empty-sub">Данные появятся после загрузки расписания</div></div>`}
              <div class="card-soft row-between" style="cursor:pointer;" id="home-go-cash">
                <div>
                  <div style="font-weight:700;">Кассовый отчёт</div>
                  <div class="card-sub">${myCashToday ? ('Выручка: ' + fmtRub(myCashToday.revenue)) : 'Сдать в конце смены'}</div>
                </div>
                <span class="badge ${cashRev && cashRev.status === 'Подтверждён' ? 'good' : (cashRev && cashRev.status === 'Нужно исправить' ? 'bad' : (myCashToday ? 'warn' : ''))}">${esc(cashRev ? cashRev.status : (myCashToday ? 'На проверке' : 'Позже'))}</span>
              </div>
            </div>
          </div>

          <div class="card">
            <h2 class="card-title" style="margin-bottom:10px;">Быстрые действия</h2>
            <div class="grid-2">
              <button class="btn btn-primary" id="qa-chk">☑️ Открыть чек-лист</button>
              <button class="btn" id="qa-cash">💳 Сдать кассовый отчёт</button>
              <button class="btn" id="qa-inc">🛠 Сообщить о поломке</button>
              <button class="btn" id="qa-ttk">☕ Найти ТТК</button>
            </div>
          </div>

          <div class="card">
            <h2 class="card-title" style="margin-bottom:10px;">Последние уведомления</h2>
            <div class="stack-sm">
              ${cashRev && cashRev.status === 'Нужно исправить' ? `<div class="card-soft" style="border-color:var(--bad);"><div style="font-weight:700;color:var(--bad);">Кассовый отчёт возвращён на исправление</div><div class="card-sub">${esc(cashRev.reviewNote || 'Проверьте суммы и отправьте повторно')}</div></div>` : ''}
              ${(state.announcements || []).length ? state.announcements.slice(0, 3).map((a) => `<div class="card-soft"><div style="font-weight:600;">${esc(a.title || a.text || 'Объявление')}</div>${a.text && a.title ? `<div class="card-sub">${esc(a.text)}</div>` : ''}</div>`).join('') : `<div class="empty-state"><div class="empty-title">Новых уведомлений нет</div><div class="empty-sub">Важные сообщения от владельца появятся здесь</div></div>`}
            </div>
          </div>
        </div>`;
      const dw = document.getElementById('dismiss-welcome');
      if (dw) dw.onclick = () => { welcomeBanner = ''; render(); };
      body.querySelectorAll('[data-open-blk]').forEach((el) => {
        el.onclick = () => { activeBlock = el.dataset.openBlk; tab = 'tasks'; render(); };
      });
      document.getElementById('home-go-cash').onclick = () => { tab = 'cash'; render(); };
      document.getElementById('qa-chk').onclick = () => { activeBlock = nextOpen ? nextOpen.name : (workBlocks[0] && workBlocks[0].name) || null; tab = 'tasks'; render(); };
      document.getElementById('qa-cash').onclick = () => { tab = 'cash'; render(); };
      document.getElementById('qa-inc').onclick = () => { tab = 'incidents'; render(); };
      document.getElementById('qa-ttk').onclick = () => { tab = 'ttk'; render(); };
      return;
    }

    // 2. ЗАДАЧИ (ЧЕК-ЛИСТЫ)
    if (tab === 'tasks') {
      if (activeBlock) {
        const blkObj = workBlocks.find((b) => b.name === activeBlock) || { name: activeBlock, openTime: '08:00', deadline: '22:00' };
        const st = getBlockStatus(blkObj);
        const tasks = blockTasks(activeBlock);
        const dKey = TODAY + '|' + activeBlock;
        const draft = chkDrafts[dKey] || { items: {} };
        const doneCnt = tasks.filter((t) => draft.items[t.id] && draft.items[t.id].checked).length;
        const pct = tasks.length ? Math.round((doneCnt / tasks.length) * 100) : 0;

        body.innerHTML = `
          <div class="stack">
            <div class="row-between">
              <button class="btn btn-sm" id="chk-back">← Все этапы</button>
              <span class="badge ${st.cls}">${esc(st.label)}</span>
            </div>
            <div class="card">
              <div class="card-head">
                <div>
                  <h2 class="card-title">${esc(blkObj.name)}</h2>
                  <div class="card-sub">Окно: ${esc(blkObj.openTime)}–${esc(blkObj.deadline)} · Выполнено ${st.locked ? tasks.length : doneCnt} из ${tasks.length}</div>
                </div>
              </div>
              <div class="pbar ${st.locked || pct === 100 ? 'good' : ''}"><div style="width:${st.locked ? 100 : pct}%"></div></div>
              ${st.locked ? `<div class="card-soft" style="margin-top:12px;border-color:var(--good);"><b>Чек-лист отправлен на проверку</b><div class="card-sub">Выполнил: ${esc(st.record.who || authed)} · Время: ${esc(st.record.time || 'сегодня')}. Редактирование после отправки заблокировано.</div></div>` : ''}
            </div>

            ${tasks.length ? tasks.map((t, idx) => {
              const it = draft.items[t.id] || {};
              const needPhoto = !!(t.photo || state.photoAll);
              return `<div class="card" style="${it.checked ? 'border-color:var(--good);' : ''}">
                <div class="row-between" style="align-items:flex-start;">
                  <label style="display:flex;gap:10px;align-items:flex-start;cursor:${st.locked ? 'default' : 'pointer'};flex:1;">
                    <input type="checkbox" data-chk-id="${esc(t.id)}" ${it.checked || st.locked ? 'checked' : ''} ${st.locked ? 'disabled' : ''} style="width:22px;height:22px;margin-top:2px;accent-color:var(--good);">
                    <div>
                      <div style="font-weight:700;">${idx + 1}. ${esc(t.title)}</div>
                      ${t.instruction ? `<div class="card-sub">${esc(t.instruction)}</div>` : ''}
                      ${it.checkedAt ? `<div class="card-sub" style="color:var(--good);">Отметил ${esc(it.checkedBy || authed)} в ${esc(it.checkedAt)}</div>` : ''}
                    </div>
                  </label>
                  ${needPhoto ? `<span class="badge ${it.photoUrl ? 'good' : 'warn'}">${it.photoUrl ? '📷 Фото есть' : '📷 Нужно фото'}</span>` : ''}
                </div>
                ${!st.locked ? `
                  <div class="row" style="margin-top:10px;">
                    <label class="btn btn-sm" style="cursor:pointer;">📷 ${it.photoUrl ? 'Переснять фото' : 'Сделать фото'}<input type="file" accept="image/*" capture="environment" data-photo-id="${esc(t.id)}" style="display:none;"></label>
                    <button class="btn btn-sm ${it.isIncident ? 'btn-bad' : ''}" data-inc-id="${esc(t.id)}">${it.isIncident ? '⚠️ Проблема отмечена' : 'Отметить проблему'}</button>
                  </div>
                  <div class="field" style="margin-top:8px;margin-bottom:0;">
                    <input data-cmt-id="${esc(t.id)}" value="${esc(it.comment || '')}" placeholder="Комментарий к пункту (при необходимости)">
                  </div>
                ` : ''}
                ${it.photoUrl ? `<div style="margin-top:8px;"><a href="${esc(it.photoUrl)}" target="_blank" rel="noopener" class="badge accent">Открыть загруженное фото</a></div>` : ''}
              </div>`;
            }).join('') : `<div class="empty-state"><div class="empty-title">В этом чек-листе пока нет пунктов</div><div class="empty-sub">Добавьте задачи в панели владельца</div></div>`}

            ${!st.locked && tasks.length ? `<button class="btn btn-primary btn-full" id="btn-submit-chk">Отправить чек-лист (${doneCnt}/${tasks.length})</button>` : ''}
          </div>`;

        document.getElementById('chk-back').onclick = () => { activeBlock = null; render(); };
        body.querySelectorAll('[data-chk-id]').forEach((cb) => {
          cb.onchange = () => {
            const tid = cb.dataset.chkId;
            draft.items[tid] = Object.assign(draft.items[tid] || {}, { checked: cb.checked, checkedAt: cb.checked ? nowHHMM() : '', checkedBy: authed });
            chkDrafts[dKey] = draft;
            saveChkDrafts(chkDrafts);
            render();
          };
        });
        body.querySelectorAll('[data-cmt-id]').forEach((inp) => {
          inp.oninput = () => {
            const tid = inp.dataset.cmtId;
            draft.items[tid] = Object.assign(draft.items[tid] || {}, { comment: inp.value });
            chkDrafts[dKey] = draft;
            saveChkDrafts(chkDrafts);
          };
        });
        body.querySelectorAll('[data-inc-id]').forEach((btn) => {
          btn.onclick = () => {
            const tid = btn.dataset.incId;
            const cur = draft.items[tid] || {};
            draft.items[tid] = Object.assign(cur, { isIncident: !cur.isIncident });
            chkDrafts[dKey] = draft;
            saveChkDrafts(chkDrafts);
            render();
          };
        });
        body.querySelectorAll('[data-photo-id]').forEach((fi) => {
          fi.onchange = () => {
            const tid = fi.dataset.photoId;
            const file = fi.files && fi.files[0];
            if (!file) return;
            compressAndUploadPhoto(file, { block: activeBlock, taskId: tid, kind: 'checklist' }, (url) => {
              draft.items[tid] = Object.assign(draft.items[tid] || {}, { photoUrl: url, checked: true, checkedAt: nowHHMM(), checkedBy: authed });
              chkDrafts[dKey] = draft;
              saveChkDrafts(chkDrafts);
              render();
            });
          };
        });
        const subBtn = document.getElementById('btn-submit-chk');
        if (subBtn) {
          subBtn.onclick = () => {
            const unchecked = tasks.filter((t) => !(draft.items[t.id] && draft.items[t.id].checked));
            if (unchecked.length) {
              showToast('Выполните все пункты чек-листа (осталось: ' + unchecked.length + ')');
              return;
            }
            const missingPhoto = tasks.filter((t) => (t.photo || state.photoAll) && !(draft.items[t.id] && draft.items[t.id].photoUrl));
            if (missingPhoto.length) {
              showToast('Добавьте обязательное фото для пункта «' + missingPhoto[0].title + '»');
              return;
            }
            openModal('Подтвердить отправку чек-листа', `
              <div class="stack">
                <div>Отправить чек-лист <b>«${esc(activeBlock)}»</b> (${tasks.length} из ${tasks.length} пунктов)? После отправки изменить содержимое будет нельзя.</div>
                <div class="row">
                  <button class="btn" style="flex:1;" id="cfm-cancel">Отмена</button>
                  <button class="btn btn-primary" style="flex:1;" id="cfm-send">Отправить</button>
                </div>
              </div>
            `);
            document.getElementById('cfm-cancel').onclick = closeModal;
            document.getElementById('cfm-send').onclick = async () => {
              closeModal();
              const itemsPayload = tasks.map((t) => {
                const it = draft.items[t.id] || {};
                return { id: t.id, title: t.title, photo_url: it.photoUrl || '', isIncident: !!it.isIncident, comment: it.comment || '' };
              });
              const isLate = toMin(nowHHMM()) > toMin(blkObj.deadline || '23:59');
              const photos = itemsPayload.map((x) => x.photo_url).filter(Boolean);
              state.checklists.unshift({ date: TODAY, time: nowHHMM(), block: activeBlock, who: authed, problems: itemsPayload.filter((x) => x.isIncident).length, status: isLate ? 'С опозданием' : 'Выполнено', isLate, done: tasks.length, total: tasks.length, photos });
              saveStateLocal();
              if (C) {
                C.enqueueOp('submit_checklist', { block: activeBlock, who: authed, userName: authed, date: TODAY, deadline: blkObj.deadline || '22:00', isLate, items: itemsPayload });
              }
              showToast('Чек-лист сохранён и отправлен');
              render();
            };
          };
        }
        return;
      }

      // Grouped checklist stages: Открытие / В течение дня / Закрытие
      const stages = ['Открытие', 'В течение дня', 'Закрытие'];
      body.innerHTML = `
        <div class="stack">
          <div class="card">
            <h2 class="card-title">Чек-листы смены</h2>
            <div class="card-sub">Выполнено ${doneBlocksCount} из ${totalBlocksCount} · Промежуточные отметки сохраняются автоматически</div>
          </div>
          ${stages.map((stg) => {
            const list = workBlocks.filter((b) => classifyStage(b) === stg);
            if (!list.length) return '';
            return `<div class="card">
              <h3 class="card-title" style="margin-bottom:10px;">${esc(stg)}</h3>
              <div class="stack-sm">
                ${list.map((b) => {
                  const st = getBlockStatus(b);
                  const cnt = blockTasks(b.name).length;
                  return `<div class="card-soft row-between" style="cursor:pointer;" data-blk="${esc(b.name)}">
                    <div>
                      <div style="font-weight:700;">${esc(b.name)}</div>
                      <div class="card-sub">${cnt} пунктов · ${esc(b.openTime)}–${esc(b.deadline)}</div>
                    </div>
                    <span class="badge ${st.cls}">${esc(st.label)}</span>
                  </div>`;
                }).join('')}
              </div>
            </div>`;
          }).join('')}
        </div>`;
      body.querySelectorAll('[data-blk]').forEach((el) => {
        el.onclick = () => { activeBlock = el.dataset.blk; render(); };
      });
      return;
    }

    // 3. КАССА (4-шаговая пошаговая форма «Кассовый отчёт»)
    if (tab === 'cash') {
      const existingToday = (state.cash || []).find((c) => c.date === TODAY && (c.who === authed || c.barista === authed));
      const revInfo = (state.cashReviews || {})[TODAY + '|' + authed];
      const canEdit = !existingToday || (revInfo && revInfo.status === 'Нужно исправить');
      const staffNames = activeStaff().map((s) => s.name);
      const cashNum = Math.max(0, Number(cashDraft.cash) || 0);
      const cardNum = Math.max(0, Number(cashDraft.card) || 0);
      const totalRev = cashNum + cardNum;
      const checksNum = Math.max(0, Number(cashDraft.checks) || 0);
      const avgChk = checksNum > 0 ? Math.round(totalRev / checksNum) : 0;
      const woNum = Math.max(0, Number(cashDraft.writeoff) || 0);
      const expNum = Math.max(0, Number(cashDraft.expenses) || 0);

      if (!canEdit) {
        const stLabel = (revInfo && revInfo.status) || 'На проверке';
        const stCls = stLabel === 'Подтверждён' ? 'good' : 'warn';
        body.innerHTML = `
          <div class="stack">
            <div class="card">
              <div class="card-head">
                <div><h2 class="card-title">Кассовый отчёт за ${esc(TODAY)}</h2><div class="card-sub">Повторная отправка одного отчёта заблокирована</div></div>
                <span class="badge ${stCls}">${esc(stLabel)}</span>
              </div>
              <div class="grid-2">
                <div class="card-soft"><div class="card-sub">Выручка</div><div style="font-size:20px;font-weight:800;">${fmtRub(existingToday.revenue)}</div></div>
                <div class="card-soft"><div class="card-sub">Средний чек</div><div style="font-size:20px;font-weight:800;">${fmtRub(existingToday.avgCheck)}</div></div>
                <div class="card-soft"><div class="card-sub">Наличные</div><div style="font-weight:700;">${fmtRub(existingToday.cash)}</div></div>
                <div class="card-soft"><div class="card-sub">Безналичные</div><div style="font-weight:700;">${fmtRub(existingToday.card)}</div></div>
              </div>
              ${revInfo && revInfo.reviewNote ? `<div class="card-soft" style="margin-top:12px;"><b>Комментарий владельца:</b> ${esc(revInfo.reviewNote)}</div>` : ''}
            </div>
          </div>`;
        return;
      }

      const step = cashDraft.step || 1;
      let stepHtml = '';
      if (step === 1) {
        stepHtml = `
          <h3 class="card-title">Шаг 1 из 4. Показания счётчиков</h3>
          <div class="card-sub" style="margin-bottom:12px;">Введите данные за текущую смену (${esc(TODAY)})</div>
          <div class="field"><label>Сотрудник 1</label><select id="c-s1">${(staffNames.length ? staffNames : [authed]).map((n) => `<option value="${esc(n)}" ${n === (cashDraft.staff1 || authed) ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select></div>
          <div class="field"><label>Показание счётчика (Сотрудник 1)</label><input id="c-cnt1" type="number" min="0" inputmode="numeric" value="${esc(cashDraft.counter1)}" placeholder="Например: 642"><span class="field-hint">Число на счётчике кофемашины на конец смены</span></div>
          <div class="field"><label>Сотрудник 2 (если работали вдвоём)</label><select id="c-s2"><option value="">Нет второго сотрудника</option>${staffNames.map((n) => `<option value="${esc(n)}" ${n === cashDraft.staff2 ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select></div>
          <div class="field"><label>Показание счётчика (Сотрудник 2, если есть)</label><input id="c-cnt2" type="number" min="0" inputmode="numeric" value="${esc(cashDraft.counter2)}" placeholder="Необязательно"></div>
          <button class="btn btn-primary btn-full" id="c-next">Далее: Денежные операции →</button>`;
      } else if (step === 2) {
        stepHtml = `
          <h3 class="card-title">Шаг 2 из 4. Денежные операции</h3>
          <div class="card-sub" style="margin-bottom:12px;">Наличные, безналичные, списания и расходы</div>
          <div class="grid-2">
            <div class="field"><label>Наличные (₽)</label><input id="c-cash" type="number" min="0" inputmode="decimal" value="${esc(cashDraft.cash)}" placeholder="0"></div>
            <div class="field"><label>Безналичные (₽)</label><input id="c-card" type="number" min="0" inputmode="decimal" value="${esc(cashDraft.card)}" placeholder="0"></div>
          </div>
          <div class="grid-3">
            <div class="field"><label>Количество чеков</label><input id="c-chks" type="number" min="0" inputmode="numeric" value="${esc(cashDraft.checks)}" placeholder="0"></div>
            <div class="field"><label>Списания (₽)</label><input id="c-wo" type="number" min="0" inputmode="decimal" value="${esc(cashDraft.writeoff)}" placeholder="0"></div>
            <div class="field"><label>Расходы из кассы (₽)</label><input id="c-exp" type="number" min="0" inputmode="decimal" value="${esc(cashDraft.expenses)}" placeholder="0"></div>
          </div>
          <div class="card-soft" style="margin-bottom:12px;">
            <div class="row-between"><span>Итого выручка:</span><b>${fmtRub(totalRev)}</b></div>
            <div class="row-between" style="margin-top:4px;"><span>Средний чек:</span><b>${checksNum > 0 ? fmtRub(avgChk) : '—'}</b></div>
          </div>
          <div class="row"><button class="btn" style="flex:1;" id="c-prev">← Назад</button><button class="btn btn-primary" style="flex:2;" id="c-next">Далее: Подтверждение →</button></div>`;
      } else if (step === 3) {
        stepHtml = `
          <h3 class="card-title">Шаг 3 из 4. Подтверждение</h3>
          <div class="card-sub" style="margin-bottom:12px;">Прикрепите фото Z-отчёта и добавьте комментарий при необходимости</div>
          <div class="field">
            <label>Фото Z-отчёта / кассы</label>
            <label class="btn btn-full" style="cursor:pointer;">📷 ${cashDraft.photoUrl ? 'Переснять фото Z-отчёта' : 'Сделать фото Z-отчёта'}<input type="file" accept="image/*" capture="environment" id="c-photo" style="display:none;"></label>
            ${cashDraft.photoUrl ? `<div style="margin-top:6px;"><span class="badge good">Фото прикреплено</span></div>` : ''}
          </div>
          <div class="field"><label>Комментарий к смене</label><textarea id="c-cmt" placeholder="Например: размен оставлен, расхождений нет">${esc(cashDraft.comment)}</textarea></div>
          <div class="row"><button class="btn" style="flex:1;" id="c-prev">← Назад</button><button class="btn btn-primary" style="flex:2;" id="c-next">Далее: Проверка и отправка →</button></div>`;
      } else {
        stepHtml = `
          <h3 class="card-title">Шаг 4 из 4. Итоговый просмотр</h3>
          <div class="card-sub" style="margin-bottom:12px;">Проверьте все цифры перед отправкой владельцу</div>
          <div class="card-soft stack-sm" style="margin-bottom:14px;">
            <div class="row-between"><span>Дата и сотрудник:</span><b>${esc(TODAY)} · ${esc(cashDraft.staff1 || authed)}</b></div>
            <div class="row-between"><span>Счётчик:</span><b>${esc(cashDraft.counter1 || '—')}${cashDraft.counter2 ? (' / ' + esc(cashDraft.counter2)) : ''}</b></div>
            <div class="row-between"><span>Наличные:</span><b>${fmtRub(cashNum)}</b></div>
            <div class="row-between"><span>Безналичные:</span><b>${fmtRub(cardNum)}</b></div>
            <div class="row-between"><span>Выручка итого:</span><b style="font-size:17px;">${fmtRub(totalRev)}</b></div>
            <div class="row-between"><span>Чеков / Средний чек:</span><b>${checksNum} / ${checksNum > 0 ? fmtRub(avgChk) : '—'}</b></div>
            <div class="row-between"><span>Списания / Расходы:</span><b>${fmtRub(woNum)} / ${fmtRub(expNum)}</b></div>
            ${cashDraft.comment ? `<div class="row-between"><span>Комментарий:</span><b>${esc(cashDraft.comment)}</b></div>` : ''}
          </div>
          <div class="row"><button class="btn" style="flex:1;" id="c-prev">← Исправить</button><button class="btn btn-primary" style="flex:2;" id="c-submit">Отправить отчёт владельцу</button></div>`;
      }

      body.innerHTML = `
        <div class="stack">
          ${revInfo && revInfo.status === 'Нужно исправить' ? `<div class="card-soft" style="border-color:var(--bad);"><b>Отчёт возвращён на исправление:</b> ${esc(revInfo.reviewNote || 'Проверьте введённые суммы')}</div>` : ''}
          <div class="card">
            <div class="stepper">${[1, 2, 3, 4].map((n) => `<div class="step-dot ${n < step ? 'done' : (n === step ? 'active' : '')}"></div>`).join('')}</div>
            ${stepHtml}
          </div>
        </div>`;

      const bindStep1 = () => {
        cashDraft.staff1 = document.getElementById('c-s1').value;
        cashDraft.counter1 = document.getElementById('c-cnt1').value.trim();
        cashDraft.staff2 = document.getElementById('c-s2').value;
        cashDraft.counter2 = document.getElementById('c-cnt2').value.trim();
        saveCashDraft(cashDraft);
      };
      const bindStep2 = () => {
        cashDraft.cash = document.getElementById('c-cash').value;
        cashDraft.card = document.getElementById('c-card').value;
        cashDraft.checks = document.getElementById('c-chks').value;
        cashDraft.writeoff = document.getElementById('c-wo').value;
        cashDraft.expenses = document.getElementById('c-exp').value;
        saveCashDraft(cashDraft);
      };
      if (step === 1) {
        document.getElementById('c-next').onclick = () => {
          bindStep1();
          if (cashDraft.counter1 !== '' && Number(cashDraft.counter1) < 0) { showToast('Показание счётчика не может быть отрицательным'); return; }
          cashDraft.step = 2; saveCashDraft(cashDraft); render();
        };
      } else if (step === 2) {
        ['c-cash', 'c-card', 'c-chks', 'c-wo', 'c-exp'].forEach((id) => {
          document.getElementById(id).oninput = () => { bindStep2(); };
        });
        document.getElementById('c-prev').onclick = () => { bindStep2(); cashDraft.step = 1; saveCashDraft(cashDraft); render(); };
        document.getElementById('c-next').onclick = () => {
          bindStep2();
          if ([cashDraft.cash, cashDraft.card, cashDraft.checks, cashDraft.writeoff, cashDraft.expenses].some((v) => Number(v) < 0)) {
            showToast('Суммы и количество чеков не могут быть отрицательными'); return;
          }
          if ((Number(cashDraft.cash) || 0) + (Number(cashDraft.card) || 0) <= 0) {
            showToast('Укажите выручку за смену (наличные или безналичные)'); return;
          }
          cashDraft.step = 3; saveCashDraft(cashDraft); render();
        };
      } else if (step === 3) {
        document.getElementById('c-photo').onchange = (e) => {
          const f = e.target.files && e.target.files[0];
          if (!f) return;
          compressAndUploadPhoto(f, { block: 'Касса', kind: 'cash' }, (url) => {
            cashDraft.photoUrl = url; saveCashDraft(cashDraft); render();
          });
        };
        document.getElementById('c-cmt').oninput = (e) => { cashDraft.comment = e.target.value; saveCashDraft(cashDraft); };
        document.getElementById('c-prev').onclick = () => { cashDraft.step = 2; saveCashDraft(cashDraft); render(); };
        document.getElementById('c-next').onclick = () => { cashDraft.step = 4; saveCashDraft(cashDraft); render(); };
      } else {
        document.getElementById('c-prev').onclick = () => { cashDraft.step = 2; saveCashDraft(cashDraft); render(); };
        document.getElementById('c-submit').onclick = () => {
          const rec = {
            date: TODAY, who: cashDraft.staff1 || authed, barista: cashDraft.staff1 || authed,
            cash: cashNum, card: cardNum, revenue: totalRev, total: totalRev,
            checks: checksNum, writeoff: woNum, avgCheck: avgChk
          };
          state.cash = [rec].concat((state.cash || []).filter((x) => !(x.date === TODAY && x.who === rec.who)));
          state.cashReviews = state.cashReviews || {};
          state.cashReviews[TODAY + '|' + rec.who] = { date: TODAY, barista: rec.who, status: 'На проверке', reviewNote: '' };
          saveStateLocal();
          if (C) {
            C.enqueueOp('submit_cash', Object.assign({}, rec, { userName: rec.who, counterEnd: cashDraft.counter1, comment: cashDraft.comment, photoUrl: cashDraft.photoUrl }));
            if (expNum > 0) C.enqueueOp('add_expense', { id: 'EXP-' + Date.now(), date: TODAY, category: 'Из кассы', amount: expNum, comment: cashDraft.comment || 'Расход за смену', who: rec.who });
          }
          cashDraft = { step: 1, date: TODAY, staff1: authed, counter1: '', staff2: '', counter2: '', cash: '', card: '', checks: '', writeoff: '0', expenses: '0', photoUrl: '', comment: '' };
          saveCashDraft(cashDraft);
          showToast('Отчёт отправлен на проверку');
          render();
        };
      }
      return;
    }

    // 4. ПОЛОМКИ
    if (tab === 'incidents') {
      const statusBadge = (st) => {
        if (st === 'Решена') return 'good';
        if (st === 'В работе' || st === 'Принята') return 'accent';
        if (st === 'Ожидает запчасть') return 'warn';
        return 'bad';
      };
      body.innerHTML = `
        <div class="stack">
          <div class="card">
            <h2 class="card-title" style="margin-bottom:4px;">Сообщить о поломке</h2>
            <div class="card-sub" style="margin-bottom:12px;">Администратор сразу получит уведомление в Telegram</div>
            <div class="field"><label>1. Оборудование или место</label><select id="inc-eq">${EQUIP_LIST.map((x) => `<option ${x === incForm.equip ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select></div>
            <div class="field"><label>2. Срочность</label><select id="inc-pr">${INC_TYPES.map((x) => `<option ${x === incForm.priority ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select></div>
            <div class="field"><label>3. Опишите неисправность</label><textarea id="inc-tx" placeholder="Что случилось и как проявляется?">${esc(incForm.text)}</textarea></div>
            <div class="field">
              <label>4. Фото или видео</label>
              <label class="btn btn-full" style="cursor:pointer;">📷 ${incForm.photoUrl ? 'Фото прикреплено (переснять)' : 'Прикрепить фото с камеры'}<input type="file" accept="image/*" capture="environment" id="inc-ph" style="display:none;"></label>
            </div>
            <button class="btn btn-primary btn-full" id="inc-send">5. Отправить обращение</button>
          </div>

          <div class="card">
            <h2 class="card-title" style="margin-bottom:10px;">Мои и активные обращения (${(state.incidents || []).length})</h2>
            <div class="stack-sm">
              ${(state.incidents || []).length ? state.incidents.slice(0, 15).map((i) => `
                <div class="card-soft">
                  <div class="row-between">
                    <b>${esc(i.id)} · ${esc(i.step || i.zone)}</b>
                    <span class="badge ${statusBadge(i.status)}">${esc(i.status || 'Новая')}</span>
                  </div>
                  <div style="margin-top:4px;font-size:14px;">${esc(i.text)}</div>
                  <div class="card-sub" style="margin-top:4px;">Дата: ${esc(i.date)} · Ответственный: ${esc(i.owner || 'Администратор')}${i.photoUrl ? ` · <a href="${esc(i.photoUrl)}" target="_blank" rel="noopener">Фото</a>` : ''}</div>
                  ${i.history && i.history.length ? `<div class="card-sub" style="margin-top:3px;color:var(--accent);">Комментарий: ${esc(i.history[i.history.length - 1].comment || i.history[i.history.length - 1].status || '')}</div>` : ''}
                </div>`).join('') : `<div class="empty-state"><div class="empty-title">Обращений пока нет</div><div class="empty-sub">Если что-то сломается, сообщите через форму выше</div></div>`}
            </div>
          </div>
        </div>`;
      document.getElementById('inc-eq').onchange = (e) => { incForm.equip = e.target.value; };
      document.getElementById('inc-pr').onchange = (e) => { incForm.priority = e.target.value; };
      document.getElementById('inc-tx').oninput = (e) => { incForm.text = e.target.value; };
      document.getElementById('inc-ph').onchange = (e) => {
        const f = e.target.files && e.target.files[0];
        if (!f) return;
        compressAndUploadPhoto(f, { block: incForm.equip, kind: 'incident' }, (url) => { incForm.photoUrl = url; render(); });
      };
      document.getElementById('inc-send').onclick = () => {
        const txt = (incForm.text || '').trim();
        if (!txt) { showToast('Опишите неисправность перед отправкой'); return; }
        const id = 'INC-' + String(Date.now()).slice(-6);
        const rec = { id, date: TODAY, time: nowHHMM(), step: incForm.equip, zone: incForm.equip, text: txt, priority: incForm.priority, status: 'Новая', who: authed, owner: 'Администратор', photoUrl: incForm.photoUrl };
        state.incidents.unshift(rec);
        saveStateLocal();
        if (C) {
          C.enqueueOp('report_standalone_incident', Object.assign({}, rec, { userName: authed, comment: txt, photo: rec.photoUrl, photo_url: rec.photoUrl }));
        }
        incForm = { equip: EQUIP_LIST[0], priority: INC_TYPES[1], text: '', photoUrl: '' };
        showToast('Обращение ' + id + ' отправлено — администратор уведомлён');
        render();
      };
      return;
    }

    // 5. ТТК (База знаний)
    if (tab === 'ttk') {
      const cats = ['Все'].concat([...new Set((state.ttk || []).map((k) => k.cat || 'Классика'))]);
      const list = (state.ttk || []).filter((k) => {
        const okCat = ttkCat === 'Все' || (k.cat || 'Классика') === ttkCat;
        const okQ = !ttkQuery || String(k.name + ' ' + k.recipe + ' ' + k.cat).toLowerCase().includes(ttkQuery.toLowerCase());
        return okCat && okQ;
      });
      body.innerHTML = `
        <div class="stack">
          <div class="card">
            <h2 class="card-title" style="margin-bottom:10px;">Технологические карты</h2>
            <div class="field" style="margin-bottom:10px;"><input id="ttk-q" value="${esc(ttkQuery)}" placeholder="Поиск напитка по названию или составу..."></div>
            <div class="subtabs">${cats.map((c) => `<button data-cat="${esc(c)}" class="${c === ttkCat ? 'active' : ''}">${esc(c)}</button>`).join('')}</div>
          </div>
          ${list.length ? list.map((k) => `
            <div class="card">
              <div class="row-between" style="align-items:flex-start;">
                <div>
                  <div style="font-weight:800;font-size:16px;">☕ ${esc(k.name)}</div>
                  <div class="card-sub">${esc(k.cat)} · ${esc(k.vol)} · ⏱ ${esc(k.prepTime || '2 мин')}</div>
                </div>
                <span class="badge accent">${fmtRub(k.price)}</span>
              </div>
              <div class="card-soft" style="margin-top:10px;">
                <div style="font-weight:600;font-size:13px;margin-bottom:4px;">Состав и приготовление</div>
                <div style="font-size:14px;white-space:pre-line;">${esc(k.recipe || 'По стандарту Coffee Illy')}</div>
                ${k.serve ? `<div class="card-sub" style="margin-top:6px;">Подача: ${esc(k.serve)}</div>` : ''}
              </div>
              <div class="row-between card-sub" style="margin-top:8px;">
                <span>Аллергены: ${esc(k.allergens || 'Нет')}</span>
                <span>Обновлено: ${esc(k.updatedAt || TODAY)}</span>
              </div>
            </div>`).join('') : `<div class="empty-state"><div class="empty-title">Карты не найдены</div><div class="empty-sub">Попробуйте изменить запрос или категорию</div></div>`}
        </div>`;
      const qEl = document.getElementById('ttk-q');
      qEl.oninput = (e) => { ttkQuery = e.target.value; render(); document.getElementById('ttk-q').focus(); };
      body.querySelectorAll('[data-cat]').forEach((b) => { b.onclick = () => { ttkCat = b.dataset.cat; render(); }; });
    }
  }

  document.querySelectorAll('#bnav button').forEach((b) => {
    b.onclick = () => { tab = b.dataset.t; if (tab !== 'tasks') activeBlock = null; render(); };
  });

  render();
  runAutoLogin();
  if (C) {
    cloudLoop = C.startCloudLoop({
      mode: 'terminal',
      getState: () => state,
      onStatus: updateSyncPill,
      onSynced: (st) => {
        saveStateLocal();
        if (!authed) runAutoLogin();
        else applyDeepLinkIfNeeded();
        render();
      }
    });
  }
})();
</script>
</body>
</html>
