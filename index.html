<style>

:root {
  --bg: #FCF8F4; --surface: #F4ECE4; --surface-2: #EAE0D5; --card: #FFFFFF;
  --ink: #271C15; --muted: #6E5D51; --accent: #7D4E24; --accent-soft: rgba(125,78,36,0.12);
  --accent-ink: #FFFFFF; --good: #266D45; --good-soft: rgba(38,109,69,0.12);
  --warn: #A46200; --warn-soft: rgba(164,98,0,0.13); --bad: #B33A3A; --bad-soft: rgba(179,58,58,0.12);
  --border: rgba(39,28,21,0.10); --shadow: 0 2px 10px rgba(39,28,21,0.05);
  --radius-card: 24px; --radius-pill: 999px;
  --font: system-ui, -apple-system, 'Segoe UI', Roboto, Inter, sans-serif;
}
html[data-theme="dark"] {
  --bg: #171311; --surface: #221D1A; --surface-2: #2E2723; --card: #26201D;
  --ink: #F2E7DF; --muted: #B8A79A; --accent: #E8B88A; --accent-soft: rgba(232,184,138,0.16);
  --accent-ink: #2B1A0D; --good: #8AD6A7; --good-soft: rgba(138,214,167,0.15);
  --warn: #F0BE6F; --warn-soft: rgba(240,190,111,0.15); --bad: #F2A2A2; --bad-soft: rgba(242,162,162,0.15);
  --border: rgba(242,231,223,0.10); --shadow: 0 2px 14px rgba(0,0,0,0.28);
}
* { box-sizing: border-box; }
html, body { margin:0; padding:0; background:var(--bg); color:var(--ink); font-family:var(--font); font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased; transition:background .2s,color .2s; }
button, input, select, textarea { font-family:inherit; color:inherit; }
button { cursor:pointer; border:none; background:transparent; }
.topbar { position:sticky; top:0; z-index:40; background:var(--bg); border-bottom:1px solid var(--border); padding:10px 18px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
.brand { display:flex; align-items:center; gap:10px; }
.brand-dot { width:36px; height:36px; border-radius:14px; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; font-weight:800; font-size:15px; }
.brand-title { font-weight:750; font-size:16px; }
.brand-sub { font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.live-pill { display:inline-flex; align-items:center; gap:5px; padding:2px 9px; border-radius:999px; background:var(--good-soft); color:var(--good); font-weight:650; font-size:11px; }
.live-dot { width:7px; height:7px; border-radius:50%; background:currentColor; }
.top-actions { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.chip-btn { padding:7px 13px; border-radius:999px; background:var(--surface); border:1px solid var(--border); font-size:12.5px; font-weight:650; display:inline-flex; align-items:center; gap:6px; }
.chip-btn:hover { background:var(--surface-2); }
.chip-btn.accent { background:var(--accent); color:var(--accent-ink); border-color:transparent; }
.chip-btn.good { background:var(--good-soft); color:var(--good); border-color:transparent; }
.chip-btn.bad { background:var(--bad-soft); color:var(--bad); border-color:transparent; }
.chip-btn.warn { background:var(--warn-soft); color:var(--warn); border-color:transparent; }
.seg { display:inline-flex; background:var(--surface); padding:4px; border-radius:999px; border:1px solid var(--border); gap:2px; }
.seg button { padding:6px 12px; border-radius:999px; font-size:12.5px; font-weight:650; color:var(--muted); }
.seg button.active { background:var(--accent); color:var(--accent-ink); }
.card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius-card); padding:18px; box-shadow:var(--shadow); }
.card-soft { background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:12px 14px; }
.card-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
.card-title { font-size:16px; font-weight:750; margin:0; }
.card-sub { font-size:12px; color:var(--muted); }
.badge { display:inline-flex; align-items:center; justify-content:center; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:700; background:var(--surface-2); color:var(--ink); }
.badge.good { background:var(--good-soft); color:var(--good); }
.badge.warn { background:var(--warn-soft); color:var(--warn); }
.badge.bad { background:var(--bad-soft); color:var(--bad); }
.badge.accent { background:var(--accent-soft); color:var(--accent); }
.stack { display:flex; flex-direction:column; gap:10px; }
.row-item { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 14px; border-radius:18px; background:var(--surface); border:1px solid var(--border); flex-wrap:wrap; }
.row-main { min-width:0; flex:1; }
.row-title { font-weight:700; font-size:14px; }
.row-sub { font-size:12px; color:var(--muted); margin-top:2px; }
.pbar { height:7px; background:var(--surface-2); border-radius:99px; overflow:hidden; margin-top:6px; }
.pbar > div { height:100%; background:var(--accent); border-radius:99px; transition:width .25s; }
.pbar.good > div { background:var(--good); }
.field { display:flex; flex-direction:column; gap:5px; margin-bottom:10px; }
.field label { font-size:12px; font-weight:700; color:var(--muted); }
.field input, .field select, .field textarea { width:100%; padding:9px 12px; border-radius:14px; background:var(--surface); border:1px solid var(--border); font-size:14px; }
.grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.grid-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
@media (max-width:640px) { .grid-2, .grid-3 { grid-template-columns:1fr; } }
.btn-lg { width:100%; padding:12px 16px; border-radius:999px; font-size:14px; font-weight:750; display:inline-flex; align-items:center; justify-content:center; gap:8px; }
.btn-lg.primary { background:var(--accent); color:var(--accent-ink); }
.btn-lg.primary:disabled { opacity:0.45; cursor:not-allowed; }
.btn-lg.danger { background:var(--bad-soft); color:var(--bad); }
.btn-lg.soft { background:var(--surface-2); color:var(--ink); }
.tbl-wrap { overflow-x:auto; }
table { width:100%; border-collapse:collapse; font-size:13.5px; }
th, td { text-align:left; padding:9px 10px; border-bottom:1px solid var(--border); vertical-align:middle; }
th { font-size:11.5px; text-transform:uppercase; letter-spacing:0.03em; color:var(--muted); font-weight:700; }
tr:last-child td { border-bottom:none; }
.modal-bg { position:fixed; inset:0; background:rgba(0,0,0,0.48); z-index:80; display:none; align-items:center; justify-content:center; padding:16px; }
.modal-bg.open { display:flex; }
.modal-card { background:var(--card); border:1px solid var(--border); border-radius:28px; max-width:480px; width:100%; padding:20px; box-shadow:0 20px 50px rgba(0,0,0,0.3); max-height:86vh; overflow-y:auto; }
.toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:999px; font-size:13.5px; font-weight:650; opacity:0; pointer-events:none; z-index:90; transition:opacity .2s,transform .2s; box-shadow:0 8px 24px rgba(0,0,0,0.22); }
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

body { display:flex; flex-direction:column; min-height:100vh; }
.shell { max-width:460px; width:100%; margin:0 auto; flex:1; display:flex; flex-direction:column; padding:14px 14px 86px; gap:12px; }
.step-card { background:var(--card); border:1px solid var(--border); border-radius:26px; padding:18px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:12px; }
.step-counter { font-size:12px; font-weight:700; color:var(--accent); display:flex; justify-content:space-between; }
.step-title { font-size:19px; font-weight:800; margin:0; line-height:1.25; }
.step-inst { background:var(--surface); border-radius:16px; padding:12px; font-size:13px; color:var(--muted); white-space:pre-line; }
.photo-box { border:1.5px dashed var(--border); border-radius:18px; padding:14px; text-align:center; background:var(--surface); }
.photo-box.done { border-style:solid; border-color:var(--good); background:var(--good-soft); color:var(--good); }
.pin-dots { display:flex; justify-content:center; gap:12px; margin:8px 0 4px; }
.pin-dot { width:14px; height:14px; border-radius:50%; border:2px solid var(--accent); }
.pin-dot.filled { background:var(--accent); }
.pin-pad { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:6px; }
.pin-key { height:52px; border-radius:16px; background:var(--surface); border:1px solid var(--border); font-size:18px; font-weight:750; display:grid; place-items:center; }
.pin-key:hover { background:var(--surface-2); }
.bnav { position:fixed; bottom:0; left:0; right:0; background:var(--surface); border-top:1px solid var(--border); display:grid; grid-template-columns:repeat(4,1fr); max-width:460px; margin:0 auto; padding:8px 10px 10px; gap:4px; z-index:40; }
.bnav button { display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 4px; border-radius:16px; font-size:11px; font-weight:650; color:var(--muted); }
.bnav button .ico { padding:4px 14px; border-radius:999px; font-size:15px; }
.bnav button.active { color:var(--ink); }
.bnav button.active .ico { background:var(--accent-soft); color:var(--accent); }

/* === Coffee Illy v93.1 Responsive System (Phones · Tablets · Desktop) === */
html { -webkit-text-size-adjust: 100%; }
body { overflow-x: hidden; padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right); }
.kpi-val, .bar-val, td, .badge { font-variant-numeric: tabular-nums; }
.chip-btn, .admin-nav button, .date-pill, .btn-lg, .pin-key, .bnav button {
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  transition: background .16s ease, transform .1s ease, border-color .16s ease, box-shadow .16s ease;
}
.chip-btn:active, .btn-lg:active, .pin-key:active { transform: scale(0.98); }
.tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 14px; }
.tbl-wrap table { min-width: 520px; }

/* Terminal: Responsive Shell (Phone -> Tablet -> PC) */
.topbar {
  max-width: 100% !important;
  width: 100%;
  margin: 0 auto;
  padding: max(10px, env(safe-area-inset-top)) 16px 10px;
}
.shell {
  width: 100%;
  max-width: 520px;
  margin: 0 auto;
  padding: 14px 14px calc(88px + env(safe-area-inset-bottom));
}
.bnav {
  max-width: 520px;
  padding: 8px 10px max(10px, env(safe-area-inset-bottom));
}
#user-ctl { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

/* Phones (<= 600px) */
@media (max-width: 600px) {
  .topbar { padding: max(8px, env(safe-area-inset-top)) 12px 8px; gap: 8px; }
  .brand-dot { width: 34px; height: 34px; border-radius: 12px; font-size: 14px; }
  .brand-title { font-size: 15px; }
  .top-actions { width: 100%; justify-content: space-between; gap: 6px; }
  .chip-btn { min-height: 36px; padding: 6px 11px; font-size: 12px; }
  .shell { max-width: 100%; padding: 12px 12px calc(86px + env(safe-area-inset-bottom)); }
  .step-card, .card { border-radius: 22px; padding: 15px; }
  .step-title { font-size: 18px; }
  .field input, .field select, .field textarea { font-size: 16px; min-height: 44px; padding: 10px 12px; }
  .btn-lg { min-height: 48px; font-size: 14.5px; }
  .pin-key { height: 54px; font-size: 19px; }
  .bnav { max-width: 100%; left: 0; right: 0; border-radius: 0; }
  .bnav button { min-height: 48px; }
  .modal-bg { align-items: flex-end; padding: 0; }
  .modal-card {
    max-width: 100%;
    border-radius: 26px 26px 0 0;
    padding: 18px 16px calc(22px + env(safe-area-inset-bottom));
    max-height: 88vh;
  }
  .toast { bottom: calc(78px + env(safe-area-inset-bottom)); max-width: calc(100vw - 24px); text-align: center; }
}

/* Tablets (601px - 1024px) */
@media (min-width: 601px) and (max-width: 1024px) {
  .topbar { padding: 12px 24px; }
  .shell { max-width: 720px; padding: 20px 20px 104px; gap: 14px; }
  .step-card, .card { padding: 22px; }
  .step-title { font-size: 21px; }
  .pin-pad { max-width: 340px; margin: 10px auto 0; gap: 10px; }
  .pin-key { height: 56px; }
  .bnav {
    max-width: 540px;
    bottom: 14px;
    border: 1px solid var(--border);
    border-radius: 999px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
    padding: 6px 10px;
  }
}

/* Desktop / PC (>= 1025px) */
@media (min-width: 1025px) {
  .topbar { padding: 12px 32px; }
  .shell { max-width: 820px; padding: 24px 24px 112px; gap: 16px; }
  .step-card, .card { padding: 24px 26px; }
  .step-title { font-size: 22px; }
  .pin-pad { max-width: 340px; margin: 12px auto 0; gap: 10px; }
  .pin-key { height: 56px; }
  .bnav {
    max-width: 560px;
    bottom: 18px;
    border: 1px solid var(--border);
    border-radius: 999px;
    box-shadow: 0 12px 34px rgba(0, 0, 0, 0.22);
    padding: 6px 12px;
  }
  .bnav button { flex-direction: row; justify-content: center; gap: 6px; padding: 8px 12px; font-size: 13px; }
  .bnav button .ico { padding: 3px 8px; }
}


/* === Coffee Illy v97.3.0 Minimalist Single-Window & Mobile Keyboard Fixes === */
body.kb-open .bnav { display: none !important; }
.kb-done-bar { display:none; position:fixed; bottom:10px; right:14px; z-index:95; }
body.kb-open .kb-done-bar { display:block; }
.kb-done-btn { padding:9px 16px; border-radius:999px; background:var(--ink); color:var(--bg); font-size:13px; font-weight:750; box-shadow:0 6px 20px rgba(0,0,0,0.28); }
.inst-toggle-wrap { display:flex; justify-content:center; width:100%; }
.inst-toggle-btn { min-width:56px; height:32px; padding:0 18px; border-radius:999px; background:var(--surface); border:1px solid var(--border); display:inline-flex; align-items:center; justify-content:center; font-size:14px; font-weight:750; color:var(--muted); }
.cat-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.cat-card { background:var(--card); border:1px solid var(--border); border-radius:20px; padding:16px 14px; text-align:left; display:flex; flex-direction:column; gap:6px; box-shadow:var(--shadow); }
.cat-card:active { transform:scale(0.98); }
.cat-ico { font-size:22px; line-height:1; }
.cat-name { font-size:14.5px; font-weight:750; color:var(--ink); }
.cat-cnt { font-size:12px; color:var(--muted); }
.bottom-search-wrap { position:fixed; left:0; right:0; bottom:calc(68px + env(safe-area-inset-bottom)); z-index:35; max-width:520px; margin:0 auto; padding:6px 14px; pointer-events:none; }
.bottom-search-wrap input { pointer-events:auto; width:100%; padding:11px 16px; border-radius:999px; background:var(--card); border:1px solid var(--border); box-shadow:0 6px 20px rgba(0,0,0,0.12); font-size:15px; }
body.kb-open .bottom-search-wrap { bottom:10px; padding-right:110px; }
.center-action-wrap { display:flex; flex-direction:column; align-items:center; justify-content:center; margin:8px 0 10px; }

ию:\n• Столы насухо протёрты от пыли и крошек дезинфицирующим средством.\n• Диваны и кресла устойчивы, обивка без пятен и мусора.\n• Декор на столах и полках выровнен по центру, свечи установлены.\n• Сделать обзорное фото чистого зала.", "photo": true, "owner": "Администратор"}, {"id": "o03", "block": "Открытие", "group": "Открытие · Стандарт (o01–o08)", "title": "☕ Кофемашина", "instruction": "Подготовка кофемашины к смене:\n• Кофемашина включена, бойлер вышел на рабочее давление и температуру.\n• Холдеры (портафильтры) чистые и прогретые, старый жмых полностью отсутствует.\n• Группы пролиты горячей водой и прогреты.\n• Хромированные детали и корпус натёрты микрофиброй до блеска, подтёки и накипь отсутствуют.", "photo": true, "owner": "Техник"}, {"id": "o04", "block": "Открытие", "group": "Открытие · Стандарт (o01–o08)", "title": "⚙️ Гриндеры и Проверка помола", "instruction": "Настройка кофемолок (гриндеров) и эспрессо:\n• Гриндеры включены, бункеры заполнены свежим зерном.\n• Проверен и настроен помол: контрольный пролив эспрессо по весам и таймеру (проверка граммовки, времени экстракции и вкуса).\n• Зона вокруг дозатора и стол под гриндером очищены, остатки молотого кофе отсутствуют.\n• Зафиксировать утренние показания счётчика кофемашины.", "photo": true, "owner": "Шеф-бариста"}, {"id": "o05", "block": "Открытие", "group": "Открытие · Стандарт (o01–o08)", "title": "🔥 Термопот", "instruction": "Проверка водонагревателя (термопота):\n• Включён в сеть, заполнен очищенной питьевой водой до отметки максимума.\n• Температура воды вышла на рабочий режим (92–95 °C).\n• Корпус и каплесборник чистые, без подтёков и накипи.", "photo": false, "owner": "Техник"}, {"id": "o06", "block": "Открытие", "group": "Открытие · Стандарт (o01–o08)", "title": "💡 Оборудование и подсветка", "instruction": "Включение света, звука и медиа:\n• Проектор, аудиоколонки (фоновая музыка на комфортной громкости) и декоративная подсветка включены.\n• Световая инсталляция и освещение у зеркала работают без мерцаний.", "photo": false, "owner": "Техник"}, {"id": "o07", "block": "Открытие", "group": "Открытие · Стандарт (o01–o08)", "title": "🌿 Летняя терраса Фото", "instruction": "Подготовка уличной зоны / летней террасы:\n• Уличные столы и стулья аккуратно расставлены по местам и насухо протёрты.\n• Пледы чистые, без пятен, аккуратно сложены.\n• Прилегающая территория и входная группа чистые, без мусора и листьев.\n• Сделать контрольное фото летней террасы.", "photo": true, "owner": "Администратор"}, {"id": "o08", "block": "Открытие", "group": "Открытие · Стандарт (o01–o08)", "title": "🧼 Санузел для гостей 📸 2", "instruction": "Важно !!! Полная утренняя проверка гостевого санузла (сделать 2 фото):\n• 🪞 Зеркало: протёрто средством для стёкол без разводов и следов пальцев, поверхность блестящая.\n• 🧻 Расходники: жидкое мыло в дозаторе в наличии, туалетная бумага и бумажные полотенца пополнены.\n• 🚽 Унитаз и бачок: чистые, обработаны, кнопка слива работает исправно, протечек нет, посторонний запах отсутствует.\n• 🗑 Мусорное ведро 📸: пустое, чистое, заправлен новый мусорный пакет.", "photo": true, "owner": "Администратор"}, {"id": "d01", "block": "Лайн Чек 1", "group": "День · Обход смены (d01–d06)", "title": "🌬️ Помещение проветрено и свежесть воздуха", "instruction": "Контроль микроклимата в зале:\n• Помещение проветрено, работает вентиляция или кондиционер по сезону.\n• Нет затхлого запаха, запаха гари или кухни, воздух в зале свежий и комфортный для гостей.", "photo": false, "owner": "Администратор"}, {"id": "d02", "block": "Лайн Чек 1", "group": "День · Обход смены (d01–d06)", "title": "☕ Оборудование проверено", "instruction": "Контроль работы барного оборудования в течение смены:\n• Кофемашина, кофемолка, чайник/термопот, холодильник и десертная витрина включены.\n• Все приборы держат рабочую температуру и работают штатно без аварийных сигналов и посторонних шумов.", "photo": false, "owner": "Техник"}, {"id": "d03", "block": "Лайн Чек 1", "group": "", "title": "🥛 Заготовки для напитков и молочные продукты", "instruction": "Молоко ≥5л, альтернативное молоко ≥2л, сливки ≥2 упаковок, сиропы и топпинги на своих местах, лёд готовы\n \n 📸 Фото холодильника в \"подсобке\"\n 📸 фото холодильника за стойкой", "photo": true, "owner": "Администратор"}, {"id": "d04", "block": "Лайн Чек 1", "group": "День · Обход смены (d01–d06)", "title": "🍰 Десерты и закуски", "instruction": "Контроль витрины с десертами:\n• Закуски и десерты пополнены и представлены в ДОСТАТОЧНОМ количестве.\n• Срок годности и маркировки актуальны, заветренных позиций нет.\n• Витрина чистая внутри и снаружи, фронтальное стекло без разводов и отпечатков.\n• Десерты и ценники выложены ровно и аккуратно 📸 (сделать фото витрины).", "photo": true, "owner": "Закупщик"}, {"id": "d05", "block": "Лайн Чек 1", "group": "День · Обход смены (d01–d06)", "title": "🧼 Зона гостя и стойка на виду", "instruction": "Поддержание чистоты зоны выдачи и гостевой стойки:\n• Стойка и прилавок со стороны гостя идеально чистые: нет крошек, капель кофе, пятен и липких следов.\n• Грязная посуда со столов и стойки своевременно убрана в мойку.\n• Диспенсер с салфетками, крышками, трубочками и сахаром пополнен.", "photo": true, "owner": "Администратор"}, {"id": "d06", "block": "Лайн Чек 1", "group": "День · Обход смены (d01–d06)", "title": "🚽 Санузел проверен (2-3 сек видео) 📹", "instruction": "Дневная проверка санузла для гостей:\n• Санузел чистый, пол сухой, раковина и зеркало без брызг воды.\n• Туалетная бумага, мыло и бумажные полотенца в наличии.\n• Мусорное ведро не переполнено, запах свежий.\n• 📹 Сделать короткий обзорный видео-отчёт (2–3 секунды).", "photo": true, "owner": "Администратор"}, {"id": "c01", "block": "Закрытие", "group": "Закрытие · Стандарт (c01–c14)", "title": "🧴 Диспенсер с расходниками заполнен", "instruction": "Подготовка органайзера и расходников на утро:\n• Диспенсер полностью заполнен салфетками, порционным сахаром, трубочками и размешивателями (палочками).\n• Все открытые складские упаковки с расходниками плотно закрыты от пыли и влаги.", "photo": true, "owner": "Закупщик"}, {"id": "c02", "block": "Закрытие", "group": "Закрытие · Стандарт (c01–c14)", "title": "🪑 Зал и посадочные места", "instruction": "Уборка гостевого зала перед закрытием:\n• Все столы тщательно протёрты от крошек и пятен.\n• Диваны и стулья устойчивы, очищены щёткой/пылесосом от крошек.\n• Декор выровнен, пыль на полках и подоконниках отсутствует.\n• Все свечи в зале обязательно погашены.", "photo": true, "owner": "Администратор"}, {"id": "c03", "block": "Закрытие", "group": "Закрытие · Стандарт (c01–c14)", "title": "☕ Кофемашина", "instruction": "Замывка и выключение кофемашины:\n• Проведена промывка групп со слепым фильтром и профессиональным средством (Cafiza), затем промывка чистой водой.\n• Холдеры и сита вымыты, кофейный жмых и масла полностью удалены, съёмные детали и решётка поддона промыты и установлены на место.\n• Стимеры (паровые трубки) очищены от молока и продуты.\n• Подтёков воды и накипи нет, хромированные детали натёрты насухо. Кофемашина выключена.", "photo": true, "owner": "Техник"}, {"id": "c04", "block": "Закрытие", "group": "Закрытие · Стандарт (c01–c14)", "title": "⚙️ Гриндеры", "instruction": "Очистка кофемолок и фиксация счётчиков:\n• Гриндеры протёрты снаружи и в зоне выдачи, остатки молотого кофе сметены кистью, устройства выключены.\n• Показания счётчиков порций кофемашины/гриндеров сняты и внесены в кассовый отчёт смены.", "photo": true, "owner": "Шеф-бариста"}, {"id": "c05", "block": "Закрытие", "group": "Закрытие · Стандарт (c01–c14)", "title": "🧽 Рабочая зона", "instruction": "Замывка барной станции:\n• Рабочая столешница и фартук вымыты с моющим средством и протёрты насухо.\n• Липких пятен от сиропов, молока и кофе нет.\n• Весь мелкий инвентарь (питчеры, темпер, коврик, весы) чистый и расставлен по местам.", "photo": true, "owner": "Администратор"}, {"id": "c06", "block": "Закрытие", "group": "Закрытие · Стандарт (c01–c14)", "title": "🔥 Термопот", "instruction": "Отключение термопота:\n• Заполнен очищенной водой для утренней смены.\n• Питание выключено, корпус и каплесборник протёрты насухо, без подтёков.", "photo": false, "owner": "Техник"}, {"id": "c07", "block": "Закрытие", "group": "Закрытие · Стандарт (c01–c14)", "title": "💰 Касса и терминалы Фото", "instruction": "Закрытие кассовой смены:\n• Наличные в кассе пересчитаны и сверены с отчётом.\n• Разменная сумма на утро оставлена в кассе в полном объёме (250 руб мелкими купюрами).\n• Фотоотчёт кассы сделан после подсчёта.\n• Банковский терминал и чековый принтер выключены, рабочий телефон поставлен на зарядку.", "photo": true, "owner": "Администратор"}, {"id": "c08", "block": "Закрытие", "group": "Закрытие · Стандарт (c01–c14)", "title": "🍰 Холодильник и витрина", "instruction": "Уход за витриной и хранением десертов:\n• Подсветка витрины выключена (холодильный контур работает по регламенту), стёкла и полки протёрты.\n• Отпечатков пальцев и разводов на стекле нет.\n• Все десерты проверены по срокам, закрыты крышками/плёнкой от заветривания.", "photo": true, "owner": "Закупщик"}, {"id": "c09", "block": "Закрытие", "group": "Закрытие · Стандарт (c01–c14)", "title": "🪞 Зеркала и остекление", "instruction": "Натирка зеркал и входного остекления:\n• Зеркала в зале и стеклянные поверхности входной группы протёрты со средством для стёкол.\n• Разводов, брызг и следов пальцев нет, поверхности сухие.", "photo": false, "owner": "Администратор"}, {"id": "c10", "block": "Закрытие", "group": "Закрытие · Стандарт (c01–c14)", "title": "💡 Оборудование и подсветка", "instruction": "Отключение иллюминации и медиа:\n• Проектор, неоновая/декоративная подсветка, аудиоколонки и дополнительное освещение выключены.\n• Световая инсталляция у зеркал и подсветка стола — выключены.", "photo": false, "owner": "Техник"}, {"id": "c11", "block": "Закрытие", "group": "Закрытие · Стандарт (c01–c14)", "title": "🌿 Летняя терраса", "instruction": "Уборка летней террасы на ночь:\n• Уличные столы и стулья протёрты и занесены внутрь помещения (или зафиксированы по регламенту).\n• Пледы проверены (чистые, без пятен и прожогов) и аккуратно сложены на хранение.", "photo": true, "owner": "Администратор"}, {"id": "c12", "block": "Закрытие", "group": "Закрытие · Стандарт (c01–c14)", "title": "🧼 Санузел для гостей", "instruction": "Полная вечерняя уборка санузла по чек-листу:\n• 🚻 Входная дверь — проверена исправность замка и доводчика; полотно двери и ручка протёрты, без следов рук.\n• 🧴 Раковина и смеситель — вымыты и вытерты насухо; смеситель натёрт без налёта и подтёков, вода не капает.\n• 🪞 Зеркало — протёрто без разводов и следов пальцев, поверхность блестящая.\n• 🧻 Расходники — проверен и пополнен запас жидкого мыла, туалетной бумаги и бумажных полотенец на утро.\n• 🚽 Унитаз и бачок — обработаны дезсредством, крышка опущена, бачок не протекает, запах отсутствует.\n• 🧹 Пол и стены — пол вымыт с дезсредством и высушен, плитка без пятен и налёта.\n• 🗑 Мусорное ведро — освобождено, вымыто, установлен новый пакет.\n• 💡 Освещение и вентиляция — свет и вытяжка выключены, проверена исправность выключателя.", "photo": true, "owner": "Администратор"}, {"id": "c13", "block": "Закрытие", "group": "Закрытие · Стандарт (c01–c14)", "title": "🚪 Закрытие помещения", "instruction": "Финальная проверка перед выходом:\n• Все декоративные подсветки, сплит-система и барное оборудование (кроме холодильников) выключены.\n• Жалюзи / роллеты опущены, окна закрыты.", "photo": false, "owner": "Администратор"}, {"id": "c14", "block": "Закрытие", "group": "Закрытие · Стандарт (c01–c14)", "title": "🗑 Мусор выброшен, баки на улице пустые 📸💬", "instruction": "Вынос всего мусора из кофейни и уличных урн:\n• Все мусорные пакеты из-под бара, подсобки и санузла завязаны и вынесены в контейнер.\n• Уличные баки у входа очищены, внутрь вставлены чистые пакеты.\n• 📸 Сделать фото пустых баков и закрытой входной двери.", "photo": true, "owner": "Администратор"}, {"id": "pa01", "block": "Открытие", "group": "Открытие · Приёмка смены (pa01–pa21)", "title": "📸 Фото-селфи 📸", "instruction": "Фото перед началом смены.\nВолосы убраны в хвост, аккуратный внешний вид, чистая форма, минимальный макияж.", "photo": true, "owner": "Администратор"}, {"id": "pa02", "block": "Открытие", "group": "Открытие · Приёмка смены (pa01–pa21)", "title": "🌿 Летняя терраса Фото📸", "instruction": "Столы и стулья расставлены, протёрты. Пледы чистые, сложены аккуратно, территория без мусора. Сделать фото.", "photo": true, "owner": "Администратор"}, {"id": "pa03", "block": "Открытие", "group": "Открытие · Приёмка смены (pa01–pa21)", "title": "🪑 Зал и посадочные места", "instruction": "Столы чистые, без крошек и пятен, диваны устойчивые, декор выровнен, пыль отсутствует, посадка полностью готова к приёму гостей.", "photo": false, "owner": "Администратор"}, {"id": "pa04", "block": "Открытие", "group": "Открытие · Приёмка смены (pa01–pa21)", "title": "☕ Кофемашина + ☝️холдеры", "instruction": "Кофемашина включена и прогрета.\nСъёмные детали и чистые холдеры на месте.\nПодтёков воды и накипи нет, хромированные детали натёрты до блеска.", "photo": true, "owner": "Техник"}, {"id": "pa05", "block": "Открытие", "group": "Открытие · Приёмка смены (pa01–pa21)", "title": "⚙️ Гриндеры", "instruction": "Гриндеры протёрты, старые остатки кофе отсутствуют, помол проверен.\nУтренние показания счётчиков сверены и внесены в отчёт.", "photo": false, "owner": "Шеф-бариста"}, {"id": "pa06", "block": "Открытие", "group": "Открытие · Приёмка смены (pa01–pa21)", "title": "🧽 Рабочая зона и Мойка за стойкой", "instruction": "Рабочая поверхность вымыта и протёрта насухо, пятен от сиропов и кофе нет, порядок соблюдён.\nМойка за стойкой чистая, грязная посуда отсутствует.", "photo": false, "owner": "Администратор"}, {"id": "pa07", "block": "Открытие", "group": "Открытие · Приёмка смены (pa01–pa21)", "title": "🔥 Термопот", "instruction": "Заполнен очищенной водой, включён на прогрев, корпус сухой ": "Администратор"}, {"id": "u03", "block": "Закрытие", "group": "Закрытие · Уборка помещения (u01–u07)", "title": "🚪 Входная дверь натёрта, без следов и пятен", "instruction": "Чистка входной двери:\n• Стекло входной двери с обеих сторон натёрто средством для стёкол без разводов и отпечатков рук.\n• Дверная ручка, профиль и порог протёрты влажной, затем сухой салфеткой.", "photo": false, "owner": "Администратор"}, {"id": "u04", "block": "Закрытие", "group": "Закрытие · Уборка помещения (u01–u07)", "title": "🪟 Зеркала и Стёкла натёрты, без разводов и загрязнений 📸", "instruction": "Мойка зеркал и витринных стёкол:\n• Все зеркала в зале, у фотозоны и в санузле натёрты микрофиброй со средством для стёкол.\n• Подтёков, разводов и следов пальцев нет.\n• 📸 Сделать контрольное фото.", "photo": true, "owner": "Администратор"}, {"id": "u05", "block": "Закрытие", "group": "Закрытие · Уборка помещения (u01–u07)", "title": "🛋️ Диваны отодвинуты, выполнена влажная уборка полов под диванами 📸", "instruction": "Важно!!! ☝️ ☝️ ☝️\n• Аккуратно отодвинуть диваны от стен, подмести крошки и пыль, тщательно вымыть пол и плинтусы под диванами, затем ровно вернуть диваны на место.\n• Регулярно менять грязную воду в ведре на чистую.\n• Выливать грязную воду ТОЛЬКО на улице в отведённое место (категорически запрещено выливать в мойку в подсобке — слив забивается песком!).\n• 📸 Сделать фото чистого пола под диванами.", "photo": true, "owner": "Администратор"}, {"id": "u06", "block": "Закрытие", "group": "Закрытие · Уборка помещения (u01–u07)", "title": "🧹 Влажная уборка полов в зале", "instruction": "Финальная мойка полов:\n• Пол во всём гостевом зале, за барной стойкой и в проходах подметён и тщательно вымыт с моющим средством.\n• Углы и плинтусы чистые, без разводов и липких следов.\n• Грязная вода после уборки вылита на улице, моп/тряпка промыты и поставлены на просушку.", "photo": true, "owner": "Администратор"}, {"id": "u07", "block": "Закрытие", "group": "Закрытие · Уборка помещения (u01–u07)", "title": "🚽 Туалет вымыт и продезинфицирован 📸 (видео 5-7 сек)", "instruction": "Финальная дезинфекция санузла:\n• Унитаз, раковина, смеситель, дверные ручки и пол вымыты и обработаны дезинфицирующим средством.\n• Мусор выброшен, вставлен чистый пакет, расходники пополнены на утро.\n• 📹 Снять обзорное видео чистого санузла (5–7 секунд).", "photo": true, "owner": "Администратор"}, {"id": "q01", "block": "Лайн Чек 2", "group": "День · Чистка До/После (q01–q09)", "title": "☕ Кофемашина (фото до и после)", "instruction": "• Корпус протёрт, без пятен, подтёков и кофейных следов.\n• Группы промыты, остатки кофе отсутствуют.\n• Портафильтры вымыты, без кофейных масел и налёта.\n• Паровые трубки очищены и продуты.\n• Поддон и решётка вымыты, без остатков воды и кофе.\n• Поверхности вокруг чистые, без кофейной гущи.\n• 📸 Сделать фото ДО и ПОСЛЕ чистки.", "photo": true, "owner": "Техник"}, {"id": "q02", "block": "Лайн Чек 2", "group": "День · Чистка До/После (q01–q09)", "title": "🌪 Блендер (фото до и после)", "instruction": "• Чаша блендера вымыта, без остатков продуктов, налёта и запахов.\n• Ножи чистые, промыты со всех сторон.\n• Крышка и уплотнитель вымыты, без загрязнений в пазах.\n• Корпус и панель кнопок протёрты насухо, без капель и липкости.\n• 📸 Сделать фото ДО и ПОСЛЕ чистки.", "photo": true, "owner": "Техник"}, {"id": "q03", "block": "Лайн Чек 2", "group": "День · Чистка До/После (q01–q09)", "title": "❄️ Холодильник под стойкой (фото до и после)", "instruction": "• Полки и стенки чистые, без крошек, пятен молока и подтёков.\n• Продукты и молоко размещены аккуратно по срокам годности.\n• Посторонние запахи отсутствуют.\n• Резиновые уплотнители дверцы вымыты в складках.\n• Дверца закрывается плотно.\n• 📸 Сделать фото ДО и ПОСЛЕ чистки.", "photo": true, "owner": "Закупщик"}, {"id": "q04", "block": "Лайн Чек 2", "group": "День · Чистка До/После (q01–q09)", "title": "📦 Холодильник склад (фото до и после)", "instruction": "• Полки чистые, без загрязнений и подтёков.\n• Продукты разложены строго по категориям и промаркированы.\n• Посторонние запахи отсутствуют.\n• Уплотнители чистые, дверца закрывается плотно.\n• 📸 Сделать фото ДО и ПОСЛЕ чистки.", "photo": true, "owner": "Закупщик"}, {"id": "q05", "block": "Лайн Чек 2", "group": "День · Чистка До/После (q01–q09)", "title": "🧊 Морозилка верхняя (фото до и после)", "instruction": "• Внутренняя камера очищена, без снежной наледи, крошек и загрязнений.\n• Замороженные заготовки и продукты упакованы, подписаны и размещены аккуратно.\n• Уплотнитель чистый, дверца закрывается плотно.\n• 📸 Сделать фото ДО и ПОСЛЕ чистки.", "photo": true, "owner": "Закупщик"}, {"id": "q06", "block": "Лайн Чек 2", "group": "День · Чистка До/После (q01–q09)", "title": "🧊 Морозилка нижняя (фото до и после)", "instruction": "• Внутри чисто, ящики/полки вымыты без крошек и остатков продуктов.\n• Продукты расфасованы и размещены аккуратно.\n• Посторонние запахи отсутствуют.\n• 📸 Сделать фото ДО и ПОСЛЕ чистки.", "photo": true, "owner": "Закупщик"}, {"id": "q07", "block": "Лайн Чек 2", "group": "День · Чистка До/После (q01–q09)", "title": "🧊 Льдогенератор (фото до и после)", "instruction": "• Внутренняя камера чистая, без слизи, плесени и известкового налёта.\n• Лёд прозрачный, без постороннего запаха, совок для льда чистый.\n• Лоток и дренаж чистые, без застоя воды.\n• Корпус снаружи и вентиляционная решётка протёрты.\n• 📸 Сделать фото ДО и ПОСЛЕ чистки.", "photo": true, "owner": "Техник"}, {"id": "q08", "block": "Лайн Чек 2", "group": "День · Чистка До/После (q01–q09)", "title": "🚰 Мойка склад (фото до и после)", "instruction": "• Раковина на складе вымыта с дезсредством, без жира, налёта и остатков пищи.\n• Сливная сеточка и сифон чистые, без засоров и запаха (песок с полов в мойку не сливать!).\n• Смеситель натёрт без водного камня.\n• Поверхности и фартук вокруг мойки чистые и сухие.\n• 📸 Сделать фото ДО и ПОСЛЕ чистки.", "photo": true, "owner": "Администратор"}, {"id": "q09", "block": "Лайн Чек 2", "group": "День · Чистка До/После (q01–q09)", "title": "🚰 Мойка стойка (фото до и после)", "instruction": "• Барная раковина и ринзер чистые, без остатков молока и кофейной гущи.\n• Слив чистый, вода уходит быстро, запах отсутствует.\n• Смеситель натёрт до блеска без налёта.\n• Рабочая зона вокруг мойки сухая и чистая.\n• 📸 Сделать фото ДО и ПОСЛЕ чистки.", "photo": true, "owner": "Администратор"}, {"id": "gd1", "block": "Карта добрых дел", "group": "Карта добрых дел (периодические задачи)", "title": "🧊 Разморозка и генеральная мойка холодильника", "instruction": "📅 Периодичность: Раз в 2 недели (Вторник 14:00–18:00 — тихий день)\n⏰ Окно выполнения: 14:00 – 18:00\nВыполняется в самый тихий день (вторник с 14:00 до 18:00): отключить холодильник, полностью разморозить, промыть полки и уплотнители, навести идеальный порядок и сделать фото с камеры.", "photo": true, "owner": "Бариста"}, {"id": "gd2", "block": "Карта добрых дел", "group": "", "title": "🧂 Регенерация водоумягчителя (фильтра воды) — 2 пачки соли", "instruction": "📅 Периодичность: Раз в 4 недели (При закрытии — регенерация водоумягчителя)\n⏰ Окно выполнения: 21:30 – 22:30 (при закрытии)\nСтрого при закрытии смены (когда кофе больше не варим): скрутить крышку водоумягчителя, засыпать 2 пачки мелкой таблетированной соли, запустить цикл промывки пока моются полы.", "photo": true, "owner": "Бариста"}, {"id": "gd3", "block": "Карта добрых дел", "group": "Карта добрых дел (периодические задачи)", "title": "🪑 Подготовка второго зала к открытию (Пт–Сб)", "instruction": "📅 Периодичность: Только Пт и Сб (2-й зал / пик)\n⏰ Окно выполнения: 07:30 – 08:30\nВ пятницу и субботу открывается 2-й зал: включить освещение, проверить посадку, протереть столы и подготовить станцию.", "photo": true, "owner": "Бариста"}, {"id": "gd4", "block": "Карта добрых дел", "group": "Карта добрых дел (периодические задачи)", "title": "🧽 Глубокая замочка холдеров, сеток и питчеров в химии", "instruction": "📅 Периодичность: 2 раза в неделю (Ч function loadSharedState() {

    const raw = localStorage.getItem(STORE_KEY);
    if (raw) { const parsed = JSON.parse(raw); if (parsed && parsed.blocks) return parsed; }
  } catch(_) {}

const syncCh = (typeof BroadcastChannel !== 'undefined') ? new BroadcastChannel('coffee_illy_v90_sync') : null;
function saveSharedState(st, actor, desc) {
  st.rev = (Number(st.rev) || 0) + 1;
  if (desc) {
    st.auditLog = st.auditLog || [];
    st.auditLog.unshift({ time: st.simTime || '13:25', actor: actor || 'Система', rev: st.rev, text: desc });
    if (st.auditLog.length > 50) st.auditLog.pop();
  }
  try { localStorage.setItem(STORE_KEY, JSON.stringify(st)); } catch(_) {}
  if (syncCh) try { syncCh.postMessage({ type: 'state', rev: st.rev, ts: Date.now() }); } catch(_) {}
  if (window.CoffeeCloudV93 && desc) window.CoffeeCloudV93.dispatchStateChange(st, actor, desc);
}
function fmtRub(n) { return (Number(n) || 0).toLocaleString('ru-RU') + ' ₽'; }
function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function toMin(hhmm) { const m = String(hhmm || '00:00').match(/(\d{1,2}):(\d{2})/); return m ? Number(m[1])*60 + Number(m[2]) : 0; }
function optList(arr, sel, fn) {
  const v = arr.slice();
  if (sel != null && sel !== '' && !v.some(x => String(x) === String(sel))) v.unshift(sel);
  return v.map(x => `<option value="${esc(x)}" ${String(x)===String(sel)?'selected':''}>${esc(fn ? fn(x) : x)}</option>`).join('');
}
let _tTimer = null;
function showToast(msg) {

function initTheme(btnId) {
  const mql = window.matchMedia('(prefers-color-scheme: dark)');
  let mode = 'auto';
  try { mode = localStorage.getItem(THEME_KEY) || 'auto'; } catch(_) {}
  function apply() {
    const eff = mode === 'auto' ? (mql.matches ? 'dark' : 'light') : mode;
    document.documentElement.setAttribute('data-theme', eff);
    const b = document.getElementById(btnId);
    if (b) b.textContent = mode === 'auto' ? '🌓 Авто' : (mode === 'light' ? '☀️ Светлая' : '🌙 Тёмная');
  }
  mql.addEventListener('change', () => { if (mode === 'auto') apply(); });
  window.addEventListener('storage', (e) => { if (e.key === THEME_KEY) { mode = e.newValue || 'auto'; apply(); } });
  const b = document.getElementById(btnId);
  if (b) b.onclick = () => {
    mode = mode === 'auto' ? 'light' : (mode === 'light' ? 'dark' : 'auto');
    try { localStorage.setItem(THEME_KEY, mode); } catch(_) {}
    apply();
  };
  apply();
}

      return;
    }

    if (tab === 'ttk') {
      // Screenshot 8: 4 Categories instead of flat list + Search bar moved to BOTTOM
      const q = ttkQ.trim().toLowerCase();
      const shiftItems = state.blocks.filter(b => !b.isCash && b.active !== false && b.name !== 'Карта добрых дел');
      const deedsItems = blockTasks('Карта добрых дел');
      const ttkItems = state.ttk || [];
      const otherItems = (state.announcements || []).map(a => ({ title: a.title || 'Стандарт', text: a.text || a.body || '' }));

      let contentHtml = '';
      if (q) {
        const hits = [];
        ttkItems.filter(k => (k.name + ' ' + k.recipe + ' ' + k.cat).toLowerCase().includes(q)).forEach(k => {
          hits.push(`<div class="card-soft"><div style="display:flex;justify-content:space-between;"><b>${esc(k.name)}</b><span class="badge accent">${k.price} ₽</span></div><div style="font-size:11.5px;color:var(--muted);margin:2px 0 4px;">Рецептура · ${esc(k.vol)}</div><div style="font-size:12.5px;">${esc(k.recipe)}</div></div>`);
        });
        deedsItems.filter(d => (d.title + ' ' + d.instruction).toLowerCase().includes(q)).forEach(d => {
          hits.push(`<div class="card-soft"><b>${esc(d.title)}</b><div style="font-size:11.5px;color:var(--muted);margin:2px 0 4px;">Карта добрых дел</div><div style="font-size:12.5px;">${esc(d.instruction)}</div></div>`);
        });
        shiftItems.filter(b => b.name.toLowerCase().includes(q)).forEach(b => {
          hits.push(`<div class="card-soft" style="display:flex;justify-content:space-between;align-items:center;"><div><b>${esc(b.name)}</b><div style="font-size:11.5px;color:var(--muted);">Сделать на смене · ${b.openTime}–${b.deadline}</div></div><button class="chip-btn accent" data-go-blk="${esc(b.name)}">Открыть</button></div>`);
        });
        contentHtml = `<div class="stack" style="padding-bottom:64px;">${hits.length ? hits.join('') : '<div class="card-soft" style="text-align:center;color:var(--muted);">Ничего не найдено</div>'}</div>`;
      } else if (!baseCat) {
        contentHtml = `<div class="cat-grid" style="padding-bottom:64px;">
          <button type="button" class="cat-card" data-cat="shift"><span class="cat-ico">📋</span><span class="cat-name">Сделать на смене</span><span class="cat-cnt">${shiftItems.length} этапов</span></button>
          <button type="button" class="cat-card" data-cat="deeds"><span class="cat-ico">💛</span><span class="cat-name">Карта добрых дел</span><span class="cat-cnt">${deedsItems.length} пунктов</span></button>
          <button type="button" class="cat-card" data-cat="ttk"><span class="cat-ico">☕</span><span class="cat-name">Рецептура</span><span class="cat-cnt">${ttkItems.length} позиций</span></button>
          <button type="button" class="cat-card" data-cat="other"><span class="cat-ico">📁</span><span class="cat-name">Прочее</span><span class="cat-cnt">${otherItems.length || 'Стандарты'}</span></button>
        </div>`;
      } else {
        const catTitles = { shift: 'Сделать на смене', deeds: 'Карта добрых дел', ttk: 'Рецептура', other: 'Прочее' };
        let listHtml = '';
        if (baseCat === 'shift') {
          listHtml = shiftItems.map(b => {
            const st = getBlkSt(b);
            return `<div class="card-soft" style="display:flex;justify-content:space-between;align-items:center;"><div><b>${esc(b.name)}</b><div style="font-size:11.5px;color:var(--muted);">${b.openTime}–${b.deadline} · ${st.label}</div></div>${st.open?`<button class="chip-btn accent" data-go-blk="${esc(b.name)}">Открыть</button>`:`<span class="badge ${st.cls}">${st.code==='done'?'✓':'🔒'}</span>`}</div>`;
          }).join('');
        } else if (baseCat === 'deeds') {
          listHtml = deedsItems.length
            ? deedsItems.map(d => `<div class="card-soft"><b>${esc(d.title)}</b><div style="font-size:12.5px;color:var(--muted);margin-top:4px;">${esc(d.instruction||'')}</div></div>`).join('')
            : '<div class="card-soft" style="color:var(--muted);text-align:center;">Пункты появятся из Google Таблицы</div>';
        } else if (baseCat === 'ttk') {
          listHtml = ttkItems.map(k => `<div class="card-soft"><div style="display:flex;justify-content:space-between;"><b>${esc(k.name)}</b><span class="badge accent">${k.price} ₽</span></div><div style="font-size:11.5px;color:var(--muted);margin:2px 0 5px;">${esc(k.vol)} · ${esc(k.cat)}</div><div style="font-size:12.5px;">${esc(k.recipe)}</div></div>`).join('');
        } else {
          listHtml = otherItems.length
            ? otherItems.map(o => `<div class="card-soft"><b>${esc(o.title)}</b><div style="font-size:12.5px;color:var(--muted);margin-top:4px;">${esc(o.text)}</div></div>`).join('')
            : '<div class="card-soft"><b>Стандарты Coffee Illy</b><div style="font-size:12.5px;color:var(--muted);margin-top:4px;">Чистота стойки, свежий помол, улыбка каждому гостю.</div></div>';
        }
        contentHtml = `<div style="display:flex;align-items:center;gap:8px;"><button type="button" class="chip-btn" id="cat-back">← Категории</button><b style="font-size:15px;">${esc(catTitles[baseCat]||'')}</b></div><div class="stack" style="padding-bottom:64px;">${listHtml}</div>`;
      }

      body.innerHTML = contentHtml + `<div class="bottom-search-wrap"><input id="tq" value="${esc(ttkQ)}" placeholder="Поиск..." enterkeyhint="search"></div>`;
      const tq = document.getElementById('tq');
      if (tq) {
        tq.oninput = e => {
          const pos = e.target.selectionStart;
          ttkQ = e.target.value;
          render();
          const el2 = document.getElementById('tq');
          if (el2) { el2.focus(); try { el2.setSelectionRange(pos, pos); } catch(_) {} }
        };
      }
      body.querySelectorAll('[data-cat]').forEach(b => b.onclick = () => { baseCat = b.dataset.cat; render(); });
      const cb = document.getElementById('cat-back'); if (cb) cb.onclick = () => { baseCat = ''; render(); };
      body.querySelectorAll('[data-go-blk]').forEach(b => b.onclick = () => { tab = 'checklists'; activeBlock = b.dataset.goBlk; finishedBlock = ''; confirmFinish = false; stepIdx = 0; instOpen = true; render(); });
      return;
    }

    if (tab === 'issues') {
      body.innerHTML = `<button class="btn-lg primary" id="ni">+ Задача</button><div class="stack">${state.incidents.filter(i=>i.status!=='Решена').slice(0,12).map(i=>`<div class="card-soft"><b>${esc(i.step)}</b> <span class="badge ${i.priority==='Критично'?'bad':'warn'}">${esc(i.priority)}</span><div style="font-size:12px;color:var(--muted);margin-top:2px;">${i.date} · ${esc(i.text||'—')}</div></div>`).join('')}</div>`;
      document.getElementById('ni').onclick = () => {
        openModal('Новая задача', `
          <div class="field"><label>Участок / зона</label><select id="nz">${optList(EQUIP_ZONES, EQUIP_ZONES[0])}</select></div>
          <div class="field"><label>Срочность</label><select id="np"><option>Критично</option><option>Терпит</option></select></div>
          <div class="field"><label>Описание</label><textarea id="nt" rows="3" enterkeyhint="done"></textarea></div>
          <div style="margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
            <button type="button" class="chip-btn accent" id="n-cam">📷 Фото / 🎬 Видео (15с)</button>
            <span id="n-cam-st" style="font-size:12px;color:var(--muted);"></span>
          </div>
          <button class="btn-lg primary" id="ns">Сохранить</button>
        `);
        let incPhotoUrl = '';
        document.getElementById('n-cam').onclick = () => {
          if (!window.CoffeeCameraV94) return;
          window.CoffeeCameraV94.open({
            title: 'Медиа к задаче',
            onCaptured: async (dataUri, meta) => {
              const mType = (meta && meta.mediaType) || 'image';
              const stEl = document.getElementById('n-cam-st');
              if (stEl) stEl.textContent = '☁ Загрузка…';
              if (window.CoffeeCloudV94) {
                activePhotoUploads++;
                try {
                  const up = await window.CoffeeCloudV94.uploadMediaToDrive({ dataUri, userName: authed || 'Бариста', block: 'Задача', kind: mType === 'video' ? 'incident_video' : 'incident' });
                  incPhotoUrl = (up && up.url) || '';
                  if (stEl) stEl.textContent = incPhotoUrl ? (mType === 'video' ? '✓ Видео прикреплено' : '✓ Фото прикреплено') : '✓ Снято';
                } catch (_) {
                  if (stEl) stEl.textContent = '⚠️ Ошибка загрузки — сохранено локально';
                } finally {
                  activePhotoUploads = Math.max(0, activePhotoUploads - 1);
                }
              }
            }
          });
        };
        document.getElementById('ns').onclick = () => {
          const z = document.getElementById('nz').value;
          state.incidents.unshift({ id:'INC-'+Math.floor(100+Math.random()*899), date:getTodayISO(), time:(window.CoffeeCloudV94?window.CoffeeCloudV94.localHHMM():'13:25'), step:z, text:document.getElementById('nt').value.trim()||'Задача', priority:document.getElementById('np').value, status:'Новая проблема', who:authed, owner:'Администратор', photoUrl: incPhotoUrl });
          saveSharedState(state, authed, 'Внеплановая поломка: ' + z); closeModal(); showToast('✓ Задача сохранена'); render();
        };
      };
    }
  }

  // Screenshot 7: Global mobile keyboard dismiss (tap outside input, Enter key, or floating Готово button)
  document.addEventListener('focusin', (e) => {
    if (e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName) && e.target.type !== 'file') {
      document.body.classList.add('kb-open');
    }
  });
  document.addEventListener('focusout', () => {
    setTimeout(() => {
      const ae = document.activeElement;
      if (!ae || !/^(INPUT|TEXTAREA)$/.test(ae.tagName)) document.body.classList.remove('kb-open');
    }, 80);
  });
  document.addEventListener('pointerdown', (e) => {
    const ae = document.activeElement;
    if (ae && /^(INPUT|TEXTAREA)$/.test(ae.tagName)) {
      if (!e.target.closest('input,textarea,select,.kb-done-btn')) {
        try { ae.blur(); } catch(_) {}
      }
    }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && e.target && e.target.tagName === 'INPUT') {
      try { e.target.blur(); } catch(_) {}
    }
  });
  const kbBtn = document.getElementById('kb-done-btn');
  if (kbBtn) kbBtn.onclick = () => { if (document.activeElement) try { document.activeElement.blur(); } catch(_) {} document.body.classList.remove('kb-open'); };

  function onRemoteSync() {
    const next = loadSharedState();
    if (next.rev !== state.rev) {
      state = next;
      showToast('✓ Обновлено');
      render();
    }
  }
  if (syncCh) syncCh.onmessage = onRemoteSync;
  window.addEventListener('storage', (e) => { if (e.key === STORE_KEY) onRemoteSync(); });
  document.querySelectorAll('#bnav button').forEach(b => b.onclick = () => { tab = b.dataset.t; render(); });
  render();

  setInterval(() => { const _c = document.getElementById('hdr-clock'); if (_c && window.CoffeeCloudV93) _c.textContent = window.CoffeeCloudV93.localHHMM(); }, 15000);
  runAutoLogin();
  if (window.CoffeeCloudV93) {
    window.CoffeeCloudV93.startCloudLoop({
      mode: 'terminal',
      getState: () => state,
      onSynced: (st, srvRev) => {
        try { localStorage.setItem(STORE_KEY, JSON.stringify(st)); } catch(_) {}
        if (!authed) runAutoLogin();
        else applyDeepLinkIfNeeded();
        const ae = document.activeElement;
        const bodyEl = document.getElementById('body');
        const isEditingBody = !!(ae && bodyEl && bodyEl.contains(ae) && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName));
        const modalOpen = !!(document.getElementById('modal-bg') && document.getElementById('modal-bg').classList.contains('open'));
        if (isEditingBody || modalOpen) {
          const _pend = (window.CoffeeCloudV94 && window.CoffeeCloudV94.getPendingCount) ? window.CoffeeCloudV94.getPendingCount() : 0;
          const revEl = document.getElementById('hdr-rev');
          if (revEl) revEl.textContent = (navigator.onLine === false || st.liveConnected === false) ? 'Офлайн' : (_pend > 0 ? ('Синхр. ' + _pend) : 'Онлайн');
          if (isEditingBody && !ae.dataset.syncBlurBound) {
            ae.dataset.syncBlurBound = '1';
            ae.addEventListener('blur', () => { render(); }, { once: true });
          }
          return;
        }
        render();
      }
    });
  }
})();
</script>
  <script src="./js/time-picker.js?v=97.14.1"></script>

  <div id="kb-dismiss-bar" class="kb-dismiss-bar" aria-hidden="true">
    <button type="button" class="kb-dismiss-btn" onclick="if(document.activeElement)document.activeElement.blur();">Готово ⌄</button>
  </div>
  <script>
    (function () {
      if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
        navigator.serviceWorker.register('./sw.js?v=97.14.1').catch(function () {});
      }
      var kbBar = document.getElementById('kb-dismiss-bar');
      var isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
      if (kbBar && isTouch) {
        document.addEventListener('focusin', function (e) {
          if (e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName) && e.target.type !== 'checkbox' && e.target.type !== 'radio') {
            kbBar.classList.add('visible');
          }
        });
        document.addEventListener('focusout', function () {
          setTimeout(function () {
            var ae = document.activeElement;
            if (!ae || !/^(INPUT|TEXTAREA)$/.test(ae.tagName)) kbBar.classList.remove('visible');
          }, 120);
        });
      }
    })();
  </script>

</body>
</html>
