<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coffee Illy — Панель управления</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#F7F4EF">
<link rel="stylesheet" href="./css/coffee-illy-v94.css">
<script src="./version.js"></script>
<script src="./config.js"></script>
<script src="./js/cloud-sync-v94.js"></script>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="brand-mark">CI</div>
    <div style="min-width:0;">
      <div class="brand-title">Coffee Illy · Панель управления · <span id="hdr-loc">Кофейня №1</span></div>
      <div class="brand-sub">
        <span id="sync-pill" class="sync-pill syncing"><span class="dot"></span><span id="sync-txt">Синхронизация...</span></span>
      </div>
    </div>
  </div>
  <div class="row" style="gap:8px;">
    <select id="period-sel" class="btn btn-sm" aria-label="Период">
      <option value="today">Сегодня</option>
      <option value="7d" selected>7 дней</option>
      <option value="30d">30 дней</option>
      <option value="all">Всё время</option>
    </select>
    <button class="icon-btn" id="btn-refresh" title="Обновить данные">↻</button>
    <button class="icon-btn" id="btn-profile" title="Профиль владельца">👤</button>
  </div>
</header>

<div class="mobile-nav-strip" id="mobile-nav"></div>

<div class="owner-shell">
  <aside class="sidebar" id="sidebar" aria-label="Разделы панели управления"></aside>
  <main class="owner-main" id="content"></main>
</div>

<div class="modal-bg" id="modal-bg">
  <div class="modal-box">
    <div class="modal-head">
      <h3 class="modal-title" id="modal-title"></h3>
      <button class="icon-btn" id="modal-close" aria-label="Закрыть">✕</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  const C = window.CoffeeCloudV94;
  const STORE_KEY = 'coffee_illy_v94_owner_state';
  const THEME_KEY = 'coffee_illy_v94_theme';
  const TODAY = C ? C.localISO() : new Date().toISOString().slice(0, 10);
  const INC_STATUSES = ['Новая', 'Принята', 'В работе', 'Ожидает запчасть', 'Решена'];

  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function fmtRub(n) {
    if (n === null || n === undefined || Number.isNaN(Number(n))) return '—';
    return Number(n).toLocaleString('ru-RU') + ' ₽';
  }

  let _toastTimer = null;
  function showToast(msg) {
    const el = document.getElementById('toast');
    if (!el) return;
    el.textContent = msg; el.classList.add('show');
    clearTimeout(_toastTimer);
    _toastTimer = setTimeout(() => el.classList.remove('show'), 3200);
  }
  function openModal(title, html) {
    document.getElementById('modal-title').textContent = title;
    document.getElementById('modal-body').innerHTML = html;
    document.getElementById('modal-bg').classList.add('open');
  }
  function closeModal() { document.getElementById('modal-bg').classList.remove('open'); }
  document.getElementById('modal-close').onclick = closeModal;
  document.getElementById('modal-bg').onclick = (e) => { if (e.target.id === 'modal-bg') closeModal(); };

  let themeMode = 'light';
  try { themeMode = localStorage.getItem(THEME_KEY) || 'light'; } catch (_) {}
  function applyTheme() {
    const dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', themeMode === 'auto' ? (dark ? 'dark' : 'light') : themeMode);
  }
  applyTheme();

  function defaultState() {
    return {
      location: 'Кофейня №1', plan: 2200, minAvgCheck: 35, planChecks: 75, woNorm: 15, initCounter: 600, photoAll: false,
      blocks: [], tasks: [], checklists: [], cash: [], expenses: [], incidents: [], staff: [], ttk: [],
      inventory: [], inventoryLog: [], staffPresence: {}, cashReviews: {}, financeSummary: null,
      tgConfiguredOnServer: false, tgChat: '', webappUrl: '', autopilotEnabled: false,
      dataLoaded: false, loadError: '', lastSyncAt: ''
    };
  }
  function loadState() {
    try { const raw = localStorage.getItem(STORE_KEY); if (raw) return Object.assign(defaultState(), JSON.parse(raw)); } catch (_) {}
    return defaultState();
  }
  function saveStateLocal() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (_) {} }

  let state = loadState();
  let tab = 'overview';
  let period = '7d';
  let finSub = 'summary';
  let finSearch = '';
  let finStaff = 'all';
  let incFilter = 'open';
  let chkFilter = 'all';
  let ttkSearch = '';
  let adminAuthed = !!(C && C.getSession().adminToken);
  let cloudLoop = null;

  const NAV_ITEMS = [
    { id: 'overview', ico: '📊', label: 'Обзор' },
    { id: 'finance', ico: '💰', label: 'Финансы' },
    { id: 'sales', ico: '📈', label: 'Продажи' },
    { id: 'inventory', ico: '📦', label: 'Товары и склад' },
    { id: 'checklists', ico: '☑️', label: 'Чек-листы' },
    { id: 'incidents', ico: '🛠', label: 'Поломки и задачи' },
    { id: 'team', ico: '👥', label: 'Команда и смены' },
    { id: 'ttk', ico: '☕', label: 'Технологические карты' },
    { id: 'settings', ico: '⚙️', label: 'Настройки' }
  ];

  function updateSyncPill(st) {
    const pill = document.getElementById('sync-pill');
    const txt = document.getElementById('sync-txt');
    if (!pill || !txt) return;
    pill.className = 'sync-pill ' + (st.state || 'syncing');
    if (st.state === 'synced') {
      txt.textContent = 'Данные синхронизированы' + (st.lastSyncAt ? ' · Обновлено в ' + st.lastSyncAt : '');
      pill.onclick = null;
    } else if (st.state === 'offline') {
      txt.textContent = 'Нет соединения — сохранено на устройстве';
      pill.onclick = null;
    } else if (st.state === 'error') {
      txt.textContent = 'Ошибка загрузки · Повторить';
      pill.onclick = () => { if (cloudLoop) cloudLoop.pullNow(true); };
    } else {
      txt.textContent = 'Обновление данных...';
      pill.onclick = null;
    }
  }

  function inPeriod(dateStr) {
    if (!dateStr || period === 'all') return true;
    const d = String(dateStr).slice(0, 10);
    if (period === 'today') return d === TODAY;
    const days = period === '7d' ? 7 : 30;
    const cutoff = new Date(Date.now() - days * 86400000).toISOString().slice(0, 10);
    return d >= cutoff;
  }

  function requireAdmin(actionTitle, fn) {
    if (adminAuthed) { fn(); return; }
    openModal('Подтверждение доступа владельца', `
      <div class="stack">
        <div class="card-sub">Действие «${esc(actionTitle)}» требует входа по PIN владельца.</div>
        <div class="field"><label>PIN владельца</label><input id="adm-pin" type="password" inputmode="numeric" autofocus placeholder="Введите PIN"></div>
        <button class="btn btn-primary btn-full" id="adm-ok">Подтвердить</button>
      </div>
    `);
    document.getElementById('adm-ok').onclick = async () => {
      const p = document.getElementById('adm-pin').value.trim();
      if (!p) return;
      if (C) {
        const res = await C.authLogin('admin', { pin: p });
        if (res && res.ok) {
          adminAuthed = true;
          closeModal();
          showToast('Вход владельца выполнен');
          fn();
          if (cloudLoop) cloudLoop.pullNow(true);
          render();
          return;
        }
        showToast((res && res.error) || 'Неверный PIN владельца');
      }
    };
  }

  function openProfileModal() {
    openModal('Профиль и сессия владельца', `
      <div class="stack">
        <div class="card-soft row-between">
          <div><b>Статус доступа</b><div class="card-sub">${adminAuthed ? 'Активная сессия владельца' : 'Только просмотр (требуется PIN)'}</div></div>
          <span class="badge ${adminAuthed ? 'good' : 'warn'}">${adminAuthed ? 'Авторизован' : 'Гость'}</span>
        </div>
        <div class="field">
          <label>Тема оформления</label>
          <select id="own-theme">
            <option value="light" ${themeMode === 'light' ? 'selected' : ''}>Светлая (тёплый молочный)</option>
            <option value="dark" ${themeMode === 'dark' ? 'selected' : ''}>Тёмная</option>
            <option value="auto" ${themeMode === 'auto' ? 'selected' : ''}>Авто</option>
          </select>
        </div>
        ${adminAuthed
          ? `<button class="btn btn-bad btn-full" id="btn-adm-out">Завершить сессию владельца</button>`
          : `<button class="btn btn-primary btn-full" id="btn-adm-in">Войти по PIN владельца</button>`}
      </div>
    `);
    document.getElementById('own-theme').onchange = (e) => {
      themeMode = e.target.value;
      try { localStorage.setItem(THEME_KEY, themeMode); } catch (_) {}
      applyTheme();
      showToast('Тема обновлена');
    };
    const bOut = document.getElementById('btn-adm-out');
    if (bOut) bOut.onclick = () => {
      if (C) C.setSession({ adminToken: '' });
      adminAuthed = false; closeModal(); showToast('Сессия владельца завершена'); render();
    };
    const bIn = document.getElementById('btn-adm-in');
    if (bIn) bIn.onclick = () => { closeModal(); requireAdmin('Вход в панель владельца', () => {}); };
  }

  function exportCsv(filename, headers, rows) {
    const lines = [headers.join(';')].concat(rows.map((r) => r.map((v) => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"').join(';')));
    const blob = new Blob(['\ufeff' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = filename; a.click();
    showToast('Отчёт экспортирован: ' + filename);
  }

  function renderNav() {
    const openInc = (state.incidents || []).filter((i) => i.status !== 'Решена').length;
    const lowStock = (state.inventory || []).filter((i) => Number(i.qty || 0) <= Number(i.minQty || 0)).length;
    const badgeFor = (id) => {
      if (id === 'incidents' && openInc) return `<span class="badge bad">${openInc}</span>`;
      if (id === 'inventory' && lowStock) return `<span class="badge warn">${lowStock}</span>`;
      return '';
    };
    document.getElementById('sidebar').innerHTML = NAV_ITEMS.map((n) => `
      <button class="side-btn ${tab === n.id ? 'active' : ''}" data-tab="${n.id}">
        <span>${n.ico} ${esc(n.label)}</span>${badgeFor(n.id)}
      </button>`).join('');
    document.getElementById('mobile-nav').innerHTML = NAV_ITEMS.map((n) => `
      <button class="${tab === n.id ? 'active' : ''}" data-tab="${n.id}">${n.ico} ${esc(n.label)}</button>`).join('');
    document.querySelectorAll('[data-tab]').forEach((b) => {
      b.onclick = () => { tab = b.dataset.tab; render(); };
    });
  }

  function render() {
    document.getElementById('hdr-loc').textContent = state.location || 'Кофейня №1';
    renderNav();
    const root = document.getElementById('content');

    if (state.loadError && !state.dataLoaded) {
      root.innerHTML = `<div class="empty-state"><div class="empty-title">Ошибка загрузки</div><div class="empty-sub">${esc(state.loadError)}</div><button class="btn btn-primary" style="margin-top:12px;" id="retry-load">Повторить загрузку</button></div>`;
      document.getElementById('retry-load').onclick = () => { if (cloudLoop) cloudLoop.pullNow(true); };
      return;
    }

    const cashF = (state.cash || []).filter((c) => inPeriod(c.date));
    const expF = (state.expenses || []).filter((e) => inPeriod(e.date));
    const useSrv = period === 'all' && state.financeSummary;
    const revVal = useSrv ? state.financeSummary.totalRevenue : (cashF.length ? cashF.reduce((a, c) => a + Number(c.revenue || 0), 0) : null);
    const expVal = useSrv ? state.financeSummary.totalExpenses : (expF.length ? expF.reduce((a, e) => a + Number(e.amount || 0), 0) : (state.dataLoaded ? 0 : null));
    const profitVal = (revVal !== null && expVal !== null) ? (revVal - expVal) : null;
    const checksTotal = useSrv ? state.financeSummary.totalChecks : cashF.reduce((a, c) => a + Number(c.checks || 0), 0);
    const avgVal = useSrv ? state.financeSummary.avgCheck : (checksTotal > 0 && revVal !== null ? Math.round(revVal / checksTotal) : null);
    const openIncs = (state.incidents || []).filter((i) => i.status !== 'Решена');
    const pendingCash = (state.cash || []).filter((c) => {
      const r = (state.cashReviews || {})[c.date + '|' + (c.barista || c.who)];
      return !r || r.status === 'На проверке';
    });
    const lowStock = (state.inventory || []).filter((i) => Number(i.qty || 0) <= Number(i.minQty || 0));
    const workBlocks = (state.blocks || []).filter((b) => !b.isCash && b.active !== false);
    const undoneBlocks = workBlocks.filter((b) => !(state.checklists || []).some((c) => c.date === TODAY && c.block === b.name));

    // 1. ОБЗОР
    if (tab === 'overview') {
      const chartDays = cashF.slice(0, 10).reverse();
      const maxR = Math.max(state.plan || 2200, ...chartDays.map((c) => Number(c.revenue || 0)), 1);
      const planPct = Math.round(((state.plan || 2200) / maxR) * 100);
      const deltaPct = state.financeSummary && state.financeSummary.periodDeltaPct;

      root.innerHTML = `
        <div class="stack">
          <div class="grid-4">
            <div class="kpi"><div class="kpi-lbl">Выручка</div><div class="kpi-val">${revVal === null ? (state.dataLoaded ? 'Нет данных' : '—') : fmtRub(revVal)}</div><div class="kpi-meta">План дня: ${fmtRub(state.plan)}</div></div>
            <div class="kpi"><div class="kpi-lbl">Расходы</div><div class="kpi-val">${expVal === null ? '—' : fmtRub(expVal)}</div><div class="kpi-meta">Операций: ${expF.length}</div></div>
            <div class="kpi"><div class="kpi-lbl">Операционный результат</div><div class="kpi-val" style="color:${profitVal !== null && profitVal >= 0 ? 'var(--good)' : 'var(--text)'}">${profitVal === null ? '—' : fmtRub(profitVal)}</div><div class="kpi-meta">${deltaPct != null ? ('К прошлым 7 сменам: ' + (deltaPct >= 0 ? '+' : '') + deltaPct + '%') : 'Расчёт на сервере'}</div></div>
            <div class="kpi"><div class="kpi-lbl">Средний чек</div><div class="kpi-val">${avgVal === null ? '—' : fmtRub(avgVal)}</div><div class="kpi-meta">Чеков: ${checksTotal}</div></div>
          </div>

          <div class="grid-2">
            <div class="card">
              <div class="card-head"><div><h2 class="card-title">График продаж</h2><div class="card-sub">Нажмите на столбец для просмотра деталей смены</div></div></div>
              ${chartDays.length ? `
                <div class="chart-wrap">
                  <div class="chart-plan-line" style="bottom:${Math.min(90, Math.max(18, planPct * 0.78))}%"><span class="chart-plan-lbl">План ${fmtRub(state.plan)}</span></div>
                  ${chartDays.map((c) => `<div class="bar-col" data-shift-dt="${esc(c.date)}"><div class="bar-val">${c.revenue}</div><div class="bar-fill ${c.revenue >= state.plan ? 'hit' : ''}" style="height:${Math.max(12, Math.round((c.revenue / maxR) * 100))}%"></div><div class="bar-dt">${esc(c.date.slice(5))}</div></div>`).join('')}
                </div>` : `<div class="empty-state"><div class="empty-title">Нет данных за выбранный период</div><div class="empty-sub">Смены появятся после отправки кассового отчёта</div></div>`}
            </div>

            <div class="card">
              <div class="card-head"><div><h2 class="card-title">Состояние смен сейчас</h2><div class="card-sub">Автоматическая отметка при входе сотрудника</div></div></div>
              <div class="stack-sm">
                ${(state.staff || []).filter((s) => s.active !== false).length ? state.staff.filter((s) => s.active !== false).map((s) => {
                  const pr = (state.staffPresence || {})[s.name];
                  const on = !!(pr && pr.status === 'on_shift');
                  return `<div class="card-soft row-between">
                    <div><b>${esc(s.name)}</b> <span class="badge">${esc(s.role)}</span><div class="card-sub">${s.tgId ? esc(s.tgId) : 'Telegram не привязан'}</div></div>
                    <span class="badge ${on ? 'good' : ''}">${on ? ('На работе с ' + esc(pr.checkedInAt || '')) : 'Не на смене'}</span>
                  </div>`;
                }).join('') : `<div class="empty-state"><div class="empty-title">Список сотрудников пуст</div></div>`}
              </div>
            </div>
          </div>

          <div class="grid-2">
            <div class="card">
              <div class="card-head"><div><h2 class="card-title">Кассовые отчёты на проверке (${pendingCash.length})</h2></div><button class="btn btn-sm" id="ov-fin">Все финансы</button></div>
              <div class="stack-sm">
                ${pendingCash.length ? pendingCash.slice(0, 4).map((c) => `
                  <div class="card-soft row-between">
                    <div><b>${esc(c.date)} · ${esc(c.barista || c.who)}</b><div class="card-sub">Выручка: ${fmtRub(c.revenue)} (Нал ${fmtRub(c.cash)} / Безнал ${fmtRub(c.card)})</div></div>
                    <div class="row" style="gap:6px;">
                      <button class="btn btn-sm btn-good" data-cash-ok="${esc(c.date)}|${esc(c.barista || c.who)}">Подтвердить</button>
                      <button class="btn btn-sm btn-bad" data-cash-fix="${esc(c.date)}|${esc(c.barista || c.who)}">Вернуть</button>
                    </div>
                  </div>`).join('') : `<div class="empty-state"><div class="empty-title">Все кассовые отчёты проверены</div></div>`}
              </div>
            </div>

            <div class="card">
              <div class="card-head"><div><h2 class="card-title">Требует внимания</h2></div></div>
              <div class="stack-sm">
                <div class="card-soft row-between" style="cursor:pointer;" id="att-chk"><span>Незакрытые чек-листы сегодня</span><span class="badge ${undoneBlocks.length ? 'warn' : 'good'}">${undoneBlocks.length}</span></div>
                <div class="card-soft row-between" style="cursor:pointer;" id="att-inc"><span>Открытые поломки</span><span class="badge ${openIncs.length ? 'bad' : 'good'}">${openIncs.length}</span></div>
                <div class="card-soft row-between" style="cursor:pointer;" id="att-inv"><span>Предупреждения по складу (низкий остаток)</span><span class="badge ${lowStock.length ? 'warn' : 'good'}">${lowStock.length}</span></div>
              </div>
            </div>
          </div>
        </div>`;

      root.querySelectorAll('[data-shift-dt]').forEach((el) => {
        el.onclick = () => {
          const c = cashF.find((x) => x.date === el.dataset.shiftDt);
          if (!c) return;
          openModal('Смена ' + c.date, `<div class="stack-sm">
            <div class="row-between"><span>Сотрудник:</span><b>${esc(c.barista || c.who)}</b></div>
            <div class="row-between"><span>Выручка:</span><b>${fmtRub(c.revenue)}</b></div>
            <div class="row-between"><span>Наличные / Безналичные:</span><b>${fmtRub(c.cash)} / ${fmtRub(c.card)}</b></div>
            <div class="row-between"><span>Чеков / Средний чек:</span><b>${c.checks} / ${fmtRub(c.avgCheck)}</b></div>
          </div>`);
        };
      });
      document.getElementById('ov-fin').onclick = () => { tab = 'finance'; render(); };
      document.getElementById('att-chk').onclick = () => { tab = 'checklists'; render(); };
      document.getElementById('att-inc').onclick = () => { tab = 'incidents'; render(); };
      document.getElementById('att-inv').onclick = () => { tab = 'inventory'; render(); };
      root.querySelectorAll('[data-cash-ok]').forEach((b) => {
        b.onclick = () => {
          const [date, barista] = b.dataset.cashOk.split('|');
          requireAdmin('Подтвердить кассовый отчёт', async () => {
            if (C) await C.reviewCashReport({ date, barista, status: 'Подтверждён', reviewNote: '' });
            state.cashReviews[date + '|' + barista] = { date, barista, status: 'Подтверждён', reviewNote: '' };
            saveStateLocal(); showToast('Отчёт за ' + date + ' подтверждён'); render();
          });
        };
      });
      root.querySelectorAll('[data-cash-fix]').forEach((b) => {
        b.onclick = () => {
          const [date, barista] = b.dataset.cashFix.split('|');
          requireAdmin('Вернуть отчёт на исправление', () => {
            openModal('Вернуть отчёт ' + date, `
              <div class="field"><label>Причина возврата (увидит сотрудник)</label><textarea id="fix-note" placeholder="Например: перепроверьте сумму безнала"></textarea></div>
              <button class="btn btn-bad btn-full" id="fix-go">Вернуть на исправление</button>
            `);
            document.getElementById('fix-go').onclick = async () => {
              const note = document.getElementById('fix-note').value.trim();
              if (!note) { showToast('Укажите причину возврата'); return; }
              if (C) await C.reviewCashReport({ date, barista, status: 'Нужно исправить', reviewNote: note });
              state.cashReviews[date + '|' + barista] = { date, barista, status: 'Нужно исправить', reviewNote: note };
              saveStateLocal(); closeModal(); showToast('Отчёт возвращён сотруднику'); render();
            };
          });
        };
      });
      return;
    }

    // 2. ФИНАНСЫ
    if (tab === 'finance') {
      const cashFiltered = cashF.filter((c) => (finStaff === 'all' || (c.barista || c.who) === finStaff) && (!finSearch || (c.date + ' ' + c.barista).toLowerCase().includes(finSearch.toLowerCase())));
      const expFiltered = expF.filter((e) => !finSearch || (e.category + ' ' + e.comment + ' ' + e.date).toLowerCase().includes(finSearch.toLowerCase()));
      const staffOpts = ['all'].concat([...new Set((state.cash || []).map((c) => c.barista || c.who).filter(Boolean))]);

      root.innerHTML = `
        <div class="stack">
          <div class="card">
            <div class="card-head">
              <div><h2 class="card-title">Финансы</h2><div class="card-sub">Все итоговые показатели рассчитываются на сервере без смешивания кассы, выручки и прибыли</div></div>
              <div class="row" style="gap:8px;">
                <button class="btn btn-sm" id="btn-exp-csv">⬇ Экспорт CSV</button>
                <button class="btn btn-sm btn-primary" id="btn-add-exp">+ Расход</button>
              </div>
            </div>
            <div class="subtabs">
              <button data-fsub="summary" class="${finSub === 'summary' ? 'active' : ''}">Сводка</button>
              <button data-fsub="cash" class="${finSub === 'cash' ? 'active' : ''}">Кассовые отчёты (${cashFiltered.length})</button>
              <button data-fsub="expenses" class="${finSub === 'expenses' ? 'active' : ''}">Расходы (${expFiltered.length})</button>
            </div>
            <div class="grid-2">
              <div class="field" style="margin-bottom:0;"><input id="fin-q" value="${esc(finSearch)}" placeholder="Поиск по дате, сотруднику, категории..."></div>
              <div class="field" style="margin-bottom:0;"><select id="fin-st">${staffOpts.map((s) => `<option value="${esc(s)}" ${s === finStaff ? 'selected' : ''}>${s === 'all' ? 'Все сотрудники' : esc(s)}</option>`).join('')}</select></div>
            </div>
          </div>

          ${finSub === 'summary' ? `
            <div class="grid-4">
              <div class="kpi"><div class="kpi-lbl">Выручка (доходы)</div><div class="kpi-val">${revVal === null ? 'Нет данных' : fmtRub(revVal)}</div></div>
              <div class="kpi"><div class="kpi-lbl">Наличные в кассе</div><div class="kpi-val">${fmtRub(cashFiltered.reduce((a, c) => a + Number(c.cash || 0), 0))}</div></div>
              <div class="kpi"><div class="kpi-lbl">Расходы</div><div class="kpi-val">${expVal === null ? '—' : fmtRub(expVal)}</div></div>
              <div class="kpi"><div class="kpi-lbl">Операционная прибыль</div><div class="kpi-val" style="color:var(--good)">${profitVal === null ? '—' : fmtRub(profitVal)}</div></div>
            </div>` : ''}

          ${finSub === 'cash' ? `
            <div class="card">
              ${cashFiltered.length ? `<div class="tbl-wrap"><table><thead><tr><th>Дата</th><th>Сотрудник</th><th>Нал</th><th>Безнал</th><th>Выручка</th><th>Чеки</th><th>Статус</th></tr></thead><tbody>
                ${cashFiltered.map((c) => {
                  const rv = (state.cashReviews || {})[c.date + '|' + (c.barista || c.who)];
                  const st = (rv && rv.status) || 'На проверке';
                  const cls = st === 'Подтверждён' ? 'good' : (st === 'Нужно исправить' ? 'bad' : 'warn');
                  return `<tr><td><b>${esc(c.date)}</b></td><td>${esc(c.barista || c.who)}</td><td>${fmtRub(c.cash)}</td><td>${fmtRub(c.card)}</td><td><b>${fmtRub(c.revenue)}</b></td><td>${c.checks}</td><td><span class="badge ${cls}">${esc(st)}</span></td></tr>`;
                }).join('')}
              </tbody></table></div>` : `<div class="empty-state"><div class="empty-title">Кассовых отчётов за период нет</div></div>`}
            </div>` : ''}

          ${finSub === 'expenses' ? `
            <div class="card">
              ${expFiltered.length ? `<div class="tbl-wrap"><table><thead><tr><th>Дата</th><th>Категория</th><th>Сумма</th><th>Комментарий</th><th></th></tr></thead><tbody>
                ${expFiltered.map((e) => `<tr><td>${esc(e.date)}</td><td><b>${esc(e.category)}</b></td><td>${fmtRub(e.amount)}</td><td>${esc(e.comment || '—')}</td><td><button class="btn btn-sm btn-bad" data-del-exp="${esc(e.id)}">Удалить</button></td></tr>`).join('')}
              </tbody></table></div>` : `<div class="empty-state"><div class="empty-title">Расходов за выбранный период нет</div></div>`}
            </div>` : ''}
        </div>`;

      root.querySelectorAll('[data-fsub]').forEach((b) => { b.onclick = () => { finSub = b.dataset.fsub; render(); }; });
      document.getElementById('fin-q').oninput = (e) => { finSearch = e.target.value; render(); document.getElementById('fin-q').focus(); };
      document.getElementById('fin-st').onchange = (e) => { finStaff = e.target.value; render(); };
      document.getElementById('btn-exp-csv').onclick = () => exportCsv('coffee_illy_finance_' + TODAY + '.csv', ['Дата', 'Сотрудник', 'Наличные', 'Безналичные', 'Выручка', 'Чеки'], cashFiltered.map((c) => [c.date, c.barista || c.who, c.cash, c.card, c.revenue, c.checks]));
      document.getElementById('btn-add-exp').onclick = () => requireAdmin('Добавить расход', () => {
        openModal('Новый расход', `
          <div class="field"><label>Категория</label><select id="ne-cat"><option>Закупка продуктов</option><option>Аренда</option><option>Зарплата</option><option>Коммунальные</option><option>Ремонт и оборудование</option><option>Прочее</option></select></div>
          <div class="field"><label>Сумма (₽)</label><input id="ne-amt" type="number" min="1" placeholder="0"></div>
          <div class="field"><label>Комментарий</label><input id="ne-cmt" placeholder="Например: молоко 20л"></div>
          <button class="btn btn-primary btn-full" id="ne-save">Сохранить расход</button>
        `);
        document.getElementById('ne-save').onclick = () => {
          const amt = Number(document.getElementById('ne-amt').value) || 0;
          if (amt <= 0) { showToast('Укажите корректную сумму расхода'); return; }
          const rec = { id: 'EXP-' + Date.now(), date: TODAY, category: document.getElementById('ne-cat').value, amount: amt, comment: document.getElementById('ne-cmt').value.trim(), who: 'Администратор' };
          state.expenses.unshift(rec); saveStateLocal();
          if (C) C.enqueueOp('add_expense', rec);
          closeModal(); showToast('Расход сохранён'); render();
        };
      });
      root.querySelectorAll('[data-del-exp]').forEach((b) => {
        b.onclick = () => requireAdmin('Удалить расход', () => {
          const id = b.dataset.delExp;
          openModal('Подтвердите удаление', `<div class="stack"><div>Удалить расход <b>${esc(id)}</b>? Это действие запишется в журнал.</div><div class="row"><button class="btn" style="flex:1;" id="dx-no">Отмена</button><button class="btn btn-bad" style="flex:1;" id="dx-yes">Удалить</button></div></div>`);
          document.getElementById('dx-no').onclick = closeModal;
          document.getElementById('dx-yes').onclick = () => {
            state.expenses = state.expenses.filter((x) => x.id !== id); saveStateLocal();
            if (C) C.enqueueOp('delete_expense', { id });
            closeModal(); showToast('Расход удалён'); render();
          };
        });
      });
      return;
    }

    // 3. ПРОДАЖИ
    if (tab === 'sales') {
      const sorted = cashF.slice().sort((a, b) => String(b.date).localeCompare(String(a.date)));
      const hitCounts = {};
      sorted.forEach((c) => {
        String(c.topItems || '').split(/[,;]+/).map((s) => s.trim()).filter(Boolean).forEach((nm) => { hitCounts[nm] = (hitCounts[nm] || 0) + 1; });
      });
      const hits = Object.entries(hitCounts).sort((a, b) => b[1] - a[1]);
      root.innerHTML = `
        <div class="stack">
          <div class="grid-3">
            <div class="kpi"><div class="kpi-lbl">Выручка за период</div><div class="kpi-val">${revVal === null ? 'Нет данных' : fmtRub(revVal)}</div></div>
            <div class="kpi"><div class="kpi-lbl">Количество чеков</div><div class="kpi-val">${checksTotal}</div></div>
            <div class="kpi"><div class="kpi-lbl">Средний чек</div><div class="kpi-val">${avgVal === null ? '—' : fmtRub(avgVal)}</div></div>
          </div>
          <div class="card">
            <h2 class="card-title" style="margin-bottom:10px;">Выручка по дням</h2>
            ${sorted.length ? `<div class="tbl-wrap"><table><thead><tr><th>Дата</th><th>Бариста</th><th>Выручка</th><th>Чеков</th><th>Средний чек</th><th>План</th></tr></thead><tbody>
              ${sorted.map((c) => `<tr><td><b>${esc(c.date)}</b></td><td>${esc(c.barista || c.who)}</td><td><b>${fmtRub(c.revenue)}</b></td><td>${c.checks}</td><td>${fmtRub(c.avgCheck)}</td><td><span class="badge ${c.revenue >= state.plan ? 'good' : 'warn'}">${c.revenue >= state.plan ? 'Выполнен' : 'Ниже плана'}</span></td></tr>`).join('')}
            </tbody></table></div>` : `<div class="empty-state"><div class="empty-title">Нет продаж за выбранный период</div></div>`}
          </div>
          <div class="card">
            <h2 class="card-title" style="margin-bottom:10px;">Популярные позиции</h2>
            ${hits.length ? `<div class="row">${hits.slice(0, 10).map(([nm, cnt]) => `<span class="badge accent">${esc(nm)} · ${cnt}</span>`).join('')}</div>` : `<div class="empty-state"><div class="empty-title">Нет детализации по позициям</div></div>`}
          </div>
        </div>`;
      return;
    }

    // 4. ТОВАРЫ И СКЛАД
    if (tab === 'inventory') {
      const items = state.inventory || [];
      const logs = state.inventoryLog || [];
      root.innerHTML = `
        <div class="stack">
          <div class="card">
            <div class="card-head">
              <div><h2 class="card-title">Товары и склад (${items.length})</h2><div class="card-sub">Все изменения остатков фиксируются в истории движений</div></div>
              <button class="btn btn-primary btn-sm" id="btn-inv-op">+ Операция (Поступление / Списание)</button>
            </div>
            ${lowStock.length ? `<div class="card-soft" style="margin-bottom:12px;border-color:var(--warn);"><b>Предупреждения по складу:</b> ${lowStock.map((x) => `${esc(x.name)} (${x.qty} ${esc(x.unit)})`).join(', ')}</div>` : ''}
            ${items.length ? `<div class="tbl-wrap"><table><thead><tr><th>Товар</th><th>Категория</th><th>Остаток</th><th>Мин. остаток</th><th>Статус</th></tr></thead><tbody>
              ${items.map((i) => {
                const zero = Number(i.qty || 0) <= 0;
                const low = Number(i.qty || 0) <= Number(i.minQty || 0);
                return `<tr><td><b>${esc(i.name)}</b></td><td>${esc(i.category || '—')}</td><td><b>${i.qty} ${esc(i.unit || 'шт')}</b></td><td>${i.minQty || 0} ${esc(i.unit || 'шт')}</td><td><span class="badge ${zero ? 'bad' : (low ? 'warn' : 'good')}">${zero ? 'Нулевой остаток' : (low ? 'Низкий остаток' : 'В норме')}</span></td></tr>`;
              }).join('')}
            </tbody></table></div>` : `<div class="empty-state"><div class="empty-title">Склад пока пуст</div><div class="empty-sub">Добавьте первый товар через кнопку «+ Операция»</div></div>`}
          </div>
          <div class="card">
            <h2 class="card-title" style="margin-bottom:10px;">История движений (${logs.length})</h2>
            ${logs.length ? `<div class="tbl-wrap"><table><thead><tr><th>Дата</th><th>Товар</th><th>Операция</th><th>Было → Стало</th><th>Комментарий</th></tr></thead><tbody>
              ${logs.slice(0, 20).map((l) => `<tr><td>${esc(l.date)} ${esc(l.time || '')}</td><td><b>${esc(l.name)}</b></td><td><span class="badge ${l.opType === 'Поступление' ? 'good' : (l.opType === 'Списание' ? 'bad' : 'warn')}">${esc(l.opType)}</span></td><td>${l.prevQty} → <b>${l.nextQty} ${esc(l.unit || '')}</b></td><td>${esc(l.comment || '—')}</td></tr>`).join('')}
            </tbody></table></div>` : `<div class="empty-state"><div class="empty-title">История операций пока пуста</div></div>`}
          </div>
        </div>`;
      document.getElementById('btn-inv-op').onclick = () => requireAdmin('Операция по складу', () => {
        openModal('Складская операция', `
          <div class="field"><label>Товар</label><input id="iv-nm" placeholder="Например: Зерно Illy 250г или Молоко"></div>
          <div class="grid-2">
            <div class="field"><label>Категория</label><select id="iv-cat"><option>Кофе и молоко</option><option>Сиропы</option><option>Расходники</option><option>Десерты</option></select></div>
            <div class="field"><label>Ед. измерения</label><select id="iv-u"><option>шт</option><option>кг</option><option>л</option><option>уп</option></select></div>
          </div>
          <div class="grid-3">
            <div class="field"><label>Операция</label><select id="iv-op"><option>Поступление</option><option>Списание</option><option>Корректировка</option></select></div>
            <div class="field"><label>Количество</label><input id="iv-qty" type="number" min="0" step="0.1" value="1"></div>
            <div class="field"><label>Мин. остаток</label><input id="iv-min" type="number" min="0" step="0.1" value="2"></div>
          </div>
          <div class="field"><label>Комментарий</label><input id="iv-cmt" placeholder="Причина операции"></div>
          <button class="btn btn-primary btn-full" id="iv-go">Провести операцию</button>
        `);
        document.getElementById('iv-go').onclick = async () => {
          const payload = {
            name: document.getElementById('iv-nm').value.trim(),
            category: document.getElementById('iv-cat').value,
            unit: document.getElementById('iv-u').value,
            opType: document.getElementById('iv-op').value,
            qty: Number(document.getElementById('iv-qty').value) || 0,
            minQty: Number(document.getElementById('iv-min').value) || 0,
            comment: document.getElementById('iv-cmt').value.trim()
          };
          if (!payload.name) { showToast('Укажите название товара'); return; }
          if (C) {
            const res = await C.recordInventoryMove(payload);
            if (res && res.ok) {
              state.inventory = res.inventory || state.inventory;
              state.inventoryLog = res.inventoryLog || state.inventoryLog;
              saveStateLocal(); closeModal(); showToast('Операция по складу проведена'); render(); return;
            }
          }
          showToast('Не удалось провести операцию');
        };
      });
      return;
    }

    // 5. ЧЕК-ЛИСТЫ
    if (tab === 'checklists') {
      const logs = chkFilter === 'all' ? (state.checklists || []) : (state.checklists || []).filter((c) => c.who === chkFilter);
      root.innerHTML = `
        <div class="stack">
          <div class="card">
            <div class="card-head"><div><h2 class="card-title">Блоки и расписание (${(state.blocks || []).length})</h2></div></div>
            <div class="stack-sm">
              ${(state.blocks || []).map((b) => `
                <div class="card-soft row-between">
                  <div><b>${esc(b.name)}</b> <span class="badge">${b.isCash ? 'Касса' : ((state.tasks || []).filter((t) => t.block === b.name).length + ' задач')}</span><div class="card-sub">Окно: ${esc(b.openTime)}–${esc(b.deadline)}</div></div>
                  <div class="row" style="gap:6px;">
                    ${!b.isCash ? `<button class="btn btn-sm" data-edit-tasks="${esc(b.name)}">Задачи</button>` : ''}
                    <button class="btn btn-sm btn-good" data-open-now="${esc(b.name)}">Открыть сейчас</button>
                  </div>
                </div>`).join('')}
            </div>
          </div>
          <div class="card">
            <div class="card-head">
              <div><h2 class="card-title">Журнал прохождения (${logs.length})</h2></div>
              <select id="chk-f" class="btn btn-sm"><option value="all">Все сотрудники</option>${[...new Set((state.checklists || []).map((c) => c.who).filter(Boolean))].map((w) => `<option value="${esc(w)}" ${w === chkFilter ? 'selected' : ''}>${esc(w)}</option>`).join('')}</select>
            </div>
            ${logs.length ? `<div class="tbl-wrap"><table><thead><tr><th>Дата</th><th>Блок</th><th>Сотрудник</th><th>Фото</th><th>Статус</th></tr></thead><tbody>
              ${logs.map((c) => `<tr><td><b>${esc(c.date)}</b> ${esc(c.time)}</td><td>${esc(c.block)}</td><td>${esc(c.who)}</td><td>${(c.photos || []).length ? c.photos.map((u, idx) => `<a href="${esc(u)}" target="_blank" rel="noopener" class="badge accent">📷 ${idx + 1}</a>`).join(' ') : '—'}</td><td><span class="badge good">${esc(c.status)}</span></td></tr>`).join('')}
            </tbody></table></div>` : `<div class="empty-state"><div class="empty-title">Пройденных чек-листов пока нет</div></div>`}
          </div>
        </div>`;
      document.getElementById('chk-f').onchange = (e) => { chkFilter = e.target.value; render(); };
      root.querySelectorAll('[data-open-now]').forEach((b) => {
        b.onclick = () => requireAdmin('Открыть блок', () => {
          if (C) C.enqueueOp('extend_deadline', { block: b.dataset.openNow, openFrom: '00:00', until: '23:59', reason: 'Открыто владельцем' });
          showToast('Блок «' + b.dataset.openNow + '» открыт для бариста');
        });
      });
      root.querySelectorAll('[data-edit-tasks]').forEach((b) => {
        b.onclick = () => {
          const blk = b.dataset.editTasks;
          const list = (state.tasks || []).filter((t) => t.block === blk);
          openModal('Задачи: ' + blk, `
            <div class="stack-sm" style="margin-bottom:12px;">${list.map((t, i) => `<div class="card-soft row-between"><span>${i + 1}. ${esc(t.title)} ${t.photo ? '📷' : ''}</span><button class="btn btn-sm btn-bad" data-dt="${esc(t.id)}">✕</button></div>`).join('') || '<div class="card-sub">Задач пока нет</div>'}</div>
            <div class="field"><label>Новая задача</label><input id="nt-title" placeholder="Название пункта"></div>
            <div class="field"><label>Требовать фото</label><select id="nt-ph"><option value="да">Да</option><option value="нет">Нет</option></select></div>
            <button class="btn btn-primary btn-full" id="nt-add">Добавить задачу</button>
          `);
          document.getElementById('nt-add').onclick = () => requireAdmin('Добавить задачу', () => {
            const title = document.getElementById('nt-title').value.trim();
            if (!title) return;
            const t = { id: 't_' + Date.now(), block: blk, groupName: blk, title, instruction: 'По стандарту Coffee Illy', photo: document.getElementById('nt-ph').value, responsible: 'Бариста', active: 'да' };
            state.tasks.push(Object.assign({}, t, { photo: t.photo === 'да', owner: 'Бариста', active: true }));
            saveStateLocal();
            if (C) C.enqueueOp('save_task', t);
            closeModal(); showToast('Задача добавлена и отправлена в терминал'); render();
          });
          document.querySelectorAll('[data-dt]').forEach((db) => {
            db.onclick = () => requireAdmin('Удалить задачу', () => {
              const id = db.dataset.dt;
              state.tasks = state.tasks.filter((x) => x.id !== id); saveStateLocal();
              if (C) C.enqueueOp('delete_task', { id });
              closeModal(); showToast('Задача удалена'); render();
            });
          });
        };
      });
      return;
    }

    // 6. ПОЛОМКИ И ЗАДАЧИ (Диспетчерская)
    if (tab === 'incidents') {
      const list = incFilter === 'all' ? (state.incidents || []) : (incFilter === 'open' ? openIncs : (state.incidents || []).filter((i) => i.status === incFilter));
      root.innerHTML = `
        <div class="stack">
          <div class="card">
            <div class="card-head"><div><h2 class="card-title">Диспетчерская поломок (${list.length})</h2><div class="card-sub">Управляйте статусами, назначайте ответственных и создавайте задачи в 1 клик</div></div></div>
            <div class="subtabs">
              <button data-if="open" class="${incFilter === 'open' ? 'active' : ''}">Открытые (${openIncs.length})</button>
              <button data-if="all" class="${incFilter === 'all' ? 'active' : ''}">Все (${(state.incidents || []).length})</button>
              ${INC_STATUSES.map((s) => `<button data-if="${esc(s)}" class="${incFilter === s ? 'active' : ''}">${esc(s)}</button>`).join('')}
            </div>
          </div>
          ${list.length ? list.map((i) => `
            <div class="card">
              <div class="row-between">
                <div><b>${esc(i.id)} · ${esc(i.step || i.zone)}</b> <span class="badge ${String(i.priority).includes('Срочно') ? 'bad' : 'warn'}">${esc(i.priority)}</span></div>
                <select class="btn btn-sm" data-inc-st="${esc(i.id)}">${INC_STATUSES.map((s) => `<option value="${esc(s)}" ${s === i.status ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select>
              </div>
              <div style="margin:8px 0;font-size:14.5px;">${esc(i.text)}</div>
              <div class="row-between card-sub">
                <span>${esc(i.date)} ${esc(i.time || '')} · Сообщил: ${esc(i.who || 'Бариста')} · Ответственный: ${esc(i.owner || 'Администратор')}</span>
                <div class="row" style="gap:6px;">
                  ${i.photoUrl ? `<a href="${esc(i.photoUrl)}" target="_blank" rel="noopener" class="btn btn-sm">📷 Фото</a>` : ''}
                  <button class="btn btn-sm btn-primary" data-to-task="${esc(i.id)}">Создать задачу</button>
                </div>
              </div>
            </div>`).join('') : `<div class="empty-state"><div class="empty-title">Поломок по выбранному фильтру нет</div></div>`}
        </div>`;
      root.querySelectorAll('[data-if]').forEach((b) => { b.onclick = () => { incFilter = b.dataset.if; render(); }; });
      root.querySelectorAll('[data-inc-st]').forEach((sel) => {
        sel.onchange = () => requireAdmin('Сменить статус поломки', () => {
          const id = sel.dataset.incSt; const st = sel.value;
          const inc = state.incidents.find((x) => x.id === id);
          if (inc) inc.status = st;
          saveStateLocal();
          if (C) C.enqueueOp('update_incident', { id, status: st });
          showToast('Статус обращения ' + id + ': ' + st); render();
        });
      });
      root.querySelectorAll('[data-to-task]').forEach((b) => {
        b.onclick = () => requireAdmin('Создать задачу из поломки', async () => {
          const inc = state.incidents.find((x) => x.id === b.dataset.toTask);
          if (!inc) return;
          if (C) await C.createTaskFromIncident({ incidentId: inc.id, title: 'Проверить: ' + (inc.step || inc.zone), block: (state.blocks[0] && state.blocks[0].name) || 'Открытие', owner: inc.owner || 'Администратор', instruction: inc.text });
          inc.status = 'В работе'; saveStateLocal();
          showToast('Задача назначена сотруднику'); render();
        });
      });
      return;
    }

    // 7. КОМАНДА И СМЕНЫ (Отдельно от ТТК!)
    if (tab === 'team') {
      root.innerHTML = `
        <div class="stack">
          <div class="card">
            <div class="card-head">
              <div><h2 class="card-title">Команда и смены (${(state.staff || []).length})</h2><div class="card-sub">Статус доступа, смены, выполненные задачи и Telegram ID</div></div>
              <button class="btn btn-primary btn-sm" id="btn-add-staff">+ Сотрудник</button>
            </div>
            <div class="stack-sm">
              ${(state.staff || []).map((s) => {
                const pr = (state.staffPresence || {})[s.name];
                const on = !!(pr && pr.status === 'on_shift');
                const chks = (state.checklists || []).filter((c) => c.who === s.name).length;
                const cashCnt = (state.cash || []).filter((c) => (c.barista || c.who) === s.name).length;
                const incs = (state.incidents || []).filter((i) => i.who === s.name && i.status !== 'Решена').length;
                return `<div class="card-soft row-between">
                  <div>
                    <div><b>${esc(s.name)}</b> <span class="badge">${esc(s.role)}</span> <span class="badge ${on ? 'good' : ''}">${on ? ('На работе с ' + esc(pr.checkedInAt || '')) : 'Не на смене'}</span></div>
                    <div class="card-sub" style="margin-top:4px;">Чек-листов: ${chks} · Кассовых отчётов: ${cashCnt} · Активных поломок: ${incs} · Telegram: ${esc(s.tgId || 'не привязан')}</div>
                  </div>
                  <button class="btn btn-sm" data-edit-st="${esc(s.name)}">Изменить</button>
                </div>`;
              }).join('')}
            </div>
          </div>
        </div>`;
      const openStModal = (stObj) => requireAdmin('Сотрудник', () => {
        openModal(stObj ? ('Сотрудник: ' + stObj.name) : 'Новый сотрудник', `
          <div class="field"><label>Имя</label><input id="st-nm" value="${stObj ? esc(stObj.name) : ''}"></div>
          <div class="grid-2">
            <div class="field"><label>Роль</label><select id="st-rl"><option ${stObj && stObj.role === 'Бариста' ? 'selected' : ''}>Бариста</option><option ${stObj && stObj.role === 'Администратор' ? 'selected' : ''}>Администратор</option></select></div>
            <div class="field"><label>PIN (4–6 цифр)</label><input id="st-pn" value="${stObj ? esc(stObj.pin || '1234') : '1234'}"></div>
          </div>
          <div class="field"><label>Telegram ID (для авто-входа и уведомлений)</label><input id="st-tg" value="${stObj ? esc(stObj.tgId || '') : ''}" placeholder="TG-518294012"></div>
          <button class="btn btn-primary btn-full" id="st-sv">Сохранить</button>
        `);
        document.getElementById('st-sv').onclick = () => {
          const nm = document.getElementById('st-nm').value.trim();
          const rl = document.getElementById('st-rl').value;
          const pn = document.getElementById('st-pn').value.trim();
          const tg = document.getElementById('st-tg').value.trim();
          if (!nm || !/^\d{4,6}$/.test(pn)) { showToast('Проверьте имя и PIN (4–6 цифр)'); return; }
          if (stObj) { stObj.name = nm; stObj.role = rl; stObj.pin = pn; stObj.tgId = tg; }
          else state.staff.push({ id: 'st_' + Date.now(), name: nm, role: rl, active: true, pin: pn, tgId: tg });
          saveStateLocal();
          if (C) {
            C.enqueueOp('save_staff', { name: nm, role: rl, tgId: tg });
            C.enqueueOp('save_staff_pins', { pins: [{ name: nm, pin: pn }] });
          }
          closeModal(); showToast('Данные сотрудника сохранены'); render();
        };
      });
      document.getElementById('btn-add-staff').onclick = () => openStModal(null);
      root.querySelectorAll('[data-edit-st]').forEach((b) => { b.onclick = () => openStModal(state.staff.find((x) => x.name === b.dataset.editSt)); });
      return;
    }

    // 8. ТЕХНОЛОГИЧЕСКИЕ КАРТЫ (Отдельный раздел!)
    if (tab === 'ttk') {
      const list = (state.ttk || []).filter((k) => !ttkSearch || String(k.name + ' ' + k.cat).toLowerCase().includes(ttkSearch.toLowerCase()));
      root.innerHTML = `
        <div class="stack">
          <div class="card">
            <div class="card-head">
              <div><h2 class="card-title">Технологические карты (${list.length})</h2><div class="card-sub">Сразу синхронизируются в раздел ТТК у бариста</div></div>
              <button class="btn btn-primary btn-sm" id="btn-add-ttk">+ Добавить ТТК</button>
            </div>
            <div class="field" style="margin-bottom:12px;"><input id="own-ttk-q" value="${esc(ttkSearch)}" placeholder="Поиск напитка..."></div>
            ${list.length ? `<div class="tbl-wrap"><table><thead><tr><th>Напиток</th><th>Категория</th><th>Объём</th><th>Цена</th><th>Себест.</th><th>Маржа</th><th></th></tr></thead><tbody>
              ${list.map((k) => `<tr><td><b>${esc(k.name)}</b></td><td>${esc(k.cat)}</td><td>${esc(k.vol)}</td><td>${fmtRub(k.price)}</td><td>${fmtRub(k.cost)}</td><td><span class="badge good">${k.price ? Math.round(((k.price - k.cost) / k.price) * 100) : 0}%</span></td><td><button class="btn btn-sm" data-edit-ttk="${esc(k.id)}">Изменить</button></td></tr>`).join('')}
            </tbody></table></div>` : `<div class="empty-state"><div class="empty-title">Технологических карт пока нет</div></div>`}
          </div>
        </div>`;
      document.getElementById('own-ttk-q').oninput = (e) => { ttkSearch = e.target.value; render(); document.getElementById('own-ttk-q').focus(); };
      const openTtk = (k) => requireAdmin('Технологическая карта', () => {
        openModal(k ? ('ТТК: ' + k.name) : 'Новая технологическая карта', `
          <div class="field"><label>Название напитка</label><input id="tk-nm" value="${k ? esc(k.name) : ''}"></div>
          <div class="grid-2">
            <div class="field"><label>Категория</label><input id="tk-ct" value="${k ? esc(k.cat) : 'Классика'}"></div>
            <div class="field"><label>Объём и стакан</label><input id="tk-vl" value="${k ? esc(k.vol) : '250 мл'}"></div>
          </div>
          <div class="grid-2">
            <div class="field"><label>Цена (₽)</label><input id="tk-pr" type="number" min="1" value="${k ? k.price : 35}"></div>
            <div class="field"><label>Себестоимость (₽)</label><input id="tk-cs" type="number" min="0" step="0.1" value="${k ? k.cost : 10}"></div>
          </div>
          <div class="field"><label>Состав, граммовки и приготовление</label><textarea id="tk-rc">${k ? esc(k.recipe) : ''}</textarea></div>
          <button class="btn btn-primary btn-full" id="tk-sv">Сохранить ТТК</button>
        `);
        document.getElementById('tk-sv').onclick = () => {
          const rec = { id: k ? k.id : ('ttk_' + Date.now()), name: document.getElementById('tk-nm').value.trim(), cat: document.getElementById('tk-ct').value.trim() || 'Классика', vol: document.getElementById('tk-vl').value.trim() || '250 мл', price: Number(document.getElementById('tk-pr').value) || 0, cost: Number(document.getElementById('tk-cs').value) || 0, recipe: document.getElementById('tk-rc').value.trim() };
          if (!rec.name) { showToast('Укажите название напитка'); return; }
          if (k) Object.assign(k, rec); else state.ttk.push(rec);
          saveStateLocal();
          if (C) C.enqueueOp('save_ttk', rec);
          closeModal(); showToast('Технологическая карта сохранена'); render();
        };
      });
      document.getElementById('btn-add-ttk').onclick = () => openTtk(null);
      root.querySelectorAll('[data-edit-ttk]').forEach((b) => { b.onclick = () => openTtk(state.ttk.find((x) => x.id === b.dataset.editTtk)); });
      return;
    }

    // 9. НАСТРОЙКИ
    if (tab === 'settings') {
      root.innerHTML = `
        <div class="stack">
          <div class="card">
            <h2 class="card-title" style="margin-bottom:12px;">Параметры кофейни</h2>
            <div class="grid-2">
              <div class="field"><label>Название кофейни</label><input id="set-loc" value="${esc(state.location)}"></div>
              <div class="field"><label>Дневной план выручки (₽)</label><input id="set-plan" type="number" min="0" value="${state.plan}"></div>
            </div>
            <div class="grid-2">
              <div class="field"><label>План чеков</label><input id="set-chks" type="number" min="0" value="${state.planChecks}"></div>
              <div class="field"><label>Фото обязательно во всех пунктах</label><select id="set-ph"><option value="0" ${!state.photoAll ? 'selected' : ''}>Нет</option><option value="1" ${state.photoAll ? 'selected' : ''}>Да</option></select></div>
            </div>
            <button class="btn btn-primary" id="btn-save-set">Сохранить параметры</button>
          </div>

          <div class="card">
            <div class="card-head">
              <div><h2 class="card-title">Telegram-бот: уведомления и авто-запуск</h2><div class="card-sub">Мгновенные алерты при поломках + личное уведомление сотруднику при открытии чек-листа</div></div>
              <span class="badge ${state.tgConfiguredOnServer ? 'good' : 'warn'}">${state.tgConfiguredOnServer ? 'Подключён' : 'Нужен токен'}</span>
            </div>
            <div class="grid-2">
              <div class="field"><label>Токен Telegram-бота (BotFather)</label><input id="tg-tok" type="password" placeholder="${state.tgConfiguredOnServer ? '•••••••• (хранится на сервере)' : '123456:ABC...'}"></div>
              <div class="field"><label>Chat ID администратора</label><input id="tg-chat" value="${esc(state.tgChat || '')}" placeholder="Например: 518294012"></div>
            </div>
            <div class="field"><label>URL приложения (GitHub Pages — для кнопки перехода)</label><input id="tg-url" value="${esc(state.webappUrl || (location.origin + location.pathname.replace(/(owner|dashboard|admin)\.html$/i, '')))}" placeholder="https://kap1001z15-lab.github.io/coffee-illy/"></div>
            <div class="row" style="gap:8px;">
              <button class="btn btn-primary btn-sm" id="tg-save">Сохранить Telegram</button>
              <button class="btn btn-good btn-sm" id="tg-auto">Включить авто-уведомления (5 мин)</button>
              <button class="btn btn-sm" id="tg-test">Тест админу</button>
              <button class="btn btn-sm" id="tg-run">Проверить чек-листы сейчас</button>
            </div>
          </div>

          <div class="card">
            <div class="card-head"><div><h2 class="card-title">Резервное копирование</h2><div class="card-sub">Создание серверной точки восстановления данных</div></div><button class="btn btn-sm" id="btn-bkp">Создать резервную копию</button></div>
          </div>
        </div>`;

      document.getElementById('btn-save-set').onclick = () => requireAdmin('Сохранить параметры', () => {
        state.location = document.getElementById('set-loc').value.trim() || state.location;
        state.plan = Math.max(0, Number(document.getElementById('set-plan').value) || 0);
        state.planChecks = Math.max(0, Number(document.getElementById('set-chks').value) || 0);
        state.photoAll = document.getElementById('set-ph').value === '1';
        saveStateLocal();
        if (C) C.enqueueOp('save_all_settings', { items: [
          { id: 'LOCATION', value: state.location }, { id: 'PLAN', value: String(state.plan) },
          { id: 'PLAN_CHECKS', value: String(state.planChecks) }, { id: 'PHOTO_ALL', value: state.photoAll ? 'да' : 'нет' }
        ] });
        showToast('Параметры сохранены и синхронизированы'); render();
      });
      document.getElementById('tg-save').onclick = () => requireAdmin('Настройки Telegram', async () => {
        const res = await C.saveTelegramSettings({ tgToken: document.getElementById('tg-tok').value.trim(), tgChat: document.getElementById('tg-chat').value.trim(), webappUrl: document.getElementById('tg-url').value.trim() });
        if (res && res.ok) { state.tgConfiguredOnServer = !!res.tgConfiguredOnServer; state.tgChat = res.tgChat || ''; state.webappUrl = res.webappUrl || ''; saveStateLocal(); showToast('Настройки Telegram сохранены'); render(); }
        else showToast('Ошибка сохранения Telegram');
      });
      document.getElementById('tg-auto').onclick = () => requireAdmin('Включить авто-уведомления', async () => {
        const res = await C.setupTriggers();
        if (res && res.ok) { state.autopilotEnabled = true; showToast('Авто-уведомления (каждые 5 минут) включены'); render(); }
      });
      document.getElementById('tg-test').onclick = () => requireAdmin('Тест Telegram', async () => {
        const res = await C.testTelegramAlert();
        showToast(res && res.ok ? 'Тестовое уведомление отправлено в Telegram' : 'Не удалось отправить — проверьте токен и Chat ID');
      });
      document.getElementById('tg-run').onclick = () => requireAdmin('Проверить чек-листы', async () => {
        const res = await C.runChecklistNotificationsNow({});
        const n = (res && Array.isArray(res.sent)) ? res.sent.length : 0;
        showToast(n ? ('Отправлено уведомлений сотрудникам: ' + n) : 'Новых открытых чек-листов для отправки нет');
      });
      document.getElementById('btn-bkp').onclick = () => requireAdmin('Резервная копия', async () => {
        const res = await C.createBackup();
        showToast(res && res.ok ? ('Резервная копия создана: ' + res.backupId) : 'Не удалось создать копию');
      });
    }
  }

  document.getElementById('period-sel').onchange = (e) => { period = e.target.value; render(); };
  document.getElementById('btn-refresh').onclick = async () => {
    showToast('Обновление данных...');
    if (cloudLoop) await cloudLoop.pullNow(true);
  };
  document.getElementById('btn-profile').onclick = openProfileModal;

  render();
  if (C) {
    cloudLoop = C.startCloudLoop({
      mode: 'owner',
      getState: () => state,
      onStatus: updateSyncPill,
      onSynced: () => { saveStateLocal(); render(); }
    });
  }
})();
</script>
</body>
</html>
