", "active": true}, {"id": "o05", "block": "Открытие", "groupName": "Открытие · Стандарт (o01–o08)", "title": "🔥 Термопот", "instruction": "Проверка водонагревателя (термопота):\n• Включён в сеть, заполнен очищенной питьевой водой до отметки максимума.\n• Температура воды вышла на рабочий режим (92–95 °C).\n• Корпус и каплесборник чистые, без подтёков и накипи.", "photoReq": false, "responsible": "Техник", "active": true}, {"id": "o06", "block": "Открытие", "groupName": "Открытие · Стандарт (o01–o08)", "title": "💡 Оборудование и подсветка", "instruction": "Включение света, звука и медиа:\n• Проектор, аудиоколонки (фоновая музыка на комфортной громкости) и декоративная подсветка включены.\n• Световая инсталляция и освещение у зеркала работают без мерцаний.", "photoReq": false, "responsible": "Техник", "active": true}, {"id": "o07", "block": "Открытие", "groupName": "Открытие · Стандарт (o01–o08)", "title": "🌿 Летняя терраса Фото", "instruction": "Подготовка уличной зоны / летней террасы:\n• Уличные столы и стулья аккуратно расставлены по местам и насухо протёрты.\n• Пледы чистые, без пятен, аккуратно сложены.\n• Прилегающая территория и входная группа чистые, без мусора и листьев.\n• Сделать контрольное фото летней террасы.", "photoReq": true, "responsible": "Администратор", "active": true}, {"id": "o08", "block": "Открытие", "groupName": "Открытие · Стандарт (o01–o08)", "title": "🧼 Санузел для гостей 📸 2", "instruction": "Важно !!! Полная утренняя проверка гостевого санузла (сделать 2 фото):\n• 🪞 Зеркало: протёрто средством для стёкол без разводов и следов пальцев, поверхность блестящая.\n• 🧻 Расходники: жидкое мыло в дозаторе в наличии, туалетная бумага и бумажные полотенца пополнены.\n• 🚽 Унитаз и бачок: чистые, обработаны, кнопка слива работает исправно, протечек нет, посторонний запах отсутствует.\n• 🗑 Мусорное ведро 📸: пустое, чистое, заправлен новый мусорный пакет.", "photoReq": true, "responsible": "Администратор", "active": true}, {"id": "d01", "block": "Лайн Чек 1", "groupName": "День · Обход смены (d01–d06)", "title": "🌬️ Помещение проветрено и свежесть воздуха", "instruction": "Контроль микроклимата в зале:\n• Помещение проветрено, работает вентиляция или кондиционер по сезону.\n• Нет затхлого запаха, запаха гари или кухни, воздух в зале свежий и комфортный для гостей.", "photoReq": false, "responsible": "Администратор", "active": true}, {"id": "d02", "block": "Лайн Чек 1", "groupName": "День · Обход смены (d01–d06)", "title": "☕ Оборудование проверено", "instruction": "Контроль работы барного оборудования в течение смены:\n• Кофемашина, кофемолка, чайник/термопот, холодильник и десертная витрина включены.\n• Все приборы держат рабочую температуру и работают штатно без аварийных сигналов и посторонних шумов.", "photoReq": false, "responsible": "Техник", "active": true}, {"id": "d03", "block": "Лайн Чек 1", "groupName": "День · Обход смены (d01–d06)", "title": "🥛 Заготовки для напитков и молочные продукты", "instruction": "Контроль запасов и ротации (FIFO) в разгар дня:\n• Молоко обычное ≥ 5 л в запасе.\n• Альтернативное молоко ≥ 2 л.\n• Сливки ≥ 2 упаковок.\n• Сиропы, пюре и топпинги чистые, с дозаторами, стоят на своих местах.\n• Лёд в льдогенераторе готов в достаточном объёме.\n• 📸 Сделать фото холодильника в «подсобке» и фото холодильника за стойкой.", "photoReq": true, "responsible": "Закупщик", "active": true}, {"id": "d04", "block": "Лайн Чек 1", "groupName": "День · Обход смены (d01–d06)", "title": "🍰 Десерты и закуски", "instruction": "Контроль витрины с десертами:\n• Закуски и десерты пополнены и представлены в ДОСТАТОЧНОМ количестве.\n• Срок годности и маркировки актуальны, заветренных позиций нет.\n• Витрина чистая внутри и снаружи, фронтальное стекло без разводов и отпечатков.\n• Десерты и ценники выложены ровно и аккуратно 📸 (сделать фото витрины).", "photoReq": true, "responsible": "Закупщик", "active": true}, {"id": "d05", "block": "Лайн Чек 1", "groupName": "День · Обход смены (d01–d06)", "title": "🧼 Зона гостя и стойка на виду", "instruction": "Поддержание чистоты зоны выдачи и гостевой стойки:\n• Стойка и прилавок со стороны гостя идеально чистые: нет крошек, капель кофе, пятен и липких следов.\n• Грязная посуда со столов и стойки своевременно убрана в мойку.\n• Диспенсер с салфетками, крышками, трубочками и сахаром пополнен.", "photoReq": true, "responsible": "Администратор", "active": true}, {"id": "d06", "block": "Лайн Чек 1", "groupName": "День · Обход смены (d01–d06)", "title": "🚽 Санузел проверен (2-3 сек видео) 📹", "instruction": "Дневная проверка санузла для гостей:\n• Санузел чистый, пол сухой, раковина и зеркало без брызг воды.\n• Туалетная бумага, мыло и бумажные полотенца в наличии.\n• Мусорное ведро не переполнено, запах свежий.\n• 📹 Сделать короткий обзорный видео-отчёт (2–3 секунды).", "photoReq": true, "responsible": "Администратор", "active": true}, {"id": "c01", "block": "Закрытие", "groupName": "Закрытие · Стандарт (c01–c14)", "title": "🧴 Диспенсер с расходниками заполнен", "instruction": "Подготовка органайзера и расходников на утро:\n• Диспенсер полностью заполнен салфетками, порционным сахаром, трубочками и размешивателями (палочками).\n• Все открытые складские упаковки с расходниками плотно закрыты от пыли и влаги.", "photoReq": true, "responsible": "Закупщик", "active": true}, {"id": "c02", "block": "Закрытие", "groupName": "Закрытие · Стандарт (c01–c14)", "title": "🪑 Зал и посадочные места", "instruction": "Уборка гостевого зала перед закрытием:\n• Все столы тщательно протёрты от крошек и пятен.\n• Диваны и стулья устойчивы, очищены щёткой/пылесосом от крошек.\n• Декор выровнен, пыль на полках и подоконниках отсутствует.\n• Все свечи в зале обязательно погашены.", "photoReq": true, "responsible": "Администратор", "active": true}, {"id": "c03", "block": "Закрытие", "groupName": "Закрытие · Стандарт (c01–c14)", "title": "☕ Кофемашина", "instruction": "Замывка и выключение кофемашины:\n• Проведена промывка групп со слепым фильтром и профессиональным средством (Cafiza), затем промывка чистой водой.\n• Холдеры и сита вымыты, кофейный жмых и масла полностью удалены, съёмные детали и решётка поддона промыты и установлены на место.\n• Стимеры (паровые трубки) очищены от молока и продуты.\n• Подтёков воды и накипи нет, хромированные детали натёрты насухо. Кофемашина выключена.", "photoReq": true, "responsible": "Техник", "active": true}, {"id": "c04", "block": "Закрытие", "groupName": "Закрытие · Стандарт (c01–c14)", "title": "⚙️ Гриндеры", "instruction": "Очистка кофемолок и фиксация счётчиков:\n• Гриндеры протёрты снаружи и в зоне выдачи, остатки молотого кофе сметены кистью, устройства выключены.\n• Показания счётчиков порций кофемашины/гриндеров сняты и внесены в кассовый отчёт смены.", "photoReq": true, "responsible": "Шеф-бариста", "active": true}, {"id": "c05", "block": "Закрытие", "groupName": "Закрытие · Стандарт (c01–c14)", "title": "🧽 Рабочая зона", "instruction": "Замывка барной станции:\n• Рабочая столешница и фартук вымыты с моющим средством и протёрты насухо.\n• Липких пятен от сиропов, молока и кофе нет.\n• Весь мелкий инвентарь (питчеры, темпер, коврик, весы) чистый и расставлен по местам.", "photoReq": true, "responsible": "Администратор", "active": true}, {"id": "c06", "block": "Закрытие", "groupName": "Закрытие · Стандарт (c01–c14)", "title": "🔥 Термопот", "instruction": "Отключение термопота:\n• Заполнен очищенной водой для утренней смены.\n• Питание выключено, корпус и каплесборник протёрты насухо, без подтёков.", "photoReq": false, "responsible": "Техник", "active": true}, {"id": "c07", "block": "Закрытие", "groupName": "Закрытие · Стандарт (c01–c14)", "title": "💰 Касса и терминалы Фото", "instruction": "Закрытие кассовой смены:\n• Наличные в кассе пересчитаны и сверены с отчётом.\n• Разменная сумма на утро оставлена в кассе в полном объёме (250 руб мелкими купюрами).\n• Фотоотчёт кассы сделан после подсчёта.\n• Банковский терминал и чековый принтер выключены, рабочий телефон поставлен на зарядку.", "photoReq": true, "responsible": "Администратор", "active": true}, {"id": "c08", "block": "Закрытие", "groupName": "Закрытие · Стандарт (c01–c14)", "title": "🍰 Холодильник и витрина", "instruction": "Уход за витриной и хранением десертов:\n• Подсветка витрины выключена (холодильный контур работает по регламенту), стёкла и полки протёрты.\n• Отпечатков пальцев и разводов на стекле нет.\n• Все десерты проверены по срокам, закрыты крышками/плёнкой от заветривания.", "photoReq": true, "responsible": "Закупщик", "active": true}, {"id": "c09", "block": "Закрытие", "groupName": "Закрытие · Стандарт (c01–c14)", "title": "🪞 Зеркала и остекление", "instruction": "Натирка зеркал и входного остекления:\n• Зеркала в зале и стеклянные поверхности входной группы протёрты со средством для стёкол.\n• Разводов, брызг и следов пальцев нет, поверхности сухие.", "photoReq": false, "responsible": "Администратор", "active": true}, {"id": "c10", "block": "Закрытие", "groupName": "Закрытие · Стандарт (c01–c14)", "title": "💡 Оборудование и подсветка", "instruction": "Отключение иллюминации и медиа:\n• Проектор, неоновая/декоративная подсветка, аудиоколонки и дополнительное освещение выключены.\n• Световая инсталляция у зеркал и подсветка стола — выключены.", "photoReq": false, "responsible": "Техник", "active": true}, {"id": "c11", "block": "Закрытие", "groupName": "Закрытие · Стандарт (c01–c14)", "title": "🌿 Летняя терраса", "instruction": "Уборка летней террасы на ночь:\n• Уличные столы и стулья протёрты и занесены внутрь помещения (или зафиксированы по регламенту).\n• Пледы проверены (чистые, без пятен и прожогов) и аккуратно сложены на хранение.", "photoReq": true, "responsible": "Администратор", "active": true}, {"id": "c12", "block": "Закрытие", "groupName": "Закрытие · Стандарт (c01–c14)", "title": "🧼 Санузел для гостей", "instruction": "Полная вечерняя уборка санузла по чек-листу:\n• 🚻 Входная дверь — проверена исправность замка и доводчика; полотно двери и ручка протёрты, без следов рук.\n• 🧴 Раковина и смеситель — вымыты и вытерты насухо; смеситель натёрт без налёта и подтёков, вода не капает.\n• 🪞 Зеркало — протёрто без разводов и следов пальцев, поверхность блестящая.\n• 🧻 Расходники — проверен и пополнен запас жидкого мыла, туалетной бумаги и бумажных полотенец на утро.\n• 🚽 Унитаз и бачок — обработаны дезсредством, крышка опущена, бачок не протекает, запах отсутствует.\n• 🧹 Пол и стены — пол вымыт с дезсредством и высушен, плитка без пятен и налёта.\n• 🗑 Мусорное ведро — освобождено, вымыто, установлен новый пакет.\n• 💡 Освещение и вентиляция — свет и вытяжка выключены, проверена исправность выключателя.", "photoReq": true, "responsible": "Администратор", "active": true}, {"id": "c13", "block": "Закрытие", "groupName": "Закрытие · Стандарт (c01–c14)", "title": "🚪 Закрытие помещения", "instruction": "Финальная проверка перед выходом:\n• Все декоративные подсветки, сплит-система и барное оборудование (кроме холодильников) выключены.\n• Жалюзи / роллеты опущены, окна закрыты.", "photoReq": false, "responsible": "Администратор", "active": true}, {"id": "c14", "block": "Закрытие", "groupName": "Закрытие · Стандарт (c01–c14)", "title": "🗑 Мусор выброшен, баки на улице пустые 📸💬", "instruction": "Вынос всего мусора из кофейни и уличных урн:\n• Все мусорные пакеты из-под бара, подсобки и санузла завязаны и вынесены в контейнер.\n• Уличные баки у входа очищены, внутрь вставлены чистые пакеты.\n• 📸 Сделать фото пустых баков и закрытой входной двери.", "photoReq": true, "responsible": "Администратор", "active": true}, {"id": "pa01", "block": "Открытие", "groupName": "Открытие · Приёмка смены (pa01–pa21)", "title": "📸 Фото-селфи 📸", "instruction": "Фото перед началом смены.\nВолосы убраны в хвост, аккуратный внешний вид, чистая форма, минимальный макияж.", "photoReq": true, "responsible": "Администратор", "active": true}, {"id": "pa02", "block": "Открытие", "groupName": "Открытие · Приёмка смены (pa01–pa21)", "title": "🌿 Летняя терраса Фото📸", "instruction": "Столы и стулья расставлены, протёрты. Пледы чистые, сложены аккуратно, территория без мусора. Сделать фото.", "photoReq": true, "responsible": "Администратор", "active": true}, {"id": "pa03", "block": "Открытие", "groupName": "Открытие · Приёмка смены (pa01–pa21)", "title": "🪑 Зал и посадочные места", "instruction": "Столы чистые, без крошек и пятен, диваны устойчивые, декор выровнен, пыль отсутствует, посадка полностью готова к приёму гостей.", "photoReq": false, "responsible": "Администратор", "active": true}, {"id": "pa04", "block": "Открытие", "groupName": "Открытие · Приёмка смены (pa01–pa21)", "title": "☕ Кофемашина + ☝️холдеры", "instruction": "Кофемашина включена и прогрета.\nСъёмные детали и чистые холдеры на месте.\nПодтёков воды и накипи нет, хромированные детали натёрты до блеска.", "photoReq": true, "responsible": "Техник", "active": true}, {"id": "pa05", "block": "Открытие", "groupName": "Открытие · Приёмка смены (pa01–pa21)", "title": "⚙️ Гриндеры", "instruction": "Гриндеры протёрты, старые остатки кофе отсутствуют, помол проверен.\nУтренние показания счётчиков сверены и внесены в отчёт.", "photoReq": false, "responsible": "Шеф-бариста", "active": true}, {"id": "pa06", "block": "Открытие", "groupName": "Открытие · Приёмка смены (pa01–pa21)", "title": "🧽 Рабочая зона и Мойка за стойкой", "instruction": "Рабочая поверхность вымыта и протёрта насухо, пятен от сиропов и кофе нет, порядок соблюдён.\nМойка за стойкой чистая, грязная посуда отсутствует.", "photoReq": false, "responsible": "Администратор", "active": true}, {"id": "pa07", "block": "Открытие", "groupName": "Открытие · Приёмка смены (pa01–pa21)", "title": "🔥 Термопот", "instruction": "Заполнен очищенной водой, включён на прогрев, корпус сухой, без подтёков.", "photoReq": false, "responsible": "Техник", "active": true}, {"id": "pa08", "block": "Открытие", "groupName": "Открытие · Приёмка смены (pa01–pa21)", "title": "💰 Касса и терминалы", "instruction": "Разменная сумма в наличии (250 руб мелкими купюрами).\nТерминал и чековый принтер включены, рабочий телефон и планшет заряжены.\nВсё работает штатно, не зависает и блестит.", "photoReq": false, "responsible": "Администратор", "active": true}, {"id": "pa09", "block": "Открытие", "groupName": "Открытие · Приёмка смены (pa01–pa21)", "title": "🧾 Кассовая лента Запас - 2шт.", "instruction": "Чековая лента установлена в принтер и терминал, в кассовой зоне в наличии минимум 2 запасных рулона.", "photoReq": false, "responsible": "Закупщик", "active": true}, {"id": "pa10", "block": "Открытие", "groupName": "Открытие · Приёмка смены (pa01–pa21)", "title": "🍰 Холодильник и витрина", "instruction": "Холодильники и витрина чистые, продукты свежие, просрочки нет, открытое молоко закрыто крышками, товарное соседство и порядок соблюдены.", "photoReq": false, "responsible": "Закупщик", "active": true}, {"id": "pa11", "block": "Открытие", "groupName": "Открытие · Приёмка смены (pa01–pa21)", "title": "📦 Расходники барной зоны", "instruction": "Одноразовые стаканы всех объёмов, крышки, сахар, салфетки, трубочки и размешиватели заполнены до полной нормы.", "photoReq": false, "responsible": "Закупщик", "active": true}, {"id": "pa12", "block": "Открытие", "groupName": "Открытие · Приёмка смены (pa01–pa21)", "title": "🍃 Заготовки", "instruction": "Ягодные/фруктовые заготовки, лимонады и основы свежие, промаркированы, без заветривания, полностью готовы к использованию.", "photoReq": false, "responsible": "Шеф-бариста", "active": true}, {"id": "pa13", "block": "Открытие", "groupName": "Открытие · Приёмка смены (pa01–pa21)", "title": "🥛 Молоко", "instruction": "Молоко (обычное, безлактозное, альтернативное) с актуальным сроком годности, охлаждённое, закрытое, достаточный объём для смены.", "photoReq": false, "responsible": "Закупщик", "active": true}, {"id": "pa14", "block": "Открытие", "groupName": "Открытие · Приёмка смены (pa01–pa21)", "title": "🍽 Посуда и инвентарь", "instruction": "Керамические чашки function pressAdmPin(d) {
  if (d === 'C') admPinBuf = ''; else if (d === 'B') admPinBuf = admPinBuf.slice(0, -1); else if (admPinBuf.length < 4) admPinBuf += d;
  document.querySelectorAll('.adm-dot').forEach((el, idx) => el.classList.toggle('filled', idx < admPinBuf.length));
  if (admPinBuf.length === 4) {
    if (admPinBuf === getStore().adminPin) { admPinBuf = ''; loggedIn = true; render(); }
    else { admPinBuf = ''; setTimeout(() => document.querySelectorAll('.adm-dot').forEach(el => el.classList.remove('filled')), 180); showToast('Неверный PIN (1234)'); }
  }
}
document.addEventListener('keydown', (e) => {
  if (loggedIn) return;
  if (/^[0-9]$/.test(e.key)) pressAdmPin(e.key);
  else if (e.key === 'Backspace') pressAdmPin('B');
  else if (e.key === 'Escape') pressAdmPin('C');
});

function deltaBadge(actual, target, unit) {
  if (!target || !actual) return '<span class="badge warn">Нет данных</span>';
  const diff = actual - target, pct = Math.round((diff / target) * 100);
  return pct >= 0 ? `<span class="badge good">Обгоняет +${pct}% (+${diff} ${unit})</span>` : `<span class="badge bad">Отстаёт ${pct}% (${diff} ${unit})</span>`;
}

  const st = getStore(), root = document.getElementById('root');
  if (!loggedIn) {
    root.innerHTML = `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px"><div class="card" style="width:min(360px,100%);text-align:center"><div class="brand" style="justify-content:center;margin-bottom:6px"><span class="brand-badge">illy</span><span>Coffee Illy Дашборд</span></div><div class="muted">Единая панель владельца и администратора (PIN: <strong>1234</strong>)</div><div class="pin-dots"><span class="pin-dot adm-dot"></span><span class="pin-dot adm-dot"></span><span class="pin-dot adm-dot"></span><span class="pin-dot adm-dot"></span></div><div class="pin-pad">${['1','2','3','4','5','6','7','8','9','C','0','B'].map(k=>`<button class="pin-key" onclick="pressAdmPin('${k}')">${k==='B'?'⌫':k}</button>`).join('')}</div></div></div>`;
    return;
  }

  const dates = Array.from(new Set(st.imports.map(x => x.date))).sort().reverse();
  if (!dates.includes(selectedDate) && dates.length) selectedDate = dates[0];
  const daySales = st.imports.filter(x => x.date === selectedDate && x.type === 'sales');
  const dayTx = st.imports.filter(x => x.date === selectedDate && x.type === 'tx');
  const rev = daySales.reduce((s, x) => s + x.totalSum, 0);
  const checks = dayTx.reduce((s, x) => s + x.checks, 0);
  const cashPay = dayTx.reduce((s, x) => s + x.cashSum, 0);
  const mobPay = dayTx.reduce((s, x) => s + x.mobileSum, 0);
  const avgCheck = checks > 0 ? Math.round((cashPay + mobPay) / checks) : 0;

  const nav = [['overview','Обзор'],['operations','Операции'],['finance','Финансы'],['staff','Персонал'],['standards','Блюда и ТТК'],['control','Контроль и API'],['settings','Настройки']];

  let bodyHtml = '';
  if (section === 'overview') {
    bodyHtml = `
      <div class="row-gap" style="justify-content:space-between">
        <select class="field" style="width:auto;margin:0" onchange="selectedDate=this.value;render()">${dates.map(d=>`<option value="${d}" ${selectedDate===d?'selected':''}>Дата: ${d}</option>`).join('')}</select>
        <div class="row-gap">
          <button class="btn primary" onclick="section='standards';render()">Новые блюда (${st.ttk.filter(x=>x.isNew).length})</button>
          <button class="btn" onclick="section='settings';render()">Быстрые настройки</button>
        </div>
      </div>
      <div class="kpi-grid">
        <div class="card"><div class="muted">Выручка за ${selectedDate}</div><div class="kpi-val">${rev} ₽ ПМР</div>${deltaBadge(rev, st.planRevenue, '₽')}<div class="muted" style="margin-top:4px">План: ${st.planRevenue} ₽</div></div>
        <div class="card"><div class="muted">Средний чек</div><div class="kpi-val">${avgCheck ? avgCheck + ' ₽ ПМР' : 'Нет TX'}</div>${avgCheck ? deltaBadge(avgCheck, st.minAvgCheck, '₽') : ''}</div>
        <div class="card"><div class="muted">Чеки за день</div><div class="kpi-val">${checks}</div>${checks ? deltaBadge(checks, st.planChecks, 'чек.') : ''}</div>
        <div class="card"><div class="muted">Оплата: Нал / Моб.</div><div class="kpi-val" style="font-size:1.2rem">${cashPay} / ${mobPay} ₽</div></div>
      </div>
      <div class="card">
        <h3>Новые блюда и позиции (кликните для деталей или смените категорию списком)</h3>
        ${st.ttk.map((t, idx) => `
          <div class="row-item" onclick="openDishDetail('${t.id}')">
            <div><strong>${t.name}</strong> ${t.isNew?'<span class="badge warn">Новое</span>':''}<div class="muted">${t.price} ₽ · v${t.version}</div></div>
            <select class="field" style="width:auto;margin:0" onclick="event.stopPropagation()" onchange="const s=getStore();s.ttk[${idx}].category=this.value;s.ttk[${idx}].isNew=(this.value==='Новое блюдо');saveStore(s);showToast('Категория: '+this.value);render()">
              ${['Кофе','Не кофе','Новое блюдо','Требует классификации'].map(c=>`<option ${t.category===c?'selected':''}>${c}</option>`).join('')}
            </select>
          </div>
        `).join('')}
      </div>
      <div class="card">
        <h3>Кассовые отчёты и инциденты (кликните для деталей)</h3>
        ${st.cashReports.map((c, idx)=>`
          <div class="row-item" onclick="openDetail('Касса ${c.id}','${c.date} · ${c.staff}','Наличные: ${c.cash} ₽<br>Безнал: ${c.card} ₽<br>Счётчик: ${c.counterStart}→${c.counterEnd} (Δ ${c.counterDelta})')">
            <div><strong>${c.id} · ${c.staff}</strong><div class="muted">${c.cash+c.card} ₽ · Δ ${c.counterDelta}</div></div>
            <select class="field" style="width:auto;margin:0" onclick="event.stopPropagation()" onchange="const s=getStore();s.cashReports[${idx}].status=this.value;saveStore(s);showToast('Статус кассы: '+this.value)">
              ${['Ожидает проверки','Подтверждено','Требует сверки'].map(v=>`<option ${c.status===v?'selected':''}>${v}</option>`).join('')}
            </select>
          </div>
        `).join('')}
        ${st.incidents.map((i, idx)=>`
          <div class="row-item" onclick="openDetail('${i.id} · ${i.category}','${i.date} · ${i.author}','${i.text}')">
            <div><strong>${i.id} · ${i.category}</strong><div class="muted">${i.text}</div></div>
            <select class="field" style="width:auto;margin:0" onclick="event.stopPropagation()" onchange="const s=getStore();s.incidents[${idx}].status=this.value;saveStore(s);showToast('Статус: '+this.value)">
              ${['Новое','Принято в работу','Ожидает решения','Решено','Закрыто'].map(v=>`<option ${i.status===v?'selected':''}>${v}</option>`).join('')}
            </select>
          </div>
        `).join('')}
      </div>
    `;
  } else if (section === 'operations') {
    const filtered = st.tasks.map((t, idx) => ({ t, idx })).filter(x => x.t.block === filterBlock);
    bodyHtml = `
      <div class="card">
        <div class="row-gap" style="justify-content:space-between;margin-bottom:8px">
          <h3 style="margin:0">Чек-листы (настройка из списков)</h3>
          <select class="field" style="width:auto;margin:0" onchange="filterBlock=this.value;render()">${['Открытие','Лайн Чек 1','Лайн Чек 2','Закрытие'].map(b=>`<option ${filterBlock===b?'selected':''}>${b}</option>`).join('')}</select>
        </div>
        ${filtered.map(({t, idx})=>`
          <div class="row-item" onclick="openDetail('${t.id} · ${t.title}','Этап: ${t.block}','${t.instruction.replace(/
/g,'<br>')}')">
            <div style="flex:1;min-width:200px"><strong>${t.id} · ${t.title}</strong></div>
            <div class="row-gap" onclick="event.stopPropagation()">
              <select class="field" style="width:auto;margin:0" onchange="const s=getStore();s.tasks[${idx}].block=this.value;saveStore(s);showToast('Этап обновлён');render()">
                ${['Открытие','Лайн Чек 1','Лайн Чек 2','Закрытие'].map(b=>`<option ${t.block===b?'selected':''}>${b}</option>`).join('')}
              </select>
              <select class="field" style="width:auto;margin:0" onchange="const s=getStore();s.tasks[${idx}].photoReq=(this.value==='Фото обязательно');saveStore(s);showToast('Фото: '+this.value)">
                <option ${t.photoReq?'selected':''}>Фото обязательно</option>
                <option ${!t.photoReq?'selected':''}>Без фото</option>
              </select>
              <select class="field" style="width:auto;margin:0" onchange="const s=getStore();s.tasks[${idx}].responsible=this.value;saveStore(s);showToast('Отв.: '+this.value)">
                ${['Администратор','Техник','Шеф-бариста','Закупщик','Бариста'].map(r=>`<option ${t.responsible===r?'selected':''}>${r}</option>`).join('')}
              </select>
              <select class="field" style="width:auto;margin:0" onchange="const s=getStore();s.tasks[${idx}].active=(this.value==='Активна');saveStore(s);showToast('Статус: '+this.value)">
                <option ${t.active!==false?'selected':''}>Активна</option>
                <option ${t.active===false?'selected':''}>Отключена</option>
              </select>
            </div>
          </div>
        `).join('')}
      </div>
    `;
  } else if (section === 'standards') {
    bodyHtml = `
      <div class="card">
        <h3>Блюда и ТТК (клик по строке — подробный рецепт; списки — быстрая настройка)</h3>
        ${st.ttk.map((t, idx) => `
          <div class="row-item" onclick="openDishDetail('${t.id}')">
            <div style="flex:1"><strong>${t.name}</strong> ${t.isNew?'<span class="badge warn">Новое</span>':''}<div class="muted">${t.ingredients}</div></div>
            <div class="row-gap" onclick="event.stopPropagation()">
              <select class="field" style="width:auto;margin:0" onchange="const s=getStore();s.ttk[${idx}].category=this.value;s.ttk[${idx}].isNew=(this.value==='Новое блюдо');saveStore(s);showToast('Категория обновлена');render()">
                ${['Кофе','Не кофе','Новое блюдо','Требует классификации'].map(c=>`<option ${t.category===c?'selected':''}>${c}</option>`).join('')}
              </select>
              <select class="field" style="width:auto;margin:0" onchange="const s=getStore();s.ttk[${idx}].temp=this.value;saveStore(s);showToast('Температура: '+this.value)">
                ${['60–65°C','62°C','65°C','92°C','95°C','Холодный (+4°C)','—'].map(tp=>`<option ${t.temp===tp?'selected':''}>${tp}</option>`).join('')}
              </select>
              <button class="btn primary" onclick="openDishDetail('${t.id}')">Подробнее</button>
            </div>
          </div>
        `).join('')}
      </div>
    `;
  } else if (section === 'staff') {
    bodyHtml = `
      <div class="card">
        <h3>Персонал (выбор должности и статуса из списков)</h3>
        ${st.staff.map((m, idx) => `
          <div class="row-item">
            <div><strong>${m.name}</strong> <span class="muted">(${m.fullName || 'Сотрудник'})</span></div>
            <div class="row-gap">
              <select class="field" style="width:auto;margin:0" onchange="const s=getStore();s.staff[${idx}].role=this.value;saveStore(s);showToast('Должность: '+this.value)">
                ${['Бариста','Старший бариста','Администратор','Техник'].map(r=>`<option ${m.role===r?'selected':''}>${r}</option>`).join('')}
              </select>
              <select class="field" style="width:auto;margin:0" onchange="const s=getStore();s.staff[${idx}].active=(this.value==='Активен');saveStore(s);showToast('Статус: '+this.value)">
                <option ${m.active?'selected':''}>Активен</option>
                <option ${!m.active?'selected':''}>Отключён</option>
              </select>
            </div>
          </div>
        `).join('')}
      </div>
    `;
  } else if (section === 'finance') {
    bodyHtml = `
      <div class="card">
        <h3>Финансы (${selectedDate}) и быстрое добавление расхода</h3>
        <div class="row-gap" style="margin-bottom:10px">
          <select id="fCat" class="field" style="width:auto;margin:0"><option>Закупка продуктов</option><option>Хозтовары</option><option>Аренда</option><option>Зарплата</option><option>Ремонт</option></select>
          <select id="fAmt" class="field" style="width:auto;margin:0"><option value="50">50 ₽</option><option value="100">100 ₽</option><option value="250">250 ₽</option><option value="500">500 ₽</option><option value="1000">1000 ₽</option></select>
          <button class="btn primary" onclick="const s=getStore();s.expenses.unshift({id:'EXP-'+(s.expenses.length+1),date:selectedDate,category:document.getElementById('fCat').value,amount:Number(document.getElementById('fAmt').value),comment:'Быстрый расход'});saveStore(s);showToast('Расход добавлен');render()">+ Добавить расход</button>
        </div>
        ${st.expenses.map(e=>`<div class="row-item"><strong>${e.category} (${e.date})</strong><span class="num">${e.amount} ₽</span></div>`).join('')}
      </div>
    `;
  } else if (section === 'control') {
    bodyHtml = `
      <div class="card">
        <div class="row-gap" style="justify-content:space-between;margin-bottom:10px">
          <h3 style="margin:0">Внешние интеграции</h3>
          <button class="btn primary" onclick="pingExternalServices()">Проверить связь (GAS)</button>
        </div>
        <div class="row-item"><div><strong>Google Apps Script Web App</strong><div class="muted">${GAS_API_URL.slice(0, 62)}...</div></div><span class="badge good">${livePingStatus}</span></div>
        <div class="row-item"><div><strong>Google Sheets + Google Drive</strong><div class="muted">Листы ERP + папка Coffee_ERP_Photos (PRIVATE ACL)</div></div><span class="badge good">Настроено в Code.gs</span></div>
        <div class="row-item"><div><strong>Telegram Bot API + WebApp SDK</strong><div class="muted">Уведомления и HMAC-SHA256</div></div><span class="badge ${st.tgChat?'good':'warn'}">${st.tgChat ? ('Chat ID: ' + st.tgChat) : 'Укажите в Настройках'}</span></div>
      </div>
      <div class="card"><h3>Аудит (${st.audit.length})</h3>${st.audit.slice(0,10).map(a=>`<div class="row-item"><span>${a.action}</span><span class="muted">${a.actor} · ${a.ts}</span></div>`).join('')}</div>
    `;
  } else {
    bodyHtml = `
      <div class="card">
        <h3>Настройки (выбор из готовых списков — применяется сразу)</h3>
        <div class="kpi-grid">
          <label class="muted">Кофейня
            <select class="field" onchange="applySetting('location', this.value)">
              ${['Кофейня №1','Кофейня №2','Точка Центр'].map(v=>`<option ${st.location===v?'selected':''}>${v}</option>`).join('')}
            </select>
          </label>
          <label class="muted">План выручки (₽ ПМР)
            <select class="field num" onchange="applySetting('planRevenue', Number(this.value))">
              ${[1800,2000,2200,2500,2800,3000,3500].map(v=>`<option value="${v}" ${st.planRevenue===v?'selected':''}>${v} ₽</option>`).join('')}
            </select>
          </label>
          <label class="muted">План чеков
            <select class="field num" onchange="applySetting('planChecks', Number(this.value))">
              ${[50,60,75,90,100,120].map(v=>`<option value="${v}" ${st.planChecks===v?'selected':''}>${v} чеков</option>`).join('')}
            </select>
          </label>
          <label class="muted">Норма среднего чека
            <select class="field num" onchange="applySetting('minAvgCheck', Number(this.value))">
              ${[30,35,40,45,50].map(v=>`<option value="${v}" ${st.minAvgCheck===v?'selected':''}>${v} ₽</option>`).join('')}
            </select>
          </label>
          <label class="muted">PIN входа (4 цифры)
            <select class="field num" onchange="applySetting('adminPin', this.value)">
              ${['1234','2580','4321','0000'].map(v=>`<option value="${v}" ${st.adminPin===v?'selected':''}>${v}</option>`).join('')}
            </select>
          </label>
          <label class="muted">Telegram Chat ID
            <input class="field" value="${st.tgChat}" placeholder="Введите Chat ID" onchange="applySetting('tgChat', this.value.trim())">
          </label>
        </div>
      </div>
      <div class="card">
        <h3>Временные окна чек-листов (выбор времени из списков)</h3>
        ${st.windows.map((w,i)=>`
          <div class="row-item">
            <strong>${w.block}</strong>
            <div class="row-gap">
              <select class="field" style="width:auto;margin:0" onchange="const s=getStore();s.windows[${i}].start=this.value;saveStore(s);showToast('Старт: '+this.value)">${timeOptions(w.start)}</select>
              <span>—</span>
              <select class="field" style="width:auto;margin:0" onchange="const s=getStore();s.windows[${i}].deadline=this.value;saveStore(s);showToast('Дедлайн: '+this.value)">${timeOptions(w.deadline)}</select>
              <select class="field" style="width:auto;margin:0" onchange="const s=getStore();s.windows[${i}].unlocked=(this.value==='Разблокировано');saveStore(s);showToast('Режим: '+this.value)">
                <option ${!w.unlocked?'selected':''}>По расписанию</option>
                <option ${w.unlocked?'selected':''}>Разблокировано</option>
              </select>
            </div>
          </div>
        `).join('')}
      </div>
    `;
  }

  root.innerHTML = `
    <div class="shell">
      <aside class="rail">
        <div class="brand" style="margin-bottom:10px"><span class="brand-badge">illy</span><span>Coffee Illy</span></div>
        ${nav.map(([k,l])=>`<button class="${section===k?'active':''}" onclick="section='${k}';render()">${l}</button>`).join('')}
        <div style="margin-top:auto;display:flex;flex-direction:column;gap:6px">
          <button class="btn" onclick="window.CoffeeTheme.cycleMode()">Тема</button>
          <button class="btn bad" onclick="loggedIn=false;render()">Выйти</button>
        </div>
      </aside>
      <main class="main">
        <div class="topbar">
          <div class="muted">Coffee Illy › <b>${st.location}</b> › ${nav.find(x=>x[0]===section)[1]}</div>
          <span class="badge good">Единый режим Владелец + Админ</span>
        </div>
        ${bodyHtml}
      </main>
    </div>
  `;
}
render();
</script>
</body>
</html>
