/* === v12 PRO UI/UX COMMERCIAL DESIGN SYSTEM === */
@keyframes fadeSlideIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}
.card, .panel {
  transition: transform .18s cubic-bezier(.2,.8,.2,1), box-shadow .18s ease, border-color .18s ease;
  animation: fadeSlideIn .22s ease-out;
}
.k .card:hover, .k4 .card:hover, .k6 .panel:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 28px rgba(42, 24, 16, 0.10);
}
.pro-matrix-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 10px;
  margin-top: 10px;
}
.pro-matrix-card {
  padding: 12px 14px;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: color-mix(in srgb, var(--crema, #c89b6d) 7%, var(--surface, var(--card, #fff)));
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.pro-matrix-card.ok {
  border-color: color-mix(in srgb, var(--good, #1f7a4c) 45%, var(--line));
  background: color-mix(in srgb, var(--good, #1f7a4c) 7%, var(--surface, var(--card, #fff)));
}
.pro-matrix-card.warn {
  border-color: color-mix(in srgb, var(--warn, #b76e00) 45%, var(--line));
  background: color-mix(in srgb, var(--warn, #b76e00) 7%, var(--surface, var(--card, #fff)));
}
.pro-matrix-card.bad {
  border-color: color-mix(in srgb, var(--bad, #c23b22) 55%, var(--line));
  background: color-mix(in srgb, var(--bad, #c23b22) 8%, var(--surface, var(--card, #fff)));
}
.pro-progress-wrap {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 6px 0 10px;
  padding: 8px 12px;
  border-radius: 12px;
  background: color-mix(in srgb, var(--crema, #c89b6d) 10%, var(--bg));
  border: 1px solid var(--line);
  font-size: 13px;
}
.pro-progress-bar {
  flex: 1;
  height: 8px;
  border-radius: 99px;
  background: color-mix(in srgb, var(--ink, #231812) 12%, transparent);
  overflow: hidden;
}
.pro-progress-bar > i {
  display: block;
  height: 100%;
  border-radius: 99px;
  background: linear-gradient(90deg, var(--accent, #9c5a25), var(--good, #1f7a4c));
  transition: width .3s cubic-bezier(.2,.8,.2,1);
}
.kpi-pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 9px;
  border-radius: 99px;
  font-size: 12px;
  font-weight: 700;
}
.kpi-pill.ok { background: color-mix(in srgb, var(--good, #1f7a4c) 15%, transparent); color: var(--good, #1f7a4c); }
.kpi-pill.warn { background: color-mix(in srgb, var(--warn, #b76e00) 16%, transparent); color: var(--warn, #b76e00); }
.kpi-pill.bad { background: color-mix(in srgb, var(--bad, #c23b22) 15%, transparent); color: var(--bad, #c23b22); }
.timer-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 9px;
  border-radius: 99px;
  font-size: 12px;
  font-weight: 700;
  background: color-mix(in srgb, var(--ink, #231812) 8%, var(--surface, #fff));
  border: 1px solid var(--line);
}


.row, .adm-row {
  content-visibility: auto;
  contain-intrinsic-size: 0 74px;
}
.blk-pills {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin: 8px 0 10px;
}
.blk-pills button {
  padding: 6px 12px;
  border-radius: 99px;
  border: 1px solid var(--line);
  background: var(--surface, var(--card, #fff));
  color: var(--ink);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}
.blk-pills button.on {
  background: var(--accent, #5a3a29);
  color: #fff;
  border-color: var(--accent, #5a3a29);
}

:root{--bg:#e6ecee;--surface:#f7f9fa;--ink:#172326;--muted:#5b6d72;--line:#d3dde0;--brew:#5a3a29;--crema:#c98b4f;--good:#1b8a57;--bad:#c23b22;--warn:#b7791f;--espresso:#2e1b11;--cream:#f6ece2;
--shadow:0 1px 2px rgba(23,35,38,.05),0 14px 30px -18px rgba(23,35,38,.35);--font-d:"Bricolage Grotesque",system-ui,sans-serif;--w:860px;color-scheme:light}
:root[data-theme=dark]{color-scheme:dark;--bg:#12191b;--surface:#1b2528;--ink:#e8eff0;--muted:#8fa3a8;--line:#2c3a3e;--brew:#b98a64;--crema:#e0a76a;--good:#4cc38a;--bad:#ff7a5f;--warn:#e5b04d;--shadow:0 1px 0 rgba(255,255,255,.03),0 14px 30px -18px rgba(0,0,0,.7)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#12191b;--surface:#1b2528;--ink:#e8eff0;--muted:#8fa3a8;--line:#2c3a3e;--brew:#b98a64;--crema:#e0a76a;--good:#4cc38a;--bad:#ff7a5f;--warn:#e5b04d;--shadow:0 1px 0 rgba(255,255,255,.03),0 14px 30px -18px rgba(0,0,0,.7)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}
body{margin:0;min-height:100vh;min-height:100dvh;color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(900px 400px at 50% -120px,color-mix(in srgb,var(--crema) 22%,transparent),transparent),var(--bg);padding-bottom:env(safe-area-inset-bottom,0)}
h1,h2,h3{font-family:var(--font-d);letter-spacing:-.02em;margin:0}
button,input,select,textarea{font:inherit;color:var(--ink)}
main{max-width:var(--w);margin:0 auto;padding:18px 16px 48px}
.mu{color:var(--muted);font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow);margin-top:14px}
h3{font-size:16px;margin:18px 0 6px}h3:first-child{margin-top:0}
.al{border:1px solid var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface));border-radius:16px;padding:14px 16px;margin-top:14px}
:focus-visible{outline:3px solid var(--crema);outline-offset:2px}
.seg{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);padding:4px;border-radius:14px;overflow-x:auto}
.seg button{flex:1;white-space:nowrap;border:0;background:transparent;padding:9px 12px;border-radius:10px;font-weight:600;font-size:14px;cursor:pointer;color:var(--muted);min-height:40px}
.seg button.on{background:var(--brew);color:var(--surface)}
.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .t{font-weight:600;overflow-wrap:anywhere}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.b{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 12px;font-weight:600;font-size:13px;cursor:pointer;min-height:38px}
.b:hover{border-color:var(--crema)}.b.del:hover{border-color:var(--bad);color:var(--bad)}.b.ok:hover{border-color:var(--good);color:var(--good)}
.p{border:0;background:var(--brew);color:var(--surface);border-radius:12px;padding:0 18px;min-height:44px;font-weight:700;cursor:pointer}
.p:disabled{opacity:.5;cursor:wait}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:99px;margin-left:6px;background:var(--bg);color:var(--muted)}
.tag.no{color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,transparent)}.tag.ok{color:var(--good);background:color-mix(in srgb,var(--good) 16%,transparent)}
.tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}.tbl th,.tbl td{text-align:right;padding:9px 8px;border-bottom:1px solid var(--line)}.tbl th:first-child,.tbl td:first-child{text-align:left}.tbl th{color:var(--muted);font-weight:600}
.sx{overflow-x:auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.fld{margin-top:12px}.fld label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.fld input,.fld select,.fld textarea{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.set{padding:14px 0;border-top:1px solid var(--line)}.set:first-of-type{border-top:0}
.set .line{display:flex;gap:8px;margin-top:8px}.set input{flex:1;min-width:0;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
dialog{border:1px solid var(--line);border-radius:22px;background:var(--surface);color:var(--ink);padding:20px;width:min(480px,94vw);box-shadow:0 30px 60px -20px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(0,0,0,.5)}
.derr{color:var(--bad);font-size:14px;margin-top:10px;min-height:20px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--espresso);color:var(--cream);padding:10px 18px;border-radius:16px;font-size:14px;z-index:60;max-width:92vw}
.app-header{position:relative;z-index:20;color:var(--cream);background:linear-gradient(160deg,#2e1b11,#5a3a29);border-radius:0 0 24px 24px;box-shadow:0 10px 30px -14px rgba(0,0,0,.55);padding:calc(env(safe-area-inset-top,0px) + var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px) + 14px) 16px 14px}
.app-header .wrap{max-width:var(--w);margin:0 auto}
.app-header .brand{display:flex;justify-content:space-between;align-items:center;gap:12px}
.app-header h1{font-size:20px;display:flex;align-items:center;gap:8px;color:var(--cream)}.app-header h1 svg{width:26px;height:26px}
.app-header .sub{color:rgba(246,236,226,.68);font-size:13px}
.app-header .theme-btn{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:var(--cream);border-radius:12px;width:42px;height:42px;font-size:18px;cursor:pointer}
.app-header .tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:rgba(255,255,255,.1);padding:4px;border-radius:16px;margin-top:14px;max-width:480px}
.app-header .tabs a{display:flex;align-items:center;justify-content:center;min-height:44px;border-radius:12px;color:rgba(246,236,226,.8);font-weight:600;font-size:13px;text-decoration:none}
.app-header .tabs a.on{background:var(--cream);color:var(--espresso)}
@media(max-width:400px){.app-header .tabs a{font-size:12px}}

  /* === АДАПТИВНЫЙ USER-FRIENDLY ИНТЕРФЕЙС ДЛЯ ПК И ТЕЛЕФОНА (v8) === */
  html { scroll-behavior:smooth; -webkit-text-size-adjust:100%; }
  ::-webkit-scrollbar { width:8px; height:8px; }
  ::-webkit-scrollbar-thumb { background:var(--line); border-radius:99px; }

  /* Карточки и кнопки: плавный отклик на ПК и телефоне */
  .card, .panel { transition:box-shadow .2s ease, border-color .2s ease; }
  button, .b, .p, .btn, .btn-s, .btn-p, .file, .drop {
    transition:transform .12s ease, background-color .15s ease, border-color .15s ease, box-shadow .15s ease, opacity .15s ease;
  }
  @media (hover:hover) and (pointer:fine) {
    .b:hover, .btn-s:hover { transform:translateY(-1px); box-shadow:0 4px 12px -4px rgba(0,0,0,.12); }
    .p:hover, .btn-p:hover, .btn:not(:disabled):hover { filter:brightness(1.06); transform:translateY(-1px); }
    .file:hover, .drop:hover { border-color:var(--brew); background:color-mix(in srgb, var(--crema) 8%, var(--bg)); }
  }
  .file.dragover, .drop.dragover {
    border-style:solid !important;
    border-color:var(--good) !important;
    background:color-mix(in srgb, var(--good) 12%, var(--bg)) !important;
    transform:scale(1.01);
  }

  /* Таблицы: закреплённый первый столбец на узких экранах + удобный скролл */
  .scrollx, .sx { -webkit-overflow-scrolling:touch; scrollbar-width:thin; border-radius:12px; }
  .tbl th:first-child, .tbl td:first-child {
    position:sticky; left:0; z-index:2;
    background:var(--surface);
  }
  .tbl tr:hover td:first-child { background:var(--bg); }

  /* Поле быстрого поиска задач */
  .task-search {
    width:100%; height:42px; border-radius:12px; border:1px solid var(--line);
    background:var(--bg); padding:0 14px; font-size:14px; margin:8px 0 12px;
  }

  /* --- Широкие экраны ПК (Desktop >= 900px) --- */
  @media (min-width:900px) {
    :root { --w:1120px; }
    main { padding:26px 24px 64px; }
    .card, .panel { padding:24px 26px; border-radius:24px; }
    .app-header { padding:16px 24px; border-radius:0 0 28px 28px; }
    .app-header .wrap {
      display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:14px;
    }
    .app-header .brand { flex:1 1 auto; }
    .app-header .tabs, .app-header .nav-bar { margin-top:0; }
    .app-header .dp, .app-header .sub-bar { margin-top:0; width:auto; }
    .k, .k4 { grid-template-columns:repeat(4, 1fr) !important; gap:16px; }
    .dash-two-col { display:grid; grid-template-columns:1.35fr 1fr; gap:18px; align-items:start; }
    .dash-two-col > .card { margin-top:16px; }
    .settings-grid { display:grid; grid-template-columns:repeat(2, 1fr); gap:14px 22px; }
    .settings-grid .set, .settings-grid .set-item {
      border:1px solid var(--line); border-radius:16px; padding:16px; background:var(--bg); margin:0;
    }
    .narrow-view { max-width:780px; }
    #tCashView, #cashView {
      display:grid; grid-template-columns:1.1fr 0.9fr; gap:18px; align-items:start;
    }
    #tCashView > *, #cashView > * { margin-top:0 !important; }
    #tCashView > .panel:first-child, #cashView > .panel:first-child,
    #tSubmitCashBtn, #submitCashBtn { grid-column:1 / -1; }
  }

  /* --- Мобильные телефоны (Mobile <= 640px) --- */
  @media (max-width:640px) {
    .app-header, header {
      padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px;
      border-radius:0 0 20px 20px;
    }
    .app-header h1, header h1 { font-size:18px; }
    .app-header .tabs, .main-tabs, .term-tabs, .owner-nav {
      margin-top:8px; padding:3px; border-radius:13px;
    }
    .app-header .tabs a, .main-tabs button, .term-tabs button, .owner-nav a {
      min-height:38px; font-size:12px; padding:0 4px; border-radius:10px;
    }
    .app-header .dp, .sub-bar { margin-top:8px; }
    .app-header .dp button, .app-header .dp input, .dp button, .dp input { height:38px; font-size:13px; }
    main { padding:12px 10px calc(36px + env(safe-area-inset-bottom,0px)); }
    .card, .panel { padding:15px 14px; border-radius:18px; margin-top:10px; }
    .big, .total { font-size:clamp(30px, 9vw, 40px); }
    .k, .k4 { grid-template-columns:repeat(2, 1fr); gap:10px; margin-top:10px; }
    .k .card, .k4 .card { padding:13px; }
    .k b, .k4 b { font-size:21px; }
    .k6 { grid-template-columns:repeat(2, 1fr); gap:10px; }
    .kpi .num { font-size:21px; }
    .seg, .seg-bar { scrollbar-width:none; -ms-overflow-style:none; }
    .seg::-webkit-scrollbar, .seg-bar::-webkit-scrollbar { display:none; }
    .adm-row, .inc-row, .row { grid-template-columns:1fr; gap:8px; }
    .adm-row .acts, .inc-row .acts, .row .acts { justify-content:flex-start; }
    .set .line, .set-item .line { flex-direction:column; }
    .set .line button, .set-item .line button { width:100%; min-height:42px; }
  }


/* =========================================================================
   АДАПТИВНЫЙ ДИЗАЙН v23: ПРИОРИТЕТ ПК ДЛЯ ДАШБОРДА, ОТЧЁТОВ И УПРАВЛЕНИЯ
   + ПОЛНАЯ АДАПТАЦИЯ ПОД НОУТБУКИ, ПЛАНШЕТЫ И СМАРТФОНЫ
   ========================================================================= */
*, *::before, *::after { box-sizing: border-box; }
html, body {
  max-width: 100vw;
  overflow-x: hidden;
  -webkit-text-size-adjust: 100%;
}
.scrollx {
  width: 100%;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
/* 1. Широкоэкранный режим ПК (Desktop-First: от 1025px и выше) */
@media (min-width: 1025px) {
  header.app-header .wrap, main, #main, .page-wrap {
    max-width: 1380px !important;
    margin-left: auto !important;
    margin-right: auto !important;
    padding-left: 28px !important;
    padding-right: 28px !important;
  }
  .gauge-trio {
    display: grid !important;
    grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
    gap: 16px !important;
  }
  .k, .k4 {
    display: grid !important;
    grid-template-columns: repeat(4, minmax(0, 1fr)) !important;
    gap: 14px !important;
  }
  .dash-two-col {
    display: grid !important;
    grid-template-columns: 1.15fr 0.85fr !important;
    gap: 18px !important;
    align-items: start;
  }
  .pro-matrix-grid {
    display: grid !important;
    grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
    gap: 12px !important;
  }
  .smart-grid {
    display: grid !important;
    grid-template-columns: repeat(4, minmax(0, 1fr)) !important;
    gap: 12px !important;
  }
}
@media (min-width: 1280px) {
  .k6 {
    display: grid !important;
    grid-template-columns: repeat(6, minmax(0, 1fr)) !important;
    gap: 12px !important;
  }
}
/* 2. Планшеты и компактные ноутбуки (641px – 1024px) */
@media (max-width: 1024px) {
  header.app-header .wrap {
    flex-wrap: wrap !important;
    gap: 10px !important;
  }
  .gauge-trio {
    grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
    gap: 12px !important;
  }
  .k, .k4, .k6 {
    grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
    gap: 10px !important;
  }
  .dash-two-col, .g2, .g11 {
    grid-template-columns: 1fr !important;
    gap: 14px !important;
  }
  .pro-matrix-grid, .smart-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
    gap: 10px !important;
  }
}
/* 3. Мобильные устройства (до 640px) */
@media (max-width: 640px) {
  input, select, textarea {
    font-size: 16px !important;
  }
  header.app-header .wrap {
    padding: 10px 12px !important;
  }
  nav.tabs, .seg, .top-nav {
    display: flex !important;
    flex-wrap: nowrap !important;
    overflow-x: auto !important;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    max-width: 100%;
  }
  nav.tabs::-webkit-scrollbar, .seg::-webkit-scrollbar { display: none; }
  nav.tabs a, .seg button {
    flex: 0 0 auto !important;
    white-space: nowrap !important;
  }
  main, #main, .page-wrap {
    padding: 12px !important;
  }
  .gauge-trio, .pro-matrix-grid, .smart-grid, .dash-two-col, .sim-controls {
    grid-template-columns: 1fr !important;
    gap: 10px !important;
  }
  .k, .k4, .k6 {
    grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
    gap: 8px !important;
  }
  .card, .panel {
    padding: 14px !important;
    border-radius: 16px !important;
  }
  .top, .top-bar, .row {
    flex-wrap: wrap !important;
    gap: 8px !important;
  }
  dialog {
    width: 95vw !important;
    max-width: 95vw !important;
    padding: 16px !important;
  }
}


/* === v36: ИДЕАЛЬНОЕ РАЗМЕЩЕНИЕ ТЕКСТА ВО ВСЕХ ВКЛАДКАХ, КАРТОЧКАХ И ТАБЛИЦАХ ПАНЕЛИ УПРАВЛЕНИЯ === */
.card, .panel, .row, .top, .fld, .set, .acts, .pro-matrix-card, .smart-box, .gauge-card {
  min-width: 0;
  overflow-wrap: break-word;
  word-wrap: break-word;
}
h1, h2, h3, p, span, b, label, td, th {
  overflow-wrap: break-word;
  word-wrap: break-word;
}
header.app-header .wrap {

<script>/* config.js */
/* =========================================================================
   ЯДРО КООРДИНАЦИИ И ЗАГРУЗЧИК МОДУЛЕЙ (config.js — v21 Enterprise Edition)
   Архитектура разделена на независимые кэшируемые модули:
   - js/defaults.js   : Стартовый каталог задач, ТТК, таймлайн, планы Пн–Вс, SHA-256 хеши PIN
   - js/security.js   : SHA-256, защита от перебора (5 попыток / 15 мин), токены сессии (coffeeAuth), XSS-фильтр
   - js/storage.js    : IndexedDB-движок (CoffeeIDB) с выгрузкой фотографий из localStorage
   - js/analytics.js  : Контроль таймлайна, планы по дням недели, детектор «Красных флагов» робота, P&L
   - js/sync.js       : Поэлементная дельта-синхронизация (delta_sync по id + updatedAt + Set-Union)
   - js/telegram.js   : Серверная отправка уведомлений через Google Apps Script (UrlFetchApp)
   ========================================================================= */

window.coffeeBus = (function () {
  const ch = typeof BroadcastChannel !== 'undefined' ? new BroadcastChannel('coffee_system_sync') : null;
  const listeners = [];
  if (ch) {
    ch.onmessage = (e) => {
      if (e && e.data) listeners.forEach((fn) => { try { fn(e.data); } catch (_) {} });
    };
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('storage', (e) => {
      if (e.key === 'coffee_sync_signal' && e.newValue) {
        try {
          const d = JSON.parse(e.newValue);
          listeners.forEach((fn) => { try { fn(d); } catch (_) {} });
        } catch (_) {}
      }
    });
  }
  return {
    emit(type, detail) {
      const msg = { type, detail: detail || {}, ts: Date.now() };
      if (ch) { try { ch.postMessage(msg); } catch (_) {} }
      try { localStorage.setItem('coffee_sync_signal', JSON.stringify(msg)); } catch (_) {}
      listeners.forEach((fn) => { try { fn(msg); } catch (_) {} });
    },
    on(fn) {
      if (typeof fn === 'function') listeners.push(fn);
    }
  };
})();

function _iso(d) {
  const x = d instanceof Date ? d : new Date(d);
  return new Date(x.getTime() - x.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
}
function _isoToday() { return _iso(new Date()); }
function _shiftIso(s, n) {
  const d = new Date(s + 'T12:00:00');
  d.setDate(d.getDate() + n);
  return _iso(d);
}

function normalizeSettingKey(rawKey) {
  const k = String(rawKey || '').trim();
  const low = k.toLowerCase();
  if (k === 'LOCATION' || /назван|точк|кофейн|локац/.test(low)) return 'LOCATION';
  if (k === 'PLAN' || /^план выручки|^план на день|^цель/.test(low)) return 'PLAN';
  if (k === 'OPEN_START' || /начал.*открыт/.test(low)) return 'OPEN_START';
  if (k === 'DEADLINE' || /дедлайн.*открыт|дедлайн смен/.test(low)) return 'DEADLINE';
  if (k === 'DAY_START' || /начал.*дн/.test(low)) return 'DAY_START';
  if (k === 'DAY_DEADLINE' || /дедлайн.*дн/.test(low)) return 'DAY_DEADLINE';
  if (k === 'CLOSE_START' || /начал.*закрыт/.test(low)) return 'CLOSE_START';
  if (k === 'CLOSE_DEADLINE' || /дедлайн.*закрыт/.test(low)) return 'CLOSE_DEADLINE';
  if (k === 'WO_NORM' || /норм.*списан/.test(low)) return 'WO_NORM';
  if (k === 'MIN_AVG_CHECK' || /средн.*чек/.test(low)) return 'MIN_AVG_CHECK';
  if (k === 'PLAN_CHECKS' || /план.*чек/.test(low)) return 'PLAN_CHECKS';
  if (k === 'PHOTO_ALL' || /фото.*шаг|обязат.*фото/.test(low)) return 'PHOTO_ALL';
  if (k === 'INIT_COUNTER' || /счетчик|счётчик/.test(low)) return 'INIT_COUNTER';
  if (k === 'COFFEE_DELTA_NORM' || /дельта.*кофе|погрешност.*счётчик/.test(low)) return 'COFFEE_DELTA_NORM';
  if (k === 'CATEGORIES' || /статьи|категор/.test(low)) return 'CATEGORIES';
  if (k === 'TG_TOKEN' || /tg.*token|токен.*бот/.test(low)) return 'TG_TOKEN';
  if (k === 'TG_CHAT' || /tg.*chat|чат.*админ/.test(low)) return 'TG_CHAT';
  if (k === 'ADMIN_PIN' || /код доступ|пин|pin|парол/.test(low)) return 'ADMIN_PIN';
  return k;
}

window._iso = _iso;
window._isoToday = _isoToday;
window._shiftIso = _shiftIso;
window.normalizeSettingKey = normalizeSettingKey;

window.coffeeCache = {
  get(k) {
    try {
      const o = JSON.parse(localStorage.getItem('cc:' + k) || 'null');
      if (!o || !o.v) return null;
      const act = k.indexOf('dash:') === 0 ? 'dashboard' : k.indexOf('rep:') === 0 ? 'report' : k;
      return typeof enforceSettingsOnResponse === 'function' ? enforceSettingsOnResponse(act, o.v) : o.v;
    } catch (e) { return null; }
  },
  set(k, v) {
    try {
      localStorage.setItem('cc:' + k, JSON.stringify({ t: Date.now(), v }));
    } catch (e) {}
  },
  invalidate(prefix) {
    try {
      Object.keys(localStorage).forEach((k) => {
        if (k.indexOf('cc:') === 0 && (!prefix || prefix === 'all' || k.indexOf('cc:' + prefix) === 0)) {
          localStorage.removeItem(k);
        }
      });
    } catch (e) {}
  }
};

window.coffeeRuErr = function (e) {
  const m = String((e && e.message) || e || '');
  if (/RATE_LIMIT/i.test(m)) return m.replace(/^RATE_LIMIT:\s*/i, '');
  if (/PIN_REQUIRED|FORBIDDEN/i.test(m)) return 'Сессия истекла или код доступа неверный. Войдите заново.';
  if (/AbortError|timeout/i.test(m)) return 'Сервер отвечает дольше обычного — показаны сохранённые данные';
  if (/Failed to fetch|NetworkError/i.test(m)) return 'Работаем в автономном режиме (очередь дельта-синхронизации активна)';
  return 'Ошибка обмена: ' + m;
};

window.coffeeMediaHtml = function (url, label) {
  const resolved = window.CoffeeIDB ? window.CoffeeIDB.getPhotoSync(url) : url;
  const u = String(resolved || '').trim();
  const safeLabel = window.escapeAttr ? window.escapeAttr(label || 'Фото') : 'Фото';
  if (!u) return '';
  const safeUrl = window.escapeAttr ? window.escapeAttr(u) : u;
  if (/^data:video\/|\.(mp4|webm|mov)(\?|$)/i.test(u)) {
    return '<video src="' + safeUrl + '" controls playsinline style="max-width:160px;max-height:110px;border-radius:8px;border:1px solid var(--border);background:#000"></video>';
  }
  return '<a href="' + safeUrl + '" target="_blank" rel="noopener"><img class="ph" src="' + safeUrl + '" alt="' + safeLabel + '" loading="lazy"></a>';
};

</script>

оль витрины с десертами:\n• Закуски и десерты пополнены и представлены в ДОСТАТОЧНОМ количестве.\n• Срок годности и маркировки актуальны, заветренных позиций нет.\n• Витрина чистая внутри и снаружи, фронтальное стекло без разводов и отпечатков.\n• Десерты и ценники выложены ровно и аккуратно 📸 (сделать фото витрины).", "photo": "да", "responsible": "Закупщик", "active": "да", "row": 13, "mediaRequired": true}, {"id": "d05", "block": "День", "group": "d", "groupName": "День · Обход смены (d01–d06)", "title": "🧼 Зона гостя и стойка на виду", "instruction": "Поддержание чистоты зоны выдачи и гостевой стойки:\n• Стойка и прилавок со стороны гостя идеально чистые: нет крошек, капель кофе, пятен и липких следов.\n• Грязная посуда со столов и стойки своевременно убрана в мойку.\n• Диспенсер с салфетками, крышками, трубочками и сахаром пополнен.", "photo": "да", "responsible": "Администратор", "active": "да", "row": 14, "mediaRequired": true}, {"id": "d06", "block": "День", "group": "d", "groupName": "День · Обход смены (d01–d06)", "title": "🚽 Санузел проверен (2-3 сек видео) 📹", "instruction": "Дневная проверка санузла для гостей:\n• Санузел чистый, пол сухой, раковина и зеркало без брызг воды.\n• Туалетная бумага, мыло и бумажные полотенца в наличии.\n• Мусорное ведро не переполнено, запах свежий.\n• 📹 Сделать короткий обзорный видео-отчёт (2–3 секунды).", "photo": "да", "responsible": "Администратор", "active": "да", "row": 15, "mediaRequired": true}, {"id": "c01", "block": "Закрытие", "group": "c", "groupName": "Закрытие · Стандарт (c01–c14)", "title": "🧴 Диспенсер с расходниками заполнен", "instruction": "Подготовка органайзера и расходников на утро:\n• Диспенсер полностью заполнен салфетками, порционным сахаром, трубочками и размешивателями (палочками).\n• Все открытые складские упаковки с расходниками плотно закрыты от пыли и влаги.", "photo": "да", "responsible": "Закупщик", "active": "да", "row": 16, "mediaRequired": true}, {"id": "c02", "block": "Закрытие", "group": "c", "groupName": "Закрытие · Стандарт (c01–c14)", "title": "🪑 Зал и посадочные места", "instruction": "Уборка гостевого зала перед закрытием:\n• Все столы тщательно протёрты от крошек и пятен.\n• Диваны и стулья устойчивы, очищены щёткой/пылесосом от крошек.\n• Декор выровнен, пыль на полках и подоконниках отсутствует.\n• Все свечи в зале обязательно погашены.", "photo": "да", "responsible": "Администратор", "active": "да", "row": 17, "mediaRequired": true}, {"id": "c03", "block": "Закрытие", "group": "c", "groupName": "Закрытие · Стандарт (c01–c14)", "title": "☕ Кофемашина", "instruction": "Замывка и выключение кофемашины:\n• Проведена промывка групп со слепым фильтром и профессиональным средством (Cafiza), затем промывка чистой водой.\n• Холдеры и сита вымыты, кофейный жмых и масла полностью удалены, съёмные детали и решётка поддона промыты и установлены на место.\n• Стимеры (паровые трубки) очищены от молока и продуты.\n• Подтёков воды и накипи нет, хромированные детали натёрты насухо. Кофемашина выключена.", "photo": "да", "responsible": "Техник", "active": "да", "row": 18, "mediaRequired": true}, {"id": "c04", "block": "Закрытие", "group": "c", "groupName": "Закрытие · Стандарт (c01–c14)", "title": "⚙️ Гриндеры", "instruction": "Очистка кофемолок и фиксация счётчиков:\n• Гриндеры протёрты снаружи и в зоне выдачи, остатки молотого кофе сметены кистью, устройства выключены.\n• Показания счётчиков порций кофемашины/гриндеров сняты и внесены в кассовый отчёт смены.", "photo": "да", "responsible": "Шеф-бариста", "active": "да", "row": 19, "mediaRequired": true}, {"id": "c05", "block": "Закрытие", "group": "c", "groupName": "Закрытие · Стандарт (c01–c14)", "title": "🧽 Рабочая зона", "instruction": "Замывка барной станции:\n• Рабочая столешница и фартук вымыты с моющим средством и протёрты насухо.\n• Липких пятен от сиропов, молока и кофе нет.\n• Весь мелкий инвентарь (питчеры, темпер, коврик, весы) чистый и расставлен по местам.", "photo": "да", "responsible": "Администратор", "active": "да", "row": 20, "mediaRequired": true}, {"id": "c06", "block": "Закрытие", "group": "c", "groupName": "Закрытие · Стандарт (c01–c14)", "title": "🔥 Термопот", "instruction": "Отключение термопота:\n• Заполнен очищенной водой для утренней смены.\n• Питание выключено, корпус и каплесборник протёрты насухо, без подтёков.", "photo": "нет", "responsible": "Техник", "active": "да", "row": 21, "mediaRequired": false}, {"id": "c07", "block": "Закрытие", "group": "c", "groupName": "Закрытие · Стандарт (c01–c14)", "title": "💰 Касса и терминалы Фото", "instruction": "Закрытие кассовой смены:\n• Наличные в кассе пересчитаны и сверены с отчётом.\n• Разменная сумма на утро оставлена в кассе в полном объёме (250 руб мелкими купюрами).\n• Фотоотчёт кассы сделан после подсчёта.\n• Банковский терминал и чековый принтер выключены, рабочий телефон поставлен на зарядку.", "photo": "да", "responsible": "Администратор", "active": "да", "row": 22, "mediaRequired": true}, {"id": "c08", "block": "Закрытие", "group": "c", "groupName": "Закрытие · Стандарт (c01–c14)", "title": "🍰 Холодильник и витрина", "instruction": "Уход за витриной и хранением десертов:\n• Подсветка витрины выключена (холодильный контур работает по регламенту), стёкла и полки протёрты.\n• Отпечатков пальцев и разводов на стекле нет.\n• Все десерты проверены по срокам, закрыты крышками/плёнкой от заветривания.", "photo": "да", "responsible": "Закупщик", "active": "да", "row": 23, "mediaRequired": true}, {"id": "c09", "block": "Закрытие", "group": "c", "groupName": "Закрытие · Стандарт (c01–c14)", "title": "🪞 Зеркала и остекление", "instruction": "Натирка зеркал и входного остекления:\n• Зеркала в зале и стеклянные поверхности входной группы протёрты со средством для стёкол.\n• Разводов, брызг и следов пальцев нет, поверхности сухие.", "photo": "нет", "responsible": "Администратор", "active": "да", "row": 24, "mediaRequired": false}, {"id": "c10", "block": "Закрытие", "group": "c", "groupName": "Закрытие · Стандарт (c01–c14)", "title": "💡 Оборудование и подсветка", "instruction": "Отключение иллюминации и медиа:\n• Проектор, неоновая/декоративная подсветка, аудиоколонки и дополнительное освещение выключены.\n• Световая инсталляция у зеркал и подсветка стола — выключены.", "photo": "нет", "responsible": "Техник", "active": "да", "row": 25, "mediaRequired": false}, {"id": "c11", "block": "Закрытие", "group": "c", "groupName": "Закрытие · Стандарт (c01–c14)", "title": "🌿 Летняя терраса", "instruction": "Уборка летней террасы на ночь:\n• Уличные столы и стулья протёрты и занесены внутрь помещения (или зафиксированы по регламенту).\n• Пледы проверены (чистые, без пятен и прожогов) и аккуратно сложены на хранение.", "photo": "да", "responsible": "Администратор", "active": "да", "row": 26, "mediaRequired": true}, {"id": "c12", "block": "Закрытие", "group": "c", "groupName": "Закрытие · Стандарт (c01–c14)", "title": "🧼 Санузел для гостей", "instruction": "Полная вечерняя уборка санузла по чек-листу:\n• 🚻 Входная дверь — проверена исправность замка и доводчика; полотно двери и ручка протёрты, без следов рук.\n• 🧴 Раковина и смеситель — вымыты и вытерты насухо; смеситель натёрт без налёта и подтёков, вода не капает.\n• 🪞 Зеркало — протёрто без разводов и следов пальцев, поверхность блестящая.\n• 🧻 Расходники — проверен и пополнен запас жидкого мыла, туалетной бумаги и бумажных полотенец на утро.\n• 🚽 Унитаз и бачок — обработаны дезсредством, крышка опущена, бачок не протекает, запах отсутствует.\n• 🧹 Пол и стены — пол вымыт с дезсредством и высушен, плитка без пятен и налёта.\n• 🗑 Мусорное ведро — освобождено, вымыто, установлен новый пакет.\n• 💡 Освещение и вентиляция — свет и вытяжка выключены, проверена исправность выключателя.", "photo": "да", "responsible": "Администратор", "active": "да", "row": 27, "mediaRequired": true}, {"id": "c13", "block": "Закрытие", "group": "c", "groupName": "Закрытие · Стандарт (c01–c14)", "title": "🚪 Закрытие помещения", "instruction": "Финальная проверка перед выходом:\n• Все декоративные подсветки, сплит-система и барное оборудование (кроме холодильников) выключены.\n• Жалюзи / роллеты опущены, окна закрыты.", "photo": "нет", "responsible": "Администратор", "active": "да", "row": 28, "mediaRequired": false}, {"id": "c14", "block": "Закрытие", "group": "c", "groupName": "Закрытие · Стандарт (c01–c14)", "title": "🗑 Мусор выброшен, баки на улице пустые 📸💬", "instruction": "Вынос всего мусора из кофейни и уличных урн:\n• Все мусорные пакеты из-под бара, подсобки и санузла завязаны и вынесены в контейнер.\n• Уличные баки у входа очищены, внутрь вставлены чистые пакеты.\n• 📸 Сделать фото пустых баков и закрытой входной двери.", "photo": "да", "responsible": "Администратор", "active": "да", "row": 29, "mediaRequired": true}, {"id": "pa01", "block": "Открытие", "group": "pa", "groupName": "Открытие · Приёмка смены (pa01–pa21)", "title": "📸 Фото-селфи 📸", "instruction": "Фото перед началом смены.\nВолосы убраны в хвост, аккуратный внешний вид, чистая форма, минимальный макияж.", "photo": "да", "responsible": "Администратор", "active": "да", "row": 30, "mediaRequired": true}, {"id": "pa02", "block": "Открытие", "group": "pa", "groupName": "Открытие · Приёмка смены (pa01–pa21)", "title": "🌿 Летняя терраса Фото📸", "instruction": "Столы и стулья расставлены, протёрты. Пледы чистые, сложены аккуратно, территория без мусора. Сделать фото.", "photo": "да", "responsible": "Администратор", "active": "да", "row": 31, "mediaRequired": true}, {"id": "pa03", "block": "Открытие", "group": "pa", "groupName": "Открытие · Приёмка смены (pa01–pa21)", "title": "🪑 Зал и посадочные места", "instruction": "Столы чистые, без крошек и пятен, диваны устойчивые, декор выровнен, пыль отсутствует, посадка полностью готова к приёму гостей.", "photo": "нет", "responsible": "Администратор", "active": "да", "row": 32, "mediaRequired": false}, {"id": "pa04", "block": "Открытие", "group": "pa", "groupName": "Открытие · Приёмка смены (pa01–pa21)", "title": "☕ Кофемашина + ☝️холдеры", "instruction": "Кофемашина включена и прогрета.\nСъёмные детали и чистые холдеры на месте.\nПодтёков воды и накипи нет, хромированные детали натёрты до блеска.", "photo": "да", "responsible": "Техник", "active": "да", "row": 33, "mediaRequired": true}, {"id": "pa05", "block": "Открытие", "group": "pa", "groupName": "Открытие · Приёмка смены (pa01–pa21)", "title": "⚙️ Гриндеры", "instruction": "Гриндеры протёрты, старые остатки кофе отсутствуют, помол проверен.\nУтренние показания счётчиков сверены и внесены в отчёт.", "photo": "нет", "responsible": "Шеф-бариста", "active": "да", "row": 34, "mediaRequired": false}, {"id": "pa06", "block": "Открытие", "group": "pa", "groupName": "Открытие · Приёмка смены (pa01–pa21)", "title": "🧽 Рабочая зона и Мойка за стойкой", "instruction": "Рабочая поверхность вымыта и протёрта насухо, пятен от сиропов и кофе нет, порядок соблюдён.\nМойка за стойкой чистая, грязная посуда отсутствует.", "photo": "нет", "responsible": "Администратор", "active": "да", "row": 35, "mediaRequired": false}, {"id": "pa07", "block": "Открытие", "group": "pa", "groupName": "Открытие · Приёмка смены (pa01–pa21)", "title": "🔥 Термопот", "instruction": "Заполнен очищенной водой, включён на прогрев, корпус сухой, без подтёков.", "photo": "нет", "responsible": "Техник", "active": "да", "row": 36, "mediaRequired": false}, {"id": "pa08", "block": "Открытие", "group": "pa", "groupName": "Открытие · Приёмка смены (pa01–pa21)", "title": "💰 Касса и терминалы", "instruction": "Разменная сумма в наличии (250 руб мелкими купюрами).\nТерминал и чековый принтер включены, рабочий телефон и планшет заряжены.\nВсё работает штатно, не зависает и блестит.", "photo": "нет", "responsible": "Администратор", "active": "да", "row": 37, "mediaRequired": false}, {"id": "pa09", "block": "Открытие", "group": "pa", "groupName": "Открытие · Приёмка смены (pa01–pa21)", "title": "🧾 Кассовая лента Запас - 2шт.", "instruction": "Чековая лента ус Администратор", "active": "да", "row": 77, "mediaRequired": true}, {"id": "u02", "block": "Закрытие", "group": "u", "groupName": "Закрытие · Уборка помещения (u01–u07)", "title": "🚪🧼 Крыльцо очищено и вымыто 📸", "instruction": "Уборка входной группы и крыльца:\n• Ступени и площадка крыльца подметены от песка, пыли и листьев.\n• Выполнена влажная мойка крыльца и придверного коврика, следов грязи и пятен нет.\n• 📸 Сделать фото чистого крыльца.", "photo": "да", "responsible": "Администратор", "active": "да", "row": 78, "mediaRequired": true}, {"id": "u03", "block": "Закрытие", "group": "u", "groupName": "Закрытие · Уборка помещения (u01–u07)", "title": "🚪 Входная дверь натёрта, без следов и пятен", "instruction": "Чистка входной двери:\n• Стекло входной двери с обеих сторон натёрто средством для стёкол без разводов и отпечатков рук.\n• Дверная ручка, профиль и порог протёрты влажной, затем сухой салфеткой.", "photo": "нет", "responsible": "Администратор", "active": "да", "row": 79, "mediaRequired": false}, {"id": "u04", "block": "Закрытие", "group": "u", "groupName": "Закрытие · Уборка помещения (u01–u07)", "title": "🪟 Зеркала и Стёкла натёрты, без разводов и загрязнений 📸", "instruction": "Мойка зеркал и витринных стёкол:\n• Все зеркала в зале, у фотозоны и в санузле натёрты микрофиброй со средством для стёкол.\n• Подтёков, разводов и следов пальцев нет.\n• 📸 Сделать контрольное фото.", "photo": "да", "responsible": "Администратор", "active": "да", "row": 80, "mediaRequired": true}, {"id": "u05", "block": "Закрытие", "group": "u", "groupName": "Закрытие · Уборка помещения (u01–u07)", "title": "🛋️ Диваны отодвинуты, выполнена влажная уборка полов под диванами 📸", "instruction": "Важно!!! ☝️ ☝️ ☝️\n• Аккуратно отодвинуть диваны от стен, подмести крошки и пыль, тщательно вымыть пол и плинтусы под диванами, затем ровно вернуть диваны на место.\n• Регулярно менять грязную воду в ведре на чистую.\n• Выливать грязную воду ТОЛЬКО на улице в отведённое место (категорически запрещено выливать в мойку в подсобке — слив забивается песком!).\n• 📸 Сделать фото чистого пола под диванами.", "photo": "да", "responsible": "Администратор", "active": "да", "row": 81, "mediaRequired": true}, {"id": "u06", "block": "Закрытие", "group": "u", "groupName": "Закрытие · Уборка помещения (u01–u07)", "title": "🧹 Влажная уборка полов в зале", "instruction": "Финальная мойка полов:\n• Пол во всём гостевом зале, за барной стойкой и в проходах подметён и тщательно вымыт с моющим средством.\n• Углы и плинтусы чистые, без разводов и липких следов.\n• Грязная вода после уборки вылита на улице, моп/тряпка промыты и поставлены на просушку.", "photo": "да", "responsible": "Администратор", "active": "да", "row": 82, "mediaRequired": true}, {"id": "u07", "block": "Закрытие", "group": "u", "groupName": "Закрытие · Уборка помещения (u01–u07)", "title": "🚽 Туалет вымыт и продезинфицирован 📸 (видео 5-7 сек)", "instruction": "Финальная дезинфекция санузла:\n• Унитаз, раковина, смеситель, дверные ручки и пол вымыты и обработаны дезинфицирующим средством.\n• Мусор выброшен, вставлен чистый пакет, расходники пополнены на утро.\n• 📹 Снять обзорное видео чистого санузла (5–7 секунд).", "photo": "да", "responsible": "Администратор", "active": "да", "row": 83, "mediaRequired": true}, {"id": "q01", "block": "День", "group": "q", "groupName": "День · Чистка До/После (q01–q09)", "title": "☕ Кофемашина (фото до и после)", "instruction": "• Корпус протёрт, без пятен, подтёков и кофейных следов.\n• Группы промыты, остатки кофе отсутствуют.\n• Портафильтры вымыты, без кофейных масел и налёта.\n• Паровые трубки очищены и продуты.\n• Поддон и решётка вымыты, без остатков воды и кофе.\n• Поверхности вокруг чистые, без кофейной гущи.\n• 📸 Сделать фото ДО и ПОСЛЕ чистки.", "photo": "да", "responsible": "Техник", "active": "да", "row": 84, "mediaRequired": true}, {"id": "q02", "block": "День", "group": "q", "groupName": "День · Чистка До/После (q01–q09)", "title": "🌪 Блендер (фото до и после)", "instruction": "• Чаша блендера вымыта, без остатков продуктов, налёта и запахов.\n• Ножи чистые, промыты со всех сторон.\n• Крышка и уплотнитель вымыты, без загрязнений в пазах.\n• Корпус и панель кнопок протёрты насухо, без капель и липкости.\n• 📸 Сделать фото ДО и ПОСЛЕ чистки.", "photo": "да", "responsible": "Техник", "active": "да", "row": 85, "mediaRequired": true}, {"id": "q03", "block": "День", "group": "q", "groupName": "День · Чистка До/После (q01–q09)", "title": "❄️ Холодильник под стойкой (фото до и после)", "instruction": "• Полки и стенки чистые, без крошек, пятен молока и подтёков.\n• Продукты и молоко размещены аккуратно по срокам годности.\n• Посторонние запахи отсутствуют.\n• Резиновые уплотнители дверцы вымыты в складках.\n• Дверца закрывается плотно.\n• 📸 Сделать фото ДО и ПОСЛЕ чистки.", "photo": "да", "responsible": "Закупщик", "active": "да", "row": 86, "mediaRequired": true}, {"id": "q04", "block": "День", "group": "q", "groupName": "День · Чистка До/После (q01–q09)", "title": "📦 Холодильник склад (фото до и после)", "instruction": "• Полки чистые, без загрязнений и подтёков.\n• Продукты разложены строго по категориям и промаркированы.\n• Посторонние запахи отсутствуют.\n• Уплотнители чистые, дверца закрывается плотно.\n• 📸 Сделать фото ДО и ПОСЛЕ чистки.", "photo": "да", "responsible": "Закупщик", "active": "да", "row": 87, "mediaRequired": true}, {"id": "q05", "block": "День", "group": "q", "groupName": "День · Чистка До/После (q01–q09)", "title": "🧊 Морозилка верхняя (фото до и после)", "instruction": "• Внутренняя камера очищена, без снежной наледи, крошек и загрязнений.\n• Замороженные заготовки и продукты упакованы, подписаны и размещены аккуратно.\n• Уплотнитель чистый, дверца закрывается плотно.\n• 📸 Сделать фото ДО и ПОСЛЕ чистки.", "photo": "да", "responsible": "Закупщик", "active": "да", "row": 88, "mediaRequired": true}, {"id": "q06", "block": "День", "group": "q", "groupName": "День · Чистка До/После (q01–q09)", "title": "🧊 Морозилка нижняя (фото до и после)", "instruction": "• Внутри чисто, ящики/полки вымыты без крошек и остатков продуктов.\n• Продукты расфасованы и размещены аккуратно.\n• Посторонние запахи отсутствуют.\n• 📸 Сделать фото ДО и ПОСЛЕ чистки.", "photo": "да", "responsible": "Закупщик", "active": "да", "row": 89, "mediaRequired": true}, {"id": "q07", "block": "День", "group": "q", "groupName": "День · Чистка До/После (q01–q09)", "title": "🧊 Льдогенератор (фото до и после)", "instruction": "• Внутренняя камера чистая, без слизи, плесени и известкового налёта.\n• Лёд прозрачный, без постороннего запаха, совок для льда чистый.\n• Лоток и дренаж чистые, без застоя воды.\n• Корпус снаружи и вентиляционная решётка протёрты.\n• 📸 Сделать фото ДО и ПОСЛЕ чистки.", "photo": "да", "responsible": "Техник", "active": "да", "row": 90, "mediaRequired": true}, {"id": "q08", "block": "День", "group": "q", "groupName": "День · Чистка До/После (q01–q09)", "title": "🚰 Мойка склад (фото до и после)", "instruction": "• Раковина на складе вымыта с дезсредством, без жира, налёта и остатков пищи.\n• Сливная сеточка и сифон чистые, без засоров и запаха (песок с полов в мойку не сливать!).\n• Смеситель натёрт без водного камня.\n• Поверхности и фартук вокруг мойки чистые и сухие.\n• 📸 Сделать фото ДО и ПОСЛЕ чистки.", "photo": "да", "responsible": "Администратор", "active": "да", "row": 91, "mediaRequired": true}, {"id": "q09", "block": "День", "group": "q", "groupName": "День · Чистка До/После (q01–q09)", "title": "🚰 Мойка стойка (фото до и после)", "instruction": "• Барная раковина и ринзер чистые, без остатков молока и кофейной гущи.\n• Слив чистый, вода уходит быстро, запах отсутствует.\n• Смеситель натёрт до блеска без налёта.\n• Рабочая зона вокруг мойки сухая и чистая.\n• 📸 Сделать фото ДО и ПОСЛЕ чистки.", "photo": "да", "responsible": "Администратор", "active": "да", "row": 92, "mediaRequired": true}],

/* =========================================================================
   МОДУЛЬ БЕЗОПАСНОСТИ (js/security.js — v21 Enterprise Security)
   1. Криптографическое хеширование SHA-256 с солью ('coffee_salt_v21:') без хранения открытых PIN.
   2. Защита от перебора PIN (Rate-Limiting): блокировка на 15 минут после 5 неверных попыток.

  const RATE_LIMIT_KEY = 'coffee_pin_ratelimit_v21';

  // Чистая синхронная реализация SHA-256 (FIPS 180-4) для работы в любом окружении (браузер + офлайн PWA + Node.js)
  function sha256Raw(ascii) {
    function rightRotate(value, amount) {
      return (value >>> amount) | (value << (32 - amount));
    }
    const mathPow = Math.pow;
    const maxWord = mathPow(2, 32);
    const lengthProperty = 'length';
    let i, j;
    let result = '';

    const asciiBitLength = ascii[lengthProperty] * 8;
    let hash = sha256Raw.h = sha256Raw.h || [];
    const k = sha256Raw.k = sha256Raw.k || [];
    let primeCounter = k[lengthProperty];
    const isComposite = {};
    for (let candidate = 2; primeCounter < 64; candidate++) {
      if (!isComposite[candidate]) {
        for (i = 0; i < 313; i += candidate) isComposite[i] = candidate;
        hash[primeCounter] = (mathPow(candidate, 0.5) * maxWord) | 0;
        k[primeCounter++] = (mathPow(candidate, 1 / 3) * maxWord) | 0;

    ascii += '\x80';
    while ((ascii[lengthProperty] % 64) - 56) ascii += '\x00';
    for (i = 0; i < ascii[lengthProperty]; i++) {
      j = ascii.charCodeAt(i);
      if (j >> 8) return '';
      words[i >> 2] |= j << ((3 - i) % 4) * 8;
    }
    words[words[lengthProperty]] = (asciiBitLength / maxWord) | 0;
    words[words[lengthProperty]] = asciiBitLength;
    for (j = 0; j < words[lengthProperty]; ) {
      const w = words.slice(j, (j += 16));
      const oldHash = hash;
      hash = hash.slice(0, 8);
      for (i = 0; i < 64; i++) {
        const i2 = i + j;
        const w15 = w[i - 15], w2 = w[i - 2];
        const a = hash[0], e = hash[4];
        const temp1 =
          hash[7] +
          (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25)) +
          ((e & hash[5]) ^ (~e & hash[6])) +
          k[i] +

          ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));

        hash[4] = (hash[4] + temp1) | 0;
      }

    }
    for (i = 0; i < 8; i++) {

      }
    }

  }

  function utf8ToBinaryStr(str) {
    return unescape(encodeURIComponent(String(str || '')));
  }

  window.coffeeSha256Sync = function (inputStr) {
    return sha256Raw(utf8ToBinaryStr(inputStr));

  window.coffeeHashPin = function (pinOrHash) {
    const s = String(pinOrHash || '').trim();

    getExpectedOwnerPinHash(dbOpt) {
      const db = dbOpt || (typeof getUDB === 'function' ? getUDB() : {});
      const sPin = ((db && db.settings) || []).find((x) => x.id === 'ADMIN_PIN');
      const raw = (sPin && sPin.value ? String(sPin.value).trim() : '') || (db && db.adminPin) || '';
      if (raw && raw.indexOf('••') === -1) return window.coffeeHashPin(raw);
      return window.COFFEE_DEFAULT_OWNER_PIN_HASH || window.coffeeHashPin('1234');
    },
    verifyOwnerPin(pinOrHash, dbOpt) {
      const rl = window.coffeeRateLimiter.check('owner_admin');
      if (rl.locked) return false;
      const cand = window.coffeeHashPin(pinOrHash);
      if (!cand) return false;
      const expected = this.getExpectedOwnerPinHash(dbOpt);
      const ok = cand === expected;
      if (!ok) {
        window.coffeeRateLimiter.recordFailure('owner_admin');
        return false;
      }
      window.coffeeRateLimiter.reset('owner_admin');
      return true;
    },
    createLocalSession(role, staffName, pinOrHash, serverTokenOpt) {
      const pinHash = window.coffeeHashPin(pinOrHash || this.getExpectedOwnerPinHash());
      if ((role || 'admin') === 'admin' && window.coffeeRateLimiter) {
        window.coffeeRateLimiter.reset('owner_admin');
      }
      if (serverTokenOpt) { try { localStorage.setItem('coffee_server_tok_at', String(Date.now())); } catch (_) {} }
      const token = serverTokenOpt || ('st_local_' + window.coffeeSha256Sync(Date.now() + ':' + Math.random()).slice(0, 24));
      const expiresAt = Date.now() + SESSION_TTL_MS;
      const sig = _makeSessionSig(token, role || 'admin', pinHash, expiresAt);
      const sess = { token, role: role || 'admin', staffName: staffName || 'Администратор', pinHash, expiresAt, sig };
      try {
        sessionStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify(sess));
        localStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify(sess));
        // В coffee_illy_pin сохраняем только sha256-хеш, чтобы открытый PIN никогда не лежал в localStorage
        localStorage.setItem('coffee_illy_pin', 'sha256:' + pinHash);
      } catch (_) {}
      return sess;
    },
    getSession() {
      try {
        const raw = sessionStorage.getItem(SESSION_STORAGE_KEY) || localStorage.getItem(SESSION_STORAGE_KEY);
        if (!raw) return null;
        const sess = JSON.parse(raw);
        if (!sess || !sess.token || !sess.expiresAt || Date.now() > sess.expiresAt) {
          this.logout();
          return null;
        }
        const expectedSig = _makeSessionSig(sess.token, sess.role, sess.pinHash, sess.expiresAt);
        if (sess.sig !== expectedSig) {
          this.logout();
          return null;
        }
        return sess;
      } catch (_) {
        return null;
      }
    },
    getSessionToken() {
      const s = this.getSession();
      return s ? s.token : '';
    },
    isAuthorized(requiredRole, dbOpt) {
      // ВНИМАНИЕ: Ручная подстановка coffee_admin_ok=1 в консоли отклоняется без криптографически подписанной сессии!
      const sess = this.getSession();
      if (!sess) return false;
      const expectedOwner = this.getExpectedOwnerPinHash(dbOpt);
      const defaultHash = window.COFFEE_DEFAULT_OWNER_PIN_HASH || window.coffeeHashPin('1234');
      if (requiredRole === 'admin') {
        return sess.role === 'admin' && sess.pinHash === expectedOwner;
      }
      return true;
    },
    async loginOwner(pinInput) {
      const rl = window.coffeeRateLimiter.check('owner_admin');
      if (rl.locked) {
        return { ok: false, locked: true, error: rl.message };
      }
      if (!this.verifyOwnerPin(pinInput)) {
        const st = window.coffeeRateLimiter.check('owner_admin');
        return {
          ok: false,
          locked: st.locked,
          remainingAttempts: st.remainingAttempts,
          error: st.locked
            ? st.message
            : 'Неверный код доступа владельца (осталось попыток: ' + st.remainingAttempts + ' из ' + MAX_ATTEMPTS + ')'
        };
      }
      const pinHash = window.coffeeHashPin(pinInput);
      const sess = this.createLocalSession('admin', 'Администратор', pinHash);
      // Фоновое получение серверного sessionToken от Code.gs
      try {
        if (window.COFFEE && window.COFFEE.API_URL && typeof fetch === 'function') {
          fetch(window.COFFEE.API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'auth_login', role: 'admin', staffName: 'Администратор', pinHash })
          })
            .then((r) => r.json())
            .then((res) => {
              if (res && res.ok && res.sessionToken) {
                this.createLocalSession('admin', 'Администратор', pinHash, res.sessionToken);
              }
            })
            .catch(() => {});
        }
      } catch (_) {}
      return { ok: true, sessionToken: sess.token, pinHash };
    },
    async loginStaff(staffName, pinInput, dbOpt) {
      const cleanName = String(staffName || 'Бариста').trim();
      const actorKey = 'staff_' + cleanName;
      const rl = window.coffeeRateLimiter.check(actorKey);
      if (rl.locked) {
        return { ok: false, locked: true, error: rl.message };
      }
      const okLocal = window.coffeeVerifyStaffPin ? window.coffeeVerifyStaffPin(cleanName, pinInput, dbOpt) : false;
      if (!okLocal) {
        const st = window.coffeeRateLimiter.check(actorKey);
        return {
          ok: false,
          locked: st.locked,
          remainingAttempts: st.remainingAttempts,
          error: st.locked ? st.message : ('Неверный персональный PIN сотрудника (осталось попыток: ' + st.remainingAttempts + ')')
        };
      }
      const pinHash = window.coffeeHashPin(pinInput);
      const sess = this.createLocalSession('staff', cleanName, pinHash);
      try {
        if (window.COFFEE && window.COFFEE.API_URL && typeof fetch === 'function') {
          fetch(window.COFFEE.API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'auth_login', role: 'staff', staffName: cleanName, pinHash })
          })
            .then((r) => r.json())
            .then((res) => {
              if (res && res.ok && res.sessionToken) {
                this.createLocalSession('staff', cleanName, pinHash, res.sessionToken);
              }
            })
            .catch(() => {});
        }
      } catch (_) {}
      return { ok: true, sessionToken: sess.token, staffName: cleanName, pinHash };
    },
    async setupInitialCredentials(newAdminPin, staffPinsMap) {
      const db = typeof getUDB === 'function' ? getUDB() : {};
      const adminHash = window.coffeeHashPin(newAdminPin);
      if (adminHash) {
        db.adminPin = 'sha256:' + adminHash;
        const sRow = (db.settings || []).find((x) => x.id === 'ADMIN_PIN');
        if (sRow) sRow.value = 'sha256:' + adminHash;
      }
      if (staffPinsMap && typeof staffPinsMap === 'object' && Array.isArray(db.staff)) {
        db.staff.forEach((s) => {
          if (s && staffPinsMap[s.name]) {
            s.pinHash = window.coffeeHashPin(staffPinsMap[s.name]);
            delete s.pin;
          }
        });
      }
      db.factoryPinsDisabled = true;
      if (typeof saveUDB === 'function') saveUDB(db);
      if (window.coffeeFetch && window.COFFEE && window.COFFEE.API_URL) {
        return window.coffeeFetch(window.COFFEE.API_URL, {
          method: 'POST',
          body: JSON.stringify({
            action: 'setup_initial_credentials',
            newAdminPin: adminHash ? ('sha256:' + adminHash) : '',
            staffPins: staffPinsMap || {}
          })
        });
      }
      return { ok: true, factoryPinsDisabled: true };
    },
    logout() {
      try {
        sessionStorage.removeItem(SESSION_STORAGE_KEY);
        localStorage.removeItem(SESSION_STORAGE_KEY);
        localStorage.removeItem('coffee_admin_ok');
        localStorage.removeItem('coffee_illy_pin');
      } catch (_) {}
    }
  };
})();

<script>/* js/storage.js */
/* =========================================================================
   МОДУЛЬ ХРАНЕНИЯ ДАННЫХ И INDEXEDDB (js/storage.js — v21 Enterprise)
   - Полная поддержка IndexedDB (CoffeeEnterpriseDB_v21: stores records, photos, delta_queue, snapshots)
   - Автоматическая выгрузка тяжёлых base64-фотографий из localStorage в IndexedDB (idb://photo/<hash>),
     чтобы localStorage всегда оставался компактным (< 45 КБ) и никогда не переполнял лимит 5 МБ.
   - Сохранение всех настроек, чек-листов и истории владельца при обновлениях.
   ========================================================================= */
const _photoMemCache = {};

window.CoffeeIDB = (function () {
  const DB_NAME = 'CoffeeEnterpriseDB_v21';
  const DB_VER = 1;
  let _dbPromise = null;

  function openDB() {
    if (typeof indexedDB === 'undefined') return Promise.resolve(null);
    if (_dbPromise) return _dbPromise;
    _dbPromise = new Promise((resolve) => {
      try {
        const req = indexedDB.open(DB_NAME, DB_VER);
        req.onupgradeneeded = (e) => {
          const idb = e.target.result;
          ['records', 'photos', 'delta_queue', 'snapshots'].forEach((st) => {
            if (!idb.objectStoreNames.contains(st)) idb.createObjectStore(st);
          });
        };
        req.onsuccess = (e) => resolve(e.target.result);
        req.onerror = () => resolve(null);
      } catch (_) {
        resolve(null);
      }
    });
    return _dbPromise;
  }

  function put(storeName, key, val) {
    return openDB().then((idb) => {
      if (!idb) return false;
      return new Promise((resolve) => {
        try {
          const tx = idb.transaction(storeName, 'readwrite');
          tx.objectStore(storeName).put(val, key);
          tx.oncomplete = () => resolve(true);
          tx.onerror = () => resolve(false);
        } catch (_) {
          resolve(false);
        }
      });
    });
  }

  function get(storeName, key) {
    return openDB().then((idb) => {
      if (!idb) return null;
      return new Promise((resolve) => {
        try {
          const tx = idb.transaction(storeName, 'readonly');
          const r = tx.objectStore(storeName).get(key);
          r.onsuccess = () => resolve(r.result !== undefined ? r.result : null);
          r.onerror = () => resolve(null);
        } catch (_) {
          resolve(null);
        }
      });
    });
  }

  // Выносит крупные base64-фото (> 2 КБ) в IndexedDB photos store и кэширует в _photoMemCache
  function offloadPhotoString(str) {
    if (typeof str !== 'string' || str.length < 2048 || !str.startsWith('data:image/')) return str;
    const hash = (window.coffeeSha256Sync ? window.coffeeSha256Sync(str.slice(0, 512) + str.length) : String(str.length)).slice(0, 20);
    const ref = 'idb://photo/' + hash;
    _photoMemCache[ref] = str;
    put('photos', ref, str);
    return ref;
  }

  function resolvePhotoString(str) {
    if (typeof str === 'string' && str.startsWith('idb://photo/')) {
      return _photoMemCache[str] || str;
    }
    return str;
  }

  function transformPhotos(obj, mode) {
    if (!obj || typeof obj !== 'object') return obj;
    const fn = mode === 'offload' ? offloadPhotoString : resolvePhotoString;
    const clone = Array.isArray(obj) ? [] : {};
    Object.keys(obj).forEach((k) => {
      const v = obj[k];
      if (typeof v === 'string' && (k === 'photo' || k === 'url' || k === 'cashPhotoMachine' || k === 'cashPhotoPaper' || v.startsWith('data:image/') || v.startsWith('idb://photo/'))) {
        clone[k] = fn(v);
      } else if (v && typeof v === 'object') {
        clone[k] = transformPhotos(v, mode);
      } else {
        clone[k] = v;
      }
    });
    return clone;
  }

  return {
    openDB,
    put,
    get,
    offloadPhotosFromDB(dbObj) {
      return transformPhotos(dbObj, 'offload');
    },
    hydratePhotosInDB(dbObj) {
      return transformPhotos(dbObj, 'hydrate');
    },
    getPhotoSync(ref) {
      return _photoMemCache[ref] || ref;
    }
  };
})();

function ensureMvpFields(db) {
  const t = _isoToday();
  if (!Array.isArray(db.staff)) {
    db.staff = window.COFFEE_MVP.DEFAULT_STAFF.map((x) => Object.assign({}, x));
  } else {
    db.staff = db.staff.filter((s) => s && !/^(администратор|владелец)$/i.test(String(s.name || '').trim()));
  }
  if (!Array.isArray(db.announcements)) {
    db.announcements = window.COFFEE_MVP.DEFAULT_ANNOUNCEMENTS(t);
  }
  db.deadlineExtensions = db.deadlineExtensions || {};
  if (!Array.isArray(db.auditLog)) {
    db.auditLog = [];
  }
  (db.incidents || []).forEach((inc) => {
    inc.status = window.coffeeNormIncStatus(inc.status);
    inc.incType = inc.incType || 'Поломка оборудования';
    if (!Array.isArray(inc.photos)) {
      inc.photos = inc.photo ? [inc.photo] : [];
    }
    if (!inc.photo && inc.photos.length) inc.photo = inc.photos[0];
    if (!Array.isArray(inc.history) || !inc.history.length) {
      inc.history = [
        { time: (inc.date || t) + ' ' + (inc.time || '12:00'), actor: inc.who || 'Бариста', status: inc.status, note: 'Регистрация карточки инцидента' }
      ];

  (db.tasks || []).forEach((task) => {
    if (!task.photoMode) {
      task.photoMode = task.photo === 'да' ? 'да' : (task.photo === 'при проблеме' ? 'при проблеме' : 'нет');
    }

}

function appendAudit(db, actor, action, details) {
  const now = new Date();
  const hm = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
  db.auditLog = db.auditLog || [];

    date: _isoToday(),
    time: hm,
    actor: actor || 'Система',
    action: action || 'Действие',
    details: details || ''
  });
  if (db.auditLog.length > 250) db.auditLog.length = 250;
}

const UDB_KEY = 'coffee_unified_hybrid_db_v3';

function _defaultUDB() {
  const t = _isoToday();
  return {
    location: 'Кофейня №1',
    plan: 2200,
    deadline: '08:30',
    woNorm: 15,
    photoAll: 'нет',

    blocks: ['Открытие', 'День', 'Закрытие'],
    categories: ['Закупка продуктов', 'Аренда', 'Зарплата', 'Коммунальные', 'Реклама', 'Ремонт и оборудование', 'Прочее'],
    settings: DEFAULT_SETTINGS_SCHEMA.map((s) => Object.assign({}, s)),
    modifiedSettings: {},
    tasks: (window.COFFEE.DEFAULT_TASKS || []).map((x, i) => Object.assign({}, x, { row: i + 2, mediaRequired: x.photo === 'да' })),
    cash: [],
    expenses: [],
    incidents: [],
    deletedIncidents: {},
    resolvedIncidents: {},
    productsByDate: {},
    checklists: [],
    checklistSubmissions: [],
    announcements: []
  };
}

function syncSettingsFields(db) {
  const map = {};
  (db.settings || []).forEach((s) => {
    const nk = normalizeSettingKey(s.id || s.label);
    map[nk] = s;
    s.id = nk;
  });
  db.settings = DEFAULT_SETTINGS_SCHEMA.map((def) => {
    if (map[def.id]) return Object.assign({}, def, map[def.id], { id: def.id, label: def.label, hint: def.hint });
    return Object.assign({}, def);
  });

  const getVal = (id, fallback) => {
    const item = db.settings.find((x) => x.id === id);
    return item && item.value !== undefined && String(item.value).trim() !== '' ? String(item.value).trim() : fallback;
  };

  db.location = getVal('LOCATION', db.location || 'Кофейня №1');
  db.plan = Math.max(1, Number(String(getVal('PLAN', db.plan || 2200)).replace(/\s/g, '')) || 2200);
  db.deadline = getVal('DEADLINE', db.deadline || '08:30');
  if (/^\d:\d{2}$/.test(db.deadline)) db.deadline = '0' + db.deadline;
  [
    { id: 'MIN_AVG_CHECK', label: 'Норматив среднего чека, руб. (ТЗ п. 8)', hint: 'Плановый минимальный средний чек для контроля выполнения плана', value: '35', secret: false },
    { id: 'PLAN_CHECKS', label: 'Плановое кол-во чеков в день (ТЗ п. 8)', hint: 'Целевое количество гостей/чеков за смену', value: '75', secret: false }
  ].forEach((defS) => {
    if (!(db.settings || []).some((x) => x.id === defS.id)) {
      db.settings.push(Object.assign({}, defS));
    }
  });
  db.woNorm = Math.max(0, Number(String(getVal('WO_NORM', db.woNorm ?? 15)).replace(/\s/g, '')) || 0);
  db.minAvgCheck = Math.max(1, Number(getVal('MIN_AVG_CHECK', db.minAvgCheck || 35)) || 35);
  db.planChecks = Math.max(1, Number(getVal('PLAN_CHECKS', db.planChecks || 75)) || 75);
  if (!Array.isArray(db.serviceAudits)) {
    db.serviceAudits = [];
  }
  db.cashHistory = db.cashHistory || [];
  if (!Array.isArray(db.ttk)) {
    db.ttk = (window.COFFEE_DEFAULT_TTK || []).map((x) => Object.assign({}, x));
  }
  if (!db.shiftRoster || typeof db.shiftRoster !== 'object') {
    db.shiftRoster = Object.assign({}, window.COFFEE_DEFAULT_ROSTER || {});
  }
  const rawPhoto = getVal('PHOTO_ALL', db.photoAll || 'нет').toLowerCase();
  db.photoAll = (rawPhoto === 'да' || rawPhoto === 'yes' || rawPhoto === 'true' || rawPhoto === '1') ? 'да' : 'нет';
  db.initCounter = Math.max(0, Number(String(getVal('INIT_COUNTER', db.initCounter || 600)).replace(/\s/g, '')) || 0);
  db.tgToken = getVal('TG_TOKEN', db.tgToken || '');
  db.tgChat = getVal('TG_CHAT', db.tgChat || '');

  const rawCats = getVal('CATEGORIES', '');
  if (rawCats) {
    const parsedCats = rawCats.split(',').map((c) => c.trim()).filter(Boolean);
    if (parsedCats.length) db.categories = parsedCats;
  }

  db.openStart = getVal('OPEN_START', db.openStart || '07:30');
  db.dayStart = getVal('DAY_START', db.dayStart || '11:00');
  db.dayDeadline = getVal('DAY_DEADLINE', db.dayDeadline || '18:30');
  db.closeStart = getVal('CLOSE_START', db.closeStart || '19:00');
  db.closeDeadline = getVal('CLOSE_DEADLINE', db.closeDeadline || '22:30');
  ensureMvpFields(db);

  const forcePhoto = db.photoAll === 'да';
  (db.tasks || []).forEach((t, i) => {
    t.row = i + 2;
    const isOC = t.block === 'Открытие' || t.block === 'Закрытие';
    const pMode = t.photoMode || t.photo || 'нет';
    t.photoMode = pMode;
    t.mediaRequired = (pMode === 'да') || (forcePhoto && isOC);
    t.mediaOnProblem = (pMode === 'при проблеме' || pMode === 'да');
  });
}

const MASTER_VAULT_KEY = 'coffee_owner_master_vault';
const SPA_COMPAT_KEY = 'coffee_unified_state_v7';
const IDB_NAME = 'CoffeeOwnerPermanentVault';
const IDB_STORE = 'snapshots';

/* Запись слепка базы в IndexedDB (резервный контур браузера, не сбрасываемый при смене ключей кода) */
function _idbSaveVault(dbObj) {
  try {
    if (typeof indexedDB === 'undefined') return;
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = (e) => {
      const idb = e.target.result;
      if (!idb.objectStoreNames.contains(IDB_STORE)) idb.createObjectStore(IDB_STORE);
    };
    req.onsuccess = (e) => {
      try {
        const idb = e.target.result;
        const tx = idb.transaction(IDB_STORE, 'readwrite');
        tx.objectStore(IDB_STORE).put(JSON.stringify(dbObj), 'master');
      } catch (_) {}
    };
  } catch (_) {}
}

/* Автовосстановление из IndexedDB при старте, если localStorage был очищен */
function _idbRestoreVaultIfNeeded() {
  try {
    if (typeof indexedDB === 'undefined') return;
    if (localStorage.getItem(MASTER_VAULT_KEY)) return;
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = (e) => {
      const idb = e.target.result;
      if (!idb.objectStoreNames.contains(IDB_STORE)) idb.createObjectStore(IDB_STORE);
    };
    req.onsuccess = (e) => {
      try {
        const idb = e.target.result;
        const tx = idb.transaction(IDB_STORE, 'readonly');
        const getReq = tx.objectStore(IDB_STORE).get('master');
        getReq.onsuccess = () => {
          if (getReq.result && !localStorage.getItem(MASTER_VAULT_KEY)) {
            const parsed = JSON.parse(getReq.result);
            if (parsed && parsed.settings) {
              saveUDB(_migrateAndMergeOwnerDB(parsed));
              if (window.coffeeBus) window.coffeeBus.emit('mutation', { action: 'vault_restored' });
            }
          }
        };
      } catch (_) {}
    };
  } catch (_) {}
}

/* Умный поиск существующей базы владельца по всем прошлым, текущим и будущим версиям ключей */
function _findExistingOwnerDB() {
  const candidates = [];
  const tryKey = (k, priority) => {
    try {
      const raw = localStorage.getItem(k);
      if (!raw) return;
      const obj = JSON.parse(raw);
      if (obj && typeof obj === 'object' && (Array.isArray(obj.settings) || Array.isArray(obj.tasks) || Array.isArray(obj.cash))) {
        candidates.push({ key: k, obj, ts: Number(obj.updatedAt) || 0, priority });
      }
    } catch (_) {}
  };
  tryKey(MASTER_VAULT_KEY, 100);
  tryKey(UDB_KEY, 90);
  tryKey(SPA_COMPAT_KEY, 85);
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k !== MASTER_VAULT_KEY && k !== UDB_KEY && k !== SPA_COMPAT_KEY && /^coffee_(unified_state|unified_hybrid_db)/i.test(k)) {
        tryKey(k, 70);
      }
    }
  } catch (_) {}
  if (!candidates.length) return null;
  candidates.sort((a, b) => (b.ts - a.ts) || (b.priority - a.priority));
  return candidates[0].obj;
}

/* Неразрушающая миграция базы при обновлении кода:
   Все настройки, задачи, выручка, инциденты, сотрудники и дедлайны владельца сохраняются 100% без сброса! */
function _migrateAndMergeOwnerDB(existing) {
  const def = _defaultUDB();
  if (!existing || typeof existing !== 'object') return def;

  const db = Object.assign({}, def, existing);
  db.modifiedSettings = Object.assign({}, existing.modifiedSettings || {});
  db.deletedIncidents = Object.assign({}, existing.deletedIncidents || {});
  db.resolvedIncidents = Object.assign({}, existing.resolvedIncidents || {});
  db.deletedTaskIds = Object.assign({}, existing.deletedTaskIds || {});
  db.productsByDate = Object.assign({}, def.productsByDate || {}, existing.productsByDate || {});
  db.checklists = Array.isArray(existing.checklists) ? existing.checklists : def.checklists;

  /* Защищаем все сохранённые владельцем настройки от перезаписи дефолтами или сервером */
  if (Array.isArray(existing.settings) && existing.settings.length) {
    existing.settings.forEach((s) => {
      const nk = normalizeSettingKey(s.id || s.label);
      if (s.value !== undefined && String(s.value).trim() !== '') {
        db.modifiedSettings[nk] = db.modifiedSettings[nk] || Date.now();
      }
    });
  }
  /* Подхватываем одиночные legacy-ключи, если владелец менял их в ранних версиях */
  try {
    const legLoc = localStorage.getItem('coffee_meta_location');
    const legPlan = localStorage.getItem('coffee_meta_plan');
    const legCnt = localStorage.getItem('coffee_meta_init_counter');
    const legPin = localStorage.getItem('coffee_illy_pin');
    if (legLoc && !existing.location) db.location = legLoc;
    if (legPlan && !existing.plan) db.plan = Number(legPlan) || def.plan;
    if (legCnt && !existing.initCounter) db.initCounter = Number(legCnt) || def.initCounter;
    if (legPin && !existing.adminPin) db.adminPin = legPin;
  } catch (_) {}

  db.deletedCashDates = Object.assign({}, existing.deletedCashDates || {});
  db.deletedExpenseIds = Object.assign({}, existing.deletedExpenseIds || {});
  db.deletedAnnouncementIds = Object.assign({}, existing.deletedAnnouncementIds || {});
  db.deletedStaffIds = Object.assign({}, existing.deletedStaffIds || {});
  db.deletedTtkIds = Object.assign({}, existing.deletedTtkIds || {});
  db.deletedGoodDeedIds = Object.assign({}, existing.deletedGoodDeedIds || {});
  db.deletedChecklistBlocks = Object.assign({}, existing.deletedChecklistBlocks || {});
  db.deletedServiceAuditIds = Object.assign({}, existing.deletedServiceAuditIds || {});
  db._lastServerSnapshot = Object.assign({}, existing._lastServerSnapshot || {});

  /* Сохраняем пользовательские задачи без возврата удалённых шагов */
  if (Array.isArray(existing.tasks)) {
    db.tasks = existing.tasks.filter((t) => t && !(db.deletedTaskIds && db.deletedTaskIds[t.id]));
  } else {
    db.tasks = def.tasks;
  }

    /* Однократная очистка демо-примеров при переходе к боевому запуску (prodCleanInitV23) */
  if (!db.prodCleanInitV23) {
    const demoDates = { '2026-10-30': 1, '2026-10-31': 1, '2026-11-01': 1, '2026-11-03': 1, '2026-11-04': 1 };
    const demoIncIds = { 'INC-200': 1, 'INC-201': 1 };
    const demoExpIds = { 'EXP-101': 1, 'EXP-102': 1, 'EXP-103': 1, 'EXP-104': 1, 'EXP-105': 1 };
    const demoAnnIds = { 'ann1': 1, 'ann2': 1, 'ann3': 1, 'ann_1': 1, 'ann_2': 1, 'ann_3': 1 };
    if (Array.isArray(db.cash)) {
      db.cash = db.cash.filter((c) => c && !demoDates[c.date] && c.barista !== 'Анна К.' && c.barista !== 'Максим В.');
    }
    if (Array.isArray(db.expenses)) {
      db.expenses = db.expenses.filter((e) => e && !demoExpIds[e.id]);
    }
    if (Array.isArray(db.incidents)) {
      db.incidents = db.incidents.filter((i) => i && !demoIncIds[i.id] && i.who !== 'Анна К.');
    }
    if (Array.isArray(db.checklists)) {
      db.checklists = db.checklists.filter((c) => c && !demoDates[c.date] && c.who !== 'Анна К.' && c.who !== 'Максим В.' && !(c.time === '08:20' && c.who === 'Соня'));
    }
    if (Array.isArray(db.checklistSubmissions)) {
      db.checklistSubmissions = db.checklistSubmissions.filter((c) => c && !demoDates[c.date] && c.userName !== 'Анна К.' && !(c.time === '08:20' && c.userName === 'Соня'));
    }
    if (Array.isArray(db.announcements)) {
      db.announcements = db.announcements.filter((a) => a && !demoAnnIds[a.id]);
    }
    db.productsByDate = {};
    db.prodCleanInitV23 = true;
    try {
      Object.keys(localStorage).forEach((k) => {
        if (k.indexOf('coffee_illy_done_') === 0 || k.indexOf('coffee_shift_draft') === 0) {
          localStorage.removeItem(k);
        }
      });
    } catch (_) {}
  }
  if (!db.prodCleanAuditsV28) {
    const demoAudIds = { 'AUD-101': 1, 'AUD-102': 1, 'AUD-103': 1 };
    if (Array.isArray(db.serviceAudits)) {
      db.serviceAudits = db.serviceAudits.filter((a) => a && !demoAudIds[a.id]);

    if (Array.isArray(db.auditLog)) {
      db.auditLog = db.auditLog.filter((l) => l && l.date !== '2026-11-05');

    db.prodCleanAuditsV28 = true;
  }
  syncSettingsFields(db);
  return db;
}

window.coffeeDeduplicateDB = function (db) {
  if (!db || typeof db !== 'object') return db;
  function dedupBy(arr, keyFn) {
    if (!Array.isArray(arr)) return [];
    const seen = new Map();
    arr.forEach((item) => {
      if (!item || typeof item !== 'object') return;
      const k = String(keyFn(item) || '').trim();
      if (!k) return;
      const prev = seen.get(k);
      if (!prev || Number(item.updatedAt || 0) >= Number(prev.updatedAt || 0)) {
        seen.set(k, item);
      }
    });
    return Array.from(seen.values());
  }
  if (Array.isArray(db.tasks)) db.tasks = dedupBy(db.tasks, (t) => t.id || (t.block + '|' + t.title));
  if (Array.isArray(db.checklistBlocks)) db.checklistBlocks = dedupBy(db.checklistBlocks, (b) => b.name);
  if (Array.isArray(db.cash)) db.cash = dedupBy(db.cash, (c) => c.date);
  if (Array.isArray(db.checklists)) db.checklists = dedupBy(db.checklists, (c) => c.sid || (c.date + '|' + c.block + '|' + (c.who || '')));
  if (Array.isArray(db.incidents)) {
    db.incidents = dedupBy(db.incidents, (i) => i.id);
    // Also remove exact content duplicates created on the same day & step
    const sigSeen = new Set();
    db.incidents = db.incidents.filter((i) => {
      const sig = String(i.date || '') + '|' + String(i.block || '') + '|' + String(i.step || '') + '|' + String(i.text || '').trim();
      if (sigSeen.has(sig)) return false;
      sigSeen.add(sig);
      return true;
    });
  }
  if (Array.isArray(db.expenses)) db.expenses = dedupBy(db.expenses, (e) => e.id);
  if (Array.isArray(db.goodDeeds)) db.goodDeeds = dedupBy(db.goodDeeds, (g) => g.id || g.title);
  if (Array.isArray(db.ttk)) db.ttk = dedupBy(db.ttk, (t) => t.id || t.name);
  if (Array.isArray(db.staff)) db.staff = dedupBy(db.staff, (s) => String(s.name || s.id || '').toLowerCase());
  if (Array.isArray(db.announcements)) db.announcements = dedupBy(db.announcements, (a) => a.id);
  if (Array.isArray(db.serviceAudits)) db.serviceAudits = dedupBy(db.serviceAudits, (a) => a.id);
  if (Array.isArray(db.auditLog)) {
    const aSeen = new Set();
    db.auditLog = db.auditLog.filter((l) => {
      if (!l) return false;
      const k = String(l.date || '') + '|' + String(l.time || '') + '|' + String(l.actor || '') + '|' + String(l.action || '') + '|' + String(l.details || '');
      if (aSeen.has(k)) return false;
      aSeen.add(k);
      return true;
    }).slice(0, 250);
  }
  return db;
};

function saveUDB(db) {
  try {
    if (window.coffeeDeduplicateDB) window.coffeeDeduplicateDB(db);
    db.updatedAt = Date.now();
    db.schemaVersion = 13;
    syncSettingsFields(db);
    /* Помечаем все текущие настройки как утверждённые владельцем */
    db.modifiedSettings = db.modifiedSettings || {};
    (db.settings || []).forEach((s) => {
      if (s && s.id && s.value !== undefined && String(s.value).trim() !== '') {
        db.modifiedSettings[s.id] = db.modifiedSettings[s.id] || db.updatedAt;
      }
    });
    (db.cash || []).sort((a, b) => b.date.localeCompare(a.date));
    (db.expenses || []).sort((a, b) => b.date.localeCompare(a.date));
    const serialized = JSON.stringify(db);
    /* Сохраняем одновременно в бессрочный Master Vault и в ключи всех версий */
    localStorage.setItem(MASTER_VAULT_KEY, serialized);
    localStorage.setItem(UDB_KEY, serialized);
    localStorage.setItem(SPA_COMPAT_KEY, serialized);
    localStorage.setItem('coffee_illy_tasks', JSON.stringify(db.tasks.filter((t) => t.active !== 'нет')));
    localStorage.setItem('coffee_meta_location', db.location);
    localStorage.setItem('coffee_meta_plan', String(db.plan));
    localStorage.setItem('coffee_meta_init_counter', String(db.initCounter));
    const openCnt = (db.incidents || []).filter((i) => window.coffeeIsIncActive(i.status)).length;
    localStorage.setItem('coffee_meta_open_inc', String(openCnt));
    localStorage.setItem('coffee_sync_ping', String(db.updatedAt) + '_' + Math.random().toString(36).slice(2, 6));
    _idbSaveVault(db);
  } catch (_) {}
}

/* Публичный API резервного копирования и восстановления базы владельца */
window.coffeeVault = {
  exportJSON() {
    const db = getUDB();
    const payload = JSON.stringify(db, null, 2);

      throw new Error('Некорректный формат файла резервной копии');

    const merged = _migrateAndMergeOwnerDB(parsed);

    if (window.coffeeCache) window.coffeeCache.invalidate('all');
    if (window.coffeeBus) window.coffeeBus.emit('mutation', { action: 'vault_import' });

    };

};
_idbRestoreVaultIfNeeded();

window.coffeeSettings = {

</script>
