<style>

:root {
  --bg: #FCF8F4; --surface: #F4ECE4; --surface-2: #EAE0D5; --card: #FFFFFF;
  --ink: #271C15; --muted: #6E5D51; --accent: #7D4E24; --accent-soft: rgba(125,78,36,0.12);
  --accent-ink: #FFFFFF; --good: #266D45; --good-soft: rgba(38,109,69,0.12);
  --warn: #A46200; --warn-soft: rgba(164,98,0,0.13); --bad: #B33A3A; --bad-soft: rgba(179,58,58,0.12);
  --border: rgba(39,28,21,0.10); --shadow: 0 2px 10px rgba(39,28,21,0.05);
  --radius-card: 24px; --radius-pill: 999px;
  --font: system-ui, -apple-system, 'Segoe UI', Roboto, Inter, sans-serif;
}
html[data-theme="dark"] {
  --bg: #171311; --surface: #221D1A; --surface-2: #2E2723; --card: #26201D;
  --ink: #F2E7DF; --muted: #B8A79A; --accent: #E8B88A; --accent-soft: rgba(232,184,138,0.16);
  --accent-ink: #2B1A0D; --good: #8AD6A7; --good-soft: rgba(138,214,167,0.15);
  --warn: #F0BE6F; --warn-soft: rgba(240,190,111,0.15); --bad: #F2A2A2; --bad-soft: rgba(242,162,162,0.15);
  --border: rgba(242,231,223,0.10); --shadow: 0 2px 14px rgba(0,0,0,0.28);
}
* { box-sizing: border-box; }
html, body { margin:0; padding:0; background:var(--bg); color:var(--ink); font-family:var(--font); font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased; transition:background .2s,color .2s; }
button, input, select, textarea { font-family:inherit; color:inherit; }
button { cursor:pointer; border:none; background:transparent; }
.topbar { position:sticky; top:0; z-index:40; background:var(--bg); border-bottom:1px solid var(--border); padding:10px 18px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
.brand { display:flex; align-items:center; gap:10px; }
.brand-dot { width:36px; height:36px; border-radius:14px; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; font-weight:800; font-size:15px; }
.brand-title { font-weight:750; font-size:16px; }
.brand-sub { font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.live-pill { display:inline-flex; align-items:center; gap:5px; padding:2px 9px; border-radius:999px; background:var(--good-soft); color:var(--good); font-weight:650; font-size:11px; }
.live-dot { width:7px; height:7px; border-radius:50%; background:currentColor; }
.top-actions { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.chip-btn { padding:7px 13px; border-radius:999px; background:var(--surface); border:1px solid var(--border); font-size:12.5px; font-weight:650; display:inline-flex; align-items:center; gap:6px; }
.chip-btn:hover { background:var(--surface-2); }
.chip-btn.accent { background:var(--accent); color:var(--accent-ink); border-color:transparent; }
.chip-btn.good { background:var(--good-soft); color:var(--good); border-color:transparent; }
.chip-btn.bad { background:var(--bad-soft); color:var(--bad); border-color:transparent; }
.chip-btn.warn { background:var(--warn-soft); color:var(--warn); border-color:transparent; }
.seg { display:inline-flex; background:var(--surface); padding:4px; border-radius:999px; border:1px solid var(--border); gap:2px; }
.seg button { padding:6px 12px; border-radius:999px; font-size:12.5px; font-weight:650; color:var(--muted); }
.seg button.active { background:var(--accent); color:var(--accent-ink); }
.card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius-card); padding:18px; box-shadow:var(--shadow); }
.card-soft { background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:12px 14px; }
.card-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
.card-title { font-size:16px; font-weight:750; margin:0; }
.card-sub { font-size:12px; color:var(--muted); }
.badge { display:inline-flex; align-items:center; justify-content:center; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:700; background:var(--surface-2); color:var(--ink); }
.badge.good { background:var(--good-soft); color:var(--good); }
.badge.warn { background:var(--warn-soft); color:var(--warn); }
.badge.bad { background:var(--bad-soft); color:var(--bad); }
.badge.accent { background:var(--accent-soft); color:var(--accent); }
.stack { display:flex; flex-direction:column; gap:10px; }
.row-item { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 14px; border-radius:18px; background:var(--surface); border:1px solid var(--border); flex-wrap:wrap; }
.row-main { min-width:0; flex:1; }
.row-title { font-weight:700; font-size:14px; }
.row-sub { font-size:12px; color:var(--muted); margin-top:2px; }
.pbar { height:7px; background:var(--surface-2); border-radius:99px; overflow:hidden; margin-top:6px; }
.pbar > div { height:100%; background:var(--accent); border-radius:99px; transition:width .25s; }
.pbar.good > div { background:var(--good); }
.field { display:flex; flex-direction:column; gap:5px; margin-bottom:10px; }
.field label { font-size:12px; font-weight:700; color:var(--muted); }
.field input, .field select, .field textarea { width:100%; padding:9px 12px; border-radius:14px; background:var(--surface); border:1px solid var(--border); font-size:14px; }
.grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.grid-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
@media (max-width:640px) { .grid-2, .grid-3 { grid-template-columns:1fr; } }
.btn-lg { width:100%; padding:12px 16px; border-radius:999px; font-size:14px; font-weight:750; display:inline-flex; align-items:center; justify-content:center; gap:8px; }
.btn-lg.primary { background:var(--accent); color:var(--accent-ink); }
.btn-lg.primary:disabled { opacity:0.45; cursor:not-allowed; }
.btn-lg.danger { background:var(--bad-soft); color:var(--bad); }
.btn-lg.soft { background:var(--surface-2); color:var(--ink); }
.tbl-wrap { overflow-x:auto; }
table { width:100%; border-collapse:collapse; font-size:13.5px; }
th, td { text-align:left; padding:9px 10px; border-bottom:1px solid var(--border); vertical-align:middle; }
th { font-size:11.5px; text-transform:uppercase; letter-spacing:0.03em; color:var(--muted); font-weight:700; }
tr:last-child td { border-bottom:none; }
.modal-bg { position:fixed; inset:0; background:rgba(0,0,0,0.48); z-index:80; display:none; align-items:center; justify-content:center; padding:16px; }
.modal-bg.open { display:flex; }
.modal-card { background:var(--card); border:1px solid var(--border); border-radius:28px; max-width:480px; width:100%; padding:20px; box-shadow:0 20px 50px rgba(0,0,0,0.3); max-height:86vh; overflow-y:auto; }
.toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:999px; font-size:13.5px; font-weight:650; opacity:0; pointer-events:none; z-index:90; transition:opacity .2s,transform .2s; box-shadow:0 8px 24px rgba(0,0,0,0.22); }
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

.wrap { max-width: 1200px; margin: 0 auto; padding: 18px; }
.admin-nav { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px; }
.admin-nav button { padding:9px 16px; border-radius:999px; background:var(--surface); border:1px solid var(--border); font-size:13.5px; font-weight:650; color:var(--muted); display:inline-flex; align-items:center; gap:6px; }
.admin-nav button.active { background:var(--accent); color:var(--accent-ink); border-color:transparent; }
.kpi-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; margin-bottom:16px; }
@media (max-width:780px) { .kpi-grid { grid-template-columns:repeat(2,minmax(0,1fr)); } }
.kpi { background:var(--card); border:1px solid var(--border); border-radius:22px; padding:16px; box-shadow:var(--shadow); }
.kpi-lbl { font-size:12px; color:var(--muted); font-weight:600; }
.kpi-val { font-size:24px; font-weight:800; margin:4px 0 2px; }
.kpi-meta { font-size:12px; color:var(--muted); }
.chart-wrap { display:grid; grid-template-columns:repeat(10,minmax(0,1fr)); gap:8px; align-items:end; height:150px; padding-top:20px; position:relative; }
.chart-plan-line { position:absolute; left:0; right:0; border-top:1.5px dashed var(--accent); opacity:.55; pointer-events:none; }
.chart-plan-lbl { position:absolute; right:0; top:-18px; font-size:11px; font-weight:650; color:var(--accent); }
.bar-col { display:flex; flex-direction:column; align-items:center; gap:5px; height:100%; justify-content:flex-end; }
.bar-val { font-size:10.5px; font-weight:700; color:var(--muted); }
.bar-fill { width:100%; max-width:34px; border-radius:10px 10px 4px 4px; background:var(--accent); }
.bar-fill.hit { background:var(--good); }
.bar-dt { font-size:10.5px; color:var(--muted); font-weight:600; }

  .date-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:0 0 14px;padding:10px 12px;border-radius:16px;background:var(--surface);border:1px solid var(--border);}
  .date-pills{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .date-pill{border:1px solid var(--border);background:transparent;color:var(--muted);padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:600;cursor:pointer;transition:.15s;}
  .date-pill:hover{color:var(--text);border-color:var(--accent);}
  .date-pill.active{background:var(--accent);color:#1d1510;border-color:var(--accent);}
  .date-custom{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .date-custom input[type="date"]{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:5px 9px;font-size:12.5px;font-family:inherit;}
  .date-range-lbl{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap;}
  .chart-wrap{overflow-x:auto;}

/* === Coffee Illy v96.0 Responsive System (Phones · Tablets · Desktop) === */
html { -webkit-text-size-adjust: 100%; }
body { overflow-x: hidden; padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right); }
.kpi-val, .bar-val, td, .badge { font-variant-numeric: tabular-nums; }
.chip-btn, .admin-nav button, .date-pill, .btn-lg, .pin-key, .bnav button {
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  transition: background .16s ease, transform .1s ease, border-color .16s ease, box-shadow .16s ease;
}
.chip-btn:active, .btn-lg:active, .pin-key:active { transform: scale(0.98); }
.tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 14px; }
.tbl-wrap table { min-width: 520px; }

/* Owner Dashboard: Responsive Bento (Phone -> Tablet -> PC) */
.topbar {
  padding: max(10px, env(safe-area-inset-top)) 20px 10px;
}
.admin-nav::-webkit-scrollbar, .date-pills::-webkit-scrollbar { display: none; }

/* Phones (<= 600px) */
@media (max-width: 600px) {
  .topbar { padding: max(8px, env(safe-area-inset-top)) 12px 8px; gap: 8px; }
  .brand-dot { width: 34px; height: 34px; border-radius: 12px; font-size: 14px; }
  .brand-title { font-size: 14.5px; line-height: 1.2; }
  .top-actions { width: 100%; gap: 6px; overflow-x: auto; flex-wrap: nowrap; scrollbar-width: none; padding-bottom: 2px; }
  .top-actions::-webkit-scrollbar { display: none; }
  .top-actions .chip-btn { flex: 0 0 auto; min-height: 36px; padding: 6px 11px; font-size: 12px; white-space: nowrap; }
  .wrap { padding: 12px 12px calc(24px + env(safe-area-inset-bottom)); }
  .admin-nav {
    flex-wrap: nowrap;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    gap: 6px;
    margin-bottom: 12px;
    padding-bottom: 4px;
  }
  .admin-nav button { flex: 0 0 auto; white-space: nowrap; min-height: 40px; padding: 8px 13px; font-size: 13px; }
  .date-bar { padding: 10px; gap: 8px; }
  .date-pills { flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; width: 100%; }
  .date-pill { flex: 0 0 auto; white-space: nowrap; min-height: 34px; }
  .date-custom { width: 100%; justify-content: space-between; }
  .date-custom input[type="date"] { flex: 1; min-width: 0; font-size: 14px; min-height: 38px; }
  .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-bottom: 12px; }
  .kpi { padding: 13px 12px; border-radius: 18px; }
  .kpi-val { font-size: clamp(18px, 5vw, 22px); }
  .kpi-lbl, .kpi-meta { font-size: 11.5px; }
  .card { padding: 14px; border-radius: 20px; }
  .card-title { font-size: 15px; }
  .chart-wrap { min-width: 440px; height: 145px; }
  .field input, .field select, .field textarea { font-size: 16px; min-height: 44px; }
  .btn-lg { min-height: 46px; }
  th, td { padding: 8px 8px; font-size: 12.5px; }
  .row-item { padding: 11px 12px; }
  .modal-bg { align-items: flex-end; padding: 0; }
  .modal-card {
    max-width: 100%;
    border-radius: 26px 26px 0 0;
    padding: 18px 16px calc(22px + env(safe-area-inset-bottom));
    max-height: 88vh;
  }
  .toast { max-width: calc(100vw - 24px); text-align: center; }
}

/* Tablets (601px - 1024px) */
@media (min-width: 601px) and (max-width: 1024px) {
  .topbar { padding: 12px 20px; }
  .wrap { max-width: 980px; padding: 16px 20px 28px; }
  .admin-nav { gap: 6px; }
  .admin-nav button { min-height: 40px; padding: 8px 14px; font-size: 13px; }
  .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .card { padding: 18px; }
}
@media (min-width: 860px) and (max-width: 1024px) {
  .kpi-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}

/* Desktop / PC (>= 1025px) */
@media (min-width: 1025px) {
  .topbar { padding: 12px 28px; }
  .wrap { max-width: 1320px; padding: 20px 28px 36px; }
  .kpi-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
  .kpi { padding: 18px 20px; }
  .kpi-val { font-size: 26px; }
  .card { padding: 22px; }
  .chart-wrap { height: 170px; }
  .tbl-wrap table { min-width: 0; }
}

  .tabs, .date-pills { -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .tabs::-webkit-scrollbar, .date-pills::-webkit-scrollbar { display: none; }
  body { padding-bottom: env(safe-area-inset-bottom, 0px); }
</style>

 (18 г зерна, 55–60 мл, 26–28 сек), чтобы сохранить насыщенный аромат и плотную крему.", "serve": "Подать без перемешивания в стакане 200 мл."}, {"id": "ttk_macchiato", "name": "Эспрессо Макиато", "cat": "Классика", "vol": "60 мл", "price": 17, "avgPrice": 17, "cost": 0, "recipe": "1. Сварить одинарный эспрессо (30 мл из 9 г зерна). 2. Взбить 50 мл молока 3.2% до глянцевой микропены (60°C). 3. Выложить ложкой 20–30 мл нежной молочной пены поверх эспрессо.", "serve": "Подать в чашке/стакане для эспрессо."}, {"id": "ttk_cappuccino", "name": "Капучино", "cat": "Молочные", "vol": "250 мл", "price": 19, "avgPrice": 19, "cost": 0, "recipe": "1. Сварить одинарный эспрессо (9 г, 30 мл). 2. Взбить 170–180 мл холодного молока 3.2% до 60–65°C с глянцевой пеной толщиной 1–1.5 см. 3. Влить молоко тонкой струйкой с латте-артом.", "serve": "Подать в стакане 250–300 мл, при необходимости предложить корицу/сахар."}, {"id": "ttk_dbl_cappuccino", "name": "Двойной капучино", "cat": "Молочные", "vol": "350 мл", "price": 29, "avgPrice": 29, "cost": 0, "recipe": "1. Сварить двойной эспрессо (18 г зерна, 55–60 мл). 2. Взбить 240–260 мл молока 3.2% до 60–65°C с бархатной пеной 1.5 см. 3. Аккуратно соединить с эспрессо.", "serve": "Подать в стакане 350–400 мл."}, {"id": "ttk_flat_white", "name": "Flat white", "cat": "Молочные", "vol": "200 мл", "price": 25, "avgPrice": 25, "cost": 0, "recipe": "1. Сварить двойной ристретто/эспрессо (18 г зерна, 45–50 мл). 2. Взбить 140–150 мл молока 3.2% до 58–62°C с минимальной шелковистой пеной (до 0.5 см). 3. Влить в кофе, подчеркнув плотный кофейный вкус.", "serve": "Подать в стакане 200 мл."}, {"id": "ttk_latte_s", "name": "Латте (мал)", "cat": "Молочные", "vol": "250 мл", "price": 20, "avgPrice": 20, "cost": 0, "recipe": "1. Сварить одинарный эспрессо (30 мл). 2. Взбить 200 мл молока 3.2% до 62–65°C с мягкой пеной 0.8–1 см. 3. Влить молоко в кофе круговыми движениями.", "serve": "Подать в стакане 250–300 мл."}, {"id": "ttk_latte_l", "name": "Латте (бол)", "cat": "Молочные", "vol": "350 мл", "price": 25, "avgPrice": 25, "cost": 0, "recipe": "1. Сварить двойной или насыщенный одинарный эспрессо (45–55 мл). 2. Взбить 280–300 мл молока 3.2% до 62–65°C. 3. Соединить молоко с кофе до нежной однородной текстуры.", "serve": "Подать в стакане 350–400 мл."}, {"id": "ttk_van_orange_latte", "name": "Ванильно апельсиновый Лате", "cat": "Авторские", "vol": "350 мл", "price": 30, "avgPrice": 30, "cost": 0, "recipe": "1. Налить в стакан 15 мл ванильного сиропа и 15 мл апельсинового сиропа (или свежевыжатого сока/цедры). 2. Сварить эспрессо (35–45 мл) и перемешать с сиропами. 3. Взбить 250 мл молока 3.2% до 62°C и аккуратно влить.", "serve": "Украсить долькой сушёного апельсина или щепоткой цедры, стакан 350–400 мл."}, {"id": "ttk_raf_classic", "name": "Раф классический (бол)", "cat": "Авторские", "vol": "350 мл", "price": 39, "avgPrice": 39, "cost": 0, "recipe": "1. В питчер налить 150 мл молока 3.2% и 100 мл сливок 10%, добавить 15 г ванильного сахара (или 15 мл сиропа «Ваниль»). 2. Влить свежий двойной эспрессо (50 мл) прямо в питчер. 3. Взбить всё вместе паром до 63–65°C в густую сливочную пену.", "serve": "Перелить в стакан 350–400 мл, подать с крышкой."}, {"id": "ttk_nut_mocha", "name": "Ореховый мокко", "cat": "Авторские", "vol": "350 мл", "price": 35, "avgPrice": 35, "cost": 0, "recipe": "1. В стакан добавить 15 г какао/шоколадного топинга и 15 мл орехового сиропа (лесной орех/пралине). 2. Пролить эспрессо (45 мл) и тщательно размешать до гладкости. 3. Взбить 240 мл молока до 62°C и влить.", "serve": "Украсить какао-пудрой или дроблёным орехом, стакан 350 мл."}, {"id": "ttk_steamer_l", "name": "Стимер (бол)", "cat": "Молочные", "vol": "350 мл", "price": 22, "avgPrice": 22, "cost": 0, "recipe": "1. В стакан добавить 20 мл выбранного сиропа (ваниль, карамель, банан и др.). 2. Взбить 300 мл молока 3.2% паром до 60–62°C с воздушной пеной. 3. Влить молоко в сироп и слегка перемешать.", "serve": "Подать в стакане 350–400 мл (напиток без кофеина, подходит детям)."}, {"id": "ttk_cocoa_s", "name": "Какао", "cat": "Какао", "vol": "200 мл", "price": 15, "avgPrice": 15, "cost": 0, "recipe": "1. В питчер насыпать 15 г какао-порошка и 10 г сахара, растворить в 20 мл горячей воды. 2. Добавить 170 мл молока 3.2% и взбить паром до 62–65°C до однородной пенки.", "serve": "Подать в стакане 200 мл, по желанию добавить маршмеллоу."}, {"id": "ttk_cocoa_m", "name": "Какао (ср)", "cat": "Какао", "vol": "300 мл", "price": 20, "avgPrice": 20, "cost": 0, "recipe": "1. Насыпать 20–25 г какао-порошка и 12 г сахара в питчер, развести 30 мл кипятка. 2. Влить 250 мл молока 3.2%, взбить стимером до 65°C.", "serve": "Подать в стакане 300 мл."}, {"id": "ttk_cocoa_l", "name": "Какао (бол)", "cat": "Какао", "vol": "400 мл", "price": 25, "avgPrice": 25, "cost": 0, "recipe": "1. Смешать 30 г какао-порошка и 15 г сахара с 35 мл горячей воды до однородной пасты. 2. Добавить 330 мл молока 3.2% и взбить паром до 65°C.", "serve": "Подать в стакане 400 мл."}, {"id": "ttk_cocoa_bounty", "name": "Какао «Баунти»", "cat": "Какао", "vol": "350 мл", "price": 30, "avgPrice": 30, "cost": 0, "recipe": "1. В питчере развести 25 г какао и 20 мл кокосового сиропа в 30 мл горячей воды. 2. Добавить 270 мл молока (или кокосового молока) и взбить паром до 63°C.", "serve": "Посыпать кокосовой стружкой, подать в стакане 350–400 мл."}, {"id": "ttk_cocoa_cran_orange", "name": "Бруснично - апельсиновый какао", "cat": "Какао", "vol": "350 мл", "price": 33, "avgPrice": 33, "cost": 0, "recipe": "1. В стакан положить 30 г брусничного пюре/основы и 15 мл апельсинового сиропа. 2. В питчере приготовить какао (25 г какао + 260 мл молока, взбить до 63°C). 3. Влить горячий какао в стакан и аккуратно перемешать.", "serve": "Украсить долькой апельсина, стакан 350–400 мл."}, {"id": "ttk_tea_seabuck_400", "name": "Облепиховый чай 400 мл.", "cat": "Чаи", "vol": "400 мл", "price": 25, "avgPrice": 25, "cost": 0, "recipe": "1. В стакан 400 мл положить 50 г облепиховой основы (пюре/ягоды с мёдом), 15 мл апельсинового сиропа и дольку апельсина. 2. Залить 320 мл горячей воды 85–90°C и тщательно размешать. 3. Дать настояться 1 минуту.", "serve": "Подать с крышкой и ложечкой/трубочкой."}, {"id": "ttk_tea_rasp_400", "name": "Малиново - имбирный чай 400 мл.", "cat": "Чаи", "vol": "400 мл", "price": 25, "avgPrice": 25, "cost": 0, "recipe": "1. Положить 45 г малиновой основы, 10 г тёртого/сиропного имбиря и 10 мл лимонного сока в стакан 400 мл. 2. Залить 330 мл воды 88°C, хорошо размешать.", "serve": "Подать в стакане 400 мл с крышкой."}, {"id": "ttk_tea_rasp_800", "name": "Малиново - имбирный чай 800 мл.", "cat": "Чаи", "vol": "800 мл", "price": 45, "avgPrice": 45, "cost": 0, "recipe": "1. В чайник 800 мл добавить 90 г малиновой основы, 20 г имбиря, 20 мл мёда/сиропа и 2 дольки лимона. 2. Залить 680 мл горячей воды 88°C, перемешать и настоять 2 минуты.", "serve": "Подать в чайнике 800 мл с двумя чашками."}, {"id": "ttk_tea_apple_400", "name": "Чай \"Пряное яблоко\" 400 мл.", "cat": "Чаи", "vol": "400 мл", "price": 25, "avgPrice": 25, "cost": 0, "recipe": "1. В стакан 400 мл положить 45 г яблочной основы с корицей (или 30 мл сиропа «Яблочный пирог» + дольки яблока и палочку корицы). 2. Залить 330 мл горячей воды 88°C, размешать.", "serve": "Подать в стакане 400 мл."}, {"id": "ttk_tea_berry_800", "name": "Чай \"Ягодный микс\" 800 мл.", "cat": "Чаи", "vol": "800 мл", "price": 45, "avgPrice": 45, "cost": 0, "recipe": "1. В чайник 800 мл положить 90 г микса ягод (смородина, вишня, малина), 25 мл сахарного/ягодного сиропа и веточку мяты. 2. Залить 680 мл горячей воды 88°C, настоять 2–3 минуты.", "serve": "Подать в чайнике 800 мл с чашками."}, {"id": "ttk_tea_fruit_400", "name": "Ягодный / фруктовый чай ... 400 мл.", "cat": "Чаи", "vol": "400 мл", "price": 20, "avgPrice": 20, "cost": 0, "recipe": "1. В стакан 400 мл добавить 40 г выбранной ягодной/фруктовой основы или 1 порцию фруктового чая + 15 мл сиропа. 2. Залить 340 мл воды 88–90°C, размешать.", "serve": "Подать в стакане 400 мл с крышкой."}, {"id": "ttk_tea_ginger_400", "name": "Имбирный чай 400 мл.", "cat": "Чаи", "vol": "400 мл", "price": 18, "avgPrice": 18, "cost": 0, "recipe": "1. В стакан 400 мл положить 25 г имбирно-лимонной основы (или свежий имбирь + 2 дольки лимона + 15 мл мёда). 2. Залить 350 мл горячей воды 85–88°C, размешать.", "serve": "Подать в стакане 400 мл."}, {"id": "ttk_tea_herbal_400", "name": "Травяной чай .. 400 мл.", "cat": "Чаи", "vol": "400 мл", "price": 17, "avgPrice": 17, "cost": 0, "recipe": "1. Поместить 1 фильтр-пакет / 4 г травяного сбора в стакан 400 мл. 2. Залить 360 мл воды 85–90°C, настоять 2–3 минуты.", "serve": "Подать в стакане 400 мл, предложить сахар/мёд."}, {"id": "ttk_tea_assort", "name": "Чай в ассортименте", "cat": "Чаи", "vol": "300 мл", "price": 15, "avgPrice": 15, "cost": 0, "recipe": "1. Выбрать сорт чая по запросу гостя (чёрный, зелёный, бергамот, фруктовый). 2. Залить 280–300 мл горячей воды (95°C для чёрного, 80°C для зелёного).", "serve": "Подать в стакане 300 мл, предложить сахар и лимон."}, {"id": "ttk_pina_colada", "name": "Пина Колада", "cat": "Холодные", "vol": "400 мл", "price": 35, "avgPrice": 35, "cost": 0, "recipe": "1. Наполнить стакан 400 мл льдом на 2/3. 2. Влить 20 мл кокосового сиропа, 150 мл ананасового сока и 50 мл сливок 10% (или кокосового молока). 3. Взбить в шейкере/блендере или тщательно перемешать.", "serve": "Подать с трубочкой, украсить долькой фрукта."}, {"id": "ttk_black_cherry", "name": "Black cherry", "cat": "Авторские", "vol": "350 мл", "price": 33, "avgPrice": 33, "cost": 0, "recipe": "1. В стакан налить 20 мл вишнёвого сиропа (или 40 мл вишнёвого сока) и 10 мл шоколадного топинга. 2. Сварить эспрессо (40 мл) и соединить с вишней. 3. Добавить 220 мл взбитого молока 62°C (или со льдом в холодном варианте).", "serve": "Подать в стакане 350 мл."}, {"id": "ttk_lemonade", "name": "Лимонад", "cat": "Холодные", "vol": "400 мл", "price": 28, "avgPrice": 28, "cost": 0, "rec   function blockTasks(nm) { return state.tasks.filter(t => t.block === nm); }
  function getBlkSt(b) {
    if (b.active === false) return { label:'Отключён', cls:'', open:false };
    if (state.extensions[b.name] && state.extensions[b.name].forceOpen) return { label:'Открыт админом до 23:59', cls:'good', open:true };
    const now = toMin(window.CoffeeCloudV93 ? window.CoffeeCloudV93.localHHMM() : '12:00');
    if (now < toMin(b.openTime)) return { label:'Откроется в ' + b.openTime, cls:'', open:false };
    if (now > toMin(b.deadline)) return { label:'Закрыт (' + b.deadline + ')', cls:'bad', open:false };
    return { label:'Открыт до ' + b.deadline, cls:'accent', open:true };
  }


  function normSaleKindLocal(rawKind, name) {
    const k = String(rawKind || '').trim().toLowerCase();
    const n = String(name || '').trim().toLowerCase();
    if (k === 'non_coffee' || k.includes('не-кофе') || k.includes('не кофе')) {
      if (/десерт|чизкейк|макарон|круассан|рулет|печень|торт|пирож|шоколад|батончик|сэндвич|сырник/.test(n)) return 'Десерты';
      if (/чай|матча|какао|лимонад|сок|вода|кола|смузи|милкшейк/.test(n)) return 'Чай и напитки';
      return 'Не-кофе';
    }
    if (k === 'coffee' || (k.includes('кофе') && !k.includes('не-кофе'))) return 'Кофе';
    if (/эспрессо|американо|капучино|латте|раф|флэт|кофе|макиато|мокко|бамбл|айс|гляссе|кортадо|доппио/.test(n)) return 'Кофе';
    if (/десерт|чизкейк|макарон|круассан|рулет|печень|торт|пирож|шоколад|батончик|сэндвич|сырник/.test(n)) return 'Десерты';
    if (/чай|матча|какао|лимонад|сок|вода|кола|смузи|милкшейк/.test(n)) return 'Чай и напитки';
    return rawKind ? String(rawKind) : 'Не-кофе';
  }

  function isResolvedInc(st) {
    const l = String(st || '').trim().toLowerCase();
    return l === 'решена' || l === 'решено' || l === 'resolved' || l === 'закрыто' || l === 'закрыта';
  }

  function ensureCompleteData() {
    // 1. Normalize salesLog kinds & derive sales from cash.topItems if salesLog is empty
    if (Array.isArray(state.salesLog)) {
      state.salesLog.forEach(s => { s.kind = normSaleKindLocal(s.kind, s.name); });
    } else {
      state.salesLog = [];
    }

    // 2. Normalize incident statuses
    if (Array.isArray(state.incidents)) {
      state.incidents.forEach(i => {
        if (isResolvedInc(i.status)) i.status = 'Решена';
        else if (!i.status || !String(i.status).trim()) i.status = 'Новая проблема';
      });
    }

    // 3. Warehouse: always ensure at least the 24 core coffee shop items are present (merging with any server/custom items)
    if (!Array.isArray(state.inventory)) state.inventory = [];
    if (state.inventory.length < 5 && typeof DEFAULT_INVENTORY_V95 !== 'undefined') {
      const exNames = new Set(state.inventory.map(x => String(x.name || '').trim().toLowerCase()));
      DEFAULT_INVENTORY_V95.forEach(def => {
        if (!exNames.has(def.name.toLowerCase())) {
          state.inventory.push(Object.assign({}, def, { updatedAt: def.updatedAt || TODAY }));
        }
      });
    }

    // 4. Derived warehouse movements from actual salesLog if no manual movements recorded yet
    if (!Array.isArray(state.inventoryMoves)) state.inventoryMoves = [];
    if (state.inventoryMoves.length === 0 && state.salesLog.length > 0) {
      let coffeeCups = 0, milkCups = 0, teaCups = 0, syrupCups = 0;
      let latestDate = TODAY;
      state.salesLog.forEach(s => {
        const q = Number(s.qty) || 0;
        const n = String(s.name || '').toLowerCase();
        if (s.date && s.date > latestDate) latestDate = s.date;
        if (s.kind === 'Кофе') {
          coffeeCups += q;
          if (/капуч|латте|раф|флэт|мокко|макиато/.test(n)) milkCups += q;
          if (/раф|сироп|карамел|ванил|орех/.test(n)) syrupCups += q;
        } else if (s.kind === 'Чай и напитки') {
          teaCups += q;
        }
      });
      const derived = [];
      if (coffeeCups > 0) {
        derived.push({ id: 'dm_beans', date: latestDate, time: '22:00', name: 'Зерно ILLY Espresso', type: 'writeoff', delta: -Number((coffeeCups * 0.018).toFixed(2)), unit: 'кг', stockAfter: Number(Math.max(0.5, 6 - coffeeCups * 0.018).toFixed(2)), actor: 'Авто-расчёт по продажам', note: coffeeCups + ' кофейных напитков' });
        derived.push({ id: 'dm_cups', date: latestDate, time: '22:00', name: 'Стаканы 300 мл', type: 'writeoff', delta: -coffeeCups, unit: 'шт', stockAfter: Math.max(20, 600 - coffeeCups), actor: 'Авто-расчёт по продажам', note: 'Расход тары по POS' });
      }
      if (milkCups > 0) {
        derived.push({ id: 'dm_milk', date: latestDate, time: '22:00', name: 'Молоко 3.2% (ТМК)', type: 'writeoff', delta: -Number((milkCups * 0.18).toFixed(1)), unit: 'л', stockAfter: Number(Math.max(2, 48 - milkCups * 0.18).toFixed(1)), actor: 'Авто-расчёт по продажам', note: milkCups + ' молочных напитков' });
      }
      if (teaCups > 0) {
        derived.push({ id: 'dm_tea', date: latestDate, time: '22:00', name: 'Чай листовой / основы', type: 'writeoff', delta: -teaCups, unit: 'порц.', stockAfter: Math.max(10, 120 - teaCups), actor: 'Авто-расчёт по продажам', note: 'Чай и напитки по POS' });
      }
      if (syrupCups > 0) {
        derived.push({ id: 'dm_syr', date: latestDate, time: '22:00', name: 'Сиропы (ассорти)', type: 'writeoff', delta: -Number((syrupCups * 0.02).toFixed(2)), unit: 'л', stockAfter: Number(Math.max(1, 5 - syrupCups * 0.02).toFixed(2)), actor: 'Авто-расчёт по продажам', note: 'Добавки и раф' });
      }
      state._derivedInvMoves = derived;
    } else {
      state._derivedInvMoves = null;
    }

    // 5. Derived opened-bar expiry tracking if expiryItems is empty
    if (!Array.isArray(state.expiryItems)) state.expiryItems = [];
    if (state.expiryItems.length === 0) {
      const addDaysIso = (d) => { const dt = new Date(Date.now() + d * 86400000); return dt.toISOString().slice(0, 10); };
      state._derivedExpiry = [
        { id: 'ex_milk', title: 'Молоко 3.2% ТМК (вскрыто на баре)', category: 'Молочное', date: TODAY, expiresDate: addDaysIso(2), expiresAtMs: Date.now() + 2 * 86400000, status: 'active' },
        { id: 'ex_cream', title: 'Сливки 10% (для рафа)', category: 'Молочное', date: TODAY, expiresDate: addDaysIso(2), expiresAtMs: Date.now() + 2 * 86400000, status: 'active' },
        { id: 'ex_alt', title: 'Альтернативное молоко (кокос/овсяное)', category: 'Молочное', date: TODAY, expiresDate: addDaysIso(3), expiresAtMs: Date.now() + 3 * 86400000, status: 'active' },
        { id: 'ex_syr', title: 'Сиропы открытые (Ваниль / Карамель)', category: 'Сиропы', date: TODAY, expiresDate: addDaysIso(30), expiresAtMs: Date.now() + 30 * 86400000, status: 'active' }
      ];
    } else {
      state._derivedExpiry = null;
    }

    // 6. Enrich TTK with all unique sold items from salesLog + DEFAULT_TTK_V95 (without losing sheet items)
    if (!Array.isArray(state.ttk)) state.ttk = [];
    const ttkMap = new Map();
    state.ttk.forEach(k => {
      if (!k || !k.name) return;
      if (!k.vol) k.vol = '250 мл (M)';
      if (!k.cat) k.cat = normSaleKindLocal('', k.name) === 'Кофе' ? 'Классика' : normSaleKindLocal('', k.name);
      ttkMap.set(k.name.trim().toLowerCase(), k);
    });
    if (typeof DEFAULT_TTK_V95 !== 'undefined') {
      DEFAULT_TTK_V95.forEach(def => {
        const key = def.name.trim().toLowerCase();
        if (!ttkMap.has(key)) {
          const item = Object.assign({}, def);
          state.ttk.push(item);
          ttkMap.set(key, item);
        }
      });
    }
    const salesAgg = {};
    state.salesLog.forEach(s => {
      const nm = String(s.name || '').replace(/\s+шт\.?$/i, '').trim();
      if (!nm) return;
      const key = nm.toLowerCase();
      if (!salesAgg[key]) salesAgg[key] = { name: nm, kind: s.kind, qty: 0, sum: 0 };
      salesAgg[key].qty += Number(s.qty) || 0;
      salesAgg[key].sum += Number(s.sum) || 0;
    });
    Object.keys(salesAgg).forEach((key, idx) => {
      if (!ttkMap.has(key) && !Array.from(ttkMap.keys()).some(tk => tk.includes(key) || key.includes(tk))) {
        const ag = salesAgg[key];
        const avgP = ag.qty > 0 ? Math.round(ag.sum / ag.qty) : 0;
        const item = {
          id: 'ttk_pos_' + idx,
          name: ag.name,
          vol: ag.kind === 'Кофе' ? '250 мл' : '1 шт',
          cat: ag.kind || 'Прочее',
          price: avgP,
          avgPrice: avgP,
          cost: 0,
          recipe: ag.kind === 'Кофе'
            ? 'Приготовление по стандарту Coffee ILLY (18 г зерна → 36 г эспрессо за 25–27 сек). Подача при 62–65 °C.'
            : 'Подача по стандарту витрины / бара Coffee ILLY с проверкой срока годности.'
        };
        state.ttk.push(item);
        ttkMap.set(key, item);
      }
    });

    // 7. Mark cash days that have salesLog entries as POS CSV days too
    const salesDates = new Set((state.salesLog || []).map(s => String(s.date || '').slice(0, 10)).filter(Boolean));
    (state.cash || []).forEach(c => {
      if (salesDates.has(String(c.date || '').slice(0, 10)) && (!Array.isArray(c.csvHashes) || !c.csvHashes.length)) {
        c.csvHashes = ['pos_sheet'];
      }
    });

    // 8. Ensure 7-day plans (Пн–Вс) always exist
    if (!Array.isArray(state.plans) || state.plans.length < 7) {
      const defDays = [
        { day: 'Пн', rev: 2200, avg: 32, checks: 70, roster: 'Соня (07:30–22:30)' },
        { day: 'Вт', rev: 2200, avg: 32, checks: 70, roster: 'Алина (07:30–22:30)' },
        { day: 'Ср', rev: 2300, avg: 33, checks: 72, roster: 'Алина + Соня (2 смены)' },
        { day: 'Чт', rev: 2300, avg: 33, checks: 72, roster: 'Настя (07:30–22:30)' },
        { day: 'Пт', rev: 2600, avg: 35, checks: 76, roster: 'Соня + Алина (пик)' },
        { day: 'Сб', rev: 2800, avg: 36, checks: 80, roster: 'Алина + Настя (2-й зал)' },
        { day: 'Вс', rev: 2500, avg: 35, checks: 74, roster: 'Соня (08:00–22:00)' }
      ];
      const byDay = {};
      (state.plans || []).forEach(p => { if (p && p.day) byDay[p.day] = p; });
      state.plans = defDays.map(d => Object.assign({}, d, byDay[d.day] || {}));
    }

    // 9. Fallback serviceAudits & goodDeeds from live Coffee_illy sheet if server hasn't returned them yet
    if (!Array.isArray(state.serviceAudits) || !state.serviceAudits.length) {
      state.serviceAudits = [
        { id: 'AUD-257', date: '2026-11-13', barista: 'Соня', auditor: 'Шеф-бариста Максим', greeting: 100, clarify: 100, upsell: 90, farewell: 100, total: 98, comment: '' },
        { id: 'AUD-824', date: '2026-11-13', barista: 'Алина', auditor: 'Шеф-бариста Максим', greeting: 100, clarify: 100, upsell: 90, farewell: 100, total: 98, comment: '' }
      ];
    }
    if (!Array.isArray(state.goodDeeds) || !state.goodDeeds.length) {
      state.goodDeeds = [
        { id: 'gd1', title: '🧊 Разморозка и генеральная мойка холодильника', period: 'Раз в 2 недели (Вт 14:00–18:00)', window: '14:00 – 18:00', executor: 'Бариста', checker: 'Управляющий' },
        { id: 'gd2', title: '🧂 Регенерация водоумягчителя (2 пачки соли)', period: 'Раз в 4 недели (при закрытии)', window: '21:30 – 22:30', executor: 'Бариста', checker: 'Техник' },
        { id: 'gd3', title: '🪑 Подготовка второго зала к открытию (Пт–Сб)', period: 'Только Пт и Сб', window: '07:30 – 08:30', executor: 'Бариста', checker: 'Администратор' }
      ];
    }
  }

  function openWarehouseModal(id) {
    const it = id ? (state.inventory || []).find(x => x.id === id) : null;
    openModal(it ? ('Товар: ' + it.name) : 'Новый товар на складе', `
      <div class="field"><label>Название товара</label><input id="wh-nm" value="${it ? esc(it.name) : ''}" placeholder="Например: Зерно Illy 250г / Молоко 3.2%"></div>
      <div class="grid-2">
        <div class="field"><label>Категория</label><input id="wh-cat" value="${it ? esc(it.category || 'Сырьё') : 'Сырьё'}" placeholder="Кофе / Молоко / Расходники"></div>
        <div class="field"><label>Ед. измерения</label><input id="wh-un" value="${it ? esc(it.unit || 'шт') : 'шт'}" placeholder="г / мл / шт / л"></div>
      </div>
      <div class="grid-2">
        <div class="field"><label>Текущий остаток</label><input id="wh-st" type="number" min="0" value="${it ? Number(it.stock || 0) : 0}"></div>
        <div class="field"><label>Мин. порог (алерт)</label><input id="wh-min" type="number" min="0" value="${it ? Number(it.minStock || 5) : 5}"></div>
      </div>
      <button class="btn-lg primary" id="wh-sv">Сохранить на склад</button>
    `);
    document.getElementById('wh-sv').onclick = async () => {
      const payload = {
        id: it ? it.id : ('inv_' + Date.now().toString(36)),
        name: document.getElementById('wh-nm').value.trim(),
        category: document.getElementById('wh-cat').value.trim() || 'Сырьё',
        unit: document.getElementById('wh-un').value.trim() || 'шт',
        stock: Math.max(0, Math.round(Number(document.getElementById('wh-st').value) || 0)),
        minStock: Math.max(0, Math.round(Number(document.getElementById('wh-min').value) || 0))
      };
      if (!payload.name) { showToast('Укажите название товара'); return; }
      if (window.CoffeeCloudV93) {
        const res = await window.CoffeeCloudV93.saveInventoryItem(payload);
        if (res && res.ok) {
          if (Array.isArray(res.inventory)) state.inventory = res.inventory;
          if (Array.isArray(res.inventoryMoves)) state.inventoryMoves = res.inventoryMoves;
        }
      }
      if (!state.inventory) state.inventory = [];
      const ex = state.inventory.find(x => x.id === payload.id);
      if (ex) Object.assign(ex, payload, { updatedAt: TODAY });
      else state.inventory.push(Object.assign({}, payload, { updatedAt: TODAY }));
      saveSharedState(state, 'Администратор', 'Обновлён склад: ' + payload.name + ' (' + payload.stock + ' ' + payload.unit + ')');
      closeModal(); showToast('✓ Остаток сохранён в Google Таблице'); render();
    };
  }
  function openWarehouseMoveModal(id, kind) {
    const it = (state.inventory || []).find(x => x.id === id);
    if (!it) return;
    const isRestock = kind === 'restock';
    openModal((isRestock ? 'Приход: ' : 'Списание: ') + it.name, `
      <div class="card-soft" style="margin-bottom:10px;font-size:12.5px;">Текущий остаток: <b>${it.stock} ${esc(it.unit)}</b></div>
      <div class="field"><label>Количество (${esc(it.unit)})</label><input id="wm-qty" type="number" min="1" value="1"></div>
      <div class="field"><label>Комментарий</label><input id="wm-note" placeholder="${isRestock?'Поставка от поставщика':'Использовано / списано'}"></div>
      <button class="btn-lg primary" id="wm-ok">${isRestock?'+ Зачислить на склад':'− Списать со склада'}</button>
    `);
    document.getElementById('wm-ok').onclick = async () => {
      const qty = Math.max(1, Math.round(Number(document.getElementById('wm-qty').value) || 0));
      const note = document.getElementById('wm-note').value.trim();
      if (window.CoffeeCloudV93) {
        const res = isRestock
          ? await window.CoffeeCloudV93.restockInventory(it.id, qty, note)
          : await window.CoffeeCloudV93.writeoffInventory(it.id, qty, note);
        if (res && res.ok) {
          if (Array.isArray(res.inventory)) state.inventory = res.inventory;
          if (Array.isArray(res.inventoryMoves)) state.inventoryMoves = res.inventoryMoves;
        }
      }
      it.stock = Math.max(0, Number(it.stock || 0) + (isRestock ? qty : -qty));
      it.updatedAt = TODAY;
      saveSharedState(state, 'Администратор', (isRestock ? 'Приход склада: ' : 'Списание склада: ') + it.name + ' (' + (isRestock ? '+' : '-') + qty + ' ' + it.unit + ')');
      closeModal(); showToast(isRestock ? '✓ Приход записан' : '✓ Списание записано'); render();
    };
  }

    openModal('Редактировать задачу', `
      <div class="field"><label>Название шага</label><input id="et-t" value="${esc(t.title)}"></div>
      <div class="field"><label>Инструкция / стандарт</label><textarea id="et-i" rows="3">${esc(t.instruction || '')}</textarea></div>
      <div class="grid-2">
        <div class="field"><label>Блок чек-листа</label><select id="et-b">${optList(blockNames, t.block)}</select></div>
        <div class="field"><label>Ответственный</label><select id="et-o">${optList(OWNERS, t.owner || 'Бариста')}</select></div>
      </div>
      <div class="field"><label>Фото / видео обязательно</label><select id="et-p"><option value="1" ${t.photo?'selected':''}>Да</option><option value="0" ${!t.photo?'selected':''}>Нет</option></select></div>
      <div style="display:flex;gap:8px;margin-top:8px;">
        <button class="btn-lg primary" id="et-save" style="flex:1;">✓ Сохранить и отправить в терминал</button>
        <button class="chip-btn" id="et-back">← Назад</button>
      </div>
    `);
    document.getElementById('et-back').onclick = () => openTasksModal(returnBlk || t.block);
    document.getElementById('et-save').onclick = () => guard('Изменить задачу', () => {
      const nt = document.getElementById('et-t').value.trim();
      if (!nt) { showToast('Введите название задачи'); return; }
      t.title = nt;
      t.instruction = document.getElementById('et-i').value.trim() || 'По стандарту Coffee Illy.';
      t.block = document.getElementById('et-b').value;
      t.group = t.block;
      t.owner = document.getElementById('et-o').value;
      t.photo = document.getElementById('et-p').value === '1';
      saveSharedState(state, 'Администратор', 'Обновлена задача ' + t.id);
      showToast('✓ Задача обновлена и отправлена в терминал бариста');
      openTasksModal(returnBlk || t.block);
      render();
    });
  }

  function openTasksModal(blk) {
    const list = blockTasks(blk);
    openModal('Задачи «' + blk + '» (' + list.length + ')', `
      <div class="stack" style="margin-bottom:12px;max-height:270px;overflow-y:auto;">${list.map((t,i)=>`<div class="card-soft" style="display:flex;justify-content:space-between;align-items:center;gap:8px;"><div style="min-width:0;flex:1;"><b>${i+1}. ${esc(t.title)}</b> ${t.photo?'<span class="badge accent">📷</span>':''}<div style="font-size:11.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(t.instruction || 'По стандарту Coffee Illy.')}</div></div><div style="display:flex;gap:4px;flex-shrink:0;"><button class="chip-btn" data-et="${esc(t.id)}" style="padding:4px 8px;" title="Изменить">✏️</button><button class="chip-btn bad" data-dt="${esc(t.id)}" style="padding:4px 8px;" title="Удалить">✕</button></div></div>`).join('')}</div>
      <div class="field"><label>Новая задача</label><input id="nt-t" placeholder="Название шага"></div>
      <div class="field"><label>Инструкция / стандарт</label><input id="nt-i" placeholder="Что именно нужно проверить или сфотографировать"></div>
      <div class="grid-2"><div class="field"><label>Ответственный</label><select id="nt-o">${optList(OWNERS,'Бариста')}</select></div><div class="field"><label>Фото / видео</label><select id="nt-p"><option value="1">Да</option><option value="0">Нет</option></select></div></div>
      <button class="btn-lg primary" id="nt-s">+ Добавить и синхронизировать</button>
    `);
    document.querySelectorAll('[data-et]').forEach(b=>b.onclick=()=>openEditTaskModal(b.dataset.et, blk));
    document.querySelectorAll('[data-dt]').forEach(b=>b.onclick=()=>guard('Удалить задачу',()=>{ const delId = b.dataset.dt; state.tasks=state.tasks.filter(x=>String(x.id)!==String(delId)); saveSharedState(state,'Администратор','Удалена задача ' + delId); showToast('✓ Задача удалена и синхронизирована'); openTasksModal(blk); render(); }));
    document.getElementById('nt-s').onclick = () => guard('Добавить задачу', () => {
      const t = document.getElementById('nt-t').value.trim(); if (!t) return;
      const instr = (document.getElementById('nt-i').value || '').trim() || 'По стандарту Coffee Illy.';
      state.tasks.push({ id:'t_'+Date.now(), block:blk, group:blk, title:t, instruction:instr, photo:document.getElementById('nt-p').value==='1', owner:document.getElementById('nt-o').value });
      saveSharedState(state, 'Администратор', 'Добавлена задача «' + t + '»'); showToast('✓ Задача добавлена и отправлена в терминал'); openTasksModal(blk); render();
    });
  }
  function openStaffModal(id) {
    const s = id ? state.staff.find(x=>x.id===id) : null;
    openModal(s ? 'Сотрудник: ' + s.name : 'Новый сотрудник', `
      <div class="field"><label>Имя</label><input id="sn" value="${s?esc(s.name):''}"></div>
      <div class="grid-2"><div class="field"><label>Роль</label><select id="sr"><option ${s&&s.role==='Бариста'?'selected':''}>Бариста</option><option ${s&&s.role==='Администратор'?'selected':''}>Администратор</option></select></div><div class="field"><label>Статус</label><select id="sa"><option value="1" ${!s||s.active!==false?'selected':''}>Активен</option><option value="0" ${s&&s.active===false?'selected':''}>Отключён</option></select></div></div>
      <div class="grid-2"><div class="field"><label>Личный PIN (4–6 цифр)</label><input id="sp" value="${s?esc(s.pin):'1234'}"></div><div class="field"><label>Telegram ID</label><input id="sg" value="${s?esc(s.tgId||''):''}" placeholder="TG-..."></div></div>
      <button class="btn-lg primary" id="ss">Сохранить</button>
    `);
    document.getElementById('ss').onclick = () => {
      const nm = document.getElementById('sn').value.trim(), pin = document.getElementById('sp').value.trim(), tg = document.getElementById('sg').value.trim();
      if (!nm || !/^\d{4,6}$/.test(pin)) { showToast('Проверьте имя и PIN (4–6 цифр)'); return; }
      if (s) { s.name=nm; s.role=document.getElementById('sr').value; s.active=document.getElementById('sa').value==='1'; s.pin=pin; s.pinIsDefault=(pin==='1234'); s.tgId=tg; }
      else state.staff.push({ id:'st_'+Date.now(), name:nm, role:document.getElementById('sr').value, shop:state.location, active:true, pin, pinIsDefault:pin==='1234', tgId:tg });
      saveSharedState(state, 'Администратор', 'Обновлён сотрудник ' + nm); closeModal(); showToast('Синхронизировано!'); render();
    };
  }
  function openTtkModal(id) {
    const k = id ? state.ttk.find(x=>x.id===id) : null;
    openModal(k ? 'ТТК: ' + k.name : 'Новая ТТК', `
      <div class="field"><label>Название</label><input id="kn" value="${k?esc(k.name):''}"></div>
      <div class="grid-2"><div class="field"><label>Объём</label><select id="kv">${optList(VOL_OPTS, k?k.vol:VOL_OPTS[3])}</select></div><div class="field"><label>Категория</label><select id="kc">${optList(CAT_OPTS, k?k.cat:CAT_OPTS[0])}</select></div></div>
      <div class="grid-2"><div class="field"><label>Цена вручную (₽)</label><input id="kp" type="number" min="1" value="${k?k.price:22}"></div><div class="field"><label>Себест. (₽)</label><input id="ks" type="number" min="0" step="0.1" value="${k?Number(k.cost||0):0}"></div></div>
      <div class="field"><label>Рецептура</label><textarea id="kr" rows="2">${k?esc(k.recipe):''}</textarea></div>
      <button class="btn-lg primary" id="ksv">Сохранить</button>
    `);
    document.getElementById('ksv').onclick = () => {
      const nm = document.getElementById('kn').value.trim(), pr = Number(document.getElementById('kp').value)||0, cs = Number(document.getElementById('ks').value)||0;
      if (!nm || pr<=0) return;
      if (k) { k.name=nm; k.vol=document.getElementById('kv').value; k.cat=document.getElementById('kc').value; k.price=pr; k.cost=cs; k.recipe=document.getElementById('kr').value.trim(); }
      else state.ttk.push({ id:'ttk_'+Date.now(), name:nm, vol:document.getElementById('kv').value, cat:document.getElementById('kc').value, price:pr, cost:cs, recipe:document.getElementById('kr').value.trim(), serve:'' });
      saveSharedState(state, 'Администратор', 'Обновлена ТТК ' + nm); closeModal(); showToast('ТТК отправлена в терминал!'); render();
    };
  }

  // Live Cross-Tab Sync Listener (receives instant updates from Terminal!)
  function onRemoteSync() {
    const next = loadSharedState();
    if (next.rev !== state.rev) {
      state = next;
      showToast('✓ Обновлено');
      render();
    }
  }
  if (syncCh) syncCh.onmessage = onRemoteSync;
  window.addEventListener('storage', (e) => { if (e.key === STORE_KEY) onRemoteSync(); });

  document.querySelectorAll('#admin-nav button').forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); });
  document.getElementById('btn-lock').onclick = () => { if (adminUnlocked) { adminUnlocked = false; render(); } else guard('Вход', () => {}); };
  let cloudLoop = null;
  document.getElementById('btn-reset').onclick = async () => {
    showToast('🔄 Загрузка свежих данных из Google Таблицы...');
    if (cloudLoop && cloudLoop.pullNow) {
      await cloudLoop.pullNow(true);
      showToast('✓ Данные обновлены из Google Таблицы');
      render();
    }
  };
  render();

  setInterval(() => {
    const _clk = document.getElementById('hdr-clock');
    if (_clk && window.CoffeeCloudV93) _clk.textContent = '🕒 ' + window.CoffeeCloudV93.localHHMM();
  }, 15000);
  if (window.CoffeeCloudV93) {
    cloudLoop = window.CoffeeCloudV93.startCloudLoop({
      mode: 'owner',
      getState: () => state,
      onAuthRequired: () => {
        adminUnlocked = false;
        adminAuthNeeded = true;
        render();
      },
      onSynced: (st, srvRev) => {
        if (window.CoffeeCloudV93.getSession && window.CoffeeCloudV93.getSession().adminToken) {
          adminUnlocked = true; adminAuthNeeded = false;
        }
        try { localStorage.setItem(STORE_KEY, JSON.stringify(st)); } catch(_) {}
        render();
      }
    });
  }
})();
</script>
</body>
</html>
