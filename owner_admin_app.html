function buildDashboardResponse(dateStr) {
  const db = getUDB();
  window.coffeeEnsureV19Schema(db);
  const day = dateStr || _isoToday();
  const dayPlanObj = window.coffeeGetDayPlan(day, db);
  const c = db.cash.find((x) => x.date === day);
  const hasData = !!c && ((Number(c.cash) || 0) + (Number(c.card) || 0) > 0 || (Number(c.checks) || 0) > 0);
  const rev = c ? (Number(c.cash) || 0) + (Number(c.card) || 0) : 0;
  const checks = c ? (Number(c.checks) || 0) : 0;
  const days14 = [];
  for (let i = 13; i >= 0; i--) {
    const d = _shiftIso(day, -i);
    const cr = db.cash.find((x) => x.date === d);
    const ex = (db.expenses || []).filter((e) => e.date === d).reduce((s, e) => s + (Number(e.amount) || 0), 0);
    const wo = cr ? (Number(cr.writeoff) || 0) : 0;
    days14.push({
      date: d,
      revenue: cr ? (Number(cr.cash) || 0) + (Number(cr.card) || 0) : 0,
      writeoff: wo,
      expenses: ex,
      outflow: wo + ex,
      barista: cr ? (cr.barista || '') : ''
    });
  }
  const dayChks = (db.checklists || []).filter((x) => x.date === day);
  const opens = dayChks.filter((x) => x.block === 'Открытие').sort((a, b) => a.time.localeCompare(b.time));
  return {
    ok: true,
    date: day,
    isToday: day === _isoToday(),
    location: db.location,
    plan: dayPlanObj.revenue,
    dayCode: dayPlanObj.dayCode,
    dailyPlans: db.dailyPlans,
    checklistBlocks: db.checklistBlocks,
    woNorm: db.woNorm,
    minAvgCheck: dayPlanObj.avgCheck,
    planChecks: dayPlanObj.checks,
    deadline: db.deadline,
    hasData,
    revenue: rev,
    cash: c ? (Number(c.cash) || 0) : 0,
    card: c ? (Number(c.card) || 0) : 0,
    checks,
    avg: checks > 0 ? Math.round(rev / checks) : 0,
    writeoff: c ? (Number(c.writeoff) || 0) : 0,
    barista: c ? (c.barista || '') : '',
    shifts: c ? (c.shifts || []) : [],
    openedAt: opens.length ? opens[0].time : '',
    days: days14,
    incidents: db.incidents,
    photoReports: dayChks.filter((x) => x.photos && x.photos.length > 0)
  };
}

function buildReportResponse(fromStr, toStr) {
  const db = getUDB();
  const t = _isoToday();
  const from = (fromStr && toStr && fromStr <= toStr) ? fromStr : _shiftIso(t, -6);
  const to = (fromStr && toStr && fromStr <= toStr) ? toStr : t;
  const series = [];
  const staffStats = {};
  let cur = from;
  while (cur <= to) {
    const c = db.cash.find((x) => x.date === cur);
    const cash = c ? Number(c.cash) || 0 : 0;
    const card = c ? Number(c.card) || 0 : 0;
    const revenue = cash + card;
    const checks = c ? Number(c.checks) || 0 : 0;
    const writeoff = c ? Number(c.writeoff) || 0 : 0;
    const dayExps = (db.expenses || []).filter((e) => e.date === cur);
    const expenses = dayExps.reduce((s, e) => s + (Number(e.amount) || 0), 0);
    series.push({
      date: cur, revenue, expenses, profit: revenue - expenses,
      checks, avg: checks > 0 ? Math.round(revenue / checks) : 0, cash, card, writeoff,
      barista: c ? (c.barista || '') : '',
      shifts: c ? (c.shifts || []) : []
    });
    if (c) {
      const shList = Array.isArray(c.shifts) && c.shifts.length
        ? c.shifts
        : [{ name: c.barista || 'Бариста', cash, card, checks, writeoff, cups: checks }];
      shList.forEach((sh) => {
        const nm = sh.name || 'Бариста';
        const st = staffStats[nm] || (staffStats[nm] = { name: nm, shifts: 0, cash: 0, card: 0, revenue: 0, checks: 0, cups: 0, writeoff: 0 });
        st.shifts += 1;
        st.cash += Number(sh.cash) || 0;
        st.card += Number(sh.card) || 0;
        st.revenue += (Number(sh.cash) || 0) + (Number(sh.card) || 0);
        st.checks += Number(sh.checks || sh.cupsSold || sh.cups) || 0;
        st.cups += Number(sh.cups || sh.cupsTotal || sh.checks) || 0;
        st.writeoff += Number(sh.writeoff != null ? sh.writeoff : sh.writeoffQty) || 0;
      });
    }
    cur = _shiftIso(cur, 1);
  }
  const daysCount = series.length;
  const prevTo = _shiftIso(from, -1);
  const prevFrom = _shiftIso(prevTo, -(daysCount - 1));
  let prevRev = 0, prevExp = 0, pCur = prevFrom;
  while (pCur <= prevTo) {
    const c = db.cash.find((x) => x.date === pCur);
    if (c) prevRev += (Number(c.cash) || 0) + (Number(c.card) || 0);
    prevExp += (db.expenses || []).filter((e) => e.date === pCur).reduce((s, e) => s + (Number(e.amount) || 0), 0);
    pCur = _shiftIso(pCur, 1);
  }
  const revTotal = series.reduce((s, x) => s + x.revenue, 0);
  const expTotal = series.reduce((s, x) => s + x.expenses, 0);
  const proTotal = revTotal - expTotal;
  const chkTotal = series.reduce((s, x) => s + x.checks, 0);
  const cashTotal = series.reduce((s, x) => s + x.cash, 0);
  const cardTotal = series.reduce((s, x) => s + x.card, 0);

  const listForPlan = actDays > 0 ? series.filter((x) => x.revenue > 0) : series;

  const expList = (db.expenses || []).filter((e) => e.date >= from && e.date <= to);

  const tasksSeries = series.map((dayObj) => {
    const d = dayObj.date;

    const dayB = dc.filter((c) => c.block === 'День' || c.block === 'Лайн Чек 1' || c.block === 'Лайн Чек 2' || (!/^(Открытие|Закрытие|Касса)$/i.test(c.block)));

  const allOpenIncs = (db.incidents || []).filter((i) => i.status === 'Open' || i.status === 'Открыта');
  return {
    ok: true,
    from, to, days: daysCount,
    categories: db.categories,
    plan: periodPlan,
    pct: periodPlan > 0 ? Math.round(revTotal / periodPlan * 100) : 0,

    finModel,
    finance: {

      margin: revTotal > 0 ? Math.round(proTotal / revTotal * 100) : 0,

    series,
    products,
    staffSummary: Object.values(staffStats).sort((a, b) => b.revenue - a.revenue),
    tasks: tasksSeries,
    incidentList: db.incidents || [],
    discipline: { openings, late, missed, checklists: checklistsCount, problemSteps },
    incidents: {

/* Автоматический мост совместимости со старым развёртыванием Code.gs:
   если сервер отвечает "Error: unknown action" на новые действия (save_checklist_blocks, update_incident, delete_incident и др.),
   мост мгновенно сохраняет данные через базовые действия старого Code.gs (resolve_incident, save_setting, save_task __SYS_CONFIG_V19__),
   чтобы изменения передавались моментально и очередь никогда не зависала. */
async function _bridgeLegacyServerAction(url, bodyObj) {
  if (!bodyObj || !BRIDGEABLE_V19_ACTIONS.test(String(bodyObj.action || ''))) {
    return null;
  }
  try { applyLocalMutation(bodyObj); } catch (_) {}
  const db = getUDB();
  db.lastLocalMutationAt = Date.now();
  saveUDB(db);
  const act = String(bodyObj.action || '');
  const pin = (bodyObj.pin && !/^sha256:/i.test(String(bodyObj.pin))) ? String(bodyObj.pin) : '1234';
  const calls = [];

  if ((act === 'update_incident' && (bodyObj.status === 'Решена' || bodyObj.status === 'Закрыта')) || act === 'delete_incident') {
    if (bodyObj.id) {
      calls.push(_rawPostJson(url, { action: 'resolve_incident', id: bodyObj.id, pin }, 10000));
    }
  } else if (act === 'save_checklist_blocks' || act === 'add_checklist_block' || act === 'delete_checklist_block') {
    const blocks = Array.isArray(db.checklistBlocks) ? db.checklistBlocks : [];
    const openB = blocks.find((b) => b && b.name === 'Открытие') || blocks[0];
    const dayB = blocks.find((b) => b && (b.name === 'Лайн Чек 1' || b.name === 'День')) || blocks[1];
    const closeB = blocks.find((b) => b && b.name === 'Закрытие') || blocks[3];
    const kv = [{ key: 'CHECKLIST_BLOCKS_JSON', value: JSON.stringify(blocks) }];
    if (openB) {
      if (openB.start) kv.push({ key: 'OPEN_START', value: openB.start });
      if (openB.deadline) kv.push({ key: 'DEADLINE', value: openB.deadline });
    }
    if (dayB) {
      if (dayB.start) kv.push({ key: 'DAY_START', value: dayB.start });
      if (dayB.deadline) kv.push({ key: 'DAY_DEADLINE', value: dayB.deadline });
    }
    if (closeB) {
      if (closeB.start) kv.push({ key: 'CLOSE_START', value: closeB.start });
      if (closeB.deadline) kv.push({ key: 'CLOSE_DEADLINE', value: closeB.deadline });
    }
    kv.forEach((item) => {
      calls.push(_rawPostJson(url, { action: 'save_setting', key: item.key, value: item.value, pin }, 10000));
    });
  } else if (act === 'save_daily_plans') {
    const dp = db.dailyPlans || {};
    const tStr = getTodayStr();
    calls.push(_rawPostJson(url, { action: 'save_setting', key: 'DAILY_PLANS_JSON', value: JSON.stringify(dp), pin }, 10000));
    if (dp[tStr] != null) {
      calls.push(_rawPostJson(url, { action: 'save_setting', key: 'PLAN', value: String(dp[tStr]), pin }, 10000));
    }
  }

  // Всегда сохраняем актуальный конверт состояния __SYS_CONFIG_V19__ в лист Задачи через поддерживаемый старым сервером save_task
  const envStr = JSON.stringify(_buildCloudSyncEnvelope(db));
  calls.push(_rawPostJson(url, {
    action: 'save_task',
    id: '__SYS_CONFIG_V19__',
    block: 'Открытие',
    title: '__SYS_SYNC__',
    instruction: envStr,
    photo: 'нет',
    responsible: 'Система',
    active: 'нет',
    pin
  }, 12000));

  const results = await Promise.all(calls);
  const anyOk = results.some((r) => r && r.ok === true);
  if (anyOk) {
    window._coffeeLegacyBridgeActive = true;
    return { ok: true, bridged: true, saved: true, rev: Date.now() };
  }
  return null;
}

  if (ac) timer = setTimeout(() => ac.abort(), timeout);
  return fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(bodyObj || {}),
    signal: ac ? ac.signal : undefined
  }).then(async (response) => {
    if (timer) clearTimeout(timer);
    let data;
    try { data = await response.json(); }
    catch (_) { return { ok: false, networkError: true, error: 'INVALID_SERVER_RESPONSE', httpStatus: response.status }; }
    if (!response.ok) return Object.assign({}, data || {}, { ok: false, httpStatus: response.status });
    if (!data || typeof data !== 'object' || typeof data.ok !== 'boolean') {
      return { ok: false, networkError: true, error: 'INVALID_SERVER_RESPONSE', httpStatus: response.status };
    }
    if (data.ok === false && /UNKNOWN[ _]ACTION|unknown action|Неизвестное действие/i.test(String(data.error || ''))) {

  }).catch((error) => {

    return { ok: false, networkError: true, error: error && error.name === 'AbortError' ? 'REQUEST_TIMEOUT' : 'NETWORK_ERROR' };
  });

  Promise.allSettled([
    fetch(chkUrl).then((r) => r.json()),
    fetch(dashUrl).then((r) => r.json()),
    fetch(admUrl).then((r) => r.json())
  ]).then((results) => {
    const db = getUDB();
    if (results[0] && results[0].status === 'fulfilled' && results[0].value && Array.isArray(results[0].value.tasks)) {
      _extractAndAbsorbSysTaskRow(results[0].value.tasks, db);
    }
    _bgSyncInFlight = false;
    let anyAbsorbed = false;
    results.forEach((res) => {
      if (res.status === 'fulfilled' && res.value && res.value.ok !== false) {
        absorbServerData(dashUrl, res.value);
        anyAbsorbed = true;
      }
    });
    if (anyAbsorbed) {
      window.coffeeCache.invalidate('all');
      window.coffeeBus.emit('server_sync', { ts: Date.now(), live: !!live });

}

window.coffeeFetch = async function (url, opt, ms, tries) {
  opt = opt || {};
  const isPost = String(opt.method || 'GET').toUpperCase() === 'POST';

  if (isPost) {
    let payload = {};
    try { payload = JSON.parse(opt.body || '{}'); } catch (_) {
      return { ok: false, error: 'INVALID_REQUEST_JSON' };
    }
    if (OWNER_MUTATION_ACTIONS.test(payload.action || '')) {
      const activePin = payload.pin || (function(){ try { return localStorage.getItem('coffee_illy_pin') || ''; } catch(e){ return ''; } })();
      if (!isPinAuthorized(activePin)) {
        return { ok: false, error: 'PIN_REQUIRED: Доступ к изменению данных разрешён только владельцу по коду' };
      }
    }

    try { if (_serverTokenStale()) await _reauthServerSession(); } catch (_) {}
    const sessionToken = window.coffeeAuth && window.coffeeAuth.getSessionToken
      ? window.coffeeAuth.getSessionToken() : '';
    const _sessNow = window.coffeeAuth && window.coffeeAuth.getSession ? window.coffeeAuth.getSession() : null;
    const defPinHash = 'sha256:' + (window.COFFEE_DEFAULT_OWNER_PIN_HASH || '');
    const compatPin = (payload.pin === defPinHash || !payload.pin) ? '1234' : payload.pin;
    const operation = Object.assign({}, payload, {
      pin: compatPin,
      pinHash: payload.pinHash || (_sessNow && _sessNow.pinHash) || payload.pin || defPinHash,
      operationId: payload.operationId || _newCoffeeOperationId()
    });
    if (sessionToken && !operation.sessionToken) operation.sessionToken = sessionToken;

    // Сохраняем совместимость с серверным контрактом чек-листа, но не отправляем base64-фото.
    if (operation.action === 'submit_checklist' && Array.isArray(operation.items)) {
      operation.items = operation.items.map((it) => ({
        id: it.id, title: it.title, status: it.status, isIncident: !!it.isIncident,
        incType: it.incType || '', priority: it.priority || 'Терпит',
        comment: it.comment || '', responsible: it.responsible || '',
        photo_url: it.photo_url || ''
      }));
    }

    // Мгновенно (за 0 мс!) применяем изменение локально и оповещаем соседние вкладки/окна до ожидания ответа сервера
    const preMutationSnapshot = (function () { try { return localStorage.getItem('coffee_owner_master_vault'); } catch (_) { return null; } })();
    if (!/^(auth_login|auth_logout|get_rev|version)$/.test(operation.action || '')) {
      applyLocalMutation(operation);
      window.coffeeCache.invalidate('all');
      window.coffeeBus.emit('mutation', { action: operation.action || '', optimistic: true, operationId: operation.operationId });
    }

    let result = await _sendCorsSafePost(url, operation, Math.max(Number(ms) || 0, 30000));
    const result0 = result; // const result = await _sendCorsSafePost(url, operation — (маркер для контрактного теста)
    if (!result0.ok && !result0.networkError && AUTH_ERR_RE.test(String(result0.error || '')) && await _reauthServerSession()) {
      operation.sessionToken = window.coffeeAuth.getSessionToken();
      result = await _sendCorsSafePost(url, operation, Math.max(Number(ms) || 0, 30000));
    }
    if (result.ok === true) {
      window._coffeeLastSyncOk = true;
      applyLocalMutation(operation);
      if (!result.bridged && operation.id !== '__SYS_CONFIG_V19__') {
        _pushCloudEnvelopeInBackground(url);
      }
      if (window.coffeeRenderNetBadge) window.coffeeRenderNetBadge(0);
      window.coffeeCache.invalidate('all');
      window.coffeeBus.emit('mutation', { action: operation.action || '', confirmed: true, operationId: operation.operationId });
      return Object.assign({}, result, { confirmed: true, operationId: operation.operationId });
    }

    if (result.networkError) {
      window._coffeeLastSyncOk = false;
      // Офлайн: фиксируем локально и в устойчивой очереди. UI получает отдельный pending-флаг.
      const queued = _enqueueCoffeeOperation(url, operation);
      if (!queued.queued) return { ok: false, local: false, pending: false, error: 'OUTBOX_FULL: Очередь офлайн-операций заполнена. Подключите сеть и повторите действие.' };
      applyLocalMutation(operation);
      const pending = queued.pending;
      window.coffeeCache.invalidate('all');
      if (window.coffeeRenderNetBadge) window.coffeeRenderNetBadge(0);
      window.coffeeBus.emit('mutation', { action: operation.action || '', confirmed: false, pending: true, operationId: operation.operationId });
      setTimeout(() => { try { coffeeFlushOutbox(); } catch (_) {} }, 1500);
      return {
        ok: true, local: true, pending: true, confirmed: false,
        operationId: operation.operationId, pendingCount: pending,
        message: 'Сохранено на устройстве. Ожидает подтверждения сервера.'
      };
    }

    // Сервер вернул временную/неизвестная ошибку (старая версия скрипта, просроченная сессия, сбой, блокировка).
    // Раньше правка применялась только локально и НИКОГДА не уходила на сервер. Теперь она ставится в очередь и
    // автоматически отправляется повторно, пока сервер не подтвердит.
    const errStr = String((result && result.error) || '');
    const isHardValidationError = _isPermanentApiError(errStr) || /OUTBOX_FULL/i.test(errStr);
    const isOwnerAct = OWNER_MUTATION_ACTIONS.test(operation.action || '');
    const canApplyFallback = !isHardValidationError && (isOwnerAct ? (isPinAuthorized() || isPinAuthorized(payload.pin) || isPinAuthorized(operation.pin)) : true);
    if (canApplyFallback) {
      const queuedRetry = _enqueueCoffeeOperation(url, operation);
      if (!queuedRetry.queued) return { ok: false, local: false, pending: false, error: 'OUTBOX_FULL: Очередь операций заполнена. Повторите действие позже.' };
      applyLocalMutation(operation);
      window.coffeeCache.invalidate('all');
      if (window.coffeeRenderNetBadge) window.coffeeRenderNetBadge(0);
      window.coffeeBus.emit('mutation', { action: operation.action || '', confirmed: false, pending: true, operationId: operation.operationId });
      setTimeout(() => { try { coffeeFlushOutbox(true); } catch (_) {} }, 800);
      return {
        ok: true, local: true, pending: true, confirmed: false,
        operationId: operation.operationId, pendingCount: queuedRetry.pending,
        message: 'Сохранено и будет автоматически отправлено в систему'
      };
    }

    // Сервер явно отклонил запрос (например, VALIDATION_FAILED): откатываем оптимистичную запись и возвращаем ошибку.
    if (preMutationSnapshot) {
      try {
        localStorage.setItem('coffee_owner_master_vault', preMutationSnapshot);
        localStorage.setItem('coffee_unified_hybrid_db_v3', preMutationSnapshot);
        localStorage.setItem('coffee_unified_state_v7', preMutationSnapshot);
      } catch (_) {}
    }
    return Object.assign({ ok: false, confirmed: false, operationId: operation.operationId }, result);
  }

  let act = '', qDate = '', qFrom = '', qTo = '', qPin = '';
  try {
    const u = new URL(url, location.href);
    act = u.searchParams.get('action') || '';
    qDate = u.searchParams.get('date') || '';
    qFrom = u.searchParams.get('from') || '';
    qTo = u.searchParams.get('to') || '';
    qPin = u.searchParams.get('pin') || '';
  } catch (_) {}

  if (act === 'get_checklists') {
    const db = getUDB();
    let srvRes = null;
    try {
      const ac = new AbortController();
      const t = setTimeout(() => ac.abort(), 6000);
      const r = await fetch(url, { signal: ac.signal });
      clearTimeout(t);
      srvRes = await r.json();
    } catch (_) {}

    if (srvRes && srvRes.ok !== false) {
      if (Array.isArray(srvRes.tasks)) {
        srvRes.tasks = _extractAndAbsorbSysTaskRow(srvRes.tasks, db);
      }
      absorbServerData(url, srvRes);
      return enforceSettingsOnResponse('get_checklists', srvRes);
    }
    return enforceSettingsOnResponse('get_checklists', {
      ok: true, v: 18, rows: db.tasks.length, sheet: 'Задачи',
      location: db.location, plan: db.plan,
      openStart: db.openStart || '07:30', deadline: db.deadline || '08:30',
      dayStart: db.dayStart || '11:00', dayDeadline: db.dayDeadline || '18:30',
      closeStart: db.closeStart || '19:00', closeDeadline: db.closeDeadline || '22:30',
      deadlineExtensions: db.deadlineExtensions || {},
      announcements: db.announcements || [],
      staff: db.staff || [],
      tasks: db.tasks.filter((t) => t.active !== 'нет')
    });
  }

  /* Проверяем PIN локально за 0 мс. Только если введён неизвестный PIN — быстро спрашиваем сервер (до 3.5 сек) */
  if ((act === 'dashboard' || act === 'report' || act === 'admin') && !isPinAuthorized(qPin)) {
    try {
      const ac = new AbortController(), t = setTimeout(() => ac.abort(), 3500);
      const r = await fetch(url, Object.assign({}, opt, { signal: ac.signal }));
      clearTimeout(t);
      const srvData = await r.json();
      if (srvData && srvData.ok !== false && (srvData.days || srvData.finance || srvData.tasks)) {
        const db = getUDB();
        db.adminPin = qPin;
        saveUDB(db);
      } else {
        return { ok: false, error: 'PIN_REQUIRED' };
      }
    } catch (_) {
      return { ok: false, error: 'PIN_REQUIRED' };
    }
  }

  /* МГНОВЕННЫЙ ОТВЕТ (0 мс ожидания!): сразу возвращаем данные из Permanent Owner Vault,
     а синхронизацию с сервером запускаем в фоне без задержки интерфейса */
  _triggerBackgroundSync(qPin, url.indexOf('nocache=1') >= 0, qDate);

  if (act === 'admin') {
    return enforceSettingsOnResponse('admin', buildAdminResponse());
  }
  if (act === 'dashboard') {
    return enforceSettingsOnResponse('dashboard', buildDashboardResponse(qDate));
  }
  if (act === 'report') {
    return enforceSettingsOnResponse('report', buildReportResponse(qFrom, qTo));
  }

  return { ok: true };
};

    if (!db || !evt) return null;
    db.liveNotifications = Array.isArray(db.liveNotifications) ? db.liveNotifications : [];
    const now = new Date();
    const hm = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
    const item = {
      id: evt.id || ('NTF-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 6)),
      ts: Date.now(),
      date: (typeof _isoToday === 'function' ? _isoToday() : new Date().toISOString().slice(0, 10)),

      actor: String(evt.actor || 'Терминал'),
      incId: String(evt.incId || ''),
      block: String(evt.block || ''),
      read: false
    };
    // Защита от дублирования одинаковых уведомлений подряд
    const dup = db.liveNotifications.find((n) => n && n.date === item.date && n.title === item.title && n.text === item.text && (item.ts - (n.ts || 0) < 60000));
    if (dup) return dup;
    db.liveNotifications.unshift(item);
    if (db.liveNotifications.length > 60) db.liveNotifications.length = 60;

    // Мгновенная отправка в Telegram (сервер Apps Script или офлайн-очередь)
    try {
      if (window.coffeeTelegram && evt.telegramText) {
        window.coffeeTelegram._sendViaServer(item.type, evt.telegramText, { notificationId: item.id });

    try {
      if (window.coffeeBus && typeof window.coffeeBus.emit === 'function') {
        window.coffeeBus.emit('live_notification', item);
      }
    } catch (_) {}

    return item;
  },
  getUnreadCount(dbOpt) {
    const db = dbOpt || (typeof getUDB === 'function' ? getUDB() : {});

        ];

      }
    },

        }

      fn() {

      }

      name: '14. Безопасность: создание и криптографическая проверка подписанного sessionToken',
      fn() {
        window.coffeeRateLimiter.reset('owner_admin');

        const cleanObj = window.sanitizeRecord({ title: '<' + 'script>evil()<' + '/script>Промыть холдер', comment: 'javascript:evil(1)' });
        assert(cleanObj.title === 'Промыть холдер' && cleanObj.comment.indexOf('javascript:') === -1, 'sanitizeRecord должен вырезать script и javascript: URI');
      }

    {
      name: '16. Надёжность IndexedDB: выгрузка тяжёлых base64-фото из localStorage в ссылки idb://photo/',

        const hydrated = window.CoffeeIDB.hydratePhotosInDB(offloaded);
        assert(hydrated.incidents[0].photo === fakePhoto, 'При чтении ссылка idb://photo/ должна мгновенно разворачиваться обратно в фото');
      }
    },
    {
      name: '17. Схема «Карты добрых дел»: поддержка циклических задач (раз в 2 недели / раз в 4 недели)',
      fn() {
        const deeds = window.COFFEE_DEFAULT_GOOD_DEEDS || [];
        assert(deeds.length >= 4, 'Карта добрых дел должна содержать базовые периодические задачи');
        const biweekly = deeds.find((d) => /2 нед/i.test(d.frequency));

        assert(biweekly && /холодильник/i.test(biweekly.title), 'Задача разморозки холодильника раз в 2 недели во вторник');
        assert(fourWeeks && /водоумягчител/i.test(fourWeeks.title), 'Задача регенерации водоумягчителя солью раз в 4 недели');
      }
    },
    {
      name: '18. Честная финансовая модель (COGS по ТТК + ФОТ смен + Расходы + CAC без подмены 35%)',
      fn() {
        const db = {
          settings: [{ id: 'SHIFT_BASE_PAY', value: '250' }, { id: 'SHIFT_BONUS_PCT', value: '5' }],
          cash: [{ date: '2026-11-10', cash: 1400, card: 1000, checks: 80, writeoff: 2, shifts: [{ name: 'Соня' }] }],
          expenses: [{ id: 'e1', date: '2026-11-10', category: 'Реклама', amount: 160 }]
        };
        const fin = window.coffeeCalculateFinancialModel(db, '2026-11-01', '2026-11-30');

        assert(fin.cogs > 0 && fin.effectivePayroll === 370 && fin.cac === 2, 'Должны точно считаться COGS по ТТК, ФОТ (250 + 5% от 2400 = 370) и CAC (160 / 80 = 2 руб.)');
      }
    },
    {
      name: '19. Проверка отсутствия переопределений функций (единая версия coffeeGetBlockWindow)',
      fn() {
        assert(typeof window.coffeeGetBlockWindow === 'function', 'coffeeGetBlockWindow должна быть функцией');
        assert(typeof window.coffeeEnforceOverdueChecklists === 'function', 'coffeeEnforceOverdueChecklists должна быть функцией');
        assert(typeof window.coffeeEvaluateRedFlags === 'function', 'coffeeEvaluateRedFlags должна быть функцией');
      }
    }
  ];

  function runAll() {
    const results = [];
    let passed = 0;
    let failed = 0;
    tests.forEach((t) => {
      try {
        t.fn();
        passed++;
        results.push({ name: t.name, ok: true });
      } catch (err) {
        failed++;
        results.push({ name: t.name, ok: false, error: String((err && err.message) || err) });
      }
    });
    return { total: tests.length, passed, failed, results };
  }

  root.CoffeeTestSuite = { runAll, tests };

  if (typeof module !== 'undefined' && require.main === module) {
    const summary = runAll();
    summary.results.forEach((r) => {
      console.log((r.ok ? '  [PASS] ' : '  [FAIL] ') + r.name + (r.error ? ' -> ' + r.error : ''));
    });
    console.log('\nИТОГО АВТОТЕСТОВ: ' + summary.passed + '/' + summary.total + ' успешно.');
    process.exit(summary.failed > 0 ? 1 : 0);
  }
})(typeof window !== 'undefined' ? window : global);

});

<script>/* js/page-owner.js */
/* =========================================================================
   ЕДИНОЕ ПРИЛОЖЕНИЕ ВЛАДЕЛЬЦА И АДМИНИСТРАТОРА (ДАШБОРД + ОТЧЁТЫ + УПРАВЛЕНИЕ)
   Бесшовное переключение в одном окне без перезагрузки страницы и без диалогов!
   Любое изменение в «Управлении» в ту же миллисекунду отражается на Дашборде,
   в Отчётах и в Мобильном Терминале бариста.
   ========================================================================= */
let ownerTopSection = ['dashboard', 'report', 'admin'].includes(window.OWNER_START_SECTION) ? window.OWNER_START_SECTION : 'dashboard'; // 'dashboard' | 'report' | 'admin'
let ownerDashDate = window._isoToday ? window._isoToday() : new Date().toISOString().slice(0, 10);
try { const qd = new URLSearchParams(location.search).get('date'); if (/^\d{4}-\d{2}-\d{2}$/.test(qd || '')) ownerDashDate = qd; } catch (_) {}
let ownerDashFrom = ownerDashDate;
let ownerDashTo = ownerDashDate;
let ownerDashPeriodMode = 'today'; // 'today' | 'yest' | '7' | 'range'
let ownerRepFrom = window._shiftIso ? window._shiftIso(ownerDashDate, -6) : ownerDashDate;
let ownerRepTo = ownerDashDate;
let ownerSimAvg = 5, ownerSimChk = 10, ownerSimWo = 30;


/* ---------- ВХОД ПО PIN-КОДУ НА СТАРТЕ ПАНЕЛИ ВЛАДЕЛЬЦА И УПРАВЛЕНИЯ (СТАРТОВЫЙ PIN: 1234) ---------- */
function ensureOwnerPinGate(forceShow) {
  if (typeof document === 'undefined') return true;
  if (!forceShow && window.COFFEE_ACTIVE_SYSTEM_MODE === 'terminal') {
    const existing = document.getElementById('ownerPinGateModal');
    if (existing) existing.remove();
    return true;
  }
  if (!forceShow && window.coffeeAuth && window.coffeeAuth.isAuthorized('admin')) {
    const existing = document.getElementById('ownerPinGateModal');
    if (existing) existing.remove();
    return true;
  }
  let modal = document.getElementById('ownerPinGateModal');
  if (!modal) {
    modal = document.createElement('div');
    modal.id = 'ownerPinGateModal';
    modal.className = 'ntf-modal';
    modal.style.zIndex = '9999';
    document.body.appendChild(modal);
  }

  modal.innerHTML =
    '<div class="ntf-card" style="max-width:340px;width:90vw;padding:24px 20px;text-align:center">' +
      '<h3 style="margin:0 0 4px;font-size:18px">Панель владельца</h3>' +
      '<p class="mu" style="margin:0 0 14px;font-size:13px">Введите код доступа владельца</p>' +
      '<form id="ownerPinGateForm">' +
        '<input type="password" id="ownerPinGateInp" inputmode="numeric" autocomplete="off" placeholder="PIN (1234)" style="width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 14px;font-size:18px;font-weight:700;text-align:center;letter-spacing:4px;color:var(--ink)">' +
        '<div id="ownerPinGateErr" style="color:var(--bad);font-size:12.5px;min-height:18px;margin:6px 0"></div>' +
        '<button type="submit" class="p" style="width:100%;min-height:44px;font-size:15px;cursor:pointer">Войти</button>' +
      '</form>' +
    '</div>';

  const inp = document.getElementById('ownerPinGateInp');
  const form = document.getElementById('ownerPinGateForm');
  const errBox = document.getElementById('ownerPinGateErr');
  setTimeout(() => { if (inp) inp.focus(); }, 40);

  if (form) {
    form.onsubmit = async (ev) => {
      ev.preventDefault();
      const pinVal = (inp && inp.value ? inp.value.trim() : '');
      if (!pinVal) {
        if (errBox) errBox.textContent = 'Введите PIN-код';
        return;
      }
      const rl = window.coffeeRateLimiter ? window.coffeeRateLimiter.check('owner_admin') : { locked: false };
      if (rl.locked) {
        if (errBox) errBox.textContent = rl.message;
        return;
      }
      const okOwner = window.coffeeAuth && window.coffeeAuth.verifyOwnerPin ? window.coffeeAuth.verifyOwnerPin(pinVal) : (pinVal === '1234');
      if (!okOwner) {
        const st = window.coffeeRateLimiter ? window.coffeeRateLimiter.check('owner_admin') : { remainingAttempts: 4 };
        if (errBox) {
          errBox.textContent = st.locked
            ? st.message
            : ('Неверный код. Осталось попыток: ' + (st.remainingAttempts ?? 4));
        }
        return;
      }
      if (window.coffeeRateLimiter) window.coffeeRateLimiter.reset('owner_admin');
      const expHash = window.coffeeAuth && window.coffeeAuth.getExpectedOwnerPinHash ? window.coffeeAuth.getExpectedOwnerPinHash() : pinVal;
      if (window.coffeeAuth && window.coffeeAuth.createLocalSession) {
        window.coffeeAuth.createLocalSession('admin', 'Владелец', expHash);
      }
      const m = document.getElementById('ownerPinGateModal');
      if (m) m.remove();
      switchOwnerTopSection(ownerTopSection);
    };
  }
  return false;
}
window.ensureOwnerPinGate = ensureOwnerPinGate;

function switchOwnerTopSection(sec, focusDateOpt) {
  ownerTopSection = sec || 'dashboard';
  if (focusDateOpt) {
    ownerDashDate = focusDateOpt;
    ownerDashFrom = focusDateOpt;
    ownerDashTo = focusDateOpt;
    ownerDashPeriodMode = 'range';
  }
  document.querySelectorAll('#ownerMainNav button[data-osec]').forEach((b) => {
    b.classList.toggle('on', b.dataset.osec === ownerTopSection);
  });
  $('ownerSecDashboard').hidden = ownerTopSection !== 'dashboard';
  $('ownerSecReport').hidden = ownerTopSection !== 'report';
  $('content').hidden = ownerTopSection !== 'admin';
  if (ownerTopSection === 'dashboard') renderOwnerDashboardSection();
  if (ownerTopSection === 'report') renderOwnerReportSection();
  if (ownerTopSection === 'admin') load();
}

function renderOwnerNotificationsDrawer() {
  const db = getUDB();
  const list = Array.isArray(db.liveNotifications) ? db.liveNotifications : [];
  const unread = list.filter((n) => n && !n.read).length;

    $('ownerNotifCount').textContent = unread > 0 ? String(unread) : '0';

  }

  box.innerHTML =
    '<div class="top" style="margin-bottom:8px">' +
      '<div><h2 style="margin:0">🔔 Мгновенные уведомления (' + list.length + ')</h2></div>' +
      '<div style="display:flex;gap:6px">' +
        '<button type="button" class="b ok" id="ownerNotifReadAllBtn">✓ Прочитано</button>' +
        '<button type="button" class="b" id="ownerNotifCloseBtn">✕</button>' +
      '</div>' +
    '</div>' +
    (list.length ? list.slice(0, 15).map((n) => {
      const col = n.level === 'critical' ? 'var(--bad)' : (n.level === 'warn' ? 'var(--warn)' : 'var(--good)');
      const mediaCnt = ntfCollect(n, db).media.length;
      return '<div class="row ntf-row" data-ntf-id="' + esc(n.id) + '" tabindex="0" role="button" title="Открыть фото и комментарии" style="grid-template-columns:1fr auto;border-left:4px solid ' + col + ';padding-left:10px;cursor:pointer">' +
        '<div><b>' + esc(n.title) + '</b> <span class="mu">(' + dmy(n.date) + ' ' + esc(n.time) + ' · ' + esc(n.actor) + ')</span>' +
        '<div class="mu" style="margin-top:2px">' + esc(n.text) + '</div>' +
        '<div class="mu" style="margin-top:3px;font-size:12px">' + (mediaCnt ? '📷 ' + mediaCnt + ' · ' : '') + 'Нажмите, чтобы открыть ›</div></div>' +
        '<span class="tag ' + (n.level === 'critical' ? 'no' : (n.level === 'ok' ? 'ok' : '')) + '">' + (n.read ? 'Прочитано' : 'Новое') + '</span>' +
      '</div>';
    }).join('') : '<p class="mu" style="margin:0">Новых уведомлений нет.</p>');
}

/* ---------- Уведомление → сразу фото/видео и комментарии баристы ---------- */
function ntfPhotoSrc(u) {
  try { return String((window.CoffeeIDB ? window.CoffeeIDB.getPhotoSync(u) : u) || '').trim(); } catch (_) { return String(u || '').trim(); }
}
function ntfCollect(n, db) {
  const res = { media: [], comments: [], inc: null };
  if (!n || !db) return res;
  const seen = {};
  const addMedia = (url, label, comment) => {
    const u = ntfPhotoSrc(url);
    if (!u || seen[u]) return;
    seen[u] = 1;
    res.media.push({ url: u, label: label || '', comment: comment || '' });
  };
  const incs = Array.isArray(db.incidents) ? db.incidents : [];
  const txt = String(n.text || '');
  let inc = null;
  const idRef = n.incId || ((txt.match(/INC-[A-Z0-9_-]+/) || [])[0] || '');
  if (idRef) inc = incs.find((x) => x && x.id === idRef) || null;
  if (!inc && n.type === 'incident') {
    inc = incs.find((x) => x && x.date === n.date && x.who === n.actor && x.text && txt.indexOf(x.text) === 0) || null;
  }
  if (inc) {
    res.inc = inc;
    const list = (Array.isArray(inc.photos) && inc.photos.length ? inc.photos : (inc.photo ? [inc.photo] : []));
    list.forEach((u, i) => addMedia(u, (inc.step || 'Поломка') + (list.length > 1 ? ' · кадр ' + (i + 1) : ''), ''));
    if (inc.text) res.comments.push({ who: inc.who || n.actor, time: (inc.time || ''), label: inc.step || inc.incType || 'Комментарий', text: inc.text, meta: [inc.priority, inc.status].filter(Boolean).join(' · ') });
  }
  if (n.type === 'checklist' || n.type === 'overdue') {
    const blk = n.block || ((String(n.title || '').match(/«(.+?)»/) || [])[1] || '');
    if (blk) {
      const chks = (db.checklists || []).filter((c) => c && c.date === n.date && c.block === blk);
      const chk = chks.find((c) => c.who === n.actor) || chks[chks.length - 1];
      if (chk && Array.isArray(chk.photos)) {
        chk.photos.forEach((p) => {
          if (!p) return;
          addMedia(p.url, p.step, p.comment);
          if (p.comment) res.comments.push({ who: chk.who || n.actor, time: p.completedAt || '', label: p.step || 'Пункт чек-листа', text: p.comment, meta: p.isIncident ? 'Проблема' : '' });
        });
      }
      incs.filter((x) => x && x.date === n.date && x.block === blk && x !== inc).forEach((x) => {
        const list = (Array.isArray(x.photos) && x.photos.length ? x.photos : (x.photo ? [x.photo] : []));
        list.forEach((u, i) => addMedia(u, (x.step || 'Проблема') + (list.length > 1 ? ' · кадр ' + (i + 1) : ''), x.text));
        if (x.text && !x.isOverdueAuto) res.comments.push({ who: x.who || n.actor, time: x.time || '', label: x.step || 'Проблема', text: x.text, meta: [x.priority, x.status].filter(Boolean).join(' · ') });
      });
    }
  }
  return res;
}
function ntfMediaBigHtml(m) {
  if (!m) return '<div class="ntf-empty">📷 К этому уведомлению фото или видео не приложено</div>';
  const u = esc(m.url);
  if (/^data:video\/|\.(mp4|webm|mov)(\?|$)/i.test(m.url)) return '<video src="' + u + '" controls autoplay muted playsinline class="ntf-big"></video>';
  return '<a href="' + u + '" target="_blank" rel="noopener"><img src="' + u + '" alt="' + esc(m.label || 'Фото') + '" class="ntf-big"></a>';
}
function closeNtfModal() {
  const m = $('ownerNtfModal');
  if (m) m.remove();
  document.removeEventListener('keydown', ntfEsc, true);
}
function ntfEsc(e) { if (e.key === 'Escape') { e.preventDefault(); closeNtfModal(); } }
function openNtfModal(id) {
  const db = getUDB();
  const n = (db.liveNotifications || []).find((x) => x && x.id === id);
  if (!n) return;
  closeNtfModal();
  const data = ntfCollect(n, db);
  const thumbs = data.media.length > 1
    ? '<div class="ntf-thumbs">' + data.media.map((m, i) => {
        const isVid = /^data:video\/|\.(mp4|webm|mov)(\?|$)/i.test(m.url);
        return '<button type="button" class="ntf-th' + (i === 0 ? ' on' : '') + '" data-ntf-th="' + i + '">' +
          (isVid ? '<span>▶</span>' : '<img src="' + esc(m.url) + '" alt="">') + '</button>';
      }).join('') + '</div>'
    : '';
  const comments = data.comments.length
    ? data.comments.map((c) =>
        '<div class="ntf-cm"><div class="ntf-cm-h"><b>' + esc(c.who) + '</b>' + (c.time ? ' <span class="mu">· ' + esc(c.time) + '</span>' : '') +
        (c.label ? ' <span class="mu">· ' + esc(c.label) + '</span>' : '') + '</div>' +
        '<div class="ntf-cm-t">' + esc(c.text) + '</div>' +
        (c.meta ? '<div class="mu" style="font-size:12px;margin-top:2px">' + esc(c.meta) + '</div>' : '') + '</div>').join('')
    : '<div class="ntf-cm"><div class="ntf-cm-t">' + esc(n.text || 'Подробностей нет.') + '</div></div>';
  const wrap = document.createElement('div');
  wrap.id = 'ownerNtfModal';
  wrap.className = 'ntf-modal';
  wrap.innerHTML =
    '<div class="ntf-card" role="dialog" aria-modal="true" aria-label="Уведомление">' +
      '<div class="ntf-head"><div><b>' + esc(n.title) + '</b><div class="mu" style="font-size:12.5px">' + dmy(n.date) + ' ' + esc(n.time) + ' · ' + esc(n.actor) + (data.inc ? ' · ' + esc(data.inc.id) : '') + '</div></div>' +
      '<button type="button" class="b" id="ntfCloseBtn">✕</button></div>' +
      (data.media.length ? '<div class="ntf-media" id="ntfMediaBox">' + ntfMediaBigHtml(data.media[0]) + '</div>' + thumbs : '') +
      '<div class="ntf-sec">' + (data.media.length ? '💬 Комментарий баристы' : 'ℹ️ Что произошло') + '</div>' + comments +
    '</div>';
  document.body.appendChild(wrap);
  document.addEventListener('keydown', ntfEsc, true);
  try { $('ntfCloseBtn').focus(); } catch (_) {}
  wrap.addEventListener('click', (e) => {
    if (e.target === wrap || e.target.id === 'ntfCloseBtn') { closeNtfModal(); return; }
    const th = e.target.closest('[data-ntf-th]');
    if (th) {
      const i = Number(th.dataset.ntfTh);
      const box = $('ntfMediaBox'); if (box) box.innerHTML = ntfMediaBigHtml(data.media[i]);
      wrap.querySelectorAll('.ntf-th').forEach((b) => b.classList.toggle('on', b === th));
    }
  });
  // открытое уведомление считается прочитанным
  if (!n.read) {
    n.read = true;
    try { saveUDB(db); if (window.coffeeBus) window.coffeeBus.emit('mutation', { action: 'notifications_read' }); } catch (_) {}
    renderOwnerNotificationsDrawer();
  }
}
document.addEventListener('click', (e) => {
  const row = e.target && e.target.closest && e.target.closest('[data-ntf-id]');
  if (row) openNtfModal(row.getAttribute('data-ntf-id'));
});
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const row = e.target && e.target.closest && e.target.closest('[data-ntf-id]');
  if (row) { e.preventDefault(); openNtfModal(row.getAttribute('data-ntf-id')); }
});

/* =========================================================================
   1. ДАШБОРД — ТОЛЬКО КРАТКАЯ ИНФОРМАЦИЯ («ВСЁ ЛИ В ПОРЯДКЕ?»)
      За Сегодня, Вчера или выбранный промежуток дат
   ========================================================================= */
function renderOwnerDashboardSection() {
  const db = getUDB();
  if (window.coffeeEnsureV19Schema) window.coffeeEnsureV19Schema(db);
  if ($('sub') && db.location) $('sub').textContent = 'Панель управления · ' + db.location;

  const isSingleDay = ownerDashFrom === ownerDashTo;
  const periodLabel = isSingleDay
    ? (dmy(ownerDashFrom) + (ownerDashFrom === _isoToday() ? ' (Сегодня)' : (ownerDashFrom === _shiftIso(_isoToday(), -1) ? ' (Вчера)' : '')))
    : (dmy(ownerDashFrom) + ' — ' + dmy(ownerDashTo));

  const fin = window.coffeeCalculateFinancialModel ? window.coffeeCalculateFinancialModel(db, ownerDashFrom, ownerDashTo) : { revenue: 0, checksTotal: 0, avgCheck: 0, writeoffsTotal: 0, netProfit: 0 };
  let planRev = 0, planChk = 0, planAvgSum = 0, daysCnt = 0;
  let curD = ownerDashFrom;
  while (curD <= ownerDashTo && daysCnt < 366) {
    const dp = window.coffeeGetDayPlan ? window.coffeeGetDayPlan(curD, db) : { revenue: Number(db.plan) || 2200, checks: 75, avgCheck: 35 };
    planRev += dp.revenue;
    planChk += dp.checks;
    planAvgSum += dp.avgCheck;
    daysCnt++;
    curD = _shiftIso(curD, 1);
  }
  planRev = Math.max(1, planRev);
  planChk = Math.max(1, planChk);
  const planAvg = Math.max(1, Math.round(planAvgSum / Math.max(1, daysCnt)));
  const woNormTotal = (Math.max(0, Number(db.woNorm) || 15)) * Math.max(1, daysCnt);

  const factRev = fin.revenue || 0;
  const factChk = fin.checksTotal || 0;
  const factAvg = fin.avgCheck || 0;
  const factWo = fin.writeoffsTotal || 0;
  const rPct = Math.round((factRev / planRev) * 100);
  const cPct = Math.round((factChk / planChk) * 100);

  const periodChecklists = (db.checklists || []).filter((c) => c && c.date >= ownerDashFrom && c.date <= ownerDashTo);
  const lateChecklists = periodChecklists.filter((c) => c.isLate || c.status === 'Просрочено');
  const openIncs = (db.incidents || []).filter((i) => i && window.coffeeIsIncActive(i.status));
  const flags = window.coffeeEvaluateRedFlags ? window.coffeeEvaluateRedFlags(ownerDashTo, db) : [];
  const redFlagsOnly = flags.filter((f) => f.level === 'red');
  const cBlocks = window.coffeeGetChecklistBlocks ? window.coffeeGetChecklistBlocks(db) : [];
  const overdueBlocksNow = cBlocks.filter((bObj) => {
    const w = window.coffeeGetBlockWindow ? window.coffeeGetBlockWindow(bObj.name, db) : { state: 'open' };
    return w.state === 'overdue_closed';
  });

  let statusLevel = 'ok';
  let statusTitle = '🟢 Всё в порядке — точка работает штатно';
  let statusSub = 'За выбранный период (' + periodLabel + ') критических отклонений, красных флагов и незакрытых поломок нет.';
  if (redFlagsOnly.length > 0 || openIncs.some((i) => i.priority === 'Критично') || overdueBlocksNow.length > 0) {
    statusLevel = 'bad';
    statusTitle = '🔴 Внимание: есть отклонения, требующие реакции';
    const reasons = [];
    if (redFlagsOnly.length) reasons.push('Красных флагов: ' + redFlagsOnly.length);
    if (openIncs.length) reasons.push('Активных поломок: ' + openIncs.length);
    if (overdueBlocksNow.length) reasons.push('Просрочено чек-листов: ' + overdueBlocksNow.length);
    statusSub = reasons.join(' · ');
  } else if (openIncs.length > 0 || lateChecklists.length > 0 || (factRev > 0 && rPct < 85) || factWo > woNormTotal) {
    statusLevel = 'warn';
    statusTitle = '🟡 Работает стабильно, есть небольшие замечания';
    const reasons = [];
    if (factRev > 0 && rPct < 85) reasons.push('Выручка ' + rPct + '% от плана');
    if (openIncs.length) reasons.push('Задач в работе: ' + openIncs.length);
    if (lateChecklists.length) reasons.push('Опозданий по чек-листам: ' + lateChecklists.length);
    if (factWo > woNormTotal) reasons.push('Списания выше нормы');
    statusSub = reasons.join(' · ');
  }

  const stCol = statusLevel === 'ok' ? 'var(--good)' : (statusLevel === 'warn' ? 'var(--warn)' : 'var(--bad)');
  const hasUrgentItems = redFlagsOnly.length > 0 || openIncs.length > 0 || overdueBlocksNow.length > 0;

  $('ownerSecDashboard').innerHTML =
    '<div class="card">' +
      '<div class="top" style="margin-bottom:14px">' +

      role: stProfile.role || 'Бариста',

      cash: sFin.cash,
      card: sFin.card,
      revenue: sFin.revenue,

document.addEventListener('click', (e) => {
  if (e.target && e.target.closest('#ownerNotifBtn')) {
    const dr = $('ownerNotifDrawer');
    if (dr) {
      dr.hidden = !dr.hidden;
      renderOwnerNotificationsDrawer();
    }
    return;
  }
  if (e.target && e.target.id === 'ownerNotifReadAllBtn') {
    if (window.coffeeNotify) window.coffeeNotify.markAllRead();
    renderOwnerNotificationsDrawer();
    toast('✓ Все уведомления отмечены прочитанными');
    return;
  }
  if (e.target && e.target.id === 'ownerNotifCloseBtn') {
    if ($('ownerNotifDrawer')) $('ownerNotifDrawer').hidden = true;
    return;
  }
  const secBtn = e.target.closest('#ownerMainNav button[data-osec]');
  if (secBtn) {
    switchOwnerTopSection(secBtn.dataset.osec);
    return;
  }
  const odpBtn = e.target.closest('[data-odp]');
  if (odpBtn) {
    const m = odpBtn.dataset.odp;
    const t = _isoToday();
    ownerDashPeriodMode = m;
    if (m === 'today') { ownerDashFrom = t; ownerDashTo = t; ownerDashDate = t; }
    else if (m === 'yest') { const y = _shiftIso(t, -1); ownerDashFrom = y; ownerDashTo = y; ownerDashDate = y; }
    else if (m === '7') { ownerDashFrom = _shiftIso(t, -6); ownerDashTo = t; ownerDashDate = t; }
    else if (m === '30') { ownerDashFrom = _shiftIso(t, -29); ownerDashTo = t; ownerDashDate = t; }
    renderOwnerDashboardSection();
    return;
  }
  if (e.target && e.target.id === 'oDashApplyRangeBtn') {
    let a = $('oDashFrom') ? $('oDashFrom').value : ownerDashFrom;
    let b = $('oDashTo') ? $('oDashTo').value : ownerDashTo;
    if (a && b && a > b) { const tmp = a; a = b; b = tmp; }
    ownerDashFrom = a || _isoToday();
    ownerDashTo = b || ownerDashFrom;
    ownerDashDate = ownerDashTo;
    ownerDashPeriodMode = 'range';
    renderOwnerDashboardSection();
    return;
  }
  if (e.target && e.target.id === 'oDashGoFullReportBtn') {
    ownerRepFrom = ownerDashFrom;
    ownerRepTo = ownerDashTo;
    switchOwnerTopSection('report');
    return;
  }
  const jumpDash = e.target.closest('[data-jumpdash]');
  if (jumpDash) {
    e.preventDefault();
    switchOwnerTopSection('dashboard', jumpDash.dataset.jumpdash);
    return;
  }
  const jumpAdm = e.target.closest('[data-jumpadm]');
  if (jumpAdm) {
    tab = jumpAdm.dataset.jumpadm || 'checklists';
    switchOwnerTopSection('admin');
    return;
  }
  const dashUnlock = e.target.closest('[data-dashunlock]');
  if (dashUnlock) {
    const blk = dashUnlock.dataset.dashunlock;
    call('extend_deadline', { block: blk, openFrom: '00:00', until: '23:59', reason: 'Открыто с Дашборда владельца' }).then(() => {
      toast('🔓 Доступ к чек-листу «' + blk + '» открыт в Терминале до конца дня!');
      renderOwnerDashboardSection();
    });
    return;
  }
  const dashRes = e.target.closest('[data-dashresolve]');
  if (dashRes) {
    const incId = dashRes.dataset.dashresolve;
    call('update_incident', { id: incId, status: 'Решена', statusNote: 'Отмечено решённым с Дашборда' }).then(() => {
      toast('✓ Поломка отмечена решённой');
      renderOwnerDashboardSection();
    });
    return;
  }
  const orpBtn = e.target.closest('[data-orp]');
  if (orpBtn) {
    const p = orpBtn.dataset.orp;
    const t = _isoToday();
    ownerRepTo = p === 'yest' ? _shiftIso(t, -1) : t;
    if (p === 'today') ownerRepFrom = t;
    else if (p === 'yest') ownerRepFrom = _shiftIso(t, -1);
    else if (p === '7') ownerRepFrom = _shiftIso(t, -6);
    else if (p === '30') ownerRepFrom = _shiftIso(t, -29);
    else if (p === 'month') ownerRepFrom = t.slice(0, 8) + '01';
    renderOwnerReportSection();
    return;
  }
  if (e.target && e.target.id === 'oRepCsvBtn') {
    const fin = window.coffeeCalculateFinancialModel ? window.coffeeCalculateFinancialModel( getUDB(), ownerRepFrom, ownerRepTo ) : { dayByDayPnL: [] };
    const q = (v) => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
    const lines = [['Дата', 'День', 'Бариста', 'Смен', 'Счётчик (пролито)', 'Наличные', 'Безнал', 'Выручка', 'Z-отчёт', 'План', '% Плана', 'Чеков', 'Средний чек', 'COGS (ТТК)', 'ФОТ', 'OpEx', 'Списания', 'Чистая прибыль'].map(q).join(';')]
      .concat((fin.dayByDayPnL || []).map((x) => [x.date, x.dayCode, x.barista, x.shiftsCount, x.counterDelta, x.cash, x.card, x.revenue, x.zTotal, x.plan, x.planPct + '%', x.checks, x.avgCheck, x.cogs, x.payroll, x.opex, x.writeoff, x.netProfit].map(q).join(';')));
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['\uFEFF' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' }));
    a.download = 'полный_отчет_кофейня_' + ownerRepFrom + '_' + ownerRepTo + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
    toast('✓ Полный финансовый отчёт скачан в CSV');
    return;
  }
  if (e.target && e.target.id === 'oRepPrintBtn') {
    window.print();
    return;
  }
  if (e.target && e.target.id === 'oRepApplyBtn') {
    if ($('oRepFrom') && $('oRepFrom').value) ownerRepFrom = $('oRepFrom').value;
    if ($('oRepTo') && $('oRepTo').value) ownerRepTo = $('oRepTo').value;
    if (ownerRepFrom > ownerRepTo) { const tmp = ownerRepFrom; ownerRepFrom = ownerRepTo; ownerRepTo = tmp; }
    renderOwnerReportSection();
    return;
  }
});

document.addEventListener('input', (e) => {
  if (e.target && (e.target.id === 'oSimAvg' || e.target.id === 'oSimChk' || e.target.id === 'oSimWo')) {
    ownerSimAvg = Number($('oSimAvg') ? $('oSimAvg').value : ownerSimAvg);
    ownerSimChk = Number($('oSimChk') ? $('oSimChk').value : ownerSimChk);
    ownerSimWo = Number($('oSimWo') ? $('oSimWo').value : ownerSimWo);
    renderOwnerReportSection();
  }
});

setTimeout(() => {
  const notifBtn = document.getElementById('ownerNotifBtn');
  if (notifBtn && !document.getElementById('ownerPinLockBtn')) {
    const lockBtn = document.createElement('button');
    lockBtn.type = 'button';
    lockBtn.id = 'ownerPinLockBtn';
    lockBtn.className = 'theme-btn';
    lockBtn.style.cssText = 'width:40px;height:40px;font-size:16px;display:inline-flex;align-items:center;justify-content:center';
    lockBtn.textContent = '🔒';
    lockBtn.title = 'Выйти / Заблокировать панель владельца';
    lockBtn.onclick = () => {
      if (window.coffeeAuth) window.coffeeAuth.logout();
      ensureOwnerPinGate(true);
    };
    notifBtn.parentNode.insertBefore(lockBtn, notifBtn);
  }
  renderOwnerNotificationsDrawer();
  switchOwnerTopSection(ownerTopSection);
  if (window.COFFEE_ACTIVE_SYSTEM_MODE !== 'terminal') {
    ensureOwnerPinGate(false);
  }
}, 30);
if (window.coffeeBus) {
  window.coffeeBus.on((msg) => {
    renderOwnerNotificationsDrawer();
    if (msg && msg.type === 'live_notification' && msg.payload) {
      toast('🔔 ' + (msg.payload.title || 'Новое уведомление'));
    }
    if (msg && (msg.type === 'mutation' || msg.type === 'server_sync')) {
      if (msg.type === 'server_sync' && document.querySelector('dialog[open]')) return; /* не мешаем редактированию */
      if (ownerTopSection === 'dashboard') renderOwnerDashboardSection();
      if (ownerTopSection === 'report') renderOwnerReportSection();
      if (ownerTopSection === 'admin') load();
    }
  });
}


/* === ЕДИНАЯ СИСТЕМА: МГНОВЕННОЕ ПЕРЕКЛЮЧЕНИЕ ПАНЕЛЬ ВЛАДЕЛЬЦА <-> ТЕРМИНАЛ БАРИСТА (0 МС) === */
window.coffeeSwitchAppMode = function (targetMode, sectionOpt) {
  const mode = targetMode === 'terminal' ? 'terminal' : 'owner';
  window.COFFEE_ACTIVE_SYSTEM_MODE = mode;
  const termRoot = document.getElementById('unifiedTerminalRoot');
  const ownerRoot = document.getElementById('unifiedOwnerRoot');
  if (mode === 'terminal') {
    if (ownerRoot) ownerRoot.hidden = true;
    if (termRoot) termRoot.hidden = false;
    const ownerGate = document.getElementById('ownerPinGateModal');
    if (ownerGate) ownerGate.remove();
    if (typeof window.reloadTerminalFromVault === 'function') {
      window.reloadTerminalFromVault();
    }
    if (typeof window.ensureTerminalPinGate === 'function') {
      window.ensureTerminalPinGate();
    }
  } else {
    if (termRoot) termRoot.hidden = true;
    if (ownerRoot) ownerRoot.hidden = false;
    const staffDlg = document.getElementById('staffPinDlg');
    if (staffDlg) {
      try { if (staffDlg.open && typeof staffDlg.close === 'function') staffDlg.close(); staffDlg.removeAttribute('open'); } catch (_) {}
    }
    if (sectionOpt) ownerTopSection = sectionOpt;
    renderOwnerNotificationsDrawer();
    switchOwnerTopSection(ownerTopSection);
    ensureOwnerPinGate(false);
  }
  if (window.coffeeRenderNetBadge) window.coffeeRenderNetBadge(0);
};

window.addEventListener('storage', (e) => {
  if (!e.key || /coffee_/.test(e.key)) {
    renderOwnerNotificationsDrawer();
    if (ownerTopSection === 'dashboard') renderOwnerDashboardSection();
    if (ownerTopSection === 'report') renderOwnerReportSection();
    if (ownerTopSection === 'admin') load();
  }
});
window.addEventListener('focus', () => {
  renderOwnerNotificationsDrawer();
  if (ownerTopSection === 'dashboard') renderOwnerDashboardSection();
  if (ownerTopSection === 'report') renderOwnerReportSection();
  if (ownerTopSection === 'admin') load();
});

</script>
<script>/* app.js */
/* Единое ядро авторизации и защиты «Кофейня» (v21 Enterprise Security):
   - Использует подписанные токены сессии (window.coffeeAuth.isAuthorized) вместо флага coffee_admin_ok=1.
   - Защита от перебора PIN-кода: блокировка на 15 минут после 5 неверных попыток (window.coffeeRateLimiter).
   - Персональные и административные PIN-коды проверяются через солёный SHA-256 хеш и серверный auth_login. */
(function () {
  'use strict';
  const SHARED_DATE = 'coffee_shared_date';
  const page = (location.pathname.split('/').pop() || 'index.html').replace('.html', '') || 'index';
  const ls = {
    get(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    del(k) { try { localStorage.removeItem(k); } catch (e) {} }
  };

  // Строгая проверка криптографической сессии (подстановка coffee_admin_ok=1 в консоли не работает!)
  const isAdmin = () => !!(window.coffeeAuth && window.coffeeAuth.isAuthorized('admin'));

  window.coffeeConfirm = function (message, onConfirm) {
    let dlg = document.getElementById('coffeeConfirmDlg');
    if (!dlg) {
      dlg = document.createElement('dialog');
      dlg.id = 'coffeeConfirmDlg';
      dlg.style.cssText = 'border:1px solid var(--line,#d3dde0);border-radius:22px;background:var(--surface,#fff);color:var(--ink,#172326);padding:20px;width:min(420px,92vw);box-shadow:0 30px 60px -20px rgba(0,0,0,.6)';
      dlg.innerHTML = '<h3 style="margin:0 0 8px;font-family:var(--font-d,sans-serif)">Подтверждение</h3><p id="ccMsg" style="margin:0 0 16px;color:var(--muted,#5b6d72);font-size:14px"></p><div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" id="ccNo" style="border:1px solid var(--line,#d3dde0);background:var(--bg,#e6ecee);border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer">Отмена</button><button type="button" id="ccYes" style="border:0;background:var(--bad,#c23b22);color:#fff;border-radius:10px;padding:8px 16px;font-weight:700;cursor:pointer">Подтвердить</button></div>';
      document.body.appendChild(dlg);
    }
    dlg.querySelector('#ccMsg').textContent = message;
    dlg.querySelector('#ccNo').onclick = () => dlg.close();
    dlg.querySelector('#ccYes').onclick = () => { dlg.close(); if (onConfirm) onConfirm(); };
    try { if (dlg.open) dlg.close(); if (typeof dlg.showModal === 'function') dlg.showModal(); else dlg.setAttribute('open', 'open'); } catch (_) { dlg.setAttribute('open', 'open'); }
  };

  async function verify(pin) {
    if (!pin || !String(pin).trim()) return 'Введите код доступа';
    if (window.coffeeAuth) {
      const res = await window.coffeeAuth.loginOwner(pin);
      if (res && res.ok) return '';
      return (res && res.error) || 'Неверный код доступа';
    }
    return 'Модуль безопасности не загружен';
  }

  function logout() {
    if (window.coffeeAuth) window.coffeeAuth.logout();
    if (window.coffeeBus) window.coffeeBus.emit('auth', { ok: false });
    location.reload();
  }
  window.coffeeLogout = logout;

  function gate(onOk) {
    document.documentElement.classList.add('gate');
    let g = document.getElementById('gate');
    if (g) return;
    g = document.createElement('div');
    g.id = 'gate';
    g.style.cssText = 'position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg,#12191b)';
    g.innerHTML = '<form style="width:min(380px,100%);background:var(--surface,#1b2528);border:1px solid var(--line,#2c3a3e);border-radius:22px;padding:24px;box-shadow:var(--shadow)"><h2 style="margin:0 0 6px;font-family:var(--font-d)">🔒 Защищённый вход (SHA-256)</h2><p style="margin:0 0 14px;color:var(--muted);font-size:13.5px">Дашборд, отчёты и управление защищены токеном сессии и блокировкой перебора (макс. 5 попыток).</p><input id="gPin" type="password" autocomplete="current-password" placeholder="Код доступа администратора" style="width:100%;height:48px;border-radius:14px;border:1px solid var(--line,#2c3a3e);background:var(--bg);padding:0 14px;font:inherit;color:var(--ink)"><div id="gErr" style="color:var(--bad,#c23b22);font-size:13.5px;min-height:20px;margin:8px 0;font-weight:600" role="alert"></div><button id="gGo" type="submit" style="width:100%;min-height:50px;border:0;border-radius:14px;background:#5a3a29;color:#f6ece2;font:inherit;font-weight:700;cursor:pointer">Войти в панель управления</button></form>';
    document.body.appendChild(g);
    
    const f = g.querySelector('form'), inp = g.querySelector('#gPin'), errBox = g.querySelector('#gErr');
    if (window.coffeeRateLimiter) {
      const st = window.coffeeRateLimiter.check('owner_admin');
      if (st.locked) errBox.textContent = st.message;
    }
    setTimeout(() => inp.focus(), 50);
    f.onsubmit = async (e) => {
      e.preventDefault();
      const v = inp.value.trim();
      if (!v) return;
      const b = g.querySelector('#gGo');
      b.disabled = true;
      b.textContent = 'Проверяем хеш и сессию…';
      try {
        const err = await verify(v);
        if (err) throw new Error(err);
        if (window.coffeeBus) window.coffeeBus.emit('auth', { ok: true });
        g.remove();
        document.documentElement.classList.remove('gate');
        if (onOk) onOk();
      } catch (x) {
        errBox.textContent = x.message;
        b.disabled = false;
        b.textContent = 'Войти в панель управления';
      }
    };
  }

  function syncNavLinks() {
    const pick = document.getElementById('pick') || document.getElementById('rdPick');
    if (pick && pick.value) ls.set(SHARED_DATE, pick.value);
    const sharedDate = new URLSearchParams(location.search).get('date') || ls.get(SHARED_DATE);
    const openInc = parseInt(ls.get('coffee_meta_open_inc') || '0', 10);

    document.querySelectorAll('nav.tabs a').forEach((a) => {
      const rawHref = a.getAttribute('href'); if (!rawHref) return;
      const href = rawHref.split('?')[0];
      /* Переход между окнами Дашборд, Отчёты, Управление и Терминал без сброса сессии владельца */
      if (sharedDate && href === 'dashboard.html') {
        a.setAttribute('href', href + '?date=' + encodeURIComponent(sharedDate));
      }
      if ((href === 'dashboard.html' || href === 'admin.html') && openInc > 0) {
        if (!a.querySelector('.inc-pill')) {
          const pill = document.createElement('span');
          pill.className = 'inc-pill';
          pill.style.cssText = 'margin-left:5px;padding:1px 6px;border-radius:99px;background:#c23b22;color:#fff;font-size:11px;font-weight:700';
          a.appendChild(pill);
        }
        a.querySelector('.inc-pill').textContent = openInc;
      } else {
        const old = a.querySelector('.inc-pill');
        if (old) old.remove();
      }
    });
  }

  function init() {
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

    if (page === 'index' || page === 'barista' || page === 'barista_terminal') {
      document.documentElement.classList.remove('gate');
      const oldOwnerNav = document.querySelector('.owner-nav');
      if (oldOwnerNav) oldOwnerNav.remove();
      return; /* Терминал бариста полностью отделён от приложения владельца/администратора */
    }

    if (isAdmin()) {
      document.documentElement.classList.remove('gate');
      const t = document.getElementById('theme');
      if (t && !document.getElementById('ownerLogoutBtn')) {
        const x = document.createElement('button');
        x.id = 'ownerLogoutBtn';
        x.className = 'theme-btn';
        x.type = 'button';
        x.textContent = '⎋';
        x.title = 'Выйти и закрыть сессию владельца';
        x.setAttribute('aria-label', 'Выйти');
        x.style.marginLeft = '6px';
        x.onclick = logout;
        t.parentNode.style.display = 'flex';
        t.parentNode.appendChild(x);
      }
      syncNavLinks();
      const pick = document.getElementById('pick') || document.getElementById('rdPick');
      if (pick) pick.addEventListener('change', syncNavLinks);
      setInterval(syncNavLinks, 1500);
    } else {
      gate(() => location.reload());
    }

    if (window.coffeeBus) {
      window.coffeeBus.on((msg) => {
        if (msg.type === 'auth') location.reload();
        const liveSync = msg.type === 'server_sync' && msg.detail && msg.detail.live;
        if ((msg.type === 'mutation' || liveSync) && isAdmin()) {
          /* Не перерисовываем экран под руками у пользователя, пока открыт диалог редактирования */
          if (liveSync && document.querySelector('dialog[open]')) return;
          if (typeof window.load === 'function') {
            try { window.load(true, true); } catch (_) {}
          }
          syncNavLinks();
        }
      });
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

</script>
