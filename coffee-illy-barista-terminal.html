<script>/* =========================================================================
   COFFEE ILLY v4.0 — УПРАВЛЕНИЕ ТЕМОЙ (Auto / Light / Dark)
   Подключается в <head> до основного CSS для предотвращения вспышки темы.
   ========================================================================= */
(function (g) {
  var STORAGE_KEY = 'coffee_illy_theme_v4';
  var LEGACY_KEY = 'coffee_illy_theme';
  var VALID_MODES = { auto: true, light: true, dark: true };

  function getSavedMode() {
    try {
      var v = localStorage.getItem(STORAGE_KEY) || localStorage.getItem(LEGACY_KEY) || 'auto';
      return VALID_MODES[v] ? v : 'auto';
    } catch (_) {
      return 'auto';
    }
  }

  function getSystemDark() {
    try {
      return !!(g.matchMedia && g.matchMedia('(prefers-color-scheme: dark)').matches);
    } catch (_) {
      return false;
    }
  }

  function resolveEffectiveTheme(mode) {
    var m = VALID_MODES[mode] ? mode : getSavedMode();
    if (m === 'auto') return getSystemDark() ? 'dark' : 'light';
    return m;
  }

  function applyTheme(modeOpt) {
    var mode = VALID_MODES[modeOpt] ? modeOpt : getSavedMode();
    var effective = resolveEffectiveTheme(mode);
    if (typeof document !== 'undefined' && document.documentElement) {
      document.documentElement.setAttribute('data-theme', effective);
      document.documentElement.setAttribute('data-theme-mode', mode);
    }
    try {
      var meta = typeof document !== 'undefined' ? document.querySelector('meta[name="theme-color"]') : null;
      if (meta) meta.setAttribute('content', effective === 'dark' ? '#141413' : '#F7F5F0');
    } catch (_) {}
    return effective;
  }

  function setMode(mode) {
    var m = VALID_MODES[mode] ? mode : 'auto';
    try {
      localStorage.setItem(STORAGE_KEY, m);
      localStorage.setItem(LEGACY_KEY, resolveEffectiveTheme(m));
    } catch (_) {}
    return applyTheme(m);
  }

  function cycleMode() {
    var cur = getSavedMode();
    var next = cur === 'auto' ? 'light' : (cur === 'light' ? 'dark' : 'auto');
    setMode(next);
    return next;
  }

  applyTheme(getSavedMode());

  try {
    if (g.matchMedia) {
      var mq = g.matchMedia('(prefers-color-scheme: dark)');
      var onChange = function () {
        if (getSavedMode() === 'auto') applyTheme('auto');
      };
      if (typeof mq.addEventListener === 'function') mq.addEventListener('change', onChange);
      else if (typeof mq.addListener === 'function') mq.addListener(onChange);
    }
  } catch (_) {}


  if (typeof document !== 'undefined') {
    document.addEventListener('click', function (ev) {
      var btn = ev.target && ev.target.closest && ev.target.closest('.theme-btn, #themeToggleBtn');
      if (!btn) return;
      ev.preventDefault();
      ev.stopImmediatePropagation();
      var next = cycleMode();
      var titles = { auto: 'Тема: Авто', light: 'Тема: Светлая', dark: 'Тема: Тёмная' };
      btn.setAttribute('title', titles[next] || 'Тема');
      btn.setAttribute('aria-label', titles[next] || 'Тема');
    }, true);
  }

    getMode: getSavedMode,
    setMode: setMode,
    cycleMode: cycleMode,
    getEffectiveTheme: function () { return resolveEffectiveTheme(getSavedMode()); },
    applyTheme: applyTheme
  };

<style>

/* =========================================================================
   COFFEE ILLY — ЕДИНЫЙ ИСТОЧНИК ДИЗАЙН-ТОКЕНОВ (css/tokens.css — v86)
   Направление «Спокойный премиум» (§2–§3 ТЗ):
   - Светлая тема по умолчанию (#F7F5F0 бумага, #262522 эспрессо-текст, #795548 акцент)
   - Шкала типографики строго из 7 значений (--fs-display .. --fs-overline)
   - Сетка отступов 4 px (--sp-1 .. --sp-7), 3 радиуса (--r-sm, --r-md, --r-full), 2 тени
   - Обратная совместимость через алиасы (--brew, --muted, --md-sys-*)
   ========================================================================= */

:root,
[data-theme="light"] {
  /* §3.1 Палитра светлой темы (по умолчанию для обоих интерфейсов) */
  --bg: #F5EDE3;
  --surface: #FFFBF8;
  --surface-2: #F1E8E1;
  --line: #E6E1D8;
  --ink: #241B16;
  --ink-2: #65574F; /* Контраст >= 6.3:1 на #FFFFFF и >= 5.7:1 на #F7F5F0 (WCAG AA) */
  --accent: #8B5022;
  --accent-ink: #FFFFFF;
  --accent-soft: #EFE6E1;

  --good: #286B4D;
  --good-soft: #E4F1EB;
  --warn: #805600;
  --warn-soft: #FBF0DA;
  --bad: #BA1A1A;
  --bad-soft: #F8E6E3;
  --info: #4B7AA6;
  --info-soft: #E5EEF6;

  /* §3.2 Шкала типографики (строго 7 размеров в rem) */
  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-d: var(--font);
  --font-m: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;

  --fs-display: 2rem;      /* 32px / 1.15, 700, KPI-числа */
  --lh-display: 1.15;
  --fs-h1: 1.5rem;         /* 24px / 1.25, 700, заголовок экрана */
  --lh-h1: 1.25;
  --fs-h2: 1.125rem;       /* 18px / 1.3, 600, заголовок карточки/секции */
  --lh-h2: 1.3;
  --fs-body-lg: 1rem;      /* 16px / 1.5, 400, основной текст бариста */
  --lh-body-lg: 1.5;
  --fs-body: 0.875rem;     /* 14px / 1.5, 400, основной текст владельца, таблицы */
  --lh-body: 1.5;
  --fs-caption: 0.75rem;   /* 12px / 1.4, 500, подписи, метки */
  --lh-caption: 1.4;
  --fs-overline: 0.6875rem;/* 11px / 1.2, 600, uppercase, letter-spacing .06em */
  --lh-overline: 1.2;

  /* §3.3 Отступы (шаг 4 px) */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 24px;
  --sp-6: 32px;
  --sp-7: 48px;

  /* §3.3 Радиусы (всего три + верх шторки) */
  --r-sm: 8px;
  --r-md: 14px;
  --r-full: 999px;
  --r-sheet: 24px;

  /* §3.3 Тени (всего две) */
  --shadow-1: 0 1px 2px rgb(38 37 34 / .05), 0 8px 24px -12px rgb(38 37 34 / .10);
  --shadow-2: 0 16px 40px -12px rgb(38 37 34 / .22), 0 4px 12px rgb(38 37 34 / .08);

  /* Размеры зон касания и контейнеров (§3.3) */
  --touch-min: 48px;
  --touch-barista-lg: 56px;
  --touch-owner-sm: 36px;
  --header-barista-h: 56px;
  --header-owner-h: 64px;
  --bottom-nav-h: 64px;
  --owner-rail-w: 240px;

  /* Алиасы обратной совместимости для существующих JS-скриптов и тестов */
  --muted: var(--ink-2);
  --brew: var(--accent);
  --crema: var(--accent-soft);
  --cream: var(--surface-2);
  --espresso: var(--ink);
  --chip: var(--surface-2);
  --card: var(--surface);
  --card2: var(--surface-2);
  --shadow: var(--shadow-1);
  --r: var(--r-md);

  --md-sys-color-primary: var(--accent);
  --md-sys-color-on-primary: var(--accent-ink);
  --md-sys-color-primary-container: var(--accent-soft);
  --md-sys-color-on-primary-container: var(--ink);
  --md-sys-color-secondary: var(--ink-2);
  --md-sys-color-secondary-container: var(--surface-2);
  --md-sys-color-on-secondary-container: var(--ink);
  --md-sys-color-background: var(--bg);
  --md-sys-color-on-background: var(--ink);
  --md-sys-color-surface: var(--surface);
  --md-sys-color-on-surface: var(--ink);
  --md-sys-color-surface-variant: var(--surface-2);
  --md-sys-color-on-surface-variant: var(--ink-2);
  --md-sys-color-surface-container-lowest: var(--surface);

  --md-sys-color-warning: var(--warn);
  --md-sys-color-warning-container: var(--warn-soft);
  --md-sys-elevation-1: var(--shadow-1);
  --md-sys-elevation-2: var(--shadow-1);
  --md-sys-elevation-3: var(--shadow-2);
  --md-sys-shape-corner-sm: var(--r-sm);
  --md-sys-shape-corner-md: var(--r-md);
  --md-sys-shape-corner-lg: var(--r-md);

  --md-sys-shape-corner-full: var(--r-full);
}

[data-theme="dark"] {
  /* §3.1 Палитра тёмной темы */

  --surface: #202126;
  --surface-2: #292B30;
  --line: #363840;
  --ink: #F3F1ED;

* { box-sizing: border-box; }
html, body { margin: 0; max-width: 100%; overflow-x: clip; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: var(--fs-body); line-height: 1.45; }

.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }

.field { width: 100%; min-height: 40px; padding: 8px 11px; margin-top: 4px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); font-family: inherit; }
textarea.field { min-height: 84px; }

.next-btn:disabled { opacity: .45; cursor: not-allowed; }
.bnav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 25; display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface); border-top: 1px solid var(--line); height: 64px; backdrop-filter: blur(10px); }

.bnav button.active { color: var(--accent); background: var(--accent-soft); }
.pin-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.pin-key { min-height: 50px; font-size: 1.15rem; font-weight: 700; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); cursor: pointer; }
.thumb-row { display: flex; flex-wrap: wrap; gap: 6px; }
.thumb-row img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); }
</style>

  if (t) { t.resultBy = t.resultBy || {}; t.resultBy[session.name] = 'problem'; }
  const incId = 'INC-' + (102 + st.incidents.length);
  st.incidents.unshift({ id: incId, category: cat, text: title + ': ' + txt, urgency: urg, author: session.name, status: 'Новое', date: new Date().toISOString().slice(0,10) });
  st.tgLog.unshift({ ts: new Date().toLocaleTimeString('ru-RU', {hour:'2-digit',minute:'2-digit'}), msg: '🚨 TG → Админ: [' + incId + '] ' + cat + ' (' + urg + ') — ' + txt });
  problemDraftOpen = false; saveStore(st); showToast('Отправлено администратору в Telegram'); render();
}
function finishCashWizard() {
  const st = getStore();
  const delta = cashDraft.end >= cashDraft.start ? (cashDraft.end - cashDraft.start) : ((1000 - cashDraft.start) + cashDraft.end);
  st.cashReports.unshift({ id: 'CASH-' + (st.cashReports.length + 1), date: new Date().toISOString().slice(0,10), staff: session.name, cash: cashDraft.cash, card: cashDraft.card, checks: cashDraft.checks, counterStart: cashDraft.start, counterEnd: cashDraft.end, counterDelta: delta, status: 'Ожидает проверки' });
  saveStore(st); cashStep = 1; showToast('Кассовый отчёт отправлен!'); render();
}

function render() {
  const st = getStore(), main = document.getElementById('main'), bnav = document.getElementById('bnav'), lbtn = document.getElementById('logoutBtn');
  if (!session) {
    bnav.style.display = 'none'; lbtn.style.display = 'none';
    main.innerHTML = `<div class="card"><h3 style="margin:0 0 6px">Вход бариста</h3><div class="muted">Выберите сотрудника (PIN: <strong>1234</strong>)</div><select id="staffSelect" class="field">${st.staff.map(x=>`<option>${x.name}</option>`).join('')}</select><div id="pinDisp" style="text-align:center;font-size:1.6rem;letter-spacing:8px;margin-top:12px;font-weight:700">○○○○</div><div class="pin-pad">${['1','2','3','4','5','6','7','8','9','C','0','B'].map(k=>`<button class="pin-key" onclick="pressPin('${k}')">${k==='B'?'⌫':k}</button>`).join('')}</div></div>`;
    return;
  }
  bnav.style.display = 'grid'; lbtn.style.display = 'inline-flex';
  document.getElementById('subHdr').textContent = st.location + ' · ' + session.name + ' · ✓ Данные сохранены';

  if (curTab === 'shift') {
    const stages = ['Открытие', 'Лайн Чек 1', 'Лайн Чек 2', 'Закрытие'];
    const stageTasks = st.tasks.filter(t => t.active !== false && t.block === curStage);
    if (taskIdx >= stageTasks.length) taskIdx = Math.max(0, stageTasks.length - 1);
    const t = stageTasks[taskIdx], res = t && t.resultBy ? t.resultBy[session.name] : null, ph = (t && t.photos) || [];
    const win = st.windows.find(w => w.block === curStage) || { block: curStage, start: '07:30', deadline: '22:30' };
    const winState = isWindowOpenNow(win);
    const activeAlertWin = checkActiveWindowAlert(st);
    const lastHnd = st.handovers[0];

    main.innerHTML = `
      ${activeAlertWin ? `<div class="card" style="padding:10px 14px;border-color:var(--accent);background:var(--accent-soft)"><strong>🔔 Открыт чек-лист «${activeAlertWin.block}»</strong> — необходимо пройти до <b>${activeAlertWin.deadline}</b></div>` : ''}
      ${lastHnd ? `<div class="card" style="padding:12px;background:var(--surface-2)"><div class="muted">Передача смены от <strong>${lastHnd.from}</strong> (${lastHnd.ts}):</div><div>${lastHnd.notes}</div></div>` : ''}
      <div class="row-gap" style="justify-content:space-between">
        <select class="field" style="width:auto;margin:0" onchange="curStage=this.value;taskIdx=0;render()">${stages.map(s=>`<option ${curStage===s?'selected':''}>${s}</option>`).join('')}</select>
        <span class="pill ${winState.open ? 'good' : 'bad'}">${winState.status}</span>
      </div>
      ${t ? `
        <div class="focus-card">
          <div class="row-gap" style="justify-content:space-between">
            <span class="muted">Задача ${taskIdx + 1} из ${stageTasks.length}</span>
            <span class="pill ${t.photoReq ? 'warn' : 'good'}">${t.photoReq ? 'Нужно фото' : '✓ Без фото'}</span>
          </div>
          <h2 style="margin:0;font-size:1.2rem">${t.title}</h2>
          <div class="instr-box">${t.instruction}</div>
          ${t.photoReq ? `<button class="btn warn" style="width:100%" onclick="openCameraFor('${t.id}')">Открыть камеру (${ph.length} фото)</button>${ph.length?`<div class="thumb-row">${ph.map(s=>`<img src="${s}">`).join('')}</div>`:''}` : ''}
          <div class="seg-choice">
            <button class="seg-btn ${res==='ok'?'ok-active':''}" onclick="if(!isWindowOpenNow(getStore().windows.find(w=>w.block===curStage)).open){showToast('Окно чек-листа закрыто! Обратитесь к администратору.');return;}markOk('${t.id}')">Всё в норме</button>
            <button class="seg-btn ${res==='problem'||problemDraftOpen?'bad-active':''}" onclick="problemDraftOpen=true;render()">Обнаружена проблема</button>
          </div>
          ${res==='ok'?'<div style="color:var(--good);font-weight:600">✓ Подтверждено</div>':''}
          ${problemDraftOpen ? `<div class="card" style="background:var(--surface-2);padding:12px"><select id="probCat" class="field">${INCIDENT_CATS.map(c=>`<option>${c}</option>`).join('')}</select><select id="probUrg" class="field"><option>Обычная</option><option>Высокая</option><option>Критическая (СТОП)</option></select><textarea id="probText" class="field" placeholder="Опишите проблему..."></textarea><button class="btn bad" style="margin-top:8px;width:100%" onclick="sendTaskProb('${t.id}','${t.title.replace(/'/g,'')}')">Отправить в Telegram</button></div>` : ''}
        </div>
        <button class="next-btn" ${!res?'disabled':''} onclick="if(taskIdx<${stageTasks.length-1}){taskIdx++;problemDraftOpen=false;render();}else showToast('Этап завершён!')">${taskIdx<stageTasks.length-1?'Следующая задача →':'Завершить этап ✓'}</button>
      ` : ''}
    `;
  } else if (curTab === 'cash') {
    const delta = cashDraft.end >= cashDraft.start ? (cashDraft.end - cashDraft.start) : ((1000 - cashDraft.start) + cashDraft.end);
    main.innerHTML = `
      <div class="card">
        <div class="row-gap" style="justify-content:space-between;margin-bottom:8px"><strong>Сдача кассы — Шаг ${cashStep} из 5</strong><span class="pill">руб. ПМР</span></div>
        ${cashStep===1?`<div class="muted">Шаг 1. Сведения</div><p>Сотрудник: <strong>${session.name}</strong> · Точка: <strong>${st.location}</strong></p><button class="btn primary" style="width:100%" onclick="cashStep=2;render()">Далее →</button>`:''}
        ${cashStep===2?`<div class="muted">Шаг 2. Показатели</div><input class="field num" type="number" value="${cashDraft.cash}" onchange="cashDraft.cash=Number(this.value)" placeholder="Наличные"><input class="field num" type="number" value="${cashDraft.card}" onchange="cashDraft.card=Number(this.value)" placeholder="Безнал"><input class="field num" type="number" value="${cashDraft.checks}" onchange="cashDraft.checks=Number(this.value)" placeholder="Чеки"><div class="row-gap"><input class="field num" style="flex:1" type="number" value="${cashDraft.start}" onchange="cashDraft.start=Number(this.value)"><input class="field num" style="flex:1" type="number" value="${cashDraft.end}" onchange="cashDraft.end=Number(this.value)"></div><button class="btn primary" style="width:100%;margin-top:10px" onclick="cashStep=3;render()">Далее к фото →</button>`:''}
        ${cashStep===3?`<div class="muted">Шаг 3. Фотофиксация (только камера)</div><div class="row-gap" style="margin-top:8px"><button class="btn ${cashDraft.photoCounter?'good':'warn'}" style="flex:1" onclick="openCameraFor('cash_counter')">${cashDraft.photoCounter?'✓ Фото счётчика':'📷 Фото счётчика'}</button><button class="btn ${cashDraft.photoZ?'good':'warn'}" style="flex:1" onclick="openCameraFor('cash_z')">${cashDraft.photoZ?'✓ Фото Z-отчёта':'📷 Фото Z-отчёта'}</button></div><button class="btn primary" style="width:100%;margin-top:10px" onclick="cashStep=4;render()">К сводке →</button>`:''}
        ${cashStep===4?`<div class="muted">Шаг 4. Итоговая сводка</div><p>Выручка: <strong>${cashDraft.cash+cashDraft.card} руб. ПМР</strong> · Чеков: <strong>${cashDraft.checks}</strong> · Дельта помолов: <strong>${delta}</strong></p><button class="btn primary" style="width:100%" onclick="cashStep=5;render()">Подтвердить →</button>`:''}
        ${cashStep===5?`<div class="muted">Шаг 5. Отправка отчёта</div><button class="btn good" style="width:100%" onclick="finishCashWizard()">Отправить отчёт смены</button>`:''}
      </div>
    `;
  } else if (curTab === 'knowledge') {
    main.innerHTML = `<div class="card"><h3 style="margin:0 0 8px">Информирование и ТТК</h3>${st.announcements.map(a=>`<div style="padding:8px 0;border-bottom:1px solid var(--line)"><strong>${a.title}</strong><div class="muted">${a.text}</div></div>`).join('')}${st.ttk.map(t=>`<div style="padding:8px 0;border-bottom:1px solid var(--line)"><strong>${t.name} (v${t.version})</strong><div class="muted">${t.ingredients}</div></div>`).join('')}</div>`;
  } else {
    main.innerHTML = `<div class="card"><h3 style="margin:0 0 8px">Эскалация проблемы (8 категорий)</h3><select id="iCat" class="field">${INCIDENT_CATS.map(c=>`<option>${c}</option>`).join('')}</select><textarea id="iText" class="field" placeholder="Описание..."></textarea><button class="btn bad" style="margin-top:8px;width:100%" onclick="const t=document.getElementById('iText').value.trim();if(!t)return;const s=getStore();s.incidents.unshift({id:'INC-'+(102+s.incidents.length),category:document.getElementById('iCat').value,text:t,author:session.name,status:'Новое',date:new Date().toISOString().slice(0,10)});saveStore(s);showToast('Отправлено в Telegram');render()">Отправить</button></div>`;
  }
}
render();
</script>
</body>
</html>
